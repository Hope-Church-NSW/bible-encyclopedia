<section class="page-title"><h1 id="pageTitle">الأنهار في الكتاب المقدس</h1></section>
<nav class="river-grid" id="riverGrid" aria-label="قائمة دراسات الأنهار"></nav>
<article class="study-panel" id="studyPanel" hidden aria-live="polite"><div class="study-heading"><div class="study-heading-top"><div><h2 id="studyTitle"></h2><p id="studySubtitle"></p></div></div></div><div class="study-body"><div class="sections" id="studyBody"></div><aside class="map-column" id="mapColumn"></aside></div></article><p class="page-title intro-bottom">خريطة دراسية تربط بين الجغرافيا والنص: من أنهار عدن، إلى حدود الوعد والعبور، ثم إلى أنهار النبوة والسبي. التحديد الجغرافي يُعرض بدرجته ولا يُقدَّم الاحتمال كيقين.</p>
</main><footer class="footer-note">موسوعة الكتاب المقدس — دراسة جغرافية ولاهوتية موثقة</footer>
<script>
const maps={
"mesopotamia":`<figure class="map-card"><figcaption>خريطة موضعية: الهلال الخصيب</figcaption><svg viewBox="0 0 420 260" role="img" aria-label="مخطط موضعي للفرات ودجلة"><path fill="#c9d5c9" d="M0 0h420v260H0z"/><path fill="#e8dfcc" d="M35 15h345v220H35z"/><path fill="none" stroke="#1593a2" stroke-width="8" d="M118 20c-12 44 26 59 18 91-10 28-52 34-34 110M205 18c29 38 7 66 31 91 29 30 3 67 34 119"/><path fill="none" stroke="#d6b34e" stroke-width="2" stroke-dasharray="5 5" d="M55 43h300M45 197h320"/><text x="78" y="28" fill="#263b3d" font-size="14">الأناضول</text><text x="79" y="125" fill="#263b3d" font-size="14">الفرات</text><text x="238" y="135" fill="#263b3d" font-size="14">دجلة</text><text x="160" y="222" fill="#263b3d" font-size="13">الخليج العربي</text></svg><small>مخطط تعليمي غير مقياس: يوضح الاتجاه العام ولا يغني عن الأطالس المتخصصة.</small></figure>`,
"levant":`<figure class="map-card"><figcaption>خريطة موضعية: الأردن وبلاد الشام</figcaption><svg viewBox="0 0 420 260" role="img" aria-label="مخطط موضعي للأردن والأنهار المحيطة"><path fill="#c9d5c9" d="M0 0h420v260H0z"/><path fill="#e8dfcc" d="M55 8h300v240H55z"/><path fill="#b9d9d5" d="M190 5c-15 46 8 71-2 105-9 35 9 76-13 142h38c13-48-8-78 5-117 10-35-9-79 8-130z"/><path fill="none" stroke="#1593a2" stroke-width="6" d="M212 12c-14 42-4 67-12 105-6 33 8 75-3 128M214 104c-54 9-83 30-114 67M193 127c48 15 77 30 99 72"/><text x="217" y="55" fill="#263b3d" font-size="14">الأردن</text><text x="229" y="102" fill="#263b3d" font-size="13">الأردن</text><text x="83" y="177" fill="#263b3d" font-size="13">يبوق</text><text x="276" y="211" fill="#263b3d" font-size="13">أرنون</text><text x="176" y="244" fill="#263b3d" font-size="13">البحر الميت</text></svg><small>موضع الأنهار الصغيرة تقريبي؛ تُذكر درجة اليقين في كل مدخل.</small></figure>`,
"eden":`<figure class="map-card"><figcaption>مخطط الأنهار الأربعة في تكوين 2</figcaption><svg viewBox="0 0 420 260" role="img" aria-label="مخطط أدبي للأنهار الأربعة في عدن"><path fill="#d5e2d2" d="M0 0h420v260H0z"/><circle cx="210" cy="125" r="42" fill="#b9dfc0" stroke="#6b9f79" stroke-width="3"/><path fill="none" stroke="#1593a2" stroke-width="7" d="M210 125C130 77 79 53 28 31M210 125C132 130 78 151 25 205M210 125c80-48 131-70 182-92M210 125c85 28 137 58 183 105"/><text x="188" y="130" fill="#263b3d" font-size="14">عدن</text><text x="42" y="29" fill="#263b3d" font-size="13">فيشون</text><text x="39" y="222" fill="#263b3d" font-size="13">جيحون</text><text x="324" y="29" fill="#263b3d" font-size="13">دجلة</text><text x="332" y="231" fill="#263b3d" font-size="13">الفرات</text></svg><small>هذا تمثيل لبنية النص في تكوين 2، وليس ادعاءً بتحديد معاصر للنهرين المجهولين.</small></figure>`,
"egypt":`<figure class="map-card"><figcaption>خريطة موضعية: النيل ومصر</figcaption><svg viewBox="0 0 420 260" role="img" aria-label="مخطط موضعي للنيل ومصر"><path fill="#d8dfcc" d="M0 0h420v260H0z"/><path fill="#e8dfcc" d="M70 10h260v240H70z"/><path fill="#a7d7d1" d="M183 0h45c-15 45 12 80-7 117-17 31 6 81-20 143h-42c25-60-1-95 20-131 16-29-12-79 4-129z"/><path fill="none" stroke="#1593a2" stroke-width="8" d="M205 0c-13 47 14 80-6 119-17 35 5 78-18 135"/><text x="236" y="111" fill="#263b3d" font-size="15">النيل</text><text x="105" y="38" fill="#263b3d" font-size="14">مصر العليا</text><text x="250" y="229" fill="#263b3d" font-size="14">الدلتا</text><text x="278" y="252" fill="#263b3d" font-size="13">البحر المتوسط</text></svg><small>مخطط تعليمي لمسار النيل داخل مصر القديمة والحديثة.</small></figure>`};
const rivers=[
{id:"pishon",name:"فيشون",script:"פִּישׁוֹן",group:"أنهار عدن",place:"تكوين 2 — التحديد غير محسوم",map:"eden",sections:[["الاسم والمعنى","فيشون (פִּישׁוֹן؛ Pishon). يُقترح ربطه بفكرة الانتشار أو التدفق، لكن الاشتقاق ليس يقينيًا، لذلك لا يُبنى عليه استنتاج قطعي."],["الموضع الكتابي","يحيط بكل أرض حويلة حيث يوجد الذهب والبديليوم وحجر الجزع. لا يحدد النص موقعًا حديثًا يمكن إثباته يقينًا."],["الأحداث والأشخاص","يظهر في وصف عدن وحده؛ والأشخاص المرتبطون بالسياق هم آدم وحواء ضمن رواية الخلق. الشاهد: تكوين 2:10-12."],["القراءة التفسيرية","يقدم النص الماء في سياق الحياة والوفرة، لكن هذا المعنى اللاهوتي لا يحسم الهوية الجغرافية. المقارنات مع كارون أو غيره تبقى اقتراحات تاريخية لا حقائق مثبتة."]]},
{id:"gihon",name:"جيحون",script:"גִּיחוֹן",group:"أنهار عدن",place:"تكوين 2 — التحديد غير محسوم",map:"eden",sections:[["الاسم والمعنى","جيحون (גִּיחוֹן؛ Gihon) اسم يرتبط لغويًا بفكرة الاندفاع أو التفجر، مع بقاء الاشتقاق التفسيري غير حاسم."],["الموضع الكتابي","يحيط بكل أرض كوش في تكوين 2:13. لا يصح مساواته تلقائيًا بعين جيحون في أورشليم؛ فالنصان يصفان موضعين في سياقين مختلفين."],["الأحداث والأشخاص","لا يورد الكتاب حدثًا مستقلًا عند نهر جيحون؛ يظهر في وصف عدن، ضمن سياق آدم وحواء. الشاهد: تكوين 2:10، 13."],["القراءة التفسيرية","تسمح صورة النهر المتدفق بقراءة لاهوتية عن الحياة التي يمنحها الله، لكنها لا تتحول إلى دليل على تحديد النهر المعاصر."]]},
{id:"tigris",name:"دجلة",script:"חִדֶּקֶל",group:"أنهار عدن",place:"Tigris — مؤكد جغرافيًا",map:"mesopotamia",sections:[["الاسم والمعنى","حِدِّقِل (חִדֶּקֶל؛ Hiddekel) هو الاسم العبري لدجلة. يُربط تقليديًا بالسرعة أو الاندفاع، مع الحذر من جعل الاشتقاق أساسًا وحيدًا للتفسير."],["الموضع الكتابي","يصفه تكوين 2:14 بأنه الجاري شرق أشور، ويصفه دانيال 10:4 بالنهر العظيم دجلة. هذان الشاهدان يربطانه ببلاد الرافدين وأشور."],["الأحداث والأشخاص","يرد في بنية أنهار عدن، ثم عند دانيال في سياق الرؤيا. الشواهد: تكوين 2:10-14؛ دانيال 10:4."],["القراءة التفسيرية","تُظهر عودة دجلة في دانيال امتداد الجغرافيا الكتابية من الخلق إلى زمن السبي والإعلان النبوي، دون افتراض أن المكان وحده يفسر الرؤيا."]]},
{id:"euphrates",name:"الفرات",script:"פְּרָת",group:"أنهار الوعد والحدود",place:"Euphrates — مؤكد جغرافيًا",map:"mesopotamia",sections:[["الاسم والمعنى","الفرات (פְּרָת؛ Pĕrāth؛ الأكادية Purattu) من الأنهار الكبرى في الشرق الأدنى القديم."],["الموضع الكتابي","يظهر في تكوين 2، ويحدد تكوين 15:18 مدى أرض الموعد في الوعد لإبراهيم. وترد عبارة عبر النهر في سياق المنطقة الواقعة وراء الفرات. الشواهد: تكوين 2:14؛ 15:18؛ يشوع 24:2، 14."],["الأحداث والأشخاص","يرتبط بإبراهيم وبحدود مملكة داود، وبكركميش وبابل في النصوص التاريخية والنبوية، ثم برؤى سفر الرؤيا. الشواهد: 2 صموئيل 8:3؛ 2 ملوك 23:29؛ إرميا 46؛ 51:63-64؛ رؤيا 9:14؛ 16:12."],["القراءة التفسيرية","يحمل الفرات في السرد وظائف جغرافية وسياسية ونبوية مختلفة. لذلك لا يصح اختزاله في رمز واحد؛ فهو حد جغرافي حقيقي، ويأخذ دلالته النبوية من سياق كل سفر."]]},
{id:"jordan",name:"الأردن",script:"יַרְדֵּן",group:"أنهار الوعد والحدود",place:"Jordan — مؤكد جغرافيًا",map:"levant",sections:[["الاسم والمعنى","الأردن (יַרְדֵּן؛ Yarden) يرتبط عادة بالجذر ירד بمعنى نزل أو هبط، وهو وصف ينسجم مع انحدار مجراه."],["الموضع الكتابي","يمتد في منطقة فلسطين والأردن ويصب في البحر الميت. يرد في قصة أرض كثيرة المياه، وفي عبور إسرائيل، وفي خدمتي إيليا وأليشع ويوحنا المعمدان."],["الأحداث والأشخاص","اختيار لوط، عبور يشوع، عبور إيليا وأليشع، شفاء نعمان، معمودية يوحنا ومعمودية يسوع. الشواهد: تكوين 13:10؛ يشوع 3؛ 2 ملوك 2:8-14؛ 5:10-14؛ متى 3:13-17."],["القراءة التفسيرية","يجتمع فيه العبور والتطهير وبداية الخدمة، لكن المعنى اللاهوتي يبقى مستندًا إلى كل سياق نصي: عبور الشعب ليس هو شفاء نعمان، ومعمودية يسوع ليست تكرارًا آليًا لأي منهما."]]},
{id:"arnon",name:"أرنون",script:"אַרְנוֹן",group:"أنهار الوعد والحدود",place:"وادي الموجب — ترجيح قوي",map:"levant",sections:[["الاسم والمعنى","أرنون (אַרְנוֹן؛ Arnon) اسم مجرى مائي كبير شرق البحر الميت، ويرتبط في المقترحات اللغوية بالسيل أو الجريان المندفع."],["الموضع الكتابي","يظهر حدًا بين موآب والأموريين، ثم حدًا لأرض رأوبين. الشواهد: عدد 21:13-15؛ تثنية 2:24؛ 3:12."],["الأحداث والأشخاص","عبره إسرائيل في طريقه إلى شرق الأردن في زمن موسى، وترتبط به أغنية الانتصار في عدد 21. الأشخاص هم موسى وإسرائيل وسيحون في سياق النص."],["القراءة التفسيرية","تكشف حدوده أن الوعد في الكتاب مرتبط بتعيين مسؤوليات وتخوم، لا بمجرد امتلاك مفتوح بلا ضوابط."]]},
{id:"jabbok",name:"يبوق",script:"יַבֹּק",group:"أنهار الوعد والحدود",place:"نهر الزرقاء — ترجيح قوي",map:"levant",sections:[["الاسم والمعنى","يبوق (יַבֹּק؛ Jabbok) اسم يرتبط غالبًا بالجريان أو التدفق، مع بقاء التفصيل الاشتقاقي غير يقيني."],["الموضع الكتابي","مجرى في شرق الأردن، ويظهر في تكوين 32 وفي وصف حدود سيحون وعمون. التحديد الحديث بنهر الزرقاء هو الرأي الراجح."],["الأحداث والأشخاص","عبر يعقوب النهر ليلًا، وبقي وحده وصارع حتى الفجر وتلقى اسم إسرائيل. الشاهد: تكوين 32:22-32. كما يرد في عدد 21:24 وتثنية 2:37."],["القراءة التفسيرية","عبور يبوق حدث جغرافي وصراع شخصي في آن واحد، لكن تغيير يعقوب إلى إسرائيل هو ما يثبته النص، لا قاعدة عامة عن كل عبور روحي."]]},
{id:"zered",name:"زارد",script:"זֶרֶד",group:"أنهار الوعد والحدود",place:"وادي الحسا — ترجيح",map:"levant",sections:[["الاسم والمعنى","زارد (זֶרֶד؛ Zered) يُقترح أن يرتبط بمجرى أو سيل الصفصاف، دون يقين اشتقاقي كامل."],["الموضع الكتابي","يذكره سفر العدد والتثنية في مسار إسرائيل شرق الأردن. يطابقه عدد من الجغرافيين بوادي الحسا، لكن المطابقة ليست مطلقة."],["الأحداث والأشخاص","عبره بنو إسرائيل بعد مرحلة التيه، في سياق انتقال الجيل. الشواهد: عدد 21:12-13؛ تثنية 2:13-14."],["القراءة التفسيرية","أهمية زارد في النص زمنية بقدر ما هي مكانية: فهو علامة على عبور مرحلة تاريخية، لا برهان مستقل على حساب مدة التيه."]]},
{id:"nile",name:"النيل",script:"יְאֹר",group:"أنهار الملوك والأنبياء",place:"Nile — مؤكد جغرافيًا",map:"egypt",sections:[["الاسم والمعنى","يְאֹר (Ye'or) لفظ عبري ذو صلة مصرية، ويُستعمل للنيل والمجاري المرتبطة به. الاسم الحديث هو Nile / النيل."],["الموضع الكتابي","النيل هو شريان مصر الزراعي والحضاري، وتدور حوله رواية موسى في خروج 1-7، كما تستخدمه النبوات في الحديث عن مصر."],["الأحداث والأشخاص","أمر فرعون بطرح الأولاد، ووُضع موسى في سفط على الماء، ثم تحولت مياه النيل إلى دم في الضربة الأولى. الشواهد: خروج 1:22؛ 2:3-10؛ 7:14-25؛ إشعياء 19؛ حزقيال 29."],["القراءة التفسيرية","يظهر صراع الخروج في قلب مركز الحياة المصرية، فينقلب النهر الذي اتصل بسلطة الموت إلى جزء من طريق حفظ موسى؛ وهذه قراءة سردية تستند إلى ترتيب الأحداث لا إلى أسطورة عن النهر."]]},
{id:"kishon",name:"قيشون",script:"קִישׁוֹן",group:"أنهار الملوك والأنبياء",place:"نهر المقطع — ترجيح قوي",map:"levant",sections:[["الاسم والمعنى","قيشون (קִישׁוֹן؛ Qishon) نهر سهل يزرعيل المتجه إلى خليج عكا. يرتبط اشتقاقه المقترح بفكرة الالتواء أو التعرج."],["الموضع الكتابي","يرد في نشيد دبورة بوصفه مجرى المعركة، ثم في قصة إيليا بعد الكرمل. الشواهد: قضاة 4:7؛ 5:21؛ 1 ملوك 18:40."],["الأحداث والأشخاص","جرف قيشون جيش سيسرا في رواية دبورة وباراق، ثم أُخذ أنبياء البعل إليه بعد مواجهة إيليا. لا يثبت النص أن الماء وحده سبب الانتصار."],["القراءة التفسيرية","تظهر الطبيعة هنا داخل فعل الدينونة والنصر، لكن لا يجوز نقل أحكام النص على جماعات قديمة إلى عنف ديني معاصر."]]},
{id:"cherith",name:"كريث",script:"כְּרִית",group:"أنهار الملوك والأنبياء",place:"التحديد غير مؤكد",map:"levant",sections:[["الاسم والمعنى","كريث (כְּרִית؛ Kerith/Cherith) يرتبط بالجذر الذي يحمل معنى القطع أو الفصل، لكن ذلك لا يحسم موضعه الحديث."],["الموضع الكتابي","يأمر الرب إيليا أن يختبئ عند نهر كريث شرق الأردن، دون وصف جغرافي يكفي لتحديده يقينًا. الشاهد: 1 ملوك 17:2-7."],["الأحداث والأشخاص","شرب إيليا من النهر وعالته الغربان، ثم جف النهر بسبب الجفاف، فأُرسل إلى صرفة. الشخص الرئيس هو إيليا."],["القراءة التفسيرية","يؤكد السرد استمرار تدبير الله مع تغيّر الوسيلة: جفاف كريث ليس إعلانًا عن غياب الله، بل نقطة انتقال في مهمة إيليا."]]},
{id:"besor",name:"بصور",script:"בְּשׂוֹר",group:"أنهار الملوك والأنبياء",place:"وادي غزة — ترجيح",map:"levant",sections:[["الاسم والمعنى","بصور (בְּשׂוֹר؛ Besor) اسم وادٍ أو مجرى في جنوب يهوذا. ربطه بجذر البشارة اقتراح لغوي لا يكفي وحده لتفسير القصة."],["الموضع الكتابي","يظهر في مطاردة داود للعماليق بعد صقلغ. التحديد الحديث بوادي غزة ترجيح جغرافي، وليس تصريحًا كتابيًا مباشرًا."],["الأحداث والأشخاص","بقي 200 رجل عند النهر من شدة التعب، وتابع 400، ثم قرر داود أن يتساوى نصيب القاعدين مع نصيب المقاتلين. الشاهد: 1 صموئيل 30:9-24."],["القراءة التفسيرية","تؤسس القصة مبدأ المشاركة في المسؤولية والنعمة، ولا تختزل قيمة الإنسان في قدرته البدنية على مواصلة القتال."]]},
{id:"abana",name:"أبانة",script:"אֲבָנָה",group:"أنهار دمشق والسبي",place:"بردى — ترجيح قوي",map:"levant",sections:[["الاسم والمعنى","أبانة (אֲבָנָה؛ Abana) أحد نهري دمشق في 2 ملوك 5. ترتبط بعض المقترحات بمعنى حجري أو صخري، مع اختلاف القراءات."],["الموضع الكتابي","يربطه النص بدمشق، ويذكره نعمان في احتجاجه على بساطة أمر أليشع. يطابقه الباحثون غالبًا بنهر بردى."],["الأحداث والأشخاص","قارن نعمان أبانة وفرفر بمياه إسرائيل قبل أن يطيع ويغتسل في الأردن. الشاهد: 2 ملوك 5:1-14. الأشخاص: نعمان وأليشع وجيحزي وخادمة نعمان."],["القراءة التفسيرية","لا يجعل النص أبانة ماءً رديئًا؛ المفارقة أن جودة الماء الطبيعية لم تكن معيار المعجزة، بل طاعة كلمة الله."]]},
{id:"parpar",name:"فرفر",script:"פַּרְפַּר",group:"أنهار دمشق والسبي",place:"العوج — ترجيح أقل",map:"levant",sections:[["الاسم والمعنى","فرفر (פַּרְפַּר؛ Pharpar) النهر الثاني المذكور في دمشق. التعيين الحديث بنهر العوج شائع، لكنه أقل يقينًا من تعيين أبانة."],["الموضع الكتابي","لا يرد فرفر خارج احتجاج نعمان في قصة الشفاء، ولذلك يجب إبقاء المعلومات الجغرافية في حدها النصي."],["الأحداث والأشخاص","ذكره نعمان مع أبانة باعتباره ماءً أفضل من مياه إسرائيل، ثم أطاع أمر أليشع فبرئ. الشاهد: 2 ملوك 5:10-14."],["القراءة التفسيرية","توضح القصة الفرق بين توقعات الإنسان وطريقة الله في العمل، دون تحويلها إلى حكم على قيمة الأنهار أو الشعوب."]]},
{id:"khabur",name:"الخابور",script:"חָבוֹר",group:"أنهار دمشق والسبي",place:"Khabur — مؤكد جغرافيًا",map:"mesopotamia",sections:[["الاسم والمعنى","الخابور (חָבוֹר؛ Habor/Khabur) رافد للفرات في شمال بلاد الرافدين، واسم جغرافي معروف في المنطقة القديمة."],["الموضع الكتابي","يرده 2 ملوك 17:6 ضمن وجهات السبي الآشوري: حَلَح وحابور نهر جوزان ومدن مادي."],["الأحداث والأشخاص","نُقل بنو إسرائيل إلى هذه المناطق في سياق سقوط السامرة وسياسة الإمبراطورية الآشورية. الشاهد: 2 ملوك 17:6؛ 18:11؛ 1 أخبار 5:26."],["القراءة التفسيرية","يظهر النهر هنا طريقًا للنفي لا رمزًا رومانسيًا للماء؛ وتفسر وظيفته داخل سياسة السبي التي اقتلعت السكان وأعادت توزيعهم."]]},
{id:"chebar",name:"كبار",script:"נְהַר־כְּבָר",group:"أنهار دمشق والسبي",place:"قناة بابلية — ترجيح",map:"mesopotamia",sections:[["الاسم والمعنى","كبار (נְהַר־כְּבָר؛ Chebar) مجرى أو قناة في أرض بابل. يقترح البحث المسماري صلته بقناة nāru kabari، لكن موضعها التفصيلي يبقى موضع نقاش."],["الموضع الكتابي","كان حزقيال بين المسبيين عند نهر كبار، وهناك رأى رؤى مجد الرب. الشواهد: حزقيال 1:1-3؛ 3:23؛ 10:15؛ 43:3."],["الأحداث والأشخاص","حزقيال هو الشخصية المحورية، ومعه المسبيون اليهود. لا يصف النص النهر كموضع عبادة، بل كجزء من واقع السبي الذي جاء فيه الإعلان."],["القراءة التفسيرية","قوة المدخل في أن حضور الله لا يُحصر جغرافيًا في أورشليم؛ وهذه خلاصة لاهوتية مستندة إلى مشهد الرؤيا، لا إلغاء لأهمية الهيكل في سفر حزقيال."]]}
];
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const grid=document.getElementById('riverGrid'); const panel=document.getElementById('studyPanel'); const body=document.getElementById('studyBody'); const title=document.getElementById('studyTitle'); const subtitle=document.getElementById('studySubtitle'); const mapColumn=document.getElementById('mapColumn');
let current=null;
[...new Set(rivers.map(r=>r.group))].forEach(group=>{const label=document.createElement('div');label.className='group-label';label.textContent=group;grid.appendChild(label);rivers.filter(r=>r.group===group).forEach((river,index)=>{const card=document.createElement('button');card.className='river-card';card.type='button';card.dataset.id=river.id;card.innerHTML=`<div class="river-mark">≈</div><div class="river-name">${esc(river.name)}</div><div class="river-place">${esc(river.place)}</div>`;card.addEventListener('click',()=>openRiver(river));grid.appendChild(card)})});
function openRiver(river){current=river;grid.hidden=true;panel.hidden=false;title.textContent=`${river.name} — ${river.script}`;subtitle.textContent=river.place;body.innerHTML=river.sections.map(section=>`<section class="section"><h3>${esc(section[0])}</h3><p>${esc(section[1])}</p></section>`).join('')+`<div class="sources"><strong>الشواهد والمراجع:</strong> ${esc(river.sections.map(s=>s[1]).join(' ').match(/الشواهد?:[^.]+\.|الشاهد:[^.]+\./g)?.join(' ')||'تكوين 2؛ والسياق الكتابي المذكور في الدراسة.') }<br><strong>مراجع جغرافية عامة:</strong> Denis Baly, <i>The Geography of the Bible</i>; Yohanan Aharoni, <i>The Land of the Bible</i>; <i>International Standard Bible Encyclopedia</i>، مداخل الأنهار ذات الصلة. تُعرض المطابقات الحديثة بدرجة اليقين المذكورة ولا تُعامل الخريطة التعليمية كمصدر مستقل.</div>`;mapColumn.innerHTML=maps[river.map];window.scrollTo({top:panel.offsetTop-105,behavior:'smooth'});document.querySelectorAll('.river-card').forEach(card=>card.classList.toggle('active',card.dataset.id===river.id))}
const openRiverWithStaticMap=openRiver;
openRiver=function(river){openRiverWithStaticMap(river);renderBiblicalMap(mapColumn,river.map,river.name)};
document.querySelectorAll('.river-card').forEach(card=>card.addEventListener('click',()=>{document.getElementById('pageTitle').hidden=true}));
document.getElementById('headerRiversBack').addEventListener('click',()=>{panel.hidden=true;grid.hidden=false;document.getElementById('pageTitle').hidden=false;document.querySelectorAll('.river-card').forEach(card=>card.classList.remove('active'));window.scrollTo({top:grid.offsetTop-105,behavior:'smooth'})});
</script>
