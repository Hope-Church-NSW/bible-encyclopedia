<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شخصيات الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>
:root{
    --blue-1:#04111f;
    --blue-2:#071c31;
    --blue-3:#0d2d4a;
    --blue-4:#12446d;
    --gold:#d4af37;
    --gold-light:#f4dc79;
    --gold-dark:#806018;
    --white:#f8fbff;
    --muted:#b7c7d6;
    --border:rgba(212,175,55,.34);
    --shadow:0 22px 55px rgba(0,0,0,.52);
}

*{box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
    margin:0;
    min-height:100vh;
    color:var(--white);
    font-family:"Noto Naskh Arabic","Amiri",Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(23,75,120,.75),transparent 45%),
        radial-gradient(circle at 15% 80%,rgba(13,56,93,.35),transparent 38%),
        linear-gradient(145deg,var(--blue-1),var(--blue-2) 55%,#020a13);
}

.top-frame{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    border-bottom:1px solid rgba(212,175,55,.42);
    background:linear-gradient(180deg,rgba(7,29,49,.98),rgba(3,15,27,.98));
    box-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.04);
}

.topbar{
    max-width:1400px;
    min-height:92px;
    margin:auto;
    padding:10px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.back-button{
    min-width:170px;
    height:55px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border:1px solid rgba(212,175,55,.65);
    border-radius:14px;
    color:#fff;
    text-decoration:none;
    background:linear-gradient(145deg,#183c5d,#071a2d);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 17px rgba(0,0,0,.48);
    font-size:17px;
    font-weight:900;
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}

.back-button:hover{
    transform:translateY(-3px);
    border-color:var(--gold-light);
    box-shadow:0 10px 24px rgba(0,0,0,.62),0 0 20px rgba(212,175,55,.15);
}

.back-icon{
    color:var(--gold-light);
    font-size:27px;
    line-height:1;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-logo{
    width:72px;
    height:72px;
    object-fit:contain;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.82));
    animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0) rotateY(0deg);}
    50%{transform:translateY(-4px) rotateY(8deg);}
}

.brand-name{
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
    background:linear-gradient(180deg,#fff4ae,var(--gold-light) 35%,var(--gold) 68%,var(--gold-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 0 var(--gold-dark),0 4px 6px rgba(0,0,0,.9);
}

main{
    max-width:1400px;
    margin:auto;
    padding:42px 25px 70px;
}

.page-title{
    padding:0;
    margin-bottom:42px;
    text-align:center;
}

.page-title h1{
    margin:0;
    color:var(--gold-light);
    font-size:clamp(28px,5vw,42px);
    font-weight:900;
    text-shadow:0 3px 6px rgba(0,0,0,.75);
}

.page-title p{
    margin:9px 0 0;
    color:var(--muted);
    font-size:17px;
    line-height:1.8;
}

.characters-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:20px;
    align-items:stretch;
    margin-bottom:42px;
}

.character-card{
    position:relative;
    min-height:190px;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
    border:1px solid rgba(212,175,55,.28);
    border-radius:20px;
    color:#fff;
    text-decoration:none;
    background:linear-gradient(145deg,rgba(17,52,81,.98),rgba(5,22,38,.99));
    box-shadow:0 10px 25px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    cursor:pointer;
    transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease,background .28s ease;
}

.character-card::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    left:0;
    height:4px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.65;
}

.character-card::after{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:rgba(212,175,55,.06);
    top:-45px;
    left:-45px;
    pointer-events:none;
}

.character-card:hover,
.character-card.active{
    transform:translateY(-8px) scale(1.025);
    border-color:var(--gold-light);
    background:linear-gradient(145deg,rgba(20,82,126,.98),rgba(6,26,44,.99));
    box-shadow:0 20px 40px rgba(0,0,0,.62),0 0 24px rgba(212,175,55,.14);
}

.character-number{
    width:86px;
    height:86px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    border-radius:22px;
    color:var(--gold-light);
    background:linear-gradient(145deg,#1a4b73,#071a2d);
    border:1px solid rgba(212,175,55,.68);
    font-size:36px;
    font-weight:900;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.13),0 9px 20px rgba(0,0,0,.52);
    transition:transform .28s ease,box-shadow .28s ease;
}

.character-card:hover .character-number,
.character-card.active .character-number{
    transform:scale(1.08);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.15),0 12px 25px rgba(0,0,0,.62),0 0 20px rgba(212,175,55,.16);
}

.character-name{
    color:#fff6bf;
    font-size:19px;
    font-weight:900;
    line-height:1.35;
    position:relative;
    z-index:2;
}

.character-subtitle{
    margin-top:7px;
    padding:0 12px;
    color:#dce7f2;
    font-size:14px;
    line-height:1.7;
    position:relative;
    z-index:2;
}

.study-panel{
    border:1px solid rgba(212,175,55,.36);
    border-radius:24px;
    background:linear-gradient(145deg,rgba(6,26,44,.98),rgba(2,9,17,.99));
    box-shadow:var(--shadow);
    overflow:hidden;
}

.study-panel[hidden],
.page-title[hidden],
.characters-grid[hidden]{
    display:none;
}

.study-heading{
    padding:28px 28px 20px;
    border-bottom:1px solid rgba(212,175,55,.24);
    background:linear-gradient(145deg,rgba(13,56,93,.92),rgba(4,23,39,.97));
}

.study-heading-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:18px;
}

.character-back{
    min-width:172px;
    height:50px;
    padding:0 16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:1px solid rgba(212,175,55,.68);
    border-radius:14px;
    color:#fff;
    background:linear-gradient(145deg,#183c5d,#071a2d);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 17px rgba(0,0,0,.48);
    font:inherit;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}

.character-back:hover{
    transform:translateY(-3px);
    border-color:var(--gold-light);
    box-shadow:0 10px 24px rgba(0,0,0,.62),0 0 20px rgba(212,175,55,.15);
}

.character-back span:first-child{
    color:var(--gold-light);
    font-size:24px;
    line-height:1;
}

.study-heading h2{
    margin:0;
    color:var(--gold-light);
    font-size:clamp(28px,4vw,40px);
    font-weight:900;
}

.study-heading p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:16px;
    line-height:1.8;
}

.study-body{
    padding:26px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

.section-card{
    padding:20px;
    border:1px solid rgba(212,175,55,.23);
    border-radius:18px;
    background:rgba(8,41,67,.56);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

.section-card.wide{
    grid-column:1 / -1;
}

.section-card h3{
    margin:0 0 12px;
    color:var(--gold-light);
    font-size:21px;
    font-weight:900;
}

.section-card p,
.section-card li{
    color:#eef6ff;
    font-size:16px;
    line-height:2;
}

.section-card p{
    margin:0;
}

.section-card ul,
.section-card ol{
    margin:0;
    padding-right:22px;
}

.section-card li + li{
    margin-top:6px;
}

.detail-list{
    display:grid;
    gap:14px;
}

.detail-point{
    padding:15px 16px;
    border:1px solid rgba(212,175,55,.20);
    border-radius:15px;
    background:rgba(3,16,29,.38);
}

.detail-point h4{
    margin:0 0 8px;
    color:#fff6bf;
    font-size:18px;
    font-weight:900;
}

.detail-point p{
    margin:4px 0 0;
}

.detail-label{
    color:var(--gold-light);
    font-weight:900;
}

.footer-note{
    padding:20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

@media(max-width:1100px){
    .characters-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
}

@media(max-width:850px){
    .topbar{min-height:82px;}
    .brand-name{font-size:17px;}
    .brand-logo{width:56px;height:56px;}
    .back-button{min-width:150px;height:50px;font-size:15px;}
    .characters-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .study-body{grid-template-columns:1fr;}
}

@media(max-width:560px){
    main{padding:28px 12px 60px;}
    .topbar{padding:9px 12px;gap:10px;}
    .brand{gap:8px;}
    .brand-name{font-size:13px;}
    .brand-logo{width:46px;height:46px;}
    .back-button{min-width:auto;height:44px;padding:0 12px;font-size:13px;}
    .back-icon{font-size:22px;}
    .characters-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
    .character-card{min-height:116px;padding:14px 9px;}
    .character-name{font-size:16px;}
    .study-heading,.study-body{padding:18px;}
    .study-heading-top{flex-direction:column;}
    .character-back{width:100%;}
    .section-card{padding:16px;}
}
</style>
<link rel="stylesheet" href="assets/project-header-runtime.css">
</head>

<body>
<header class="top-frame">
    <div class="topbar">
        <a href="studies.html" class="back-button" title="العودة إلى الدراسات الكتابية" aria-label="العودة إلى الدراسات الكتابية">
            <span class="back-icon">←</span>
            <span>الدراسات الكتابية</span>
        </a>

        <div class="brand">
            <div class="brand-name">موسوعة الكتاب المقدس</div>
            <img src="assets/logo.png" class="brand-logo" alt="كنيسة رجاء الأمم سيدني">
        </div>
    </div>
</header>

<main>
    <section class="page-title" id="pageTitle">
        <h1>شخصيات الكتاب المقدس</h1>
        <p>ثلاثون دراسة شخصية مرتبة بحسب الاسم والنسب والأحداث والأهمية اللاهوتية</p>
    </section>

    <nav class="characters-grid" id="charactersGrid" aria-label="قائمة شخصيات الكتاب المقدس"></nav>

    <article class="study-panel" id="studyPanel" aria-live="polite" hidden>
        <div class="study-heading">
            <div class="study-heading-top">
                <button class="character-back" type="button" id="backToCharacters" aria-label="العودة إلى شخصيات الكتاب المقدس">
                    <span>→</span>
                    <span>شخصيات كتابية</span>
                </button>
                <div>
                    <h2 id="studyTitle"></h2>
                    <p id="studySubtitle"></p>
                </div>
            </div>
        </div>
        <div class="study-body" id="studyBody"></div>
    </article>
</main>

<footer class="footer-note">موسوعة الكتاب المقدس — كنيسة رجاء الأمم سيدني</footer>

<script>
const characters = [
    {
        id:"adam",
        name:"آدم",
        subtitle:"أول إنسان بحسب سفر التكوين",
        sections:[
            ["الاسم","آدم، وهو أول إنسان بحسب رواية سفر التكوين. ويرتبط الاسم في النص بفكرة الإنسان والأرض التي أُخذ منها. التوثيق: تكوين 1:26-27؛ 2:7؛ 5:1-5."],
            ["النسب","آدم ليس له نسب بشري سابق؛ فالكتاب يقدمه باعتباره أول إنسان خلقه الله، وخلق حواء من جنبه. التوثيق: تكوين 2:7، 18-23."],
            ["تاريخ الميلاد والوفاة","لا يوجد تاريخ تقويمي لميلاد آدم. ويذكر الكتاب أنه عاش 930 سنة ثم مات. التوثيق: تكوين 5:5."],
            ["مكان الولادة","لا ينطبق عليه مفهوم الولادة البشرية؛ فقد خُلق من تراب الأرض ونفخ الله في أنفه نسمة حياة. التوثيق: تكوين 2:7."],
            ["الأشخاص المعاصرون","حواء، قايين، هابيل، شيث، وأبناؤه وبناته، والأجيال الأولى من البشر. التوثيق: تكوين 3-5."],
            ["أهم الأحداث",["خلق الإنسان على صورة الله.","وضعه في جنة عدن.","إعطاؤه وصية عدم الأكل من شجرة معرفة الخير والشر.","خلق حواء.","سقوط الإنسان في الخطية.","دخول الموت والألم إلى التاريخ البشري.","إعطاء وعد نسل المرأة الذي يسحق رأس الحية. التوثيق: تكوين 1:26-28؛ 2:15-17؛ 3:1-24."]],
            ["النبوات والأهمية المسيانية","يمثل آدم رأس البشرية الأولى، بينما يقدم العهد الجديد المسيح باعتباره «آدم الأخير». التوثيق: رومية 5:12-21؛ 1 كورنثوس 15:45-49."],
            ["نقاط القوة",["نال امتيازًا فريدًا في الخليقة.","كُلّف بالعمل وحفظ الجنة.","أُعطي سلطانًا على الخليقة.","كان في علاقة مباشرة مع الله قبل السقوط."]],
            ["نقاط الضعف","لم يحفظ وصية الله. سمح للخداع أن يقوده إلى العصيان. حاول نقل المسؤولية عن خطيته. التوثيق: تكوين 3:6-13."],
            ["القراءة التفسيرية","تتفق التفاسير الستة في أهمية آدم باعتباره الشخصية التي يرتبط بها دخول الخطية إلى الجنس البشري، مع اختلافات في التفصيل حول طبيعة التجربة ومسؤولية آدم وحواء. ويبرز Matthew Henry الجانب الروحي والأخلاقي، بينما يعطي Keil & Delitzsch اهتمامًا أكبر للسياق النصي واللغوي، وتتناول التفاسير الأخرى العلاقة بين سقوط آدم والتعليم الكتابي اللاحق عن الخطية والفداء."]
        ]
    },
    {
        id:"noah",
        name:"نوح",
        subtitle:"رجل بار في جيل الطوفان",
        sections:[
            ["الاسم","نوح، ابن لامك ومن نسل شيث. التوثيق: تكوين 5:28-29."],
            ["النسب","لامك → نوح، ومن نوح جاء سام وحام ويافث. التوثيق: تكوين 5:28-32؛ 6:10."],
            ["تاريخ الميلاد والوفاة","عاش نوح 950 سنة. التوثيق: تكوين 9:28-29."],
            ["مكان الولادة","لا يحدد سفر التكوين مكان ولادة نوح."],
            ["الأشخاص المعاصرون","لامك، متوشالح، سام، حام، يافث، زوجته، وأهل العالم السابق للطوفان."],
            ["أهم الأحداث",["اختاره الله في جيل فاسد.","أمره الله ببناء الفلك.","دخل الفلك مع أسرته.","جاء الطوفان.","حفظ الله نوحًا وأسرته.","قدم نوح ذبيحة بعد الخروج.","أقام الله معه عهدًا ووضع قوسه في السحاب علامة للعهد. التوثيق: تكوين 6-9."]],
            ["النبوة","كان الفلك في حد ذاته إعلانًا عن دينونة الله والخلاص الذي يقدمه الله للذين يؤمنون بكلمته. التوثيق: عبرانيين 11:7؛ 1 بطرس 3:20؛ 2 بطرس 2:5."],
            ["نقاط القوة",["البر.","مخافة الله.","الطاعة.","الإيمان بأمر لم يكن قد ظهر بعد."]],
            ["نقاط الضعف","بعد الطوفان سكر نوح، وحدثت أزمة أسرية مرتبطة بذلك. التوثيق: تكوين 9:20-27."],
            ["القراءة التفسيرية","يركز Matthew Henry على الإيمان والطاعة وسط فساد العالم، بينما يهتم Keil & Delitzsch بالبنية التاريخية والنصية للطوفان والعهد. وتبرز التفاسير الأخرى معنى الفلك كعلامة للدينونة والخلاص."]
        ]
    },
    {
        id:"abraham",
        name:"إبراهيم",
        subtitle:"أبو المؤمنين وحامل وعد العهد",
        sections:[
            ["الاسم","أبرام، ثم إبراهيم، وهو من أهم شخصيات العهد القديم، وأبو إسحاق ومن خلاله نسل العهد. التوثيق: تكوين 11:26-32؛ 17:1-8."],
            ["النسب","تارح → إبراهيم. وأخوهما هاران وناحور. التوثيق: تكوين 11:27-32."],
            ["الميلاد والوفاة","عاش إبراهيم 175 سنة. التوثيق: تكوين 25:7."],
            ["مكان الولادة","أور الكلدانيين في بداية السجل الكتابي لمسيرته. التوثيق: تكوين 11:31؛ 15:7."],
            ["المعاصرون","سارة، لوط، هاجر، إسماعيل، إسحاق، ملكي صادق، أبيمالك، وملوك المنطقة."],
            ["أهم الأحداث",["الدعوة الإلهية.","ترك أور.","الانتقال إلى حاران ثم كنعان.","العهد.","الوعد بالنسل.","إنقاذ لوط.","شفاعة إبراهيم من أجل سدوم.","ولادة إسحاق.","امتحان تقديم إسحاق. التوثيق: تكوين 12-22."]],
            ["النبوات","وعد الله إبراهيم بأن تتبارك فيه جميع قبائل الأرض، ويرتبط العهد الجديد بهذا الوعد بالمسيح. التوثيق: تكوين 12:1-3؛ 22:18؛ غلاطية 3:8، 16."],
            ["نقاط القوة",["الإيمان.","الطاعة.","الشفاعة.","الكرم.","الاستعداد للتضحية."]],
            ["نقاط الضعف","الخوف في بعض المواقف. استخدام الحيلة بشأن سارة. محاولة حل مشكلة النسل من خلال هاجر. التوثيق: تكوين 12:10-20؛ 16:1-6."],
            ["القراءة التفسيرية","يبرز Matthew Henry إيمان إبراهيم وطاعته، بينما يقدم Keil & Delitzsch تحليلًا عميقًا للعهد والوعود. وتتناول التفاسير الستة بصورة عامة التوتر بين وعد الله ومحاولات إبراهيم البشرية لتحقيق الوعد."]
        ]
    },
    {
        id:"sarah",
        name:"سارة",
        subtitle:"أم إسحاق وشريكة وعد العهد",
        sections:[
            ["الاسم","ساراي ثم سارة. التوثيق: تكوين 17:15."],
            ["النسب","يذكر إبراهيم في تكوين 20:12 أنها أخته من جهة الأب، وهي زوجته وأم إسحاق."],

for(const character of characters){
    const details = pointDetails[character.id];
    if(!details) continue;
    for(const section of character.sections){
        if(section[0] === "نقاط القوة" && details.strengths){
            section[1] = details.strengths;
        }
        if(section[0] === "نقاط الضعف" && details.weaknesses){
            section[1] = details.weaknesses;
        }
    }
}

const grid = document.getElementById("charactersGrid");
const pageTitle = document.getElementById("pageTitle");
const studyPanel = document.getElementById("studyPanel");
const backToCharacters = document.getElementById("backToCharacters");
const title = document.getElementById("studyTitle");
const subtitle = document.getElementById("studySubtitle");
const body = document.getElementById("studyBody");

function sectionMarkup(section){
    const heading = section[0];
    const content = section[1];
    const wide = heading.includes("الأحداث") || heading.includes("القراءة") || heading.includes("النبوات") || heading.includes("الأهمية") || heading.includes("الرسالة") || heading.includes("نقاط");
    if(Array.isArray(content)){
        if(content.every(item => item && typeof item === "object" && "point" in item)){
            return `<section class="section-card ${wide ? "wide" : ""}"><h3>${heading}</h3><div class="detail-list">${content.map(item => `<article class="detail-point"><h4>${item.point}</h4><p><span class="detail-label">الشاهد:</span> ${item.witness}</p><p><span class="detail-label">الموقف المؤيد:</span> ${item.situation}</p></article>`).join("")}</div></section>`;
        }
        return `<section class="section-card ${wide ? "wide" : ""}"><h3>${heading}</h3><ul>${content.map(item => `<li>${item}</li>`).join("")}</ul></section>`;
    }
    return `<section class="section-card ${wide ? "wide" : ""}"><h3>${heading}</h3><p>${content}</p></section>`;
}

function renderCharacter(id){
    const character = characters.find(item => item.id === id) || characters[0];
    title.textContent = character.name;
    subtitle.textContent = character.subtitle;
    body.innerHTML = character.sections.map(sectionMarkup).join("");
    pageTitle.hidden = true;
    grid.hidden = true;
    studyPanel.hidden = false;
    document.querySelectorAll(".character-card").forEach(card => {
        card.classList.toggle("active", card.dataset.id === character.id);
    });
    history.replaceState(null,"",`#${character.id}`);
}

function showCharacters(){
    pageTitle.hidden = false;
    grid.hidden = false;
    studyPanel.hidden = true;
    document.querySelectorAll(".character-card").forEach(card => {
        card.classList.remove("active");
    });
    history.replaceState(null,"",location.pathname);
    window.scrollTo({top:0,behavior:"smooth"});
}

grid.innerHTML = characters.map((character,index) => `
    <button class="character-card" type="button" data-id="${character.id}" aria-label="${character.name}">
        <span class="character-number">${index + 1}</span>
        <span class="character-name">${character.name}</span>
        <span class="character-subtitle">${character.subtitle}</span>
    </button>
`).join("");

grid.addEventListener("click", event => {
    const card = event.target.closest(".character-card");
    if(!card) return;
    renderCharacter(card.dataset.id);
    window.scrollTo({top:0,behavior:"smooth"});
});

backToCharacters.addEventListener("click", showCharacters);

window.addEventListener("hashchange", () => {
    const id = location.hash.replace("#", "");
    if(id){
        renderCharacter(id);
    }
});

const initialId = location.hash.replace("#","");
if(initialId){
    renderCharacter(initialId);
}else{
    showCharacters();
}
</script>
