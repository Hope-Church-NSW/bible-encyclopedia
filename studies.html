<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الدراسات الكتابية | موسوعة الكتاب المقدس</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --blue-1:#04111f;
    --blue-2:#071c31;
    --blue-3:#0d2d4a;
    --blue-4:#12446d;

    --gold:#d4af37;
    --gold-light:#f4dc78;
    --gold-dark:#806018;

    --white:#f7f9fc;
    --muted:#aebdca;

    --border:
        rgba(212,175,55,.32);
}


/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
        "Noto Naskh Arabic",
        "Amiri",
        Tahoma,
        Arial,
        sans-serif;

    color:var(--white);

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(23,75,120,.75),
            transparent 45%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(13,56,93,.35),
            transparent 38%
        ),

        linear-gradient(
            145deg,
            var(--blue-1),
            var(--blue-2) 55%,
            #020a13
        );
}


/* =====================================================
   HEADER
===================================================== */

.top-frame{

    position:sticky;

    top:0;

    z-index:1000;

    width:100%;

    background:

        linear-gradient(
            180deg,
            rgba(7,29,49,.98),
            rgba(3,15,27,.98)
        );

    border-bottom:
        1px solid
        rgba(212,175,55,.42);

    box-shadow:

        0 8px 30px
        rgba(0,0,0,.55),

        inset 0 -1px 0
        rgba(255,255,255,.04);
}


.topbar{

    max-width:1400px;

    min-height:92px;

    margin:auto;

    padding:
        10px 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}


/* =====================================================
   HOME BUTTON
===================================================== */

.home-btn{

    min-width:170px;

    height:55px;

    padding:
        0 18px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    color:#fff;

    text-decoration:none;

    border:
        1px solid
        rgba(212,175,55,.68);

    border-radius:14px;

    background:

        linear-gradient(
            145deg,
            #183c5d,
            #071a2d
        );

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.12),

        0 6px 17px
        rgba(0,0,0,.48);

    font-size:17px;

    font-weight:900;

    transition:.3s;
}


.home-btn:hover{

    transform:
        translateY(-3px);

    border-color:
        var(--gold-light);

    box-shadow:

        0 10px 24px
        rgba(0,0,0,.62),

        0 0 20px
        rgba(212,175,55,.15);
}


/* =====================================================
   BRAND
===================================================== */

.brand{

    display:flex;

    align-items:center;

    gap:14px;
}


.brand-logo{

    width:72px;

    height:72px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(0,0,0,.82)
        );

    animation:
        logoFloat 5s
        ease-in-out
        infinite;
}


@keyframes logoFloat{

    0%,100%{

        transform:
            translateY(0)
            rotateY(0deg);
    }

    50%{

        transform:
            translateY(-4px)
            rotateY(8deg);
    }
}


.brand-name{

    font-size:22px;

    font-weight:900;

    white-space:nowrap;

    background:

        linear-gradient(
            180deg,
            #fff4ae,
            var(--gold-light) 35%,
            var(--gold) 68%,
            var(--gold-dark)
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,.9);
}


/* =====================================================
   MAIN
===================================================== */

.page{

    max-width:1400px;

    margin:auto;

    padding:
        42px 25px 70px;
}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-title{

    text-align:center;

    margin-bottom:42px;
}


.page-title h1{

    margin:0;

    color:var(--gold-light);

    font-size:
        clamp(30px,5vw,43px);

    font-weight:900;

    text-shadow:
        0 3px 6px
        rgba(0,0,0,.75);
}


.page-title p{

    margin:
        9px 0 0;

    color:var(--muted);

    font-size:17px;
}


/* =====================================================
   MASTER STUDIES GRID
   12 أيقونة
   4 أيقونات في كل صف
   3 صفوف
===================================================== */

.studies-grid{

    width:100%;

    display:grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    grid-template-rows:
        repeat(3, auto);

    gap:22px;

    align-items:stretch;
}


/* =====================================================
   ICON CARD
===================================================== */

.study-card{

    position:relative;

    min-height:175px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    border:
        1px solid
        var(--border);

    border-radius:22px;

    background:

        linear-gradient(
            145deg,
            rgba(17,52,81,.98),
            rgba(5,22,38,.99)
        );

    box-shadow:

        0 12px 27px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.05);

    overflow:hidden;

    transition:

        transform .28s ease,
        border-color .28s ease,
        box-shadow .28s ease,
        background .28s ease;
}


.study-card::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    left:0;

    height:4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );

    opacity:.75;
}


.study-card::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    border-radius:50%;

    background:
        rgba(212,175,55,.06);

    top:-48px;

    left:-48px;

    pointer-events:none;
}


.study-card:hover{

    transform:
        translateY(-8px)
        scale(1.025);

    border-color:
        var(--gold-light);

    background:

        linear-gradient(
            145deg,
            rgba(20,82,126,.98),
            rgba(6,26,44,.99)
        );

    box-shadow:

        0 20px 40px
        rgba(0,0,0,.62),

        0 0 24px
        rgba(212,175,55,.14);
}


/* =====================================================
   ICON
===================================================== */

.card-icon{

    width:96px;

    height:96px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:24px;

    color:var(--gold-light);

    font-size:49px;

    background:

        linear-gradient(
            145deg,
            #1a4b73,
            #071a2d
        );

    border:
        1px solid
        rgba(212,175,55,.68);

    box-shadow:

        inset 0 1px 2px
        rgba(255,255,255,.13),

        0 9px 20px
        rgba(0,0,0,.52);

    transition:

        transform .28s ease,
        box-shadow .28s ease;
}


.study-card:hover .card-icon{

    transform:
        scale(1.08);

    box-shadow:

        inset 0 1px 2px
        rgba(255,255,255,.15),

        0 12px 25px
        rgba(0,0,0,.62),

        0 0 20px
        rgba(212,175,55,.16);
}


/* =====================================================
   منع أي نص داخل البطاقات
===================================================== */

.study-card h3,
.study-card p,
.study-card .card-title,
.study-card .card-name,
.study-card .card-text,
.study-card .book-name,
.study-card .book-subtitle{

    display:none !important;

    visibility:hidden !important;

    height:0 !important;

    width:0 !important;

    margin:0 !important;

    padding:0 !important;

    overflow:hidden !important;
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    max-width:1400px;

    margin:auto;

    padding:
        25px;

    text-align:center;

    color:#8193a5;

    border-top:
        1px solid
        rgba(212,175,55,.18);

    font-size:14px;
}


/* =====================================================
   TABLET
   يبقى 4 في الصف
===================================================== */

@media(max-width:900px){

    .studies-grid{

        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        grid-template-rows:
            repeat(3, auto);

        gap:14px;
    }


    .study-card{

        min-height:145px;
    }


    .card-icon{

        width:76px;

        height:76px;

        font-size:39px;

        border-radius:19px;
    }
}


/* =====================================================
   MOBILE
   يبقى 4 في الصف كما طلب المستخدم
===================================================== */

@media(max-width:650px){

    .topbar{

        min-height:78px;

        padding:
            8px 12px;
    }


    .brand{

        gap:7px;
    }


    .brand-logo{

        width:52px;

        height:52px;
    }


    .brand-name{

        font-size:14px;
    }


    .home-btn{

        min-width:125px;

        padding:

        font-size:13px;

        border-radius:12px;
    }


    .page{

        padding:

    }


    .page-title{

        margin-bottom:30px;
    }


    .page-title h1{

        font-size:30px;
    }


    .page-title p{

    }


    .studies-grid{

        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        grid-template-rows:
            repeat(3, auto);

        gap:10px;
    }


    .study-card{

        min-height:105px;

    .card-icon{

        height:60px;

        font-size:31px;

}


/* =====================================================
   SMALL MOBILE
   4 في الصف
===================================================== */

@media(max-width:420px){

    }


    .card-icon{

        width:49px;

        height:49px;

        font-size:25px;

        border-radius:12px;
    }
}

</style>
