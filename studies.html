<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الدراسات الكتابية | موسوعة الكتاب المقدس</title>

<style>

:root{
    --blue-950:#03101d;
    --blue-900:#061a2c;
    --blue-800:#082943;
    --blue-700:#0d385d;
    --blue-600:#14527e;

    --gold:#d4af37;
    --gold-light:#f4dc79;
    --gold-dark:#806018;

    --white:#f8fbff;
    --muted:#b7c7d6;

    --card:#0a2943;
    --card2:#061b2e;

    --border:rgba(212,175,55,.35);

    --shadow:
        0 22px 55px rgba(0,0,0,.55);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    color:var(--white);

    font-family:
        "Noto Naskh Arabic",
        "Amiri",
        Tahoma,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(20,82,126,.72),
            transparent 42%
        ),

        radial-gradient(
            circle at 15% 75%,
            rgba(13,56,93,.30),
            transparent 38%
        ),

        linear-gradient(
            145deg,
            var(--blue-950),
            var(--blue-900) 48%,
            #020911
        );
}

/* =====================================================
   HEADER
===================================================== */

.top-frame{

    position:sticky;

    top:0;

    z-index:1000;

    border-bottom:
        1px solid
        rgba(212,175,55,.30);

    background:
        linear-gradient(
            180deg,
            rgba(8,41,67,.98),
            rgba(3,16,29,.98)
        );

    box-shadow:
        0 10px 35px rgba(0,0,0,.55);
}

.topbar{

    max-width:1450px;

    min-height:88px;

    margin:auto;

    padding:
        9px 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

/* RIGHT */

.brand{

    display:flex;

    align-items:center;

    gap:13px;
}

.brand-logo{

    width:64px;

    height:64px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 7px 8px rgba(0,0,0,.85)
        );
}

.brand-name{

    font-size:21px;

    font-weight:900;

    white-space:nowrap;

    background:
        linear-gradient(
            180deg,
            #fff6bf,
            var(--gold-light),
            var(--gold),
            var(--gold-dark)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

/* LEFT */

.header-actions{

    display:flex;

    align-items:center;

    gap:9px;
}

.header-button{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    min-height:44px;

    padding:
        8px 13px;

    border:
        1px solid
        rgba(212,175,55,.55);

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #16476d,
            #061a2d
        );

    color:#fff;

    text-decoration:none;

    font-weight:900;

    cursor:pointer;

    transition:.25s;
}

.header-button:hover{

    border-color:
        var(--gold-light);

    transform:
        translateY(-2px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.45);
}

.home-icon{

    font-size:21px;
}

/* =====================================================
   MAIN
===================================================== */

main{

    max-width:1250px;

    margin:auto;

    padding:
        45px 20px 75px;
}

/* =====================================================
   PAGE TITLE
===================================================== */

.page-title{

    text-align:center;

    margin:
        10px auto 35px;

    max-width:900px;
}

.page-title h1{

    margin:
        0 0 10px;

    font-size:
        clamp(30px,5vw,46px);

    font-weight:900;

    background:
        linear-gradient(
            180deg,
            #fff5b4,
            var(--gold-light),
            var(--gold),
            var(--gold-dark)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.page-title p{

    margin:0;

    color:#bdcddd;

    font-size:18px;

    line-height:1.9;
}

/* =====================================================
   STUDIES GRID
===================================================== */

#studiesGrid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:22px;
}

/* =====================================================
   STUDY CARD
===================================================== */

.study-card{

    min-height:185px;

    padding:25px 18px;

    border:
        1px solid
        rgba(212,175,55,.35);

    border-radius:23px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.98),
            rgba(4,23,39,.99)
        );

    box-shadow:
        var(--shadow);

    cursor:pointer;

    text-align:center;

    transition:
        transform .3s,
        border-color .3s,
        box-shadow .3s;
}

.study-card:hover{

    transform:
        translateY(-7px);

    border-color:
        var(--gold-light);

    box-shadow:
        0 25px 55px rgba(0,0,0,.65),
        0 0 25px rgba(212,175,55,.12);
}

.study-icon{

    width:72px;

    height:72px;

    margin:
        0 auto 14px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        rgba(212,175,55,.60);

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            #1b5b89,
            #071b2e
        );

    font-size:38px;
}

.study-card h2{

    margin:
        0;

    font-size:21px;

    font-weight:900;

    color:
        var(--gold-light);
}

/* =====================================================
   STUDY VIEW
===================================================== */

#studyView{

    display:none;
}

.study-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:25px;

    padding:
        15px 18px;

    border:
        1px solid
        rgba(212,175,55,.35);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(13,56,93,.95),
            rgba(4,23,39,.98)
        );

    box-shadow:
        var(--shadow);
}

.study-header-title{

    font-size:
        clamp(23px,4vw,34px);

    font-weight:900;

    color:
        var(--gold-light);
}

.study-header-actions{

    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

/* =====================================================
   CONTENT
===================================================== */

.study-content{

    background:
        linear-gradient(
            145deg,
            rgba(7,31,51,.98),
            rgba(3,16,29,.99)
        );

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:25px;

    padding:
        clamp(20px,4vw,40px);

    box-shadow:
        var(--shadow);
}

.study-content h2{

    margin:
        35px 0 15px;

    padding-bottom:9px;

    border-bottom:
        1px solid
        rgba(212,175,55,.30);

    color:
        var(--gold-light);

    font-size:28px;
}

.study-content h3{

    margin:
        27px 0 12px;

    color:
        #f2d976;

    font-size:22px;
}

.study-content p{

    margin:
        0 0 17px;

    color:#d4e0eb;

    font-size:18px;

    line-height:2.05;
}

.study-content ul{

    margin:
        10px 0 25px;

    padding-right:27px;
}

.study-content li{

    margin-bottom:10px;

    color:#d4e0eb;

    font-size:17px;

    line-height:1.9;
}

/* =====================================================
   FACT BOX
===================================================== */

.fact-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    margin:
        22px 0 30px;
}

.fact{

    padding:18px;

    border:
        1px solid
        rgba(212,175,55,.28);

    border-radius:17px;

    background:
        rgba(13,56,93,.45);
}

.fact strong{

    display:block;

    margin-bottom:6px;

    color:
        var(--gold-light);

    font-size:17px;
}

.fact span{

    color:#d7e3ed;

    font-size:16px;

    line-height:1.7;
}

/* =====================================================
   SCRIPTURE
===================================================== */

.scripture{

    margin:
        20px 0;

    padding:
        20px 22px;

    border-right:
        4px solid
        var(--gold);

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            rgba(20,82,126,.25),
            rgba(212,175,55,.06)
        );

    color:#f0f5fa;

    font-size:18px;

    line-height:2;
}

.scripture strong{

    color:
        var(--gold-light);
}

/* =====================================================
   SOURCE
===================================================== */

.source-box{

    margin:
        25px 0;

    padding:
        18px 20px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:16px;

    background:
        rgba(3,16,29,.75);
}

.source-box strong{

    color:
        var(--gold-light);
}

.source-box p{

    margin:
        8px 0 0;

    font-size:15px;

    line-height:1.9;

    color:#afc0cf;
}

/* =====================================================
   IMPORTANT NOTE
===================================================== */

.note{

    margin:
        20px 0;

    padding:
        18px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:15px;

    background:
        rgba(212,175,55,.05);

    color:#d7e2eb;

    line-height:1.95;
}

/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

    width:100%;

    margin-top:25px;

    padding:15px;

    border:
        1px solid
        rgba(212,175,55,.55);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #16476d,
            #061a2d
        );

    color:#fff;

    font-size:17px;

    font-weight:900;

    cursor:pointer;
}

/* =====================================================
   FOOTER
===================================================== */

footer{

    max-width:1200px;

    margin:auto;

    padding:
        25px 20px 35px;

    text-align:center;

    color:#8195a8;

    border-top:
        1px solid
        rgba(212,175,55,.16);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    #studiesGrid{

        grid-template-columns:
            repeat(2,1fr);
    }

    .fact-grid{

        grid-template-columns:
            1fr 1fr;
    }
}

@media(max-width:600px){

    .topbar{

        min-height:76px;

        padding:
            7px 10px;
    }

    .brand-logo{

        width:50px;
        height:50px;
    }

    .brand-name{

        font-size:14px;
    }

    .header-button{

        min-height:40px;

        padding:
            7px 10px;

        font-size:13px;
    }

    #studiesGrid{

        grid-template-columns:1fr;
    }

    .fact-grid{

        grid-template-columns:1fr;
    }

    .study-content p{

        font-size:17px;
    }

    .study-content h2{

        font-size:24px;
    }
}

</style>
</head>


<body>

<header class="top-frame">

    <div class="topbar">

        <!-- الجانب الأيسر -->

        <div class="header-actions">

            <a
                href="index.html"
                class="header-button"
            >
                <span class="home-icon">⌂</span>
                <span>الرئيسية</span>
            </a>

            <button
                class="header-button"
                onclick="showStudies()"
            >
                📚 الدراسات
            </button>

        </div>


        <!-- الجانب الأيمن -->

        <div class="brand">

            <div class="brand-name">
                كنيسة رجاء الأمم سيدني
            </div>

            <img
                src="assets/logo.png"
                class="brand-logo"
                alt="كنيسة رجاء الأمم سيدني"
            >

        </div>

    </div>

</header>


<main>

<!-- =====================================================
     صفحة الأقسام
===================================================== -->

<section id="studiesPage">

    <div class="page-title">

        <h1>الدراسات الكتابية</h1>

        <p>
            دراسات كتابية ولاهوتية وتاريخية موثقة
            للدارسين والباحثين ومحبي كلمة الله.
        </p>

    </div>


    <div id="studiesGrid"></div>

</section>


<!-- =====================================================
     صفحة الدراسة
===================================================== -->

<section id="studyView">

    <div class="study-header">

        <div
            class="study-header-title"
            id="studyTitle"
        ></div>

        <div class="study-header-actions">

            <button
                class="header-button"
                onclick="showStudies()"
            >
                📚 الدراسات
            </button>

            <a
                href="index.html"
                class="header-button"
            >
                ⌂ الرئيسية
            </a>

        </div>

    </div>


    <article
        class="study-content"
        id="studyContent"
    ></article>

</section>

</main>


<footer>

    كنيسة رجاء الأمم سيدني —
    موسوعة الكتاب المقدس

</footer>


<script>

/* =====================================================
   أقسام الدراسات — ثابتة
===================================================== */

const studies = [

    {
        icon:"⛺",
        title:"خيمة الاجتماع",
        key:"tabernacle"
    },

    {
        icon:"🏛️",
        title:"هيكل سليمان",
        key:"solomon"
    },

    {
        icon:"🏗️",
        title:"هيكل هيرودس",
        key:"herod"
    },

    {
        icon:"⚖️",
        title:"مقارنة خيمة الاجتماع والهياكل",
        key:"comparison"
    },

    {
        icon:"🕎",
        title:"مواسم وأعياد الكتاب المقدس",
        key:"feasts"
    },

    {
        icon:"📚",
        title:"الموسوعة الكتابية",
        key:"encyclopedia"
    },

    {
        icon:"📜",
        title:"مقدمة أسفار الكتاب المقدس",
        key:"books"
    },

    {
        icon:"✝️",
        title:"المسيح في نبوات الكتاب",
        key:"christ"
    },

    {
        icon:"✨",
        title:"معجزات المسيح",
        key:"miracles"
    },

    {
        icon:"👤",
        title:"شخصيات الكتاب المقدس",
        key:"characters"
    },

    {
        icon:"🕍",
        title:"أمثلة المسيح والخلفية اليهودية",
        key:"jewish"
    },

    {
        icon:"🌊",
        title:"الأنهار في الكتاب المقدس",
        key:"rivers"
    }

];


/* =====================================================
   عرض الأقسام
===================================================== */

function renderStudies(){

    const grid =
        document.getElementById(
            "studiesGrid"
        );

    grid.innerHTML = "";

    studies.forEach(study => {

        const card =
            document.createElement("div");

        card.className =
            "study-card";

        card.innerHTML = `

            <div class="study-icon">
                ${study.icon}
            </div>

            <h2>
                ${study.title}
            </h2>

        `;

        card.onclick = () =>
            openStudy(study.key);

        grid.appendChild(card);

    });
}


/* =====================================================
   الدراسة العميقة — خيمة الاجتماع
===================================================== */

const tabernacleStudy = `

<h2>1. مقدمة: ما هي خيمة الاجتماع؟</h2>

<p>
خيمة الاجتماع هي المسكن المقدس الذي أمر الرب موسى بإقامته
في البرية ليكون موضع حضوره وسط شعب إسرائيل.
والتعبير العبري المرتبط بها هو
<strong>מִשְׁכָּן — Mishkan</strong>
من الجذر المرتبط بالسكن والإقامة.
</p>

<div class="scripture">

<strong>خروج 25:8</strong><br>

«فَيَصْنَعُونَ لِي مَقْدِسًا لِأَسْكُنَ فِي وَسَطِهِمْ».

</div>

<p>
هذه الآية أساسية لفهم المشروع كله:
المبادرة تبدأ من الله، والمقصد المعلن ليس مجرد إنشاء مبنى
ديني، بل إقامة موضع يعلن فيه الله حضوره وسط الجماعة.
</p>

<div class="note">

<strong>منهج الدراسة:</strong>
سنميز في هذه الدراسة بين:
<br>
1. ما يصرح به النص الكتابي.
<br>
2. المعلومات التاريخية واللغوية.
<br>
3. التفسيرات اللاهوتية.
<br>
4. التطبيقات الرمزية التي يقدمها المفسرون.
<br>
وهذا مهم حتى لا نحول الاستنتاج التفسيري إلى حقيقة كتابية صريحة.

</div>


<h2>2. لماذا أعطى الله موسى نموذجًا؟</h2>

<div class="scripture">

<strong>خروج 25:9</strong><br>

«كَحَسَبِ جَمِيعِ مَا أَنَا أُرِيكَ مِنْ مِثَالِ الْمَسْكَنِ
وَمِثَالِ جَمِيعِ آنِيَتِهِ هكَذَا تَصْنَعُونَ».

</div>

<p>
النص يؤكد أن الخيمة لم تكن مشروعًا هندسيًا من تصميم موسى
وفق اجتهاده الشخصي، بل أُعطي له نموذج يجب أن يلتزم به.
وتتكرر الفكرة في خروج 25:40.
</p>

<p>
وهذه النقطة أصبحت لاحقًا ذات أهمية لاهوتية في رسالة العبرانيين،
حيث يُنظر إلى خدمة المسكن والكهنوت باعتبارها مرتبطة
بـ«المثال والظل» للأمور السماوية.
</p>


<h2>3. المواد الأساسية للخيمة</h2>

<div class="fact-grid">

    <div class="fact">
        <strong>الذهب</strong>
        <span>
        استُخدم في تابوت العهد والغطاء
        وأجزاء رئيسية من الأثاث الداخلي.
        </span>
    </div>

    <div class="fact">
        <strong>الفضة</strong>
        <span>
        استُخدمت بصورة بارزة في قواعد ألواح المسكن.
        </span>
    </div>

    <div class="fact">
        <strong>النحاس</strong>
        <span>
        ظهر بصورة بارزة في المذبح وأساسات سياج الدار
        وأدوات الخدمة الخارجية.
        </span>
    </div>

    <div class="fact">
        <strong>خشب السنط</strong>
        <span>
        استُخدم في عدد من الهياكل والأثاث،
        ومنها الألواح والأعمدة وبعض العصي.
        </span>
    </div>

    <div class="fact">
        <strong>الكتان</strong>
        <span>
        استُخدم في الستائر الداخلية
        وستائر الدار.
        </span>
    </div>

    <div class="fact">
        <strong>شعر الماعز</strong>
        <span>
        استُخدم في غطاء الخيمة فوق الستائر الداخلية.
        </span>
    </div>

</div>

<p>
ويذكر خروج 25:3–7 الذهب والفضة والنحاس والأقمشة الملونة
والكتان وشعر الماعز وجلود الكباش وجلود «التَّحَاشِيم»
وخشب السنط والزيت والأطياب والأحجار الكريمة.
</p>

<div class="source-box">

<strong>المصدر الأساسي:</strong>

<p>
خروج 25:1–9.
النص يورد قائمة المواد التي طُلب تقديمها
لعمل المقدس وأثاثه.
</p>

</div>


<h2>4. خيمة الاجتماع ليست مجرد خيمة واحدة</h2>

<p>
عند قراءة خروج 25–27 يجب عدم اختزال المنشأة كلها
في قطعة قماش واحدة تسمى «الخيمة».
فالوصف يتضمن منظومة متكاملة:
</p>

<ul>

<li>المسكن الداخلي.</li>

<li>الستائر والأغطية.</li>

<li>الألواح الخشبية.</li>

<li>الحجاب.</li>

<li>الأثاث المقدس.</li>

<li>دار الاجتماع المحيطة به.</li>

<li>المذبح النحاسي.</li>

<li>المدخل.</li>

<li>الأعمدة والقواعد.</li>

</ul>


<h2>5. أبعاد الستارة الداخلية</h2>

<p>
يبدأ خروج 26 بوصف عشر ستائر من بوص مبروم،
وأسمانجوني وأرجوان وقرمز،
ومعها عمل الكروبيم.
</p>

<div class="fact-grid">

    <div class="fact">
        <strong>عدد الستائر</strong>
        <span>10</span>
    </div>

    <div class="fact">
        <strong>طول الواحدة</strong>
        <span>28 ذراعًا</span>
    </div>

<h2>20. من الذي صنع الخيمة؟</h2>

<p>

وتصل القصة إلى إقامة المسكن في نهاية سفر الخروج،

<h2>22. حضور الله هو قلب الخيمة</h2>

فهي ليست الذهب ولا الستائر ولا الأبعاد،
بل <strong>حضور الله وسط شعبه</strong>.
</p>

<p>

«لِيَصْنَعُوا لِي مَقْدِسًا لِأَسْكُنَ فِي وَسَطِهِمْ»
ويصل في نهاية السفر إلى امتلاء المسكن بمجد الرب.
</p>


<h2>23. الخيمة والعهد</h2>

<p>

والخيمة هي مركز العبادة المرتبطة بالعهد،
والكهنوت يخدم داخل هذا النظام،
والذبائح والطقوس تنظم العلاقة الطقسية
بين الشعب والمقدس.
</p>


<h2>24. القراءة المسيحية اللاحقة</h2>

<p>
العهد الجديد يعيد قراءة موضوع المسكن ضمن إطار أوسع،
خصوصًا في رسالة العبرانيين ويوحنا.
لكن يجب أن نفرق بين:
</p>

<ul>

<li>
المعنى الأصلي لخيمة الاجتماع في سياق سفر الخروج.
</li>

<li>
الاستخدام اللاهوتي الذي قام به كتّاب العهد الجديد.
</li>

<li>
التطبيقات الرمزية التي قدمها المفسرون المسيحيون.
</li>

</ul>

<div class="note">

<strong>قاعدة التوثيق في الموسوعة:</strong>

إلا عندما يوجد نص كتابي يدعم ذلك.
وعندما يكون الكلام تفسيرًا آبائيًا أو إنجيليًا أو يهوديًا

</div>


<h2>25. الخلفية اليهودية والتفسير الرباني</h2>

<p>

وتوجد مناقشات تلمودية ومدراشية حول أحكام المسكن وأدواته
وتفاصيل العمل الكهنوتي.
</p>

<p>
لكن هذه المواد يجب أن تستخدم في الموسوعة باعتبارها
مصادر تفسيرية وتاريخية يهودية لاحقة للنص التوراتي،
لا باعتبارها نصًا إضافيًا لسفر الخروج.
</p>

/* =====================================================
   فتح الدراسة
===================================================== */

function openStudy(key){

    document.getElementById(
        "studiesPage"
    ).style.display = "none";

    document.getElementById(
        "studyView"
    ).style.display = "block";

    const title =
        document.getElementById(
            "studyTitle"
        );

    const content =
        document.getElementById(
            "studyContent"
        );


    if(key === "tabernacle"){

        title.textContent =
            "⛺ خيمة الاجتماع";

        content.innerHTML =
            tabernacleStudy;

    }else{

        const study =
            genericStudies[key];

        title.textContent =
            study.title;

        content.innerHTML = `

            <h2>${study.title}</h2>

            <p>
                ${study.text}
            </p>

            <div class="note">
                هذا القسم محفوظ ضمن الهيكل النهائي
                لموسوعة الكتاب المقدس،
                وسيتم ملؤه بالدراسة الموثقة
                في مرحلته الخاصة.
            </div>

        `;
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   العودة إلى الدراسات
===================================================== */

function showStudies(){

    document.getElementById(
        "studyView"
    ).style.display = "none";

    document.getElementById(
        "studiesPage"
    ).style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
