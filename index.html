<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>الكتاب المقدس | Hope Church NSW</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
<style>
:root{
    --bg:#06111f;
    --card:#0d2238;
    --card-hover:#143554;
    --gold:#d4af37;
    --gold-light:#f4d76b;
    --gold-glow: rgba(212, 175, 55, 0.4);
    --blue:#35a7ff;
    --text:#f5f7fa;
    --muted:#9eafc1;
    --border:#1d3d5c;
}
 
*{
    box-sizing:border-box;
}
 
body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#123457 0%,transparent 45%),
        linear-gradient(145deg,#040c17,#091d32 60%,#051220);
    color:var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial;
    overflow-x: hidden;
}
 
/* HEADER */
header{
    padding:16px 6%;
    border-bottom:1px solid var(--border);
    background:rgba(5,16,29,.92);
    backdrop-filter:blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
}
 
.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}
 
.brand{
    display:flex;
    align-items:center;
    gap:18px;
    cursor: pointer;
}
 
.logo{
    width:60px;
    height:60px;
    object-fit:contain;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
}
 
.brand h1{
    margin:0;
    font-size:24px;
    font-weight: 900;
    background: linear-gradient(180deg, #ffe893 0%, #f4d76b 35%, #ca9e2e 70%, #8a640f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--gold-light);
    text-decoration: none;
    font-weight: bold;
    border: 1px solid var(--gold);
    padding: 8px 16px;
    border-radius: 8px;
    background: rgba(212, 175, 55, 0.1);
    transition: all 0.3s ease;
}

.nav-back:hover {
    background: var(--gold);
    color: #000;
}
 
/* MAIN CONTENT */
main{
    max-width:1200px;
    margin:auto;
    padding:30px 6%;
}

/* BREADCRUMB / NAVIGATION BAR */
.breadcrumb {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(13, 34, 56, 0.85);
    padding: 14px 22px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 25px;
    font-size: 18px;
    color: var(--gold-light);
}

.breadcrumb span {
    cursor: pointer;
    transition: color 0.2s;
}

.breadcrumb span:hover {
    color: #fff;
    text-decoration: underline;
}

.breadcrumb i {
    font-size: 14px;
    color: var(--muted);
}

/* TESTAMENTS GRID */
.testaments-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.testament-column {
    background: linear-gradient(145deg, rgba(17, 45, 72, 0.95), rgba(9, 29, 49, 0.95));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.testament-title {
    text-align: center;
    color: var(--gold-light);
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--gold);
}

/* BOOKS LIST */
.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
}

.book-btn {
    background: rgba(6, 17, 31, 0.7);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.25s ease;
    font-family: inherit;
}

.book-btn:hover {
    border-color: var(--gold);
    background: var(--card-hover);
    color: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

/* CHAPTERS GRID */
.chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 12px;
    margin-top: 20px;
}

.chapter-btn {
    background: rgba(17, 45, 72, 0.8);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    height: 50px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s ease;
}

.chapter-btn:hover {
    background: var(--gold);
    color: #000;
    transform: scale(1.08);
}

/* VERSES VIEW */
.verses-container {
    background: linear-gradient(135deg, rgba(20, 53, 84, 0.85), rgba(9, 29, 50, 0.95));
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 20px;
    padding: 30px;
    line-height: 2.2;
    font-size: 21px;
}

.verse-item {
    margin-bottom: 16px;
    border-bottom: 1px dashed rgba(212, 175, 55, 0.15);
    padding-bottom: 10px;
}

.verse-num {
    color: var(--gold);
    font-weight: bold;
    margin-left: 10px;
    font-size: 16px;
    background: rgba(212, 175, 55, 0.15);
    padding: 2px 8px;
    border-radius: 6px;
}

/* LOADING & ERROR STATES */
.loading-box {
    text-align: center;
    padding: 60px;
    font-size: 22px;
    color: var(--gold-light);
}

@media(max-width: 850px) {
    .testaments-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
 
<body>
 
<header>
    <div class="header-inner">
        <div class="brand" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" class="logo" alt="Logo">
            <h1>كنيسة رجاء الأمم سيدني</h1>
        </div>
        <a href="index.html" class="nav-back"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>
</header>
 
<main>
    <div class="breadcrumb" id="breadcrumb">
        <span onclick="showBooks()"><i class="fa-solid fa-book-bible"></i> الكتاب المقدس</span>
    </div>

    <div id="mainView">
        <div class="loading-box" id="loadingText">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الكتاب المقدس...
        </div>
    </div>
</main>

<script>
// أسماء الأسفار باللغة العربية النظيفة تماماً وبدون أي أرقام أو كلمات إنجليزية
const arabicBookNames = [
    // العهد القديم (39 سفر)
    "التكوين", "الخروج", "اللاويين", "العدد", "التثنية", "يشوع", "القضاة", "راعوث", 
    "صموئيل الأول", "صموئيل الثاني", "الملوك الأول", "الملوك الثاني", "أخبار الأيام الأول", "أخبار الأيام الثاني", 
    "عزرا", "نحميا", "أستير", "أيوب", "المزامير", "الأمثال", "الجامعة", "نشيد الأنشاد", 
    "إشعياء", "إرميا", "مراثي إرميا", "حزقيال", "دانيال", "هوشع", "يوئيل", "عاموس", 
    "عوبديا", "يونان", "ميخا", "ناحوم", "حبقوق", "صفنيا", "حجي", "زكريا", "ملاخي",
    // العهد الجديد (27 سفر)
    "متى", "مرقس", "لوقا", "يوحنا", "أعمال الرسل", "رومية", "كورنثوس الأولى", "كورنثوس الثانية", 
    "غلاطية", "أفسس", "فيلبي", "كولوسي", "تسالونيكي الأولى", "تسالونيكي الثانية", "تيموثاوس الأولى", 
    "تيموثاوس الثانية", "تيطس", "فليمون", "العبرانيين", "يعقوب", "بطرس الأولى", "بطرس الثانية", 
    "يوحنا الأولى", "يوحنا الثانية", "يوحنا الثالثة", "يهوذا", "رؤيا يوحنا"
];

let parsedBooks = [];
let currentBookIndex = null;
let currentChapterIndex = null;

// استخراج قائمة الأصحاحات من أي هيكل بيانات
function extractChapters(bookObj) {
    if (!bookObj) return [];
    if (Array.isArray(bookObj)) return bookObj;
    if (Array.isArray(bookObj.chapters)) return bookObj.chapters;
    if (Array.isArray(bookObj.Chapters)) return bookObj.Chapters;
    if (typeof bookObj === 'object') {
        const keys = Object.keys(bookObj).filter(k => k !== 'name' && k !== 'title' && k !== 'book');
        if (keys.length > 0) {
            // إذا كانت الأصحاحات مقسمة كمفاتيح أرقام
            return keys.map(k => bookObj[k]);
        }
    }
    return [];
}

// استخراج الآيات من الأصحاح
function extractVerses(chapterObj) {
    if (!chapterObj) return [];
    if (Array.isArray(chapterObj)) return chapterObj;
    if (Array.isArray(chapterObj.verses)) return chapterObj.verses;
    if (Array.isArray(chapterObj.Verses)) return chapterObj.Verses;
    if (typeof chapterObj === 'object') {
        return Object.values(chapterObj);
    }
    return [];
}

// تحميل بيانات الملف bible.json
async function loadBible() {
    try {
        const response = await fetch('bible.json');
        if (!response.ok) throw new Error("تعذر تحميل ملف البيانات");
        const rawBibleData = await response.json();

        let rawList = [];
        if (Array.isArray(rawBibleData)) {
            rawList = rawBibleData;
        } else if (rawBibleData && Array.isArray(rawBibleData.books)) {
            rawList = rawBibleData.books;
        } else if (rawBibleData && typeof rawBibleData === 'object') {
            rawList = Object.values(rawBibleData);
        }

        // إجبار الأسماء على العربية الصحيحة والنظيفة بفرض الترتيب القياسي
        parsedBooks = arabicBookNames.map((arabicName, idx) => {
            const rawItem = rawList[idx] || {};
            return {
                name: arabicName,
                chapters: extractChapters(rawItem)
            };
        });

        showBooks();
    } catch (error) {
        document.getElementById('mainView').innerHTML = `
            <div style="text-align:center; color:#ff6b6b; padding:40px; font-size:20px;">
                <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>
                حدث خطأ أثناء تحميل ملف البيانات (bible.json). يرجى التأكد من أن الملف موجود في المجلد الرئيسي.
            </div>`;
    }
}

// 1. عرض قائمة الأسفار (العهد القديم والعهد الجديد)
function showBooks() {
    currentBookIndex = null;
    currentChapterIndex = null;
    updateBreadcrumb();

    const otBooks = parsedBooks.slice(0, 39);
    const ntBooks = parsedBooks.slice(39);

    let html = `
    <div class="testaments-container">
        <div class="testament-column">
            <h2 class="testament-title"><i class="fa-solid fa-scroll"></i> العهد القديم</h2>
            <div class="books-grid">
                ${otBooks.map((book, idx) => `
                    <button class="book-btn" onclick="selectBook(${idx})">${book.name}</button>
                `).join('')}
            </div>
        </div>

        <div class="testament-column">
            <h2 class="testament-title"><i class="fa-solid fa-cross"></i> العهد الجديد</h2>
            <div class="books-grid">
                ${ntBooks.map((book, idx) => `
                    <button class="book-btn" onclick="selectBook(${idx + 39})">${book.name}</button>
                `).join('')}
            </div>
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// 2. اختيار السفر وعرض أصحاحاته فقط
function selectBook(bookIndex) {
    currentBookIndex = bookIndex;
    currentChapterIndex = null;
    updateBreadcrumb();

    const book = parsedBooks[bookIndex];
    const chapters = book.chapters;

    let html = `
    <div class="testament-column">
        <h2 class="testament-title">${book.name} — اختر الأصحاح</h2>
        <div class="chapters-grid">
            ${chapters.length > 0 ? chapters.map((_, cIdx) => `
                <button class="chapter-btn" onclick="selectChapter(${cIdx})">${cIdx + 1}</button>
            `).join('') : '<p style="text-align:center; width:100%; color:var(--muted)">لا توجد أصحاحات متاحة لهذا السفر.</p>'}
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// 3. اختيار الأصحاح وعرض الآيات بالعربية
function selectChapter(chapterIndex) {
    currentChapterIndex = chapterIndex;
    updateBreadcrumb();

    const book = parsedBooks[currentBookIndex];
    const rawChapter = book.chapters[chapterIndex];
    const verses = extractVerses(rawChapter);

    let html = `
    <div class="verses-container">
        <h2 class="testament-title" style="margin-bottom:25px;">
            ${book.name} — الأصحاح ${chapterIndex + 1}
        </h2>
        <div>
            ${verses.map((verse, vIdx) => {
                let verseText = "";
                if (typeof verse === 'string') {
                    verseText = verse;
                } else if (typeof verse === 'object' && verse !== null) {
                    verseText = verse.text || verse.Verse || verse.content || Object.values(verse)[0] || "";
                }
                return `
                <div class="verse-item">
                    <span class="verse-num">${vIdx + 1}</span>
                    <span>${verseText}</span>
                </div>`;
            }).join('')}
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// تحديث شريط التنقل العلوي (Breadcrumb)
function updateBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    let html = `<span onclick="showBooks()"><i class="fa-solid fa-book-bible"></i> الكتاب المقدس</span>`;
    
    if (currentBookIndex !== null) {
        const bookName = parsedBooks[currentBookIndex].name;
        html += ` <i class="fa-solid fa-chevron-left"></i> <span onclick="selectBook(${currentBookIndex})">${bookName}</span>`;
    }
    if (currentChapterIndex !== null) {
        html += ` <i class="fa-solid fa-chevron-left"></i> <span>الأصحاح ${currentChapterIndex + 1}</span>`;
    }
    
    bc.innerHTML = html;
}

// بدء التشغيل
loadBible();
</script>
 
</body>
</html>
