<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق الكتاب المقدس | Hope Church Bible Study</title>
<style>
:root{--bg:#071526;--card:#0d2138;--card2:#102a46;--gold:#d4af37;--gold2:#f2d675;--text:#f4f7fb;--muted:#9fb0c3;--line:#1d3b59;--blue:#2d7ff9}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#061321,#0b1d31);color:var(--text);font-family:Arial,"Tahoma",sans-serif}
header{padding:22px 5%;border-bottom:1px solid var(--line);background:#081727;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:22px;color:var(--gold2)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
main{max-width:1250px;margin:auto;padding:24px 4%}
.toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:20px}
input,select,button{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:12px;font-size:15px}
optgroup{background:var(--card2);color:var(--gold2);font-weight:bold}
option{background:var(--card);color:var(--text);font-weight:normal}
button{cursor:pointer;background:#153657;color:var(--text);border:1px solid var(--line)}
button:hover{border-color:var(--gold)}

.tabs{display:flex;gap:10px;margin-bottom:20px;align-items:center}
.badge{padding:6px 12px;border-radius:999px;background:#123354;color:var(--gold2);font-size:13px}

/* إعدادات التقسيم والبطاقات مثل الصورة */
.testaments-container{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.testament-section{background:rgba(13,33,56,.7);border:1px solid var(--line);border-radius:16px;padding:20px}
.section-header{display:flex;justify-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.section-header h2{margin:0;font-size:18px;color:var(--gold2)}
.section-header span{color:var(--muted);font-size:13px}

.books-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.book-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-between;cursor:pointer;transition:0.2s}
.book-card:hover{border-color:var(--gold);background:var(--card2)}
.book-info h4{margin:0;font-size:15px;color:var(--text)}
.book-info p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.book-icon{color:var(--gold);font-size:18px;opacity:0.8}

.panel{background:rgba(13,33,56,.94);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}
.status{color:var(--muted);margin-bottom:14px;font-size:14px}
.verse{border-bottom:1px solid #17344f;padding:15px 4px;line-height:2;font-size:18px}
.verse:last-child{border-bottom:0}
.vnum{color:var(--gold2);font-weight:bold;margin-left:8px}
.search-result{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#0b1c30}
.search-result b{color:var(--gold2)}

footer{text-align:center;color:var(--muted);padding:30px}
@media(max-width:850px){
  .testaments-container{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <h1>كنيسة رجاء الأمم سيدني</h1>
      <p>HOPE CHURCH BIBLE STUDY — الكتاب المقدس والدراسة الكتابية</p>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="ابحث في الكتاب المقدس...">
    <select id="book"></select>
    <select id="chapter"></select>
  </div>

  <div class="tabs">
    <button id="homeBtn">الأسفار والعهود</button>
    <button id="readBtn">قراءة السفر</button>
    <button id="searchBtn">نتائج البحث</button>
    <span class="badge" id="count">جاري التحميل...</span>
  </div>

  <!-- عرض الشبكة للعهود والأسفار -->
  <div id="gridSection" class="testaments-container">
    <div class="testament-section">
      <div class="section-header">
        <h2>العهد القديم</h2>
        <span>39 سفر</span>
      </div>
      <div id="otBooks" class="books-grid"></div>
    </div>
    
    <div class="testament-section">
      <div class="section-header">
        <h2>العهد الجديد</h2>
        <span>27 سفر</span>
      </div>
      <div id="ntBooks" class="books-grid"></div>
    </div>
  </div>

  <!-- عرض القراءة والبحث -->
  <section id="panelSection" class="panel" style="display:none;">
    <div id="status" class="status"></div>
    <div id="content"></div>
  </section>
</main>

<footer>Hope Church Sydney — Bible Study</footer>

<script>
const DATA_URL="bible_database.json";
let verses=[];
let books=[];

const $=id=>document.getElementById(id);
const normalize=s=>(s||"").toString().trim().toLowerCase();

function setStatus(t){$("status").textContent=t}

function uniqueBooks(data){
  const seen=new Set();
  return data.map(v=>v.book).filter(b=>b && !seen.has(b) && seen.add(b));
}

// قاموس المعالجة الشامل لأسماء الأسفار
function bookName(id){
  if (!id) return "";
  let raw = String(id).trim().toLowerCase();

  // تنظيف النص من أرقام الترتيب
  let clean = raw.replace(/^[\d]+-/, '').replace(/-[x\d]+$/g, '').replace(/-\d+-\d+$/g, '');

  const dict = {
    // العهد القديم
    "gen":"التكوين","genesis":"التكوين",
    "exodus":"الخروج","ex":"الخروج",
    "leviticus":"اللاويين","lev":"اللاويين",
    "numbers":"العدد","num":"العدد",
    "deut":"التثنية","deuteronomy":"التثنية",
    "joshua":"يشوع",
    "judges":"القضاة",
    "ruth":"راعوث",
    "samuel-09-1":"صموئيل الأول","samuel-1":"صموئيل الأول",
    "samuel-10-2":"صموئيل الثاني","samuel-2":"صموئيل الثاني",
    "kings-11-1":"الملوك الأول","kings-1":"الملوك الأول",
    "kings-12-2":"الملوك الثاني","kings-2":"الملوك الثاني",
    "chronicles-13-1":"أخبار الأيام الأول","chronicles-1":"أخبار الأيام الأول",
    "chronicles-14-2":"أخبار الأيام الثاني","chronicles-2":"أخبار الأيام الثاني",
    "ezra":"عزرا",
    "nehemiah":"نحميا","nehmiah":"نحميا",
    "esther":"أستير",
    "job":"أيوب",
    "psalms":"المزامير","psalm":"المزامير",
    "proverbs":"الأمثال","prov":"الأمثال",
    "ecclesiastes":"الجامعة",
    "sos":"نشيد الأنشاد","song":"نشيد الأنشاد","song-of-solomon":"نشيد الأنشاد",
    "isiah":"إشعياء","isaiah":"إشعياء",
    "jeremiah":"إرميا",
    "lamentations":"مراثي إرميا",
    "ezekiel":"حزقيال",
    "daniel":"دانيال",
    "hosea":"هوشع",
    "joel":"يوئيل",
    "amos":"عاموس",
    "obadiah":"عوبديا",
    "jonah":"يونان",
    "micah":"ميخا",
    "nahum":"ناحوم",
    "habakkuk":"حبقوق","habakuk":"حبقوق",
    "zephaniah":"صفنيا",
    "haggai":"حجي",
    "zechariah":"زكريا",
    "malachi":"ملاخي",

    // العهد الجديد
    "matthew":"متى","matt":"متى",
    "mark":"مرقس",
    "luke":"لوقا",
    "john":"يوحنا",
    "acts":"أعمال الرسل",
    "romans":"رومية",
    "corinthians-46-1":"كورنثوس الأولى","corinthians-1":"كورنثوس الأولى",
    "corinthians-47-2":"كورنثوس الثانية","corinthians-2":"كورنثوس الثانية",
    "galatians":"غلاطية",
    "ephesians":"أفسس",
    "philipians":"فيليبي","philippians":"فيليبي",
    "colossians":"كولوسي",
    "thessalonians-52-1":"تسالونيكي الأولى","thessalonians-1":"تسالونيكي الأولى",
    "thessalonians-53-2":"تسالونيكي الثانية","thessalonians-2":"تسالونيكي الثانية",
    "timothy-54-1":"تيموثاوس الأولى","timothy-1":"تيموثاوس الأولى",
    "timothy-55-2":"تيموثاوس الثانية","timothy-2":"تيموثاوس الثانية",
    "titus":"طيطس",
    "phillemon":"فليمون","philemon":"فليمون",
    "hebrews":"العبرانيين",
    "james":"يعقوب",
    "peter-60-1":"بطرس الأولى","peter-1":"بطرس الأولى",
    "peter-61-2":"بطرس الثانية","peter-2":"بطرس الثانية",
    "john-62-1":"يوحنا الأولى","john-1":"يوحنا الأولى",
    "john-63-2":"يوحنا الثانية","john-2":"يوحنا الثانية",
    "john-64-3":"يوحنا الثالثة","john-3":"يوحنا الثالثة",
    "jude":"يهوذا",
    "revelation":"رؤيا يوحنا"
  };

  return dict[raw] || dict[clean] || String(id).trim();
}

function isNewTestament(id){
  let raw = String(id).trim().toLowerCase();
  const ntKeys = ["matthew","mark","luke","john","acts","romans","corinthians","galatians","ephesians","philippians","philipians","colossians","thessalonians","timothy","titus","philemon","phillemon","hebrews","james","peter","jude","revelation"];
  return ntKeys.some(k => raw.includes(k));
}

function fillBooksDropdown(){
  const ot = books.filter(b => !isNewTestament(b));
  const nt = books.filter(b => isNewTestament(b));

  let html = '<option value="">اختر السفر</option>';
  if(ot.length){
    html += '<optgroup label="─── العهد القديم ───">';
    html += ot.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(bookName(b))}</option>`).join("");
    html += '</optgroup>';
  }
  if(nt.length){
    html += '<optgroup label="─── العهد الجديد ───">';
    html += nt.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(bookName(b))}</option>`).join("");
    html += '</optgroup>';
  }
  $("book").innerHTML = html;
}

function renderGrid(){
  const ot = books.filter(b => !isNewTestament(b));
  const nt = books.filter(b => isNewTestament(b));

  const renderCard = b => {
    const totalCh = [...new Set(verses.filter(v=>v.book===b).map(v=>v.chapter))].length;
    return `
      <div class="book-card" onclick="selectBook('${escapeHtml(b)}')">
        <div class="book-info">
          <h4>${escapeHtml(bookName(b))}</h4>
          <p>${totalCh} إصحاح</p>
        </div>
        <div class="book-icon">📖</div>
      </div>
    `;
  };

  $("otBooks").innerHTML = ot.map(renderCard).join("");
  $("ntBooks").innerHTML = nt.map(renderCard).join("");
}

function selectBook(b){
  $("book").value = b;
  fillChapters();
  $("chapter").value = "1";
  showPanel();
  renderChapter();
}

function fillChapters(){
  const b=$("book").value;
  const nums=[...new Set(verses.filter(v=>v.book===b).map(v=>Number(v.chapter)))].sort((a,b)=>a-b);
  $("chapter").innerHTML='<option value="">اختر الإصحاح</option>'+
    nums.map(n=>`<option value="${n}">${n}</option>`).join("");
}

function showGrid(){
  $("gridSection").style.display = "grid";
  $("panelSection").style.display = "none";
}

function showPanel(){
  $("gridSection").style.display = "none";
  $("panelSection").style.display = "block";
}

function renderChapter(){
  const b=$("book").value, c=Number($("chapter").value);
  if(!b||!c){return}
  showPanel();
  const rows=verses.filter(v=>v.book===b && Number(v.chapter)===c);
  $("status").textContent=`${bookName(b)} — الإصحاح ${c} — ${rows.length} آية`;
  $("content").innerHTML=rows.map(v=>`
    <div class="verse"><span class="vnum">${escapeHtml(v.verse)}</span>${escapeHtml(v.text)}</div>
  `).join("");
}

function searchBible(q){
  q=normalize(q);
  if(!q){renderChapter();return}
  showPanel();
  const hits=verses.filter(v=>normalize(v.text).includes(q)).slice(0,200);
  $("status").textContent=`نتائج البحث عن: ${q} — ${hits.length} نتيجة معروضة`;
  $("content").innerHTML=hits.map(v=>`
    <div class="search-result">
      <b>${escapeHtml(bookName(v.book))} ${escapeHtml(v.chapter)}:${escapeHtml(v.verse)}</b>
      <div style="line-height:1.9;margin-top:6px">${escapeHtml(v.text)}</div>
    </div>
  `).join("") || "<p>لا توجد نتائج.</p>";
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function boot(){
  try{
    const r=await fetch(DATA_URL,{cache:"reload"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    verses=data.filter(v=>v && v.book && v.chapter && v.verse && v.text);
    books=uniqueBooks(verses);
    fillBooksDropdown();
    renderGrid();
    $("count").textContent=`${verses.length.toLocaleString("ar-EG")} سجل`;
  }catch(e){
    console.error(e);
  }
}

$("book").addEventListener("change",()=>{fillChapters();renderChapter()});
$("chapter").addEventListener("change",renderChapter);
$("search").addEventListener("input",e=>searchBible(e.target.value));
$("readBtn").addEventListener("click",()=>renderChapter());
$("searchBtn").addEventListener("click",()=>searchBible($("search").value));
$("homeBtn").addEventListener("click",showGrid);

boot();
</script>
</body>
</html>
