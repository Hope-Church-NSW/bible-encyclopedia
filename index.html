                                <div key={index} className="text-sm border-r-4 border-amber-500 bg-slate-50 dark:bg-slate-700 p-3 rounded-l-md">
                                  <span className="font-bold text-blue-900 dark:text-blue-300 block">{mt.day} - {mt.time}</span>
                                  <span className="text-slate-600 dark:text-slate-300">{mt.event}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                        <div className="space-y-6">
                          <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg flex flex-col items-center text-center">
                            <h2 className="text-xl font-bold mb-4 text-blue-900 dark:text-white">{isArabic ? 'امسح الباركود لزيارتنا' : 'Scan QR Code'}</h2>
                            <img src={qrCodeUrl} alt="QR Code" className="w-40 h-40 object-contain rounded-lg shadow-md" />
                          </div>
                          <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg">
                            <h2 className="text-xl font-bold mb-4 text-blue-900 dark:text-white text-center">{c.linksTitle}</h2>
                            <div className="grid grid-cols-2 gap-4">
                              {churchLinks.map((link) => (
                                <a key={link.name} href={link.url} target="_blank" rel="noopener noreferrer" className={`${link.color} text-white p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition-transform hover:scale-105 shadow-md`}>
                                  <span className="text-3xl">{link.icon}</span>
                                  <span className="text-sm font-bold">{link.name}</span>
                                </a>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {['search'].includes(currentView) && (
                     <div className="max-w-4xl mx-auto bg-white dark:bg-slate-800 p-10 rounded-xl shadow-lg text-center">
                        <button onClick={() => setCurrentView('home')} className="mb-6 text-blue-600 hover:underline block mx-auto">{c.backHome}</button>
                        <h2 className="text-2xl font-bold text-blue-900 dark:text-white">🚧 {isArabic ? 'قسم قيد التطوير' : 'Section Under Development'}</h2>
                     </div>
                  )}
                </main>

                {/* ===== النافذة المنبثقة للآية ===== */}
                {selectedVerse && (
                  <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={() => setSelectedVerse(null)}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-lg w-full p-6 relative" onClick={(e) => e.stopPropagation()}>
                      <button className="absolute top-4 left-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" onClick={() => setSelectedVerse(null)}>✖</button>
                      <p className="text-xl font-bold mb-6 text-blue-900 dark:text-amber-400 border-b pb-4">{isArabic ? selectedVerse.text_ar : selectedVerse.text_en}</p>
                      <div className="mb-6">
                        <p className="text-sm font-semibold mb-2 text-slate-500">{isArabic ? 'تظليل الآية:' : 'Highlight Verse:'}</p>
                        <div className="flex gap-2">
                          <button onClick={() => highlightVerse(selectedVerse.id, highlightColors.yellow)} className="w-8 h-8 rounded-full border-2 border-white shadow" style={{ backgroundColor: highlightColors.yellow }}></button>
                          <button onClick={() => highlightVerse(selectedVerse.id, highlightColors.neon)} className="w-8 h-8 rounded-full border-2 border-white shadow" style={{ backgroundColor: highlightColors.neon }}></button>
                          <button onClick={() => highlightVerse(selectedVerse.id, highlightColors.blue)} className="w-8 h-8 rounded-full border-2 border-white shadow" style={{ backgroundColor: highlightColors.blue }}></button>
                          <button onClick={() => highlightVerse(selectedVerse.id, null)} className="text-xs px-2 h-8 rounded-lg bg-slate-200 dark:bg-slate-600">{isArabic ? 'إزالة' : 'Clear'}</button>
                        </div>
                      </div>
                      <div>
                        <h3 className="font-bold text-blue-700 dark:text-blue-300 mb-2">{isArabic ? 'التفاسير:' : 'Commentaries:'}</h3>
                        {commentariesData[selectedVerse.id] ? (
                          <div className="space-y-3 max-h-40 overflow-y-auto">
                            {commentariesData[selectedVerse.id].map((com, idx) => (
                              <div key={idx} className="p-3 bg-slate-100 dark:bg-slate-700 rounded-lg">
                                <p className="font-bold text-sm text-blue-900 dark:text-amber-400">{com.author}</p>
                                <p className="text-sm text-slate-600 dark:text-slate-300 mt-1">{com.text}</p>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <p className="text-sm text-slate-400">{isArabic ? 'لا يوجد تفاسير لهذه الآية حالياً.' : 'No commentaries for this verse currently.'}</p>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
