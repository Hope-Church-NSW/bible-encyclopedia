<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس | Hope Church NSW</title>

<!-- استدعاء خط عربي فاخر يدعم المجسمات والتأثيرات -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#06111f;
    --card:#0d2238;
    --card-hover:#143554;
    --gold:#d4af37;
    --gold-light:#f4d76b;
    --gold-glow: rgba(212, 175, 55, 0.4);
    --blue:#35a7ff;
    --text:#f5f7fa;
    --muted:#9eafc1;
    --border:#1d3d5c;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#123457 0%,transparent 45%),
        linear-gradient(145deg,#040c17,#091d32 60%,#051220);
    color:var(--text);
    font-family: 'Cairo', Arial, Tahoma, sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header{
    padding:16px 6%;
    border-bottom:1px solid var(--border);
    background:rgba(5,16,29,.92);
    backdrop-filter:blur(12px);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:18px;
}

/* تعديل اللوجو: تكبير الحجم وإزالة الإطار الدائري */
.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    background:transparent;
    border:none;
    box-shadow:none;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
}

/* خط 3D متدرج باللون الذهبي الخالص لاسم الكنيسة */
.brand h1{
    margin:0;
    font-size:32px;
    font-weight: 900;
    font-family: 'Cairo', sans-serif;
    
    background: linear-gradient(180deg, #ffe893 0%, #f4d76b 35%, #ca9e2e 70%, #8a640f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    filter: drop-shadow(0px 2px 0px #5c4308) 
            drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
    
    letter-spacing: 0.5px;
}

/* LANGUAGE BUTTONS */

.language{
    display:flex;
    gap:6px;
}

.language button{
    border:1px solid var(--border);
    background:#102943;
    color:var(--text);
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight: bold;
    font-family: 'Cairo', sans-serif;
    transition: all 0.3s ease;
}

.language button.active{
    background:var(--gold);
    color:#09121d;
    box-shadow: 0 0 12px var(--gold-glow);
}

/* MAIN */

main{
    max-width:1200px;
    margin:auto;
    padding:40px 6%;
}

/* WELCOME */

.welcome{
    text-align:center;
    margin-bottom:35px;
}

.welcome h2{
    margin:0;
    font-size:36px;
    color:var(--gold-light);
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    font-weight: 900;
}

.welcome p{
    color:var(--muted);
    font-size:16px;
    margin:12px auto;
    max-width:700px;
    line-height:1.8;
}

/* 3D VERSE CONTAINER */

.verse-3d-wrapper {
    perspective: 1000px;
    max-width: 820px;
    margin: 35px auto 45px;
}

.verse-card {
    position: relative;
    padding: 28px 32px;
    background: linear-gradient(135deg, rgba(20, 53, 84, 0.7), rgba(9, 29, 50, 0.85));
    border-radius: 20px;
    border: 1px solid rgba(212, 175, 55, 0.4);
    box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.2),
        inset 0 -2px 10px rgba(0, 0, 0, 0.5),
        0 0 25px rgba(212, 175, 55, 0.15);
    transform-style: preserve-3d;
    transform: rotateX(4deg) translateZ(0);
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease;
    backdrop-filter: blur(8px);
    overflow: hidden;
}

.verse-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(212, 175, 55, 0.12) 50%,
        transparent 55%
    );
    animation: goldShimmer 7s infinite linear;
    pointer-events: none;
}

@keyframes goldShimmer {
    0% { transform: translate(-30%, -30%) rotate(0deg); }
    100% { transform: translate(30%, 30%) rotate(360deg); }
}

.verse-card:hover {
    transform: rotateX(0deg) translateY(-8deg) scale(1.01);
    box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        0 0 35px rgba(212, 175, 55, 0.3);
}

.verse-text {
    font-size: 24px;
    line-height: 1.9;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 12px rgba(244, 215, 107, 0.2);
    font-weight: 700;
    position: relative;
    z-index: 2;
}

.reference {
    display: block;
    color: var(--gold-light);
    margin-top: 14px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 2;
}

/* MENU GRID */

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.menu-card{
    min-height:200px;
    border:1px solid var(--border);
    border-radius:18px;
    background: linear-gradient(145deg,rgba(17,45,72,.95),rgba(9,29,49,.95));
    color:var(--text);
    cursor:pointer;
    transition: all .3s cubic-bezier(0.2, 0.8, 0.2, 1);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.menu-card:hover{
    transform:translateY(-8px);
    border-color:var(--gold);
    background:var(--card-hover);
    box-shadow:0 18px 45px rgba(0,0,0,.5), 0 0 20px rgba(212,175,55,0.2);
}

.icon{
    width:70px;
    height:70px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    margin-bottom:18px;
    color:var(--gold-light);
    border:1px solid rgba(212,175,55,.5);
    background:rgba(212,175,55,.08);
    box-shadow: inset 0 0 10px rgba(212,175,55,0.2);
}

.menu-card h3{
    margin:0 0 8px;
    color:var(--gold-light);
    font-size:20px;
    font-weight: bold;
}

.menu-card p{
    margin:0;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

/* FOOTER */

footer{
    margin-top:50px;
    padding:25px 6%;
    border-top:1px solid var(--border);
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

/* MOBILE RESPONSIVE */

@media(max-width:900px){
    .menu{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    header{ padding:14px 5%; }
    .brand h1{ font-size:22px; }
    .logo{ width:60px; height:60px; }
    main{ padding:30px 5%; }
    .welcome h2{ font-size:26px; }
    .verse-text{ font-size:18px; }
    .menu{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <img
                src="assets/logo.png"
                class="logo"
                alt="Logo">

            <h1 id="churchTitleHeader">كنيسة رجاء الأمم سيدني</h1>
        </div>

        <div class="language">
            <button id="arBtn" class="active" onclick="setLanguage('ar')">العربية</button>
            <button id="enBtn" onclick="setLanguage('en')">English</button>
        </div>
    </div>
</header>

<main>
    <section class="welcome">
        <h2 id="welcomeTitle">أهلاً بكم في موسوعة الكتاب المقدس</h2>
        <p id="welcomeText">موسوعة كتابية متكاملة للدارسين والباحثين وكل من يشتاق إلى دراسة كلمة الله بعمق ودقة.</p>

        <div class="verse-3d-wrapper">
            <div class="verse-card">
                <div class="verse-text" id="verseText">«سِرَاجٌ لِرِجْلِي كَلَامُكَ وَنُورٌ لِسَبِيلِي»</div>
                <span class="reference" id="verseReference">مزمور 119:105</span>
            </div>
        </div>
    </section>

    <section class="menu">
        <button class="menu-card" onclick="openBible()">
            <div class="icon">📖</div>
            <h3 id="bibleTitle">الكتاب المقدس</h3>
            <p id="bibleText">قراءة الأسفار والأصحاحات والآيات</p>
        </button>

        <button class="menu-card" onclick="openSearch()">
            <div class="icon">🔎</div>
            <h3 id="searchTitle">البحث</h3>
            <p id="searchText">البحث في نص الكتاب المقدس</p>
        </button>

        <button class="menu-card" onclick="openStudies()">
            <div class="icon">📚</div>
            <h3 id="studiesTitle">دراسات كتابية</h3>
            <p id="studiesText">موضوعات ودراسات وموسوعة كتابية</p>
        </button>

        <button class="menu-card" onclick="openChurch()">
            <div class="icon">⛪</div>
            <h3 id="churchTitle">الكنيسة</h3>
            <p id="churchText">معلومات الكنيسة ومواعيد الاجتماعات</p>
        </button>
    </section>
</main>

<footer id="footerText">
    Hope Church NSW — Bible Study
</footer>

<script>
let language = "ar";

const translations = {
    ar: {
        direction: "rtl",
        churchTitleHeader: "كنيسة رجاء الأمم سيدني",
        welcomeTitle: "أهلاً بكم في موسوعة الكتاب المقدس",
        welcomeText: "موسوعة كتابية متكاملة للدارسين والباحثين وكل من يشتاق إلى دراسة كلمة الله بعمق ودقة.",
        verse: "«سِرَاجٌ لِرِجْلِي كَلَامُكَ وَنُورٌ لِسَبِيلِي»",
        reference: "مزمور 119:105",
        bibleTitle: "الكتاب المقدس",
        bibleText: "قراءة الأسفار والأصحاحات والآيات",
        searchTitle: "البحث",
        searchText: "البحث في نص الكتاب المقدس",
        studiesTitle: "دراسات كتابية",
        studiesText: "موضوعات ودراسات وموسوعة كتابية",
        churchTitle: "الكنيسة",
        churchText: "معلومات الكنيسة ومواعيد الاجتماعات",
        footer: "Hope Church NSW — Bible Study"
    },
    en: {
        direction: "ltr",
        churchTitleHeader: "Hope Church NSW",
        welcomeTitle: "Welcome to the Bible Encyclopedia",
        welcomeText: "A comprehensive Bible study encyclopedia for students, researchers, and everyone passionate about God's Word.",
        verse: "\"Your word is a lamp to my feet and a light to my path.\"",
        reference: "Psalm 119:105",
        bibleTitle: "Holy Bible",
        bibleText: "Read books, chapters, and verses",
        searchTitle: "Search",
        searchText: "Search the Bible text",
        studiesTitle: "Bible Studies",
        studiesText: "Studies, topics, and Bible encyclopedia",
        churchTitle: "Church",
        churchText: "Church information and meeting times",
        footer: "Hope Church NSW — Bible Study"
    }
};

function setLanguage(lang){
    language = lang;
    const t = translations[lang];

    document.documentElement.lang = lang;
    document.documentElement.dir = t.direction;
    document.body.dir = t.direction;

    $("churchTitleHeader").textContent = t.churchTitleHeader;
    $("welcomeTitle").textContent = t.welcomeTitle;
    $("welcomeText").textContent = t.welcomeText;
    $("verseText").textContent = t.verse;
    $("verseReference").textContent = t.reference;
    $("bibleTitle").textContent = t.bibleTitle;
    $("bibleText").textContent = t.bibleText;
    $("searchTitle").textContent = t.searchTitle;
    $("searchText").textContent = t.searchText;
    $("studiesTitle").textContent = t.studiesTitle;
    $("studiesText").textContent = t.studiesText;
    $("churchTitle").textContent = t.churchTitle;
    $("churchText").textContent = t.churchText;
    $("footerText").textContent = t.footer;

    $("arBtn").classList.toggle("active", lang === "ar");
    $("enBtn").classList.toggle("active", lang === "en");
}

function $(id){
    return document.getElementById(id);
}

function openBible(){ window.location.href = "bible.html"; }
function openSearch(){ window.location.href = "search.html"; }
function openStudies(){ window.location.href = "studies.html"; }
function openChurch(){ window.location.href = "church.html"; }
</script>

</body>
</html>
