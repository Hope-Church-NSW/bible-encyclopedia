<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الكتاب المقدس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #fbbf24;
            margin-bottom: 20px;
        }
        .selector {
            margin-bottom: 25px;
            text-align: center;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #ffffff;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }
        .book-title {
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        .text-content {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 18px;
            white-space: pre-line;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>الكتاب المقدس</h1>

    <div class="selector">
        <select id="bookSelect" onchange="displayBook()">
            <option value="">-- اختر السفر --</option>
        </select>
    </div>

    <div id="loading" class="loading">جاري تحميل البيانات...</div>
    
    <div id="displayArea" style="display: none;">
        <h2 id="bookTitle" class="book-title"></h2>
        <div id="bookContent" class="text-content"></div>
    </div>
</div>

<script>
    let bibleData = [];

    // جلب ملف bible.json
    fetch('./bible.json')
        .then(response => {
            if (!response.ok) throw new Error("تعذر تحميل ملف bible.json");
            return response.json();
        })
        .then(data => {
            bibleData = data;
            document.getElementById('loading').style.display = 'none';
            populateDropdown();
        })
        .catch(err => {
            document.getElementById('loading').innerText = "حدث خطأ أثناء تحميل البيانات: " + err.message;
        });

    // ملء قائمة الأسفار المنسدلة
    function populateDropdown() {
        const select = document.getElementById('bookSelect');
        bibleData.forEach((book, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = book.book;
            select.appendChild(option);
        });
        
        // عرض أول سفر تلقائياً عند الفتح
        if (bibleData.length > 0) {
            select.value = 0;
            displayBook();
        }
    }

    // عرض محتوى السفر المحدد
    function displayBook() {
        const select = document.getElementById('bookSelect');
        const selectedIndex = select.value;

        if (selectedIndex === "") return;

        const book = bibleData[selectedIndex];
        document.getElementById('bookTitle').textContent = book.book;
        
        // تجميع محتوى السفر
        if (Array.isArray(book.content)) {
            document.getElementById('bookContent').innerText = book.content.join('\n');
        } else {
            document.getElementById('bookContent').innerText = book.content;
        }

        document.getElementById('displayArea').style.display = 'block';
    }
</script>

</body>
</html>
