<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كنيسة رجاء الأمم سيدني | Hope Church NSW</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [isArabic, setIsArabic] = useState(true);
      const [isDark, setIsDark] = useState(false);
      const [currentView, setCurrentView] = useState('home');

      const churchLogoUrl = "https://z-cdn-media.chatglm.cn/files/4db28f75-70f7-4885-8556-16efe0859236.png?auth_key=1885580462-f4f57363df7e4e70ac6a8c1b11073a67-0-694a16048f511a71541e00b0b65ff427";

      const content = {
        ar: {
          dir: 'rtl',
          churchName: 'كنيسة رجاء الأمم سيدني',
          churchSubName: 'Hope Church NSW',
          welcomeTitle: 'مرحباً بكم في كنيستنا',
          welcomeText: 'كنيسة رجاء الأمم سيدني هي كنيسة مسيحية عربية إنجيلية مؤسسة على كلمة الله والكتاب المقدس، وتهدف إلى ربح النفوس وبنيان جسد المسيح.',
          cards: [
            { id: 'bible', icon: '📖', title: 'الكتاب المقدس', desc: 'عربي فان دايك وإنجليزي KJV' },
            { id: 'search', icon: '🔍', title: 'بحث في الكتاب المقدس', desc: 'ابحث في النصوص بسهولة' },
            { id: 'studies', icon: '💡', title: 'دراسات وموسوعة الكتاب', desc: 'دراسات وموسوعة الكتاب المقدس' },
            { id: 'church', icon: '⛪', title: 'الكنيسة', desc: 'العنوان، المواعيد، والروابط' },
          ]
        },
        en: {
          dir: 'ltr',
          churchName: 'Hope Church NSW',
          churchSubName: 'كنيسة رجاء الأمم سيدني',
          welcomeTitle: 'Welcome to Our Church',
          welcomeText: 'Hope Church NSW is an Arabic Evangelical Christian church founded on the Word of God and the Bible.',
          cards: [
            { id: 'bible', icon: '📖', title: 'The Bible', desc: 'Arabic Van Dyck & English KJV' },
            { id: 'search', icon: '🔍', title: 'Bible Search', desc: 'Search the texts easily' },
            { id: 'studies', icon: '💡', title: 'Bible Studies', desc: 'Bible Studies & Encyclopedia' },
            { id: 'church', icon: '⛪', title: 'Our Church', desc: 'Address, times, and links' },
          ]
        }
      };

      const c = isArabic ? content.ar : content.en;

      return (
        <div class={isDark ? "dark" : ""}>
          <div class="min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 p-4 md:p-8" dir={c.dir}>
            
            {/* Header */}
            <header class="flex justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-xl shadow-md mb-6">
              <div class="flex items-center gap-3">
                <img src={churchLogoUrl} alt="Logo" class="w-12 h-12 object-contain" />
                <div>
                  <h1 class="font-bold text-lg md:text-xl text-blue-900 dark:text-blue-300">{c.churchName}</h1>
                  <p class="text-xs text-slate-500 dark:text-slate-400">{c.churchSubName}</p>
                </div>
              </div>

              <div class="flex gap-2">
                <button onClick={() => setIsArabic(!isArabic)} class="px-3 py-1 bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 rounded-lg text-sm font-bold">
                  {isArabic ? 'EN' : 'عربي'}
                </button>
                <button onClick={() => setIsDark(!isDark)} class="px-3 py-1 bg-slate-200 dark:bg-slate-700 rounded-lg text-sm">
                  {isDark ? '☀️' : '🌙'}
                </button>
              </div>
            </header>

            {/* Welcome Section */}
            <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-6 rounded-xl shadow-lg mb-8">
              <h2 class="text-2xl font-bold mb-2">{c.welcomeTitle}</h2>
              <p class="text-slate-200 leading-relaxed max-w-4xl">{c.welcomeText}</p>
            </div>

            {/* Main Cards Grid */}
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
              {c.cards.map((card) => (
                <div key={card.id} class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 hover:shadow-xl transition-all cursor-pointer">
                  <div class="text-4xl mb-3">{card.icon}</div>
                  <h3 class="font-bold text-lg mb-1 text-slate-900 dark:text-white">{card.title}</h3>
                  <p class="text-sm text-slate-600 dark:text-slate-400">{card.desc}</p>
                </div>
              ))}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
