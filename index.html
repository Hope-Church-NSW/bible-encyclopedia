<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1d31;
    --card:#0d243d;
    --card2:#102d4b;
    --gold:#d4af37;
    --gold2:#f4d875;
    --text:#f5f7fa;
    --muted:#a9b8c8;
    --line:#23415d;
    --blue:#277df5;
    --danger:#ef6b6b;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#12385c 0,#061321 45%,#030b14 100%);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
}

button,
select,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,17,30,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    min-height:88px;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
}

.logo{
    width:62px;
    height:62px;
    object-fit:contain;
    border-radius:50%;
    filter:drop-shadow(0 0 12px rgba(212,175,55,.35));
}

.brand-text{
    min-width:0;
}

.brand-ar{
    display:block;
    color:var(--gold2);
    font-size:25px;
    font-weight:800;
    line-height:1.25;
}

.brand-en{
    display:block;
    color:#d9e4ef;
    font-size:15px;
    margin-top:3px;
}

.home-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--gold2);
    border-radius:12px;
    padding:11px 17px;
    font-size:15px;
    text-decoration:none;
    white-space:nowrap;
}

.home-btn:hover{
    border-color:var(--gold);
}

.container{
    width:min(1200px,94%);
    margin:auto;
    padding:28px 0 60px;
}

.page-title{
    text-align:center;
    margin:10px 0 8px;
    color:var(--gold2);
    font-size:30px;
}

.page-subtitle{
    text-align:center;
    color:var(--muted);
    margin:0 0 25px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    background:rgba(13,36,61,.88);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
}

.control{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.control label{
    color:var(--gold2);
    font-weight:bold;
    font-size:14px;
}

select,
input{
    width:100%;
    border:1px solid var(--line);
    background:#081a2c;
    color:var(--text);
    border-radius:11px;
    padding:13px;
    font-size:16px;
    outline:none;
}

select:focus,
input:focus{
    border-color:var(--gold);
}

.search-box{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.search-box button{
    border:1px solid var(--line);
    background:#153b61;
    color:white;
    border-radius:11px;
    padding:0 22px;
}

.status{
    border:1px solid var(--line);
    background:rgba(13,36,61,.8);
    border-radius:13px;
    padding:14px;
    margin-bottom:18px;
    color:var(--muted);
    text-align:center;
}

.status.success{
    border-color:#286e50;
    color:#a8e6c5;
}

.status.error{
    border-color:#703d3d;
    color:#ffaaaa;
}

.reader{
    display:none;
    background:rgba(8,25,42,.92);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
}

.reader.visible{
    display:block;
}

.reader-head{
    padding:18px 20px;
    background:linear-gradient(135deg,#102f4f,#0b2037);
    border-bottom:1px solid var(--line);
}

.reader-title{
    margin:0;
    color:var(--gold2);
    font-size:24px;
}

.chapter-bar{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    padding:15px;
    border-bottom:1px solid var(--line);
    background:#091a2c;
}

.chapter-btn{
    min-width:43px;
    border:1px solid var(--line);
    background:#102a44;
    color:#dce7f1;
    border-radius:9px;
    padding:8px 10px;
}

.chapter-btn:hover,
.chapter-btn.active{
    background:var(--gold);
    color:#111;
    border-color:var(--gold);
}

.verses{
    padding:12px 20px 25px;
}

.verse{
    padding:18px 8px;
    border-bottom:1px solid #17334d;
    line-height:2.15;
    font-size:19px;
    cursor:pointer;
    transition:.2s;
}

.verse:hover{
    background:rgba(212,175,55,.07);
}

.verse-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:34px;
    height:30px;
    padding:0 7px;
    margin-left:8px;
    border-radius:8px;
    background:#153a5d;
    color:var(--gold2);
    font-weight:bold;
    font-size:14px;
    vertical-align:middle;
}

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);
    max-height:88vh;
    overflow:auto;
    background:#0b2035;
    border:1px solid var(--gold);
    border-radius:20px;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:17px 20px;
    border-bottom:1px solid var(--line);
}

.modal-head h2{
    margin:0;
    color:var(--gold2);
    font-size:21px;
}

.close-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#152f49;
    color:white;
    font-size:20px;
}

.modal-body{
    padding:25px;
    line-height:2.2;
    font-size:19px;
}

.modal-reference{
    color:var(--gold);
    font-weight:bold;
    margin-bottom:12px;
}

.modal-verse{
    color:white;
}

.back-home{
    display:block;
    width:max-content;
    margin:25px auto 0;
    padding:11px 20px;
    border-radius:11px;
    background:#153b61;
    border:1px solid var(--line);
    color:white;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:30px 15px;
    color:var(--muted);
    border-top:1px solid var(--line);
}

@media(max-width:700px){

    .header-inner{
        padding:10px 13px;
    }

    .logo{
        width:50px;
        height:50px;
    }

    .brand-ar{
        font-size:18px;
    }

    .brand-en{
        font-size:11px;
    }

    .home-btn{
        font-size:12px;
        padding:9px 10px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:24px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        padding:12px;
    }

    .verse{
        font-size:17px;
    }
}
</style>
</head>

<script>

/* =========================================================

const BIBLE_FILE = "bible.json";


/* =========================================================

const BOOKS = [

{id:"62-1joh",name:"يوحنا الأولى"},

{id:"64-3joh",name:"يوحنا الثالثة"},
{id:"65-jud",name:"يهوذا"},
{id:"66-rev",name:"رؤيا يوحنا"}

];


/* =========================================================
   CHAPTER COUNTS
========================================================= */

const CHAPTER_COUNTS = {

"01-gen":50,
"02-exo":40,
"03-lev":27,
"04-num":36,
"05-deu":34,
"06-jos":24,
"07-jdg":21,
"08-rut":4,
"09-1sam":31,
"10-2sam":24,
"11-1kgs":22,
"12-2kgs":25,
"13-1chr":29,
"14-2chr":36,
"15-ezr":10,
"16-neh":13,
"17-est":10,
"18-job":42,
"19-psa":150,
"20-pro":31,
"21-ecc":12,
"22-son":8,
"23-isa":66,
"24-jer":52,
"25-lam":5,
"26-eze":48,
"27-dan":12,
"28-hos":14,
"29-joe":3,
"30-amo":9,
"31-oba":1,
"32-jon":4,
"33-mic":7,
"34-nah":3,
"35-hab":3,
"36-zep":3,
"37-hag":2,
"38-zec":14,
"39-mal":4,

"40-mat":28,
"41-mar":16,
"42-luk":24,
"43-joh":21,
"44-act":28,
"45-rom":16,
"46-1cor":16,
"47-2cor":13,
"48-gal":6,
"49-eph":6,
"50-phi":4,
"51-col":4,
"52-1the":5,
"53-2the":3,
"54-1tim":6,
"55-2tim":4,
"56-tit":3,
"57-phm":1,
"58-heb":13,
"59-jam":5,
"60-1pet":5,
"61-2pet":3,
"62-1joh":5,
"63-2joh":1,
"64-3joh":1,
"65-jud":1,
"66-rev":22

};


/* =========================================================
   STATE
========================================================= */

let verses = [];

let currentBook = "";

let currentChapter = 0;


/* =========================================================
   HELPERS
========================================================= */

function getBookNumber(value){

    const match =
        String(value ?? "")
        .match(/^(\d{1,2})-/);

    return match
        ? Number(match[1])
        : null;
}


function getBookName(id){

    const number =
        getBookNumber(id);

    const book =
        BOOKS.find(
            b =>
                getBookNumber(b.id) === number
        );

    return book
        ? book.name
        : id;
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function setStatus(text,type=""){

    const el =
        document.getElementById("status");

    if(!el) return;

    el.className =
        "status " + type;

    el.textContent =
        text;

}


/* =========================================================
   BUILD BOOK LIST
========================================================= */

function buildBooks(){

    const select =
        document.getElementById(
            "bookSelect"
        );

    if(!select) return;

    select.innerHTML =
        `<option value="">
            اختر السفر
        </option>`;


    BOOKS.forEach(book => {

        const option =
            document.createElement("option");

        option.value =
            book.id;

        option.textContent =
            book.name;

        select.appendChild(option);

    });

}


/* =========================================================
   BUILD CHAPTER LIST
========================================================= */

function buildChapters(){

    const select =
        document.getElementById(
            "chapterSelect"
        );

    const grid =
        document.getElementById(
            "chapterGrid"
        );

    if(!select || !grid) return;


    select.innerHTML =
        `<option value="">
            اختر الأصحاح
        </option>`;


    grid.innerHTML = "";


    if(!currentBook){

        select.innerHTML =
            `<option value="">
                اختر السفر أولاً
            </option>`;

        return;

    }


    const bookNumber =
        getBookNumber(
            currentBook
        );


    /*
       أولاً نقرأ الأصحاحات
       الموجودة فعلياً في JSON.
    */

    let chapters = [

        ...new Set(

            verses

                .filter(
                    v =>
                        getBookNumber(v.book) ===
                        bookNumber
                )

                .map(
                    v =>
                        Number(v.chapter)
                )

                .filter(
                    n =>
                        Number.isFinite(n)
                )

        )

    ].sort(
        (a,b)=>a-b
    );


    /*
       إذا لم تكن البيانات كاملة،
       نستخدم العدد الرسمي للأصحاحات.
    */

    if(!chapters.length){

        const count =
            CHAPTER_COUNTS[currentBook] || 0;

        chapters =
            Array.from(
                {length:count},
                (_,i)=>i+1
            );

    }


    chapters.forEach(chapter => {

        const option =
            document.createElement("option");

        option.value =
            chapter;

        option.textContent =
            `الإصحاح ${chapter}`;

        select.appendChild(option);


        const button =
            document.createElement("button");

        button.type =
            "button";

        button.className =
            "chapter-btn";

        button.textContent =
            chapter;

        button.addEventListener(
            "click",
            () =>
                selectChapter(chapter)
        );

        grid.appendChild(button);

    });

}


/* =========================================================
   SELECT BOOK
========================================================= */

function selectBook(bookId){

    currentBook =
        bookId;

    currentChapter =
        0;


    const select =
        document.getElementById(
            "bookSelect"
        );

    if(select){

        select.value =
            bookId;

    }


    const reader =
        document.getElementById(
            "reader"
        );

    if(reader){

        reader.classList.add(
            "visible"
        );

    }


    const title =
        document.getElementById(
            "readerTitle"
        );

    if(title){

        title.textContent =
            getBookName(bookId);

    }


    buildChapters();


    document.getElementById(
        "verses"
    ).innerHTML = "";

}


/* =========================================================
   SELECT CHAPTER
========================================================= */

function selectChapter(chapter){

    currentChapter =
        Number(chapter);


    const select =
        document.getElementById(
            "chapterSelect"
        );

    if(select){

        select.value =
            String(chapter);

    }


    document
        .querySelectorAll(
            ".chapter-btn"
        )
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                Number(
                    btn.textContent
                ) ===
                currentChapter
            );

        });


    renderVerses();

}


/* =========================================================
   RENDER VERSES
========================================================= */

function renderVerses(){

    const container =
        document.getElementById(
            "verses"
        );

    if(!container) return;


    if(
        !currentBook ||
        !currentChapter
    ){

        container.innerHTML = "";

        return;

    }


    const number =
        getBookNumber(
            currentBook
        );


    const rows =
        verses

            .filter(

                v =>

                    getBookNumber(v.book) ===
                    number &&

                    Number(v.chapter) ===
                    currentChapter

            )

            .sort(
                (a,b) =>
                    Number(a.verse) -
                    Number(b.verse)
            );


    if(!rows.length){

        container.innerHTML = `

            <div class="status error">

                لا توجد آيات لهذا الأصحاح
                في ملف البيانات الحالي.

                <br><br>

                ${escapeHTML(
                    getBookName(currentBook)
                )}
                — الإصحاح
                ${currentChapter}

            </div>

        `;

        return;

    }


    container.innerHTML =

        rows.map(v => `

            <div
                class="verse"
                data-book="${escapeHTML(v.book)}"
                data-chapter="${Number(v.chapter)}"
                data-verse="${Number(v.verse)}"
            >

                <span class="verse-number">
                    ${Number(v.verse)}
                </span>

                ${escapeHTML(v.text)}

            </div>

        `).join("");


    container
        .querySelectorAll(".verse")
        .forEach(el => {

            el.addEventListener(
                "click",
                () => {

                    openVerse(
                        el.dataset.book,
                        Number(
                            el.dataset.chapter
                        ),
                        Number(
                            el.dataset.verse
                        )
                    );

                }
            );

        });


    const title =
        document.getElementById(
            "readerTitle"
        );

    if(title){

        title.textContent =

            `${getBookName(currentBook)}
             — الإصحاح ${currentChapter}`;

    }

}


/* =========================================================
   OPEN VERSE MODAL
========================================================= */

function openVerse(
    book,
    chapter,
    verse
){

    const number =
        getBookNumber(book);


    const row =
        verses.find(

            v =>

                getBookNumber(v.book) ===
                number &&

                Number(v.chapter) ===
                Number(chapter) &&

                Number(v.verse) ===
                Number(verse)

        );


    if(!row){

        return;

    }


    document.getElementById(
        "modalReference"
    ).textContent =

        `${getBookName(book)}
         ${chapter}:${verse}`;


    document.getElementById(
        "modalVerse"
    ).textContent =
        row.text;


    document.getElementById(
        "verseModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "verseModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================================
   SEARCH
========================================================= */

function searchBible(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const container =
        document.getElementById(
            "verses"
        );

    if(!input || !container) return;


    const query =
        input.value
            .trim()
            .toLowerCase();


    if(!query){

        if(currentBook && currentChapter){

            renderVerses();

        }

        return;

    }


    const results =
        verses

            .filter(
                v =>
                    String(v.text)
                        .toLowerCase()
                        .includes(query)
            )

            .slice(0,300);


    document.getElementById(
        "reader"
    ).classList.add(
        "visible"
    );


    document.getElementById(
        "chapterGrid"
    ).innerHTML = "";


    document.getElementById(
        "readerTitle"
    ).textContent =

        `نتائج البحث — ${results.length}`;


    if(!results.length){

        container.innerHTML = `

            <div class="status">
                لا توجد نتائج للبحث.
            </div>

        `;

        return;

    }


    container.innerHTML =

        results.map(v => `

            <div
                class="verse"
                data-book="${escapeHTML(v.book)}"
                data-chapter="${Number(v.chapter)}"
                data-verse="${Number(v.verse)}"
            >

                <span class="verse-number">

                    ${escapeHTML(
                        getBookName(v.book)
                    )}

                    ${Number(v.chapter)}:
                    ${Number(v.verse)}

                </span>

                ${escapeHTML(v.text)}

            </div>

        `).join("");


    container
        .querySelectorAll(".verse")
        .forEach(el => {

            el.addEventListener(
                "click",
                () => {

                    openVerse(
                        el.dataset.book,
                        Number(
                            el.dataset.chapter
                        ),
                        Number(
                            el.dataset.verse
                        )
                    );

                }
            );

        });

}


/* =========================================================
   LOAD BIBLE JSON
========================================================= */

async function loadBible(){

    setStatus(
        "جاري تحميل الكتاب المقدس..."
    );


    try{

        const response =
            await fetch(
                BIBLE_FILE +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "bible.json ليس Array"
            );

        }


        verses =
            data

                .filter(
                    v =>
                        v &&
                        v.book &&
                        v.chapter &&
                        v.verse &&
                        v.text
                )

                .map(
                    v => ({

                        book:
                            String(v.book),

                        chapter:
                            Number(v.chapter),

                        verse:
                            Number(v.verse),

                        text:
                            String(v.text)

                    })
                );


        if(!verses.length){

            throw new Error(
                "لم يتم العثور على آيات"
            );

        }


        buildBooks();


        /*
           حساب عدد الأسفار الفعلية
           الموجودة في JSON.
        */

        const available =
            new Set(

                verses
                    .map(
                        v =>
                            getBookNumber(
                                v.book
                            )
                    )
                    .filter(
                        n =>
                            n !== null
                    )

            );


        setStatus(

            `تم تحميل ${
                verses.length.toLocaleString("ar-EG")
            } آية من ${
                available.size
            } سفرًا. اختر السفر.`,

            "success"

        );

    }

    catch(error){

        console.error(
            "Bible loading error:",
            error
        );


        setStatus(

            "⚠️ تعذر تحميل الكتاب المقدس — " +
            error.message,

            "error"

        );

    }

}

   EVENTS
========================================================= */

document
    .getElementById(
        "bookSelect"
    )
    .addEventListener(
        "change",

            if(this.value){

                selectBook(

document
    .getElementById(

    )

                );

            }

        }

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(

    );


document
    .getElementById(

            }

        }
    );


document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById(

    )
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){

                closeModal();

            }

        }
    );


/* =========================================================
   START
========================================================= */

loadBible();

</script>
