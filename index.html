<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#061a2d"
    >

    <title>موسوعة الكتاب المقدس | Hope Of Nation Church NSW</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            padding:0;
            min-height:100%;
        }

        body{
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #174d7c 0%,
                    #0b2742 32%,
                    #061a2d 70%,
                    #030d18 100%
                );

            color:#ffffff;

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:20px;
        }

        .page{
            width:100%;
            max-width:650px;

            text-align:center;

            padding:45px 25px;

            border:
                1px solid
                rgba(212,175,55,.30);

            border-radius:28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10,38,63,.96),
                    rgba(5,24,41,.98)
                );

            box-shadow:
                0 25px 70px rgba(0,0,0,.45);
        }

        .logo{
            width:90px;
            height:90px;

            object-fit:contain;

            margin-bottom:15px;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(212,175,55,.35)
                );
        }

        .church{
            color:#f4d76b;

            font-size:18px;

            font-weight:700;

            margin-bottom:8px;
        }

        h1{
            margin:0 0 12px;

            color:#f4d76b;

            font-size:
                clamp(28px,6vw,42px);
        }

        .subtitle{
            margin:0 auto 30px;

            max-width:500px;

            color:#dce6ef;

            font-size:16px;

            line-height:1.9;
        }

        .enter{
            display:inline-flex;

            align-items:center;
            justify-content:center;

            gap:10px;

            min-width:220px;

            padding:14px 25px;

            border:
                1px solid
                rgba(212,175,55,.55);

            border-radius:14px;

            background:
                linear-gradient(
                    145deg,
                    #174d7c,
                    #071d31
                );

            color:#ffffff;

            text-decoration:none;

            font-size:17px;

            font-weight:700;

            box-shadow:
                0 10px 28px
                rgba(0,0,0,.30);

            transition:
                transform .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;
        }

        .enter:hover{
            transform:translateY(-3px);

            border-color:#f4d76b;

            box-shadow:
                0 14px 35px
                rgba(212,175,55,.18);
        }

        .info{
            margin-top:25px;

            color:#aebdca;

            font-size:13px;

            line-height:1.8;
        }

        footer{
            margin-top:30px;

            padding-top:20px;

            border-top:
                1px solid
                rgba(212,175,55,.18);

            color:#aebdca;

            font-size:12px;
        }

        @media(max-width:600px){

            body{
                padding:15px;
            }

            .page{
                padding:35px 18px;
            }

            .logo{
                width:75px;
                height:75px;
            }

            .church{
                font-size:15px;
            }

            .subtitle{
                font-size:15px;
            }

            .enter{
                width:100%;
                max-width:300px;
            }

        }

    </style>

</head>

<body>

    <main class="page">

        <img
            src="assets/logo.png"
            class="logo"
            alt="Hope Of Nation Church NSW"
        >

        <div class="church">
            Hope Of Nation Church NSW
        </div>

        <h1>
            موسوعة الكتاب المقدس
        </h1>

        <p class="subtitle">
            موسوعة كتابية للدراسة والبحث،
            تجمع الكتاب المقدس والدراسات المتخصصة
            والموضوعات الكتابية في مكان واحد.
        </p>

        <a
            href="studies.html"
            class="enter"
        >
            📚 الدخول إلى الدراسات
        </a>

        <div class="info">
            دراسة • بحث • معرفة • كلمة الله
        </div>

        <footer>
            موسوعة الكتاب المقدس
            <br>
            © Hope Of Nation Church NSW
        </footer>

    </main>

</body>

</html>
