<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق الكتاب المقدس | Hope Church Bible Study</title>
<style>
:root{--bg:#071526;--card:#0d2138;--card2:#102a46;--gold:#d4af37;--gold2:#f2d675;--text:#f4f7fb;--muted:#9fb0c3;--line:#1d3b59;--blue:#2d7ff9}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#061321,#0b1d31);color:var(--text);font-family:Arial,"Tahoma",sans-serif}
header{padding:22px 5%;border-bottom:1px solid var(--line);background:#081727;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:22px;color:var(--gold2)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
main{max-width:1200px;margin:auto;padding:24px 5%}
.toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:18px}
input,select,button{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:12px;font-size:15px}
button{cursor:pointer;background:#153657}
button:hover{border-color:var(--gold)}
.panel{background:rgba(13,33,56,.94);border:1px solid var(--line);border-radius:16px;padding:18px}
.status{color:var(--muted);margin-bottom:14px;font-size:14px}
.verse{border-bottom:1px solid #17344f;padding:15px 4px;line-height:2;font-size:18px}
.verse:last-child{border-bottom:0}
.vnum{color:var(--gold2);font-weight:bold;margin-left:8px}
.search-result{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#0b1c30}
.search-result b{color:var(--gold2)}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#123354;color:var(--muted);font-size:12px}
footer{text-align:center;color:var(--muted);padding:30px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.verse{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <h1>كنيسة رجاء الأمم سيدني</h1>
      <p>HOPE CHURCH BIBLE STUDY — الكتاب المقدس والدراسة الكتابية</p>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="ابحث في الكتاب المقدس...">
    <select id="book"></select>
    <select id="chapter"></select>
  </div>

  <div class="tabs">
    <button id="readBtn">الكتاب المقدس</button>
    <button id="searchBtn">نتائج البحث</button>
    <span class="badge" id="count">جاري تحميل البيانات...</span>
  </div>

  <section class="panel">
    <div id="status" class="status">جاري تحميل قاعدة البيانات...</div>
    <div id="content"></div>
  </section>
</main>

<footer>Hope Church Sydney — Bible Study</footer>

<script>
const DATA_URL="bible_database.json";
let verses=[];
let books=[];
let currentMode="read";

const $=id=>document.getElementById(id);
const normalize=s=>(s||"").toString().trim().toLowerCase();

function setStatus(t){$("status").textContent=t}

function uniqueBooks(data){
  const seen=new Set();
  return data.map(v=>v.book).filter(b=>b && !seen.has(b) && seen.add(b));
}

function fillBooks(){
  $("book").innerHTML='<option value="">اختر السفر</option>'+
    books.map(b=>`<option value="${escapeHtml(b)}">${escapeHtml(bookName(b))}</option>`).join("");
}

function bookName(id){
  if (!id) return "";
  let raw = String(id).trim().toLowerCase();

  // معالجة ذكية للأسفار التي لها جزء أول/ثاني ومرفق بها أرقام مثل Samuel-09-1 أو Corinthians-46-1
  if (raw.includes("samuel")) return raw.endsWith("-2") || raw.startsWith("2") ? "صموئيل الثاني" : "صموئيل الأول";
  if (raw.includes("kings")) return raw.endsWith("-2") || raw.startsWith("2") ? "الملوك الثاني" : "الملوك الأول";
  if (raw.includes("chronicles")) return raw.endsWith("-2") || raw.startsWith("2") ? "أخبار الأيام الثاني" : "أخبار الأيام الأول";
  if (raw.includes("corinthians")) return raw.endsWith("-2") || raw.startsWith("2") ? "كورنثوس الثانية" : "كورنثوس الأولى";
  if (raw.includes("thessalonians")) return raw.endsWith("-2") || raw.startsWith("2") ? "تسالونيكي الثانية" : "تسالونيكي الأولى";
  if (raw.includes("timothy")) return raw.endsWith("-2") || raw.startsWith("2") ? "تيموثاوس الثانية" : "تيموثاوس الأولى";
  if (raw.includes("peter")) return raw.endsWith("-2") || raw.startsWith("2") ? "بطرس الثانية" : "بطرس الأولى";
  if (raw.includes("john-")) {
    if (raw.endsWith("-2")) return "يوحنا الثانية";
    if (raw.endsWith("-3")) return "يوحنا الثالثة";
    if (raw.endsWith("-1") || raw.includes("john-62-1")) return "يوحنا الأولى";
  }

  const names = {
    // العهد القديم
    "gen":"التكوين","genesis":"التكوين","01-gen":"التكوين","01-genesis":"التكوين",
    "exodus":"الخروج","ex":"الخروج","02-exodus":"الخروج",
    "leviticus":"اللاويين","lev":"اللاويين","03-leviticus":"اللاويين",
    "numbers":"العدد","num":"العدد","04-numbers":"العدد",
    "deut":"التثنية","deuteronomy":"التثنية","05-deut":"التثنية","05-deuteronomy":"التثنية",
    "joshua":"يشوع","joshua-06":"يشوع",
    "judges":"القضاة","judges-07":"القضاة",
    "ruth":"راعوث","ruth-08":"راعوث",
    "ezra":"عزرا","ezra-15":"عزرا",
    "nehemiah":"نحميا","nehmiah":"نحميا","neh miah":"نحميا","nehmiah-16":"نحميا","nehemiah-16":"نحميا",
    "esther":"أستير","esther-17":"أستير",
    "job":"أيوب","job-18":"أيوب",
    "psalms":"المزامير","psalm":"المزامير","19-psalms":"المزامير",
    "proverbs":"الأمثال","prov":"الأمثال","20-proverbs":"الأمثال",
    "ecclesiastes":"الجامعة","ecclesiastes-21":"الجامعة",
    "sos":"نشيد الأنشاد","sos-22":"نشيد الأنشاد","song-of-solomon":"نشيد الأنشاد",
    "isiah":"إشعياء","isaiah":"إشعياء","23-isiah":"إشعياء",
    "jeremiah":"إرميا","24-jeremiah":"إرميا",
    "lamentations":"مراثي إرميا","lamentations-25":"مراثي إرميا",
    "ezekiel":"حزقيال","26-ezekiel":"حزقيال",
    "daniel":"دانيال","daniel-27":"دانيال",
    "hosea":"هويدع","hosea-28":"هويدع",
    "joel":"يوئيل","joel-29":"يوئيل",
    "amos":"عاموس","amos-30":"عاموس",
    "obadiah":"عوبديا","obadiah-31":"عوبديا",
    "jonah":"يونان","jonah-32":"يونان",
    "micah":"ميخا","micah-33":"ميخا",
    "nahum":"ناحوم","nahum-34":"ناحوم",
    "habakkuk":"حبقوق","habakkuk-35":"حبقوق",
    "zephaniah":"صفنيا","zephaniah-36":"صفنيا",
    "haggai":"حجي","haggai-37":"حجي",
    "zechariah":"زكريا","zechariah-38":"زكريا",
    "malachi":"ملاخي","malachi-39":"ملاخي",

    // العهد الجديد
    "matthew":"متى","matt":"متى","40-matthew":"متى",
    "mark":"مرقس","41-mark":"مرقس",
    "luke":"لوقا","42-luke":"لوقا",
    "john":"يوحنا","43-john":"يوحنا",
    "acts":"أعمال الرسل","44-acts":"أعمال الرسل",
    "romans":"رومية","45-romans":"رومية",
    "galatians":"غلاطية","48-galatians":"غلاطية",
    "ephesians":"أفسس","49-ephesians":"أفسس",
    "philipians-50":"فيليبي","philippians-50":"فيليبي","philippians":"فيليبي","philipians":"فيليبي",
    "colossians":"كولوسي","51-colossians":"كولوسي",
    "titus":"طيطس","titus-56":"طيطس",
    "phillemon-57":"فليمون","philemon-57":"فليمون","philemon":"فليمون","phillemon":"فليمون",
    "hebrews":"العبرانيين","hebrews-58":"العبرانيين",
    "james":"يعقوب","james-59":"يعقوب",
    "jude":"يهوذا","jude-65":"يهوذا",
    "revelation":"رؤيا يوحنا","revelation-66":"رؤيا يوحنا"
  };

  if (names[raw]) return names[raw];

  // تنظيف إضافي احتياطي
  let cleanKey = raw.replace(/^[\d]+-/, '').replace(/-[\d]+$/, '').replace(/-[\d]+-[\d]+$/, '');
  if (names[cleanKey]) return names[cleanKey];

  return String(id).trim();
}

function fillChapters(){
  const b=$("book").value;
  const nums=[...new Set(verses.filter(v=>v.book===b).map(v=>Number(v.chapter)))].sort((a,b)=>a-b);
  $("chapter").innerHTML='<option value="">اختر الإصحاح</option>'+
    nums.map(n=>`<option value="${n}">${n}</option>`).join("");
}

function renderChapter(){
  const b=$("book").value, c=Number($("chapter").value);
  if(!b||!c){$("content").innerHTML="";return}
  const rows=verses.filter(v=>v.book===b && Number(v.chapter)===c);
  $("status").textContent=`${bookName(b)} — الإصحاح ${c} — ${rows.length} آية/سجل`;
  $("content").innerHTML=rows.map(v=>`
    <div class="verse"><span class="vnum">${escapeHtml(v.verse)}</span>${escapeHtml(v.text)}</div>
  `).join("");
  currentMode="read";
}

function searchBible(q){
  q=normalize(q);
  if(!q){renderChapter();return}
  const hits=verses.filter(v=>normalize(v.text).includes(q)).slice(0,200);
  $("status").textContent=`نتائج البحث عن: ${q} — ${hits.length} نتيجة معروضة`;
  $("content").innerHTML=hits.map(v=>`
    <div class="search-result">
      <b>${escapeHtml(bookName(v.book))} ${escapeHtml(v.chapter)}:${escapeHtml(v.verse)}</b>
      <div style="line-height:1.9;margin-top:6px">${escapeHtml(v.text)}</div>
    </div>
  `).join("") || "<p>لا توجد نتائج.</p>";
  currentMode="search";
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function boot(){
  try{
    setStatus("جاري تحميل قاعدة البيانات...");
    const r=await fetch(DATA_URL,{cache:"reload"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    if(!Array.isArray(data)) throw new Error("قاعدة البيانات ليست مصفوفة JSON");
    verses=data.filter(v=>v && v.book && v.chapter && v.verse && v.text);
    books=uniqueBooks(verses);
    fillBooks();
    $("count").textContent=`${verses.length.toLocaleString("ar-EG")} سجل`;
    setStatus("تم تحميل قاعدة الكتاب المقدس بنجاح.");
    if(books.length){
      $("book").value=books[0];
      fillChapters();
      $("chapter").value="1";
      renderChapter();
    }
  }catch(e){
    setStatus("تعذر تحميل bible_database.json. يرجى إعادة تحديث الصفحة (Ctrl + F5).");
    $("count").textContent="خطأ في التحميل";
    console.error(e);
  }
}

$("book").addEventListener("change",()=>{fillChapters();renderChapter()});
$("chapter").addEventListener("change",renderChapter);
$("search").addEventListener("input",e=>searchBible(e.target.value));
$("readBtn").addEventListener("click",()=>renderChapter());
$("searchBtn").addEventListener("click",()=>searchBible($("search").value));

boot();
</script>
</body>
</html>
