<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a45;

    --gold:#d8b35a;
    --gold2:#f0d58b;

    --text:#f3f6fa;
    --muted:#aebdca;

    --border:rgba(216,179,90,.28);

    --success:#76d69a;
    --danger:#ff9b9b;

    --shadow:0 18px 50px rgba(0,0,0,.35);
}


/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top right,
            rgba(30,75,120,.25),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );

    color:var(--text);

    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;
}

button,
a{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;

    z-index:1000;

    background:rgba(6,19,33,.94);

    backdrop-filter:blur(14px);

    border-bottom:
        1px solid var(--border);
}

.header-inner{
    width:min(1250px,100%);

    min-height:76px;

    margin:auto;

    padding:
        12px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.brand{
    display:flex;

    align-items:center;

    gap:12px;

    color:var(--text);

    text-decoration:none;

    font-weight:bold;

    font-size:18px;
}

.brand-icon{
    width:46px;
    height:46px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #123a60,
            #0b2036
        );

    border:
        1px solid var(--border);

    font-size:25px;
}

.home-btn{
    color:var(--gold2);

    text-decoration:none;

    padding:
        10px 15px;

    border:
        1px solid var(--border);

    border-radius:12px;

    transition:.2s;
}

.home-btn:hover{
    background:
        rgba(216,179,90,.1);
}


/* =========================================================
   MAIN
========================================================= */

main{
    width:min(
        1250px,
        calc(100% - 28px)
    );

    margin:
        28px auto 70px;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.page-title{
    text-align:center;

    margin-bottom:30px;
}

.page-title .icon{
    font-size:48px;

    margin-bottom:8px;
}

.page-title h1{
    margin:0;

    color:var(--gold2);

    font-size:
        clamp(
            25px,
            4vw,
            38px
        );
}

.page-title p{
    color:var(--muted);

    margin:
        10px 0 0;

    font-size:15px;
}


/* =========================================================
   ALPHABET
========================================================= */

.alphabet-panel{
    background:
        linear-gradient(
            145deg,
            rgba(13,33,56,.95),
            rgba(9,26,43,.95)
        );

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:20px;

    box-shadow:var(--shadow);

    margin-bottom:28px;
}

.alphabet-title{
    color:var(--gold2);

    font-size:16px;

    margin-bottom:14px;

    font-weight:bold;
}

.alphabet{
    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.letter-btn{
    border:
        1px solid var(--border);

    background:#0b1e31;

    color:#fff;

    min-width:39px;
    height:39px;

    border-radius:10px;

    font-size:17px;

    transition:.2s;
}

.letter-btn:hover,
.letter-btn.active{
    background:var(--gold);

    color:#071321;

    border-color:var(--gold);

    transform:translateY(-1px);
}


/* =========================================================
   LETTER HEADER
========================================================= */

.letter-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}

.letter-name{
    color:var(--gold2);

    font-size:25px;

    font-weight:bold;
}

.entry-count{
    color:var(--muted);

    font-size:14px;
}


/* =========================================================
   ENTRIES
========================================================= */

.entries{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                280px,
                1fr
            )
        );

    gap:15px;
}

.entry-card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            var(--panel),
            var(--panel2)
        );

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:17px;

    padding:20px;

    min-height:185px;

    cursor:pointer;

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.entry-card:hover{
    transform:translateY(-3px);

    border-color:var(--border);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.25);
}

.entry-title{
    margin:
        0 0 10px;

    color:#fff;

    font-size:21px;
}

.entry-category{
    display:inline-block;

    color:var(--gold2);

    font-size:12px;

    background:
        rgba(216,179,90,.08);

    border:
        1px solid
        rgba(216,179,90,.2);

    border-radius:20px;

    padding:
        5px 9px;

    margin-bottom:12px;
}

.entry-preview{
    color:#b8c6d3;

    font-size:14px;

    line-height:1.9;

    display:-webkit-box;

    -webkit-line-clamp:4;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.open-label{
    position:absolute;

    left:16px;

    bottom:15px;

    color:var(--gold2);

    font-size:12px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:2000;

    display:none;

    background:
        rgba(0,0,0,.76);

    backdrop-filter:blur(7px);

    padding:20px;

    overflow-y:auto;
}

.modal.show{
    display:flex;

    align-items:flex-start;

    justify-content:center;
}

.modal-box{
    width:min(
        1050px,
        100%
    );

    margin:
        25px auto;

    background:
        linear-gradient(
            145deg,
            #0c2137,
            #081a2c
        );

    border:
        1px solid var(--border);

    border-radius:24px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.55);

    overflow:hidden;
}


/* =========================================================
   MODAL HEADER
========================================================= */

.modal-header{
    padding:
        22px 25px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;
}

.modal-title{
    margin:0;

    color:var(--gold2);

    font-size:30px;
}

.modal-category{
    margin-top:8px;

    color:var(--muted);

    font-size:14px;
}

.close-btn{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:
        1px solid var(--border);

    background:#0b1c2d;

    color:#fff;

    border-radius:12px;

    font-size:23px;
}

.close-btn:hover{
    background:#182e45;
}


/* =========================================================
   STUDY
========================================================= */

.study{
    padding:28px;
}

.study-intro{
    background:
        rgba(216,179,90,.06);

    border-right:
        4px solid var(--gold);

    padding:
        18px 20px;

    border-radius:12px;

    margin-bottom:25px;

    line-height:2;
}

.study-intro strong{
    color:var(--gold2);
}

.study-section{
    margin-bottom:30px;
}

.study-section h3{
    color:var(--gold2);

    font-size:21px;

    margin:
        0 0 14px;

    padding-bottom:9px;

    border-bottom:
        1px solid
        rgba(216,179,90,.18);
}

.study-text{
    color:#e1e8ef;

    font-size:16px;

    line-height:2.15;
}

.study-text p{
    margin:
        0 0 18px;
}


/* =========================================================
   SCRIPTURE
========================================================= */

.scripture-box{
    margin-top:25px;

    padding:20px;

    background:
        rgba(216,179,90,.045);

    border:
        1px solid
        rgba(216,179,90,.16);

    border-radius:16px;
}

.scripture-box h3{
    margin:
        0 0 14px;

    color:var(--gold2);

    font-size:20px;
}

.scripture-list{
    margin:0;

    padding-right:22px;

    color:#d6e0e8;

    line-height:2;
}

.scripture-list li{
    margin-bottom:4px;
}


/* =========================================================
   REFERENCES
========================================================= */

.references{
    margin-top:35px;

    padding:22px;

    border:
        1px solid var(--border);

    border-radius:16px;

    background:
        rgba(5,17,29,.45);
}

.references h3{
    margin:
        0 0 15px;

    color:var(--gold2);
}

.reference-list{
    margin:0;

    padding-right:22px;

    color:#c9d5df;

    line-height:2;
}

.reference-list li{
    margin-bottom:7px;
}

.reference-list a{
    color:var(--gold2);

    text-decoration:none;
}

.reference-list a:hover{
    text-decoration:underline;
}


/* =========================================================
   STATUS
========================================================= */

.status{
    text-align:center;

    padding:
        50px 20px;

    color:var(--muted);
}

.loading{
    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:15px;
}

.spinner{
    width:35px;
    height:35px;

    border:
        3px solid
        rgba(216,179,90,.2);

    border-top-color:
        var(--gold);

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

.error{
    color:#ffb4b4;

    background:
        rgba(130,30,30,.18);

    border:
        1px solid
        rgba(255,100,100,.2);

    padding:20px;

    border-radius:15px;

    line-height:1.9;

    text-align:right;
}

.error code{
    display:block;

    direction:ltr;

    text-align:left;

    margin-top:12px;

    padding:12px;

    border-radius:10px;

    background:
        rgba(0,0,0,.25);

    color:#ffd0d0;

    overflow:auto;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    grid-column:
        1 / -1;

    text-align:center;

    padding:50px 20px;

    color:var(--muted);

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:17px;

    background:
        rgba(255,255,255,.02);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header-inner{
        min-height:68px;

        padding:
            10px 12px;
    }

    .brand{
        font-size:15px;
    }

    .brand-icon{
        width:40px;
        height:40px;

        font-size:21px;
    }

    .home-btn{
        padding:
            8px 10px;

        font-size:13px;
    }

    main{
        width:
            min(
                calc(100% - 18px),
                1250px
            );

        margin-top:18px;
    }

    .alphabet-panel{
        padding:15px;

        border-radius:16px;
    }

    .letter-btn{
        min-width:36px;
        height:36px;
    }

    .entries{
        grid-template-columns:1fr;
    }

    .modal{
        padding:8px;
    }

    .modal-box{
        margin:8px auto;

        border-radius:18px;
    }

    .modal-header{
        padding:17px;
    }

    .modal-title{
        font-size:23px;
    }

    .study{
        padding:18px;
    }

    .study-text{
        font-size:15px;

        line-height:2;
    }

}

</style>
</head>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

/*
    IMPORTANT

    قاعدة البيانات الرئيسية هي:

        encyclopedia_ar.json

    لا نستخدم:

        encyclopedia_b.json

    لعرض الموسوعة الرئيسية.

    جميع الحروف يجب أن تندمج في قاعدة البيانات المركزية.
*/

const ENCYCLOPEDIA_URL =
    "encyclopedia_ar.json";


/* =========================================================
   ARABIC ALPHABET
========================================================= */

const ARABIC_LETTERS = [

    "أ",
    "ب",
    "ت",
    "ث",
    "ج",
    "ح",
    "خ",
    "د",
    "ذ",
    "ر",
    "ز",
    "س",
    "ش",
    "ص",
    "ض",
    "ط",
    "ظ",
    "ع",
    "غ",
    "ف",
    "ق",
    "ك",
    "ل",
    "م",
    "ن",
    "ه",
    "و",
    "ي"

];


/* =========================================================
   DOM
========================================================= */

const alphabetEl =
    document.getElementById("alphabet");

const entriesEl =
    document.getElementById("entries");

const letterNameEl =
    document.getElementById("letterName");

const entryCountEl =
    document.getElementById("entryCount");

const modal =
    document.getElementById("modal");

const modalTitle =
    document.getElementById("modalTitle");

const modalCategory =
    document.getElementById("modalCategory");

const studyContent =
    document.getElementById("studyContent");

const closeModal =
    document.getElementById("closeModal");


/* =========================================================
   STATE
========================================================= */

let encyclopedia = [];

let currentLetter = "أ";


/* =========================================================
   NORMALIZE ARABIC
========================================================= */

function normalizeArabic(value){

    return String(value || "")
        .trim()

        /* تشكيل */
        .replace(
            /[ًٌٍَُِّْـ]/g,
            ""
        )

        /* ألف خنجرية */
        .replace(
            /ٱ/g,
            "ا"
        )

        /* همزات الألف */
        .replace(
            /إ/g,
            "ا"
        )

        .replace(
            /أ/g,
            "ا"
        )

        .replace(
            /آ/g,
            "ا"
        )

        /* الياء */
        .replace(
            /ى/g,
            "ي"
        );

}


/* =========================================================
   GET ENTRY CONTENT
========================================================= */

function getEntryContent(entry){

    if(!entry){
        return "";
    }


    /*
        البنية الحديثة:
            content
    */

    if(
        typeof entry.content === "string" &&
        entry.content.trim()
    ){

        return entry.content.trim();

    }


    /*
        البنية الحالية الموجودة في قاعدة البيانات:
            text
    */

    if(
        typeof entry.text === "string" &&
        entry.text.trim()
    ){

        return entry.text.trim();

    }


    return "";

}


/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadEncyclopedia(){

    try{

        setLoadingState();


        /*
            إضافة timestamp يمنع المتصفح من الاحتفاظ
            بنسخة JSON قديمة أثناء التطوير.
        */

        const url =
            ENCYCLOPEDIA_URL +
            "?v=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status} — تعذر الوصول إلى ملف قاعدة البيانات.`
            );

        }


        /*
            نقرأ النص أولاً.

            هذه خطوة مهمة جدًا.

            إذا أرسل الخادم HTML بدلاً من JSON،
            نستطيع اكتشاف ذلك وإظهار الخطأ الحقيقي.
        */

        const rawText =
            await response.text();


        const trimmed =
            rawText.trim();


        /*
            حماية من المشكلة التي ظهرت في الصورة:

            <!DOCTYPE html>
        */

        if(
            trimmed.startsWith("<!DOCTYPE") ||
            trimmed.startsWith("<html") ||
            trimmed.startsWith("<HTML") ||
            trimmed.startsWith("<")
        ){

            throw new Error(
                "تم تحميل HTML بدل JSON. ملف encyclopedia_ar.json يجب أن يكون قاعدة بيانات JSON فقط، ولا يجوز أن يحتوي على <!DOCTYPE html> أو <html>."
            );

        }


        let data;


        try{

            data =
                JSON.parse(
                    trimmed
                );

        }catch(jsonError){

            console.error(
                "JSON PARSE ERROR:",
                jsonError
            );

            throw new Error(
                "ملف encyclopedia_ar.json ليس JSON صالحًا. تحقق من الأقواس والفواصل ولا تضع كود HTML داخل الملف."
            );

        }


        /*
            يجب أن تكون entries مصفوفة.
        */

        if(
            !data ||
            !Array.isArray(data.entries)
        ){

            throw new Error(
                "بنية encyclopedia_ar.json غير صحيحة. يجب أن تحتوي على entries كمصفوفة."
            );

        }


        /*
            تخزين البيانات في الذاكرة.
        */

        encyclopedia =
            data.entries;


        /*
            التحقق من المداخل.
        */

        encyclopedia =
            encyclopedia.filter(
                entry =>
                    entry &&
                    typeof entry === "object"
            );


        console.log(
            "Encyclopedia loaded:",
            encyclopedia.length,
            "entries"
        );


        /*
            بناء الأبجدية.
        */

        buildAlphabet();


        /*
            عرض الحرف الحالي.
        */

        renderLetter(
            currentLetter
        );


    }catch(error){

        console.error(
            "Encyclopedia loading error:",
            error
        );


        showDatabaseError(
            error
        );

    }

}


/* =========================================================
   LOADING STATE
========================================================= */

function setLoadingState(){

    entryCountEl.textContent =
        "جاري التحميل...";


    entriesEl.innerHTML = `

        <div class="status loading">

            <div class="spinner"></div>

            <div>
                جاري تحميل الموسوعة...
            </div>

        </div>

    `;

}


/* =========================================================
   DATABASE ERROR
========================================================= */

function showDatabaseError(error){

    entryCountEl.textContent =
        "تعذر التحميل";


    entriesEl.innerHTML = `

        <div class="error">

            <strong>
                حدث خطأ أثناء تحميل الموسوعة.
            </strong>

            <br><br>

            ${escapeHtml(error.message)}

            <br><br>

            <strong>
                الملف المطلوب:
            </strong>

            <br>

            <code>
                encyclopedia_ar.json
            </code>

            <br><br>

            يجب أن يكون هذا الملف
            JSON فقط، ويجب أن يبدأ
            بكائن JSON وليس بـ
            <code>&lt;!DOCTYPE html&gt;</code>.

            <br><br>

            مثال صحيح لبداية الملف:

            <code>
{
  "schema_version": "1.0.0",
  "language": "ar",
  "entries": [
    ...
  ]
}
            </code>

        </div>

    `;

}


/* =========================================================
   BUILD ALPHABET
========================================================= */

function buildAlphabet(){

    alphabetEl.innerHTML = "";


    ARABIC_LETTERS.forEach(
        letter => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "letter-btn";


            if(
                normalizeArabic(letter) ===
                normalizeArabic(currentLetter)
            ){

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                letter;


            button.addEventListener(
                "click",
                () => {

                    currentLetter =
                        letter;


                    document
                        .querySelectorAll(
                            ".letter-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    renderLetter(
                        letter
                    );

                }
            );


            alphabetEl.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   GET ENTRY LETTER
========================================================= */

function getEntryLetter(entry){

    if(
        entry &&
        entry.letter
    ){

        return String(
            entry.letter
        ).trim();

    }


    const title =
        String(
            entry?.title || ""
        ).trim();


    return title.charAt(0);

}


/* =========================================================
   RENDER LETTER
========================================================= */

function renderLetter(letter){

    letterNameEl.textContent =
        `حرف ${letter}`;


    const normalizedLetter =
        normalizeArabic(
            letter
        );


    const entries =
        encyclopedia.filter(
            entry => {

                const entryLetter =
                    getEntryLetter(
                        entry
                    );


                return (
                    normalizeArabic(
                        entryLetter
                    ) ===
                    normalizedLetter
                );

            }
        );


    entryCountEl.textContent =
        `${entries.length} مدخل`;


    entriesEl.innerHTML = "";


    if(!entries.length){

        entriesEl.innerHTML = `

            <div class="empty">

                لا توجد مداخل لهذا الحرف
                في قاعدة البيانات حاليًا.

            </div>

        `;

        return;

    }


    /*
        ترتيب المداخل حسب العنوان.
    */

    entries.sort(
        (a,b) => {

            const titleA =
                String(
                    a.title || ""
                );

            const titleB =
                String(
                    b.title || ""
                );


            return titleA.localeCompare(
                titleB,
                "ar"
            );

        }
    );


    entries.forEach(
        entry => {

            const card =
                createEntryCard(
                    entry
                );


            entriesEl.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   CREATE ENTRY CARD
========================================================= */

function createEntryCard(entry){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "entry-card";


    const title =
        entry.title ||
        "مدخل موسوعي";


    const category =
        entry.category ||
        "مدخل موسوعي";


    const content =
        getEntryContent(
            entry
        );


    const preview =
        content ||
        "لا يوجد محتوى لهذا المدخل.";


    card.innerHTML = `

        <h2 class="entry-title">
            ${escapeHtml(title)}
        </h2>

        <div class="entry-category">
            ${escapeHtml(category)}
        </div>

        <div class="entry-preview">
            ${escapeHtml(preview)}
        </div>

        <div class="open-label">
            📖 فتح الدراسة
        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            openStudy(
                entry
            );

        }
    );


    return card;

}


/* =========================================================
   OPEN STUDY
========================================================= */

function openStudy(entry){

    const title =
        entry.title ||
        "مدخل موسوعي";


    const category =
        entry.category ||
        "موسوعة الكتاب المقدس";


    const content =
        getEntryContent(
            entry
        );


    modalTitle.textContent =
        title;


    modalCategory.textContent =
        category;


    studyContent.innerHTML =
        buildDeepStudyView(
            entry,
            content
        );


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   BUILD DEEP STUDY VIEW
========================================================= */

function buildDeepStudyView(
    entry,
    content
){

    if(!content){

        return `

            <div class="status">

                لا يوجد محتوى لهذا
                المدخل في قاعدة البيانات.

            </div>

        `;

    }


    let html = "";


    /*
        مقدمة الدراسة
    */

    html += `

        <div class="study-intro">

            <strong>
                الدراسة الموسوعية:
            </strong>

            ${escapeHtml(
                entry.title || ""
            )}

        </div>

    `;


    /*
        النص الأساسي
    */

    html += `

        <section class="study-section">

            <h3>
                📖 الدراسة
            </h3>

            <div class="study-text">

    `;


    const paragraphs =
        splitIntoParagraphs(
            content
        );


    paragraphs.forEach(
        paragraph => {

            html += `

                <p>
                    ${escapeHtml(
                        paragraph
                    )}
                </p>

            `;

        }
    );


    html += `

            </div>

        </section>

    `;


    /*
        الآيات المرتبطة
    */

    html +=
        buildScriptureSection(
            entry
        );


    /*
        المصادر
    */

    html +=
        buildSourcesSection(
            entry
        );


    return html;

}


/* =========================================================
   SPLIT CONTENT
========================================================= */

function splitIntoParagraphs(
    content
){

    return String(content)

        .split(
            /\n\s*\n+/
        )

        .map(
            text =>
                text.trim()
        )

        .filter(
            Boolean
        );

}


/* =========================================================
   SCRIPTURE SECTION
========================================================= */

function buildScriptureSection(
    entry
){

    if(
        !Array.isArray(
            entry.scripture
        ) ||
        !entry.scripture.length
    ){

        return "";

    }


    let html = `

        <section class="scripture-box">

            <h3>
                📖 المواضع الكتابية المرتبطة
            </h3>

            <ul class="scripture-list">

    `;


    entry.scripture.forEach(
        reference => {

            html += `

                <li>
                    ${escapeHtml(
                        reference
                    )}
                </li>

            `;

        }
    );


    html += `

            </ul>

        </section>

    `;


    return html;

}


/* =========================================================
   SOURCES SECTION
========================================================= */

function buildSourcesSection(
    entry
){

    if(
        !Array.isArray(
            entry.sources
        ) ||
        !entry.sources.length
    ){

        return "";

    }


    let html = `

        <section class="references">

            <h3>
                📚 مصادر المدخل
            </h3>

            <ul class="reference-list">

    `;


    entry.sources.forEach(
        source => {

            if(
                !source ||
                typeof source !== "object"
            ){

                return;

            }


            const title =
                source.title ||
                "مصدر غير مسمى";


            const url =
                source.url;


            if(url){

                html += `

                    <li>

                        <a
                            href="${escapeAttribute(url)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            ${escapeHtml(
                                title
                            )}

                        </a>

                    </li>

                `;

            }else{

                html += `

                    <li>
                        ${escapeHtml(
                            title
                        )}
                    </li>

                `;

            }

        }
    );


    html += `

            </ul>

        </section>

    `;


    return html;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeStudy(){

    modal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

closeModal.addEventListener(
    "click",
    closeStudy
);


/* =========================================================
   CLICK OUTSIDE
========================================================= */

modal.addEventListener(
    "click",
    event => {

        if(
            event.target === modal
        ){

            closeStudy();

        }

    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeStudy();

        }

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

loadEncyclopedia();

</script>
