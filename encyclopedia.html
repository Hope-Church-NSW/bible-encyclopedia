<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#091a2b;
    --panel:#0d2238;
    --panel2:#102a44;
    --gold:#d9b84c;
    --gold2:#f0d66a;
    --text:#f4f4f4;
    --muted:#9baabd;
    --border:#66572b;
    --danger:#8b3040;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
        radial-gradient(circle at top,#0d253d 0%,#061321 48%,#020a12 100%);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    height:76px;
    background:#071625;
    border-bottom:1px solid #24364a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-logo{
    width:42px;
    height:42px;
    object-fit:contain;
}

.header-title{
    color:var(--gold2);
    font-size:17px;
    font-weight:bold;
}

.home-btn{
    border:1px solid var(--border);
    background:#0d2136;
    color:var(--gold2);
    border-radius:9px;
    padding:8px 15px;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
}

.home-btn:hover{
    background:#16324e;
}

/* =========================
   MAIN
========================= */

main{
    width:min(1100px,94%);
    margin:0 auto;
    padding:30px 0 70px;
}

.hero{
    text-align:center;
}

.hero-icon{
    font-size:38px;
    margin-bottom:8px;
}

.hero h1{
    margin:0;
    color:var(--gold2);
    font-size:27px;
}

.hero p{
    margin:8px 0 20px;
    color:var(--muted);
    font-size:13px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    width:min(560px,100%);
    margin:0 auto 20px;
    position:relative;
}

.search-box input{
    width:100%;
    height:48px;
    padding:0 18px 0 45px;
    border-radius:11px;
    border:1px solid var(--border);
    outline:none;
    background:#0d2136;
    color:#fff;
    font-family:inherit;
    font-size:14px;
}

.search-box input::placeholder{
    color:#8495a9;
}

.search-icon{
    position:absolute;
    left:16px;
    top:12px;
    font-size:20px;
}

/* =========================
   ERROR
========================= */

.status{
    width:min(560px,100%);
    margin:0 auto 20px;
    padding:15px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#0d2136;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.status.error{
    border-color:var(--danger);
    color:#ffd6dc;
}

.status.success{
    border-color:#3f6c52;
    color:#cdebd8;
}

/* =========================
   LETTERS
========================= */

.letters{
    display:grid;
    grid-template-columns:repeat(14,1fr);
    gap:8px;
    width:min(780px,100%);
    margin:15px auto 25px;
}

.letter{
    min-height:45px;
    border:1px solid var(--border);
    background:#0d2136;
    color:var(--gold2);
    border-radius:9px;
    font-family:inherit;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.letter:hover,
.letter.active{
    background:#193b59;
    border-color:var(--gold);
}

/* =========================
   RESULTS
========================= */

.results{
    width:min(900px,100%);
    margin:0 auto;
}

.result-count{
    color:var(--muted);
    font-size:13px;
    margin-bottom:12px;
}

.entry{
    background:linear-gradient(145deg,#0d2238,#091b2d);
    border:1px solid #29435b;
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
}

.entry-title{
    padding:14px 18px;
    color:var(--gold2);
    font-size:19px;
    font-weight:bold;
    border-bottom:1px solid #243b50;
    cursor:pointer;
}

.entry-title:hover{
    background:#102a43;
}

.entry-content{
    display:none;
    padding:20px;
    line-height:2;
    color:#e8edf3;
    font-size:15px;
}

.entry.open .entry-content{
    display:block;
}

.entry-content p{
    margin:0 0 15px;
}

.entry-content h2,
.entry-content h3,
.entry-content h4{
    color:var(--gold2);
}

.entry-content strong{
    color:var(--gold2);
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    color:var(--muted);
    padding:35px 10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
    .letters{
        grid-template-columns:repeat(9,1fr);
    }
}

@media(max-width:520px){
    header{
        height:65px;
    }

    .header-title{
        font-size:13px;
    }

    .header-logo{
        width:35px;
        height:35px;
    }

    main{
        padding-top:22px;
    }

    .hero h1{
        font-size:22px;
    }

    .letters{
        grid-template-columns:repeat(6,1fr);
    }

    .entry-title{
        font-size:17px;
    }

    .entry-content{
        font-size:14px;
        padding:15px;
    }
}
</style>
</head>

<body>

<header>

    <button class="home-btn" onclick="goHome()">
        ⌂ الرئيسية
    </button>

    <div class="header-right">
        <div class="header-title">
            موسوعة الكتاب المقدس
        </div>

        <img
            class="header-logo"
            src="logo.png"
            alt="شعار الكنيسة"
            onerror="this.style.display='none'"
        >
    </div>

</header>


<main>

    <section class="hero">

        <div class="hero-icon">📚</div>

        <h1>موسوعة الكتاب المقدس</h1>

        <p>
            موسوعة الدراسات والمعلومات الكتابية
        </p>

    </section>


    <div class="search-box">

        <span class="search-icon">🔎</span>

        <input
            id="searchInput"
            type="search"
            placeholder="إبحث في الموسوعة..."
            autocomplete="off"
        >

    </div>


    <div id="status" class="status">
        جاري تحميل الموسوعة...
    </div>


    <div id="letters" class="letters"></div>


    <section class="results">

        <div id="resultCount" class="result-count"></div>

        <div id="results"></div>

    </section>

</main>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const ENCYCLOPEDIA_URL = "encyclopedia_ar.json";

const HOME_URL = "index.html";


/* =========================================================
   ARABIC ALPHABET
========================================================= */

const ARABIC_LETTERS = [
    "ا","ب","ت","ث","ج","ح","خ",
    "د","ذ","ر","ز","س","ش","ص",
    "ض","ط","ظ","ع","غ","ف","ق",
    "ك","ل","م","ن","ه","و","ي"
];


/* =========================================================
   STATE
========================================================= */

let encyclopedia = [];

let activeLetter = "";

let searchTerm = "";


/* =========================================================
   ELEMENTS
========================================================= */

const lettersContainer =
    document.getElementById("letters");

const resultsContainer =
    document.getElementById("results");

const resultCount =
    document.getElementById("resultCount");

const searchInput =
    document.getElementById("searchInput");

const statusBox =
    document.getElementById("status");


/* =========================================================
   HOME
========================================================= */

function goHome(){

    window.location.href = HOME_URL;

}


/* =========================================================
   NORMALIZE ARABIC
========================================================= */

function normalizeArabic(text){

    return String(text || "")
        .trim()
        .replace(/[أإآٱ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/ئ/g,"ي")
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .toLowerCase();

}


/* =========================================================
   GET TITLE
========================================================= */

function getEntryTitle(entry){

    return (
        entry.title ||
        entry.name ||
        entry.term ||
        entry.word ||
        entry.heading ||
        ""
    );

}


/* =========================================================
   GET CONTENT
========================================================= */

function getEntryContent(entry){

    return (
        entry.content ||
        entry.text ||
        entry.body ||
        entry.description ||
        ""
    );

}


/* =========================================================
   SORT
========================================================= */

function sortEncyclopedia(){

    encyclopedia.sort((a,b)=>{

        const titleA =
            normalizeArabic(getEntryTitle(a));

        const titleB =
            normalizeArabic(getEntryTitle(b));

        return titleA.localeCompare(
            titleB,
            "ar"
        );

    });

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadEncyclopedia(){

    try{

        const response =
            await fetch(
                ENCYCLOPEDIA_URL,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        /*
         * ندعم أكثر من شكل للـ JSON
         */

        if(Array.isArray(data)){

            encyclopedia = data;

        }

        else if(Array.isArray(data.entries)){

            encyclopedia = data.entries;

        }

        else if(Array.isArray(data.articles)){

            encyclopedia = data.articles;

        }

        else if(Array.isArray(data.items)){

            encyclopedia = data.items;

        }

        else if(Array.isArray(data.pages)){

            encyclopedia = data.pages;

        }

        else{

            /*
             * إذا كان JSON عبارة عن كائن
             * والمفاتيح هي أسماء المواد
             */

            encyclopedia =
                Object.entries(data)
                .map(([title,content])=>({

                    title:title,
                    content:content

                }));

        }


        encyclopedia =
            encyclopedia.filter(entry=>{

                return (
                    getEntryTitle(entry) ||
                    getEntryContent(entry)
                );

            });


        sortEncyclopedia();


        statusBox.className =
            "status success";

        statusBox.textContent =
            "تم تحميل الموسوعة بنجاح";


        renderLetters();

        renderResults();


    }

    catch(error){

        console.error(
            "Encyclopedia loading error:",
            error
        );


        statusBox.className =
            "status error";

        statusBox.innerHTML = `
            <strong>⚠️ تعذر تحميل الموسوعة</strong>
            <br><br>
            تأكد من وجود الملف:
            <br>
            <strong>encyclopedia_ar.json</strong>
            <br><br>
            ورسالة الخطأ:
            <br>
            HTTP ${error.message.replace("HTTP ","")}
        `;

    }

}


/* =========================================================
   LETTER BUTTONS
========================================================= */

function renderLetters(){

    lettersContainer.innerHTML = "";


    ARABIC_LETTERS.forEach(letter=>{

        const button =
            document.createElement("button");

        button.className = "letter";

        button.textContent = letter;

        button.dataset.letter = letter;


        button.addEventListener(
            "click",
            ()=>{

                if(activeLetter === letter){

                    activeLetter = "";

                }
                else{

                    activeLetter = letter;

                }

                updateLetterButtons();

                renderResults();

            }
        );


        lettersContainer.appendChild(button);

    });


    updateLetterButtons();

}


/* =========================================================
   LETTER ACTIVE STATE
========================================================= */

function updateLetterButtons(){

    document
        .querySelectorAll(".letter")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.letter === activeLetter
            );

        });

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredEntries(){

    let list =
        encyclopedia;


    if(activeLetter){

        list =
            list.filter(entry=>{

                const title =
                    normalizeArabic(
                        getEntryTitle(entry)
                    );

                return title.startsWith(
                    normalizeArabic(activeLetter)
                );

            });

    }


    if(searchTerm){

        const query =
            normalizeArabic(searchTerm);


        list =
            list.filter(entry=>{

                const title =
                    normalizeArabic(
                        getEntryTitle(entry)
                    );

                const content =
                    normalizeArabic(
                        getEntryContent(entry)
                    );

                return (
                    title.includes(query) ||
                    content.includes(query)
                );

            });

    }


    return list;

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(){

    const list =
        getFilteredEntries();


    resultCount.textContent =
        list.length
        ? `عدد المواد: ${list.length}`
        : "";


    resultsContainer.innerHTML = "";


    if(!list.length){

        resultsContainer.innerHTML = `
            <div class="empty">
                لا توجد مواد مطابقة للبحث.
            </div>
        `;

        return;

    }


    list.forEach((entry,index)=>{

        const title =
            getEntryTitle(entry);

        const content =
            getEntryContent(entry);


        const article =
            document.createElement("article");

        article.className =
            "entry";


        const titleBox =
            document.createElement("div");

        titleBox.className =
            "entry-title";

        titleBox.textContent =
            title || "مادة موسوعية";


        const contentBox =
            document.createElement("div");

        contentBox.className =
            "entry-content";


        /*
         * نحافظ على النص كما هو،
         * مع تحويل أسطر النص إلى فقرات.
         */

        if(typeof content === "string"){

            contentBox.innerHTML =
                textToHTML(content);

        }
        else{

            contentBox.textContent =
                JSON.stringify(content);

        }


        titleBox.addEventListener(
            "click",
            ()=>{

                article.classList.toggle("open");

            }
        );


        article.appendChild(titleBox);

        article.appendChild(contentBox);

        resultsContainer.appendChild(article);

    });

}


/* =========================================================
   TEXT TO HTML
========================================================= */

function textToHTML(text){

    /*
     * حماية النص من HTML غير المقصود
     */

    const escaped =
        String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");


    return escaped
        .split(/\n\s*\n/)
        .map(paragraph=>{

            return `<p>${paragraph
                .replace(/\n/g,"<br>")
            }</p>`;

        })
        .join("");

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    ()=>{

        searchTerm =
            searchInput.value.trim();

        renderResults();

    }
);


/* =========================================================
   START
========================================================= */

loadEncyclopedia();

</script>

</body>
</html>
