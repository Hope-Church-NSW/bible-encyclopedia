<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#081a2d;
    --panel:#0d2138;
    --panel2:#102943;
    --gold:#e5c15b;
    --gold2:#b99432;
    --text:#f5f1df;
    --muted:#9eabb9;
    --border:#665526;
    --danger:#e45b5b;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top, #102842 0%, var(--bg) 45%, #020b14 100%);
    color:var(--text);
    font-family:Tahoma, Arial, sans-serif;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    height:74px;
    background:#061321;
    border-bottom:1px solid #26384a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.home-btn{
    text-decoration:none;
    color:var(--gold);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 14px;
    font-size:13px;
    transition:.2s;
}

.home-btn:hover{
    background:rgba(229,193,91,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand img{
    width:42px;
    height:42px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold);
    font-size:15px;
}

/* ================= MAIN ================= */

main{
    width:min(1050px,94%);
    margin:0 auto;
    padding:32px 0 70px;
}

.hero{
    text-align:center;
    margin-bottom:24px;
}

.hero-icon{
    font-size:34px;
    margin-bottom:5px;
}

.hero h1{
    margin:0;
    color:var(--gold);
    font-size:28px;
    font-weight:700;
}

.hero p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13px;
}

/* ================= SEARCH ================= */

.search-box{
    width:min(700px,100%);
    margin:24px auto;
    position:relative;
}

.search-box input{
    width:100%;
    height:48px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#0b2036;
    color:white;
    outline:none;
    padding:0 48px 0 16px;
    font-family:inherit;
    font-size:14px;
}

.search-box input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(229,193,91,.08);
}

.search-icon{
    position:absolute;
    right:15px;
    top:13px;
    font-size:20px;
}

/* ================= STATUS ================= */

.status{
    width:min(700px,100%);
    margin:0 auto 18px;
    padding:18px;
    border-radius:10px;
    border:1px solid #31485f;
    background:#0b2036;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.status.error{
    border-color:#8d3940;
    color:#ffb1b1;
}

.status.success{
    border-color:#536d45;
}

/* ================= LETTERS ================= */

.letters{
    width:min(800px,100%);
    margin:24px auto 30px;
    display:grid;
    grid-template-columns:repeat(14,1fr);
    gap:7px;
}

.letter-btn{
    min-height:45px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#0b2036;
    color:var(--gold);
    font-family:inherit;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.letter-btn:hover{
    background:#142e49;
    transform:translateY(-1px);
}

.letter-btn.active{
    background:#1b3550;
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(229,193,91,.12);
}

/* ================= RESULTS ================= */

.results-title{
    color:var(--gold);
    font-size:18px;
    margin:0 0 15px;
}

.results{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
}

.entry-card{
    background:linear-gradient(145deg,#0d233b,#0a1d31);
    border:1px solid #294157;
    border-radius:12px;
    padding:18px;
    cursor:pointer;
    transition:.2s;
}

.entry-card:hover{
    border-color:var(--gold2);
    transform:translateY(-2px);
}

.entry-title{
    color:var(--gold);
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.entry-category{
    display:inline-block;
    color:#b8c5d1;
    font-size:11px;
    border:1px solid #334c62;
    border-radius:20px;
    padding:4px 9px;
    margin-bottom:10px;
}

.entry-preview{
    color:#d5dbe1;
    line-height:1.9;
    font-size:13px;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.entry-scripture{
    margin-top:12px;
    color:#9daebe;
    font-size:11px;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    border:1px dashed #34495c;
    border-radius:12px;
    background:rgba(8,26,45,.55);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:90vh;
    overflow:auto;
    background:#091c30;
    border:1px solid var(--gold2);
    border-radius:16px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.modal-header{
    position:sticky;
    top:0;
    z-index:2;
    background:#091c30;
    border-bottom:1px solid #294157;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.modal-title{
    color:var(--gold);
    font-size:24px;
    font-weight:bold;
}

.close-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #5c4c2b;
    background:#102943;
    color:var(--gold);
    cursor:pointer;
    font-size:20px;
}

.modal-body{
    padding:24px;
}

.modal-category{
    color:#b7c4d0;
    font-size:12px;
    margin-bottom:18px;
}

.modal-text{
    white-space:pre-line;
    color:#e7ebee;
    font-size:15px;
    line-height:2.15;
}

.section-title{
    color:var(--gold);
    font-size:16px;
    font-weight:bold;
    margin:26px 0 10px;
}

.scripture-list,
.sources-list{
    margin:0;
    padding:0;
    list-style:none;
}

.scripture-list li,
.sources-list li{
    background:#0d233b;
    border:1px solid #294157;
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:7px;
    color:#d9e0e6;
    font-size:13px;
}

.sources-list a{
    color:#d8bb5d;
    text-decoration:none;
}

.sources-list a:hover{
    text-decoration:underline;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){
    .letters{
        grid-template-columns:repeat(9,1fr);
    }

    .results{
        grid-template-columns:1fr;
    }
}

@media(max-width:520px){
    header{
        height:64px;
    }

    .brand-title{
        font-size:12px;
    }

    .brand img{
        width:36px;
        height:36px;
    }

    main{
        width:94%;
        padding-top:24px;
    }

    .hero h1{
        font-size:23px;
    }

    .letters{
        grid-template-columns:repeat(7,1fr);
        gap:6px;
    }

    .letter-btn{
        min-height:42px;
        font-size:14px;
    }

    .modal-body{
        padding:18px;
    }

    .modal-title{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-right">
        <a href="index.html" class="home-btn">⌂ الرئيسية</a>
    </div>

    <div class="brand">
        <div class="brand-title">موسوعة الكتاب المقدس</div>

        <!-- استبدل الاسم فقط إذا كان ملف الشعار في مشروعك باسم مختلف -->
        <img src="logo.png" alt="شعار الكنيسة">
    </div>

</header>


<main>

    <section class="hero">

        <div class="hero-icon">📚</div>

        <h1>موسوعة الكتاب المقدس</h1>

        <p>موسوعة الدراسات والمعلومات الكتابية</p>

    </section>


    <div class="search-box">

        <span class="search-icon">🔎</span>

        <input
            id="searchInput"
            type="search"
            placeholder="إبحث في الموسوعة..."
            autocomplete="off"
        >

    </div>


    <div id="status" class="status">
        جاري تحميل الموسوعة...
    </div>


    <section id="letters" class="letters"></section>


    <section>

        <h2 id="resultsTitle" class="results-title">
            جميع المواد
        </h2>

        <div id="results" class="results"></div>

    </section>

</main>


<!-- ================= MODAL ================= -->

<div id="entryModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <div id="modalTitle" class="modal-title"></div>

            <button
                id="closeModal"
                class="close-btn"
                type="button"
                aria-label="إغلاق"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <div id="modalCategory" class="modal-category"></div>

            <div id="modalText" class="modal-text"></div>

            <div
                id="scriptureSection"
                style="display:none;"
            >

                <div class="section-title">
                    الشواهد الكتابية
                </div>

                <ul
                    id="modalScripture"
                    class="scripture-list"
                ></ul>

            </div>


            <div
                id="sourcesSection"
                style="display:none;"
            >

                <div class="section-title">
                    المصادر والتوثيق
                </div>

                <ul
                    id="modalSources"
                    class="sources-list"
                ></ul>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   موسوعة الكتاب المقدس
   مصدر البيانات الوحيد:
   encyclopedia_ar.json
   ========================================================= */

const ENCYCLOPEDIA_URL = "encyclopedia_ar.json";


const state = {

    entries: [],

    currentLetter: null,

    search: ""

};


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const statusBox =
    document.getElementById("status");

const lettersBox =
    document.getElementById("letters");

const resultsBox =
    document.getElementById("results");

const resultsTitle =
    document.getElementById("resultsTitle");

const searchInput =
    document.getElementById("searchInput");

const modal =
    document.getElementById("entryModal");

const modalTitle =
    document.getElementById("modalTitle");

const modalCategory =
    document.getElementById("modalCategory");

const modalText =
    document.getElementById("modalText");

const modalScripture =
    document.getElementById("modalScripture");

const modalSources =
    document.getElementById("modalSources");

const scriptureSection =
    document.getElementById("scriptureSection");

const sourcesSection =
    document.getElementById("sourcesSection");

const closeModal =
    document.getElementById("closeModal");


/* =========================================================
   الحروف العربية
   ========================================================= */

const ARABIC_LETTERS = [

    "ا","ب","ت","ث","ج","ح","خ",
    "د","ذ","ر","ز","س","ش","ص",
    "ض","ط","ظ","ع","غ","ف","ق",
    "ك","ل","م","ن","ه","و","ي"

];


/* =========================================================
   تطبيع النص العربي للبحث
   ========================================================= */

function normalizeArabic(text){

    return String(text || "")

        .toLowerCase()

        .replace(/[أإآٱ]/g, "ا")

        .replace(/ى/g, "ي")

        .replace(/ة/g, "ه")

        .replace(/ؤ/g, "و")

        .replace(/ئ/g, "ي")

        .replace(/[ًٌٍَُِّْـ]/g, "")

        .trim();

}


/* =========================================================
   استخراج الحرف
   ========================================================= */

function getArabicLetter(title){

    const normalized =
        normalizeArabic(title);

    return normalized.charAt(0) || "";

}


/* =========================================================
   ترتيب أبجدي عربي
   ========================================================= */

function sortEntries(entries){

    const order = {

        "ا":0,
        "ب":1,
        "ت":2,
        "ث":3,
        "ج":4,
        "ح":5,
        "خ":6,
        "د":7,
        "ذ":8,
        "ر":9,
        "ز":10,
        "س":11,
        "ش":12,
        "ص":13,
        "ض":14,
        "ط":15,
        "ظ":16,
        "ع":17,
        "غ":18,
        "ف":19,
        "ق":20,
        "ك":21,
        "ل":22,
        "م":23,
        "ن":24,
        "ه":25,
        "و":26,
        "ي":27

    };

    return [...entries].sort((a,b)=>{

        const la =
            order[getArabicLetter(a.title)] ?? 99;

        const lb =
            order[getArabicLetter(b.title)] ?? 99;

        if(la !== lb){
            return la - lb;
        }

        return a.title.localeCompare(
            b.title,
            "ar"
        );

    });

}


/* =========================================================
   تحميل JSON
   ========================================================= */

async function loadEncyclopedia(){

    try{

        const response =
            await fetch(
                ENCYCLOPEDIA_URL,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const data =
            await response.json();


        if(!data || !Array.isArray(data.entries)){

            throw new Error(
                "بنية encyclopedia_ar.json غير صحيحة."
            );

        }


        state.entries =
            sortEntries(data.entries);


        buildLetters();

        render();


        statusBox.className =
            "status success";

        statusBox.textContent =
            `تم تحميل ${state.entries.length} مادة موسوعية بنجاح.`;


    }catch(error){

        console.error(error);

        statusBox.className =
            "status error";

        statusBox.innerHTML =
            `
            <strong>⚠ تعذر تحميل الموسوعة</strong>
            <br><br>
            تأكد من وجود الملف:
            <br>
            <b>encyclopedia_ar.json</b>
            <br><br>
            ورسالة الخطأ:
            <br>
            ${escapeHtml(error.message)}
            `;

    }

}


/* =========================================================
   إنشاء الحروف
   ========================================================= */

function buildLetters(){

    lettersBox.innerHTML = "";

    ARABIC_LETTERS.forEach(letter=>{

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "letter-btn";

        button.textContent =
            letter;

        button.dataset.letter =
            letter;

        button.addEventListener(
            "click",
            ()=>{

                if(state.currentLetter === letter){

                    state.currentLetter = null;

                }else{

                    state.currentLetter = letter;

                }

                updateLetterButtons();

                render();

            }
        );

        lettersBox.appendChild(button);

    });

}


/* =========================================================
   حالة الحروف
   ========================================================= */

function updateLetterButtons(){

    document
        .querySelectorAll(".letter-btn")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.letter ===
                state.currentLetter
            );

        });

}


/* =========================================================
   البحث
   ========================================================= */

searchInput.addEventListener(
    "input",
    ()=>{

        state.search =
            normalizeArabic(
                searchInput.value
            );

        render();

    }
);


/* =========================================================
   تصفية النتائج
   ========================================================= */

function getFilteredEntries(){

    let entries =
        state.entries;


    if(state.currentLetter){

        entries =
            entries.filter(entry=>{

                return getArabicLetter(
                    entry.title
                ) === state.currentLetter;

            });

    }


    if(state.search){

        entries =
            entries.filter(entry=>{

                const searchable = [

                    entry.title,

                    entry.category,

                    entry.text,

                    ...(entry.scripture || [])

                ]
                .join(" ");


                return normalizeArabic(
                    searchable
                ).includes(
                    state.search
                );

            });

    }


    return entries;

}


/* =========================================================
   العرض
   ========================================================= */

function render(){

    const entries =
        getFilteredEntries();


    if(state.search){

        resultsTitle.textContent =
            `نتائج البحث (${entries.length})`;

    }else if(state.currentLetter){

        resultsTitle.textContent =
            `مواد حرف «${state.currentLetter}» (${entries.length})`;

    }else{

        resultsTitle.textContent =
            `جميع المواد (${entries.length})`;

    }


    resultsBox.innerHTML = "";


    if(!entries.length){

        resultsBox.innerHTML =
            `
            <div class="empty" style="grid-column:1/-1;">
                لا توجد مواد مطابقة للبحث.
            </div>
            `;

        return;

    }


    entries.forEach(entry=>{

        resultsBox.appendChild(
            createEntryCard(entry)
        );

    });

}


/* =========================================================
   بطاقة المادة
   ========================================================= */

function createEntryCard(entry){

    const card =
        document.createElement("article");

    card.className =
        "entry-card";


    const title =
        document.createElement("div");

    title.className =
        "entry-title";

    title.textContent =
        entry.title;


    const category =
        document.createElement("span");

    category.className =
        "entry-category";

    category.textContent =
        entry.category ||
        "مادة موسوعية";


    const preview =
        document.createElement("div");

    preview.className =
        "entry-preview";

    preview.textContent =
        entry.text || "";


    const scripture =
        document.createElement("div");

    scripture.className =
        "entry-scripture";

    if(Array.isArray(entry.scripture)
       && entry.scripture.length){

        scripture.textContent =
            "📖 " +
            entry.scripture.join(" • ");

    }


    card.appendChild(title);

    card.appendChild(category);

    card.appendChild(preview);

    if(scripture.textContent){

        card.appendChild(scripture);

    }


    card.addEventListener(
        "click",
        ()=>openEntry(entry)
    );


    return card;

}


/* =========================================================
   فتح المادة
   ========================================================= */

function openEntry(entry){

    modalTitle.textContent =
        entry.title || "";

    modalCategory.textContent =
        entry.category
        ? `التصنيف: ${entry.category}`
        : "";

    modalText.textContent =
        entry.text || "";


    /* الشواهد */

    modalScripture.innerHTML = "";

    if(
        Array.isArray(entry.scripture)
        &&
        entry.scripture.length
    ){

        scriptureSection.style.display =
            "block";


        entry.scripture.forEach(ref=>{

            const li =
                document.createElement("li");

            li.textContent =
                ref;

            modalScripture.appendChild(li);

        });

    }else{

        scriptureSection.style.display =
            "none";

    }


    /* المصادر */

    modalSources.innerHTML = "";

    if(
        Array.isArray(entry.sources)
        &&
        entry.sources.length
    ){

        sourcesSection.style.display =
            "block";


        entry.sources.forEach(source=>{

            const li =
                document.createElement("li");


            if(source.url){

                const a =
                    document.createElement("a");

                a.href =
                    source.url;

                a.target =
                    "_blank";

                a.rel =
                    "noopener noreferrer";

                a.textContent =
                    source.title ||
                    source.url;

                li.appendChild(a);

            }else{

                li.textContent =
                    source.title ||
                    "مصدر غير محدد";

            }


            modalSources.appendChild(li);

        });

    }else{

        sourcesSection.style.display =
            "none";

    }


    modal.classList.add("show");

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   إغلاق النافذة
   ========================================================= */

function closeEntryModal(){

    modal.classList.remove("show");

    document.body.style.overflow =
        "";

}


closeModal.addEventListener(
    "click",
    closeEntryModal
);


modal.addEventListener(
    "click",
    event=>{

        if(event.target === modal){

            closeEntryModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            closeEntryModal();

        }

    }
);


/* =========================================================
   حماية HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   التشغيل
   ========================================================= */

loadEncyclopedia();

</script>

</body>
</html>
