<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>موسوعة الكتاب المقدس</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #1d2733;
      font-family: Tahoma, Arial, sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: linear-gradient(135deg, #0b3d91, #174ea6);
      color: white;
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
    }

    .brand-title {
      font-size: 25px;
      font-weight: bold;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 13px;
      opacity: .9;
    }

    .home-button {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.13);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 15px;
      transition: .2s;
    }

    .home-button:hover {
      background: rgba(255,255,255,.22);
    }

    .title-section {
      text-align: center;
      margin: 24px 0 18px;
    }

    .title-section h1 {
      margin: 0;
      color: #0b3d91;
      font-size: 28px;
    }

    .title-section p {
      margin: 8px 0 0;
      color: #66717d;
      font-size: 14px;
    }

    /* ==============================
       الأبجدية
       ============================== */

    .alphabet-container {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      margin-bottom: 22px;
    }

    .alphabet-title {
      font-size: 18px;
      font-weight: bold;
      color: #0b3d91;
      margin-bottom: 16px;
    }

    .alphabet {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .letter-button {
      position: relative;
      border: 1px solid #d8dee6;
      background: #fafbfc;
      color: #263442;
      min-height: 58px;
      border-radius: 12px;
      font-size: 23px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
      font-family: Tahoma, Arial, sans-serif;
    }

    .letter-button:hover {
      border-color: #174ea6;
      background: #eef4ff;
      transform: translateY(-1px);
    }

    .letter-button.active {
      background: #0b3d91;
      color: white;
      border-color: #0b3d91;
    }

    .letter-button.disabled {
      opacity: .42;
      cursor: default;
      background: #f3f4f5;
    }

    .letter-button.disabled:hover {
      transform: none;
      border-color: #d8dee6;
      background: #f3f4f5;
    }

    .study-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      top: 8px;
      left: 9px;
      box-shadow: 0 0 0 2px rgba(34,197,94,.12);
    }

    /* ==============================
       النتائج
       ============================== */

    .results-container {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      min-height: 180px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #e7ebef;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .results-header h2 {
      margin: 0;
      color: #0b3d91;
      font-size: 22px;
    }

    .count {
      color: #697586;
      font-size: 13px;
    }

    .entries {
      display: grid;
      gap: 12px;
    }

    .entry {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #f8fafc;
      border: 1px solid #e1e6eb;
      border-radius: 13px;
      padding: 16px 18px;
      transition: .2s;
    }

    .entry:hover {
      background: #eef4ff;
      border-color: #a9c0e8;
      transform: translateY(-1px);
    }

    .entry-title {
      color: #0b3d91;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .entry-preview {
      color: #606c78;
      font-size: 14px;
      line-height: 1.8;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #66717d;
    }

    .error {
      color: #a33a3a;
    }

    .error strong {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 12px;
      }

      .alphabet {
        grid-template-columns: repeat(5, 1fr);
      }

      .letter-button {
        min-height: 52px;
        font-size: 21px;
      }

      .brand-title {
        font-size: 21px;
      }

      .title-section h1 {
        font-size: 24px;
      }
    }

    @media (max-width: 430px) {
      .alphabet {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- ==============================
       الرأس
       ============================== -->

  <header class="header">

    <div class="header-top">

      <div class="brand">
        <div class="brand-icon">📚</div>

        <div>
          <div class="brand-title">موسوعة الكتاب المقدس</div>
          <div class="brand-subtitle">
            دائرة المعارف الكتابية — قاعدة البيانات العربية المركزية
          </div>
        </div>
      </div>

      <a href="index.html" class="home-button">
        ⌂ الرئيسية
      </a>

    </div>

  </header>


  <!-- ==============================
       العنوان
       ============================== -->

  <section class="title-section">

    <h1>دائرة المعارف الكتابية</h1>

    <p>
      اختر حرفًا لاستعراض المداخل الموسوعية
    </p>

  </section>


  <!-- ==============================
       الأبجدية
       ============================== -->

  <section class="alphabet-container">

    <div class="alphabet-title">
      🔎 المداخل الأبجدية
    </div>

    <div id="alphabet" class="alphabet"></div>

  </section>


  <!-- ==============================
       النتائج
       ============================== -->

  <section class="results-container">

    <div class="results-header">

      <h2 id="resultsTitle">
        اختر حرفًا
      </h2>

      <div id="resultsCount" class="count"></div>

    </div>

    <div id="results">

      <div class="empty">
        اختر أحد الحروف لعرض المداخل.
      </div>

    </div>

  </section>

</div>


<script>

"use strict";

/* =========================================================
   الإعدادات
   ========================================================= */

const ENCYCLOPEDIA_URL = "encyclopedia_ar.json";


/* =========================================================
   الحروف العربية
   ========================================================= */

const ARABIC_LETTERS = [
  "أ",
  "ب",
  "ت",
  "ث",
  "ج",
  "ح",
  "خ",
  "د",
  "ذ",
  "ر",
  "ز",
  "س",
  "ش",
  "ص",
  "ض",
  "ط",
  "ظ",
  "ع",
  "غ",
  "ف",
  "ق",
  "ك",
  "ل",
  "م",
  "ن",
  "ه",
  "و",
  "ي"
];


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const alphabetElement = document.getElementById("alphabet");
const resultsElement = document.getElementById("results");
const resultsTitleElement = document.getElementById("resultsTitle");
const resultsCountElement = document.getElementById("resultsCount");


/* =========================================================
   البيانات
   ========================================================= */

let encyclopediaData = null;
let entries = [];


/* =========================================================
   تطبيع النص العربي
   =========================================================

   مهم جدًا:

   نحن لا نحذف الهمزات هنا بشكل عشوائي.

   لأن:
   أ
   إ
   آ

   يجب أن تُعامل جميعها باعتبارها من "الألف".

   لكن باقي الحروف نحافظ عليها قدر الإمكان.
   ========================================================= */

function normalizeArabic(text) {

  if (text === null || text === undefined) {
    return "";
  }

  return String(text)
    .trim()
    .replace(/^[\u200B-\u200D\uFEFF]+/, "");
}


/* =========================================================
   معرفة الحرف الأبجدي للمدخل
   ========================================================= */

function getEntryLetter(title) {

  const text = normalizeArabic(title);

  if (!text) {
    return null;
  }

  const firstCharacter = text.charAt(0);

  /*
   * الألف:
   *
   * أ
   * إ
   * آ
   *
   * كلها تحت حرف "أ"
   */

  if (
    firstCharacter === "أ" ||
    firstCharacter === "إ" ||
    firstCharacter === "آ"
  ) {
    return "أ";
  }

  /*
   * باقي الحروف
   */

  if (ARABIC_LETTERS.includes(firstCharacter)) {
    return firstCharacter;
  }

  return null;
}


/* =========================================================
   استخراج اسم المدخل من أي بنية JSON
   =========================================================

   لأن ملف الموسوعة قد يحتوي على:

   title
   name
   entry
   heading

   أو بنية أخرى.

   نبحث عن الاسم بطريقة آمنة.
   ========================================================= */

function getEntryTitle(entry) {

  if (!entry || typeof entry !== "object") {
    return "";
  }

  const possibleTitles = [
    entry.title,
    entry.name,
    entry.entry,
    entry.heading,
    entry.term,
    entry.word
  ];

  for (const value of possibleTitles) {

    if (
      typeof value === "string" &&
      value.trim() !== ""
    ) {
      return value.trim();
    }

  }

  return "";
}


/* =========================================================
   استخراج المحتوى النصي للمدخل
   ========================================================= */

function getEntryText(entry) {

  if (!entry || typeof entry !== "object") {
    return "";
  }

  const possibleTexts = [
    entry.text,
    entry.content,
    entry.description,
    entry.body,
    entry.study
  ];

  for (const value of possibleTexts) {

    if (
      typeof value === "string" &&
      value.trim() !== ""
    ) {
      return value.trim();
    }

  }

  return "";
}


/* =========================================================
   تحويل البيانات إلى قائمة مداخل
   ========================================================= */

function extractEntries(data) {

  /*
   * الحالة الأولى:
   *
   * JSON عبارة عن Array
   */

  if (Array.isArray(data)) {
    return data;
  }


  /*
   * الحالة الثانية:
   *
   * البيانات داخل entries
   */

  if (
    data &&
    Array.isArray(data.entries)
  ) {
    return data.entries;
  }


  /*
   * الحالة الثالثة:
   *
   * البيانات داخل encyclopedia
   */

  if (
    data &&
    Array.isArray(data.encyclopedia)
  ) {
    return data.encyclopedia;
  }


  /*
   * الحالة الرابعة:
   *
   * البيانات موزعة على الحروف:

   {
      "أ": [...],
      "ب": [...],
      ...
   }

   في هذه الحالة نجمعها.
   */

  if (
    data &&
    typeof data === "object"
  ) {

    const result = [];

    for (const letter of ARABIC_LETTERS) {

      const value = data[letter];

      if (Array.isArray(value)) {

        for (const item of value) {

          result.push(item);

        }

      }

    }

    if (result.length > 0) {
      return result;
    }

  }


  return [];
}


/* =========================================================
   بناء الأبجدية
   ========================================================= */

function renderAlphabet() {

  alphabetElement.innerHTML = "";

  for (const letter of ARABIC_LETTERS) {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "letter-button";
    button.dataset.letter = letter;
    button.textContent = letter;


    /*
     * نحسب هل يوجد فعليًا مدخل يبدأ بهذا الحرف.
     */

    const letterEntries = entries.filter(entry => {

      const title = getEntryTitle(entry);

      return getEntryLetter(title) === letter;

    });


    /*
     * إذا كان للحرف مداخل:
     * نجعله فعالًا ونضع النقطة الخضراء.
     */

    if (letterEntries.length > 0) {

      const dot = document.createElement("span");

      dot.className = "study-dot";

      button.appendChild(dot);

      button.addEventListener("click", () => {

        showLetter(letter);

      });

    } else {

      /*
       * لا توجد دراسة لهذا الحرف.
       */

      button.classList.add("disabled");

      button.setAttribute(
        "aria-disabled",
        "true"
      );

    }

    alphabetElement.appendChild(button);
  }

}


/* =========================================================
   عرض مداخل حرف معين
   ========================================================= */

function showLetter(letter) {

  /*
   * إزالة active من جميع الحروف
   */

  document
    .querySelectorAll(".letter-button")
    .forEach(button => {

      button.classList.remove("active");

    });


  /*
   * تفعيل الحرف الحالي
   */

  const activeButton =
    document.querySelector(
      `.letter-button[data-letter="${CSS.escape(letter)}"]`
    );

  if (activeButton) {
    activeButton.classList.add("active");
  }


  /*
   * استخراج المداخل الخاصة بالحرف.
   */

  const letterEntries = entries
    .filter(entry => {

      const title = getEntryTitle(entry);

      return getEntryLetter(title) === letter;

    })
    .sort((a, b) => {

      const titleA =
        getEntryTitle(a);

      const titleB =
        getEntryTitle(b);

      return titleA.localeCompare(
        titleB,
        "ar"
      );

    });


  resultsTitleElement.textContent =
    `حرف ${letter}`;


  resultsCountElement.textContent =
    `${letterEntries.length} مدخل`;


  /*
   * لا توجد مداخل
   */

  if (letterEntries.length === 0) {

    resultsElement.innerHTML = `
      <div class="empty">
        لا توجد مداخل موسوعية تبدأ بحرف ${letter}.
      </div>
    `;

    return;
  }


  /*
   * إنشاء قائمة المداخل
   */

  const container =
    document.createElement("div");

  container.className = "entries";


  for (const entry of letterEntries) {

    const title =
      getEntryTitle(entry);

    const text =
      getEntryText(entry);


    const item =
      document.createElement("a");

    item.className = "entry";


    /*
     * إذا كان المدخل يحتوي على رابط
     * نستخدمه.

     * وإلا نعرضه كبطاقة.
     */

    if (
      typeof entry.url === "string" &&
      entry.url.trim() !== ""
    ) {

      item.href = entry.url;

    } else if (
      typeof entry.href === "string" &&
      entry.href.trim() !== ""
    ) {

      item.href = entry.href;

    } else {

      item.href = "#";

      item.addEventListener(
        "click",
        event => event.preventDefault()
      );

    }


    const titleElement =
      document.createElement("div");

    titleElement.className =
      "entry-title";

    titleElement.textContent =
      title;


    const previewElement =
      document.createElement("div");

    previewElement.className =
      "entry-preview";


    /*
     * عرض بداية المحتوى فقط داخل القائمة.
     */

    if (text) {

      const cleanText =
        text
          .replace(/\s+/g, " ")
          .trim();

      previewElement.textContent =
        cleanText.length > 240
          ? cleanText.substring(0, 240) + "…"
          : cleanText;

    } else {

      previewElement.textContent =
        "دراسة موسوعية";

    }


    item.appendChild(titleElement);
    item.appendChild(previewElement);

    container.appendChild(item);

  }


  resultsElement.innerHTML = "";
  resultsElement.appendChild(container);

}


/* =========================================================
   تحميل الموسوعة
   ========================================================= */

async function loadEncyclopedia() {

  /*
   * حالة التحميل
   */

  resultsElement.innerHTML = `
    <div class="loading">
      جارٍ تحميل الموسوعة…
    </div>
  `;


  try {

    const response =
      await fetch(
        ENCYCLOPEDIA_URL,
        {
          cache: "no-cache"
        }
      );


    /*
     * التحقق من HTTP
     */

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    /*
     * قراءة JSON

     * مهم:
     * response.json() سيعطي خطأ واضحًا
     * إذا كان الملف HTML أو JSON غير صالح.
     */

    const data =
      await response.json();


    encyclopediaData = data;


    /*
     * استخراج المداخل.
     */

    entries =
      extractEntries(data);


    /*
     * التحقق من البيانات.
     */

    if (!Array.isArray(entries)) {

      throw new Error(
        "لم يتم العثور على قائمة المداخل داخل ملف JSON."
      );

    }


    /*
     * بناء الأبجدية من البيانات الحقيقية.
     */

    renderAlphabet();


    /*
     * تحديد الحرف الموجود في الرابط إن وجد.
     *
     * مثال:
     *
     * encyclopedia.html?letter=أ
     */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedLetter =
      params.get("letter");


    if (
      requestedLetter &&
      ARABIC_LETTERS.includes(requestedLetter)
    ) {

      const exists =
        entries.some(entry => {

          return (
            getEntryLetter(
              getEntryTitle(entry)
            ) === requestedLetter
          );

        });


      if (exists) {

        showLetter(requestedLetter);

      }

    }

  } catch (error) {

    console.error(
      "Encyclopedia loading error:",
      error
    );


    /*
     * رسالة الخطأ
     */

    resultsElement.innerHTML = `
      <div class="error">

        <strong>
          تعذر التحميل
        </strong>

        حدث خطأ أثناء تحميل الموسوعة.

        <br><br>

        <small>
          ${escapeHtml(error.message)}
        </small>

        <br><br>

        <span>
          الملف المطلوب:
          <b>encyclopedia_ar.json</b>
        </span>

      </div>
    `;

  }

}


/* =========================================================
   حماية عرض رسالة الخطأ
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   بدء التطبيق
   ========================================================= */

loadEncyclopedia();

</script>

</body>
</html>
