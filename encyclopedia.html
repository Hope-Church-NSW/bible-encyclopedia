<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الموسوعة الكتابية</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a45;
    --gold:#d6b45a;
    --gold2:#f0d98a;
    --text:#f4f6f8;
    --muted:#aebdca;
    --border:rgba(214,180,90,.25);
    --shadow:0 12px 35px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(214,180,90,.07),transparent 30%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(6,19,33,.96);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(10px);
}

.header-right,
.header-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.home-btn{
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:var(--text);
    padding:10px 15px;
    border-radius:12px;
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.home-btn:hover{
    background:rgba(214,180,90,.12);
    border-color:var(--gold);
}

.logo{
    width:42px;
    height:42px;
    object-fit:contain;
}

.brand{
    color:var(--gold2);
    font-size:18px;
    font-weight:bold;
}

/* ================= MAIN ================= */

main{
    width:min(1200px,94%);
    margin:30px auto 60px;
}

/* ================= TITLE ================= */

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h1{
    margin:0;
    color:var(--gold2);
    font-size:30px;
}

.page-title p{
    color:var(--muted);
    margin:10px 0 0;
    font-size:14px;
}

/* ================= SEARCH ================= */

.search-box{
    background:linear-gradient(145deg,var(--panel),var(--panel2));
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
}

.search-box input{
    width:100%;
    padding:14px 17px;
    border-radius:12px;
    border:1px solid var(--border);
    outline:none;
    background:#071726;
    color:white;
    font-family:inherit;
    font-size:15px;
}

.search-box input::placeholder{
    color:#8193a3;
}

.search-box input:focus{
    border-color:var(--gold);
}

/* ================= LETTERS ================= */

.letters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(55px,1fr));
    gap:9px;
    margin-bottom:25px;
}

.letter{
    min-height:52px;
    border:1px solid var(--border);
    border-radius:12px;
    background:linear-gradient(145deg,#0d2138,#102a45);
    color:var(--gold2);
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    font-family:inherit;
}

.letter:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
    background:rgba(214,180,90,.12);
}

.letter.active{
    background:linear-gradient(145deg,#9d7b2f,#d6b45a);
    color:#07111d;
    border-color:var(--gold2);
}

/* ================= CONTENT ================= */

.content-layout{
    display:grid;
    grid-template-columns:330px 1fr;
    gap:20px;
    align-items:start;
}

/* ================= ENTRIES ================= */

.entries-panel,
.article-panel{
    background:linear-gradient(145deg,var(--panel),var(--panel2));
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
}

.entries-panel{
    overflow:hidden;
}

.panel-title{
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    color:var(--gold2);
    font-weight:bold;
}

.entries{
    max-height:650px;
    overflow-y:auto;
}

.entry{
    padding:14px 17px;
    border-bottom:1px solid rgba(255,255,255,.06);
    cursor:pointer;
    transition:.2s;
}

.entry:last-child{
    border-bottom:0;
}

.entry:hover{
    background:rgba(214,180,90,.08);
}

.entry.active{
    background:rgba(214,180,90,.13);
    border-right:3px solid var(--gold);
}

.entry-title{
    color:var(--gold2);
    font-weight:bold;
    font-size:16px;
}

.entry-preview{
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

/* ================= ARTICLE ================= */

.article-panel{
    min-height:500px;
    padding:28px;
}

.article-header{
    border-bottom:1px solid var(--border);
    padding-bottom:18px;
    margin-bottom:24px;
}

.article-title{
    margin:0;
    color:var(--gold2);
    font-size:28px;
}

.article-body{
    color:#e8edf2;
    line-height:2.15;
    font-size:16px;
    white-space:normal;
}

.article-body p{
    margin:0 0 20px;
}

.article-body h2,
.article-body h3,
.article-body h4{
    color:var(--gold2);
    margin-top:30px;
}

/* ================= EMPTY / LOADING ================= */

.message{
    text-align:center;
    color:var(--muted);
    padding:50px 20px;
    line-height:2;
}

.loading{
    color:var(--gold2);
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        height:auto;
        min-height:70px;
        padding:10px 14px;
    }

    .brand{
        font-size:14px;
    }

    .logo{
        width:36px;
        height:36px;
    }

    main{
        width:94%;
        margin-top:20px;
    }

    .page-title h1{
        font-size:24px;
    }

    .content-layout{
        grid-template-columns:1fr;
    }

    .entries{
        max-height:300px;
    }

    .article-panel{
        padding:20px;
    }

    .article-title{
        font-size:23px;
    }

    .article-body{
        font-size:15px;
        line-height:2;
    }

    .letters{
        grid-template-columns:repeat(7,1fr);
    }

    .letter{
        min-height:45px;
        font-size:17px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-right">
        <a href="index.html" class="home-btn">⌂ الرئيسية</a>
    </div>

    <div class="header-left">
        <img src="logo.png" class="logo" alt="شعار الكنيسة">
        <div class="brand">موسوعة الكتاب المقدس</div>
    </div>

</header>


<main>

    <section class="page-title">
        <h1>الموسوعة الكتابية</h1>
        <p>
            دائرة المعارف الكتابية — تصفح المداخل والمقالات حسب الترتيب الأبجدي
        </p>
    </section>


    <section class="search-box">
        <input
            type="search"
            id="searchInput"
            placeholder="ابحث في جميع مداخل الموسوعة..."
            autocomplete="off"
        >
    </section>


    <section id="letters" class="letters"></section>


    <section class="content-layout">

        <aside class="entries-panel">

            <div class="panel-title" id="entriesTitle">
                اختر حرفًا
            </div>

            <div id="entries" class="entries">
                <div class="message">
                    اختر أحد الحروف لعرض المداخل.
                </div>
            </div>

        </aside>


        <article class="article-panel">

            <div id="article">
                <div class="message">
                    <div class="loading">
                        جاري تحميل الموسوعة...
                    </div>
                </div>
            </div>

        </article>

    </section>

</main>


<script>

/* =========================================================
   إعدادات أساسية
========================================================= */

const ENCYCLOPEDIA_URL = "encyclopedia_ar.json";


/* =========================================================
   ترتيب الحروف العربية
========================================================= */

const ARABIC_LETTERS = [
    "ا",
    "ب",
    "ت",
    "ث",
    "ج",
    "ح",
    "خ",
    "د",
    "ذ",
    "ر",
    "ز",
    "س",
    "ش",
    "ص",
    "ض",
    "ط",
    "ظ",
    "ع",
    "غ",
    "ف",
    "ق",
    "ك",
    "ل",
    "م",
    "ن",
    "ه",
    "و",
    "ي"
];


/* =========================================================
   المتغيرات
========================================================= */

let encyclopedia = [];
let currentLetter = null;
let currentEntry = null;


/* =========================================================
   عناصر الصفحة
========================================================= */

const lettersContainer =
    document.getElementById("letters");

const entriesContainer =
    document.getElementById("entries");

const entriesTitle =
    document.getElementById("entriesTitle");

const articleContainer =
    document.getElementById("article");

const searchInput =
    document.getElementById("searchInput");


/* =========================================================
   تحميل JSON
========================================================= */

async function loadEncyclopedia(){

    try{

        const response =
            await fetch(ENCYCLOPEDIA_URL);

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        encyclopedia =
            normalizeData(data);

        buildLetters();

        showWelcome();

    }catch(error){

        console.error(error);

        articleContainer.innerHTML = `
            <div class="message">
                تعذر تحميل ملف الموسوعة.
                <br><br>
                تأكد من وجود الملف:
                <br>
                <strong>encyclopedia_ar.json</strong>
                <br><br>
                وأنه في نفس مجلد
                <strong>encyclopedia.html</strong>.
            </div>
        `;
    }
}


/* =========================================================
   توحيد شكل البيانات
   يدعم أكثر من شكل JSON
========================================================= */

function normalizeData(data){

    let result = [];

    /*
       الشكل:

       [
         {
           title:"...",
           text:"..."
         }
       ]
    */

    if(Array.isArray(data)){
        result = data;
    }

    /*
       الشكل:

       {
         entries:[...]
       }
    */

    else if(
        data &&
        Array.isArray(data.entries)
    ){
        result = data.entries;
    }

    /*
       الشكل:

       {
         articles:[...]
       }
    */

    else if(
        data &&
        Array.isArray(data.articles)
    ){
        result = data.articles;
    }

    /*
       الشكل الأبجدي:

       {
         "أ":[...],
         "ب":[...]
       }
    */

    else if(
        data &&
        typeof data === "object"
    ){

        for(
            const key of Object.keys(data)
        ){

            if(
                Array.isArray(data[key])
            ){

                data[key].forEach(item => {

                    if(
                        typeof item === "string"
                    ){

                        result.push({
                            title:item,
                            text:item
                        });

                    }else{

                        result.push(item);

                    }

                });

            }

        }

    }


    return result.map(item => {

        if(typeof item === "string"){

            return {
                title:item,
                text:item
            };

        }

        return {

            title:
                item.title ||
                item.name ||
                item.heading ||
                "",

            text:
                item.text ||
                item.content ||
                item.body ||
                item.description ||
                "",

            letter:
                item.letter ||
                "",

            ...item

        };

    }).filter(item => item.title);

}


/* =========================================================
   استخراج أول حرف
========================================================= */

function getEntryLetter(entry){

    if(entry.letter){

        let letter =
            normalizeArabicLetter(
                String(entry.letter)
            );

        if(
            ARABIC_LETTERS.includes(letter)
        ){
            return letter;
        }

    }


    let title =
        String(entry.title)
            .trim()
            .replace(/^["'«»]+/g,"");

    if(!title){
        return "";
    }


    /*
       تجاهل أل التعريف
       حتى تصبح:

       الأشوري ← ا
       أشور ← ا
       الكلداني ← ك
    */

    title =
        title.replace(/^ال/,"");


    let first =
        title.charAt(0);


    first =
        normalizeArabicLetter(first);


    return first;
}


/* =========================================================
   تطبيع الحروف
========================================================= */

function normalizeArabicLetter(letter){

    return String(letter)
        .replace(/[أإآٱ]/g,"ا")
        .replace(/ة/g,"ه")
        .trim()
        .charAt(0);
}


/* =========================================================
   بناء الحروف
========================================================= */

function buildLetters(){

    lettersContainer.innerHTML = "";

    ARABIC_LETTERS.forEach(letter => {

        const button =
            document.createElement("button");

        button.className = "letter";

        button.textContent =
            letter === "ا"
            ? "أ"
            : letter;

        button.dataset.letter =
            letter;

        button.addEventListener(
            "click",
            () => selectLetter(letter)
        );

        lettersContainer.appendChild(button);

    });

}


/* =========================================================
   اختيار حرف
========================================================= */

function selectLetter(letter){

    currentLetter = letter;

    searchInput.value = "";

    document
        .querySelectorAll(".letter")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.letter === letter
            );

        });


    const filtered =
        encyclopedia
            .filter(entry =>
                getEntryLetter(entry) === letter
            )
            .sort(compareEntries);


    entriesTitle.textContent =
        "مداخل حرف " +
        (letter === "ا" ? "أ" : letter) +
        " — " +
        filtered.length;


    renderEntries(filtered);


    if(filtered.length){

        selectEntry(filtered[0]);

    }else{

        articleContainer.innerHTML = `
            <div class="message">
                لا توجد مداخل محملة لهذا الحرف حاليًا.
            </div>
        `;

    }

}


/* =========================================================
   ترتيب المداخل
========================================================= */

function compareEntries(a,b){

    return String(a.title)
        .localeCompare(
            String(b.title),
            "ar"
        );
}


/* =========================================================
   عرض المداخل
========================================================= */

function renderEntries(list){

    entriesContainer.innerHTML = "";

    if(!list.length){

        entriesContainer.innerHTML = `
            <div class="message">
                لا توجد نتائج.
            </div>
        `;

        return;
    }


    list.forEach(entry => {

        const item =
            document.createElement("div");

        item.className = "entry";


        const title =
            document.createElement("div");

        title.className =
            "entry-title";

        title.textContent =
            entry.title;


        const preview =
            document.createElement("div");

        preview.className =
            "entry-preview";

        preview.textContent =
            createPreview(entry.text);


        item.appendChild(title);
        item.appendChild(preview);


        item.addEventListener(
            "click",
            () => selectEntry(entry)
        );


        entriesContainer.appendChild(item);

    });

}


/* =========================================================
   تحديد المدخل
========================================================= */

function selectEntry(entry){

    currentEntry = entry;


    document
        .querySelectorAll(".entry")
        .forEach(item => {

            const title =
                item.querySelector(
                    ".entry-title"
                );

            item.classList.toggle(
                "active",
                title &&
                title.textContent === entry.title
            );

        });


    renderArticle(entry);

}


/* =========================================================
   عرض المقال
========================================================= */

function renderArticle(entry){

    const title =
        escapeHTML(entry.title);


    const body =
        formatText(entry.text);


    articleContainer.innerHTML = `

        <div class="article-header">

            <h2 class="article-title">
                ${title}
            </h2>

        </div>

        <div class="article-body">
            ${body}
        </div>

    `;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   تنسيق النص
========================================================= */

function formatText(text){

    if(!text){
        return `
            <p>
                لا يوجد محتوى متاح لهذا المدخل.
            </p>
        `;
    }


    /*
       إذا كان النص يحتوي HTML محفوظًا
       يمكن استخدامه كما هو بعد التنظيف
       لكننا افتراضيًا نتعامل معه كنص.
    */

    let safe =
        escapeHTML(String(text));


    /*
       الحفاظ على الفقرات والأسطر
    */

    safe =
        safe
            .replace(/\r\n/g,"\n")
            .replace(/\r/g,"\n");


    const paragraphs =
        safe
            .split(/\n{2,}/)
            .map(p => p.trim())
            .filter(Boolean);


    return paragraphs
        .map(p => {

            return `
                <p>
                    ${p.replace(/\n/g,"<br>")}
                </p>
            `;

        })
        .join("");

}


/* =========================================================
   معاينة
========================================================= */

function createPreview(text){

    if(!text){
        return "";
    }

    const clean =
        String(text)
            .replace(/\s+/g," ")
            .trim();

    if(clean.length <= 130){
        return clean;
    }

    return clean.substring(0,130) + "...";

}


/* =========================================================
   البحث العام
========================================================= */

searchInput.addEventListener(
    "input",
    performSearch
);


function performSearch(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    if(!query){

        if(currentLetter){

            selectLetter(currentLetter);

        }else{

            showWelcome();

        }

        return;
    }


    document
        .querySelectorAll(".letter")
        .forEach(button =>
            button.classList.remove("active")
        );


    currentLetter = null;


    const results =
        encyclopedia
            .filter(entry => {

                const title =
                    String(entry.title)
                        .toLowerCase();

                const text =
                    String(entry.text)
                        .toLowerCase();

                return (
                    title.includes(query) ||
                    text.includes(query)
                );

            })
            .sort(compareEntries);


    entriesTitle.textContent =
        "نتائج البحث — " +
        results.length;


    renderEntries(results);


    if(results.length){

        selectEntry(results[0]);

    }else{

        articleContainer.innerHTML = `
            <div class="message">
                لا توجد نتائج مطابقة للبحث.
            </div>
        `;

    }

}


/* =========================================================
   شاشة البداية
========================================================= */

function showWelcome(){

    entriesTitle.textContent =
        "الموسوعة الكتابية";


    entriesContainer.innerHTML = `
        <div class="message">
            <strong>
                ${encyclopedia.length}
            </strong>
            مدخلًا محملًا
            <br><br>
            اختر حرفًا من الأبجدية
            لعرض المداخل.
        </div>
    `;


    articleContainer.innerHTML = `
        <div class="message">

            <div style="
                font-size:48px;
                margin-bottom:15px;
            ">
                📖
            </div>

            <div style="
                color:var(--gold2);
                font-size:22px;
                font-weight:bold;
            ">
                دائرة المعارف الكتابية
            </div>

            <p>
                اختر حرفًا من الأبجدية
                أو استخدم مربع البحث
                للوصول إلى المدخل المطلوب.
            </p>

        </div>
    `;

}


/* =========================================================
   حماية HTML
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   التشغيل
========================================================= */

loadEncyclopedia();

</script>

</body>
</html>
