<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a45;
    --gold:#d4af37;
    --gold2:#f0d878;
    --text:#f4f7fb;
    --muted:#aebdcd;
    --border:rgba(212,175,55,.35);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#102b48 0%,var(--bg) 45%,#030b14 100%);
    color:var(--text);
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    min-height:82px;
    padding:12px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    background:rgba(6,19,33,.96);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
}

.header-right{
    display:flex;
    align-items:center;
}

.home-btn{
    display:flex;
    align-items:center;
    gap:8px;

    padding:11px 17px;

    border:1px solid var(--border);
    border-radius:12px;

    background:var(--panel);

    color:var(--gold2);
    font-size:16px;
    font-weight:bold;

    transition:.2s;
}

.home-btn:hover{
    background:var(--panel2);
    transform:translateY(-1px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:54px;
    height:54px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold2);
    font-size:20px;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

main{
    width:min(1200px,94%);
    margin:0 auto;
    padding:35px 0 60px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title .icon{
    font-size:48px;
    margin-bottom:8px;
}

.page-title h1{
    margin:0;
    color:var(--gold2);
    font-size:32px;
}

.page-title p{
    color:var(--muted);
    font-size:17px;
    margin-top:10px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    margin:0 auto 30px;
    max-width:850px;
}

.search-box input{
    width:100%;
    padding:17px 20px;

    border-radius:15px;
    border:1px solid var(--border);

    background:rgba(13,33,56,.92);
    color:white;

    font-family:Tahoma,Arial,sans-serif;
    font-size:18px;

    outline:none;
}

.search-box input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,175,55,.12);
}

.search-box input::placeholder{
    color:#8fa1b4;
}

/* =========================
   STATUS
========================= */

.status{
    max-width:850px;
    margin:20px auto;
    padding:16px 20px;

    border-radius:14px;
    text-align:center;

    color:var(--muted);
    background:rgba(13,33,56,.8);
    border:1px solid var(--border);
}

.status.error{
    color:#ffb4b4;
    border-color:rgba(255,90,90,.45);
}

/* =========================
   LETTERS
========================= */

.letters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
    gap:12px;

    margin-bottom:35px;
}

.letter{
    min-height:68px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid var(--border);
    border-radius:14px;

    background:linear-gradient(145deg,var(--panel2),var(--panel));

    color:var(--gold2);

    font-size:27px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.letter:hover,
.letter.active{
    background:var(--gold);
    color:#071321;
    transform:translateY(-2px);
}

/* =========================
   CONTENT
========================= */

.content{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
}

.entry{
    padding:22px;

    background:linear-gradient(145deg,#102a45,#0b1d31);

    border:1px solid rgba(212,175,55,.25);
    border-radius:16px;

    cursor:pointer;

    transition:.2s;
}

.entry:hover{
    border-color:var(--gold);
    transform:translateY(-3px);
}

.entry-title{
    color:var(--gold2);
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.entry-preview{
    color:#c3ced9;
    line-height:1.9;
    font-size:15px;
}

.empty{
    grid-column:1/-1;

    padding:45px 20px;
    text-align:center;

    color:var(--muted);

    border:1px dashed var(--border);
    border-radius:16px;
}

/* =========================
   ARTICLE
========================= */

.article{
    display:none;

    max-width:1000px;
    margin:0 auto;

    padding:30px;

    background:linear-gradient(145deg,#102a45,#0b1d31);

    border:1px solid var(--border);
    border-radius:18px;
}

.article.show{
    display:block;
}

.article-back{
    display:inline-flex;
    align-items:center;
    gap:8px;

    margin-bottom:25px;
    padding:10px 16px;

    border-radius:10px;
    border:1px solid var(--border);

    background:var(--panel);

    color:var(--gold2);
    cursor:pointer;
}

.article h2{
    margin-top:0;

    color:var(--gold2);
    font-size:30px;

    border-bottom:1px solid var(--border);
    padding-bottom:18px;
}

.article-body{
    color:#e6edf5;

    font-size:18px;
    line-height:2.15;

    white-space:pre-wrap;
}

.article-body p{
    margin:0 0 18px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:10px 12px;
    }

    .brand-title{
        font-size:15px;
    }

    .brand img{
        width:45px;
        height:45px;
    }

    .home-btn{
        padding:9px 11px;
        font-size:13px;
    }

    main{
        width:94%;
        padding-top:25px;
    }

    .page-title h1{
        font-size:26px;
    }

    .page-title .icon{
        font-size:40px;
    }

    .letters{
        grid-template-columns:repeat(5,1fr);
    }

    .letter{
        min-height:58px;
        font-size:22px;
    }

    .article{
        padding:20px 16px;
    }

    .article h2{
        font-size:24px;
    }

    .article-body{
        font-size:17px;
        line-height:2;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-right">
        <a class="home-btn" href="index.html">
            ⌂ الرئيسية
        </a>
    </div>

    <div class="brand">
        <img src="assets/logo.png" alt="شعار الكنيسة">
        <div class="brand-title">
            موسوعة الكتاب المقدس
        </div>
    </div>

</header>


<main>

    <section class="page-title">

        <div class="icon">📚</div>

        <h1>موسوعة الكتاب المقدس</h1>

        <p>
            موسوعة الدراسات والمعلومات الكتابية
        </p>

    </section>


    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="🔎 ابحث في الموسوعة..."
            autocomplete="off"
        >

    </div>


    <div id="status" class="status">
        جارٍ تحميل محتوى الموسوعة...
    </div>


    <section id="lettersSection">

        <div id="letters" class="letters"></div>

    </section>


    <section id="content" class="content"></section>


    <section id="article" class="article">

        <button
            id="backButton"
            class="article-back"
            type="button">
            → العودة إلى الموسوعة
        </button>

        <h2 id="articleTitle"></h2>

        <div
            id="articleBody"
            class="article-body">
        </div>

    </section>

</main>


<script>

/* ============================================================
   إعدادات أساسية
============================================================ */

/*
   IMPORTANT

   الملف موجود في جذر المستودع:

   encyclopedia_ar.json

   وليس:

   encyclopedia_text/encyclopedia_ar.json
*/

const ENCYCLOPEDIA_URL = "encyclopedia_ar.json";


const ARABIC_LETTERS = [
    "ا","ب","ت","ث","ج","ح","خ",
    "د","ذ","ر","ز","س","ش","ص",
    "ض","ط","ظ","ع","غ","ف","ق",
    "ك","ل","م","ن","ه","و","ي"
];


let encyclopediaData = [];

let currentLetter = null;


/* ============================================================
   عناصر الصفحة
============================================================ */

const statusBox = document.getElementById("status");

const lettersBox = document.getElementById("letters");

const contentBox = document.getElementById("content");

const articleBox = document.getElementById("article");

const articleTitle = document.getElementById("articleTitle");

const articleBody = document.getElementById("articleBody");

const backButton = document.getElementById("backButton");

const searchInput = document.getElementById("searchInput");


/* ============================================================
   أدوات مساعدة
============================================================ */

function normalizeArabic(text){

    return String(text || "")
        .trim()
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/[إأآٱ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/ئ/g,"ي");

}


function firstArabicLetter(text){

    const value = normalizeArabic(text);

    for(const char of value){

        if(ARABIC_LETTERS.includes(char)){
            return char;
        }

    }

    return "";

}


/* ============================================================
   تطبيع بنية JSON

   هذه الدالة تجعل الصفحة قادرة على التعامل مع أكثر
   من شكل محتمل للملف الذي تم إنتاجه من OCR.
============================================================ */

function normalizeData(raw){

    let result = [];


    /* الحالة الأولى:
       Array مباشر
    */

    if(Array.isArray(raw)){
        result = raw;
    }


    /* الحالة الثانية:
       object يحتوي entries
    */

    else if(
        raw &&
        Array.isArray(raw.entries)
    ){
        result = raw.entries;
    }


    /* الحالة الثالثة:
       object يحتوي data
    */

    else if(
        raw &&
        Array.isArray(raw.data)
    ){
        result = raw.data;
    }


    /* الحالة الرابعة:
       object يحتوي encyclopedia
    */

    else if(
        raw &&
        Array.isArray(raw.encyclopedia)
    ){
        result = raw.encyclopedia;
    }


    /*
       الحالة الخامسة:

       الملف عبارة عن:

       {
          "آدم": {...},
          "إبراهيم": {...}
       }
    */

    else if(
        raw &&
        typeof raw === "object"
    ){

        result = Object.entries(raw).map(
            ([key,value]) => {

                if(
                    value &&
                    typeof value === "object" &&
                    !Array.isArray(value)
                ){

                    return {
                        title:
                            value.title ||
                            value.name ||
                            key,

                        content:
                            value.content ||
                            value.text ||
                            value.body ||
                            value.description ||
                            "",

                        ...value
                    };

                }

                return {
                    title:key,
                    content:String(value ?? "")
                };

            }
        );

    }


    /*
       تحويل كل عنصر إلى بنية موحدة
    */

    return result
        .map((item,index) => {

            if(
                typeof item === "string"
            ){

                return {
                    id:index,
                    title:item,
                    content:""
                };

            }


            if(
                !item ||
                typeof item !== "object"
            ){

                return null;

            }


            const title =
                item.title ??
                item.name ??
                item.term ??
                item.word ??
                item.heading ??
                item.key ??
                `مدخل ${index + 1}`;


            const content =
                item.content ??
                item.text ??
                item.body ??
                item.description ??
                item.article ??
                item.entry ??
                "";


            return {
                ...item,

                id:
                    item.id ??
                    index,

                title:String(title),

                content:
                    typeof content === "string"
                        ? content
                        : JSON.stringify(content,null,2)
            };

        })
        .filter(Boolean);

}


/* ============================================================
   إنشاء الحروف
============================================================ */

function buildLetters(){

    lettersBox.innerHTML = "";


    ARABIC_LETTERS.forEach(letter => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "letter";

        button.textContent = letter;

        button.dataset.letter = letter;


        button.addEventListener(
            "click",
            () => {

                currentLetter = letter;

                document
                    .querySelectorAll(".letter")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                searchInput.value = "";

                showEntriesByLetter(letter);

            }
        );


        lettersBox.appendChild(button);

    });

}


/* ============================================================
   عرض المداخل حسب الحرف
============================================================ */

function showEntriesByLetter(letter){

    articleBox.classList.remove("show");

    contentBox.style.display = "grid";

    document.getElementById("lettersSection")
        .style.display = "block";


    const entries =
        encyclopediaData.filter(item => {

            return firstArabicLetter(item.title) === letter;

        });


    renderEntries(entries);


    statusBox.textContent =
        `مداخل حرف «${letter}»: ${entries.length}`;

}


/* ============================================================
   عرض جميع المداخل
============================================================ */

function renderEntries(entries){

    contentBox.innerHTML = "";


    if(!entries.length){

        contentBox.innerHTML = `
            <div class="empty">
                لا توجد مداخل متاحة لهذا الحرف.
            </div>
        `;

        return;

    }


    entries.forEach(item => {

        const card =
            document.createElement("article");

        card.className = "entry";


        const title =
            document.createElement("div");

        title.className = "entry-title";

        title.textContent = item.title;


        const preview =
            document.createElement("div");

        preview.className = "entry-preview";


        const previewText =
            String(item.content || "")
                .replace(/\s+/g," ")
                .trim();


        preview.textContent =
            previewText.length > 220
                ? previewText.substring(0,220) + "..."
                : previewText;


        card.appendChild(title);

        card.appendChild(preview);


        card.addEventListener(
            "click",
            () => openArticle(item)
        );


        contentBox.appendChild(card);

    });

}


/* ============================================================
   فتح المقال
============================================================ */

function openArticle(item){

    contentBox.style.display = "none";

    document.getElementById("lettersSection")
        .style.display = "none";


    articleBox.classList.add("show");


    articleTitle.textContent =
        item.title;


    articleBody.innerHTML = "";


    const text =
        String(item.content || "").trim();


    if(!text){

        articleBody.innerHTML =
            "<p>لا يوجد نص متاح لهذا المدخل حاليًا.</p>";

    }

    else{

        /*
           نحافظ على فقرات OCR
        */

        const paragraphs =
            text
                .split(/\n\s*\n/)
                .map(p => p.trim())
                .filter(Boolean);


        if(paragraphs.length){

            paragraphs.forEach(paragraph => {

                const p =
                    document.createElement("p");

                p.textContent = paragraph;

                articleBody.appendChild(p);

            });

        }

        else{

            const p =
                document.createElement("p");

            p.textContent = text;

            articleBody.appendChild(p);

        }

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ============================================================
   زر العودة
============================================================ */

backButton.addEventListener(
    "click",
    () => {

        articleBox.classList.remove("show");

        contentBox.style.display = "grid";

        document.getElementById("lettersSection")
            .style.display = "block";


        if(currentLetter){

            showEntriesByLetter(currentLetter);

        }
        else{

            renderEntries(encyclopediaData);

            statusBox.textContent =
                `إجمالي المداخل: ${encyclopediaData.length}`;

        }

    }
);


/* ============================================================
   البحث
============================================================ */

searchInput.addEventListener(
    "input",
    () => {

        const query =
            normalizeArabic(searchInput.value);


        if(!query){

            if(currentLetter){

                showEntriesByLetter(currentLetter);

            }
            else{

                renderEntries(encyclopediaData);

                statusBox.textContent =
                    `إجمالي المداخل: ${encyclopediaData.length}`;

            }

            return;

        }


        currentLetter = null;


        document
            .querySelectorAll(".letter")
            .forEach(btn =>
                btn.classList.remove("active")
            );


        const results =
            encyclopediaData.filter(item => {

                const title =
                    normalizeArabic(item.title);

                const content =
                    normalizeArabic(item.content);

                return (
                    title.includes(query) ||
                    content.includes(query)
                );

            });


        articleBox.classList.remove("show");

        contentBox.style.display = "grid";

        document.getElementById("lettersSection")
            .style.display = "block";


        renderEntries(results);


        statusBox.textContent =
            `نتائج البحث: ${results.length}`;

    }
);


/* ============================================================
   تحميل الموسوعة
============================================================ */

async function loadEncyclopedia(){

    try{

        statusBox.classList.remove("error");

        statusBox.textContent =
            "جارٍ تحميل محتوى الموسوعة...";


        /*
           منع التخزين المؤقت أثناء التطوير
        */

        const response =
            await fetch(
                ENCYCLOPEDIA_URL + "?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status} - ${response.statusText}`
            );

        }


        const raw =
            await response.json();


        encyclopediaData =
            normalizeData(raw);


        if(!encyclopediaData.length){

            throw new Error(
                "تم تحميل الملف ولكن لم يتم العثور على مداخل موسوعية."
            );

        }


        buildLetters();


        renderEntries(
            encyclopediaData
        );


        statusBox.textContent =
            `تم تحميل الموسوعة بنجاح — ${encyclopediaData.length} مدخل`;


    }

    catch(error){

        console.error(
            "Encyclopedia loading error:",
            error
        );


        statusBox.classList.add("error");


        statusBox.innerHTML = `
            <strong>⚠️ تعذر تحميل الموسوعة</strong>
            <br><br>
            تأكد من وجود الملف:
            <br>
            <b>encyclopedia_ar.json</b>
            <br><br>
            ورسالة الخطأ:
            <br>
            ${escapeHtml(error.message)}
        `;

    }

}


/* ============================================================
   حماية عرض رسالة الخطأ
============================================================ */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================================
   تشغيل
============================================================ */

buildLetters();

loadEncyclopedia();

</script>

</body>
</html>
