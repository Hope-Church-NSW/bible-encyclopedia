<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس</title>

<link rel="stylesheet" href="./encyclopedia.css">

</head>

<body>

<header class="site-header">

    <!-- اليمين: الدراسات -->
    <div class="header-right">

        <a href="./studies.html" class="back-button">

            <span class="back-icon">⟵</span>

            <span>الدراسات</span>

        </a>

    </div>


    <!-- اليسار: اللوجو والموسوعة -->
    <div class="header-left">

        <img
            src="./assets/logo.png"
            alt="شعار الكنيسة"
            class="church-logo"
        >

        <div class="brand">

            <div class="brand-title">
                موسوعة الكتاب المقدس
            </div>

            <div class="brand-subtitle">
                دائرة المعارف الكتابية
            </div>

        </div>

    </div>

</header>


<main class="encyclopedia-container">


    <!-- العنوان -->

    <section class="encyclopedia-heading">

        <h1>
            موسوعة الكتاب المقدس
        </h1>

        <p>
            دائرة المعارف الكتابية
        </p>

    </section>


    <!-- الحروف -->

    <section class="letters-section">

        <div class="section-heading">

            <span class="section-icon">
                أ
            </span>

            <div>

                <h2>
                    المداخل الأبجدية
                </h2>

                <p>
                    اختر حرفًا لعرض جميع المداخل التابعة له
                </p>

            </div>

        </div>


        <div
            id="lettersGrid"
            class="letters-grid">
        </div>

    </section>


    <!-- مساحة الموسوعة -->

    <section class="encyclopedia-workspace">


        <!-- قائمة المداخل -->

        <aside class="entries-sidebar">

            <div class="entries-header">

                <div>

                    <h2 id="entriesTitle">
                        المداخل
                    </h2>

                    <span id="entriesCount">
                        اختر حرفًا
                    </span>

                </div>

            </div>


            <!-- البحث -->

            <div class="search-wrapper">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    id="entrySearch"
                    type="search"
                    placeholder="ابحث في المداخل..."
                    autocomplete="off"
                >

            </div>


            <!-- المداخل -->

            <div
                id="entriesList"
                class="entries-list">

                <div class="empty-state">

                    <div class="empty-icon">
                        📖
                    </div>

                    <div>
                        اختر حرفًا من الأعلى
                    </div>

                </div>

            </div>

        </aside>


        <!-- المقال -->

        <article
            id="articlePanel"
            class="article-panel">

            <div
                id="articleContainer"
                class="article-container">

                <div class="article-placeholder">

                    <div class="placeholder-icon">
                        📚
                    </div>

                    <h2>
                        موسوعة الكتاب المقدس
                    </h2>

                    <p>
                        اختر حرفًا ثم اختر أحد المداخل
                        لعرض الدراسة كاملة هنا.
                    </p>

                </div>

            </div>

        </article>


    </section>

</main>


<script src="./encyclopedia-search.js"></script>

</body>

</html>
