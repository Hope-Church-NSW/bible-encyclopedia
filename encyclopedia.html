<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a45;
    --gold:#d8b35a;
    --gold2:#f0d58b;
    --text:#f3f6fa;
    --muted:#aebdca;
    --border:rgba(216,179,90,.28);
    --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top right,rgba(30,75,120,.25),transparent 35%),
        linear-gradient(145deg,var(--bg),var(--bg2));
    color:var(--text);
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
}

button,
a{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(6,19,33,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    min-height:76px;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--text);
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#123a60,#0b2036);
    border:1px solid var(--border);
    font-size:25px;
}

.home-btn{
    color:var(--gold2);
    text-decoration:none;
    padding:10px 15px;
    border:1px solid var(--border);
    border-radius:12px;
    transition:.2s;
}

.home-btn:hover{
    background:rgba(216,179,90,.1);
}

/* =========================
   MAIN
========================= */

main{
    width:min(1250px,calc(100% - 28px));
    margin:28px auto 70px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title .icon{
    font-size:48px;
    margin-bottom:8px;
}

.page-title h1{
    margin:0;
    color:var(--gold2);
    font-size:clamp(25px,4vw,38px);
}

.page-title p{
    color:var(--muted);
    margin:10px 0 0;
    font-size:15px;
}

/* =========================
   ALPHABET
========================= */

.alphabet-panel{
    background:linear-gradient(145deg,rgba(13,33,56,.95),rgba(9,26,43,.95));
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:28px;
}

.alphabet-title{
    color:var(--gold2);
    font-size:16px;
    margin-bottom:14px;
    font-weight:bold;
}

.alphabet{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.letter-btn{
    border:1px solid var(--border);
    background:#0b1e31;
    color:#fff;
    min-width:39px;
    height:39px;
    border-radius:10px;
    font-size:17px;
    transition:.2s;
}

.letter-btn:hover,
.letter-btn.active{
    background:var(--gold);
    color:#071321;
    border-color:var(--gold);
}

/* =========================
   LETTER HEADER
========================= */

.letter-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.letter-name{
    color:var(--gold2);
    font-size:25px;
    font-weight:bold;
}

.entry-count{
    color:var(--muted);
    font-size:14px;
}

/* =========================
   ENTRIES
========================= */

.entries{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

.entry-card{
    position:relative;
    background:linear-gradient(145deg,var(--panel),var(--panel2));
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:20px;
    min-height:170px;
    cursor:pointer;
    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.entry-card:hover{
    transform:translateY(-3px);
    border-color:var(--border);
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.entry-title{
    margin:0 0 10px;
    color:#fff;
    font-size:21px;
}

.entry-category{
    display:inline-block;
    color:var(--gold2);
    font-size:12px;
    background:rgba(216,179,90,.08);
    border:1px solid rgba(216,179,90,.2);
    border-radius:20px;
    padding:5px 9px;
    margin-bottom:12px;
}

.entry-preview{
    color:#b8c6d3;
    font-size:14px;
    line-height:1.9;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.open-label{
    position:absolute;
    left:16px;
    bottom:15px;
    color:var(--gold2);
    font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    background:rgba(0,0,0,.76);
    backdrop-filter:blur(7px);
    padding:20px;
    overflow-y:auto;
}

.modal.show{
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.modal-box{
    width:min(1050px,100%);
    margin:25px auto;
    background:
        linear-gradient(145deg,#0c2137,#081a2c);
    border:1px solid var(--border);
    border-radius:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
    overflow:hidden;
}

.modal-header{
    padding:22px 25px;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.modal-title{
    margin:0;
    color:var(--gold2);
    font-size:30px;
}

.modal-category{
    margin-top:8px;
    color:var(--muted);
    font-size:14px;
}

.close-btn{
    width:42px;
    height:42px;
    flex-shrink:0;
    border:1px solid var(--border);
    background:#0b1c2d;
    color:#fff;
    border-radius:12px;
    font-size:23px;
}

.close-btn:hover{
    background:#182e45;
}

/* =========================
   STUDY CONTENT
========================= */

.study{
    padding:28px;
}

.study-intro{
    background:rgba(216,179,90,.06);
    border-right:4px solid var(--gold);
    padding:18px 20px;
    border-radius:12px;
    margin-bottom:25px;
}

.study-intro strong{
    color:var(--gold2);
}

.study-section{
    margin-bottom:30px;
}

.study-section h3{
    color:var(--gold2);
    font-size:21px;
    margin:0 0 14px;
    padding-bottom:9px;
    border-bottom:1px solid rgba(216,179,90,.18);
}

.study-text{
    color:#e1e8ef;
    font-size:16px;
    line-height:2.15;
    white-space:pre-line;
}

.study-text p{
    margin:0 0 18px;
}

/* =========================
   REFERENCES
========================= */

.references{
    margin-top:35px;
    padding:22px;
    border:1px solid var(--border);
    border-radius:16px;
    background:rgba(5,17,29,.45);
}

.references h3{
    margin:0 0 15px;
    color:var(--gold2);
}

.reference-list{
    margin:0;
    padding-right:22px;
    color:#c9d5df;
    line-height:2;
}

.reference-list li{
    margin-bottom:5px;
}

/* =========================
   LOADING / ERROR
========================= */

.status{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.error{
    color:#ffb4b4;
    background:rgba(130,30,30,.18);
    border:1px solid rgba(255,100,100,.2);
    padding:20px;
    border-radius:15px;
    line-height:1.9;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header-inner{
        min-height:68px;
        padding:10px 12px;
    }

    .brand{
        font-size:15px;
    }

    .brand-icon{
        width:40px;
        height:40px;
        font-size:21px;
    }

    .home-btn{
        padding:8px 10px;
        font-size:13px;
    }

    main{
        width:min(100% - 18px,1250px);
        margin-top:18px;
    }

    .alphabet-panel{
        padding:15px;
        border-radius:16px;
    }

    .letter-btn{
        min-width:36px;
        height:36px;
    }

    .entries{
        grid-template-columns:1fr;
    }

    .modal{
        padding:8px;
    }

    .modal-box{
        margin:8px auto;
        border-radius:18px;
    }

    .modal-header{
        padding:17px;
    }

    .modal-title{
        font-size:23px;
    }

    .study{
        padding:18px;
    }

    .study-text{
        font-size:15px;
        line-height:2;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="home-btn">
            ⌂ الرئيسية
        </a>

        <a href="index.html" class="brand">
            <span class="brand-icon">📚</span>
            <span>موسوعة الكتاب المقدس</span>
        </a>

    </div>
</header>

<main>

    <section class="page-title">
        <div class="icon">📚</div>
        <h1>موسوعة الكتاب المقدس</h1>
        <p>دائرة المعارف الكتابية — قاعدة البيانات العربية المركزية</p>
    </section>

    <section class="alphabet-panel">

        <div class="alphabet-title">
            🔎 المداخل الأبجدية
        </div>

        <div id="alphabet" class="alphabet"></div>

    </section>

    <section>

        <div class="letter-header">
            <div id="letterName" class="letter-name">
                حرف أ
            </div>

            <div id="entryCount" class="entry-count">
                جاري التحميل...
            </div>
        </div>

        <div id="entries" class="entries">
            <div class="status">
                جاري تحميل الموسوعة...
            </div>
        </div>

    </section>

</main>


<!-- =========================
     STUDY MODAL
========================= -->

<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <div>
                <h2 id="modalTitle" class="modal-title"></h2>
                <div id="modalCategory" class="modal-category"></div>
            </div>

            <button
                id="closeModal"
                class="close-btn"
                aria-label="إغلاق">
                ×
            </button>

        </div>

        <article id="studyContent" class="study"></article>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const ENCYCLOPEDIA_URL = "encyclopedia_ar.json";


/* =========================================================
   ARABIC ALPHABET
   ========================================================= */

const ARABIC_LETTERS = [
    "أ","ب","ت","ث","ج","ح","خ","د","ذ","ر",
    "ز","س","ش","ص","ض","ط","ظ","ع","غ","ف",
    "ق","ك","ل","م","ن","ه","و","ي"
];


/* =========================================================
   DOM
   ========================================================= */

const alphabetEl     = document.getElementById("alphabet");
const entriesEl      = document.getElementById("entries");
const letterNameEl   = document.getElementById("letterName");
const entryCountEl   = document.getElementById("entryCount");

const modal          = document.getElementById("modal");
const modalTitle     = document.getElementById("modalTitle");
const modalCategory  = document.getElementById("modalCategory");
const studyContent   = document.getElementById("studyContent");
const closeModal     = document.getElementById("closeModal");


/* =========================================================
   STATE
   ========================================================= */

let encyclopedia = [];
let currentLetter = "أ";


/* =========================================================
   NORMALIZE ARABIC
   ========================================================= */

function normalizeArabic(value){

    return String(value || "")
        .trim()
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/ٱ/g,"ا")
        .replace(/إ/g,"أ")
        .replace(/آ/g,"أ");

}


/* =========================================================
   IMPORTANT:
   DO NOT CHANGE THE DATABASE.
   
   The database uses:
       content
   
   NOT:
       text
   ========================================================= */

function getEntryContent(entry){

    if(!entry) return "";

    if(typeof entry.content === "string" && entry.content.trim()){
        return entry.content.trim();
    }

    /*
       Compatibility only.
       This does NOT modify the database.
    */

    if(typeof entry.text === "string" && entry.text.trim()){
        return entry.text.trim();
    }

    return "";
}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadEncyclopedia(){

    try{

        const response = await fetch(
            ENCYCLOPEDIA_URL,
            {cache:"no-store"}
        );

        if(!response.ok){
            throw new Error(
                `HTTP ${response.status} — تعذر تحميل ${ENCYCLOPEDIA_URL}`
            );
        }

        const data = await response.json();

        if(!data || !Array.isArray(data.entries)){
            throw new Error(
                "بنية encyclopedia_ar.json غير صحيحة. يجب أن تحتوي على entries."
            );
        }

        encyclopedia = data.entries;

        buildAlphabet();

        renderLetter(currentLetter);

    }catch(error){

        console.error(error);

        entriesEl.innerHTML = `
            <div class="error">
                <strong>حدث خطأ أثناء تحميل الموسوعة.</strong>
                <br><br>
                ${escapeHtml(error.message)}
                <br><br>
                تأكد من وجود الملف:
                <strong>encyclopedia_ar.json</strong>
                في نفس مجلد هذه الصفحة.
            </div>
        `;

        entryCountEl.textContent = "تعذر التحميل";
    }

}


/* =========================================================
   BUILD ALPHABET
   ========================================================= */

function buildAlphabet(){

    alphabetEl.innerHTML = "";

    ARABIC_LETTERS.forEach(letter => {

        const button = document.createElement("button");

        button.className = "letter-btn";

        if(letter === currentLetter){
            button.classList.add("active");
        }

        button.textContent = letter;

        button.addEventListener("click", () => {

            currentLetter = letter;

            document
                .querySelectorAll(".letter-btn")
                .forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");

            renderLetter(letter);

        });

        alphabetEl.appendChild(button);

    });

}


/* =========================================================
   GET LETTER
   ========================================================= */

function getEntryLetter(entry){

    /*
       Prefer the explicit letter field from JSON.
       This preserves the database structure.
    */

    if(entry && entry.letter){
        return String(entry.letter).trim();
    }

    const title = String(entry?.title || "").trim();

    return title.charAt(0);

}


/* =========================================================
   RENDER LETTER
   ========================================================= */

function renderLetter(letter){

    letterNameEl.textContent = `حرف ${letter}`;

    const normalizedLetter = normalizeArabic(letter);

    const entries = encyclopedia.filter(entry => {

        const entryLetter = getEntryLetter(entry);

        return normalizeArabic(entryLetter) === normalizedLetter;

    });

    entryCountEl.textContent =
        `${entries.length} مدخل`;

    entriesEl.innerHTML = "";

    if(!entries.length){

        entriesEl.innerHTML = `
            <div class="status">
                لا توجد مداخل لهذا الحرف حاليًا.
            </div>
        `;

        return;
    }

    entries.forEach(entry => {

        const card = createEntryCard(entry);

        entriesEl.appendChild(card);

    });

}


/* =========================================================
   CREATE ENTRY CARD
   ========================================================= */

function createEntryCard(entry){

    const card = document.createElement("article");

    card.className = "entry-card";

    const title = entry.title || "مدخل بدون عنوان";

    const category =
        entry.category ||
        "مدخل موسوعي";

    const content = getEntryContent(entry);

    let preview = content;

    if(!preview){
        preview = "لا يوجد محتوى لهذا المدخل.";
    }

    card.innerHTML = `
        <h2 class="entry-title">
            ${escapeHtml(title)}
        </h2>

        <div class="entry-category">
            ${escapeHtml(category)}
        </div>

        <div class="entry-preview">
            ${escapeHtml(preview)}
        </div>

        <div class="open-label">
            📖 فتح الدراسة
        </div>
    `;

    card.addEventListener("click", () => {

        openStudy(entry);

    });

    return card;

}


/* =========================================================
   OPEN STUDY
   ========================================================= */

function openStudy(entry){

    const title =
        entry.title ||
        "مدخل موسوعي";

    const category =
        entry.category ||
        "موسوعة الكتاب المقدس";

    const content =
        getEntryContent(entry);

    modalTitle.textContent = title;

    modalCategory.textContent = category;

    studyContent.innerHTML =
        buildDeepStudyView(entry, content);

    modal.classList.add("show");

    document.body.style.overflow = "hidden";

}


/* =========================================================
   DEEP STUDY VIEW
   ========================================================= */

function buildDeepStudyView(entry, content){

    if(!content){

        return `
            <div class="status">
                لا يوجد محتوى لهذا المدخل في قاعدة البيانات.
            </div>
        `;

    }

    /*
       IMPORTANT:
       We do not fabricate encyclopedia material here.

       The content الموجود في encyclopedia_ar.json
       هو المادة العلمية الأساسية.

       هذه الصفحة تقوم بعرضها بصورة موسوعية منظمة،
       ولا تستبدل النص الأصلي بنص مختصر.
    */

    const paragraphs = splitIntoParagraphs(content);

    let html = "";

    html += `
        <div class="study-intro">
            <strong>الدراسة الموسوعية:</strong>
            ${escapeHtml(entry.title || "")}
        </div>
    `;

    html += `
        <section class="study-section">
            <h3>الدراسة</h3>
            <div class="study-text">
    `;

    paragraphs.forEach(paragraph => {

        html += `
            <p>${escapeHtml(paragraph)}</p>
        `;

    });

    html += `
            </div>
        </section>
    `;

    html += buildReferenceSection(entry);

    return html;

}


/* =========================================================
   SPLIT CONTENT INTO PARAGRAPHS
   ========================================================= */

function splitIntoParagraphs(content){

    return String(content)
        .split(/\n\s*\n+/)
        .map(text => text.trim())
        .filter(Boolean);

}


/* =========================================================
   REFERENCE FRAMEWORK
   ========================================================= */

function buildReferenceSection(entry){

    return `
        <section class="references">

            <h3>📚 إطار المراجع المعتمدة للدراسة</h3>

            <ul class="reference-list">

                <li>
                    النص الكتابي: الأسفار والآيات المرتبطة بالمدخل،
                    مع قراءة السياق الأدبي والتاريخي للنص.
                </li>

                <li>
                    دائرة المعارف الكتابية — المادة الموسوعية
                    الأساسية عند توفر المدخل.
                </li>

                <li>
                    Matthew Henry — للمقارنة التفسيرية والروحية.
                </li>

                <li>
                    Keil & Delitzsch — للتحليل التفسيري
                    واللغوي والتاريخي للعهد القديم.
                </li>

                <li>
                    Pulpit Commentary — للمقارنة بين التفسيرات
                    والسياق الكتابي.
                </li>

                <li>
                    Ellicott's Commentary — للدراسة التاريخية
                    واللغوية والتفسيرية.
                </li>

                <li>
                    Benson Commentary — للمقارنة التفسيرية.
                </li>

                <li>
                    Jamieson-Fausset-Brown — للمقارنة التفسيرية
                    والربط بين المواضع الكتابية.
                </li>

                <li>
                    Jewish Encyclopedia — عند ارتباط المدخل
                    بالخلفية اليهودية والتاريخية.
                </li>

                <li>
                    Jewish Virtual Library — للمعلومات التاريخية
                    والجغرافية والثقافية اليهودية عند الحاجة.
                </li>

            </ul>

        </section>
    `;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeStudy(){

    modal.classList.remove("show");

    document.body.style.overflow = "";

}


closeModal.addEventListener("click", closeStudy);


/* =========================================================
   CLOSE BY CLICKING OUTSIDE
   ========================================================= */

modal.addEventListener("click", event => {

    if(event.target === modal){

        closeStudy();

    }

});


/* =========================================================
   CLOSE BY ESC
   ========================================================= */

document.addEventListener("keydown", event => {

    if(event.key === "Escape"){

        closeStudy();

    }

});


/* =========================================================
   START
   ========================================================= */

loadEncyclopedia();

</script>

</body>
</html>
