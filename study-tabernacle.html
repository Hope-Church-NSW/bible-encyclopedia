<style>
:root{
 --bg:#061321;--bg2:#0b1d31;--card:#0d2138;--card2:#102a46;
 --gold:#d4af37;--gold2:#f2d675;--text:#f5f7fa;--muted:#a9b8c8;
 --line:#21415f;
}
*{box-sizing:border-box}
body{
 margin:0;background:linear-gradient(145deg,var(--bg),var(--bg2));
 color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.95
}
header{
 position:sticky;top:0;z-index:50;background:rgba(6,19,33,.96);
 border-bottom:1px solid var(--gold);padding:12px 5%;
 box-shadow:0 5px 20px #0008
}
.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 4px 10px #d4af3755)}
.brand h2{margin:0;color:var(--gold2);font-size:21px;text-shadow:0 3px 7px #000}
.home{
 text-decoration:none;color:var(--gold2);font-weight:900;
 border:1px solid var(--gold);padding:10px 18px;border-radius:12px;
 background:linear-gradient(145deg,#173a5c,#0b2036)
}
main{max-width:1200px;margin:auto;padding:30px 5% 60px}
.hero{text-align:center;margin-bottom:30px}
.hero h1{color:var(--gold2);font-size:36px;margin:0 0 8px}
.hero p{color:var(--muted);font-size:18px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}
.menu button{
 padding:15px;border:1px solid var(--line);border-radius:14px;
 background:var(--card);color:var(--gold2);font-weight:900;cursor:pointer
}
.menu button:hover,.menu button.active{border-color:var(--gold);background:var(--card2)}
article{
 background:rgba(13,33,56,.96);border:1px solid var(--line);
 border-radius:18px;padding:28px;box-shadow:0 8px 30px #0005
}
h2,h3,h4{color:var(--gold2)}
h2{font-size:28px;border-bottom:1px solid var(--line);padding-bottom:10px}
h3{font-size:23px}
h4{font-size:19px}
.ref{
 display:inline-block;color:var(--gold2);background:#123354;
 border:1px solid #285477;border-radius:8px;padding:2px 8px;
 margin:2px;font-weight:700
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{
 background:#0a1b2e;border:1px solid var(--line);border-radius:14px;padding:18px
}
table{width:100%;border-collapse:collapse;margin:18px 0}
th,td{border:1px solid var(--line);padding:12px;vertical-align:top}
th{background:#153657;color:var(--gold2)}
td{background:#0a1b2e}
.note{
 border-right:4px solid var(--gold);background:#102a46;
 padding:15px;margin:18px 0;border-radius:8px
}
.nav{
 display:flex;justify-content:space-between;margin-top:25px;
 border-top:1px solid var(--line);padding-top:18px
}
.nav a{
 color:var(--gold2);text-decoration:none;border:1px solid var(--gold);
 padding:10px 18px;border-radius:11px;background:#153657;font-weight:900
}
@media(max-width:700px){
 .menu,.grid{grid-template-columns:1fr}
 .hero h1{font-size:29px}
 article{padding:18px}
 table{font-size:14px}
 .brand h2{font-size:16px}
 .logo{width:58px;height:58px}
}
</style>
</head>

<h2>1. النظرة الشاملة</h2>

<p>
خيمة الاجتماع هي المسكن المقدس الذي أمر الرب موسى بإقامته في البرية،

</p>

<span class="ref">خروج 25:8-9</span>

<h2>2. البنية المعمارية والأثاث المقدس</h2>

<h3>أولًا: فناء الخيمة</h3>
<p>
كان الفناء يحيط بالمسكن، وله مدخل واحد، وهو ما يبرز فكرة الاقتراب المنظم

<h3>ثانيًا: مذبح المحرقة</h3>
<p>
يقع بعد الدخول إلى الفناء، وكانت عليه تقدمات المحرقة والذبائح.
ويبرز موقعه أن الاقتراب من المقدس ارتبط بالكفارة والذبيحة.
</p>
<span class="ref">خروج 27:1-8</span>
<span class="ref">لاويين 1</span>

<h3>ثالثًا: المرحضة</h3>
<p>

<span class="ref">خروج 30:17-21</span>

<div class="grid">

</p>
<span class="ref">خروج 25:10-22</span>

<h3>الحضور الإلهي</h3>
<p>

<h2>5. المسيح وتحقيق رموز الخيمة</h2>

<h3>الكلمة صار جسدًا</h3>
<p>
يربط يوحنا بين حضور الله وسط شعبه وبين تجسد الكلمة:
«وَالْكَلِمَةُ صَارَ جَسَدًا وَحَلَّ بَيْنَنَا».

</p>
<span class="ref">يوحنا 1:14</span>

<h3>الحجاب</h3>
<p>
يربط العهد الجديد موت المسيح بفتح طريق الاقتراب من الله،
إذ ينص سفر العبرانيين على الدخول إلى الأقداس بدم يسوع.
</p>
<span class="ref">متى 27:51</span>
<span class="ref">عبرانيين 10:19-22</span>

<h3>رئيس الكهنة</h3>
<p>
المسيح ليس مجرد كاهن آخر داخل النظام القديم؛ بل هو رئيس الكهنة
الذي دخل إلى الأقداس السماوية بدم نفسه.
</p>
<span class="ref">عبرانيين 4:14-16</span>
<span class="ref">عبرانيين 9:24</span>

<h3>الذبيحة</h3>
<p>
يقدم العهد الجديد موت المسيح باعتباره ذبيحة ذات فاعلية فريدة وكاملة،
لا تحتاج إلى التكرار المستمر للذبائح الحيوانية.
</p>
<span class="ref">عبرانيين 9:26-28</span>
<span class="ref">عبرانيين 10:10</span>

<div class="note">
<strong>منهج التفسير:</strong>
لا ينبغي تحويل كل لون أو قياس أو مادة في الخيمة إلى رمز مستقل بلا سند.
الأكثر أمانًا هو البدء بالنص، ثم بنظام العبادة، ثم بوظيفة العنصر،
ثم بما يشرحه العهد الجديد صراحة أو بما يسمح به السياق الكتابي.
