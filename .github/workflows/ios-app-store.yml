name: iOS App Store Upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-store-upload
  cancel-in-progress: true

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/ { split($2, version, "."); print version[1] }')"
          test "$xcode_major" -ge 26

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync iOS assets
        run: npm run ios:sync

      - name: Install distribution signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/distribution.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"

          security create-keychain -p "$P12_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$P12_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
            security find-identity -v -p codesigning "$keychain_path"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key_directory="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          api_key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          jq -n \
            --arg key_id "$APP_STORE_CONNECT_KEY_ID" \
            --arg issuer_id "$APP_STORE_CONNECT_ISSUER_ID" \
            --rawfile key "$api_key_path" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/appstoreconnect/api_key.json"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_JSON=$RUNNER_TEMP/appstoreconnect/api_key.json" >> "$GITHUB_ENV"

      - name: Generate App Store provisioning profile
        run: |
          gem install fastlane --no-document
          fastlane sigh \
            --api_key_path "$APPLE_API_KEY_JSON" \
            --app_identifier com.hopenations.bibleencyclopedia \
            --provisioning_name "Bible Encyclopedia App Store" \
            --force

      - name: Archive iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BibleEncyclopedia.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Bible Encyclopedia App Store" \
            archive

      - name: Upload archive to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>ZC3CQ94TJ3</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hopenations.bibleencyclopedia</key>
              <string>Bible Encyclopedia App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/BibleEncyclopedia.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/app-store-upload.log"
          upload_status="${PIPESTATUS[0]}"
          set -e

          if [ "$upload_status" -ne 0 ]; then
            grep -Ei 'error:|failed|failure|ITMS-|App Store Connect|status code' "$RUNNER_TEMP/app-store-upload.log" \
              | tail -20 \
              | while IFS= read -r line; do
                  sanitized="${line//'%'/'%25'}"
                  sanitized="${sanitized//$'\r'/'%0D'}"
                  sanitized="${sanitized//$'\n'/'%0A'}"
                  echo "::error::$sanitized"
                done
            exit "$upload_status"
          fi