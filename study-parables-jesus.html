<section class="page-title" id="pageTitle"><h1>أمثال الرب يسوع</h1><p>دراسات منظمة لأمثال المسيح: الشواهد، السياق، معنى المثل، الخلفية الكتابية واليهودية، الرسالة اللاهوتية، التطبيق، والمراجع.</p></section>

<script>
const parables=[
{id:"sower",name:"مثل الزارع",subtitle:"متى 13:1-23؛ مرقس 4:1-20؛ لوقا 8:4-15",sections:[
["الشواهد","متى 13:1-23؛ مرقس 4:1-20؛ لوقا 8:4-15."],
["السياق والمناسبة","قال المسيح هذا المثل للجموع عند البحر، في سياق تعليمه عن ملكوت الله، ثم فسّره لتلاميذه. جاء المثل ليكشف لماذا يسمع الناس إعلان الملكوت نفسه، لكن تكون استجابتهم مختلفة: بعضهم يرفض، وبعضهم يقبل مؤقتًا، وبعضهم تختنق فيه الكلمة، وآخرون يثمرون."],
["معنى المثل وتفسير المسيح","فسّر المسيح عناصر المثل بنفسه: الزرع هو كلمة الملكوت، والأرض تمثل حالة السامع الداخلية. الطريق يشير إلى من يسمع ولا يفهم فتُخطف الكلمة؛ والأرض المحجرة إلى قبول بلا جذور ينهار أمام الضيق والاضطهاد؛ والشوك إلى القلب الذي تخنقه هموم العالم وغرور الغنى؛ أما الأرض الجيدة فهي التي تسمع وتفهم وتحفظ الكلمة وتثمر بالصبر."],
["المحور","المشكلة ليست في البذار، بل في استقبال الإنسان للكلمة. لذلك لا يركز المثل على ضعف كلمة الله، بل على اختلاف القلب الذي يسمعها."],
["الخلفية الكتابية واليهودية","صورة الزرع والثمر مألوفة جدًا في العهد القديم، وترتبط بكلمة الله وشعبه وثمره. يظهر صدى واضح في إشعياء 55:10-11 حيث تُشبَّه كلمة الله بالمطر والزرع الذي يحقق قصد الله، وفي إشعياء 6:9-10 حيث يظهر السماع دون الفهم وقساوة القلب، وفي إشعياء 5:1-7 حيث تُستخدم صورة الكرم والثمر للدلالة على شعب الله."],
["الرسالة اللاهوتية",["ملكوت الله يُعلن من خلال كلمة المسيح.","سماع الكلمة لا يعني بالضرورة قبولها قبولًا مثمرًا.","الإيمان السطحي ينكشف عندما تأتي الضيقة.","هموم العالم وغرور الغنى يمكن أن يخنقا الحياة الروحية.","الثمر هو العلامة الظاهرة للاستجابة الحقيقية للكلمة.","تفاوت الثمر لا يلغي حقيقة الثمر؛ فالأرض الجيدة أنتجت ثلاثين وستين ومئة."]],
["التطبيق العملي",["هل أسمع كلمة الله بهدف المعرفة فقط أم بهدف الطاعة؟","هل إيماني له جذور تستطيع أن تصمد في الضيق؟","ما الهموم أو التعلقات التي تخنق كلمة الله في حياتي؟","هل توجد ثمرة عملية للكلمة التي أسمعها؟","هل أتعامل مع الإنجيل كخبر أسمعه أم كملكوت أستجيب له؟"]],
["الشواهد المرتبطة",{nt:"متى 13:1-23؛ مرقس 4:1-20؛ لوقا 8:4-15",ot:"إشعياء 6:9-10؛ إشعياء 5:1-7؛ إشعياء 55:10-11؛ مزمور 78:1-8؛ هوشع 10:12",refs:"R. T. France, The Gospel of Matthew؛ D. A. Carson, Matthew؛ Craig S. Keener, A Commentary on the Gospel of Matthew؛ Klyne Snodgrass, Stories with Intent؛ Joachim Jeremias, The Parables of Jesus؛ Robert H. Stein, An Introduction to the Parables of Jesus؛ Matthew Henry؛ Keil & Delitzsch؛ Pulpit Commentary؛ Ellicott؛ Benson؛ Jamieson-Fausset-Brown"}]
]}
];

function makeParable(item){
	return {
		id:item.id,
		name:item.name,
		subtitle:item.subtitle,
		sections:[
			["الشواهد",item.witness],
			["السياق والمناسبة",item.context],
			["معنى المثل",item.meaning],
			["الخلفية الكتابية واليهودية",item.background],
			["الرسالة اللاهوتية",item.theology],
			["التطبيق العملي",Array.isArray(item.application)?item.application:[item.application]],
			["الشواهد المرتبطة",{nt:item.nt,ot:item.ot,refs:item.refs}]
		]
	};
}

parables.push(...[
{id:"weeds-wheat",name:"مثل الزوان والحنطة",subtitle:"متى 13:24-30، 36-43",witness:"متى 13:24-30، 36-43.",context:"قاله المسيح للجمع بعد مثل الزارع، ثم فسّره لتلاميذه. ينتقل التعليم من كيفية استقبال الملكوت إلى وجود الشر داخل العالم حتى مجيء الدينونة.",meaning:"الزارع هو ابن الإنسان، والحقل هو العالم، والزرع الجيد هم بنو الملكوت، والزوان هم بنو الشرير، والعدو هو إبليس، والحصاد هو انقضاء العالم، والحصادون هم الملائكة. يسمح الله باستمرار الاثنين إلى الحصاد، ثم تأتي الدينونة والفصل النهائي.",background:"صورة الزرع والحصاد مرتبطة بالدينونة في العهد القديم، خصوصًا يوئيل 3:13. كما أن التمييز بين الأبرار والأشرار عند نهاية الأزمنة حاضر في ملاخي 3:18؛ 4:1-3.",theology:["وجود الشر في العالم لا يعني فشل ملكوت الله.","الله يؤجل الدينونة، لكنه لا يلغيها.","لا يملك الإنسان معرفة الحكم النهائي على الجميع.","الفصل الكامل بين الخير والشر هو عمل الله في نهاية الدهر.","الملكوت حاضر الآن، لكن اكتماله ودينونته ما زالا أمامنا."],application:["لا تجعل وجود الشر سببًا للشك في عمل الله.","لا تتسرع في إصدار أحكام نهائية على الناس.","اهتم بأن تكون من بني الملكوت.","عش في انتظار الحصاد والدينونة."],nt:"متى 13:24-30، 36-43",ot:"يوئيل 3:13؛ ملاخي 3:18؛ 4:1-3؛ دانيال 12:2-3",refs:"R. T. France؛ D. A. Carson؛ Craig Keener؛ Klyne Snodgrass؛ Joachim Jeremias؛ Matthew Henry"},
{id:"secret-seed",name:"مثل البذار الذي ينمو في الخفاء",subtitle:"مرقس 4:26-29",witness:"مرقس 4:26-29.",context:"جاء بعد مثل الزارع وحبة الخردل، ضمن سلسلة أمثال تشرح طبيعة ملكوت الله وعمله الهادئ في العالم.",meaning:"الإنسان يلقي البذار ثم ينمو الزرع دون أن يستطيع تفسير سر نموه. الأرض تثمر من ذاتها حتى يأتي الحصاد، فيؤكد المثل أن نمو الملكوت يعتمد على عمل الله لا على قدرة الإنسان على التحكم في كل المراحل.",background:"الحصاد صورة كتابية للدينونة ونهاية الأزمنة: يوئيل 3:13؛ رؤيا 14:14-16. كما تظهر سيادة الله على النمو في 1 كورنثوس 3:6-7.",theology:["ملكوت الله ينمو بطريقة قد لا يدرك الإنسان تفاصيلها.","مسؤولية الإنسان هي الأمانة في الزرع.","النمو الحقيقي من عمل الله.","هناك وقت للزرع ووقت للحصاد."],application:["لا تقس عمل الله بما تستطيع رؤيته فورًا.","ازرع الكلمة بأمانة واترك لله عمل النمو.","اثبت حتى يأتي وقت الثمر."],nt:"مرقس 4:26-29؛ 1 كورنثوس 3:6-7؛ رؤيا 14:14-16",ot:"يوئيل 3:13",refs:"France؛ Stein؛ Snodgrass؛ Jeremias"},
{id:"mustard-seed",name:"مثل حبة الخردل",subtitle:"متى 13:31-32؛ مرقس 4:30-32؛ لوقا 13:18-19",witness:"متى 13:31-32؛ مرقس 4:30-32؛ لوقا 13:18-19.",context:"جزء من أمثال الملكوت، ويأتي بعد الحديث عن البذار والزرع ليكشف التباين بين بداية الملكوت المتواضعة ونتيجته الكبيرة.",meaning:"يبدأ ملكوت الله بصورة تبدو صغيرة جدًا، لكنه ينمو إلى امتداد كبير. التركيز ليس على حجم الخردل حرفيًا، بل على التباين بين البداية الصغيرة والنتيجة الكبيرة.",background:"صورة الشجرة الكبيرة التي تستظل بها الطيور تذكّر بصور الممالك في حزقيال 17:22-24؛ 31:6 ودانيال 4:10-12.",theology:["بداية الملكوت لا تعكس عظمته النهائية.","عمل الله قد يبدأ بصورة تبدو متواضعة.","نمو الملكوت حقيقي ومتدرج.","المسيح يعلن ملكوتًا يتجاوز التوقعات البشرية."],application:["لا تحتقر البداية الصغيرة في عمل الله.","لا تقس الملكوت بالمظاهر الآنية.","انتظر نمو الله بصبر وثقة."],nt:"متى 13:31-32؛ مرقس 4:30-32؛ لوقا 13:18-19",ot:"حزقيال 17:22-24؛ 31:6؛ دانيال 4:10-12",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"leaven",name:"مثل الخميرة",subtitle:"متى 13:33؛ لوقا 13:20-21",witness:"متى 13:33؛ لوقا 13:20-21.",context:"يتبع مثل حبة الخردل، فيواصل المسيح الكشف عن طريقة عمل الملكوت من بداية صغيرة إلى تأثير واسع.",meaning:"كمية صغيرة من الخميرة تؤثر في العجين كله. الصورة تشير إلى انتشار تأثير الملكوت من بداية تبدو صغيرة إلى تأثير واسع يعمل من الداخل.",background:"تُستخدم الخميرة في الكتاب أحيانًا بصورة سلبية، لكن هذا المثل يوضح أن الرمز لا يحمل معنى ثابتًا في كل موضع؛ فالسياق هو الذي يحدد المعنى.",theology:["الملكوت يعمل من الداخل وبصورة تدريجية.","صغر البداية لا يعني ضعف التأثير.","عمل الله قد يكون غير ظاهر في مراحله الأولى."],application:["لا تستهن بالتغيير الهادئ الذي يصنعه الإنجيل في القلب والمجتمع.","افحص السياق قبل تثبيت معنى واحد لأي رمز كتابي."],nt:"متى 13:33؛ لوقا 13:20-21؛ 1 كورنثوس 5:6-8",ot:"خروج 12:15؛ لاويين 2:11",refs:"Snodgrass؛ Jeremias؛ France"},
{id:"hidden-treasure",name:"مثل الكنز المخفى",subtitle:"متى 13:44",witness:"متى 13:44.",context:"ضمن أمثال الملكوت التي تكشف قيمته المطلقة، ويأتي في صيغة قصيرة لكنها حادة في إعادة ترتيب الأولويات.",meaning:"يكتشف رجل كنزًا، فيبيع كل ما لديه ليحصل على الحقل. المعنى المركزي أن اكتشاف قيمة الملكوت يستحق التخلي عن كل شيء من أجله.",background:"كانت الكنوز المدفونة وسيلة معروفة لحفظ الممتلكات في عالم تكثر فيه الحروب والاضطرابات، ولذلك يفهم السامع قيمة الاكتشاف المفاجئ.",theology:["الملكوت ذو قيمة تفوق كل الممتلكات.","الاستجابة الحقيقية للمسيح تتطلب قرارًا.","التضحية من أجل الملكوت ليست خسارة عندما نرى قيمته الحقيقية."],application:["اسأل: ما الذي أعتبره أثمن من ملكوت الله؟","لا تعامل الملكوت كإضافة جانبية إلى حياتك."],nt:"متى 13:44؛ فيلبي 3:7-8",ot:"أمثال 2:1-5؛ 8:10-11",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"pearl",name:"مثل اللؤلؤة الكثيرة الثمن",subtitle:"متى 13:45-46",witness:"متى 13:45-46.",context:"يتبع الكنز المخفى ويؤكد القيمة المطلقة للملكوت من زاوية البحث المقصود والاكتشاف الذي يغيّر كل القيم.",meaning:"التاجر يبحث عن اللآلئ، ثم يجد لؤلؤة واحدة فائقة القيمة فيبيع كل شيء لأجلها. الملكوت ليس إضافة إلى الحياة، بل الحقيقة التي تعيد ترتيب كل الأولويات.",background:"اللؤلؤ كان سلعة عالية القيمة في العالم القديم، والصورة تجعل السامع يرى أن خسارة كل شيء لأجل ما هو أثمن ليست جنونًا بل حكمة.",theology:["الملكوت مركز القيم كلها.","البحث الصادق يجد في المسيح ما يفوق كل مكسب.","الإيمان بالمسيح يعيد ترتيب الحياة لا يضيف بندًا دينيًا فقط."],application:["اجعل المسيح مركز الحياة لا ملحقًا بها.","افحص ما الذي يحدد قراراتك وقيمك."],nt:"متى 13:45-46؛ فيلبي 3:7-8",ot:"أمثال 8:10-11",refs:"France؛ Carson؛ Jeremias؛ Snodgrass"},
{id:"dragnet",name:"مثل الشبكة المطروحة في البحر",subtitle:"متى 13:47-50",witness:"متى 13:47-50.",context:"خاتمة أمثال الملكوت في متى 13، وتعود إلى موضوع النهاية والفرز بعد زمن اختلاط ظاهر.",meaning:"الشبكة تجمع أنواعًا مختلفة من السمك، ثم يأتي الفرز. يفسر المسيح ذلك بالدينونة في نهاية العالم، حيث يفصل الملائكة الأشرار عن الأبرار.",background:"صورة الفرز والحصاد مرتبطة بالدينونة في ملاخي 3-4 ودانيال 12:2، وفيها يميز الله بين الأبرار والأشرار.",theology:["الدعوة إلى الملكوت واسعة.","الاختلاط الحالي لا يعني غياب الدينونة.","النهاية تتضمن فصلًا حقيقيًا.","الله هو صاحب الحكم النهائي."],application:["لا تجعل الانتماء الظاهري للمجتمع الديني بديلًا عن التوبة والإيمان الحقيقي.","عش الحاضر في ضوء الدينونة الآتية."],nt:"متى 13:47-50",ot:"ملاخي 3:18؛ 4:1؛ دانيال 12:2",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"new-old-treasure",name:"مثل رب البيت الذي يخرج جديدًا وعتقاء",subtitle:"متى 13:51-52",witness:"متى 13:51-52.",context:"خاتمة سلسلة أمثال الملكوت، بعد سؤال المسيح لتلاميذه: أفهمتم هذا كله؟",meaning:"يشبّه المسيح الكاتب المتعلم في ملكوت السماوات برب بيت يخرج من كنزه أشياء جديدة وعتقاء. المقصود فهم يجمع الإعلان الجديد في المسيح مع فهم صحيح لما سبق في الكتاب.",background:"خلفية الكاتب المتمرس في الشريعة تجعل الصورة عن دارس يعرف كنز الكتاب، لكن الملكوت يعلمه كيف يقرأ القديم في ضوء اكتماله.",theology:["المسيحية لا تلغي الإعلان السابق.","المسيح يكشف مقصد العهد القديم واكتماله.","الدارس الناضج يربط الجديد بالقديم دون خلط أو ازدراء."],application:["لا تحتقر العهد القديم ولا تفصل العهد الجديد عنه.","ليكن فهمك للكتاب جامعًا بين الجذر والاكتمال."],nt:"متى 13:51-52؛ لوقا 24:27، 44-47؛ يوحنا 5:39",ot:"الشريعة والأنبياء والمزامير كخلفية قانونية ولاهوتية",refs:"France؛ Carson؛ Keener"},
{id:"lost-sheep",name:"مثل الخروف الضال",subtitle:"متى 18:12-14؛ لوقا 15:3-7",witness:"متى 18:12-14؛ لوقا 15:3-7.",context:"في متى جاء في سياق مسؤولية الجماعة تجاه الصغار، وفي لوقا ردًا على اعتراض الفريسيين على اقتراب المسيح من الخطاة.",meaning:"الراعي يترك التسعة والتسعين ويبحث عن الواحد الضال، ويعلن المسيح فرح السماء بتوبة الضال.",background:"الله يُعلن نفسه راعيًا لشعبه في مزمور 23، وحزقيال 34 يدين الرعاة الفاشلين ويعلن أن الله نفسه سيطلب خرافه.",theology:["الله يهتم بالفرد.","الضال ليس بلا قيمة.","المبادرة في البحث عن الضال جزء من قلب الله.","التوبة تفرح السماء."],application:["لا تعتبر شخصًا ضائعًا حالة ميؤوسًا منها.","لا تجعل العدد أهم من الإنسان.","تعلم قلب الراعي الذي يبحث لا قلب المتفرج الذي يحصي."],nt:"متى 18:12-14؛ لوقا 15:3-7",ot:"حزقيال 34:11-16؛ مزمور 23",refs:"France؛ Green؛ Snodgrass؛ Jeremias"},
{id:"lost-coin",name:"مثل الدرهم المفقود",subtitle:"لوقا 15:8-10",witness:"لوقا 15:8-10.",context:"ضمن أمثال لوقا 15 ردًا على انتقاد اقتراب المسيح من الخطاة والأكل معهم.",meaning:"المرأة تبحث بعناية عن الدرهم المفقود حتى تجده، ثم تشارك الآخرين فرحها. يفسر المسيح الفرح بأنه صورة لفرح ملائكة الله بخاطئ واحد يتوب.",background:"صورة البحث عن الضال تستند إلى قلب الله الذي يطلب المفقود، كما في حزقيال 34، وترتبط بفرح الله بشعبه في صفنيا 3:17.",theology:["قيمة الضال لا تُقاس بحالته الحالية.","فرح الله بتوبة الخاطئ حقيقي.","البحث الدقيق عن المفقود يكشف قيمة الإنسان عند الله."],application:["ابحث عن الإنسان المفقود بدل انتظار عودته وحده.","شارك فرح التوبة بدل التذمر من قبول الخطاة."],nt:"لوقا 15:8-10",ot:"حزقيال 34:16؛ صفنيا 3:17",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"prodigal-son",name:"مثل الابن الضال / الأب والابنين",subtitle:"لوقا 15:11-32",witness:"لوقا 15:11-32.",context:"قمة أمثال لوقا 15، والرد الأعمق على اعتراض الفريسيين على استقبال الخطاة.",meaning:"الابن الأصغر يطلب نصيبه ويرحل ثم يعود تائبًا، فيستقبله الأب بفرح. أما الابن الأكبر فيرفض الفرح ويكشف أن المشكلة ليست فقط في الخطية الظاهرة، بل أيضًا في البر الذاتي والقلب الذي لا يفرح بنعمة الله.",background:"صورة الله كأب لشعبه تظهر في هوشع 11 وإرميا 31، كما أن الفرح بعودة الضال يتردد في صور استرداد إسرائيل.",theology:["الله يستقبل التائب.","النعمة لا تقوم على استحقاق الابن.","البر الذاتي يمكن أن يكون بعيدًا عن قلب الآب.","القصة عن الأب والابنين لا عن الابن الأصغر وحده."],application:["هل أفرح بتوبة الآخرين أم أشعر أنهم لا يستحقون القبول؟","افحص قلب الابن الأكبر داخلك كما تفحص ضياع الابن الأصغر."],nt:"لوقا 15:11-32",ot:"هوشع 11:1-9؛ إرميا 31:18-20",refs:"Nolland؛ Green؛ Snodgrass؛ Jeremias؛ Bailey"},
{id:"unforgiving-servant",name:"مثل العبد الذي لا يغفر",subtitle:"متى 18:23-35",witness:"متى 18:23-35.",context:"جاء بعد تعليم المسيح عن الغفران وعن سؤال بطرس: كم مرة يخطئ إلي أخي وأغفر له؟",meaning:"العبد الذي غُفرت له مديونية هائلة رفض أن يغفر لدين صغير نسبيًا. يدين المسيح هذا التناقض: من اختبر الرحمة يجب أن يكون رحيمًا.",background:"سنة اليوبيل وإطلاق الديون تقدم خلفية مهمة لفكرة التحرير من الدين: لاويين 25؛ تثنية 15.",theology:["غفران الله هو أساس غفراننا للآخرين.","عدم الرحمة يكشف سوء فهم للنعمة.","الغفران المسيحي ليس إنكارًا للخطية بل امتداد للرحمة التي نلناها."],application:["لا تجعل خطية الآخر أكبر في عينيك من النعمة التي نلتها.","افحص هل تحولت الرحمة عندك إلى حق شخصي لا يثمر رحمة."],nt:"متى 18:21-35؛ أفسس 4:32",ot:"لاويين 25:8-17؛ تثنية 15:1-11",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"two-debtors",name:"مثل المدينين",subtitle:"لوقا 7:41-43",witness:"لوقا 7:41-43.",context:"قاله المسيح في بيت سمعان الفريسي، بعد أن اعترض سمعان ضمنيًا على المرأة الخاطئة التي اقتربت من المسيح.",meaning:"مدينان غُفر لهما، أحدهما أكثر من الآخر؛ ومن ثم فإن من غُفر له أكثر يحب أكثر. المحبة ليست ثمن الغفران بل ثمرته.",background:"المزامير تربط غفران الخطية بالفرح والمحبة، وتجربة بولس لاحقًا تكشف كيف تولد الرحمة خدمة ومحبة عميقة.",theology:["المحبة ثمرة إدراك الغفران.","البر الذاتي يضعف رؤية الإنسان لحاجته إلى الرحمة.","المسيح يرى التوبة والمحبة التي يحتقرها المتدين المتكبر."],application:["ضعف محبتنا للمسيح قد يكشف ضعف إدراكنا لنعمة الغفران.","لا تقس الناس بسمعتهم السابقة فقط."],nt:"لوقا 7:36-50؛ 1 تيموثاوس 1:12-16",ot:"مزمور 32:1-5",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"good-samaritan",name:"مثل السامري الصالح",subtitle:"لوقا 10:25-37",witness:"لوقا 10:25-37.",context:"سأل ناموسي المسيح: ومن هو قريبي؟ بعد أن ذكر وصية محبة الله والقريب.",meaning:"يقلب المسيح السؤال من: من هو قريبي؟ إلى: من صار قريبًا للمحتاج؟ السامري، رغم العداوة التاريخية بين اليهود والسامريين، هو الذي مارس الرحمة.",background:"السامريون واليهود كانت بينهم خصومة دينية واجتماعية عميقة. لذلك اختيار السامري كان صادمًا للجمهور، كما أن الشريعة تطلب محبة القريب والغريب.",theology:["المحبة تتجاوز الحواجز.","القريب ليس فقط من ينتمي إلى دائرتي.","الرحمة فعل وليست شعورًا.","المعرفة الدينية دون ممارسة المحبة ناقصة."],application:["هل محبتي تتوقف عند الانتماء والطائفة والمصلحة؟","اختر أن تصير قريبًا لمن يحتاج الرحمة."],nt:"لوقا 10:25-37",ot:"لاويين 19:18، 33-34؛ هوشع 6:6؛ ميخا 6:8",refs:"Green؛ Snodgrass؛ Jeremias؛ Bailey"},
{id:"friend-midnight",name:"مثل الصديق اللجوج",subtitle:"لوقا 11:5-8",witness:"لوقا 11:5-8.",context:"جاء مباشرة بعد تعليم المسيح الصلاة الربانية، ضمن تشجيع التلاميذ على الطلب والثقة في الآب.",meaning:"رجل يطلب خبزًا لصديق زائر في منتصف الليل ويستمر في الطلب. الهدف تعليم المثابرة في الصلاة والثقة في الاستجابة، وليس تشبيه الله برجل متضايق.",background:"الضيافة في العالم القديم واجب اجتماعي مهم، وطلب الخبز لضيف مفاجئ يجعل الإلحاح مفهومًا في بيئته.",theology:["الصلاة تتضمن المثابرة.","الله ليس كالصديق المتضايق.","التشجيع هو أن الآب يسمع أبناءه."],application:["لا تفسر تأخر الإجابة كغياب الله.","ثابر في الصلاة بثقة لا بإحراج لله."],nt:"لوقا 11:1-13",ot:"مزمور 27:7-14؛ 1 صموئيل 1:9-18",refs:"Green؛ Jeremias؛ Snodgrass"},
{id:"persistent-widow",name:"مثل الأرملة وقاضي الظلم",subtitle:"لوقا 18:1-8",witness:"لوقا 18:1-8.",context:"يصرح لوقا أن المسيح قاله لكي يعلّمهم أن يصلوا كل حين ولا يملوا، ثم يختم بسؤال عن الإيمان عند مجيء ابن الإنسان.",meaning:"الأرملة تطلب حقها باستمرار من قاض لا يخاف الله حتى يستجيب. الحجة من الأدنى إلى الأعلى: إذا استجاب القاضي الظالم، فكم بالحري الله العادل يستجيب مختاريه؟",background:"الأرملة في الكتاب صورة للضعف الاجتماعي الذي يطلب الله حمايته، والقضاء العادل من مطالب الشريعة والأنبياء.",theology:["الله عادل وليس كالقاضي الظالم.","التأخير لا يعني الإهمال.","الصلاة مرتبطة بالإيمان والانتظار.","السياق الأخروي مهم لفهم المثل."],application:["اثبت في الصلاة خصوصًا عندما يبدو أن العدالة تتأخر.","لا تجعل طول الانتظار يقتل الإيمان."],nt:"لوقا 18:1-8",ot:"مزمور 13؛ 37:7؛ حبقوق 2:3",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"pharisee-tax",name:"مثل الفريسي والعشار",subtitle:"لوقا 18:9-14",witness:"لوقا 18:9-14.",context:"قاله المسيح لأناس واثقين بأنفسهم أنهم أبرار ويحتقرون الآخرين.",meaning:"الفريسي يقدم إنجازاته، بينما العشار يطلب الرحمة. يعلن المسيح أن العشار نزل إلى بيته مبررًا، لأن التبرير لا يقوم على التفاخر بل على رحمة الله للمتضع.",background:"الفريسي والعشار يمثلان صورتين اجتماعيتين متباينتين: التدين المنضبط من جهة، وسمعة الخاطئ أو المتعاون مع النظام الضريبي من جهة أخرى.",theology:["التبرير لا يقوم على التفاخر بالأعمال.","التوبة تبدأ بالاعتراف بالحاجة إلى الرحمة.","التدين يمكن أن يتحول إلى بر ذاتي واحتقار للآخر."],application:["اقترب من الله لا بقائمة إنجازاتك، بل بقلب تائب.","افحص هل تقودك العبادة إلى التواضع أم المقارنة."],nt:"لوقا 18:9-14",ot:"مزمور 51؛ إشعياء 57:15؛ 66:2",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"unworthy-servant",name:"مثل العبد غير المستحق",subtitle:"لوقا 17:7-10",witness:"لوقا 17:7-10.",context:"جاء في تعليم المسيح عن الإيمان والغفران، ليحمي التلاميذ من عقلية الاستحقاق بعد الطاعة والخدمة.",meaning:"العبد لا يطالب سيده بمكافأة لمجرد أنه أدى واجبه. المسيح يعلم التلاميذ أن الطاعة لا تمنح الإنسان حق التفاخر أمام الله.",background:"صورة العبد والسيد مألوفة في العالم القديم، ويستخدمها المسيح هنا لا لتبرير الظلم الاجتماعي، بل لتعليم موقف القلب أمام الله.",theology:["الخدمة ليست وسيلة لإجبار الله على مكافأتنا.","الطاعة هي واجب المحبة.","النعمة تمنع التفاخر الروحي."],application:["اخدم دون عقلية الاستحقاق.","قل بعد الخدمة: إنما فعلت ما كان يجب علي."],nt:"لوقا 17:7-10؛ 1 كورنثوس 9:16-17؛ 15:10",ot:"خلفية العبودية والخدمة في الشريعة والحكمة",refs:"Green؛ Snodgrass"},
{id:"rich-fool",name:"مثل الغني الغبي",subtitle:"لوقا 12:13-21",witness:"لوقا 12:13-21.",context:"طلب رجل من المسيح أن يتدخل في ميراثه، فحذر المسيح من الطمع ومن قياس الحياة بكثرة الممتلكات.",meaning:"رجل يزداد غنى ويخطط لتخزين ممتلكاته وتأمين مستقبله، لكنه يموت في اللحظة التي ظن فيها أنه ضمن حياته. المشكلة أن المال صار أساس الأمان والغاية النهائية.",background:"العهد القديم يحذر من الاتكال على الغنى ونسيان الرب في الرفاه: تثنية 8:11-18؛ مزمور 49؛ أمثال 11:28.",theology:["الحياة لا تُقاس بكثرة الممتلكات.","الموت يكشف هشاشة الأمان المادي.","الغنى أمام الله أهم من الغنى أمام الناس."],application:["ما الذي أبني عليه أماني: الله أم ما أملك؟","لا تجعل التخزين بديلًا عن الغنى أمام الله."],nt:"لوقا 12:13-21؛ 1 تيموثاوس 6:17-19",ot:"مزمور 49؛ أمثال 11:28؛ تثنية 8:11-18",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"shrewd-manager",name:"مثل الوكيل الظالم",subtitle:"لوقا 16:1-13",witness:"لوقا 16:1-13.",context:"قاله المسيح لتلاميذه في سياق تعليمهم عن استخدام المال والأمانة في الموارد.",meaning:"الوكيل يستعمل ما تبقى له من سلطته ليؤمن مستقبله. المسيح لا يمدح عدم الأمانة، بل يبرز حسن التصرف في الموارد والاستعداد للمستقبل.",background:"الوكالة في العالم القديم تعني إدارة مال شخص آخر، وهذا يفتح معنى الإنسان كأمين على عطايا الله لا مالك مطلق لها.",theology:["المال أداة وليس سيدًا.","الإنسان وكيل على ما أعطاه الله.","الأمانة في القليل تكشف الأمانة في الكثير.","لا تقدرون أن تخدموا الله والمال."],application:["استخدم المال والموارد لخدمة المقاصد الأبدية.","لا تسمح للمال أن يصير إلهًا بديلًا."],nt:"لوقا 16:1-13؛ متى 6:19-24",ot:"أمثال 11:4؛ 19:17",refs:"Green؛ Snodgrass؛ Jeremias؛ Bailey"},
{id:"rich-man-lazarus",name:"مثل الغني ولعازر",subtitle:"لوقا 16:19-31",witness:"لوقا 16:19-31.",context:"يأتي بعد تعليم المسيح عن المال، وفي سياق مواجهة محبي المال.",meaning:"الغني يعيش في ترف بينما لعازر عند بابه في بؤس. بعد الموت تنقلب الصورة، ويظهر أن تجاهل المحتاج كشف قلب الغني.",background:"تعليم الناموس والأنبياء عن الفقير والمحتاج أساسي: تثنية 15؛ عاموس 6:4-7؛ إشعياء 58:6-10.",theology:["المال لا يحدد القيمة أمام الله.","تجاهل المحتاج يكشف فساد القلب.","هناك دينونة بعد الموت.","امتلاك الكتاب لا يفيد إذا لم ينتج توبة."],application:["لا تؤجل الطاعة بحجة انتظار علامة جديدة.","كلمة الله كافية للدعوة إلى التوبة والرحمة."],nt:"لوقا 16:19-31",ot:"تثنية 15:7-11؛ عاموس 6:4-7؛ إشعياء 58:6-10",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"workers-vineyard",name:"مثل العمال في الكرم",subtitle:"متى 20:1-16",witness:"متى 20:1-16.",context:"جاء بعد حديث المسيح عن الغنى والتضحية والتلاميذ والمكافأة، فيصحح منطق المقارنة والاستحقاق.",meaning:"يدفع صاحب الكرم للمتأخرين نفس الأجر المتفق عليه مع الأوائل. لا يعني ذلك ظلمًا، لأن الأولين أخذوا ما اتفق عليه، بل يكشف كرم السيد وسيادة نعمته.",background:"الكرم صورة متكررة لشعب الله: إشعياء 5؛ مزمور 80. والعمل اليومي في الكرم خلفية اجتماعية معروفة عند السامعين.",theology:["نعمة الله ليست راتبًا يستحقه الإنسان.","لا ينبغي أن تتحول الخدمة إلى منافسة.","الله صاحب السيادة في توزيع نعمته."],application:["لا تقارن نصيبك بنصيب الآخرين.","اخدم بفرح لا بعين شريرة تجاه كرم الله."],nt:"متى 19:27-30؛ 20:1-16",ot:"إشعياء 5:1-7؛ مزمور 80",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"talents",name:"مثل الوزنات",subtitle:"متى 25:14-30",witness:"متى 25:14-30.",context:"ضمن خطاب المسيح عن المجيء والدينونة والاستعداد، حيث يصبح الانتظار زمن أمانة لا زمن فراغ.",meaning:"السيد يسلم عبيده ممتلكاته ثم يعود للحساب. الأمين يستثمر ما أُعطي له، أما الثالث فيدفنه خوفًا. الدينونة ترتبط بالأمانة فيما استؤمن الإنسان عليه.",background:"الوزنة مقدار مالي كبير، والصورة تؤكد أن العطايا مسؤوليات مودعة لا ممتلكات شخصية منفصلة عن حساب السيد.",theology:["كل إنسان مسؤول عما أعطاه الله.","اختلاف المواهب لا يعني اختلاف قيمة الأشخاص.","الأمانة أهم من المقارنة.","هناك حساب أمام السيد."],application:["لا تدفن موهبتك بسبب الخوف أو المقارنة.","اسأل كيف تستثمر ما وُضع في يدك بأمانة."],nt:"متى 25:14-30؛ رومية 12:3-8؛ 1 كورنثوس 4:1-2",ot:"حكمة الوكالة والأمانة في أمثال الكتاب",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"minas",name:"مثل الأمناء",subtitle:"لوقا 19:11-27",witness:"لوقا 19:11-27.",context:"قاله المسيح لأن السامعين كانوا يظنون أن ملكوت الله سيظهر في الحال، وكان يسوع قريبًا من أورشليم.",meaning:"رجل شريف يذهب ليأخذ ملكًا ثم يعود، ويعطي عبيده أمناء للتجارة حتى يرجع. المطلوب هو الأمانة أثناء غياب الملك.",background:"الصورة السياسية عن ذهاب شخص لنوال الملك وعودته كانت مفهومة في بيئة الحكم الروماني، ويستخدمها يسوع لتعليم الانتظار المسؤول.",theology:["الملكوت لا يعني أن الدينونة النهائية ستحدث فورًا.","المسيح هو الملك العائد.","زمن الانتظار هو زمن مسؤولية.","الأمانة تقابلها مكافأة، والرفض يقود إلى الدينونة."],application:["لا تجعل انتظار مجيء المسيح انتظارًا سلبيًا.","تاجر بأمانة بما استؤمنت عليه حتى يرجع الملك."],nt:"لوقا 19:11-27؛ متى 28:18-20",ot:"دانيال 7:13-14",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"wedding-banquet",name:"مثل وليمة العرس / العرس الملكي",subtitle:"متى 22:1-14",witness:"متى 22:1-14.",context:"في أورشليم، أثناء مواجهة المسيح مع رؤساء الكهنة والشيوخ، ضمن سلسلة أمثال تكشف رفض الدعوة الإلهية.",meaning:"الملك يدعو المدعوين إلى عرس ابنه، فيرفض بعضهم الدعوة، ثم تُفتح الدعوة لآخرين. لكن أحد الداخلين بلا لباس العرس يُطرح خارجًا.",background:"صورة العرس والوليمة مرتبطة بالمسيا وبفرح الخلاص: إشعياء 25:6-9؛ 62:4-5؛ رؤيا 19:6-9.",theology:["رفض دعوة الملك رفض خطير.","الدعوة واسعة، لكن الاستجابة الحقيقية ضرورية.","الدخول الظاهري لا يكفي.","الملكوت مرتبط بالابن."],application:["لا تكتف بالقرب الخارجي من الإيمان.","استجب لدعوة الملك باستجابة حقيقية تليق بالعرس."],nt:"متى 22:1-14؛ رؤيا 19:6-9",ot:"إشعياء 25:6-9؛ 62:4-5",refs:"France؛ Carson؛ Keener؛ Snodgrass"},
{id:"great-banquet",name:"مثل العشاء العظيم",subtitle:"لوقا 14:15-24",witness:"لوقا 14:15-24.",context:"جاء في بيت أحد رؤساء الفريسيين، بعد حديث المسيح عن التواضع والوليمة.",meaning:"المدعوون يعتذرون بأعذار مختلفة، فيُدعى الفقراء والمساكين ومن هم خارج الدائرة الأصلية. يبرز المثل خطورة رفض دعوة الله بسبب التعلقات الدنيوية.",background:"الوليمة في الكتاب صورة لفرح الخلاص وحكمة الله الداعية، كما في إشعياء 25 وأمثال 9.",theology:["دعوة الله نعمة.","الأعذار قد تخفي رفضًا.","الذين يظن الناس أنهم بعيدون قد يدخلون.","الملكوت يقلب المقاييس الاجتماعية."],application:["لا تجعل العمل والمال والممتلكات أعذارًا أمام دعوة الله.","استجب الآن ولا تؤجل الدعوة بحجج تبدو مقبولة."],nt:"لوقا 14:15-24",ot:"إشعياء 25:6-9؛ أمثال 9:1-6",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"lowest-seat",name:"مثل المتكأ الأول",subtitle:"لوقا 14:7-11",witness:"لوقا 14:7-11.",context:"لاحظ المسيح كيف اختار المدعوون المتكآت الأولى، فعلمهم مثلًا عن التواضع والمكانة.",meaning:"علّم المسيح أن التواضع الحقيقي أفضل من السعي إلى المكانة ثم التعرض للإحراج. الملكوت يقلب سلم الكرامة البشرية.",background:"أمثال 25:6-7 يحذر من التقدم أمام الملك، وحكمة العهد القديم تربط الكبرياء بالسقوط والتواضع بالكرامة.",theology:["الله يقاوم الكبرياء ويعطي النعمة للمتواضعين.","المكانة في الملكوت ليست سباق ظهور.","التواضع يترك الرفعة لله لا لصناعة الذات."],application:["اختر مكان الخدمة قبل مكان التكريم.","لا تجعل حضورك بين الناس مسرحًا لإثبات الذات."],nt:"لوقا 14:7-11",ot:"أمثال 25:6-7؛ 16:18-19؛ 1 صموئيل 2:7-8",refs:"Green؛ Snodgrass"},
{id:"bridegroom-friends",name:"مثل رفقاء العريس",subtitle:"متى 9:14-15؛ مرقس 2:18-20؛ لوقا 5:33-35",witness:"متى 9:14-15؛ مرقس 2:18-20؛ لوقا 5:33-35.",context:"جاء ردًا على سؤال عن صوم تلاميذ يوحنا والفريسيين، ولماذا لا يصوم تلاميذ يسوع مثلهم.",meaning:"وجود العريس يعني زمن الفرح؛ لكن سيأتي وقت يُرفع فيه العريس، وعندها يصوم التلاميذ. المثل يربط الممارسة الروحية بحضور المسيح نفسه.",background:"صورة الرب كعريس وشعبه كعروس تظهر في هوشع 2 وإشعياء 54:5، وتفتح خلفية عهدية لعلاقة الفرح والانتظار.",theology:["حضور المسيح يغير طبيعة الزمن الروحي.","المسيح هو العريس.","الصوم المسيحي مرتبط بعلاقة المسيح وبانتظار حضوره."],application:["الحياة المسيحية ليست طقسًا منفصلًا عن شخص المسيح.","افهم الصوم والفرح في ضوء حضور العريس وغيابه الظاهر."],nt:"متى 9:14-15؛ مرقس 2:18-20؛ لوقا 5:33-35",ot:"هوشع 2:19-20؛ إشعياء 54:5",refs:"France؛ Jeremias؛ Snodgrass"},
{id:"two-sons",name:"مثل الابنين",subtitle:"متى 21:28-32",witness:"متى 21:28-32.",context:"قاله المسيح لرؤساء الكهنة والشيوخ بعد سؤالهم عن سلطانه، في مواجهة تدين يقول ولا يطيع.",meaning:"ابن قال إنه لا يذهب ثم ندم وذهب، وآخر قال نعم ولم يذهب. يطبق المسيح المثل على الفرق بين القول والطاعة، ويعلن أن العشارين والزواني سبقوهم إلى ملكوت الله لأنهم آمنوا واستجابوا.",background:"الأنبياء يربطون العبادة بالطاعة لا بالكلام الديني، وصموئيل يعلن أن الطاعة أفضل من الذبيحة.",theology:["الطاعة أهم من الكلام الديني.","التوبة تستطيع تغيير المسار.","التدين الظاهري لا يساوي طاعة الله."],application:["اسأل عن أفعالك لا عن إجاباتك الدينية.","لا تجعل موافقتك اللفظية بديلًا عن طاعة ملموسة."],nt:"متى 21:28-32",ot:"1 صموئيل 15:22؛ إشعياء 1:10-17",refs:"France؛ Carson؛ Keener"},
{id:"wicked-tenants",name:"مثل الكرامين الأردياء",subtitle:"متى 21:33-46؛ مرقس 12:1-12؛ لوقا 20:9-18",witness:"متى 21:33-46؛ مرقس 12:1-12؛ لوقا 20:9-18.",context:"قاله المسيح في أورشليم أمام القادة الدينيين، بعد جداله معهم حول سلطانه.",meaning:"صاحب الكرم يرسل عبيدًا فيرفضهم الكرامون ويضربونهم، ثم يرسل ابنه فيقتلونه. المثل يكشف تاريخ رفض رسل الله ويصل إلى رفض الابن.",background:"الخلفية الأساسية هي إشعياء 5:1-7؛ الكرم صورة لإسرائيل، مع أصداء مزمور 80 ومزمور 118 عن الحجر المرفوض.",theology:["الله أرسل أنبياءه إلى شعبه.","رفض الابن هو ذروة الرفض.","المسيح هو الابن صاحب السلطان.","الدينونة تنتج عن رفض صاحب الكرم.","الحجر في مزمور 118 يصبح مفتاحًا مسيانيًا."],application:["لا تجعل الامتياز الديني بديلًا عن طاعة صاحب الكرم.","افحص هل تثمر العطية التي استؤمنت عليها."],nt:"متى 21:33-46؛ مرقس 12:1-12؛ لوقا 20:9-18",ot:"إشعياء 5:1-7؛ مزمور 80؛ 118:22-23",refs:"France؛ Carson؛ Keener؛ Snodgrass؛ Jeremias"},
{id:"barren-fig",name:"مثل التينة العقيمة",subtitle:"لوقا 13:6-9",witness:"لوقا 13:6-9.",context:"جاء بعد الحديث عن التوبة، عقب أحداث مأساوية استخدمها المسيح ليحذر من الهلاك دون توبة.",meaning:"شجرة تين موجودة لكنها بلا ثمر، فيُعطى لها وقت إضافي قبل قطعها. المثل يجمع بين صبر الله وإلحاح التوبة.",background:"صورة شجرة التين والثمر تُستخدم للدلالة على شعب الله وحالته: هوشع 9:10؛ ميخا 7:1؛ إرميا 8:13.",theology:["نعمة الله تصبر.","الصبر ليس إلغاءً للدينونة.","الامتياز دون ثمر لا ينقذ.","التوبة ليست موضوعًا يمكن تأجيله بلا نهاية."],application:["لا تستخدم طول أناة الله كذريعة لتأجيل التوبة.","اسأل عن الثمر لا عن مجرد الوجود في الكرم."],nt:"لوقا 13:1-9",ot:"هوشع 9:10؛ ميخا 7:1؛ إرميا 8:13",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"ten-virgins",name:"مثل العذارى العشر",subtitle:"متى 25:1-13",witness:"متى 25:1-13.",context:"ضمن خطاب المسيح عن مجيئه ونهاية العصر، وفي سياق دعوة التلاميذ إلى السهر والاستعداد.",meaning:"خمس عذارى مستعدات وخمس غير مستعدات. التأخير في مجيء العريس يكشف الفرق بين الاستعداد الحقيقي والاستعداد الظاهري.",background:"صورة العرس مرتبطة بالمسيح كالعريس، والانتظار والسهر موضوعان متكرران في تعليم النهاية.",theology:["مجيء المسيح قد يبدو متأخرًا.","الاستعداد لا يمكن نقله إلى شخص آخر.","لا يكفي أن تكون قريبًا من المستعدين.","هناك لحظة يصبح فيها باب الدخول مغلقًا."],application:["الاستعداد الروحي ليس شيئًا يؤجل إلى آخر لحظة.","لا تعتمد على قربك من جماعة مستعدة بدل استعدادك الشخصي."],nt:"متى 25:1-13؛ متى 24:42-44؛ رؤيا 19:7-9",ot:"إشعياء 62:5",refs:"France؛ Carson؛ Snodgrass"},
{id:"faithful-evil-servant",name:"مثل العبد الأمين والعبد الشرير",subtitle:"متى 24:45-51؛ لوقا 12:42-48",witness:"متى 24:45-51؛ لوقا 12:42-48.",context:"في تعليم المسيح عن السهر والاستعداد للمجيء، مع تركيز خاص على المسؤولية أثناء غياب السيد الظاهر.",meaning:"السيد يترك عبده مسؤولًا على البيت. الأمين يظل أمينًا حتى يعود سيده، أما الشرير فيستغل غياب السيد ويظلم غيره.",background:"صورة الوكيل على البيت مألوفة في البيوت الكبيرة، وتفتح معنى القيادة كأمانة ومحاسبة لا امتيازًا للاستغلال.",theology:["غياب المسيح الظاهر ليس غيابًا نهائيًا.","التأخر المفترض للمجيء لا يبرر التراخي.","السلطة في الكنيسة أمانة وليست امتيازًا للاستغلال.","الحساب مرتبط بالأمانة."],application:["كن أمينًا خصوصًا عندما لا يراقبك أحد.","لا تجعل المسؤولية الدينية وسيلة للسيطرة أو الإهمال."],nt:"متى 24:45-51؛ لوقا 12:42-48؛ 1 كورنثوس 4:1-2",ot:"خلفية الوكالة والأمانة في حكمة الكتاب",refs:"France؛ Carson؛ Green"},
{id:"householder-thief",name:"مثل صاحب البيت واللص",subtitle:"متى 24:42-44؛ لوقا 12:39-40",witness:"متى 24:42-44؛ لوقا 12:39-40.",context:"ضمن التحذير من عدم معرفة ساعة مجيء ابن الإنسان، ولذلك يتحول الجهل بالموعد إلى دعوة للسهر.",meaning:"لو عرف صاحب البيت ساعة مجيء اللص لسهر. يستخدم المسيح المفاجأة ليؤكد ضرورة الاستعداد الدائم.",background:"صورة اللص في الليل صارت لاحقًا لغة رسولية عن مفاجأة يوم الرب، كما في 1 تسالونيكي 5:2-6.",theology:["موعد المجيء غير معلن.","عدم معرفة الموعد يدعو إلى السهر لا التراخي.","الاستعداد الدائم جزء من أمانة التلميذ."],application:["لا تجعل عدم معرفة الموعد سببًا للتراخي.","عش مستعدًا لأن الموعد غير معلن."],nt:"متى 24:42-44؛ لوقا 12:39-40؛ 1 تسالونيكي 5:2-6",ot:"صور يوم الرب في الأنبياء كخلفية للتحذير",refs:"France؛ Carson؛ Green"},
{id:"watchful-doorkeeper",name:"مثل البواب الساهر",subtitle:"مرقس 13:33-37",witness:"مرقس 13:33-37.",context:"في ختام تعليم المسيح عن مجيئه، حيث يوجّه التحذير للجميع: اسهروا.",meaning:"السيد يسافر ويعطي العبيد مسؤوليات، ويأمر البواب بالسهر لأن وقت رجوعه غير معروف. الانتظار المسيحي ليس فراغًا بل سهر ومسؤولية وأمانة.",background:"صورة البيت والسيد والبواب مألوفة في المجتمع القديم، وتوضح أن كل واحد له عمل أثناء غياب السيد.",theology:["الانتظار المسيحي سهر ومسؤولية.","كل عبد له عمل، وليس البواب وحده مسؤولًا.","عدم معرفة الوقت لا يلغي وضوح الدعوة."],application:["اجعل انتظار المسيح دافعًا للعمل لا للهروب من العمل.","اسهر في مكانك ومسؤوليتك."],nt:"مرقس 13:33-37؛ متى 24:42؛ 1 بطرس 4:7",ot:"خلفية السهر والحراسة في المزامير والأنبياء",refs:"France؛ Stein"},
{id:"waiting-servants",name:"مثل العبد المنتظر سيده",subtitle:"لوقا 12:35-48",witness:"لوقا 12:35-48.",context:"تعليم للتلاميذ أن يكونوا مستعدين لرجوع السيد، في إطار الثقة بالآب وعدم القلق والطمع.",meaning:"العبيد الساهرون يفتحون للسيد متى جاء. المفاجأة أن السيد يكافئ العبيد الأمناء بالخدمة والكرامة، لكن المسؤولية الأكبر تجلب حسابًا أكبر.",background:"لبس الأحقاء وإيقاد السرج صورتان للاستعداد العملي، لا لمجرد انتظار داخلي.",theology:["السهر مرتبط بالأمانة.","المسيح يقلب الأدوار بصورة مدهشة في مكافأة الأمناء.","المسؤولية الأكبر تجلب حسابًا أكبر."],application:["كلما زادت معرفتك ومسؤوليتك، زادت دعوتك إلى الأمانة.","لا تنتظر السيد بخمول بل بخدمة يقظة."],nt:"لوقا 12:35-48؛ يعقوب 3:1؛ 1 بطرس 5:2-4",ot:"صور السهر والاستعداد في خروج الفصح والحكمة",refs:"Green؛ Snodgrass"},
{id:"tower-builder",name:"مثل بناء البرج",subtitle:"لوقا 14:28-30",witness:"لوقا 14:28-30.",context:"في تعليم المسيح عن تكلفة التلمذة وحمل الصليب، وسط جموع كثيرة سائرة معه.",meaning:"من يريد بناء برج يجلس أولًا ويحسب النفقة، حتى لا يبدأ ثم يعجز عن الإتمام. المسيح لا يدعو إلى التهور بل إلى حساب تكلفة اتباعه.",background:"البناء غير المكتمل كان علامة خزي اجتماعي، لذلك تستخدم الصورة لإظهار جدية القرار قبل البداية." ,theology:["التلمذة ليست قرارًا عاطفيًا مؤقتًا.","اتباع المسيح التزام كامل.","البدء دون حساب التكلفة يعرّض الإنسان للانقطاع والخزي."],application:["اتبع المسيح واعيًا أن الطريق يشمل التضحية والاحتمال والثبات.","لا تبدأ طريق التلمذة كحماس مؤقت بلا جذور."],nt:"لوقا 14:25-33؛ 9:23؛ فيلبي 3:7-8",ot:"حكمة البناء والتدبير في أمثال الكتاب",refs:"Green؛ Snodgrass؛ Jeremias"},
{id:"warring-king",name:"مثل الملك الذي يحارب ملكًا آخر",subtitle:"لوقا 14:31-32",witness:"لوقا 14:31-32.",context:"مباشرة ضمن تعليم حساب تكلفة التلمذة، بعد مثل بناء البرج.",meaning:"ملك يواجه جيشًا أقوى منه فيحسب أولًا إمكانية الحرب. يستخدم المسيح الصورة ليؤكد أن التلميذ يجب أن يدرك أن اتباعه يتطلب تسليمًا كاملًا.",background:"صورة الحرب والمعاهدة مفهومة في عالم سياسي مضطرب، وتوضح أن القرار المصيري يحتاج إلى حساب صادق لا اندفاع.",theology:["لا يوجد اتباع حقيقي للمسيح مع احتفاظ الإنسان بحق السيطرة المطلقة على حياته.","التلمذة تسليم كامل لا مساومة جزئية.","حساب التكلفة جزء من صدق الإيمان."],application:["اسأل بصدق: هل المسيح سيد حياتي أم مجرد جزء منها؟","لا تدخل التلمذة بعقلية الاحتفاظ بكل شيء."],nt:"لوقا 14:25-33؛ غلاطية 2:20",ot:"حكمة المشورة قبل الحرب في أمثال 20:18",refs:"Green؛ Snodgrass"},
{id:"two-builders",name:"مثل البيتين: البناء على الصخر والرمل",subtitle:"متى 7:24-27؛ لوقا 6:47-49",witness:"متى 7:24-27؛ لوقا 6:47-49.",context:"خاتمة العظة على الجبل في متى، وتعليم مشابه في لوقا، بعد إعلان كلام المسيح بسلطان." ,meaning:"الفرق بين الرجل الحكيم والجاهل ليس في سماع كلام المسيح، فكلاهما يسمع، بل في العمل به. العاصفة تكشف أساس البناء." ,background:"الصخرة صورة قوية لله والثبات: تثنية 32:4؛ مزمور 18:2؛ 62:2. كما ترتبط الحكمة بالطاعة في سفر الأمثال.",theology:["سماع كلمة المسيح دون طاعة لا يكفي.","الاختبار يكشف الأساس.","المسيح يضع كلامه في موضع السلطة الحاسمة على الحياة."],application:["لا تسأل فقط: ماذا قال المسيح؟ بل: ماذا فعلت بما قاله؟","ابن حياتك على الطاعة لا على الإعجاب بالتعليم."],nt:"متى 7:24-27؛ لوقا 6:47-49",ot:"تثنية 32:4؛ مزمور 18:2؛ 62:2",refs:"France؛ Carson؛ Green؛ Snodgrass"},
{id:"sheep-goats",name:"مثل الخراف والجداء",subtitle:"متى 25:31-46",witness:"متى 25:31-46.",context:"جزء من تعليم المسيح عن مجيء ابن الإنسان والدينونة النهائية. يدرجه كثيرون ضمن الأمثال أو التعاليم التمثيلية، ويراه آخرون مشهدًا نبويًا أخرويًا أكثر من كونه مثلًا قصصيًا تقليديًا.",meaning:"يجلس ابن الإنسان على عرش المجد ويفصل الناس كما يفصل الراعي الخراف عن الجداء. معيار الكشف عن حقيقة الموقف هو التعامل مع أحد هؤلاء الإخوة الأصاغر." ,background:"صورة الله كراع ودينونة الرعاة تظهر بقوة في حزقيال 34، حيث يفصل الله بين الخراف والماعز ويحاسب الرعاة." ,theology:["المسيح هو الديان.","الدينونة حقيقية ونهائية.","المحبة العملية تكشف حقيقة الإيمان.","تجاهل المحتاج ليس أمرًا هامشيًا في الحياة المسيحية.","العلاقة بالمسيح تظهر في التعامل مع الإنسان المحتاج."],application:["الإيمان الذي لا يتحول إلى رحمة عملية يحتاج إلى فحص جاد.","انظر إلى المحتاج كموضع اختبار لعلاقتك بالمسيح."],nt:"متى 25:31-46؛ يعقوب 2:14-17",ot:"حزقيال 34:17-24؛ إشعياء 58:6-10",refs:"France؛ Carson؛ Keener؛ Snodgrass"}
].map(makeParable));
const grid=document.getElementById("parablesGrid"),pageTitle=document.getElementById("pageTitle"),studyPanel=document.getElementById("studyPanel"),backToParables=document.getElementById("backToParables"),title=document.getElementById("studyTitle"),subtitle=document.getElementById("studySubtitle"),body=document.getElementById("studyBody");
function sectionMarkup(section){const heading=section[0],content=section[1];const wide=true;if(typeof content==="object"&&!Array.isArray(content)){return `<section class="section-card wide"><h3>${heading}</h3><div class="ref-list"><div class="ref-item"><span class="ref-label">العهد الجديد:</span> ${content.nt}</div><div class="ref-item"><span class="ref-label">العهد القديم:</span> ${content.ot}</div><div class="ref-item"><span class="ref-label">المراجع التفسيرية:</span> ${content.refs}</div></div></section>`}if(Array.isArray(content)){return `<section class="section-card ${wide?"wide":""}"><h3>${heading}</h3><ul>${content.map(item=>`<li>${item}</li>`).join("")}</ul></section>`}return `<section class="section-card ${wide?"wide":""}"><h3>${heading}</h3><p>${content}</p></section>`}
function renderParable(id){const parable=parables.find(item=>item.id===id)||parables[0];title.textContent=parable.name;subtitle.textContent=parable.subtitle;body.innerHTML=parable.sections.map(sectionMarkup).join("");pageTitle.hidden=true;grid.hidden=true;studyPanel.hidden=false;document.querySelectorAll(".parable-card").forEach(card=>card.classList.toggle("active",card.dataset.id===parable.id));history.replaceState(null,"",`#${parable.id}`)}
function showParables(){pageTitle.hidden=false;grid.hidden=false;studyPanel.hidden=true;document.querySelectorAll(".parable-card").forEach(card=>card.classList.remove("active"));history.replaceState(null,"",location.pathname);window.scrollTo({top:0,behavior:"smooth"})}
grid.innerHTML=parables.map((parable,index)=>`<button class="parable-card" type="button" data-id="${parable.id}" aria-label="${parable.name}"><span class="parable-number">${index+1}</span><span class="parable-name">${parable.name}</span><span class="parable-subtitle">${parable.subtitle}</span></button>`).join("");
grid.addEventListener("click",event=>{const card=event.target.closest(".parable-card");if(!card)return;renderParable(card.dataset.id);window.scrollTo({top:0,behavior:"smooth"})});backToParables.addEventListener("click",showParables);window.addEventListener("hashchange",()=>{const id=location.hash.replace("#","");if(id)renderParable(id)});const initialId=location.hash.replace("#","");if(initialId){renderParable(initialId)}else{showParables()}
</script>
