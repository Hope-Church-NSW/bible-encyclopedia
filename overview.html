<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موسوعة التفسير | موسوعة الكتاب المقدس</title>

<style>

:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a46;
    --panel3:#153657;
    --gold:#d4af37;
    --gold2:#f2d675;
    --white:#f4f7fb;
    --muted:#9fb0c3;
    --line:#1d3b59;
    --blue:#2d7ff9;
    --danger:#ffb4b4;
    --success:#b8e8c1;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at top right,
            rgba(45,127,249,.12),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );
    color:var(--white);
    font-family:
        Arial,
        Tahoma,
        "Segoe UI",
        sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(6,19,33,.97);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.header-inner{
    width:min(1400px,92%);
    min-height:78px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.back-button{
    min-height:48px;

    padding:10px 18px;

    border:1px solid var(--gold);
    border-radius:12px;

    background:var(--panel2);
    color:var(--gold2);

    text-decoration:none;

    font-size:18px;
    font-weight:900;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s ease;
}

.back-button:hover{
    background:var(--panel3);
    transform:translateY(-1px);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:68px;
    height:68px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold2);
    font-size:25px;
    font-weight:900;

    text-shadow:
        0 2px 8px rgba(212,175,55,.30);
}

main{
    width:min(1250px,94%);
    margin:auto;
    padding:30px 0 70px;
}

#app{
    width:100%;
}

.workspace{
    width:100%;

    background:
        rgba(13,33,56,.97);

    border:1px solid var(--line);
    border-radius:22px;

    padding:26px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.22);
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:25px;

    padding-bottom:20px;

    border-bottom:1px solid var(--line);
}

.page-title{
    margin:0;

    color:var(--gold2);

    font-size:30px;
    font-weight:900;

    line-height:1.5;
}

.page-reference{
    margin-top:6px;

    color:var(--muted);

    font-size:17px;
    font-weight:700;
}

.loading{
    text-align:center;

    color:var(--gold2);

    font-size:20px;
    font-weight:900;

    padding:70px 20px;
}

.error{
    color:var(--danger);

    background:#351b24;

    border:1px solid #6b3040;

    border-radius:12px;

    padding:18px;

    line-height:2;
}

.no-study{
    text-align:center;

    color:var(--muted);

    padding:60px 20px;

    line-height:2.2;

    font-size:18px;
}

.study-header{
    margin-bottom:28px;

    padding:25px;

    border:1px solid var(--line);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            var(--panel3),
            var(--panel2)
        );
}

.study-reference{
    color:var(--gold2);

    font-size:28px;

    font-weight:900;

    margin-bottom:16px;
}

.study-text{
    color:var(--white);

    font-size:22px;

    line-height:2.35;
}

.section{
    margin-top:20px;

    border:1px solid var(--line);

    border-radius:18px;

    overflow:hidden;

    background:var(--panel);
}

.section-header{
    padding:17px 20px;

    background:
        linear-gradient(
            145deg,
            var(--panel3),
            var(--panel2)
        );

    border-bottom:1px solid var(--line);

    color:var(--gold2);

    font-size:21px;

    font-weight:900;

    display:flex;
    align-items:center;

    gap:10px;
}

.section-body{
    padding:22px;

    color:var(--white);

    font-size:18px;

    line-height:2.35;
}

.section-body p{
    margin:0 0 16px;
}

.section-body p:last-child{
    margin-bottom:0;
}

.section-body ul{
    margin:0;
    padding-right:25px;
}

.section-body li{
    margin-bottom:10px;
}

.section-body strong{
    color:var(--gold2);
}

.original-word{
    margin-bottom:16px;

    padding:16px;

    border:1px solid var(--line);

    border-radius:13px;

    background:var(--panel2);
}

.original-word:last-child{
    margin-bottom:0;
}

.original-word-name{
    color:var(--gold2);

    font-size:21px;

    font-weight:900;

    margin-bottom:7px;
}

.original-word-meta{
    color:var(--muted);

    font-size:15px;

    margin-bottom:10px;
}

.original-word-description{
    font-size:17px;

    line-height:2.2;
}

.commentator{
    margin-bottom:15px;

    padding:18px;

    border:1px solid var(--line);

    border-radius:14px;

    background:var(--panel2);
}

.commentator:last-child{
    margin-bottom:0;
}

.commentator-name{
    color:var(--gold2);

    font-size:20px;

    font-weight:900;

    margin-bottom:10px;
}

.commentator-tradition{
    color:var(--muted);

    font-size:14px;

    margin-bottom:10px;
}

.commentator-text{
    font-size:17px;

    line-height:2.25;
}

.comparison-table-wrapper{
    width:100%;

    overflow-x:auto;
}

.comparison-table{
    width:100%;

    border-collapse:collapse;

    min-width:700px;
}

.comparison-table th,
.comparison-table td{
    border:1px solid var(--line);

    padding:14px;

    text-align:right;

    vertical-align:top;

    line-height:2;
}

.comparison-table th{
    background:var(--panel3);

    color:var(--gold2);

    font-weight:900;
}

.comparison-table td{
    background:var(--panel2);
}

.cross-reference{
    display:flex;

    flex-wrap:wrap;

    gap:10px;
}

.cross-reference a{
    display:inline-flex;

    align-items:center;

    min-height:42px;

    padding:7px 13px;

    border:1px solid var(--line);

    border-radius:10px;

    background:var(--panel2);

    color:var(--gold2);

    text-decoration:none;

    font-weight:900;

    transition:.2s ease;
}

.cross-reference a:hover{
    background:var(--panel3);

    border-color:var(--gold);
}

.source{
    margin-bottom:12px;

    padding:14px 16px;

    border-right:3px solid var(--gold);

    background:var(--panel2);

    border-radius:10px;
}

.source:last-child{
    margin-bottom:0;
}

.source-name{
    color:var(--gold2);

    font-weight:900;

    margin-bottom:5px;
}

.source-details{
    color:var(--muted);

    font-size:15px;

    line-height:1.9;
}

.source a{
    color:var(--blue);

    text-decoration:none;
}

.source a:hover{
    text-decoration:underline;
}

.methodology{
    margin-top:25px;

    padding:20px;

    border:1px solid var(--gold);

    border-radius:15px;

    background:
        rgba(212,175,55,.06);

    color:var(--muted);

    line-height:2.1;

    font-size:15px;
}

.methodology strong{
    color:var(--gold2);
}

.footer-note{
    margin-top:30px;

    padding-top:20px;

    border-top:1px solid var(--line);

    color:var(--muted);

    text-align:center;

    font-size:14px;

    line-height:2;
}

@media(max-width:700px){

    .header-inner{
        min-height:68px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .brand-title{
        font-size:18px;
    }

    .back-button{
        min-height:42px;

        padding:8px 12px;

        font-size:15px;
    }

    main{
        width:94%;

        padding-top:20px;
    }

    .workspace{
        padding:16px;
    }

    .topbar{
        align-items:flex-start;
    }

    .page-title{
        font-size:24px;
    }

    .study-reference{
        font-size:24px;
    }

    .study-text{
        font-size:19px;
    }

    .section-header{
        font-size:19px;
    }

    .section-body{
        padding:17px;

        font-size:17px;

        line-height:2.25;
    }

}

@media(max-width:430px){

    .brand-title{
        font-size:15px;
    }

    .page-title{
        font-size:21px;
    }

    .back-button{
        font-size:14px;

        padding:7px 9px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <a
            id="backButton"
            href="bible.html"
            class="back-button"
        >
            ← الكتاب المقدس
        </a>


        <div class="brand">

            <div class="brand-title">
                موسوعة الكتاب المقدس
            </div>


            <img
                src="assets/logo.png"
                class="logo"
                alt="شعار الكنيسة"
            >

        </div>

    </div>

</header>


<main>

    <div id="app">

        <div class="loading">
            جاري تحميل موسوعة التفسير...
        </div>

    </div>

</main>


<script>

/* =========================================================
   ملفات قاعدة البيانات
========================================================= */

const BIBLE_URL =
    "bible.json";

const COMMENTARY_URL =
    "commentary.json";


/* =========================================================
   الحالة
========================================================= */

let bibleData = [];

let commentaryData = {};

let currentReference = {

    book:"",
    chapter:"",
    verse:""

};


/* =========================================================
   عناصر الصفحة
========================================================= */

const app =
    document.getElementById("app");


const backButton =
    document.getElementById("backButton");


/* =========================================================
   أسماء الأسفار
   مطابقة لـ bible.html
========================================================= */

const BOOK_NAMES = {

    "01-gen":"التكوين",
    "02-Exodus":"الخروج",
    "03-Leviticus":"اللاويين",
    "04-Numbers":"العدد",
    "05-Deut":"التثنية",
    "06-Joshua":"يشوع",
    "07-Judges":"القضاة",
    "08-Ruth":"راعوث",
    "09-1Samuel":"صموئيل الأول",
    "10-2Samuel":"صموئيل الثاني",
    "11-1Kings":"ملوك الأول",
    "12-2Kings":"ملوك الثاني",
    "13-1Chronicles":"أخبار الأيام الأول",
    "14-2Chronicles":"أخبار الأيام الثاني",
    "15-Ezra":"عزرا",
    "16-Nehemiah":"نحميا",
    "17-Esther":"أستير",
    "18-Job":"أيوب",
    "19-Psalms":"المزامير",
    "20-Proverbs":"الأمثال",
    "21-Ecclesiastes":"الجامعة",
    "22-Song":"نشيد الأنشاد",
    "23-Isaiah":"إشعياء",
    "24-Jeremiah":"إرميا",
    "25-Lamentations":"مراثي إرميا",
    "26-Ezekiel":"حزقيال",
    "27-Daniel":"دانيال",
    "28-Hosea":"هوشع",
    "29-Joel":"يوئيل",
    "30-Amos":"عاموس",
    "31-Obadiah":"عوبديا",
    "32-Jonah":"يونان",
    "33-Micah":"ميخا",
    "34-Nahum":"ناحوم",
    "35-Habakkuk":"حبقوق",
    "36-Zephaniah":"صفنيا",
    "37-Haggai":"حجي",
    "38-Zechariah":"زكريا",
    "39-Malachi":"ملاخي",

    "40-Matthew":"متى",
    "41-Mark":"مرقس",
    "42-Luke":"لوقا",
    "43-John":"يوحنا",
    "44-Acts":"أعمال الرسل",
    "45-Romans":"رومية",
    "46-1-Corinthians":"كورنثوس الأولى",
    "47-2-Corinthians":"كورنثوس الثانية",
    "48-Galatians":"غلاطية",
    "49-Ephesians":"أفسس",
    "50-Philippians":"فيلبي",
    "51-Colossians":"كولوسي",
    "52-1-Thessalonians":"تسالونيكي الأولى",
    "53-2-Thessalonians":"تسالونيكي الثانية",
    "54-1-Timothy":"تيموثاوس الأولى",
    "55-2-Timothy":"تيموثاوس الثانية",
    "56-Titus":"تيطس",
    "57-Philemon":"فليمون",
    "58-Hebrews":"العبرانيين",
    "59-James":"يعقوب",
    "60-1-peter":"بطرس الأولى",
    "61-2pet":"بطرس الثانية",
    "62-1-John":"يوحنا الأولى",
    "63-2-John":"يوحنا الثانية",
    "64-3-John":"يوحنا الثالثة",
    "65-Jude":"يهوذا",
    "66-Revelation":"رؤيا يوحنا"

};


/* =========================================================
   حماية HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}


/* =========================================================
   قراءة Parameters
========================================================= */

function getParameters(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    currentReference.book =
        String(
            params.get("book") || ""
        ).trim();


    currentReference.chapter =
        Number(
            params.get("chapter")
        );


    currentReference.verse =
        Number(
            params.get("verse")
        );


    return (

        currentReference.book &&
        Number.isFinite(
            currentReference.chapter
        ) &&
        Number.isFinite(
            currentReference.verse
        )

    );

}


/* =========================================================
   مفتاح الآية
========================================================= */

function makeReferenceKey(
    book,
    chapter,
    verse
){

    return (

        String(book).trim() +
        ":" +
        Number(chapter) +
        ":" +
        Number(verse)

    );

}


/* =========================================================
   مرجع عربي
========================================================= */

function getArabicReference(
    book,
    chapter,
    verse
){

    return (

        (BOOK_NAMES[book] || book) +
        " " +
        chapter +
        ":" +
        verse

    );

}


/* =========================================================
   البحث عن الآية
========================================================= */

function findVerse(){

    return bibleData.find(function(item){

        return (

            String(item.book).trim() ===
            currentReference.book &&

            Number(item.chapter) ===
            Number(currentReference.chapter) &&

            Number(
                item.verse ??
                item.number
            ) ===
            Number(currentReference.verse)

        );

    });

}


/* =========================================================
   البحث عن دراسة الآية
========================================================= */

function findStudy(){

    const key =
        makeReferenceKey(
            currentReference.book,
            currentReference.chapter,
            currentReference.verse
        );


    /*
       يدعم شكلين:

       1.
       commentary.json
       {
           "01-gen:1:1": {...}
       }

       2.
       commentary.json
       [
           {
               book:"01-gen",
               chapter:1,
               verse:1,
               ...
           }
       ]
    */


    if(
        !Array.isArray(commentaryData) &&
        commentaryData &&
        typeof commentaryData === "object"
    ){

        if(
            commentaryData[key]
        ){

            return commentaryData[key];

        }

    }


    if(Array.isArray(commentaryData)){

        return commentaryData.find(function(item){

            return (

                String(item.book).trim() ===
                currentReference.book &&

                Number(item.chapter) ===
                Number(currentReference.chapter) &&

                Number(item.verse) ===
                Number(currentReference.verse)

            );

        });

    }


    return null;

}


/* =========================================================
   النص
========================================================= */

function normalizeText(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    if(Array.isArray(value)){

        return value
            .map(function(item){

                return String(item);

            })
            .join("\n\n");

    }


    return String(value);

}


/* =========================================================
   عرض نص متعدد الفقرات
========================================================= */

function renderText(value){

    const text =
        normalizeText(value)
            .trim();


    if(!text){

        return `
            <div class="no-study">
                لا توجد مادة موثقة لهذا القسم حاليًا.
            </div>
        `;

    }


    return text
        .split(/\n\s*\n/)
        .map(function(paragraph){

            return `
                <p>
                    ${escapeHTML(
                        paragraph.trim()
                    ).replace(/\n/g,"<br>")}
                </p>
            `;

        })
        .join("");

}


/* =========================================================
   عرض قسم
========================================================= */

function renderSection(
    icon,
    title,
    content
){

    if(
        content === null ||
        content === undefined ||
        content === ""
    ){

        return "";

    }


    return `

        <section class="section">

            <div class="section-header">

                <span>
                    ${icon}
                </span>

                <span>
                    ${escapeHTML(title)}
                </span>

            </div>


            <div class="section-body">

                ${renderText(content)}

            </div>

        </section>

    `;

}


/* =========================================================
   الكلمات الأصلية
========================================================= */

function renderOriginalWords(words){

    if(
        !Array.isArray(words) ||
        !words.length
    ){

        return "";

    }


    return `

        <section class="section">

            <div class="section-header">

                <span>🔤</span>

                <span>
                    الكلمات الأصلية
                </span>

            </div>


            <div class="section-body">

                ${words.map(function(word){

                    return `

                        <div class="original-word">

                            <div class="original-word-name">

                                ${escapeHTML(
                                    word.word ||
                                    word.term ||
                                    ""
                                )}

                            </div>


                            ${
                                word.transliteration
                                ?
                                `
                                <div class="original-word-meta">

                                    النطق:
                                    ${escapeHTML(
                                        word.transliteration
                                    )}

                                </div>
                                `
                                :
                                ""
                            }


                            ${
                                word.language
                                ?
                                `
                                <div class="original-word-meta">

                                    اللغة:
                                    ${escapeHTML(
                                        word.language
                                    )}

                                </div>
                                `
                                :
                                ""
                            }


                            ${
                                word.strong
                                ?
                                `
                                <div class="original-word-meta">

                                    Strong:
                                    ${escapeHTML(
                                        word.strong
                                    )}

                                </div>
                                `
                                :
                                ""
                            }


                            <div class="original-word-description">

                                ${renderText(
                                    word.meaning ||
                                    word.description ||
                                    ""
                                )}

                            </div>

                        </div>

                    `;

                }).join("")}

            </div>

        </section>

    `;

}


/* =========================================================
   أقوال المفسرين
========================================================= */

function renderCommentators(commentators){

    if(
        !Array.isArray(commentators) ||
        !commentators.length
    ){

        return "";

    }


    return `

        <section class="section">

            <div class="section-header">

                <span>📚</span>

                <span>
                    أقوال المفسرين المعتمدين
                </span>

            </div>


            <div class="section-body">

                ${commentators.map(function(item){

                    return `

                        <div class="commentator">

                            <div class="commentator-name">

                                ${escapeHTML(
                                    item.name ||
                                    item.author ||
                                    "المفسر"
                                )}

                            </div>


                            ${
                                item.tradition
                                ?
                                `
                                <div class="commentator-tradition">

                                    الاتجاه:
                                    ${escapeHTML(
                                        item.tradition
                                    )}

                                </div>
                                `
                                :
                                ""
                            }


                            <div class="commentator-text">

                                ${renderText(
                                    item.text ||
                                    item.summary ||
                                    ""
                                )}

                            </div>

                        </div>

                    `;

                }).join("")}

            </div>

        </section>

    `;

}


/* =========================================================
   المقارنة
========================================================= */

function renderComparison(comparison){

    if(
        !comparison
    ){

        return "";

    }


    if(
        Array.isArray(comparison)
    ){

        return `

            <section class="section">

                <div class="section-header">

                    <span>⚖️</span>

                    <span>
                        المقارنة بين التفسيرات
                    </span>

                </div>


                <div class="section-body">

                    ${comparison.map(function(item){

                        return `

                            <div class="commentator">

                                <div class="commentator-name">

                                    ${escapeHTML(
                                        item.title ||
                                        item.name ||
                                        "وجهة نظر"
                                    )}

                                </div>


                                <div class="commentator-text">

                                    ${renderText(
                                        item.text ||
                                        item.description ||
                                        ""
                                    )}

                                </div>

                            </div>

                        `;

                    }).join("")}

                </div>

            </section>

        `;

    }


    return renderSection(
        "⚖️",
        "المقارنة بين التفسيرات",
        comparison
    );

}


/* =========================================================
   المراجع الكتابية
========================================================= */

function renderCrossReferences(references){

    if(
        !Array.isArray(references) ||
        !references.length
    ){

        return "";

    }


    return `

        <section class="section">

            <div class="section-header">

                <span>🔗</span>

                <span>
                    ارتباط الآية ببقية الكتاب المقدس
                </span>

            </div>


            <div class="section-body">

                <div class="cross-reference">

                    ${references.map(function(reference){

                        const value =
                            typeof reference === "string"
                                ? reference
                                : reference.reference || "";


                        const href =
                            typeof reference === "object" &&
                            reference.book &&
                            reference.chapter &&
                            reference.verse
                                ?

                                "overview.html?book=" +
                                encodeURIComponent(
                                    reference.book
                                ) +
                                "&chapter=" +
                                encodeURIComponent(
                                    reference.chapter
                                ) +
                                "&verse=" +
                                encodeURIComponent(
                                    reference.verse
                                )

                                :

                                "#";


                        return `

                            <a
                                href="${href}"
                            >

                                ${escapeHTML(value)}

                            </a>

                        `;

                    }).join("")}

                </div>

            </div>

        </section>

    `;

}


/* =========================================================
   المراجع والمصادر
========================================================= */

function renderSources(sources){

    return `

                <span>📖</span>

                <span>
                    المراجع والمصادر
                </span>

            </div>


            <div class="section-body">

                ${sources.map(function(source){

                    return `

                        <div class="source">

                                ${escapeHTML(
                                    source.name ||
                                    source.title ||
                                    "مصدر"
                                )}

                            </div>

/* =========================================================
   تحميل Bible
========================================================= */

async function loadBible(){

    const response =
        await fetch(
            BIBLE_URL,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "تعذر تحميل bible.json — HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(!Array.isArray(data)){

        throw new Error(
            "bible.json يجب أن يكون مصفوفة JSON."
        );

    }


    bibleData =
        data.map(function(item){

            return {

                book:String(
                    item.book ?? ""
                ).trim(),

                chapter:Number(
                    item.chapter
                ),

                verse:Number(
                    item.verse ??
                    item.number
                ),

                text:String(
                    item.text ?? ""
                ).trim()

            };

        }).filter(function(item){

            return (

                item.book &&
                Number.isFinite(
                    item.chapter
                ) &&
                Number.isFinite(
                    item.verse
                ) &&
                item.text

            );

        });

}


/* =========================================================
   تحميل قاعدة التفسير
========================================================= */

async function loadCommentary(){

    const response =
        await fetch(
            COMMENTARY_URL,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        /*
           عدم وجود commentary.json
           لا يمنع تشغيل الصفحة.
        */

        commentaryData = {};

        return;

    }


    const data =
        await response.json();


    if(
        !Array.isArray(data) &&
        (
            !data ||
            typeof data !== "object"
        )
    ){

        throw new Error(
            "commentary.json يحتوي على بنية غير صحيحة."
        );

    }


    commentaryData = data;

}


/* =========================================================
   التشغيل الرئيسي
========================================================= */

async function initialize(){

    try{

        if(!getParameters()){

            renderInvalidReference();

            return;

        }


        await loadBible();

        await loadCommentary();


        const verse =
            findVerse();


        if(!verse){

            app.innerHTML = `

                <section class="workspace">

                    <div class="error">

                        لم يتم العثور على الآية المطلوبة
                        داخل <b>bible.json</b>.

                        <br><br>

                        المرجع:

                        <b>

                            ${escapeHTML(
                                getArabicReference(
                                    currentReference.book,
                                    currentReference.chapter,
                                    currentReference.verse
                                )
                            )}

                        </b>

                    </div>

                </section>

            `;

            return;

        }


        const study =
            findStudy();


        if(!study){

            renderNoStudy(
                verse
            );

            return;

        }


        renderStudy(
            verse,
            study
        );


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        console.error(
            "Commentary loading error:",
            error
        );


        app.innerHTML = `

            <section class="workspace">

                <div class="error">

                    <strong>
                        تعذر تحميل موسوعة التفسير.
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            </section>

        `;

    }

}


/* =========================================================
   التشغيل
========================================================= */

initialize();

</script>
