<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الكتاب المقدس</title>

<style>
:root{
  --blue:#062b49;
  --blue2:#031827;
  --blue3:#0b456e;
  --gold:#d4af37;
  --gold2:#f3d878;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--white);
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at top,#14557e 0,#062b49 38%,#031827 100%);
}

header{
  height:88px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 22px;
  background:linear-gradient(180deg,#0b3c61,#031827);
  border-bottom:2px solid #b8942e;
  box-shadow:0 7px 25px #0009;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:bold;
  color:var(--gold2);
}

.logo{
  width:62px;
  height:62px;
  object-fit:contain;
}

.home{
  text-decoration:none;
  color:#fff;
  background:linear-gradient(145deg,#15547d,#06233b);
  border:1px solid var(--gold);
  border-radius:13px;
  padding:12px 18px;
  font-weight:bold;
  box-shadow:0 5px 15px #0008;
}

main{
  max-width:1400px;
  margin:auto;
  padding:25px 18px 60px;
}

.top-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

.top-controls button,
select{
  min-height:56px;
  border:1px solid var(--gold);
  border-radius:13px;
  background:linear-gradient(145deg,#125077,#05233b);
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  padding:10px;
}

.testaments{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:18px;
}

.testaments.show{
  display:grid;
}

.testament{
  min-height:85px;
  border:1px solid var(--gold);
  border-radius:15px;
  background:linear-gradient(145deg,#14577f,#05233b);
  color:#fff;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.books{
  display:none;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
  margin-top:18px;
}

.books.show{
  display:grid;
}

.book{
  min-height:58px;
  border:1px solid #b8942e;
  border-radius:12px;
  background:#07324f;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.chapter-area{
  display:none;
  margin-top:22px;
}

.chapter-area.show{
  display:block;
}

.chapter-title{
  color:var(--gold2);
  margin-bottom:15px;
}

.chapters{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(58px,1fr));
  gap:8px;
}

.chapter{
  min-height:52px;
  border:1px solid var(--gold);
  border-radius:10px;
  background:#073452;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.chapter:hover,
.book:hover,
.testament:hover,
.top-controls button:hover{
  background:#12608e;
}

.reader{
  display:none;
  margin-top:25px;
  background:linear-gradient(145deg,#092f4c,#031b2c);
  border:1px solid #b8942e;
  border-radius:18px;
  padding:22px;
  box-shadow:0 15px 35px #0008;
}

.reader.show{
  display:block;
}

.reader-title{
  color:var(--gold2);
  text-align:center;
  margin-top:0;
}

.verse{
  display:grid;
  grid-template-columns:48px 1fr;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid #ffffff16;
  font-size:20px;
  line-height:2.2;
}

.num{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#17202a;
  background:linear-gradient(145deg,#f6df7b,#c39b2c);
  border-radius:10px;
  font-weight:bold;
}

.reader-message{
  text-align:center;
  padding:30px;
  color:#c8d5df;
  font-size:18px;
}

.bottom-nav{
  display:none;
  position:relative;
  align-items:center;
  justify-content:space-between;
  margin-top:22px;
  min-height:65px;
}

.bottom-nav.show{
  display:flex;
}

.nav{
  min-width:110px;
  min-height:52px;
  border:1px solid var(--gold);
  border-radius:12px;
  background:linear-gradient(145deg,#15547d,#05233b);
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.audio{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  min-width:125px;
  min-height:52px;
  border:1px solid var(--gold);
  border-radius:12px;
  background:linear-gradient(145deg,#15547d,#05233b);
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:700px){
  .top-controls{
    grid-template-columns:1fr;
  }

  .testaments{
    grid-template-columns:1fr;
  }

  .brand{
    font-size:16px;
  }

  .logo{
    width:48px;
    height:48px;
  }

  .verse{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <a class="home" href="index.html">⌂ الرئيسية</a>

  <div class="brand">
    <span>الكتاب المقدس</span>
    <img class="logo" src="assets/logo.png" alt="كنيسة رجاء الأمم سيدني">
  </div>
</header>

<main>

  <!-- الثلاثة أزرار فقط -->
  <div class="top-controls">

    <button onclick="toggleTestaments()">
      📖 العهدين
    </button>

    <select id="chapterSelect" onchange="chapterFromSelect(this.value)">
      <option value="">الأصحاح</option>
    </select>

    <button onclick="focusSearch()">
      🔎 بحث عن آية
    </button>

  </div>

  <!-- العهدان -->
  <div id="testaments" class="testaments">

    <button class="testament" onclick="openTestament('old')">
      العهد القديم
    </button>

    <button class="testament" onclick="openTestament('new')">
      العهد الجديد
    </button>

  </div>

  <div id="oldBooks" class="books"></div>
  <div id="newBooks" class="books"></div>

  <!-- الأصحاحات -->
  <section id="chapterArea" class="chapter-area">

    <h2 id="chapterTitle" class="chapter-title"></h2>

    <div id="chapters" class="chapters"></div>

  </section>

  <!-- النص -->
  <section id="reader" class="reader">

    <h2 id="readerTitle" class="reader-title"></h2>

    <div id="verses"></div>

  </section>

  <!-- السابق / السماعة / التالي -->
  <div id="bottomNav" class="bottom-nav">

    <button class="nav" onclick="previousChapter()">
      السابق
    </button>

    <button class="audio" onclick="playAudio()">
      🔊 سماعة الكتاب
    </button>

    <button class="nav" onclick="nextChapter()">
      التالي
    </button>

  </div>

</main>

<script>

let bible={};
let currentBookKey="";
let currentBookName="";
let currentChapter=0;
let currentTestament="";


/* =========================================
   تحميل bible.json
========================================= */

async function loadBible(){

  try{

    const response=await fetch(
      "bible.json?v="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("bible.json");
    }

    bible=await response.json();

    console.log("Bible loaded:",bible);

  }catch(error){

    console.error(error);

    document.getElementById("verses").innerHTML=
      `<div class="reader-message">
        تعذر تحميل بيانات الكتاب المقدس.
      </div>`;

  }

}

loadBible();


/* =========================================
   أسماء الأسفار
========================================= */

const OLD=[
["تكوين","genesis"],
["خروج","exodus"],
["لاويين","leviticus"],
["عدد","numbers"],
["تثنية","deuteronomy"],
["يشوع","joshua"],
["قضاة","judges"],
["راعوث","ruth"],
["1 صموئيل","1samuel"],
["2 صموئيل","2samuel"],
["1 ملوك","1kings"],
["2 ملوك","2kings"],
["1 أخبار","1chronicles"],
["2 أخبار","2chronicles"],
["عزرا","ezra"],
["نحميا","nehemiah"],
["أستير","esther"],
["أيوب","job"],
["مزامير","psalms"],
["أمثال","proverbs"],
["جامعة","ecclesiastes"],
["نشيد الأنشاد","songofsolomon"],
["إشعياء","isaiah"],
["إرميا","jeremiah"],
["مراثي إرميا","lamentations"],
["حزقيال","ezekiel"],
["دانيال","daniel"],
["هوشع","hosea"],
["يوئيل","joel"],
["عاموس","amos"],
["عوبديا","obadiah"],
["يونان","jonah"],
["ميخا","micah"],
["ناحوم","nahum"],
["حبقوق","habakkuk"],
["صفنيا","zephaniah"],
["حجي","haggai"],
["زكريا","zechariah"],
["ملاخي","malachi"]
];

const NEW=[
["متى","matthew"],
["مرقس","mark"],
["لوقا","luke"],
["يوحنا","john"],
["أعمال الرسل","acts"],
["رومية","romans"],
["1 كورنثوس","1corinthians"],
["2 كورنثوس","2corinthians"],
["غلاطية","galatians"],
["أفسس","ephesians"],
["فيلبي","philippians"],
["كولوسي","colossians"],
["1 تسالونيكي","1thessalonians"],
["2 تسالونيكي","2thessalonians"],
["1 تيموثاوس","1timothy"],
["2 تيموثاوس","2timothy"],
["تيطس","titus"],
["فليمون","philemon"],
["عبرانيين","hebrews"],
["يعقوب","james"],
["1 بطرس","1peter"],
["2 بطرس","2peter"],
["1 يوحنا","1john"],
["2 يوحنا","2john"],
["3 يوحنا","3john"],
["يهوذا","jude"],
["رؤيا يوحنا","revelation"]
];


/* =========================================
   العهدين
========================================= */

function toggleTestaments(){

  document
    .getElementById("testaments")
    .classList.toggle("show");

}


function openTestament(type){

  currentTestament=type;

  const oldBox=
    document.getElementById("oldBooks");

  const newBox=
    document.getElementById("newBooks");

  oldBox.classList.remove("show");
  newBox.classList.remove("show");

  const list=
    type==="old" ? OLD : NEW;

  const box=
    type==="old" ? oldBox : newBox;

  box.innerHTML="";

  list.forEach(book=>{

    const button=
      document.createElement("button");

    button.className="book";
    button.textContent=book[0];

    button.onclick=()=>{
      openBook(book[1],book[0],type);
    };

    box.appendChild(button);

  });

  box.classList.add("show");
}


/* =========================================
   البحث عن مفتاح السفر
   يدعم اختلاف تسمية JSON
========================================= */

function resolveBook(key){

  if(bible[key])
    return bible[key];

  const alternatives={

    "1samuel":[
      "1_samuel",
      "first_samuel",
      "1 Samuel"
    ],

    "2samuel":[
      "2_samuel",
      "second_samuel",
      "2 Samuel"
    ],

    "1kings":[
      "1_kings",
      "first_kings",
      "1 Kings"
    ],

    "2kings":[
      "2_kings",
      "second_kings",
      "2 Kings"
    ],

    "1chronicles":[
      "1_chronicles",
      "first_chronicles",
      "1 Chronicles"
    ],

    "2chronicles":[
      "2_chronicles",
      "second_chronicles",
      "2 Chronicles"
    ],

    "songofsolomon":[
      "song_of_solomon",
      "songofsolomon",
      "song of solomon",
      "Song of Solomon"
    ],

    "1corinthians":[
      "1_corinthians",
      "1 Corinthians"
    ],

    "2corinthians":[
      "2_corinthians",
      "2 Corinthians"
    ],

    "philippians":[
      "philippians",
      "Philippians"
    ],

    "1thessalonians":[
      "1_thessalonians",
      "1 Thessalonians"
    ],

    "2thessalonians":[
      "2_thessalonians",
      "2 Thessalonians"
    ],

    "1timothy":[
      "1_timothy",
      "1 Timothy"
    ],

    "2timothy":[
      "2_timothy",
      "2 Timothy"
    ],

    "philemon":[
      "philemon",
      "Philemon"
    ],

    "1peter":[
      "1_peter",
      "1 Peter"
    ],

    "2peter":[
      "2_peter",
      "2 Peter"
    ],

    "1john":[
      "1_john",
      "1 John"
    ],

    "2john":[
      "2_john",
      "2 John"
    ],

    "3john":[
      "3_john",
      "3 John"
    ]

  };

  const variants=
    alternatives[key] || [];

  for(const name of variants){

    if(bible[name])
      return bible[name];

  }

  /* البحث غير الحساس لحالة الأحرف */

  const wanted=
    key
      .replace(/[_\s-]/g,"")
      .toLowerCase();

  for(const actual in bible){

    const normalized=
      String(actual)
        .replace(/[_\s-]/g,"")
        .toLowerCase();

    if(normalized===wanted)
      return bible[actual];

  }

  return null;
}


/* =========================================
   الحصول على الأصحاحات
========================================= */

function getChapters(book){

  if(!book)
    return [];

  /* صيغة:
     { chapters: [...] }
  */

  if(book.chapters){

    if(Array.isArray(book.chapters))
      return book.chapters;

    if(typeof book.chapters==="object"){

      return Object.keys(book.chapters)
        .sort((a,b)=>{

          const na=parseInt(a);
          const nb=parseInt(b);

          if(!isNaN(na)&&!isNaN(nb))
            return na-nb;

          return a.localeCompare(b);
        })
        .map(key=>book.chapters[key]);

    }

  }

  /* صيغة:
     { "1": {...}, "2": {...} }
  */

  if(typeof book==="object"&&!Array.isArray(book)){

    const keys=
      Object.keys(book)
        .filter(key=>/^\d+$/.test(key))
        .sort((a,b)=>Number(a)-Number(b));

    if(keys.length)
      return keys.map(key=>book[key]);

  }

  /* صيغة array */

  if(Array.isArray(book))
    return book;

  return [];
}


/* =========================================
   الحصول على الآيات
========================================= */

function getVerses(chapter){

  if(!chapter)
    return [];

  /* chapter.verses */

  if(chapter.verses){

    if(Array.isArray(chapter.verses))
      return chapter.verses;

    if(typeof chapter.verses==="object"){

      return Object.keys(chapter.verses)
        .sort((a,b)=>Number(a)-Number(b))
        .map(key=>{

          const value=
            chapter.verses[key];

          if(typeof value==="object")
            return {
              number:key,
              text:
                value.text||
                value.content||
                value.verse||
                ""
            };

          return {
            number:key,
            text:String(value)
          };

        });

    }

  }

  /* chapter هو نفسه قاموس الآيات */

  if(typeof chapter==="object"&&!Array.isArray(chapter)){

    const keys=
      Object.keys(chapter)
        .filter(key=>/^\d+$/.test(key))
        .sort((a,b)=>Number(a)-Number(b));

    if(keys.length){

      return keys.map(key=>{

        const value=chapter[key];

        if(typeof value==="object"){

          return {
            number:key,
            text:
              value.text||
              value.content||
              value.verse||
              ""
          };

        }

        return {
          number:key,
          text:String(value)
        };

      });

    }

  }

  /* chapter array */

  if(Array.isArray(chapter)){

    return chapter.map((item,index)=>{

      if(typeof item==="object"){

        return {
          number:
            item.number||
            item.verse||
            item.id||
            index+1,

          text:
            item.text||
            item.content||
            item.verse||
            ""
        };

      }

      return {
        number:index+1,
        text:String(item)
      };

    });

  }

  return [];
}


/* =========================================
   فتح السفر
========================================= */

function openBook(key,name,testament){

  currentBookKey=key;
  currentBookName=name;
  currentTestament=testament;
  currentChapter=0;

  const book=
    resolveBook(key);

  const chapters=
    getChapters(book);

  const area=
    document.getElementById("chapterArea");

  const list=
    document.getElementById("chapters");

  const title=
    document.getElementById("chapterTitle");

  list.innerHTML="";
  title.textContent=name;

  const selector=
    document.getElementById("chapterSelect");

  selector.innerHTML=
    '<option value="">الأصحاح</option>';

  if(!chapters.length){

    list.innerHTML=
      `<div class="reader-message">
       لم يتم العثور على أصحاحات لهذا السفر.
      </div>`;

    area.classList.add("show");
    return;

  }

  chapters.forEach((chapter,index)=>{

    const number=index+1;

    const button=
      document.createElement("button");

    button.className="chapter";
    button.textContent=number;

    button.onclick=()=>{
      openChapter(number);
    };

    list.appendChild(button);

    const option=
      document.createElement("option");

    option.value=number;
    option.textContent=
      "الأصحاح "+number;

    selector.appendChild(option);

  });

  area.classList.add("show");

  document
    .getElementById("reader")
    .classList.remove("show");

  document
    .getElementById("bottomNav")
    .classList.remove("show");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   فتح الأصحاح
========================================= */

function openChapter(number){

  number=Number(number);

  if(!number)
    return;

  const book=
    resolveBook(currentBookKey);

  const chapters=
    getChapters(book);

  const chapter=
    chapters[number-1];

  const verses=
    getVerses(chapter);

  currentChapter=number;

  const reader=
    document.getElementById("reader");

  const versesBox=
    document.getElementById("verses");

  const title=
    document.getElementById("readerTitle");

  title.textContent=
    `${currentBookName} — الأصحاح ${number}`;

  versesBox.innerHTML="";

  if(!verses.length){

    versesBox.innerHTML=
      `<div class="reader-message">
       لم يتم العثور على آيات هذا الأصحاح.
      </div>`;

  }else{

    verses.forEach((verse,index)=>{

      const row=
        document.createElement("div");

      row.className="verse";

      const numberText=
        verse.number || index+1;

      const text=
        verse.text || "";

      row.innerHTML=`
        <div class="num">
          ${escapeHTML(numberText)}
        </div>
        <div>
          ${escapeHTML(text)}
        </div>
      `;

      versesBox.appendChild(row);

    });

  }

  reader.classList.add("show");

  document
    .getElementById("chapterArea")
    .classList.remove("show");

  document
    .getElementById("bottomNav")
    .classList.add("show");

  document
    .getElementById("chapterSelect")
    .value=number;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   قائمة الأصحاح
========================================= */

function chapterFromSelect(value){

  if(!value)
    return;

  openChapter(Number(value));

}


/* =========================================
   السابق
========================================= */

function previousChapter(){

  if(!currentBookKey||!currentChapter)
    return;

  const target=
    currentChapter-1;

  if(target<1)
    return;

  openChapter(target);

}


/* =========================================
   التالي
========================================= */

function nextChapter(){

  if(!currentBookKey||!currentChapter)
    return;

  const book=
    resolveBook(currentBookKey);

  const chapters=
    getChapters(book);

  const target=
    currentChapter+1;

  if(target>chapters.length)
    return;

  openChapter(target);

}


/* =========================================
   بحث
========================================= */

function focusSearch(){

  const input=
    prompt("اكتب كلمة أو عبارة للبحث في الكتاب المقدس:");

  if(!input)
    return;

  const query=
    input.trim().toLowerCase();

  let results=[];

  Object.keys(bible).forEach(bookKey=>{

    const book=
      bible[bookKey];

    const chapters=
      getChapters(book);

    chapters.forEach((chapter,ci)=>{

      const verses=
        getVerses(chapter);

      verses.forEach((verse,vi)=>{

        const text=
          String(verse.text||"");

        if(
          text.toLowerCase()
             .includes(query)
        ){

          results.push({
            bookKey,
            chapter:ci+1,
            verse:
              verse.number||vi+1,
            text
          });

        }

      });

    });

  });

  if(!results.length){

    alert("لم يتم العثور على آيات.");
    return;

  }

  const first=results[0];

  const name=
    getBookDisplayName(first.bookKey);

  currentBookKey=first.bookKey;
  currentBookName=name;

  openChapter(first.chapter);

}


/* =========================================
   اسم السفر من المفتاح
========================================= */

function getBookDisplayName(key){

  const all=
    [...OLD,...NEW];

  const found=
    all.find(book=>{

      return (
        book[1]===key||
        normalizeKey(book[1])===
        normalizeKey(key)
      );

    });

  return found
    ? found[0]
    : key;

}


function normalizeKey(value){

  return String(value)
    .replace(/[_\s-]/g,"")
    .toLowerCase();

}


/* =========================================
   سماعة
========================================= */

function playAudio(){

  if(!currentBookKey||!currentChapter)
    return;

  const file=
    `audio/${currentBookKey}-${currentChapter}.mp3`;

  const audio=
    new Audio(file);

  audio.play().catch(()=>{

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
