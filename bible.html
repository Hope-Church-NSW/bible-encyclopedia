<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
--blue:#071d3a;
--blue2:#0c315c;
--blue3:#15528a;
--gold:#d4af37;
--gold2:#f5df83;
--white:#fff;
--bg:#eef4fb;
--text:#17253b;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:"Segoe UI",Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at 20% 10%,rgba(212,175,55,.08),transparent 30%),
linear-gradient(135deg,#071d3a,#0d315d 35%,#eef4fb 35%);
color:var(--text);
min-height:100vh;
}
.topbar{
height:86px;
padding:8px 22px;
display:flex;
align-items:center;
justify-content:space-between;
background:linear-gradient(135deg,#06172e,#0b315d,#09284d);
border-bottom:2px solid var(--gold);
box-shadow:0 8px 25px rgba(0,0,0,.28);
position:sticky;
top:0;
z-index:999;
}
.header-right{
display:flex;
align-items:center;
gap:14px;
}
.logo{
width:70px;
height:70px;
object-fit:contain;
filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))
drop-shadow(0 0 7px rgba(212,175,55,.3));
}
.church-name{
color:#fff;
font-size:22px;
font-weight:900;
text-shadow:1px 1px 0 #8b6b13,2px 2px 0 #614b0c,0 3px 8px rgba(0,0,0,.5);
}
.church-name span{color:var(--gold2)}
.gold-frame{
border:1px solid var(--gold2);
border-radius:14px;
background:linear-gradient(145deg,#1b4c7d,#071d3a);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.25),
inset 0 -3px 0 rgba(0,0,0,.35),
0 4px 0 #604b10,
0 7px 15px rgba(0,0,0,.25);
color:var(--gold2);
font-weight:900;
cursor:pointer;
text-decoration:none;
transition:.25s;
}
.gold-frame:hover{
transform:translateY(-2px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),
0 5px 0 #604b10,0 12px 22px rgba(0,0,0,.3);
}
.home-btn{padding:12px 20px}

.container{
width:min(1100px,94%);
margin:34px auto 70px;
}
.title{
text-align:center;
margin-bottom:25px;
}
.title h1{
margin:0;
font-size:40px;
font-weight:950;
background:linear-gradient(180deg,#f8e79a 0%,#d4af37 45%,#8b6811 100%);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
text-shadow:0 2px 5px rgba(0,0,0,.18);
}
.control-panel{
background:#fff;
padding:25px;
border-radius:22px;
border:1px solid #d7e1ee;
box-shadow:0 12px 35px rgba(7,29,58,.13);
}
.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}
.field label{
display:block;
margin-bottom:8px;
font-weight:900;
color:var(--blue);
}
select{
width:100%;
height:53px;
border:2px solid #d7e1ee;
border-radius:14px;
background:#fff;
color:#17253b;
padding:0 15px;
font-size:16px;
outline:none;
cursor:pointer;
}
select:focus{
border-color:var(--blue3);
box-shadow:0 0 0 4px rgba(21,82,138,.1);
}

.chapter{
display:none;
margin-top:28px;
}
.chapter.show{display:block}
.chapter-header{
padding:20px;
border-radius:19px;
color:#fff;
background:linear-gradient(135deg,#071d3a,#15528a);
border:1px solid var(--gold);
box-shadow:0 8px 22px rgba(7,29,58,.2);
}
.chapter-header h2{margin:0;font-size:25px}
.verse{
margin-top:12px;
padding:19px 21px;
background:#fff;
border:1px solid #dce5f0;
border-radius:17px;
display:flex;
align-items:flex-start;
gap:16px;
box-shadow:0 5px 16px rgba(7,29,58,.07);
}
.verse-number{
flex:0 0 40px;
width:40px;
height:40px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#d4af37,#87670e);
color:#fff;
font-weight:900;
box-shadow:0 3px 7px rgba(0,0,0,.2);
}
.verse-text{
font-size:19px;
line-height:2.05;
}
.chapter-nav{
display:flex;
justify-content:space-between;
gap:15px;
margin-top:25px;
}
.nav-btn{
min-width:150px;
padding:13px 25px;
text-align:center;
font-size:17px;
}
.nav-btn:disabled{
opacity:.35;
cursor:not-allowed;
}
.audio-box{
margin-top:25px;
padding:20px;
background:#fff;
border:1px solid #d7e1ee;
border-radius:18px;
text-align:center;
}
.audio-title{
font-weight:900;
color:var(--blue);
margin-bottom:12px;
}
audio{width:min(600px,100%)}

@media(max-width:700px){
.topbar{height:auto;min-height:78px;padding:7px 10px}
.logo{width:54px;height:54px}
.church-name{font-size:14px}
.home-btn{padding:9px 12px;font-size:13px}
.title h1{font-size:31px}
.controls{grid-template-columns:1fr}
.verse-text{font-size:17px}
.nav-btn{min-width:0;flex:1}
}
</style>
</head>

<body>

<header class="topbar">

<div class="header-right">
<img src="./assets/logo.png" class="logo" alt="كنيسة رجاء الأمم سيدني">
<div class="church-name">
كنيسة رجاء الأمم <span>سيدني</span>
</div>
</div>

<a href="./index.html" class="gold-frame home-btn">
🏠 الرئيسية
</a>

</header>

<main class="container">

<div class="title">
<h1>الكتاب المقدس</h1>
</div>

<section class="control-panel">

<div class="controls">

<div class="field">
<label for="testament">العهد</label>
<select id="testament">
<option value="old">العهد القديم</option>
<option value="new">العهد الجديد</option>
</select>
</div>

<div class="field">
<label for="book">السفر</label>
<select id="book">
<option value="">اختر السفر</option>
</select>
</div>

<div class="field">
<label for="chapterSelect">الأصحاح</label>
<select id="chapterSelect" disabled>
<option value="">اختر الأصحاح</option>
</select>
</div>

</div>

</section>

<section id="chapter" class="chapter">

<div id="chapterHeader" class="chapter-header"></div>

<div id="verses"></div>

<div class="chapter-nav">

<button id="nextBtn" class="gold-frame nav-btn" type="button">
التالي →
</button>

<button id="prevBtn" class="gold-frame nav-btn" type="button">
← السابق
</button>

</div>

<section class="audio-box">
<div class="audio-title">🎧 الكتاب المقدس المسموع</div>
<audio id="audioPlayer" controls preload="none"></audio>
</section>

</section>

</main>

<script>

const BIBLE_URL="./bible.json";

const BOOKS=[

{id:"01-gen",name:"التكوين",chapters:50,testament:"old"},
{id:"02-exo",name:"الخروج",chapters:40,testament:"old"},
{id:"03-lev",name:"اللاويين",chapters:27,testament:"old"},
{id:"04-num",name:"العدد",chapters:36,testament:"old"},
{id:"05-deut",name:"التثنية",chapters:34,testament:"old"},
{id:"06-josh",name:"يشوع",chapters:24,testament:"old"},
{id:"07-judges",name:"القضاة",chapters:21,testament:"old"},
{id:"08-ruth",name:"راعوث",chapters:4,testament:"old"},
{id:"09-1-samuel",name:"صموئيل الأول",chapters:31,testament:"old"},
{id:"10-2-samuel",name:"صموئيل الثاني",chapters:24,testament:"old"},
{id:"11-1-kings",name:"ملوك الأول",chapters:22,testament:"old"},
{id:"12-2-kings",name:"ملوك الثاني",chapters:25,testament:"old"},
{id:"13-1-chronicles",name:"أخبار الأيام الأول",chapters:29,testament:"old"},
{id:"14-2-chronicles",name:"أخبار الأيام الثاني",chapters:36,testament:"old"},
{id:"15-ezra",name:"عزرا",chapters:10,testament:"old"},
{id:"16-nehemiah",name:"نحميا",chapters:13,testament:"old"},
{id:"17-esther",name:"أستير",chapters:10,testament:"old"},
{id:"18-job",name:"أيوب",chapters:42,testament:"old"},
{id:"19-psalms",name:"المزامير",chapters:150,testament:"old"},
{id:"20-proverbs",name:"الأمثال",chapters:31,testament:"old"},
{id:"21-ecclesiastes",name:"الجامعة",chapters:12,testament:"old"},
{id:"22-song",name:"نشيد الأنشاد",chapters:8,testament:"old"},
{id:"23-isaiah",name:"إشعياء",chapters:66,testament:"old"},
{id:"24-jeremiah",name:"إرميا",chapters:52,testament:"old"},
{id:"25-lamentations",name:"مراثي إرميا",chapters:5,testament:"old"},
{id:"26-ezekiel",name:"حزقيال",chapters:48,testament:"old"},
{id:"27-daniel",name:"دانيال",chapters:12,testament:"old"},
{id:"28-hosea",name:"هوشع",chapters:14,testament:"old"},
{id:"29-joel",name:"يوئيل",chapters:3,testament:"old"},
{id:"30-amos",name:"عاموس",chapters:9,testament:"old"},
{id:"31-obadiah",name:"عوبديا",chapters:1,testament:"old"},
{id:"32-jonah",name:"يونان",chapters:4,testament:"old"},
{id:"33-micah",name:"ميخا",chapters:7,testament:"old"},
{id:"34-nahum",name:"ناحوم",chapters:3,testament:"old"},
{id:"35-habakkuk",name:"حبقوق",chapters:3,testament:"old"},
{id:"36-zephaniah",name:"صفنيا",chapters:3,testament:"old"},
{id:"37-haggai",name:"حجي",chapters:2,testament:"old"},
{id:"38-zechariah",name:"زكريا",chapters:14,testament:"old"},
{id:"39-malachi",name:"ملاخي",chapters:4,testament:"old"},

{id:"40-matthew",name:"متى",chapters:28,testament:"new"},
{id:"41-mark",name:"مرقس",chapters:16,testament:"new"},
{id:"42-luke",name:"لوقا",chapters:24,testament:"new"},
{id:"43-john",name:"يوحنا",chapters:21,testament:"new"},
{id:"44-acts",name:"أعمال الرسل",chapters:28,testament:"new"},
{id:"45-romans",name:"رومية",chapters:16,testament:"new"},
{id:"46-1-corinthians",name:"كورنثوس الأولى",chapters:16,testament:"new"},
{id:"47-2-corinthians",name:"كورنثوس الثانية",chapters:13,testament:"new"},
{id:"48-galatians",name:"غلاطية",chapters:6,testament:"new"},
{id:"49-ephesians",name:"أفسس",chapters:6,testament:"new"},
{id:"50-philippians",name:"فيلبي",chapters:4,testament:"new"},
{id:"51-colossians",name:"كولوسي",chapters:4,testament:"new"},
{id:"52-1-thessalonians",name:"تسالونيكي الأولى",chapters:5,testament:"new"},
{id:"53-2-thessalonians",name:"تسالونيكي الثانية",chapters:3,testament:"new"},
{id:"54-1-timothy",name:"تيموثاوس الأولى",chapters:6,testament:"new"},
{id:"55-2-timothy",name:"تيموثاوس الثانية",chapters:4,testament:"new"},
{id:"56-titus",name:"تيطس",chapters:3,testament:"new"},
{id:"57-philemon",name:"فليمون",chapters:1,testament:"new"},
{id:"58-hebrews",name:"العبرانيين",chapters:13,testament:"new"},
{id:"59-james",name:"يعقوب",chapters:5,testament:"new"},
{id:"60-1-peter",name:"بطرس الأولى",chapters:5,testament:"new"},
{id:"61-2-peter",name:"بطرس الثانية",chapters:3,testament:"new"},
{id:"62-1-john",name:"يوحنا الأولى",chapters:5,testament:"new"},
{id:"63-2-john",name:"يوحنا الثانية",chapters:1,testament:"new"},
{id:"64-3-john",name:"يوحنا الثالثة",chapters:1,testament:"new"},
{id:"65-jude",name:"يهوذا",chapters:1,testament:"new"},
{id:"66-revelation",name:"رؤيا يوحنا",chapters:22,testament:"new"}

];

const testament=document.getElementById("testament");
const book=document.getElementById("book");
const chapterSelect=document.getElementById("chapterSelect");
const chapter=document.getElementById("chapter");
const chapterHeader=document.getElementById("chapterHeader");
const verses=document.getElementById("verses");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const audioPlayer=document.getElementById("audioPlayer");

let bibleData=[];
let currentBook="";
let currentChapter=0;

function normalizeBookId(value){

if(!value)return "";

let v=String(value)
.trim()
.toLowerCase()
.replace(/_/g,"-")
.replace(/\s+/g,"-");

const found=BOOKS.find(b=>
b.id===v ||
b.id.replace(/-/g,"")===v.replace(/-/g,"")
);

if(found)return found.id;

const numberMatch=v.match(/^(\d{1,2})[-_]/);

if(numberMatch){

const n=String(parseInt(numberMatch[1],10)).padStart(2,"0");

const numbered=BOOKS.find(b=>b.id.startsWith(n+"-"));

if(numbered)return numbered.id;

}

return v;
}

function normalizeBible(raw){

let rows=[];

/* flat array */
if(Array.isArray(raw)){

raw.forEach(item=>{

if(item && typeof item==="object" && !Array.isArray(item)){
rows.push(item);
}

});

}

/* wrapped arrays */
if(raw && Array.isArray(raw.verses)){
rows.push(...raw.verses);
}

if(raw && Array.isArray(raw.data)){
rows.push(...raw.data);
}

if(raw && Array.isArray(raw.bible)){
rows.push(...raw.bible);
}

/* 3D Bible array:
[
 [ [verse,verse], [verse,verse] ],
 [ ... ]
]
*/
if(Array.isArray(raw) && raw.some(Array.isArray)){

raw.forEach((bookData,bookIndex)=>{

if(!Array.isArray(bookData))return;

bookData.forEach((chapterData,chapterIndex)=>{

if(!Array.isArray(chapterData))return;

chapterData.forEach((verseData,verseIndex)=>{

let text="";

if(typeof verseData==="string"){
text=verseData;
}

else if(verseData && typeof verseData==="object"){
text=verseData.text||verseData.content||"";
}

if(text.trim()){

rows.push({
book:BOOKS[bookIndex]?.id||"",
chapter:chapterIndex+1,
verse:verseIndex+1,
text:text.trim()
});

}

});

});

});

}

return rows.map(item=>({

book:normalizeBookId(
item.book ??
item.bookId ??
item.book_id ??
item.abbrev ??
item.bookCode ??
""
),

chapter:Number(
item.chapter ??
item.chapterNumber ??
item.chapter_number ??
0
),

verse:Number(
item.verse ??
item.verseNumber ??
item.verse_number ??
0
),

text:String(
item.text ??
item.verseText ??
item.content ??
""
).trim()

})).filter(x=>
x.book &&
Number.isFinite(x.chapter) &&
x.chapter>0 &&
Number.isFinite(x.verse) &&
x.verse>0 &&
x.text
);

}

async function loadBible(){

try{

const response=await fetch(
BIBLE_URL+"?v="+Date.now(),
{cache:"no-store"}
);

if(!response.ok){
throw new Error("HTTP "+response.status);
}

const raw=await response.json();

bibleData=normalizeBible(raw);

if(!bibleData.length){
throw new Error("No verses found");
}

populateBooks();

}catch(error){

console.error("Bible loading error:",error);

chapterHeader.innerHTML=
"<h2>تعذر تحميل نص الكتاب المقدس</h2>";

chapterHeader.style.background=
"linear-gradient(135deg,#7b1e1e,#b33a3a)";

chapter.classList.add("show");

verses.innerHTML=
"<div class='verse'><div class='verse-text'>تأكد من أن bible.json يحتوي على بيانات الآيات في المجلد الرئيسي للمستودع.</div></div>";

}

}

function populateBooks(){

book.innerHTML='<option value="">اختر السفر</option>';

BOOKS
.filter(b=>b.testament===testament.value)
.forEach(b=>{

const option=document.createElement("option");

option.value=b.id;
option.textContent=b.name;

book.appendChild(option);

});

chapterSelect.innerHTML='<option value="">اختر الأصحاح</option>';
chapterSelect.disabled=true;

chapter.classList.remove("show");

currentBook="";
currentChapter=0;

}

function getChapters(bookId){

const chapters=[
...new Set(
bibleData
.filter(row=>normalizeBookId(row.book)===bookId)
.map(row=>Number(row.chapter))
)
].sort((a,b)=>a-b);

return chapters;

}

function populateChapters(){

currentBook=normalizeBookId(book.value);

chapterSelect.innerHTML='<option value="">اختر الأصحاح</option>';

if(!currentBook){

chapterSelect.disabled=true;
chapter.classList.remove("show");
return;

}

const chapters=getChapters(currentBook);

chapters.forEach(number=>{

const option=document.createElement("option");

option.value=number;
option.textContent="الأصحاح "+number;

chapterSelect.appendChild(option);

});

chapterSelect.disabled=chapters.length===0;

if(chapters.length){

chapterSelect.value=String(chapters[0]);
currentChapter=chapters[0];

renderChapter();

}

}

function getVerses(bookId,chapterNumber){

return bibleData
.filter(row=>
normalizeBookId(row.book)===bookId &&
Number(row.chapter)===Number(chapterNumber)
)
.sort((a,b)=>Number(a.verse)-Number(b.verse));

}

function getBookName(id){

return BOOKS.find(b=>b.id===id)?.name||id;

}

function renderChapter(){

const data=getVerses(currentBook,currentChapter);

if(!data.length){

chapter.classList.remove("show");

return;

}

chapter.classList.add("show");

chapterHeader.innerHTML=
`<h2>${getBookName(currentBook)} — الأصحاح ${currentChapter}</h2>`;

verses.innerHTML="";

data.forEach(v=>{

const article=document.createElement("article");
article.className="verse";

const number=document.createElement("span");
number.className="verse-number";
number.textContent=v.verse;

const text=document.createElement("div");
text.className="verse-text";
text.textContent=v.text;

article.appendChild(number);
article.appendChild(text);

verses.appendChild(article);

});

updateNavigation();
updateAudio();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function getNavigationChapters(){

const result=[];

BOOKS.forEach(b=>{

const chapters=getChapters(b.id);

chapters.forEach(ch=>{
result.push({
book:b.id,
chapter:ch,
testament:b.testament
});
});

});

return result;

}

function updateNavigation(){

const all=getNavigationChapters();

const index=all.findIndex(x=>
x.book===currentBook &&
Number(x.chapter)===Number(currentChapter)
);

prevBtn.disabled=index<=0;
nextBtn.disabled=index<0||index>=all.length-1;

}

function moveChapter(direction){

const all=getNavigationChapters();

const index=all.findIndex(x=>
x.book===currentBook &&
Number(x.chapter)===Number(currentChapter)
);

const targetIndex=index+direction;

if(index<0||targetIndex<0||targetIndex>=all.length)return;

const target=all[targetIndex];

if(target.testament!==testament.value){

testament.value=target.testament;
populateBooks();

}

book.value=target.book;
populateChapters();

currentBook=target.book;
currentChapter=target.chapter;

chapterSelect.value=String(target.chapter);

renderChapter();

}

function updateAudio(){

audioPlayer.removeAttribute("src");
audioPlayer.load();

}

testament.addEventListener(
"change",
populateBooks
);

book.addEventListener(
"change",
populateChapters
);

chapterSelect.addEventListener(
"change",
()=>{

const value=Number(chapterSelect.value);

if(!value)return;

currentChapter=value;

renderChapter();

}
);

prevBtn.addEventListener(
"click",
()=>moveChapter(-1)
);

nextBtn.addEventListener(
"click",
()=>moveChapter(1)
);

populateBooks();
loadBible();

</script>

</body>
</html>
