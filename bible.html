<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتاب المقدس | Hope Church NSW</title>

<style>
:root {
    --bg: #06111f;
    --card: #0d2238;
    --card-hover: #143554;
    --gold: #d4af37;
    --gold-light: #f4d76b;
    --text: #f5f7fa;
    --muted: #9eafc1;
    --border: #1d3d5c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #06111f;
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
}

/* HEADER */
header {
    padding: 16px 5%;
    border-bottom: 2px solid var(--gold);
    background: #05101d;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.brand h1 {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
    color: var(--gold-light);
}

.nav-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #000;
    background: var(--gold);
    text-decoration: none;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 8px;
    transition: background 0.2s;
}

.nav-back:hover {
    background: var(--gold-light);
}

/* MAIN CONTENT */
main {
    max-width: 1200px;
    margin: auto;
    padding: 20px 4%;
}

/* BREADCRUMB / NAVIGATION BAR */
.breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
    font-size: 17px;
    color: var(--gold-light);
    flex-wrap: wrap;
}

.breadcrumb span {
    cursor: pointer;
}

.breadcrumb span:hover {
    text-decoration: underline;
    color: #fff;
}

/* TESTAMENTS GRID */
.testaments-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.testament-column {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
}

.testament-title {
    text-align: center;
    color: var(--gold-light);
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--gold);
}

/* BOOKS LIST */
.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
}

.book-btn {
    background: #06111f;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 5px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    transition: all 0.2s;
    font-family: inherit;
}

.book-btn:hover {
    border-color: var(--gold);
    background: var(--card-hover);
    color: var(--gold-light);
}

/* CHAPTERS GRID */
.chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.chapter-btn {
    background: #06111f;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    height: 48px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}

.chapter-btn:hover {
    background: var(--gold);
    color: #000;
}

/* VERSES VIEW */
.verses-container {
    background: var(--card);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 25px;
    line-height: 2.1;
    font-size: 20px;
}

.verse-item {
    margin-bottom: 14px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 8px;
}

.verse-num {
    color: #000;
    font-weight: bold;
    margin-left: 8px;
    font-size: 15px;
    background: var(--gold);
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
}

/* LOADING STATE */
.loading-box {
    text-align: center;
    padding: 50px;
    font-size: 20px;
    color: var(--gold-light);
}

@media(max-width: 768px) {
    .testaments-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
 
<body>
 
<header>
    <div class="header-inner">
        <div class="brand" onclick="showBooks()">
            <h1>⛪ كنيسة رجاء الأمم سيدني</h1>
        </div>
        <a href="index.html" class="nav-back">🏠 الرئيسية</a>
    </div>
</header>
 
<main>
    <div class="breadcrumb" id="breadcrumb">
        <span onclick="showBooks()">📖 الكتاب المقدس</span>
    </div>

    <div id="mainView">
        <div class="loading-box" id="loadingText">
            ⏳ جاري تحميل الكتاب المقدس...
        </div>
    </div>
</main>

<script>
// قائمة أسماء الأسفار الـ 66 بالعربية
const arabicBookNames = [
    // العهد القديم (39)
    "التكوين", "الخروج", "اللاويين", "العدد", "التثنية", "يشوع", "القضاة", "راعوث", 
    "صموئيل الأول", "صموئيل الثاني", "الملوك الأول", "الملوك الثاني", "أخبار الأيام الأول", "أخبار الأيام الثاني", 
    "عزرا", "نحميا", "أستير", "أيوب", "المزامير", "الأمثال", "الجامعة", "نشيد الأنشاد", 
    "إشعياء", "إرميا", "مراثي إرميا", "حزقيال", "دانيال", "هوشع", "يوئيل", "عاموس", 
    "عوبديا", "يونان", "ميخا", "ناحوم", "حبقوق", "صفنيا", "حجي", "زكريا", "ملاخي",
    // العهد الجديد (27)
    "متى", "مرقس", "لوقا", "يوحنا", "أعمال الرسل", "رومية", "كورنثوس الأولى", "كورنثوس الثانية", 
    "غلاطية", "أفسس", "فيلبي", "كولوسي", "تسالونيكي الأولى", "تسالونيكي الثانية", "تيموثاوس الأولى", 
    "تيموثاوس الثانية", "تيطس", "فليمون", "العبرانيين", "يعقوب", "بطرس الأولى", "بطرس الثانية", 
    "يوحنا الأولى", "يوحنا الثانية", "يوحنا الثالثة", "يهوذا", "رؤيا يوحنا"
];

let processedBible = [];
let currentBookIndex = null;
let currentChapterIndex = null;

// تفكيك أسطر السفر من bible.json إلى أصحاحات وآيات
function parseBookContent(contentArray) {
    let chapters = [];
    let currentChapter = null;

    if (!Array.isArray(contentArray)) return [];

    contentArray.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // فحص بداية الأصحاح
        if (trimmed.startsWith("الأصحَاحُ") || trimmed.startsWith("الأصْحَاحُ") || trimmed.startsWith("اصحاح") || trimmed.startsWith("الأصحاح")) {
            if (currentChapter) {
                chapters.push(currentChapter);
            }
            currentChapter = {
                title: trimmed,
                verses: []
            };
        } else if (currentChapter) {
            // تفكيك الآيات بناءً على أرقامها
            const rawParts = trimmed.split(/(?=\d+)/);
            rawParts.forEach(part => {
                const p = part.trim();
                if (!p) return;
                
                const match = p.match(/^(\d+)(.*)/);
                if (match) {
                    currentChapter.verses.push({
                        number: match[1],
                        text: match[2].trim()
                    });
                } else if (currentChapter.verses.length > 0) {
                    currentChapter.verses[currentChapter.verses.length - 1].text += " " + p;
                }
            });
        }
    });

    if (currentChapter) {
        chapters.push(currentChapter);
    }

    return chapters;
}

// قراءة تحميل الملف
async function loadBible() {
    try {
        const response = await fetch('bible.json');
        if (!response.ok) throw new Error("تعذر فتح ملف البيانات");
        
        const rawData = await response.json();

        processedBible = arabicBookNames.map((arabicName, idx) => {
            const bookObj = rawData[idx] || {};
            const content = bookObj.content || [];
            
            return {
                name: arabicName,
                chapters: parseBookContent(content)
            };
        });

        showBooks();
    } catch (error) {
        console.error(error);
        document.getElementById('mainView').innerHTML = `
            <div style="text-align:center; color:#ff6b6b; padding:40px; font-size:18px;">
                ⚠️ تعذر تحميل ملف الكتاب المقدس (bible.json). يرجى التأكد من وجود الملف بنفس المجلد.
            </div>`;
    }
}

// 1. عرض العهدين والأسفار
function showBooks() {
    currentBookIndex = null;
    currentChapterIndex = null;
    updateBreadcrumb();

    const otBooks = processedBible.slice(0, 39);
    const ntBooks = processedBible.slice(39);

    let html = `
    <div class="testaments-container">
        <div class="testament-column">
            <h2 class="testament-title">📜 العهد القديم</h2>
            <div class="books-grid">
                ${otBooks.map((book, idx) => `
                    <button class="book-btn" onclick="selectBook(${idx})">${book.name}</button>
                `).join('')}
            </div>
        </div>

        <div class="testament-column">
            <h2 class="testament-title">✝️ العهد الجديد</h2>
            <div class="books-grid">
                ${ntBooks.map((book, idx) => `
                    <button class="book-btn" onclick="selectBook(${idx + 39})">${book.name}</button>
                `).join('')}
            </div>
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// 2. عرض أصحاحات السفر المختار
function selectBook(bookIndex) {
    currentBookIndex = bookIndex;
    currentChapterIndex = null;
    updateBreadcrumb();

    const book = processedBible[bookIndex];
    const chapters = book.chapters;

    let html = `
    <div class="testament-column">
        <h2 class="testament-title">${book.name} — اختر الأصحاح</h2>
        <div class="chapters-grid">
            ${chapters.length > 0 ? chapters.map((_, cIdx) => `
                <button class="chapter-btn" onclick="selectChapter(${cIdx})">${cIdx + 1}</button>
            `).join('') : '<p style="text-align:center; width:1
