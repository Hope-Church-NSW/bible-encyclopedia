<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>

:root{
    --blue-950:#03101d;
    --blue-900:#061a2c;
    --blue-800:#082943;
    --blue-700:#0d385d;
    --blue-600:#14527e;

    --gold:#d4af37;
    --gold-light:#f4dc79;
    --gold-dark:#806018;

    --white:#f8fbff;
    --muted:#b7c7d6;

    --border:rgba(212,175,55,.34);
    --shadow:0 22px 55px rgba(0,0,0,.52);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    color:var(--white);

    font-family:
        "Noto Naskh Arabic",
        "Amiri",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 5%,
            rgba(20,82,126,.75),
            transparent 42%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(13,56,93,.35),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            var(--blue-950),
            var(--blue-900) 48%,
            #020911
        );
}


/* =====================================================
   HEADER
===================================================== */

.top-frame{
    position:relative;
    z-index:100;

    width:100%;

    border-bottom:
        1px solid
        rgba(212,175,55,.30);

    background:
        linear-gradient(
            180deg,
            rgba(8,41,67,.98),
            rgba(3,16,29,.98)
        );

    box-shadow:
        0 10px 35px rgba(0,0,0,.55),
        inset 0 -1px 0 rgba(255,255,255,.04);
}

.topbar{
    max-width:1450px;
    min-height:95px;

    margin:auto;
    padding:10px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}


/* =====================================================
   BRAND
===================================================== */

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-logo{
    width:70px;
    height:70px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 7px 8px
            rgba(0,0,0,.85)
        );

    animation:
        logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,100%{
        transform:
            translateY(0)
            rotateY(0deg);
    }

    50%{
        transform:
            translateY(-4px)
            rotateY(8deg);
    }
}

.brand-name{
    font-size:22px;
    font-weight:900;

    white-space:nowrap;

    background:
        linear-gradient(
            180deg,
            #fff6bf 0%,
            var(--gold-light) 30%,
            var(--gold) 65%,
            var(--gold-dark) 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 3px 5px
        rgba(0,0,0,.9);
}


/* =====================================================
   HOME
===================================================== */

.home-button{

    min-width:135px;
    height:58px;

    padding:
        0 16px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    border:
        1px solid
        rgba(212,175,55,.65);

    border-radius:16px;

    color:#fff;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            #16476d,
            #061a2d
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.12),

        0 8px 22px
        rgba(0,0,0,.48);

    font-family:inherit;

    font-size:18px;

    font-weight:900;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.home-icon{
    font-size:28px;
    line-height:1;
}

.home-text{
    color:#fff;
    white-space:nowrap;
}

.home-button:hover{

    transform:
        translateY(-4px)
        scale(1.03);

    border-color:
        var(--gold-light);

    box-shadow:

        0 13px 28px
        rgba(0,0,0,.55),

        0 0 20px
        rgba(212,175,55,.16);
}

.home-button:active{

    transform:
        translateY(0)
        scale(.98);
}


/* =====================================================
   MAIN
===================================================== */

main{
    max-width:1100px;

    margin:auto;

    padding:
        45px 20px 70px;
}


/* =====================================================
   SEARCH PANEL
===================================================== */

.search-panel{

    margin-bottom:25px;

    padding:25px;

    border:
        1px solid
        rgba(212,175,55,.42);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.98),
            rgba(4,23,39,.99)
        );

    box-shadow:
        var(--shadow);
}

.search-title{

    margin-bottom:15px;

    color:var(--gold-light);

    font-size:23px;

    font-weight:900;

    text-align:right;
}

.search-subtitle{

    margin-bottom:18px;

    color:var(--muted);

    font-size:14px;

    line-height:1.8;
}

.search-row{

    display:flex;

    align-items:stretch;

    gap:10px;
}

.search-input{

    flex:1;

    min-width:0;

    min-height:55px;

    padding:
        10px 17px;

    border:
        1px solid
        rgba(212,175,55,.48);

    border-radius:14px;

    outline:none;

    color:#fff;

    background:
        rgba(3,16,29,.78);

    font-family:inherit;

    font-size:18px;

    font-weight:700;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.search-input::placeholder{

    color:#8297aa;
}

.search-input:focus{

    border-color:
        var(--gold-light);

    background:
        rgba(3,16,29,.95);

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}

.search-button{

    min-width:130px;

    padding:
        0 20px;

    border:
        1px solid
        rgba(212,175,55,.72);

    border-radius:14px;

    color:#071526;

    background:
        linear-gradient(
            145deg,
            #fff1a2,
            var(--gold),
            var(--gold-dark)
        );

    font-family:inherit;

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.42);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.search-button:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 13px 28px
        rgba(0,0,0,.55);
}

.search-button:active{

    transform:
        translateY(0)
        scale(.98);
}

.search-help{

    margin-top:12px;

    color:#91a6b9;

    font-size:13px;

    line-height:1.8;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

.search-results{

    margin-top:22px;

    display:none;
}

.search-results.active{

    display:block;
}

.search-results-header{

    margin-bottom:14px;

    padding:
        13px 16px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:13px;

    color:var(--gold-light);

    background:
        rgba(3,16,29,.52);

    font-size:16px;

    font-weight:900;
}

.search-result{

    width:100%;

    margin-bottom:10px;

    padding:
        15px 17px;

    text-align:right;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:15px;

    color:#fff;

    background:
        rgba(8,41,67,.48);

    cursor:pointer;

    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.search-result:hover{

    transform:
        translateX(-4px);

    border-color:
        rgba(212,175,55,.45);

    background:
        rgba(13,56,93,.72);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.30);
}

.search-result-reference{

    margin-bottom:7px;

    color:
        var(--gold-light);

    font-size:16px;

    font-weight:900;
}

.search-result-text{

    color:#e5edf4;

    font-size:17px;

    line-height:1.9;
}

.search-result-text mark{

    padding:
        1px 4px;

    border-radius:4px;

    color:#071526;

    background:
        var(--gold-light);

    font-weight:900;
}

.search-empty{

    padding:30px 20px;

    text-align:center;

    border:
        1px solid
        rgba(212,175,55,.22);

    border-radius:16px;

    color:var(--muted);

    background:
        rgba(3,16,29,.45);

    line-height:2;
}


/* =====================================================
   BIBLE CONTROL PANEL
===================================================== */

.bible-panel{

    padding:25px;

    margin-bottom:30px;

    border:
        1px solid
        rgba(212,175,55,.32);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.96),
            rgba(4,23,39,.98)
        );

    box-shadow:
        var(--shadow);
}

.select-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;
}

.select-box{

    display:flex;

    flex-direction:column;

    gap:8px;
}

.select-box label{

    color:
        var(--gold-light);

    font-size:16px;

    font-weight:900;
}

select{

    width:100%;

    min-height:52px;

    padding:
        10px 15px;

    border:
        1px solid
        rgba(212,175,55,.45);

    border-radius:13px;

    outline:none;

    color:#fff;

    background:#082943;

    font-family:inherit;

    font-size:17px;

    font-weight:700;

    cursor:pointer;
}

select:focus{

    border-color:
        var(--gold-light);

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}

select:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =====================================================
   STATUS
===================================================== */

#status{

    margin-top:18px;

    min-height:25px;

    text-align:center;

    color:var(--muted);

    font-size:15px;
}


/* =====================================================
   CONTENT
===================================================== */

#content{
    width:100%;
}

.chapter-title{

    margin-bottom:22px;

    padding:20px;

    text-align:center;

    border:
        1px solid
        rgba(212,175,55,.42);

    border-radius:20px;

    color:var(--gold-light);

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.98),
            rgba(4,23,39,.99)
        );

    box-shadow:
        0 14px 35px
        rgba(0,0,0,.45);

    font-size:
        clamp(25px,4vw,36px);

    font-weight:900;
}


/* =====================================================
   VERSES
===================================================== */

.verse{

    display:flex;

    align-items:flex-start;

    gap:15px;

    margin-bottom:10px;

    padding:
        14px 15px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.055);

    background:
        rgba(8,41,67,.40);

    transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
}

.verse:hover{

    transform:
        translateX(-3px);

    border-color:
        rgba(212,175,55,.28);

    background:
        rgba(13,56,93,.62);
}

.verse.highlighted{

    border-color:
        var(--gold-light);

    background:
        rgba(212,175,55,.13);

    box-shadow:
        0 0 25px
        rgba(212,175,55,.12);

    animation:
        verseHighlight 1.4s ease;
}

@keyframes verseHighlight{

    0%{
        transform:scale(1.01);
    }

    100%{
        transform:scale(1);
    }
}

.vnum{

    flex:0 0 auto;

    min-width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    color:#071526;

    background:
        linear-gradient(
            180deg,
            #fff1a2,
            var(--gold),
            var(--gold-dark)
        );

    font-size:14px;
    font-weight:900;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.35);
}

.vtext{

    flex:1;

    color:#e6eef5;

    font-size:
        clamp(18px,2vw,22px);

    line-height:2;

    text-align:right;
}


/* =====================================================
   AUDIO
===================================================== */

.audio-bible{

    width:100%;

    margin:
        40px auto 10px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.audio-bible-button{

    width:78px;
    height:78px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(212,175,55,.75);

    border-radius:50%;

    color:#071526;

    background:
        linear-gradient(
            145deg,
            #fff1a2,
            var(--gold),
            var(--gold-dark)
        );

    box-shadow:

        0 12px 28px
        rgba(0,0,0,.50),

        0 0 20px
        rgba(212,175,55,.10);

    font-size:34px;

    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.audio-bible-button:hover{

    transform:
        translateY(-5px)
        scale(1.06);

    box-shadow:

        0 18px 35px
        rgba(0,0,0,.60),

        0 0 30px
        rgba(212,175,55,.20);
}

.audio-bible-button:active{

    transform:
        scale(.96);
}

.audio-bible-title{

    margin-top:12px;

    color:
        var(--gold-light);

    font-size:16px;

    font-weight:900;
}

.audio-bible-note{

    margin-top:4px;

    color:#8195a8;

    font-size:12px;
}


/* =====================================================
   PREVIOUS / NEXT
===================================================== */

.chapter-navigation{

    width:100%;

    margin:
        38px auto 10px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;

    direction:rtl;
}

.chapter-nav-button{

    min-height:72px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    padding:
        14px 18px;

    border:
        1px solid
        rgba(212,175,55,.55);

    border-radius:18px;

    color:#fff;

    font-family:inherit;

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            145deg,
            #164d77,
            #061b2d
        );

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.08);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.chapter-nav-button:hover:not(:disabled){

    transform:
        translateY(-4px);

    border-color:
        var(--gold-light);

    box-shadow:

        0 15px 30px
        rgba(0,0,0,.58),

        0 0 18px
        rgba(212,175,55,.16);
}

.chapter-nav-button:disabled{

    opacity:.35;

    cursor:not-allowed;

    filter:
        grayscale(.5);
}

.nav-arrow{

    color:
        var(--gold-light);

    font-size:25px;

    font-weight:900;

    line-height:1;
}


/* =====================================================
   ERROR
===================================================== */

.error{

    padding:25px;

    text-align:center;

    border:
        1px solid
        rgba(255,90,90,.35);

    border-radius:18px;

    color:#ffb5b5;

    background:
        rgba(120,20,20,.18);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .topbar{

        min-height:80px;

        padding:
            8px 12px;
    }

    .brand{
        gap:7px;
    }

    .brand-logo{

        width:52px;
        height:52px;
    }

    .brand-name{
        font-size:14px;
    }

    .home-button{

        min-width:105px;

        height:50px;

        padding:
            0 12px;

        gap:7px;

        font-size:15px;

        border-radius:14px;
    }

    .home-icon{
        font-size:24px;
    }

    main{

        padding:
            30px 12px 50px;
    }

    .search-panel{

        padding:16px;

        border-radius:18px;
    }

    .search-title{

        font-size:20px;
    }

    .search-row{

        flex-direction:column;

        gap:10px;
    }

    .search-button{

        min-height:50px;

        width:100%;
    }

    .search-input{

        min-height:50px;

        font-size:16px;
    }

    .bible-panel{

        padding:16px;

        border-radius:18px;
    }

    .select-grid{

        grid-template-columns:1fr;

        gap:12px;
    }

    select{

        min-height:48px;

        font-size:16px;
    }

    .verse{

        gap:10px;

        padding:
            11px 9px;
    }

    .vnum{

        min-width:32px;

        height:32px;

        font-size:13px;
    }

    .vtext{

        font-size:18px;

        line-height:2;
    }

    .audio-bible{
        margin-top:35px;
    }

    .audio-bible-button{

        width:70px;
        height:70px;

        font-size:30px;
    }

    .chapter-navigation{

        grid-template-columns:1fr;

        gap:12px;

        margin-top:30px;
    }

    .chapter-nav-button{

        min-height:62px;

        font-size:15px;
    }

}

@media(max-width:420px){

    .brand-name{
        font-size:12px;
    }

    .brand-logo{

        width:46px;
        height:46px;
    }

    .home-button{

        min-width:95px;

        width:auto;

        height:46px;

        padding:
            0 10px;

        font-size:13px;
    }

    .home-icon{
        font-size:22px;
    }

    .chapter-title{

        font-size:24px;

        padding:16px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-frame">

    <div class="topbar">


        <a
            href="index.html"
            class="home-button"
            title="الرئيسية"
            aria-label="الرئيسية"
        >

            <span class="home-icon">
                🏠
            </span>

            <span
                class="home-text"
                id="homeText"
            >
                الرئيسية
            </span>

        </a>


        <div class="brand">

            <div class="brand-name">

                <span id="churchName">
                    كنيسة رجاء الأمم سيدني
                </span>

            </div>

            <img
                src="assets/logo.png"
                class="brand-logo"
                alt="كنيسة رجاء الأمم سيدني"
            >

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         SEARCH
    ================================================= -->

    <section class="search-panel">

        <div class="search-title">
            البحث في الكتاب المقدس
        </div>

        <div class="search-subtitle">
            ابحث عن كلمة أو عبارة أو مرجع كتابي للوصول مباشرة إلى الآية.
        </div>

        <div class="search-row">

            <input
                type="search"
                id="bibleSearch"
                class="search-input"
                placeholder="مثال: المحبة — يوحنا 3:16 — رومية 8:28"
                autocomplete="off"
                spellcheck="false"
                aria-label="البحث في الكتاب المقدس"
            >

            <button
                type="button"
                id="searchButton"
                class="search-button"
            >
                🔎 بحث
            </button>

        </div>

        <div class="search-help">
            يمكنك البحث بكلمة أو عبارة، أو بمرجع مثل
            <strong>يوحنا 3:16</strong>
            أو
            <strong>يوحنا 3 16</strong>.
        </div>

        <div
            id="searchResults"
            class="search-results"
        ></div>

    </section>


    <!-- =================================================
         BIBLE SELECTORS
    ================================================= -->

    <section class="bible-panel">

        <div class="select-grid">


            <div class="select-box">

                <label for="book">
                    السفر
                </label>

                <select id="book">

                    <option value="">
                        جاري تحميل الأسفار...
                    </option>

                </select>

            </div>


            <div class="select-box">

                <label for="chapter">
                    الأصحاح
                </label>

                <select
                    id="chapter"
                    disabled
                >

                    <option value="">
                        اختر السفر أولًا
                    </option>

                </select>

            </div>

        </div>


        <div id="status">
            جاري تحميل الكتاب المقدس...
        </div>

    </section>


    <section id="content"></section>


</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const DATA_URL =
            "./bible.json";


        /* =================================================
           ترتيب الأسفار
        ================================================= */

        const ARABIC_BOOKS = [

            "التكوين",
            "الخروج",
            "اللاويين",
            "العدد",
            "التثنية",
            "يشوع",
            "القضاة",
            "راعوث",
            "صموئيل الأول",
            "صموئيل الثاني",
            "ملوك الأول",
            "ملوك الثاني",
            "أخبار الأيام الأول",
            "أخبار الأيام الثاني",
            "عزرا",
            "نحميا",
            "أستير",
            "أيوب",
            "المزامير",
            "الأمثال",
            "الجامعة",
            "نشيد الأنشاد",

        /* =================================================
           حماية HTML
        ================================================= */

        function escapeHTML(value){

            return String(value ?? "")

                .replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;")
                .replace(/'/g,"&#039;");

        }


        /* =================================================
           تطبيع النص العربي للبحث
        ================================================= */

        function normalizeArabic(value){

            return String(value ?? "")

                .toLowerCase()

                /* إزالة التشكيل */

                .replace(
                    /[\u064B-\u065F\u0670]/g,
                    ""
                )

                /* توحيد الهمزات */

                .replace(/[إأآٱ]/g,"ا")

                .replace(/ى/g,"ي")

                .replace(/ؤ/g,"و")

                .replace(/ئ/g,"ي")

                /* إزالة التطويل */

                .replace(/ـ/g,"")

                /* مسافات زائدة */

                .replace(/\s+/g," ")

                .trim();

        }


        /* =================================================
           تطبيع الأرقام
        ================================================= */

        function normalizeDigits(value){

            return String(value ?? "")

                .replace(
                    /[٠-٩]/g,
                    digit =>
                        String(
                            "٠١٢٣٤٥٦٧٨٩"
                            .indexOf(digit)
                        )
                )

                .replace(
                    /[۰-۹]/g,
                    digit =>
                        String(
                            "۰۱۲۳۴۵۶۷۸۹"
                            .indexOf(digit)
                        )
                );

        }


        /* =================================================
           رقم السفر
        ================================================= */

        function getBookNumber(book){

            const text =
                String(book ?? "")
                .trim();

            const match =
                text.match(/^0*(\d+)\s*-/);

            if(match){

                return Number(
                    match[1]
                );
            }

            return 999;
        }


        /* =================================================
           اسم السفر العربي
        ================================================= */

        function getArabicBookName(book){

            const number =
                getBookNumber(book);

            return (
                ARABIC_BOOKS[number - 1]
                ||
                String(book)
            );
        }


        /* =================================================
           العهد القديم
        ================================================= */

        function isOldTestament(book){

            return (
                getBookNumber(book)
                <= OLD_COUNT
            );
        }


        /* =================================================
           البحث عن اسم السفر
        ================================================= */

        function findBookByArabicName(
            name
        ){

            const normalized =
                normalizeArabic(name);


            return bibleBooks().find(
                book =>

                    normalizeArabic(
                        getArabicBookName(book)
                    ) === normalized

            ) || null;

        }


        /* =================================================
           جميع الأسفار الموجودة فعليًا
        ================================================= */

        function bibleBooks(){

            return [

                ...new Set(
                    bible.map(
                        item =>
                            item.book
                    )
                )

            ].sort(
                (a,b) =>
                    getBookNumber(a)
                    -
                    getBookNumber(b)
            );

        }


        /* =================================================
           تحميل الكتاب المقدس
        ================================================= */

        async function loadBible(){

            try{

                status.textContent =
                    "جاري تحميل قاعدة بيانات الكتاب المقدس...";


                const response =
                    await fetch(
                        DATA_URL +
                        "?v=" +
                        Date.now(),
                        {
                            cache:"no-store"
                        }
                    );


                if(!response.ok){

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if(!Array.isArray(data)){

                    throw new Error(
                        "bible.json must be an array."
                    );

                }


                bible =

                    data

                    .filter(item =>
                        item &&
                        item.book !== undefined &&
                        item.chapter !== undefined &&
                        item.verse !== undefined &&
                        item.text !== undefined
                    )

                    .map(item => ({

                        book:
                            String(
                                item.book
                            ).trim(),

                        chapter:
                            Number(
                                item.chapter
                            ),

                        verse:
                            Number(
                                item.verse
                            ),

                        text:
                            String(
                                item.text
                            )

                    }))

                    .filter(item =>
                        item.book &&
                        Number.isFinite(
                            item.chapter
                        ) &&
                        Number.isFinite(
                            item.verse
                        )
                    );


                bible.sort(
                    (a,b) => {

                        const bookDiff =
                            getBookNumber(a.book)
                            -
                            getBookNumber(b.book);


                        if(bookDiff !== 0){

                            return bookDiff;

                        }


                        if(
                            a.chapter !==
                            b.chapter
                        ){

                            return (
                                a.chapter -
                                b.chapter
                            );

                        }


                        return (
                            a.verse -
                            b.verse
                        );

                    }
                );


                if(!bible.length){

                    throw new Error(
                        "No Bible verses found."
                    );

                }


                buildBooks();


                status.textContent =
                    "تم تحميل " +
                    bible.length.toLocaleString(
                        "ar-EG"
                    ) +
                    " آية.";

            }
            catch(error){

                console.error(
                    "Bible loading failed:",
                    error
                );


                status.innerHTML =
                    "❌ تعذر تحميل الكتاب المقدس.<br>" +
                    "<small>" +
                    escapeHTML(
                        error.message
                    ) +
                    "</small>";

            }

        }


        /* =================================================
           بناء قائمة الأسفار
        ================================================= */

        function buildBooks(){

            const oldBooks = [];
            const newBooks = [];

            const seen =
                new Set();


            bible.forEach(item => {

                if(
                    seen.has(item.book)
                ){

                    return;

                }


                seen.add(
                    item.book
                );


                if(
                    isOldTestament(
                        item.book
                    )
                ){

                    oldBooks.push(
                        item.book
                    );

                }
                else{

                    newBooks.push(
                        item.book
                    );

                }

            });


            oldBooks.sort(
                (a,b) =>
                    getBookNumber(a)
                    -
                    getBookNumber(b)
            );


            newBooks.sort(
                (a,b) =>
                    getBookNumber(a)
                    -
                    getBookNumber(b)
            );


            bookSelect.innerHTML =
                '<option value="">اختر السفر</option>';


            const oldGroup =
                document.createElement(
                    "optgroup"
                );

            oldGroup.label =
                "العهد القديم";


            oldBooks.forEach(book => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    book;

                option.textContent =
                    getArabicBookName(
                        book
                    );

                oldGroup.appendChild(
                    option
                );

            });


            bookSelect.appendChild(
                oldGroup
            );


            const newGroup =
                document.createElement(
                    "optgroup"
                );

            newGroup.label =
                "العهد الجديد";


            newBooks.forEach(book => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    book;

                option.textContent =
                    getArabicBookName(
                        book
                    );

                newGroup.appendChild(
                    option
                );

            });


            bookSelect.appendChild(
                newGroup
            );


            const genesis =
                oldBooks.find(
                    book =>
                        getBookNumber(book)
                        === 1
                );


            if(genesis){

                bookSelect.value =
                    genesis;

                buildChapters();

            }

        }


        /* =================================================
           بناء الأصحاحات
        ================================================= */

        function buildChapters(){

            const selectedBook =
                bookSelect.value;


            chapterSelect.innerHTML =
                '<option value="">اختر الأصحاح</option>';


            if(!selectedBook){

                chapterSelect.disabled =
                    true;

                content.innerHTML =
                    "";

                return;

            }


            const chapters = [

                ...new Set(

                    bible

                    .filter(item =>
                        item.book ===
                        selectedBook
                    )

                    .map(item =>
                        item.chapter
                    )

                )

            ].sort(
                (a,b) => a-b
            );


            chapters.forEach(chapter => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    chapter;

                option.textContent =
                    "الأصحاح " +
                    chapter;

                chapterSelect.appendChild(
                    option
                );

            });


            chapterSelect.disabled =
                chapters.length === 0;


            if(chapters.length){

                chapterSelect.value =
                    chapters[0];

                renderChapter();

            }

        }


        /* =================================================
           جميع الأصحاحات
        ================================================= */

        function getAllChapters(){

            const result = [];


            bibleBooks()
                .forEach(book => {

                    const chapters = [

                        ...new Set(

                            bible

                            .filter(item =>
                                item.book ===
                                book
                            )

                            .map(item =>
                                item.chapter
                            )

                        )

                    ].sort(
                        (a,b) => a-b
                    );


                    chapters.forEach(
                        chapter => {

                            result.push({

                                book:
                                    book,

                                chapter:
                                    chapter

                            });

                        }
                    );

                });


            return result;

        }


        /* =================================================
           الانتقال إلى الأصحاح
        ================================================= */

        function goToChapter(
            book,
            chapter,
            verseNumber = null
        ){

            bookSelect.value =
                book;

            buildChapters();

            chapterSelect.value =
                String(chapter);

            renderChapter();


            window.scrollTo({

                top:0,

                behavior:"smooth"

            });


            if(verseNumber){

                setTimeout(
                    function(){

                        highlightVerse(
                            verseNumber
                        );

                    },
                    120
                );

            }

        }


        /* =================================================
           تحديد آية داخل الصفحة
        ================================================= */

        function highlightVerse(
            verseNumber
        ){

            const verses =
                document.querySelectorAll(
                    ".verse"
                );


            let target = null;


            verses.forEach(
                verse => {

                    const number =
                        Number(
                            verse.dataset.verse
                        );


                    if(
                        number ===
                        Number(
                            verseNumber
                        )
                    ){

                        target =
                            verse;

                    }

                }
            );


            if(!target){

                return;

            }


            target.classList.add(
                "highlighted"
            );


            target.scrollIntoView({

                behavior:"smooth",

                block:"center"

            });


            setTimeout(
                function(){

                    target.classList.remove(
                        "highlighted"
                    );

                },
                2500
            );

        }


        /* =================================================
           بناء أزرار السابق والتالي
        ================================================= */

        function buildChapterNavigation(
            currentBook,
            currentChapter

            const chapters =
                getAllChapters();


            const currentIndex =
                chapters.findIndex(
                    item =>

                        item.book ===
                        currentBook &&

                        item.chapter ===
                        currentChapter
                );


            const previous =
                currentIndex > 0
                    ?
                    chapters[
                        currentIndex - 1
                    ]
                    :
                    null;


            const next =
                currentIndex <
                chapters.length - 1
                    ?
                    chapters[
                        currentIndex + 1
                    ]
                    :
                    null;


            return `

                    <button
                        type="button"
                        class="audio-bible-button"

                                ?
                                " — " +
                                escapeHTML(
                                    getArabicBookName(
                                        previous.book
                                    )
                                ) +
                                " " +
                                previous.chapter
                                :
                                ""
                            }

                        </span>

                    </button>


                    <button
                        type="button"
                        class="chapter-nav-button"
                        id="nextChapterButton"
                        ${next ? "" : "disabled"}

                        <span>

                                    getArabicBookName(

        /* =================================================
           عرض الأصحاح
        ================================================= */

                bookSelect.value;

                Number(
                    chapterSelect.value
                );


            if(
                !book ||
                !chapter
            ){

                content.innerHTML =
                    "";

                return;

            }


            const verses =
                bible.filter(item =>

                    item.book ===
                    book &&

                    item.chapter ===
                    chapter

            if(!verses.length){

                content.innerHTML =
                    `
                    <div class="error">
                        لا توجد آيات لهذا الأصحاح.
                    </div>
                    `;

                return;

            }


            content.innerHTML =

                `

                <div class="chapter-title">

                    ${escapeHTML(
                        getArabicBookName(
                            book
                        )
                    )}

                verses.map(item => `

                    <div
                        class="verse"
                        data-book="${escapeHTML(item.book)}"
                        data-chapter="${item.chapter}"
                        data-verse="${item.verse}"
                    >

                        <span class="vnum">

                        </span>

                        <span class="vtext">
                            ${escapeHTML(
                                item.text
                            )}
                        </span>

                    </div>

                `).join("")

                +

                    book,
                    chapter
                );


            const chapters =
                getAllChapters();


            const currentIndex =
                chapters.findIndex(
                    item =>

                        item.book ===
                        book &&

                        item.chapter ===
                        chapter
                );


            const previous =
                currentIndex > 0
                    ?
                    chapters[
                        currentIndex - 1
                    ]
                    :
                    null;


            const next =
                currentIndex <

                    ?
                    chapters[

                    ]

        /* =================================================
           تحليل المرجع الكتابي
        ================================================= */

        function parseReference(
            query
        ){

            const normalizedQuery =
                normalizeDigits(
                    normalizeArabic(
                        query
                    )
                );


            /*
               أمثلة مقبولة:

               يوحنا 3:16
               يوحنا 3 16
               يوحنا 3
               3:16 مع اختيار السفر
            */


            const match =
                normalizedQuery.match(
                    /^(.+?)\s+(\d+)(?:\s*[:：]\s*(\d+))?$/
                );


            if(!match){

                return null;

            }


            const bookName =
                match[1].trim();


            const chapter =
                Number(
                    match[2]
                );


            const verse =
                match[3]
                ?
                Number(
                    match[3]
                )
                :
                null;


            const book =
                findBookByArabicName(
                    bookName
                );


            if(!book){

                return null;

            }


            return {

                book:
                    book,

                chapter:
                    chapter,

                verse:
                    verse

            };

        }


        /* =================================================
           تحليل مرجع بدون اسم السفر
        ================================================= */

        function parseChapterVerseOnly(
            query
        ){

            const normalized =
                normalizeDigits(
                    normalizeArabic(
                        query
                    )
                );


            const match =
                normalized.match(
                    /^(\d+)\s*[:：]\s*(\d+)$/
                );


            if(!match){

                return null;

            }


            return {

                chapter:
                    Number(
                        match[1]
                    ),

                verse:
                    Number(
                        match[2]
                    )

            };

        }


        /* =================================================
           تمييز كلمة البحث داخل النتيجة
        ================================================= */

        function highlightSearchText(
            text,
            query
        ){

            const safeText =
                escapeHTML(text);


            const cleanQuery =
                normalizeArabic(
                    query
                );


            if(!cleanQuery){

                return safeText;

            }


            const words =
                cleanQuery
                .split(/\s+/)
                .filter(Boolean);


            if(!words.length){

                return safeText;

            }


            /*
               لا نستخدم innerHTML للنص الأصلي.
               يتم أولًا تحويله إلى HTML آمن،
               ثم نضيف mark للكلمات المطابقة.
            */

            let result =
                safeText;


            words.forEach(
                word => {

                    if(word.length < 2){

                        return;

                    }


                    const escapedWord =
                        word.replace(
                            /[.*+?^${}()|[\]\\]/g,
                            "\\$&"
                        );


                    try{

                        result =
                            result.replace(
                                new RegExp(
                                    escapedWord,
                                    "gi"
                                ),
                                match =>
                                    "<mark>" +
                                    match +
                                    "</mark>"
                            );

                    }
                    catch(error){

                        console.warn(
                            "Highlight error:",
                            error
                        );

                    }

                }
            );


            return result;

        }


        /* =================================================
           تنفيذ البحث
        ================================================= */

        function performSearch(){

            const rawQuery =
                searchInput.value.trim();


            if(!rawQuery){

                searchResults.classList.remove(
                    "active"
                );

                searchResults.innerHTML =
                    "";

                return;

            }


            searchResults.classList.add(
                "active"
            );


            /*
               أولًا:
               البحث كمرجع كتابي كامل.
            */

            let reference =
                parseReference(
                    rawQuery
                );


            /*
               ثانيًا:
               إذا كان الشكل 3:16 فقط،
               نستخدم السفر المحدد حاليًا.
            */

            if(!reference){

                const shortReference =
                    parseChapterVerseOnly(
                        rawQuery
                    );


                if(
                    shortReference &&
                    bookSelect.value
                ){

                    reference = {

                        book:
                            bookSelect.value,

                        chapter:
                            shortReference.chapter,

                        verse:
                            shortReference.verse

                    };

                }

            }


            /*
               إذا كان مرجعًا:
               نذهب مباشرة إلى الآية.
            */

            if(reference){

                const matches =
                    bible.filter(item =>

                        item.book ===
                        reference.book &&

                        item.chapter ===
                        reference.chapter &&

                        (
                            reference.verse ===
                            null
                            ||
                            item.verse ===
                            reference.verse
                        )

                    );


                if(matches.length){

                    renderSearchResults(
                        matches,
                        rawQuery,
                        true
                    );

                    return;

                }

            }


            /*
               إذا لم يكن مرجعًا،
               نبحث في النص.
            */

            const normalizedQuery =
                normalizeArabic(
                    rawQuery
                );


            const searchWords =
                normalizedQuery
                .split(/\s+/)
                .filter(
                    word =>
                        word.length > 0
                );


            if(!searchWords.length){

                searchResults.innerHTML =
                    "";

                return;

            }


            const matches =
                bible.filter(item => {

                    const normalizedText =
                        normalizeArabic(
                            item.text
                        );


                    /*
                       البحث AND:
                       كل الكلمات يجب أن تكون موجودة
                       في الآية.
                    */

                    return searchWords.every(
                        word =>
                            normalizedText.includes(
                                word
                            )
                    );

                });


            renderSearchResults(
                matches,
                rawQuery,
                false
            );

        }


        /* =================================================
           عرض نتائج البحث
        ================================================= */

        function renderSearchResults(
            matches,
            query,
            isReference
        ){

            /*
               حماية من نتائج ضخمة جدًا.
               الواجهة تعرض أول 100 نتيجة.
            */

            const MAX_RESULTS =
                100;


            const visibleMatches =
                matches.slice(
                    0,
                    MAX_RESULTS
                );


            if(!matches.length){

                searchResults.innerHTML = `

                    <div class="search-results-header">
                        نتائج البحث
                    </div>

                    <div class="search-empty">

                        لم يتم العثور على نتائج
                        مطابقة للبحث:

                        <br>

                        <strong>
                            ${escapeHTML(query)}
                        </strong>

                    </div>

                `;

                return;

            }


            const extraText =
                matches.length >
                MAX_RESULTS
                    ?
                    `
                    <div style="
                        margin-top:10px;
                        color:#9eb0bf;
                        font-size:13px;
                    ">
                        تم العثور على
                        ${matches.length.toLocaleString("ar-EG")}
                        نتيجة، وتم عرض أول
                        ${MAX_RESULTS.toLocaleString("ar-EG")}
                        نتيجة.
                    </div>
                    `
                    :
                    "";


            searchResults.innerHTML = `

                <div class="search-results-header">

                    تم العثور على
                    ${matches.length.toLocaleString("ar-EG")}
                    نتيجة

                    ${
                        isReference
                        ?
                        " لهذا المرجع"
                        :
                        ""
                    }

                    ${extraText}

                </div>

                <div id="searchResultList"></div>

            `;


            const resultList =
                document.getElementById(
                    "searchResultList"
                );


            visibleMatches.forEach(
                item => {

                    const result =
                        document.createElement(
                            "button"
                        );


                    result.type =
                        "button";


                    result.className =
                        "search-result";


                    result.innerHTML = `

                        <div
                            class="search-result-reference"
                        >

                            ${escapeHTML(
                                getArabicBookName(
                                    item.book
                                )
                            )}

                            — الأصحاح
                            ${item.chapter}

                            :${item.verse}

                        </div>

                        <div
                            class="search-result-text"
                        >

                            ${
                                isReference
                                ?
                                escapeHTML(
                                    item.text
                                )
                                :
                                highlightSearchText(
                                    item.text,
                                    query
                                )
                            }

                        </div>

                    `;


                    result.addEventListener(
                        "click",
                        function(){

                            goToChapter(
                                item.book,
                                item.chapter,
                                item.verse
                            );

                        }
                    );


                    resultList.appendChild(
                        result
                    );

                }
            );

        }


        /* =================================================
           أحداث البحث
        ================================================= */

        searchButton.addEventListener(
            "click",
            performSearch
        );


        searchInput.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();

                    performSearch();

                }

            }
        );


        /*
           البحث أثناء الكتابة:
           ننتظر قليلًا حتى لا ننفذ بحثًا
           عند كل حرف.
        */

        let searchTimer = null;


        searchInput.addEventListener(
            "input",
            function(){

                clearTimeout(
                    searchTimer
                );


                const value =
                    searchInput.value.trim();


                if(!value){

                    searchResults.classList.remove(
                        "active"
                    );

                    searchResults.innerHTML =
                        "";

                    return;

                }


                searchTimer =
                    setTimeout(
                        performSearch,
                        350
                    );

            }
        );


        /* =================================================
           أحداث القوائم
        ================================================= */

        bookSelect.addEventListener(
            "change",
            buildChapters
        );


        chapterSelect.addEventListener(
            "change",
            renderChapter
        );


        /* =================================================
           بدء التطبيق
        ================================================= */

        await loadBible();

    }
);


/* =====================================================
   LANGUAGE
===================================================== */

const translations = {

    ar:{
        churchName:
            "كنيسة رجاء الأمم سيدني",

        homeText:
            "الرئيسية"
    },

    en:{
        churchName:
            "Hope Of Nation Church NSW",

        homeText:
            "Home"
    }

};


function setLanguage(language){

    const t =
        translations[language];


    document.documentElement.lang =
        language;


    document.documentElement.dir =
        language === "en"
            ? "ltr"
            : "rtl";


    document.getElementById(
        "churchName"
    ).textContent =
        t.churchName;


    document.getElementById(
        "homeText"
    ).textContent =
        t.homeText;


    localStorage.setItem(
        "bibleAppLanguage",
        language
    );

}


const savedLanguage =
    localStorage.getItem(
        "bibleAppLanguage"
    ) || "ar";


setLanguage(
    savedLanguage
);

</script>
