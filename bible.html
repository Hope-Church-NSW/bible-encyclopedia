<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتاب المقدس - Hope Church NSW</title>

<style>
:root{
    --gold:#d4af37;
    --gold-light:#f5d76e;
    --gold-dark:#8f6b16;
    --blue:#071b35;
    --blue2:#0d2d52;
    --white:#fff;
    --text:#f5f5f5;
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#173d67 0,#071b35 45%,#030b16 100%);
    color:var(--text);
}

.header{
    min-height:105px;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(212,175,55,.35);
    background:rgba(3,12,25,.78);
}

.brand{
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    width:78px;
    height:78px;
    object-fit:contain;
    filter:drop-shadow(0 0 12px rgba(212,175,55,.45));
}

.church-name{
    font-size:clamp(21px,3vw,34px);
    font-weight:900;
    background:linear-gradient(90deg,#fff3a6,#d4af37,#fff1a0,#9d741b);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 10px rgba(212,175,55,.18);
}

.home-link{
    color:var(--gold-light);
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    transition:.25s;
}

.home-link:hover{
    transform:translateY(-2px);
    color:#fff;
}

.container{
    width:min(1100px,94%);
    margin:35px auto 60px;
}

.title{
    text-align:center;
    font-size:clamp(30px,5vw,52px);
    margin:10px 0 8px;
    font-weight:900;
    background:linear-gradient(90deg,#fff4aa,#d4af37,#fff0a0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    color:#d7e0ea;
    margin-bottom:30px;
    font-size:18px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.tab{
    border:1px solid rgba(212,175,55,.5);
    background:linear-gradient(145deg,#12365d,#071b35);
    color:white;
    padding:18px 12px;
    border-radius:18px;
    cursor:pointer;
    font-size:21px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 8px 22px rgba(0,0,0,.25);
}

.tab:hover,
.tab.active{
    transform:translateY(-3px);
    border-color:var(--gold-light);
    box-shadow:0 10px 30px rgba(212,175,55,.18);
    background:linear-gradient(145deg,#1a4c7c,#0b2545);
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:25px;
}

.control-box{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:18px;
}

label{
    display:block;
    margin-bottom:9px;
    color:var(--gold-light);
    font-weight:bold;
    font-size:17px;
}

select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(212,175,55,.45);
    background:#09213d;
    color:white;
    font-size:17px;
    outline:none;
}

select:focus{
    border-color:var(--gold-light);
    box-shadow:0 0 0 3px rgba(212,175,55,.12);
}

.chapter-box{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(212,175,55,.25);
    border-radius:22px;
    padding:25px;
    min-height:150px;
}

.chapter-title{
    text-align:center;
    color:var(--gold-light);
    font-size:30px;
    margin:0 0 22px;
}

.chapter-buttons{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(75px,1fr));
    gap:10px;
}

.chapter-btn{
    padding:13px 7px;
    background:#0c2a4d;
    color:white;
    border:1px solid rgba(212,175,55,.3);
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.chapter-btn:hover,
.chapter-btn.active{
    background:linear-gradient(145deg,#d4af37,#8f6b16);
    color:#071b35;
    font-weight:bold;
}

.verses{
    margin-top:25px;
}

.verse{
    position:relative;
    margin:12px 0;
    padding:18px 20px 18px 55px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    line-height:2.05;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
}

.verse:hover{
    transform:translateX(-3px);
    border-color:rgba(212,175,55,.65);
    background:rgba(212,175,55,.08);
}

.verse-number{
    position:absolute;
    left:15px;
    top:17px;
    color:var(--gold-light);
    font-weight:bold;
    font-size:15px;
}

.loading,
.error,
.empty{
    text-align:center;
    padding:35px;
    color:#d8e0ea;
}

.error{
    color:#ffb3b3;
}

@media(max-width:700px){
    .header{
        padding:14px 16px;
    }

    .logo{
        width:62px;
        height:62px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .tabs{
        grid-template-columns:1fr;
    }

    .verse{
        font-size:18px;
        padding-left:45px;
    }
}
</style>
</head>

<body>

<header class="header">

    <a class="home-link" href="index.html">الرئيسية</a>

    <div class="brand">
        <div class="church-name">كنيسة رجاء الأمم سيدني</div>
        <img class="logo" src="assets/logo.png" alt="Hope Church NSW">
    </div>

</header>

<main class="container">

    <h1 class="title">الكتاب المقدس</h1>

    <div class="tabs">
        <button class="tab active" onclick="showTestament('old',this)">
            ✝️ العهد القديم
        </button>

        <button class="tab" onclick="showTestament('new',this)">
            ✝️ العهد الجديد
        </button>

        <button class="tab" onclick="focusSearch()">
            🔎 البحث
        </button>
    </div>

    <section id="oldPanel" class="panel active">

        <div class="controls">

            <div class="control-box">
                <label for="oldBook">اختر السفر</label>
                <select id="oldBook" onchange="bookChanged('old')"></select>
            </div>

            <div class="control-box">
                <label for="oldChapter">اختر الأصحاح</label>
                <select id="oldChapter" onchange="loadChapter('old')"></select>
            </div>

        </div>

        <div id="oldContent" class="chapter-box">
            <div class="loading">جاري تحميل الكتاب المقدس...</div>
        </div>

    </section>

    <section id="newPanel" class="panel">

        <div class="controls">

            <div class="control-box">
                <label for="newBook">اختر السفر</label>
                <select id="newBook" onchange="bookChanged('new')"></select>
            </div>

            <div class="control-box">
                <label for="newChapter">اختر الأصحاح</label>
                <select id="newChapter" onchange="loadChapter('new')"></select>
            </div>

        </div>

        <div id="newContent" class="chapter-box">
            <div class="loading">اختر السفر والأصحاح</div>
        </div>

    </section>

</main>

let bibleData = null;
let currentTestament = "old";

function normalizeBookId(value){
    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/_/g,"-");
}

function showTestament(type, button){

    if(type === "search"){
        focusSearch();
        return;
    }

    currentTestament = type;

    document.querySelectorAll(".tab").forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button) button.classList.add("active");

    document.getElementById("oldPanel").classList.toggle("active",type==="old");
    document.getElementById("newPanel").classList.toggle("active",type==="new");

    const select = document.getElementById(
        type === "old" ? "oldBook" : "newBook"
    );

    if(select.options.length === 0){
        fillBooks(type);
    }
}

function fillBooks(type){

    const select = document.getElementById(
        type === "old" ? "oldBook" : "newBook"
    );

    const books = type === "old" ? OLD_BOOKS : NEW_BOOKS;

    select.innerHTML = "";

    const first = document.createElement("option");
    first.value = "";
    first.textContent = "اختر السفر";
    select.appendChild(first);

    books.forEach(([id,name])=>{
        const option = document.createElement("option");
        option.value = id;
        option.textContent = name;
        select.appendChild(option);
    });
}

function bookChanged(type){

    const bookSelect = document.getElementById(
        type === "old" ? "oldBook" : "newBook"
    );

    const chapterSelect = document.getElementById(
        type === "old" ? "oldChapter" : "newChapter"
    );

    const bookId = bookSelect.value;

    chapterSelect.innerHTML = "";

    if(!bookId){
        const option = document.createElement("option");
        option.textContent = "اختر السفر أولاً";
        option.value = "";
        chapterSelect.appendChild(option);
        return;
    }

    const count = CHAPTER_COUNTS[bookId] || 0;

    const first = document.createElement("option");
    first.value = "";
    first.textContent = "اختر الأصحاح";
    chapterSelect.appendChild(first);

    for(let i=1;i<=count;i++){

        const option = document.createElement("option");

        option.value = String(i);
        option.textContent = "الأصحاح " + i;

        chapterSelect.appendChild(option);
    }
}

function getSelectedBookName(type){

    const select = document.getElementById(
        type === "old" ? "oldBook" : "newBook"
    );

    if(!select.value) return "";

    return select.options[select.selectedIndex].textContent;
}

function extractVersesFromObject(obj, bookId, chapter){

    if(!obj) return [];

    const wantedChapter = String(chapter);

    /*
      الشكل:
      {
        "book":"01-gen",
        "chapter":1,
        "verse":1,
        "text":"..."
      }
    */
    if(Array.isArray(obj)){
        const result = [];

        obj.forEach(item=>{

            if(!item) return;

            if(
                item.book !== undefined &&
                normalizeBookId(item.book) !== normalizeBookId(bookId)
            ) return;

            if(
                item.chapter !== undefined &&
                String(item.chapter) !== wantedChapter
            ) return;

            if(item.verse !== undefined && item.text !== undefined){
                result.push({
                    verse:Number(item.verse),
                    text:String(item.text)
                });
            }
        });

        if(result.length) return result;
    }

    /*
      شكل:
      {
        "01-gen": {
          "1": {
             "1":"..."
          }
        }
      }
    */
    const aliases = FILE_ALIASES[bookId] || [bookId];

    for(const alias of aliases){

        const book =
            obj[alias] ||
            obj[normalizeBookId(alias)];

        if(book){

            const ch =
                book[wantedChapter] ||
                book[Number(wantedChapter)];

            if(ch){

                if(Array.isArray(ch)){
                    return ch.map((text,index)=>({
                        verse:index+1,
                        text:String(text)
                    }));
                }

                if(typeof ch === "object"){

                    return Object.keys(ch)
                        .sort((a,b)=>Number(a)-Number(b))
                        .map(key=>({
                            verse:Number(key),
                            text:String(
                                ch[key]?.text ??
                                ch[key]
                            )
                        }))
                        .filter(v=>v.text && v.text !== "[object Object]");
                }
            }
        }
    }

    /*
      الشكل:
      {
        "books":[
          {
            "id":"01-gen",
            "chapters":[
              [
                {"verse":1,"text":"..."}
              ]
            ]
          }
        ]
      }
    */
    if(obj.books && Array.isArray(obj.books)){

        const found = obj.books.find(book=>{

            const id = normalizeBookId(book.id || book.book);

            return aliases.some(a=>normalizeBookId(a)===id);
        });

        if(found){

            const chapters =
                found.chapters ||
                found.chapter ||
                found.verses;

            const ch = chapters?.[Number(chapter)-1];

            if(Array.isArray(ch)){

                return ch.map((item,index)=>{

                    if(typeof item === "string"){
                        return {
                            verse:index+1,
                            text:item
                        };
                    }

                    return {
                        verse:Number(item.verse ?? index+1),
                        text:String(item.text ?? item.value ?? "")
                    };
                }).filter(v=>v.text);
            }
        }
    }

    return [];
}

async function tryLoadFile(url){

    try{

        const response = await fetch(url,{
            cache:"no-store"
        });

        if(!response.ok) return null;

        const text = await response.text();

        if(!text.trim()) return null;

        return JSON.parse(text);

    }catch(error){

        return null;
    }
}

async function loadChapter(type){

    const bookSelect = document.getElementById(
        type === "old" ? "oldBook" : "newBook"
    );

    const chapterSelect = document.getElementById(
        type === "old" ? "oldChapter" : "newChapter"
    );

    const content = document.getElementById(
        type === "old" ? "oldContent" : "newContent"
    );

    const bookId = bookSelect.value;
    const chapter = chapterSelect.value;

    if(!bookId || !chapter){

        content.innerHTML =
            '<div class="empty">اختر السفر ثم الأصحاح.</div>';

        return;
    }

    content.innerHTML =
        '<div class="loading">جاري تحميل الأصحاح...</div>';

    if(!bibleData){

        bibleData = await tryLoadFile("bible.json");

        if(!bibleData){

            content.innerHTML =
                '<div class="error">تعذر تحميل bible.json</div>';

            return;
        }
    }

    let verses = extractVersesFromObject(
        bibleData,
        bookId,
        chapter
    );

    /*
      إذا كان السفر غير موجود داخل bible.json،
      نحاول ملف السفر المستقل.
      وهذا مهم خصوصاً للأسفار التي كانت ناقصة.
    */
    if(!verses.length){

        const aliases = FILE_ALIASES[bookId] || [bookId];

        for(const alias of aliases){

            const files = [
                alias + ".json",
                alias.replace(/^0+/,"") + ".json"
            ];

            for(const file of files){

                const data = await tryLoadFile(file);

                if(data){

                    verses = extractVersesFromObject(
                        data,
                        bookId,
                        chapter
                    );

                    if(verses.length) break;
                }
            }

            if(verses.length) break;
        }
    }

    if(!verses.length){

        content.innerHTML =
            `<div class="error">
                لا توجد آيات لهذا الأصحاح في ملف البيانات الحالي.
             </div>`;

        return;
    }

    verses.sort((a,b)=>a.verse-b.verse);

    const title = getSelectedBookName(type);

    content.innerHTML = `
        <h2 class="chapter-title">
            ${escapeHtml(title)} — الأصحاح ${chapter}
        </h2>

        <div class="verses">
            ${verses.map(v=>`
                <div class="verse"
                     onclick="openVerse(${JSON.stringify(title)},${Number(chapter)},${Number(v.verse)},${JSON.stringify(v.text)})">

                    <span class="verse-number">${v.verse}</span>

                    ${escapeHtml(v.text)}
                </div>
            `).join("")}
        </div>
    `;
}

function openVerse(book,chapter,verse,text){

    /*
      هذه النقطة جاهزة للمرحلة التالية:
      نافذة الآية + الدراسة + التفسير + التوثيق
    */

    alert(
        book +
        " " +
        chapter +
        ":" +
        verse +
        "\n\n" +
        text
    );
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function focusSearch(){

    window.location.href = "index.html#search";
}

fillBooks("old");
fillBooks("new");

</script>
