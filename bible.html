<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
  --bg:#061321;
  --bg2:#0b1d31;
  --card:#0d2138;
  --card2:#102a46;
  --gold:#d4af37;
  --gold2:#f2d675;
  --text:#f4f7fb;
  --muted:#9fb0c3;
  --line:#1d3b59;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(145deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:12px 5%;
  background:rgba(6,19,33,.97);
  border-bottom:1px solid var(--gold);
  backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.35);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:82px;
  height:82px;
  object-fit:contain;
  filter:drop-shadow(0 4px 12px rgba(212,175,55,.4));
}

.brand-title{
  font-size:27px;
  font-weight:900;
  color:var(--gold2);
  text-shadow:
    0 2px 0 #8c6d13,
    0 4px 8px rgba(212,175,55,.4);
}

.home-link{
  color:var(--gold2);
  text-decoration:none;
  font-size:20px;
  font-weight:900;
  padding:11px 18px;
  border:1px solid var(--gold);
  border-radius:12px;
  background:linear-gradient(145deg,#173a5c,#0b2036);
  box-shadow:
    inset 0 1px rgba(255,255,255,.12),
    0 4px 12px rgba(0,0,0,.3);
}

.home-link:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 18px rgba(212,175,55,.25);
}

main{
  max-width:1200px;
  margin:auto;
  padding:28px 5% 50px;
}

h1{
  text-align:center;
  color:var(--gold2);
  font-size:32px;
  margin:0 0 24px;
  text-shadow:0 3px 10px rgba(212,175,55,.3);
}

.top-nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:24px;
}

.nav-card{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,#102a46,#0b1c30);
  color:var(--text);
  padding:20px 12px;
  cursor:pointer;
  transition:.25s;
  text-align:center;
  box-shadow:
    inset 0 1px rgba(255,255,255,.06),
    0 5px 15px rgba(0,0,0,.25);
}

.nav-card:hover,
.nav-card.active{
  border-color:var(--gold);
  transform:translateY(-3px);
  box-shadow:
    0 8px 25px rgba(0,0,0,.3),
    0 0 18px rgba(212,175,55,.12);
}

.nav-icon{
  font-size:32px;
  margin-bottom:7px;
}

.nav-title{
  color:var(--gold2);
  font-weight:900;
  font-size:18px;
}

.panel{
  background:rgba(13,33,56,.97);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  min-height:320px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.section-title{
  text-align:center;
  color:var(--gold2);
  font-size:26px;
  margin:0 0 22px;
}

.book-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.book-card,
.chapter-btn{
  border:1px solid var(--line);
  border-radius:13px;
  background:#102a46;
  color:var(--text);
  cursor:pointer;
  font-weight:800;
  transition:.2s;
}

.book-card{
  padding:15px 10px;
  font-size:16px;
}

.book-card:hover,
.chapter-btn:hover{
  border-color:var(--gold);
  background:#153657;
  transform:translateY(-2px);
}

.chapter-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.chapter-btn{
  padding:13px 7px;
  color:var(--gold2);
  font-size:16px;
}

.verse{
  padding:16px 8px;
  border-bottom:1px solid #17344f;
  font-size:19px;
  line-height:2.2;
  cursor:pointer;
  transition:.15s;
}

.verse:hover{
  background:#102a46;
}

.vnum{
  color:var(--gold2);
  font-weight:900;
  margin-left:9px;
}

.back-btn{
  display:inline-block;
  margin:0 0 18px;
  border:1px solid var(--gold);
  background:linear-gradient(145deg,#173a5c,#0b2036);
  color:var(--gold2);
  border-radius:11px;
  padding:10px 17px;
  cursor:pointer;
  font-weight:900;
}

.back-btn:hover{
  transform:translateY(-2px);
}

.chapter-navigation{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid var(--line);
}

.nav-chapter-btn{
  border:1px solid var(--gold);
  border-radius:12px;
  background:linear-gradient(145deg,#173a5c,#0b2036);
  color:var(--gold2);
  padding:12px 24px;
  cursor:pointer;
  font-weight:900;
  font-size:16px;
}

.nav-chapter-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search-box input{
  flex:1;
  border:1px solid var(--line);
  border-radius:12px;
  background:#091a2d;
  color:white;
  padding:14px;
  font-size:17px;
  outline:none;
}

.search-box button{
  border:1px solid var(--gold);
  border-radius:12px;
  background:#153657;
  color:var(--gold2);
  padding:0 22px;
  cursor:pointer;
  font-weight:900;
}

.search-result{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin:10px 0;
  background:#0b1c30;
  cursor:pointer;
  line-height:1.9;
}

.search-result strong{
  color:var(--gold2);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}

.status{
  text-align:center;
  color:var(--muted);
  margin-bottom:18px;
}

.audio-box{
  margin-top:25px;
  padding:18px;
  border:1px solid var(--gold);
  border-radius:15px;
  background:#0b2036;
  text-align:center;
}

.audio-box button{
  border:1px solid var(--gold);
  border-radius:12px;
  background:#153657;
  color:var(--gold2);
  padding:12px 20px;
  cursor:pointer;
  font-weight:900;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

@media(max-width:900px){
  .book-grid{grid-template-columns:repeat(3,1fr)}
  .chapter-grid{grid-template-columns:repeat(6,1fr)}
}

@media(max-width:650px){
  .header-inner{align-items:center}
  .brand-title{font-size:19px}
  .logo{width:62px;height:62px}
  .home-link{font-size:15px;padding:9px 12px}
  .top-nav{grid-template-columns:repeat(3,1fr);gap:7px}
  .nav-card{padding:13px 5px}
  .nav-icon{font-size:25px}
  .nav-title{font-size:13px}
  .book-grid{grid-template-columns:repeat(2,1fr)}
  .chapter-grid{grid-template-columns:repeat(5,1fr)}
  .verse{font-size:17px}
  .search-box{flex-direction:column}
  .search-box button{padding:12px}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="home-link" href="index.html">

      <div class="brand-title">

<main>

<h1>الكتاب المقدس</h1>

<button

<section class="panel" id="content"></section>

</main>

<footer>
Hope Church NSW — Bible Study

<script>

/*

وهذا يمنع الصفحة البيضاء إذا كان اسم ملف قاعدة البيانات
مختلفاً في المستودع.

*/

const DATA_FILES=[

const SECOND_PETER="2pet.json";

let verses=[];

let currentTestament="old";
let currentBook="";

/*

const BOOK_NAMES={

const OLD_ORDER=[

];

];

const $=id=>document.getElementById(id);


/*
========================================================
حماية النص
========================================================
*/

function escapeHtml(value){

return String(value??"").replace(
/[&<>"']/g,

function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];

});

}


/*
========================================================
توحيد أسماء الأسفار القادمة من ملفات مختلفة
========================================================
*/

const BOOK_ALIASES={

"01-Genesis":"01-gen",
"01-genesis":"01-gen",

"02-exodus":"02-Exodus",

"03-leviticus":"03-Leviticus",

"04-numbers":"04-Numbers",

"05-deut":"05-Deut",
"05-deuteronomy":"05-Deut",

"06-joshua":"06-Joshua",

"07-judges":"07-Judges",

"08-ruth":"08-Ruth",

"09-1samuel":"09-1Samuel",
"09-1-samuel":"09-1Samuel",

"10-2samuel":"10-2Samuel",
"10-2-samuel":"10-2Samuel",

"11-1kings":"11-1Kings",
"11-1-kings":"11-1Kings",

"12-2kings":"12-2Kings",
"12-2-kings":"12-2Kings",

"13-1chronicles":"13-1Chronicles",

"22-songofsolomon":"22-Song",

"60-1-peter":"60-1-peter",

"60-1Peter":"60-1-peter",

"61-2-peter":"61-2pet",
"61-2Peter":"61-2pet",
"61-2peter":"61-2pet",

"62-1john":"62-1-John",
"63-2john":"63-2-John",
"64-3john":"64-3-John",

"66-revelation":"66-Revelation"

};


/*
========================================================
توحيد السجل
========================================================
*/

function normalizeBookId(book){

const raw=String(book??"").trim();

if(BOOK_NAMES[raw]) return raw;

const key=raw.toLowerCase();

return BOOK_ALIASES[key] || raw;

}


function normalizeRows(data){

if(!Array.isArray(data)) return [];

return data.map(v=>({

book:normalizeBookId(v.book),

chapter:Number(v.chapter),

verse:Number(v.verse ?? v.number),

text:String(v.text??"").trim()

})).filter(v=>

v.book &&
Number.isFinite(v.chapter) &&
Number.isFinite(v.verse) &&
v.text

);

}


/*
========================================================
تحميل JSON
========================================================
*/

async function loadJson(url){

const response=await fetch(
url+"?v="+Date.now(),
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
url+" HTTP "+response.status
);

}

return await response.json();

}


/*
========================================================
تحميل المصدر الصحيح تلقائياً
========================================================
*/

async function loadMainBible(){

let lastError=null;

for(const file of DATA_FILES){

try{

const data=await loadJson(file);

const rows=normalizeRows(data);

if(rows.length>0){

console.log(
"تم تحميل الكتاب المقدس من:",
file,
"عدد السجلات:",
rows.length
);

return rows;

}

}catch(error){

lastError=error;

console.warn(
"تعذر تحميل:",
file,
error
);

}

}

throw lastError ||
new Error("لم يتم العثور على ملف بيانات الكتاب المقدس");

}


/*
========================================================
تشغيل الصفحة
========================================================
*/

async function boot(){

try{

const mainRows=await loadMainBible();

let petRows=[];

try{

const petData=await loadJson(SECOND_PETER);

petRows=normalizeRows(petData);

console.log(
"2pet.json:",
petRows.length,
"آية"
);

}catch(error){

console.warn(
"2pet.json غير متاح",
error
);

}


/*
إزالة أي نسخة ناقصة من بطرس الثانية
*/

verses=[

...mainRows.filter(v=>
v.book!=="61-2pet"
),

...petRows.map(v=>({

...v,

book:"61-2pet"

}))

];


/*
إزالة التكرار
*/

const unique=new Map();

for(const v of verses){

const key=
`${v.book}|${v.chapter}|${v.verse}`;

if(!unique.has(key)){

unique.set(key,v);

}

}

verses=[...unique.values()];


/*
ترتيب الآيات
*/

verses.sort((a,b)=>{

if(a.book!==b.book){

return a.book.localeCompare(b.book);

}

if(a.chapter!==b.chapter){

return a.chapter-b.chapter;

}

return a.verse-b.verse;

});


console.log(
"إجمالي الآيات:",
verses.length
);

showTestament("old");


}catch(error){

console.error(
"خطأ تحميل الكتاب المقدس:",
error
);

$("content").innerHTML=`

<div class="empty">

<h2>تعذر تحميل بيانات الكتاب المقدس</h2>

<p>
تم تجربة:
<br>
bible_database.json
<br>
bible.json
</p>

<p>
افتح Console في المتصفح لمعرفة الملف الذي رفضه الخادم.
</p>

</div>

`;

}

}


/*
========================================================
عرض العهد
========================================================
*/

function showTestament(testament){

currentTestament=testament;

currentBook="";

currentChapter=0;

$("oldTab").classList.toggle(
"active",
testament==="old"
);

$("newTab").classList.toggle(
"active",
testament==="new"
);

$("searchTab").classList.remove(
"active"
);

const order=
testament==="old"
?OLD_ORDER
:NEW_ORDER;


/*
العثور على السفر حتى لو اختلف الاسم في JSON
*/

const available=order.filter(id=>

verses.some(v=>v.book===id)

);


$("content").innerHTML=`

<h2 class="section-title">

${testament==="old"
?"العهد القديم"
:"العهد الجديد"}

</h2>

<div class="book-grid">

${
available.map(id=>`

<button
class="book-card"
onclick="openBook('${id}')">

${escapeHtml(
BOOK_NAMES[id]||id
)}

</button>

`).join("")
}

</div>

${
available.length===0
?
`<div class="empty">
لا توجد بيانات لهذا العهد.
</div>`
:""
}

`;

}


/*
========================================================
فتح السفر
========================================================
*/

function openBook(book){

currentBook=book;

currentChapter=0;

const chapters=[

...new Set(

verses
.filter(v=>v.book===book)
.map(v=>v.chapter)

)

].sort((a,b)=>a-b);


$("content").innerHTML=`

<button
class="back-btn"
onclick="showTestament('${currentTestament}')">

← العودة إلى الأسفار

</button>

<h2 class="section-title">

${escapeHtml(
BOOK_NAMES[book]||book
)}

</h2>

<div class="chapter-grid">

${
chapters.map(ch=>`

<button
class="chapter-btn"
onclick="openChapter('${book}',${ch})">

${ch}

</button>

`).join("")
}

</div>

${
chapters.length===0
?
`<div class="empty">
لا توجد أصحاحات لهذا السفر.
</div>`
:""
}

`;

}


/*
========================================================
فتح الأصحاح
========================================================
*/

function openChapter(book,chapter){

currentBook=book;

currentChapter=Number(chapter);

const rows=

verses
.filter(v=>
v.book===book &&
v.chapter===Number(chapter)
)
.sort((a,b)=>a.verse-b.verse);


/*
العثور على الأصحاح السابق والتالي
*/

const chapters=[

...new Set(

verses
.filter(v=>v.book===book)
.map(v=>Number(v.chapter))

)

].sort((a,b)=>a-b);


const index=
chapters.indexOf(Number(chapter));

const previousChapter=
index>0
?chapters[index-1]
:null;

const nextChapter=
index<chapters.length-1
?chapters[index+1]
:null;


$("content").innerHTML=`

<button
class="back-btn"
onclick="openBook('${book}')">

← العودة إلى الأصحاحات

</button>

<h2 class="section-title">

${escapeHtml(
BOOK_NAMES[book]||book
)}

— الإصحاح ${chapter}

</h2>

<div class="status">

${rows.length}
آية

</div>

<div>

${
rows.length

?

rows.map(v=>`

<div
class="verse"
onclick="openVerse(
'${v.book}',
${v.chapter},
${v.verse}
)">

<span class="vnum">
${v.verse}
</span>

${escapeHtml(v.text)}

</div>

`).join("")

:

`<div class="empty">
لا توجد آيات لهذا الأصحاح.
</div>`

}

</div>


<div class="chapter-navigation">

<button
class="nav-chapter-btn"
${previousChapter===null?"disabled":""}
onclick="${
previousChapter===null
?"void(0)"
:`openChapter('${book}',${previousChapter})`
}">

السابق

</button>


<button
class="nav-chapter-btn"
${nextChapter===null?"disabled":""}
onclick="${
nextChapter===null
?"void(0)"
:`openChapter('${book}',${nextChapter})`
}">

التالي

</button>

</div>


<div class="audio-box">

<button onclick="playChapterAudio()">

🔊 الكتاب المقدس المسموع

</button>

</div>

`;

}


/*
========================================================
البحث
========================================================
*/

function showSearch(){

$("oldTab").classList.remove("active");

$("newTab").classList.remove("active");

$("searchTab").classList.add("active");


$("content").innerHTML=`

<h2 class="section-title">

البحث في الكتاب المقدس

</h2>

<div class="search-box">

<input
id="searchInput"
type="search"
placeholder="اكتب كلمة أو عبارة..."
>

<button onclick="runSearch()">
بحث
</button>

</div>

<div id="searchResults"></div>

`;


$("searchInput").addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

runSearch();

}

}
);

$("searchInput").focus();

}


/*
========================================================
تنفيذ البحث
========================================================
*/

function runSearch(){

const input=$("searchInput");

if(!input)return;

const q=
input.value
.trim()
.toLocaleLowerCase("ar");


if(!q){

$("searchResults").innerHTML=
`
<div class="empty">
اكتب كلمة أو عبارة للبحث.
</div>
`;

return;

}


const hits=

verses
.filter(v=>

v.text
.toLocaleLowerCase("ar")
.includes(q)

)
.slice(0,200);


$("searchResults").innerHTML=

hits.length

?

hits.map(v=>`

<div
class="search-result"
onclick="openVerse(
'${v.book}',
${v.chapter},
${v.verse}
)">

<strong>

${escapeHtml(
BOOK_NAMES[v.book]||v.book
)}

${v.chapter}:${v.verse}

</strong>

<div>

${escapeHtml(v.text)}

</div>

</div>

`).join("")

:

`
<div class="empty">
لا توجد نتائج.
</div>
`;

}


/*
========================================================
فتح آية
========================================================
*/

function openVerse(book,chapter,verse){

const v=

verses.find(x=>

x.book===book &&
x.chapter===Number(chapter) &&
x.verse===Number(verse)

);


if(!v)return;


$("content").innerHTML=`

<button
class="back-btn"
onclick="openChapter(
'${book}',
${chapter}
)">

← العودة إلى الأصحاح

</button>

<h2 class="section-title">

${escapeHtml(
BOOK_NAMES[book]||book
)}

${chapter}:${verse}

</h2>

<div
class="verse"
style="cursor:default">

<span class="vnum">

${verse}

</span>

${escapeHtml(v.text)}

</div>

`;

}


/*
========================================================
الكتاب المسموع
========================================================
*/

function playChapterAudio(){

alert(
"سيتم ربط صوت الكتاب المقدس المسموع بهذه الصفحة في مرحلة الصوت."
);

}


/*
========================================================
تشغيل
========================================================
*/

boot();

</script>
