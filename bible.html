<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
--blue:#061a3a;
--blue2:#0b2d63;
--blue3:#124783;
--gold:#d4af37;
--gold2:#f4d675;
--text:#eef4ff;
--card:#0a2550;
--border:rgba(212,175,55,.45)
}

*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at top,#123d76 0%,var(--blue) 45%,#020b1b 100%);
color:var(--text)
}

body{min-height:100vh}

.site-header{
width:100%;
min-height:105px;
padding:14px 22px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
background:linear-gradient(135deg,#071b3d,#0c326d 55%,#061a3a);
border-bottom:2px solid var(--gold);
box-shadow:0 8px 30px rgba(0,0,0,.45);
position:sticky;
top:0;
z-index:1000
}

.home-button{
text-decoration:none;
color:#fff;
min-width:145px;
height:54px;
display:flex;
align-items:center;
justify-content:center;
gap:9px;
border:1px solid var(--gold);
border-radius:16px;
background:linear-gradient(145deg,#174c8d,#092654);
box-shadow:0 6px 0 #041329,0 10px 22px rgba(0,0,0,.35);
font-size:18px;
font-weight:bold;
transition:.25s
}

.home-button:hover{
transform:translateY(-3px);
box-shadow:0 9px 0 #041329,0 14px 28px rgba(0,0,0,.45)
}

.brand{
display:flex;
align-items:center;
gap:14px
}

.logo{
width:82px;
height:82px;
object-fit:contain;
filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))
drop-shadow(0 0 12px rgba(212,175,55,.35))
}

.brand-text{text-align:right}

.brand-ar{
color:var(--gold2);
font-size:23px;
font-weight:900;
text-shadow:0 2px 0 #765b0d,0 4px 8px rgba(0,0,0,.6)
}

.brand-en{
color:#fff;
font-size:12px;
letter-spacing:1px;
opacity:.9
}

.page{
width:min(1200px,94%);
margin:28px auto 60px
}

.page-title{
text-align:center;
margin:10px 0 28px
}

.page-title h1{
margin:0;
font-size:34px;
color:var(--gold2);
text-shadow:0 2px 0 #70570f,0 5px 10px rgba(0,0,0,.6)
}

.testament-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:20px
}

.testament{
height:60px;
border:1px solid var(--gold);
border-radius:16px;
color:#fff;
background:linear-gradient(145deg,#123f78,#061d42);
font-family:inherit;
font-size:19px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 0 #031126,0 10px 20px rgba(0,0,0,.3);
transition:.25s
}

.testament.active{
color:#071a37;
background:linear-gradient(145deg,var(--gold2),var(--gold));
box-shadow:0 5px 0 #765b0d,0 10px 24px rgba(0,0,0,.35)
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
padding:22px;
border:1px solid var(--border);
border-radius:22px;
background:linear-gradient(145deg,rgba(18,71,131,.82),rgba(4,24,53,.95));
box-shadow:0 15px 35px rgba(0,0,0,.35)
}

.control-box{
display:flex;
flex-direction:column;
gap:8px
}

.control-box label{
color:var(--gold2);
font-weight:bold;
font-size:16px
}

select{
width:100%;
height:54px;
padding:0 15px;
color:#fff;
background:#061d42;
border:1px solid var(--gold);
border-radius:14px;
outline:none;
font-size:17px;
font-family:inherit;
cursor:pointer
}

select option{
color:#fff;
background:#061d42
}

.chapter-area{
margin-top:25px
}

.chapter-title{
text-align:center;
margin:0 0 20px;
color:var(--gold2);
font-size:28px;
text-shadow:0 2px 0 #735a12,0 4px 8px rgba(0,0,0,.5)
}

.verses{
display:flex;
flex-direction:column;
gap:12px
}

.verse{
position:relative;
padding:18px 20px 18px 60px;
border:1px solid rgba(212,175,55,.3);
border-radius:17px;
background:linear-gradient(145deg,rgba(15,55,105,.94),rgba(5,24,51,.97));
box-shadow:0 8px 20px rgba(0,0,0,.28);
line-height:2.1;
font-size:19px
}

.verse-number{
position:absolute;
left:15px;
top:15px;
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
color:#061a3a;
background:linear-gradient(145deg,var(--gold2),var(--gold));
font-weight:bold
}

.chapter-navigation{
display:flex;
justify-content:space-between;
gap:20px;
margin-top:28px
}

.nav-button{
flex:1;
min-height:54px;
border:1px solid var(--gold);
border-radius:15px;
color:#fff;
background:linear-gradient(145deg,#174c8d,#092654);
font-family:inherit;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 0 #031126,0 9px 20px rgba(0,0,0,.3)
}

.nav-button:disabled{
opacity:.35;
cursor:not-allowed
}

.audio-box{
margin-top:25px;
padding:18px;
border:1px solid var(--border);
border-radius:18px;
background:linear-gradient(145deg,rgba(15,55,105,.8),rgba(4,22,48,.95));
text-align:center
}

.audio-title{
color:var(--gold2);
font-weight:bold;
margin-bottom:10px
}

audio{
width:100%;
max-width:650px
}

.error{
color:#ffb3b3;
border:1px solid #a44;
padding:18px;
border-radius:14px;
text-align:center;
background:rgba(80,0,0,.25)
}

@media(max-width:700px){
.site-header{min-height:88px;padding:10px 12px}
.logo{width:58px;height:58px}
.brand-ar{font-size:16px}
.brand-en{display:none}
.home-button{min-width:100px;height:46px;font-size:14px}
.controls{grid-template-columns:1fr;padding:15px}
.testament-buttons{grid-template-columns:1fr}
.verse{font-size:17px;padding:16px 18px 16px 52px}
.chapter-title{font-size:23px}
}
</style>
</head>

<body>

<header class="site-header">

<a class="home-button" href="./index.html">
<span>⌂</span>
<span>الرئيسية</span>
</a>

<div class="brand">
<div class="brand-text">
<div class="brand-ar">كنيسة رجاء الأمم سيدني</div>
<div class="brand-en">HOPE OF NATION CHURCH NSW</div>
</div>

<img
class="logo"
src="./assets/logo.png"
alt="شعار كنيسة رجاء الأمم سيدني"
>
</div>

</header>

<main class="page">

<section class="page-title">
<h1>الكتاب المقدس</h1>
</section>

<section class="testament-buttons">

<button
id="oldTestamentBtn"
class="testament active"
type="button">
العهد القديم
</button>

<button
id="newTestamentBtn"
class="testament"
type="button">
العهد الجديد
</button>

</section>

<section class="controls">

<div class="control-box">
<label for="bookSelect">اختر السفر</label>
<select id="bookSelect">
<option value="">اختر السفر</option>
</select>
</div>

<div class="control-box">
<label for="chapterSelect">اختر الأصحاح</label>
<select id="chapterSelect" disabled>
<option value="">اختر الأصحاح</option>
</select>
</div>

</section>

<section id="chapterArea" class="chapter-area" hidden>

<h2 id="chapterTitle" class="chapter-title"></h2>

<div id="verses" class="verses"></div>

<div class="chapter-navigation">

<button id="nextButton" class="nav-button" type="button">
التالي
</button>

<button id="previousButton" class="nav-button" type="button">
السابق
</button>

</div>

<section class="audio-box">

<div class="audio-title">
🎧 الكتاب المقدس المسموع
</div>

<audio id="audioPlayer" controls preload="none"></audio>

</section>

</section>

</main>

<script>

const LOCAL_BIBLE_URL="./bible.json";

/*
المصدر الاحتياطي الكامل للعهدين.
يُستخدم فقط عند عدم وجود الكتاب في bible.json المحلي.
*/
const REMOTE_BIBLE_URL=
"https://raw.githubusercontent.com/thiagobodruk/bible/master/json/ar_svd.json";

const BOOKS=[

{id:"01-gen",name:"التكوين",testament:"old",remote:"Genesis"},
{id:"02-exo",name:"الخروج",testament:"old",remote:"Exodus"},
{id:"03-lev",name:"اللاويين",testament:"old",remote:"Leviticus"},
{id:"04-num",name:"العدد",testament:"old",remote:"Numbers"},
{id:"05-deut",name:"التثنية",testament:"old",remote:"Deuteronomy"},
{id:"06-josh",name:"يشوع",testament:"old",remote:"Joshua"},
{id:"07-judges",name:"القضاة",testament:"old",remote:"Judges"},
{id:"08-ruth",name:"راعوث",testament:"old",remote:"Ruth"},
{id:"09-1-samuel",name:"صموئيل الأول",testament:"old",remote:"1 Samuel"},
{id:"10-2-samuel",name:"صموئيل الثاني",testament:"old",remote:"2 Samuel"},
{id:"11-1-kings",name:"ملوك الأول",testament:"old",remote:"1 Kings"},
{id:"12-2-kings",name:"ملوك الثاني",testament:"old",remote:"2 Kings"},
{id:"13-1-chronicles",name:"أخبار الأيام الأول",testament:"old",remote:"1 Chronicles"},
{id:"14-2-chronicles",name:"أخبار الأيام الثاني",testament:"old",remote:"2 Chronicles"},
{id:"15-ezra",name:"عزرا",testament:"old",remote:"Ezra"},
{id:"16-nehemiah",name:"نحميا",testament:"old",remote:"Nehemiah"},
{id:"17-esther",name:"أستير",testament:"old",remote:"Esther"},
{id:"18-job",name:"أيوب",testament:"old",remote:"Job"},
{id:"19-psalms",name:"المزامير",testament:"old",remote:"Psalms"},
{id:"20-proverbs",name:"الأمثال",testament:"old",remote:"Proverbs"},
{id:"21-ecclesiastes",name:"الجامعة",testament:"old",remote:"Ecclesiastes"},
{id:"22-song",name:"نشيد الأنشاد",testament:"old",remote:"Song of Solomon"},
{id:"23-isaiah",name:"إشعياء",testament:"old",remote:"Isaiah"},
{id:"24-jeremiah",name:"إرميا",testament:"old",remote:"Jeremiah"},
{id:"25-lamentations",name:"مراثي إرميا",testament:"old",remote:"Lamentations"},
{id:"26-ezekiel",name:"حزقيال",testament:"old",remote:"Ezekiel"},
{id:"27-daniel",name:"دانيال",testament:"old",remote:"Daniel"},
{id:"28-hosea",name:"هوشع",testament:"old",remote:"Hosea"},
{id:"29-joel",name:"يوئيل",testament:"old",remote:"Joel"},
{id:"30-amos",name:"عاموس",testament:"old",remote:"Amos"},
{id:"31-obadiah",name:"عوبديا",testament:"old",remote:"Obadiah"},
{id:"32-jonah",name:"يونان",testament:"old",remote:"Jonah"},
{id:"33-micah",name:"ميخا",testament:"old",remote:"Micah"},
{id:"34-nahum",name:"ناحوم",testament:"old",remote:"Nahum"},
{id:"35-habakkuk",name:"حبقوق",testament:"old",remote:"Habakkuk"},
{id:"36-zephaniah",name:"صفنيا",testament:"old",remote:"Zephaniah"},
{id:"37-haggai",name:"حجي",testament:"old",remote:"Haggai"},
{id:"38-zechariah",name:"زكريا",testament:"old",remote:"Zechariah"},
{id:"39-malachi",name:"ملاخي",testament:"old",remote:"Malachi"},

{id:"40-matthew",name:"متى",testament:"new",remote:"Matthew"},
{id:"41-mark",name:"مرقس",testament:"new",remote:"Mark"},
{id:"42-luke",name:"لوقا",testament:"new",remote:"Luke"},
{id:"43-john",name:"يوحنا",testament:"new",remote:"John"},
{id:"44-acts",name:"أعمال الرسل",testament:"new",remote:"Acts"},
{id:"45-romans",name:"رومية",testament:"new",remote:"Romans"},
{id:"46-1-corinthians",name:"كورنثوس الأولى",testament:"new",remote:"1 Corinthians"},
{id:"47-2-corinthians",name:"كورنثوس الثانية",testament:"new",remote:"2 Corinthians"},
{id:"48-galatians",name:"غلاطية",testament:"new",remote:"Galatians"},
{id:"49-ephesians",name:"أفسس",testament:"new",remote:"Ephesians"},
{id:"50-philippians",name:"فيلبي",testament:"new",remote:"Philippians"},
{id:"51-colossians",name:"كولوسي",testament:"new",remote:"Colossians"},
{id:"52-1-thessalonians",name:"تسالونيكي الأولى",testament:"new",remote:"1 Thessalonians"},
{id:"53-2-thessalonians",name:"تسالونيكي الثانية",testament:"new",remote:"2 Thessalonians"},
{id:"54-1-timothy",name:"تيموثاوس الأولى",testament:"new",remote:"1 Timothy"},
{id:"55-2-timothy",name:"تيموثاوس الثانية",testament:"new",remote:"2 Timothy"},
{id:"56-titus",name:"تيطس",testament:"new",remote:"Titus"},
{id:"57-philemon",name:"فليمون",testament:"new",remote:"Philemon"},
{id:"58-hebrews",name:"العبرانيين",testament:"new",remote:"Hebrews"},
{id:"59-james",name:"يعقوب",testament:"new",remote:"James"},
{id:"60-1-peter",name:"بطرس الأولى",testament:"new",remote:"1 Peter"},
{id:"61-2-peter",name:"بطرس الثانية",testament:"new",remote:"2 Peter"},
{id:"62-1-john",name:"يوحنا الأولى",testament:"new",remote:"1 John"},
{id:"63-2-john",name:"يوحنا الثانية",testament:"new",remote:"2 John"},
{id:"64-3-john",name:"يوحنا الثالثة",testament:"new",remote:"3 John"},
{id:"65-jude",name:"يهوذا",testament:"new",remote:"Jude"},
{id:"66-revelation",name:"رؤيا يوحنا",testament:"new",remote:"Revelation"}

];

let bibleData=[];
let remoteBible=null;
let currentTestament="old";
let currentBook="";
let currentChapter=0;

const bookSelect=document.getElementById("bookSelect");
const chapterSelect=document.getElementById("chapterSelect");
const chapterArea=document.getElementById("chapterArea");
const chapterTitle=document.getElementById("chapterTitle");
const verses=document.getElementById("verses");
const previousButton=document.getElementById("previousButton");
const nextButton=document.getElementById("nextButton");
const oldButton=document.getElementById("oldTestamentBtn");
const newButton=document.getElementById("newTestamentBtn");
const audioPlayer=document.getElementById("audioPlayer");

function clean(value){
return String(value??"")
.trim()
.toLowerCase()
.replace(/[\u200e\u200f]/g,"")
.replace(/[_\s]+/g,"-");
}

function bookMatches(item,book){

if(!item)return false;

const wanted=[
clean(book.id),
clean(book.name),
clean(book.remote)
];

const values=[
clean(item.id),
clean(item.book),
clean(item.name),
clean(item.abbrev),
clean(item.abbreviation),
clean(item.bookId),
clean(item.book_id)
];

return wanted.some(w=>w && values.includes(w));
}

function findLocalBook(book){

if(!Array.isArray(bibleData))return null;

for(const item of bibleData){

if(bookMatches(item,book))return item;

}

return null;
}

function normalizeChapters(source){

if(!source)return [];

if(Array.isArray(source)){

return source.map(chapter=>{

if(Array.isArray(chapter))
return chapter.map(v=>typeof v==="string"?v:(v?.text||""));

if(chapter && typeof chapter==="object")
return Object.keys(chapter)
.sort((a,b)=>Number(a)-Number(b))
.map(k=>{
const v=chapter[k];
return typeof v==="string"?v:(v?.text||"");
});

return [];

});

}

if(source.chapters){

return normalizeChapters(source.chapters);

}

if(typeof source==="object"){

const keys=Object.keys(source)
.filter(k=>/^\d+$/.test(k))
.sort((a,b)=>Number(a)-Number(b));

if(keys.length){

return keys.map(k=>{

const chapter=source[k];

if(Array.isArray(chapter))
return chapter.map(v=>typeof v==="string"?v:(v?.text||""));

if(chapter && typeof chapter==="object"){

return Object.keys(chapter)
.sort((a,b)=>Number(a)-Number(b))
.map(x=>{
const v=chapter[x];
return typeof v==="string"?v:(v?.text||"");
});

}

return [];

});

}

}

return [];

}

function findRemoteBook(book){

if(!remoteBible)return null;

if(Array.isArray(remoteBible)){

for(const item of remoteBible){

if(bookMatches(item,book))
return normalizeChapters(item);

}

return null;

}

if(remoteBible[book.remote])
return normalizeChapters(remoteBible[book.remote]);

if(remoteBible[book.name])
return normalizeChapters(remoteBible[book.name]);

return null;
}

async function loadRemoteBible(){

if(remoteBible)return remoteBible;

const response=await fetch(REMOTE_BIBLE_URL,{cache:"force-cache"});

if(!response.ok)
throw new Error("REMOTE_BIBLE_FAILED");

remoteBible=await response.json();

return remoteBible;
}

async function getBookChapters(book){

const local=findLocalBook(book);

const localChapters=normalizeChapters(local);

if(localChapters.length)
return localChapters;

await loadRemoteBible();

const remoteChapters=findRemoteBook(book);

if(remoteChapters && remoteChapters.length)
return remoteChapters;

throw new Error("BOOK_NOT_FOUND");

}

function fillBooks(){

bookSelect.innerHTML='<option value="">اختر السفر</option>';

BOOKS
.filter(b=>b.testament===currentTestament)
.forEach(book=>{

const option=document.createElement("option");

option.value=book.id;
option.textContent=book.name;

bookSelect.appendChild(option);

});

chapterSelect.innerHTML='<option value="">اختر الأصحاح</option>';
chapterSelect.disabled=true;
chapterArea.hidden=true;

}

function selectTestament(testament){

currentTestament=testament;

oldButton.classList.toggle("active",testament==="old");
newButton.classList.toggle("active",testament==="new");

currentBook="";
currentChapter=0;

fillBooks();

}

async function openChapter(){

const book=BOOKS.find(b=>b.id===currentBook);

if(!book)return;

try{

const chapters=await getBookChapters(book);

if(!chapters.length)
throw new Error("NO_CHAPTERS");

const chapterIndex=currentChapter-1;

const chapter=chapters[chapterIndex];

if(!Array.isArray(chapter))
throw new Error("NO_CHAPTER");

renderChapter(book,currentChapter,chapter,chapters.length);

}catch(error){

chapterArea.hidden=false;

verses.innerHTML=
`<div class="error">
تعذر تحميل آيات ${book.name} ${currentChapter}.<br>
سيتم استخدام المصدر الاحتياطي للكتاب المقدس تلقائياً.
</div>`;

}

}

function renderChapter(book,chapterNumber,chapter,totalChapters){

chapterArea.hidden=false;

chapterTitle.textContent=
`${book.name} — الأصحاح ${chapterNumber}`;

verses.innerHTML="";

chapter.forEach((text,index)=>{

if(!text)return;

const verse=document.createElement("div");

verse.className="verse";

const number=document.createElement("span");

number.className="verse-number";
number.textContent=index+1;

verse.appendChild(number);

const content=document.createElement("span");

content.textContent=text;

verse.appendChild(content);

verses.appendChild(verse);

});

previousButton.disabled=
chapterNumber<=1;

nextButton.disabled=
chapterNumber>=totalChapters;

window.scrollTo({
top:chapterArea.offsetTop-100,
behavior:"smooth"
});

}

async function showSelectedChapter(){

if(!currentBook || !currentChapter)return;

await openChapter();

}

bookSelect.addEventListener("change",async()=>{

currentBook=bookSelect.value;
currentChapter=0;

chapterSelect.innerHTML=
'<option value="">اختر الأصحاح</option>';

chapterArea.hidden=true;

if(!currentBook){

chapterSelect.disabled=true;
return;

}

try{

const book=BOOKS.find(b=>b.id===currentBook);
const chapters=await getBookChapters(book);

chapters.forEach((chapter,index)=>{

const option=document.createElement("option");

option.value=index+1;
option.textContent=`الأصحاح ${index+1}`;

chapterSelect.appendChild(option);

});

chapterSelect.disabled=false;

}catch(error){

chapterSelect.disabled=true;

verses.innerHTML=
`<div class="error">تعذر تحميل هذا السفر.</div>`;

chapterArea.hidden=false;

}

});

chapterSelect.addEventListener("change",async()=>{

currentChapter=Number(chapterSelect.value);

if(currentChapter)
await showSelectedChapter();

});

oldButton.addEventListener("click",()=>selectTestament("old"));
newButton.addEventListener("click",()=>selectTestament("new"));

previousButton.addEventListener("click",async()=>{

if(currentChapter<=1)return;

currentChapter--;

chapterSelect.value=currentChapter;

await showSelectedChapter();

});

nextButton.addEventListener("click",async()=>{

const book=BOOKS.find(b=>b.id===currentBook);

if(!book)return;

try{

const chapters=await getBookChapters(book);

if(currentChapter>=chapters.length)return;

currentChapter++;

chapterSelect.value=currentChapter;

await showSelectedChapter();

}catch(e){}

});

async function init(){

fillBooks();

try{

const response=await fetch(LOCAL_BIBLE_URL,{cache:"no-store"});

if(response.ok){

const data=await response.json();

bibleData=Array.isArray(data)
?data
:(data.books||data.bible||data.data||[]);

}

}catch(error){

bibleData=[];

}

}

init();

</script>

</body>
</html>
