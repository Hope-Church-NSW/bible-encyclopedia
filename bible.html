<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
    --blue:#061a3a;
    --blue2:#0b2d63;
    --blue3:#124783;
    --gold:#d4af37;
    --gold2:#f4d675;
    --white:#ffffff;
    --text:#eef4ff;
    --card:#0a2550;
    --border:rgba(212,175,55,.45);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:"Tahoma","Arial",sans-serif;
    background:
        radial-gradient(circle at top,#123d76 0%,var(--blue) 45%,#020b1b 100%);
    color:var(--text);
}

body{
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.site-header{
    width:100%;
    min-height:105px;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    background:
        linear-gradient(135deg,#071b3d,#0c326d 55%,#061a3a);

    border-bottom:2px solid var(--gold);

    box-shadow:
        0 8px 30px rgba(0,0,0,.45),
        inset 0 -1px 0 rgba(244,214,117,.3);

    position:sticky;
    top:0;
    z-index:1000;
}

/* الرئيسية - يسار */
.home-button{
    direction:rtl;
    text-decoration:none;
    color:#fff;
    min-width:145px;
    height:54px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    border:1px solid var(--gold);
    border-radius:16px;

    background:
        linear-gradient(145deg,#174c8d,#092654);

    box-shadow:
        0 6px 0 #041329,
        0 10px 22px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.22);

    text-shadow:
        0 1px 0 #8c6d17,
        0 0 8px rgba(244,214,117,.4);

    font-size:18px;
    font-weight:bold;

    transition:.25s ease;
}

.home-button:hover{
    transform:translateY(-3px);
    box-shadow:
        0 9px 0 #041329,
        0 14px 28px rgba(0,0,0,.45),
        0 0 18px rgba(212,175,55,.35);
}

.home-icon{
    font-size:24px;
}

/* الشعار والكنيسة - يمين */
.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:76px;
    height:76px;
    object-fit:contain;

    filter:
        drop-shadow(0 4px 5px rgba(0,0,0,.5))
        drop-shadow(0 0 12px rgba(212,175,55,.35));

    transition:.3s ease;
}

.logo:hover{
    transform:scale(1.08) rotateY(8deg);
}

.brand-text{
    text-align:right;
}

.brand-ar{
    color:var(--gold2);
    font-size:22px;
    font-weight:900;
    margin-bottom:4px;

    text-shadow:
        0 2px 0 #765b0d,
        0 4px 8px rgba(0,0,0,.6),
        0 0 12px rgba(212,175,55,.3);
}

.brand-en{
    color:#fff;
    font-size:12px;
    letter-spacing:1px;
    opacity:.9;
}

/* =========================
   PAGE
========================= */

.page{
    width:min(1200px,94%);
    margin:28px auto 60px;
}

.page-title{
    text-align:center;
    margin:10px 0 28px;
}

.page-title h1{
    margin:0;
    font-size:34px;
    color:var(--gold2);

    text-shadow:
        0 2px 0 #70570f,
        0 5px 10px rgba(0,0,0,.6);
}

.page-title p{
    margin-top:8px;
    color:#d9e5fa;
    font-size:15px;
}

/* =========================
   CONTROLS
========================= */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;

    padding:22px;
    border:1px solid var(--border);
    border-radius:22px;

    background:
        linear-gradient(145deg,
            rgba(18,71,131,.82),
            rgba(4,24,53,.95));

    box-shadow:
        0 15px 35px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.1);
}

.control-box{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.control-box label{
    color:var(--gold2);
    font-weight:bold;
    font-size:16px;
}

select{
    width:100%;
    height:54px;

    padding:0 15px;

    color:#fff;
    background:#061d42;

    border:1px solid var(--gold);
    border-radius:14px;

    outline:none;
    font-size:17px;
    font-family:inherit;

    cursor:pointer;

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.35),
        0 4px 12px rgba(0,0,0,.2);
}

select:focus{
    box-shadow:
        0 0 0 3px rgba(212,175,55,.2),
        inset 0 2px 5px rgba(0,0,0,.35);
}

select option{
    color:#fff;
    background:#061d42;
}

/* =========================
   عهد
========================= */

.testament-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;

    margin-bottom:20px;
}

.testament{
    height:60px;

    border:1px solid var(--gold);
    border-radius:16px;

    color:#fff;
    background:
        linear-gradient(145deg,#123f78,#061d42);

    font-family:inherit;
    font-size:19px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 0 #031126,
        0 10px 20px rgba(0,0,0,.3);

    transition:.25s;
}

.testament:hover{
    transform:translateY(-2px);
}

.testament.active{
    color:#071a37;

    background:
        linear-gradient(145deg,
            var(--gold2),
            var(--gold));

    box-shadow:
        0 5px 0 #765b0d,
        0 10px 24px rgba(0,0,0,.35),
        0 0 18px rgba(212,175,55,.3);
}

/* =========================
   CHAPTER
========================= */

.chapter-area{
    margin-top:25px;
}

.chapter-title{
    text-align:center;

    margin:0 0 20px;

    color:var(--gold2);

    font-size:28px;

    text-shadow:
        0 2px 0 #735a12,
        0 4px 8px rgba(0,0,0,.5);
}

.verses{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.verse{
    position:relative;

    padding:18px 20px 18px 60px;

    border:1px solid rgba(212,175,55,.3);
    border-radius:17px;

    background:
        linear-gradient(145deg,
            rgba(15,55,105,.94),
            rgba(5,24,51,.97));

    box-shadow:
        0 8px 20px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.06);

    line-height:2.1;

    font-size:19px;

    transition:.2s;
}

.verse:hover{
    border-color:var(--gold);
    transform:translateY(-2px);
}

.verse-number{
    position:absolute;
    left:15px;
    top:15px;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#061a3a;

    background:
        linear-gradient(145deg,
            var(--gold2),
            var(--gold));

    font-weight:bold;

    box-shadow:
        0 3px 7px rgba(0,0,0,.4);
}

/* =========================
   NAVIGATION
========================= */

.chapter-navigation{
    display:flex;
    justify-content:space-between;
    gap:20px;

    margin-top:28px;
}

.nav-button{
    flex:1;

    min-height:54px;

    border:1px solid var(--gold);
    border-radius:15px;

    color:#fff;

    background:
        linear-gradient(145deg,#174c8d,#092654);

    font-family:inherit;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 0 #031126,
        0 9px 20px rgba(0,0,0,.3);

    transition:.25s;
}

.nav-button:hover:not(:disabled){
    transform:translateY(-3px);
}

.nav-button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   AUDIO
========================= */

.audio-box{
    margin-top:25px;
    padding:18px;

    border:1px solid var(--border);
    border-radius:18px;

    background:
        linear-gradient(145deg,
            rgba(15,55,105,.8),
            rgba(4,22,48,.95));

    text-align:center;
}

.audio-title{
    color:var(--gold2);
    font-weight:bold;
    margin-bottom:10px;
}

audio{
    width:100%;
    max-width:650px;
}

/* =========================
   STATUS
========================= */

.status{
    margin:20px 0;
    padding:15px;

    border-radius:14px;

    text-align:center;

    background:rgba(4,22,48,.8);
    border:1px solid rgba(212,175,55,.25);

    color:#dce8fa;
}

.error{
    color:#ffb3b3;
    border-color:#a44;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .site-header{
        min-height:88px;
        padding:10px 12px;
    }

    .logo{
        width:58px;
        height:58px;
    }

    .brand-ar{
        font-size:16px;
    }

    .brand-en{
        display:none;
    }

    .home-button{
        min-width:100px;
        height:46px;
        font-size:14px;
    }

    .page{
        width:94%;
        margin-top:20px;
    }

    .page-title h1{
        font-size:27px;
    }

    .controls{
        grid-template-columns:1fr;
        padding:15px;
    }

    .testament-buttons{
        grid-template-columns:1fr;
    }

    .verse{
        font-size:17px;
        padding:16px 18px 16px 52px;
    }

    .chapter-title{
        font-size:23px;
    }

    .chapter-navigation{
        flex-direction:row;
    }
}
</style>
</head>

<body>

<header class="site-header">

    <!-- الرئيسية -->
    <a class="home-button" href="./index.html" aria-label="الرئيسية">

        <div

        </div>


        <div class="chapter-navigation">

            <button

                التالي
            </button>

            <button
                id="previousButton"
                class="nav-button"
                type="button">
                السابق
            </button>

        </div>


        <section class="audio-box">

            <div class="audio-title">
                🎧 الكتاب المقدس المسموع
            </div>

            <audio
                id="audioPlayer"
                controls
                preload="none">
            </audio>

        </section>

    </section>

</main>


<script>

/* =========================================================
   مصدر الكتاب المقدس
   ========================================================= */

const BIBLE_URL = "./bible.json";


/* =========================================================
   أسماء الأسفار بالعربية
   ========================================================= */

const BOOKS = [

    {id:"01-gen", name:"التكوين", testament:"old"},

/* =========================================================
   تطبيع أسماء الكتب
   ========================================================= */

function normalizeBookId(value){

    if(!value) return "";

    let v =
        String(value)
        .trim()
        .toLowerCase()
        .replace(/_/g,"-")
        .replace(/\s+/g,"-");

    const aliases = {

        "01-gen":"01-gen",
        "02-exo":"02-exo",
        "03-lev":"03-lev",
        "04-num":"04-num",
        "05-deut":"05-deut",
        "06-josh":"06-josh",
        "07-judges":"07-judges",

        "08-ruth":"08-ruth",

        "09-1-samuel":"09-1-samuel",
        "10-2-samuel":"10-2-samuel",

        "11-1-kings":"11-1-kings",
        "12-2-kings":"12-2-kings",

        "13-1-chronicles":"13-1-chronicles",
        "14-2-chronicles":"14-2-chronicles",

        "15-ezra":"15-ezra",
        "16-nehemiah":"16-nehemiah",
        "17-esther":"17-esther",
        "18-job":"18-job",
        "19-psalms":"19-psalms",
        "20-proverbs":"20-proverbs",
        "21-ecclesiastes":"21-ecclesiastes",
        "22-song":"22-song",
        "23-isaiah":"23-isaiah",
        "24-jeremiah":"24-jeremiah",
        "25-lamentations":"25-lamentations",
        "26-ezekiel":"26-ezekiel",
        "27-daniel":"27-daniel",
        "28-hosea":"28-hosea",
        "29-joel":"29-joel",
        "30-amos":"30-amos",
        "31-obadiah":"31-obadiah",
        "32-jonah":"32-jonah",
        "33-micah":"33-micah",
        "34-nahum":"34-nahum",
        "35-habakkuk":"35-habakkuk",
        "36-zephaniah":"36-zephaniah",
        "37-haggai":"37-haggai",
        "38-zechariah":"38-zechariah",
        "39-malachi":"39-malachi",

        "40-matthew":"40-matthew",
        "41-mark":"41-mark",
        "42-luke":"42-luke",
        "43-john":"43-john",
        "44-acts":"44-acts",
        "45-romans":"45-romans",
        "46-1-corinthians":"46-1-corinthians",
        "47-2-corinthians":"47-2-corinthians",
        "48-galatians":"48-galatians",
        "49-ephesians":"49-ephesians",
        "50-philippians":"50-philippians",
        "51-colossians":"51-colossians",
        "52-1-thessalonians":"52-1-thessalonians",
        "53-2-thessalonians":"53-2-thessalonians",
        "54-1-timothy":"54-1-timothy",
        "55-2-timothy":"55-2-timothy",
        "56-titus":"56-titus",
        "57-philemon":"57-philemon",
        "58-hebrews":"58-hebrews",
        "59-james":"59-james",
        "60-1-peter":"60-1-peter",
        "61-2-peter":"61-2-peter",
        "62-1-john":"62-1-john",
        "63-2-john":"63-2-john",
        "64-3-john":"64-3-john",
        "65-jude":"65-jude",
        "66-revelation":"66-revelation"

    };

    if(aliases[v]) return aliases[v];

    /* البحث عن رقم السفر */
    const match = v.match(/^(\d{1,2})-/);

    if(match){

        const number =
            String(parseInt(match[1],10))
            .padStart(2,"0");

        const found =
            BOOKS.find(
                b => b.id.startsWith(number + "-")
            );

        if(found) return found.id;
    }

    return v;
}


/* =========================================================
   تطبيع البيانات
   ========================================================= */

function normalizeBible(raw){

    let rows = raw;

    if(
        raw &&
        !Array.isArray(raw) &&
        Array.isArray(raw.verses)
    ){
        rows = raw.verses;
    }

    if(
        raw &&
        !Array.isArray(raw) &&
        Array.isArray(raw.data)
    ){
        rows = raw.data;
    }

    if(!Array.isArray(rows)){
        throw new Error("صيغة bible.json غير مدعومة.");
    }

    return rows
        .filter(row =>
            row &&
            row.book != null &&
            row.chapter != null &&
            row.verse != null &&
            row.text != null
        )
        .map(row => ({
            book:normalizeBookId(row.book),
            chapter:Number(row.chapter),
            verse:Number(row.verse),
            text:String(row.text).trim()
        }))
        .filter(row =>
            row.book &&
            Number.isFinite(row.chapter) &&
            Number.isFinite(row.verse) &&
            row.text
        );
}


/* =========================================================
   تحميل الكتاب المقدس
========================================================= */

async function loadBible(){

    try{

        status.textContent =
            "جاري تحميل الكتاب المقدس...";

        const response =
            await fetch(
                BIBLE_URL + "?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const raw =
            await response.json();

        bibleData =
            normalizeBible(raw);

        if(!bibleData.length){
            throw new Error(
                "لم يتم العثور على آيات داخل bible.json."
            );
        }

        status.textContent =
            `تم تحميل ${bibleData.length.toLocaleString("ar-EG")} آية بنجاح.`;

        populateBooks();

    }catch(error){

        console.error(error);

        status.className =
            "status error";

        status.textContent =
            "تعذر تحميل الكتاب المقدس من bible.json. تأكد أن الملف موجود في المجلد الرئيسي للمستودع.";

    }

}


/* =========================================================
   اختيار العهد
========================================================= */

function selectTestament(testament){

    currentTestament =
        testament;

    currentBook = "";
    currentChapter = 0;

    oldButton.classList.toggle(
        "active",
        testament === "old"
    );

    newButton.classList.toggle(
        "active",
        testament === "new"
    );

    chapterArea.hidden = true;

    populateBooks();

}


/* =========================================================
   ملء قائمة الأسفار
========================================================= */

function populateBooks(){

    bookSelect.innerHTML =
        '<option value="">اختر السفر</option>';

    const availableBooks =
        BOOKS.filter(
            book =>
                book.testament ===
                currentTestament
        );

    const availableIds =
        new Set(
            bibleData.map(
                row => normalizeBookId(row.book)
            )
        );

    availableBooks.forEach(book => {

        const option =
            document.createElement("option");

        option.value =
            book.id;

        option.textContent =
            book.name;

        /*
         * لا نخفي أي سفر من القائمة حتى لو كان
         * ملف البيانات لا يحتوي عليه؛ لأن المطلوب
         * أن تظهر القائمة كاملة.
         */

        if(availableIds.has(book.id)){
            option.dataset.available =
                "true";
        }

        bookSelect.appendChild(option);

    });

    chapterSelect.innerHTML =
        '<option value="">اختر الأصحاح</option>';

    chapterSelect.disabled = true;

}


/* =========================================================
   اختيار السفر
========================================================= */

bookSelect.addEventListener(
    "change",
    function(){

        currentBook =
            normalizeBookId(
                this.value
            );

        currentChapter = 0;

        chapterArea.hidden = true;

        chapterSelect.innerHTML =
            '<option value="">اختر الأصحاح</option>';

        if(!currentBook){

            chapterSelect.disabled = true;
            return;

        }

        const chapters =
            getChapters(currentBook);

        chapters.forEach(chapter => {

            const option =
                document.createElement("option");

            option.value =
                chapter;

            option.textContent =
                "الأصحاح " +
                chapter;

            chapterSelect.appendChild(option);

        });

        chapterSelect.disabled =
            chapters.length === 0;

        if(chapters.length === 0){

            status.className =
                "status error";

            status.textContent =
                "لم يتم العثور على آيات لهذا السفر في bible.json.";

        }else{

            status.className =
                "status";

            status.textContent =
                `تم العثور على ${chapters.length} أصحاحًا في ${getBookName(currentBook)}.`;

        }

    }
);


/* =========================================================
   اختيار الأصحاح
========================================================= */

chapterSelect.addEventListener(
    "change",
    function(){

        const chapter =
            Number(this.value);

        if(!chapter) return;

        currentChapter =
            chapter;

        renderChapter(
            currentBook,
            currentChapter
        );

    }
);


/* =========================================================
   استخراج الأصحاحات
========================================================= */

function getChapters(bookId){

    return [
        ...new Set(
            bibleData
                .filter(
                    row =>
                        normalizeBookId(row.book) ===
                        bookId
                )
                .map(
                    row => Number(row.chapter)
                )
        )
    ].sort(
        (a,b)=>a-b
    );

}


/* =========================================================
   استخراج الآيات
========================================================= */

function getVerses(bookId,chapter){

    return bibleData
        .filter(
            row =>
                normalizeBookId(row.book) ===
                bookId &&
                Number(row.chapter) ===
                Number(chapter)
        )
        .sort(
            (a,b)=>
                Number(a.verse) -
                Number(b.verse)
        );

}


/* =========================================================
   اسم السفر
========================================================= */

function getBookName(bookId){

    const book =
        BOOKS.find(
            b => b.id === bookId
        );

    return book
        ? book.name
        : bookId;

}


/* =========================================================
   عرض الأصحاح
========================================================= */

function renderChapter(bookId,chapter){

    const verses =
        getVerses(
            bookId,
            chapter
        );

    if(!verses.length){

        chapterArea.hidden = true;

        status.className =
            "status error";

        status.textContent =
            `لم يتم العثور على آيات ${getBookName(bookId)} ${chapter} في bible.json.`;

        return;
    }

    chapterArea.hidden =
        false;

    status.className =
        "status";

    status.textContent =
        `تم تحميل ${verses.length.toLocaleString("ar-EG")} آية.`;

    chapterTitle.textContent =
        `${getBookName(bookId)} — الأصحاح ${chapter}`;


    versesContainer.innerHTML =
        "";


    verses.forEach(verse => {

        const article =
            document.createElement("article");

        article.className =
            "verse";

        const number =
            document.createElement("span");

        number.className =
            "verse-number";

        number.textContent =
            verse.verse;

        const text =
            document.createElement("div");

        text.textContent =
            verse.text;

        article.appendChild(number);
        article.appendChild(text);

        versesContainer.appendChild(article);

    });


    updateNavigation();

}


/* =========================================================
   التنقل بين الأصحاحات
========================================================= */

function getAllChapters(){

    return BOOKS
        .filter(
            b =>
                b.testament ===
                currentTestament
        )
        .flatMap(
            b =>
                getChapters(b.id)
                    .map(
                        chapter => ({
                            book:b.id,
                            chapter
                        })
                    )
        );

}


function updateNavigation(){

    const chapters =
        getAllChapters();

    const index =
        chapters.findIndex(
            item =>
                item.book === currentBook &&
                item.chapter === currentChapter
        );

    /*
     * في هذا التصميم:
     * السابق = الأصحاح السابق
     * التالي = الأصحاح التالي
     */

    previousButton.disabled =
        index <= 0;

    nextButton.disabled =
        index === -1 ||
        index >= chapters.length - 1;

}


previousButton.addEventListener(
    "click",
    function(){

        const chapters =
            getAllChapters();

        const index =
            chapters.findIndex(
                item =>
                    item.book === currentBook &&
                    item.chapter === currentChapter
            );

        if(index <= 0) return;

        const previous =
            chapters[index - 1];

        currentBook =
            previous.book;

        currentChapter =
            previous.chapter;

        bookSelect.value =
            currentBook;

        bookSelect.dispatchEvent(
            new Event("change")
        );

        chapterSelect.value =
            String(currentChapter);

        renderChapter(
            currentBook,
            currentChapter
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


nextButton.addEventListener(
    "click",
    function(){

        const chapters =
            getAllChapters();

        const index =
            chapters.findIndex(
                item =>
                    item.book === currentBook &&
                    item.chapter === currentChapter
            );

        if(
            index === -1 ||
            index >= chapters.length - 1
        ){
            return;
        }

        const next =
            chapters[index + 1];

        currentBook =
            next.book;

        currentChapter =
            next.chapter;

        bookSelect.value =
            currentBook;

        bookSelect.dispatchEvent(
            new Event("change")
        );

        chapterSelect.value =
            String(currentChapter);

        renderChapter(
            currentBook,
            currentChapter
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================================================
   التشغيل
========================================================= */

selectTestament("old");

loadBible();

</script>
