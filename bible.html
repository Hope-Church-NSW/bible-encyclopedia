<script>
document.addEventListener("DOMContentLoaded", async function () {

    const DATA_URL = "./bible.json";

    const ARABIC_BOOKS = [
        "التكوين","الخروج","اللاويين","العدد","التثنية",
        "يشوع","القضاة","راعوث","صموئيل الأول","صموئيل الثاني",
        "ملوك الأول","ملوك الثاني","أخبار الأيام الأول","أخبار الأيام الثاني",
        "عزرا","نحميا","أستير","أيوب","المزامير","الأمثال",
        "الجامعة","نشيد الأنشاد","إشعياء","إرميا","مراثي إرميا",
        "حزقيال","دانيال","هوشع","يوئيل","عاموس","عوبديا",
        "يونان","ميخا","ناحوم","حبقوق","صفنيا","حجي","زكريا","ملاخي",
        "متى","مرقس","لوقا","يوحنا","أعمال الرسل","رومية",
        "كورنثوس الأولى","كورنثوس الثانية","غلاطية","أفسس","فيلبي","كولوسي",
        "تسالونيكي الأولى","تسالونيكي الثانية","تيموثاوس الأولى","تيموثاوس الثانية",
        "تيطس","فليمون","العبرانيين","يعقوب","بطرس الأولى","بطرس الثانية",
        "يوحنا الأولى","يوحنا الثانية","يوحنا الثالثة","يهوذا","رؤيا يوحنا"
    ];

    const OLD_COUNT = 39;

    const bookSelect = document.getElementById("book");
    const chapterSelect = document.getElementById("chapter");
    const content = document.getElementById("content");
    const status = document.getElementById("status");

    if (!bookSelect || !chapterSelect || !content) {
        console.error("Bible UI elements were not found.");
        return;
    }

    let bible = [];

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getBookNumber(book) {
        const match = String(book ?? "").match(/^(\d{2})-/);
        return match ? Number(match[1]) : 999;
    }

    function getArabicBookName(book) {
        const n = getBookNumber(book);
        return ARABIC_BOOKS[n - 1] || book;
    }

    function isOldTestament(book) {
        return getBookNumber(book) <= OLD_COUNT;
    }

    function loadBible() {

        return fetch(DATA_URL + "?v=" + Date.now(), {
            cache: "no-store"
        })
        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            return response.json();
        })
        .then(data => {

            if (!Array.isArray(data)) {
                throw new Error(
                    "bible.json must be an array."
                );
            }

            bible = data
                .filter(item =>
                    item &&
                    item.book &&
                    item.chapter !== undefined &&
                    item.verse !== undefined &&
                    item.text
                )
                .map(item => ({
                    book: String(item.book),
                    chapter: Number(item.chapter),
                    verse: Number(item.verse),
                    text: String(item.text)
                }))
                .sort((a, b) => {

                    const bookDiff =
                        getBookNumber(a.book) -
                        getBookNumber(b.book);

                    if (bookDiff !== 0)
                        return bookDiff;

                    if (a.chapter !== b.chapter)
                        return a.chapter - b.chapter;

                    return a.verse - b.verse;
                });

            if (!bible.length) {
                throw new Error(
                    "No Bible verses found."
                );
            }

            buildBooks();

        })
        .catch(error => {

            console.error(
                "Bible loading failed:",
                error
            );

            status.innerHTML =
                "تعذر تحميل آيات الكتاب المقدس.<br>" +
                "تأكد من وجود bible.json بجوار bible.html.";

            content.innerHTML = "";

        });
    }

    function buildBooks() {

        const oldBooks = [];
        const newBooks = [];

        const seen = new Set();

        bible.forEach(item => {

            if (seen.has(item.book))
                return;

            seen.add(item.book);

            if (isOldTestament(item.book))
                oldBooks.push(item.book);
            else
                newBooks.push(item.book);
        });

        oldBooks.sort(
            (a,b) =>
                getBookNumber(a) -
                getBookNumber(b)
        );

        newBooks.sort(
            (a,b) =>
                getBookNumber(a) -
                getBookNumber(b)
        );

        bookSelect.innerHTML =
            '<option value="">اختر السفر</option>';

        const oldGroup =
            document.createElement("optgroup");

        oldGroup.label = "العهد القديم";

        oldBooks.forEach(book => {

            const option =
                document.createElement("option");

            option.value = book;
            option.textContent =
                getArabicBookName(book);

            oldGroup.appendChild(option);
        });

        const newGroup =
            document.createElement("optgroup");

        newGroup.label = "العهد الجديد";

        newBooks.forEach(book => {

            const option =
                document.createElement("option");

            option.value = book;
            option.textContent =
                getArabicBookName(book);

            newGroup.appendChild(option);
        });

        bookSelect.appendChild(oldGroup);
        bookSelect.appendChild(newGroup);

        /*
         * فتح التكوين تلقائيًا كبداية
         */

        const genesis =
            oldBooks.find(
                book => getBookNumber(book) === 1
            );

        if (genesis) {

            bookSelect.value = genesis;

            buildChapters();
        }

        status.textContent =
            "تم تحميل " +
            bible.length.toLocaleString("ar-EG") +
            " آية.";
    }

    function buildChapters() {

        const selectedBook =
            bookSelect.value;

        chapterSelect.innerHTML =
            '<option value="">اختر الأصحاح</option>';

        if (!selectedBook) {
            chapterSelect.disabled = true;
            content.innerHTML = "";
            return;
        }

        const chapters = [
            ...new Set(
                bible
                    .filter(item =>
                        item.book === selectedBook
                    )
                    .map(item =>
                        item.chapter
                    )
            )
        ].sort((a,b) => a-b);

        chapters.forEach(chapter => {

            const option =
                document.createElement("option");

            option.value = chapter;
            option.textContent =
                "الأصحاح " + chapter;

            chapterSelect.appendChild(option);
        });

        chapterSelect.disabled =
            chapters.length === 0;

        if (chapters.length) {

            chapterSelect.value =
                chapters[0];

            renderChapter();
        }
    }

    function renderChapter() {

        const book =
            bookSelect.value;

        const chapter =
            Number(chapterSelect.value);

        if (!book || !chapter) {
            content.innerHTML = "";
            return;
        }

        const verses =
            bible.filter(item =>
                item.book === book &&
                item.chapter === chapter
            );

        if (!verses.length) {

            content.innerHTML =
                '<div class="error">' +
                'لا توجد آيات لهذا الأصحاح.' +
                '</div>';

            return;
        }

        content.innerHTML =
            '<div class="chapter-title">' +
            escapeHTML(
                getArabicBookName(book)
            ) +
            ' — الأصحاح ' +
            chapter +
            '</div>' +

            verses.map(item => {

                return `
                    <div class="verse"
                         data-book="${escapeHTML(item.book)}"
                         data-chapter="${item.chapter}"
                         data-verse="${item.verse}">
                        <span class="vnum">
                            ${item.verse}
                        </span>
                        <span class="vtext">
                            ${escapeHTML(item.text)}
                        </span>
                    </div>
                `;

            }).join("");

        status.textContent =
            getArabicBookName(book) +
            " — الأصحاح " +
            chapter +
            " — " +
            verses.length +
            " آية";
    }

    /*
     * تغيير السفر
     */

    bookSelect.addEventListener(
        "change",
        buildChapters
    );

    /*
     * تغيير الأصحاح
     */

    chapterSelect.addEventListener(
        "change",
        renderChapter
    );

    /*
     * تشغيل الكتاب المقدس
     */

    await loadBible();

});
</script>
