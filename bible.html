<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
  --blue:#071d3a;
  --blue2:#0c315c;
  --blue3:#15528a;
  --gold:#d4af37;
  --gold2:#f5df83;
  --white:#fff;
  --bg:#eef4fb;
  --text:#17253b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(212,175,55,.08),transparent 30%),
    linear-gradient(135deg,#071d3a,#0d315d 35%,#eef4fb 35%);
  color:var(--text);
  min-height:100vh;
}

/* ================= HEADER ================= */

.topbar{
  height:86px;
  padding:8px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:
    linear-gradient(135deg,#06172e,#0b315d,#09284d);
  border-bottom:2px solid var(--gold);
  box-shadow:0 8px 25px rgba(0,0,0,.28);
  position:sticky;
  top:0;
  z-index:999;
}

.header-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  filter:
    drop-shadow(0 3px 3px rgba(0,0,0,.5))
    drop-shadow(0 0 7px rgba(212,175,55,.3));
}

.church-name{
  color:#fff;
  font-size:22px;
  font-weight:900;
  text-shadow:
    1px 1px 0 #8b6b13,
    2px 2px 0 #614b0c,
    0 3px 8px rgba(0,0,0,.5);
}

.church-name span{
  color:var(--gold2);
}

.header-left{
  display:flex;
  align-items:center;
}

/* إطار ذهبي ثلاثي الأبعاد */

.gold-frame{
  border:1px solid var(--gold2);
  border-radius:14px;
  background:
    linear-gradient(145deg,#1b4c7d,#071d3a);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -3px 0 rgba(0,0,0,.35),
    0 4px 0 #604b10,
    0 7px 15px rgba(0,0,0,.25);
  color:var(--gold2);
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  transition:.25s;
}

.gold-frame:hover{
  transform:translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 5px 0 #604b10,
    0 12px 22px rgba(0,0,0,.3);
}

.home-btn{
  padding:12px 20px;
}

/* ================= PAGE ================= */

.container{
  width:min(1100px,94%);
  margin:34px auto 60px;
}

.title{
  text-align:center;
  margin-bottom:25px;
}

.title h1{
  margin:0;
  font-size:40px;
  font-weight:950;
  background:linear-gradient(
    180deg,
    #f8e79a 0%,
    #d4af37 45%,
    #8b6811 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 2px 5px rgba(0,0,0,.18);
}

/* ================= CONTROLS ================= */

.control-panel{
  background:#fff;
  padding:25px;
  border-radius:22px;
  border:1px solid #d7e1ee;
  box-shadow:0 12px 35px rgba(7,29,58,.13);
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field label{
  display:block;
  margin-bottom:8px;
  font-weight:900;
  color:var(--blue);
}

select{
  width:100%;
  height:53px;
  border:2px solid #d7e1ee;
  border-radius:14px;
  background:#fff;
  color:#17253b;
  padding:0 15px;
  font-size:16px;
  outline:none;
  cursor:pointer;
}

select:focus{
  border-color:var(--blue3);
  box-shadow:0 0 0 4px rgba(21,82,138,.1);
}

/* ================= AUDIO ================= */

.audio-row{
  margin-top:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.audio-btn{
  padding:13px 25px;
  font-size:16px;
}

.audio-btn.active{
  background:
    linear-gradient(145deg,#d4af37,#8d6c13);
  color:#fff;
}

/* ================= STATUS ================= */

.status{
  text-align:center;
  margin-top:15px;
  min-height:24px;
  color:#66758a;
}

.status.error{
  color:#b42318;
  font-weight:800;
}

/* ================= CHAPTER ================= */

.chapter{
  display:none;
  margin-top:28px;
}

.chapter.show{
  display:block;
}

.chapter-header{
  padding:20px;
  border-radius:19px;
  color:#fff;
  background:
    linear-gradient(135deg,#071d3a,#15528a);
  border:1px solid var(--gold);
  box-shadow:0 8px 22px rgba(7,29,58,.2);
}

.chapter-header h2{
  margin:0;
  font-size:25px;
}

.verse{
  margin-top:12px;
  padding:19px 21px;
  background:#fff;
  border:1px solid #dce5f0;
  border-radius:17px;
  display:flex;
  align-items:flex-start;
  gap:16px;
  box-shadow:0 5px 16px rgba(7,29,58,.07);
}

.verse-no{
  flex:0 0 40px;
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(145deg,#d4af37,#87670e);
  color:#fff;
  font-weight:900;
  box-shadow:0 3px 7px rgba(0,0,0,.2);
}

.verse-text{
  font-size:19px;
  line-height:2.05;
}

/* ================= NAVIGATION ================= */

.chapter-nav{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-top:25px;
}

.nav-btn{
  min-width:150px;
  padding:13px 25px;
  text-align:center;
  font-size:17px;
}

.nav-btn.disabled{
  opacity:.4;
  pointer-events:none;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .topbar{
    height:auto;
    min-height:78px;
    padding:7px 10px;
  }

  .logo{
    width:54px;
    height:54px;
  }

  .church-name{
    font-size:14px;
  }

  .home-btn{
    padding:9px 12px;
    font-size:13px;
  }

  .title h1{
    font-size:31px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .verse-text{
    font-size:17px;
  }

  .nav-btn{
    min-width:0;
    flex:1;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="topbar">

  <div class="header-right">

    <img
      src="assets/logo.png"
      class="logo"
      alt="كنيسة رجاء الأمم سيدني"
    >

    <div class="church-name">
      كنيسة رجاء الأمم <span>سيدني</span>
    </div>

  </div>

  <div class="header-left">

    <a
      href="index.html"
      class="gold-frame home-btn"
    >
      🏠 الرئيسية
    </a>

  </div>

</header>


<main class="container">

  <div class="title">
    <h1>الكتاب المقدس</h1>
  </div>


  <!-- ================= SELECTORS ================= -->

  <section class="control-panel">

    <div class="controls">

      <div class="field">

        <label for="testament">
          العهد
        </label>

        <select id="testament">

          <option value="old">
            العهد القديم
          </option>

          <option value="new">
            العهد الجديد
          </option>

        </select>

      </div>


      <div class="field">

        <label for="book">
          السفر
        </label>

        <select id="book"></select>

      </div>


      <div class="field">

        <label for="chapterSelect">
          الأصحاح
        </label>

        <select id="chapterSelect"></select>

      </div>

    </div>


    <!-- ================= AUDIO ================= -->

    <div class="audio-row">

      <button
        id="audioBtn"
        class="gold-frame audio-btn"
        type="button"
      >
        🔊 الكتاب المقدس المسموع
      </button>

      <audio
        id="audioPlayer"
        controls
        style="display:none;margin-right:12px"
      ></audio>

    </div>


    <div
      id="status"
      class="status"
    >
      جاري تحميل الكتاب المقدس...
    </div>

  </section>


  <!-- ================= CHAPTER ================= -->

  <section
    id="chapter"
    class="chapter"
  >

    <div
      id="chapterHeader"
      class="chapter-header"
    ></div>

    <div id="verses"></div>


    <!-- ================= PREVIOUS / NEXT ================= -->

    <div class="chapter-nav">

      <button
        id="nextBtn"
        class="gold-frame nav-btn"
        type="button"
      >
        التالي →
      </button>

      <button
        id="prevBtn"
        class="gold-frame nav-btn"
        type="button"
      >
        ← السابق
      </button>

    </div>

  </section>

</main>


<script>

/* =========================================================
   أسماء الأسفار العربية + التقسيم
   ========================================================= */

const BOOKS = [

  /* ===== العهد القديم ===== */

  {id:"01-gen",name:"التكوين",chapters:50,testament:"old"},
  {id:"02-exo",name:"الخروج",chapters:40,testament:"old"},

  {id:"11-1ki",name:"ملوك الأول",chapters:22,testament:"old"},
  {id:"12-2ki",name:"ملوك الثاني",chapters:25,testament:"old"},
  {id:"13-1ch",name:"أخبار الأيام الأول",chapters:29,testament:"old"},
  {id:"14-2ch",name:"أخبار الأيام الثاني",chapters:36,testament:"old"},
  {id:"15-ezr",name:"عزرا",chapters:10,testament:"old"},

  {id:"23-isa",name:"إشعياء",chapters:66,testament:"old"},
  {id:"24-jer",name:"إرميا",chapters:52,testament:"old"},
  {id:"25-lam",name:"مراثي إرميا",chapters:5,testament:"old"},
  {id:"26-eze",name:"حزقيال",chapters:48,testament:"old"},
  {id:"27-dan",name:"دانيال",chapters:12,testament:"old"},
  {id:"28-hos",name:"هوشع",chapters:14,testament:"old"},
  {id:"29-joe",name:"يوئيل",chapters:3,testament:"old"},
  {id:"30-amo",name:"عاموس",chapters:9,testament:"old"},
  {id:"31-oba",name:"عوبديا",chapters:1,testament:"old"},
  {id:"32-jon",name:"يونان",chapters:4,testament:"old"},
  {id:"33-mic",name:"ميخا",chapters:7,testament:"old"},
  {id:"34-nah",name:"ناحوم",chapters:3,testament:"old"},
  {id:"35-hab",name:"حبقوق",chapters:3,testament:"old"},
  {id:"36-zep",name:"صفنيا",chapters:3,testament:"old"},
  {id:"37-hag",name:"حجي",chapters:2,testament:"old"},
  {id:"38-zec",name:"زكريا",chapters:14,testament:"old"},
  {id:"39-mal",name:"ملاخي",chapters:4,testament:"old"},

  /* ===== العهد الجديد ===== */

  {id:"40-mat",name:"متى",chapters:28,testament:"new"},
  {id:"41-mar",name:"مرقس",chapters:16,testament:"new"},
  {id:"42-luk",name:"لوقا",chapters:24,testament:"new"},
  {id:"43-joh",name:"يوحنا",chapters:21,testament:"new"},
  {id:"44-act",name:"أعمال الرسل",chapters:28,testament:"new"},
  {id:"45-rom",name:"رومية",chapters:16,testament:"new"},
  {id:"46-1co",name:"كورنثوس الأولى",chapters:16,testament:"new"},
  {id:"47-2co",name:"كورنثوس الثانية",chapters:13,testament:"new"},
  {id:"48-gal",name:"غلاطية",chapters:6,testament:"new"},
  {id:"49-eph",name:"أفسس",chapters:6,testament:"new"},
  {id:"50-phi",name:"فيلبي",chapters:4,testament:"new"},
  {id:"51-col",name:"كولوسي",chapters:4,testament:"new"},
  {id:"52-1th",name:"تسالونيكي الأولى",chapters:5,testament:"new"},
  {id:"53-2th",name:"تسالونيكي الثانية",chapters:3,testament:"new"},
  {id:"54-1ti",name:"تيموثاوس الأولى",chapters:6,testament:"new"},
  {id:"55-2ti",name:"تيموثاوس الثانية",chapters:4,testament:"new"},
  {id:"56-tit",name:"تيطس",chapters:3,testament:"new"},
  {id:"57-phm",name:"فليمون",chapters:1,testament:"new"},
  {id:"58-heb",name:"العبرانيين",chapters:13,testament:"new"},
  {id:"59-jam",name:"يعقوب",chapters:5,testament:"new"},
  {id:"60-1pe",name:"بطرس الأولى",chapters:5,testament:"new"},
  {id:"61-2pe",name:"بطرس الثانية",chapters:3,testament:"new"},
  {id:"62-1jo",name:"يوحنا الأولى",chapters:5,testament:"new"},
  {id:"63-2jo",name:"يوحنا الثانية",chapters:1,testament:"new"},
  {id:"64-3jo",name:"يوحنا الثالثة",chapters:1,testament:"new"},
  {id:"65-jud",name:"يهوذا",chapters:1,testament:"new"},
  {id:"66-rev",name:"رؤيا يوحنا",chapters:22,testament:"new"}

];


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const testament =
  document.getElementById("testament");

const book =
  document.getElementById("book");

const chapterSelect =
  document.getElementById("chapterSelect");

const chapter =
  document.getElementById("chapter");

const chapterHeader =
  document.getElementById("chapterHeader");

const verses =
  document.getElementById("verses");

const status =
  document.getElementById("status");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const audioBtn =
  document.getElementById("audioBtn");

const audioPlayer =
  document.getElementById("audioPlayer");


let bibleData = [];

let currentBook = null;

let currentChapter = 1;


/* =========================================================
   إنشاء قائمة الأسفار حسب العهد
   ========================================================= */

function populateBooks(){

  const selectedTestament =
    testament.value;

  book.innerHTML =
    '<option value="">اختر السفر</option>';

  const filtered =
    BOOKS.filter(
      b => b.testament === selectedTestament
    );

  filtered.forEach(item => {

    const option =
      document.createElement("option");

    option.value = item.id;

    option.textContent = item.name;

    book.appendChild(option);

  });

  chapterSelect.innerHTML =
    '<option value="">اختر الأصحاح</option>';

  chapterSelect.disabled = true;

  chapter.classList.remove("show");

  currentBook = null;

}


/* =========================================================
   إنشاء الأصحاحات
   ========================================================= */

function populateChapters(){

  const id = book.value;

  currentBook =
    BOOKS.find(
      b => b.id === id
    );

  chapterSelect.innerHTML =
    '<option value="">اختر الأصحاح</option>';

  if(!currentBook){

    chapterSelect.disabled = true;

    return;

  }

  for(
    let i=1;
    i<=currentBook.chapters;
    i++
  ){

    const option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      `الأصحاح ${i}`;

    chapterSelect.appendChild(option);

  }

  chapterSelect.disabled = false;

  chapterSelect.value = "1";

  currentChapter = 1;

  renderChapter();

}


/* =========================================================
   تحويل أي صيغة JSON إلى مصفوفة موحدة
   ========================================================= */

function normalizeData(data){

  const rows=[];


  /* الصيغة الحالية التي استخدمناها */

  if(Array.isArray(data)){

    data.forEach(item => {

      if(
        item &&
        typeof item === "object" &&
        !Array.isArray(item)
      ){

        rows.push(item);

      }

    });

  }


  /* verses */

  if(
    data &&
    Array.isArray(data.verses)
  ){

    data.verses.forEach(x =>
      rows.push(x)
    );

  }


  /* data */

  if(
    data &&
    Array.isArray(data.data)
  ){

    data.data.forEach(x =>
      rows.push(x)
    );

  }


  /* bible */

  if(
    data &&
    Array.isArray(data.bible)
  ){

    data.bible.forEach(x =>
      rows.push(x)
    );

  }


  return rows.map(item => ({

    book:String(
      item.book ??
      item.bookId ??
      item.book_id ??
      item.abbrev ??
      ""
    ).trim(),

    chapter:Number(
      item.chapter ??
      item.chapterNumber ??
      item.chapter_number ??
      0
    ),

    verse:Number(
      item.verse ??
      item.verseNumber ??
      item.verse_number ??
      0
    ),

    text:String(
      item.text ??
      item.verseText ??
      item.content ??
      ""
    ).trim()

  })).filter(
    x =>
      x.book &&
      x.chapter>0 &&
      x.verse>0 &&
      x.text
  );

}


/* =========================================================
   تحميل bible.json
   ========================================================= */

async function loadBible(){

  status.textContent =
    "جاري تحميل نص الكتاب المقدس...";

  try{

    const response =
      await fetch(
        "./bible.json?v="+Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }

    const data =
      await response.json();

    bibleData =
      normalizeData(data);


    if(!bibleData.length){

      throw new Error(
        "bible.json لا يحتوي على صيغة آيات قابلة للقراءة"
      );

    }


    status.textContent =
      "تم تحميل الكتاب المقدس بنجاح.";

    populateBooks();

  }

  catch(error){

    console.error(error);

    status.textContent =
      "تعذر تحميل نص الكتاب المقدس. تأكد من وجود bible.json في المجلد الرئيسي.";

    status.classList.add("error");

  }

}


/* =========================================================
   العثور على آيات الأصحاح
   ========================================================= */

function getChapterVerses(){

  if(!currentBook){

    return [];

  }

  const target =
    currentBook.id;

  return bibleData
    .filter(item =>
      item.book === target &&
      Number(item.chapter) ===
      Number(currentChapter)
    )
    .sort(
      (a,b)=>
        a.verse-b.verse
    );

}


/* =========================================================
   عرض الأصحاح
   ========================================================= */

function renderChapter(){

  if(!currentBook){

    return;

  }


  const data =
    getChapterVerses();


  chapterHeader.innerHTML =
    `<h2>${currentBook.name} — الأصحاح ${currentChapter}</h2>`;


  verses.innerHTML = "";


  if(!data.length){

    verses.innerHTML = `

      <div class="verse">

        <div class="verse-text">

          لا توجد آيات لهذا الأصحاح في
          <strong>bible.json</strong>.

        </div>

      </div>

    `;

  }

  else{

    data.forEach(item => {

      const row =
        document.createElement("div");

      row.className =
        "verse";


      const number =
        document.createElement("div");

      number.className =
        "verse-no";

      number.textContent =
        item.verse;


      const text =
        document.createElement("div");

      text.className =
        "verse-text";

      text.textContent =
        item.text;


      row.appendChild(number);

      row.appendChild(text);

      verses.appendChild(row);

    });

  }


  chapter.classList.add("show");

  updateNavigation();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   التنقل بين الأصحاحات
   ========================================================= */

function updateNavigation(){

  if(!currentBook){

    return;

  }


  prevBtn.classList.toggle(
    "disabled",
    currentChapter <= 1
  );


  nextBtn.classList.toggle(
    "disabled",
    currentChapter >=
    currentBook.chapters
  );

}


prevBtn.addEventListener(
  "click",
  function(){

    if(
      !currentBook ||
      currentChapter <= 1
    ){

      return;

    }

    currentChapter--;

    chapterSelect.value =
      String(currentChapter);

    renderChapter();

  }
);


nextBtn.addEventListener(
  "click",
  function(){

    if(
      !currentBook ||
      currentChapter >=
      currentBook.chapters
    ){

      return;

    }

    currentChapter++;

    chapterSelect.value =
      String(currentChapter);

    renderChapter();

  }
);


/* =========================================================
   تغيير العهد
   ========================================================= */

testament.addEventListener(
  "change",
  populateBooks
);


/* =========================================================
   تغيير السفر
   ========================================================= */

book.addEventListener(
  "change",
  populateChapters
);


/* =========================================================
   تغيير الأصحاح
   ========================================================= */

chapterSelect.addEventListener(
  "change",
  function(){

    if(!this.value){

      return;

    }

    currentChapter =
      Number(this.value);

    renderChapter();

  }
);


/* =========================================================
   الكتاب المقدس المسموع
   ========================================================= */

audioBtn.addEventListener(
  "click",
  function(){

    if(
      audioPlayer.style.display ===
      "none"
    ){

      /*
       * ضع ملف الصوت لاحقاً في:
       * assets/audio/
       *
       * يمكن ربط ملف صوت كل سفر/أصحاح
       * في المرحلة الخاصة بالصوت.
       */

      audioPlayer.style.display =
        "block";

      audioBtn.classList.add(
        "active"
      );

    }

    else{

      audioPlayer.style.display =
        "none";

      audioPlayer.pause();

      audioBtn.classList.remove(
        "active"
      );

    }

  }
);


/* =========================================================
   تشغيل
   ========================================================= */

populateBooks();

loadBible();

</script>
