<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>

:root{
  --blue:#061b35;
  --blue2:#0b315d;
  --blue3:#15558e;
  --gold:#d4af37;
  --gold2:#f6e28b;
  --white:#ffffff;
  --text:#17253b;
  --muted:#728198;
  --border:#d8e2ee;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    Tahoma,
    Arial,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 85% 5%,
      rgba(212,175,55,.10),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #061b35 0%,
      #0b315d 30%,
      #eef4fa 30%,
      #eef4fa 100%
    );

  color:var(--text);
}


/* =========================================================
   HEADER
   ========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:88px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 24px;

  background:
    linear-gradient(
      145deg,
      #04152a,
      #0b315d,
      #071f3d
    );

  border-bottom:
    2px solid var(--gold);

  box-shadow:
    0 8px 30px rgba(0,0,0,.35);
}


.header-right{
  display:flex;
  align-items:center;
  gap:15px;
}


.logo{
  width:72px;
  height:72px;

  object-fit:contain;

  filter:
    drop-shadow(0 4px 5px rgba(0,0,0,.55))
    drop-shadow(
      0 0 8px
      rgba(212,175,55,.30)
    );

  animation:
    logoFloat 5s ease-in-out infinite;
}


@keyframes logoFloat{

  0%,100%{
    transform:
      translateY(0)
      rotateY(0deg);
  }

  50%{
    transform:
      translateY(-3px)
      rotateY(12deg);
  }

}


.church-name{
  font-size:23px;
  font-weight:900;

  background:
    linear-gradient(
      180deg,
      #fff5b0,
      #f2d675 35%,
      #d4af37 65%,
      #8b6710
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:
    0 2px 0 #4d3808,
    0 4px 8px rgba(0,0,0,.45);
}


.header-left{
  display:flex;
  align-items:center;
}


.gold-button{
  border:
    1px solid var(--gold2);

  border-radius:14px;

  padding:
    12px 20px;

  background:
    linear-gradient(
      145deg,
      #1b4e80,
      #071c37
    );

  color:
    var(--gold2);

  font-size:16px;
  font-weight:900;

  text-decoration:none;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -3px 0 rgba(0,0,0,.35),
    0 4px 0 #67500d,
    0 8px 16px rgba(0,0,0,.25);

  transition:.25s;
}


.gold-button:hover{
  transform:translateY(-2px);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 6px 0 #67500d,
    0 13px 24px rgba(0,0,0,.3);
}


/* =========================================================
   MAIN
   ========================================================= */

.container{
  width:min(1180px,94%);

  margin:
    35px auto
    60px;
}


.page-title{
  text-align:center;

  margin-bottom:25px;
}


.page-title h1{

  margin:0;

  font-size:40px;
  font-weight:950;

  background:
    linear-gradient(
      180deg,
      #fff5b0,
      #f2d675 35%,
      #d4af37 65%,
      #80600e
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:
    0 3px 6px rgba(0,0,0,.20);
}


/* =========================================================
   CONTROL PANEL
   ========================================================= */

.control-panel{

  background:
    rgba(255,255,255,.97);

  border:
    1px solid var(--border);

  border-radius:22px;

  padding:25px;

  box-shadow:
    0 15px 40px
    rgba(7,29,58,.14);
}


.controls{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:18px;
}


.field label{

  display:block;

  margin-bottom:8px;

  font-weight:900;

  color:var(--blue);
}


select{

  width:100%;

  height:53px;

  padding:
    0 15px;

  border:
    2px solid var(--border);

  border-radius:14px;

  background:#fff;

  color:var(--text);

  font-size:16px;

  outline:none;

  cursor:pointer;
}


select:focus{

  border-color:
    var(--blue3);

  box-shadow:
    0 0 0 4px
    rgba(21,85,142,.12);
}


.status{

  text-align:center;

  margin-top:16px;

  min-height:25px;

  color:var(--muted);

  font-weight:600;
}


.status.error{

  color:#b42318;
}


/* =========================================================
   AUDIO
   ========================================================= */

.audio-area{

  margin-top:18px;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:12px;

  flex-wrap:wrap;
}


.audio-player{

  display:none;

  width:min(500px,100%);
}


/* =========================================================
   CHAPTER
   ========================================================= */

.chapter{

  display:none;

  margin-top:30px;
}


.chapter.visible{

  display:block;
}


.chapter-title{

  padding:20px;

  border-radius:18px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #061b35,
      #15558e
    );

  border:
    1px solid var(--gold);

  box-shadow:
    0 8px 24px
    rgba(7,29,58,.22);
}


.chapter-title h2{

  margin:0;

  text-align:center;

  font-size:26px;
}


/* =========================================================
   VERSES
   ========================================================= */

.verses-container{

  margin-top:15px;

  background:#fff;

  border:
    1px solid var(--border);

  border-radius:20px;

  padding:12px 20px;

  box-shadow:
    0 10px 30px
    rgba(7,29,58,.09);
}


.verse{

  display:flex;

  align-items:flex-start;

  gap:15px;

  padding:
    18px 5px;

  border-bottom:
    1px solid #e5ebf2;

  line-height:2.15;

  font-size:19px;
}


.verse:last-child{

  border-bottom:0;
}


.verse-number{

  flex:
    0 0 42px;

  width:42px;
  height:42px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #f0d76b,
      #967211
    );

  color:#fff;

  font-weight:900;

  box-shadow:
    0 3px 8px
    rgba(0,0,0,.22);
}


.verse-text{

  flex:1;

  white-space:pre-wrap;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.chapter-navigation{

  display:flex;

  justify-content:
    space-between;

  gap:15px;

  margin-top:22px;
}


.navigation-button{

  min-width:150px;

  text-align:center;
}


.navigation-button.disabled{

  opacity:.35;

  pointer-events:none;
}


/* =========================================================
   EMPTY / ERROR
   ========================================================= */

.message{

  padding:30px;

  text-align:center;

  color:var(--muted);

  line-height:2;
}


.debug{

  margin-top:15px;

  padding:12px;

  background:#f8fafc;

  border:
    1px dashed #cbd5e1;

  border-radius:12px;

  font-size:13px;

  direction:ltr;

  text-align:left;

  display:none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  .topbar{

    padding:
      7px 10px;

  }

  .logo{

    width:55px;
    height:55px;

  }

  .church-name{

    font-size:14px;

  }

  .gold-button{

  }

  .page-title h1{

  }

  .controls{

    grid-template-columns:1fr;

  }

  .verse{

    font-size:17px;

  }

  .chapter-navigation{

    flex-direction:row;

  }

  .navigation-button{

    min-width:0;

    flex:1;

  }

}

</style>

/* =========================================================
   3. NORMALIZE STRING
   ========================================================= */

function normalizeString(value){

  return String(value ?? "")
    .toLowerCase()
    .trim()
    .replace(/[\u200f\u200e]/g,"")
    .replace(/[\s_]+/g,"-")
    .replace(/[–—−]/g,"-")
    .replace(/[أإآ]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/[^a-z0-9\u0600-\u06ff:-]/g,"");

}

/* =========================================================
   5. MATCH BOOK
   ========================================================= */

function resolveBookId(value){

  const normalized =
    normalizeString(value);


  if(!normalized){

    return null;

  }


  for(
    const book of BOOKS
  ){

    const aliases =
      BOOK_ALIASES[book.id] || [];


    if(
      aliases.some(
        alias =>
          normalizeString(alias) ===
          normalized
      )
    ){

      return book.id;

    }

  }


  /* مطابقة جزئية */

  for(
    const book of BOOKS
  ){

    const aliases =
      BOOK_ALIASES[book.id] || [];


    if(
      aliases.some(
        alias => {

          const a =
            normalizeString(alias);

          return(
            normalized.includes(a) ||
            a.includes(normalized)
          );

        }
      )
    ){

      return book.id;

    }

  }


  return null;

}


/* =========================================================
   6. EXTRACT TEXT
   ========================================================= */

function extractText(obj){

  if(
    typeof obj === "string"
  ){

    return obj.trim();

  }


  if(!obj || typeof obj !== "object"){

    return "";

  }


  const candidates=[

    obj.text,
    obj.verseText,
    obj.content,
    obj.body,
    obj.value,
    obj.t

  ];


  for(
    const value of candidates
  ){

    if(
      typeof value === "string" &&
      value.trim()
    ){

      return value.trim();

    }

  }


  return "";

}


/* =========================================================
   7. EXTRACT NUMBER
   ========================================================= */

function numberValue(...values){

  for(
    const value of values
  ){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      const n =
        Number(value);

      if(
        Number.isFinite(n) &&
        n > 0
      ){

        return n;

      }

    }

  }

  return 0;

}


/* =========================================================
   8. PARSE REFERENCE
   ========================================================= */

function parseReference(reference){

  if(
    typeof reference !== "string"
  ){

    return null;

  }


  const value =
    reference
      .trim()
      .replace(/_/g," ")
      .replace(/\s+/g," ");


  /*
   أمثلة مقبولة:

   01-gen:1:1
   01-gen 1:1
   Genesis 1:1
   1 Peter 2:3
   2Pet 1:1
  */


  const match =
    value.match(
      /^(.+?)[\s:]+(\d+)[\s:]+(\d+)$/
    );


  if(!match){

    return null;

  }


  const resolved =
    resolveBookId(
      match[1]
    );


  if(!resolved){

    return null;

  }


  return {

    book:resolved,

    chapter:Number(match[2]),

    verse:Number(match[3])

  };

}


/* =========================================================
   9. PARSE SINGLE VERSE OBJECT
   ========================================================= */

function parseVerseObject(obj){

  if(
    !obj ||
    typeof obj !== "object" ||
    Array.isArray(obj)
  ){

    return null;

  }


  const text =
    extractText(obj);


  if(!text){

    return null;

  }


  let bookValue =
    obj.book ??
    obj.bookId ??
    obj.book_id ??
    obj.bookName ??
    obj.book_name ??
    obj.abbrev ??
    obj.abbreviation ??
    obj.b;


  let chapterValue =
    obj.chapter ??
    obj.chapterNumber ??
    obj.chapter_number ??
    obj.c;


  let verseValue =
    obj.verse ??
    obj.verseNumber ??
    obj.verse_number ??
    obj.v;


  const reference =
    obj.reference ??
    obj.ref ??
    obj.r ??
    obj.id;


  let parsedReference =
    null;


  if(reference){

    parsedReference =
      parseReference(
        String(reference)
      );

  }


  if(
    parsedReference
  ){

    if(!bookValue)
      bookValue =
        parsedReference.book;

    if(!chapterValue)
      chapterValue =
        parsedReference.chapter;

    if(!verseValue)
      verseValue =
        parsedReference.verse;

  }


  const bookId =
    resolveBookId(
      bookValue
    );


  const chapter =
    numberValue(
      chapterValue
    );


  const verse =
    numberValue(
      verseValue
    );


  if(
    !bookId ||
    !chapter ||
    !verse
  ){

    return null;

  }


  return {

    book:bookId,

    chapter,

    verse,

    text

  };

}


/* =========================================================
   10. RECURSIVE JSON READER
   ========================================================= */

function recursivelyExtract(node,context={}){

  const result=[];


  if(
    node === null ||
    node === undefined
  ){

    return result;

  }


  /*
   STRING

   لا نحاول تحويل أي string منفرد
   إلى آية إلا إذا كان لدينا
   سياق كتاب/أصحاح/عدد.
  */

  if(
    typeof node === "string"
  ){

    if(
      context.book &&
      context.chapter &&
      context.verse
    ){

      result.push({

        book:context.book,

        chapter:Number(context.chapter),

        verse:Number(context.verse),

        text:node.trim()

      });

    }

    return result;

  }


  /*
   ARRAY
  */

  if(
    Array.isArray(node)
  ){

    node.forEach(
      (item,index)=>{

        /*
         إذا كانت المصفوفة داخل
         كتاب/أصحاح فالعنصر قد يكون
         نص آية.
        */

        if(
          context.book &&
          context.chapter &&
          typeof item === "string"
        ){

          result.push({

            book:context.book,

            chapter:Number(context.chapter),

            verse:index+1,

            text:item.trim()

          });

        }

        else{

          result.push(
            ...recursivelyExtract(
              item,
              context
            )
          );

        }

      }
    );

    return result;

  }


  /*
   OBJECT
  */

  if(
    typeof node === "object"
  ){

    const direct =
      parseVerseObject(node);


    if(direct){

      result.push(direct);

      return result;

    }


    /*
     تحديد السياق
    */

    let nextContext={
      ...context
    };


    const candidateBook =
      node.book ??
      node.bookId ??
      node.book_id ??
      node.bookName ??
      node.book_name ??
      node.abbrev ??
      node.abbreviation ??
      node.name;


    const resolvedBook =
      resolveBookId(
        candidateBook
      );


    if(resolvedBook){

      nextContext.book =
        resolvedBook;

    }


    const candidateChapter =
      node.chapter ??
      node.chapterNumber ??
      node.chapter_number;


    if(
      candidateChapter
    ){

      const n =
        Number(candidateChapter);

      if(
        Number.isFinite(n) &&
        n > 0
      ){

        nextContext.chapter=n;

      }

    }


    const candidateVerse =
      node.verse ??
      node.verseNumber ??
      node.verse_number;


    if(
      candidateVerse
    ){

      const n =
        Number(candidateVerse);

      if(
        Number.isFinite(n) &&
        n > 0
      ){

        nextContext.verse=n;

      }

    }


    /*
     معالجة properties
    */

    for(
      const [key,value]
      of Object.entries(node)
    ){

      /*
       إذا كان key رقمًا
       فقد يكون رقم الأصحاح
       أو رقم الآية.
      */

      if(
        /^\d+$/.test(key)
      ){

        const number =
          Number(key);


        if(
          nextContext.book &&
          !nextContext.chapter
        ){

          result.push(
            ...recursivelyExtract(
              value,
              {
                ...nextContext,
                chapter:number
              }
            )
          );

          continue;

        }


        if(
          nextContext.book &&
          nextContext.chapter &&
          typeof value === "string"
        ){

          result.push({

            book:nextContext.book,

            chapter:Number(
              nextContext.chapter
            ),

            verse:number,

            text:value.trim()

          });

          continue;

        }

      }


      result.push(
        ...recursivelyExtract(
          value,
          nextContext
        )
      );

    }

  }


  return result;

}


/* =========================================================
   11. DEDUPLICATE
   ========================================================= */

function deduplicateVerses(rows){

  const map =
    new Map();


  rows.forEach(row=>{

    if(
      !row ||
      !row.book ||
      !row.chapter ||
      !row.verse ||
      !row.text
    ){

      return;

    }


    const key =
      `${row.book}|${row.chapter}|${row.verse}`;


    /*
     إذا كان هناك أكثر من نسخة
     نحتفظ بالنص الأطول.
    */

    const existing =
      map.get(key);


    if(
      !existing ||
      row.text.length >
      existing.text.length
    ){

      map.set(
        key,
        row
      );

    }

  });


  return Array.from(
    map.values()
  ).sort(
    (a,b)=>{

      const bookA =
        BOOKS.findIndex(
          x=>x.id===a.book
        );

      const bookB =
        BOOKS.findIndex(
          x=>x.id===b.book
        );


      if(bookA!==bookB)
        return bookA-bookB;


      if(a.chapter!==b.chapter)
        return a.chapter-b.chapter;


      return a.verse-b.verse;

    }
  );

}


/* =========================================================
   12. LOAD JSON
   ========================================================= */

async function loadJSON(url){

  const response =
    await fetch(
      `${url}?v=${Date.now()}`,
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      `${url} — HTTP ${response.status}`
    );

  }


  return response.json();

}


/* =========================================================
   13. LOAD BIBLE DATABASE
   ========================================================= */

async function loadBible(){

  statusElement.textContent =
    "جاري تحميل جميع آيات الكتاب المقدس...";


  debugElement.style.display =
    "none";


  try{

    /*
     المصدر الرئيسي
    */

    const mainData =
      await loadJSON(
        "./bible.json"
      );


    /*
     استخراج الآيات بطريقة recursive
     */

    const extracted =
      recursivelyExtract(
        mainData
      );


    /*
     2 بطرس إن وجد كملف مستقل
     */

    let extra=[];


    try{

      const peter =
        await loadJSON(
          "./2pet.json"
        );


      extra =
        recursivelyExtract(
          peter
        );

    }

    catch(error){

      console.warn(
        "2pet.json غير متاح:",
        error
      );

    }


    verses =
      deduplicateVerses(
        extracted.concat(extra)
      );


    /*
     تحقق حقيقي
     */

    if(
      verses.length === 0
    ){

      throw new Error(
        "لم يتم استخراج أي آية من bible.json"
      );

    }


    /*
     إحصائيات
     */

    const bookCount =
      new Set(
        verses.map(
          v=>v.book
        )
      ).size;


    const chapterCount =
      new Set(
        verses.map(
          v=>`${v.book}|${v.chapter}`
        )
      ).size;


    statusElement.textContent =
      `تم تحميل ${verses.length.toLocaleString("ar-EG")} آية من ${bookCount} سفرًا و ${chapterCount.toLocaleString("ar-EG")} أصحاحًا.`;


    /*
     إذا كان عدد الأسفار أقل من 66
     نعرض تحذيرًا تقنيًا بدل إظهار
     صفحة فارغة.
    */

    if(
      bookCount < 66
    ){

      debugElement.style.display =
        "block";

      debugElement.textContent =
        `تم العثور فعليًا على ${bookCount} سفرًا فقط داخل bible.json. الأسفار التي لم تُستخرج: ${
          BOOKS
            .filter(
              b =>
                !verses.some(
                  v=>v.book===b.id
                )
            )
            .map(
              b=>b.name
            )
            .join("، ")
        }`;

    }


    populateBooks();


  }

  catch(error){

    console.error(
      "Bible database error:",
      error
    );


    statusElement.textContent =
      "تعذر استخراج آيات الكتاب المقدس من bible.json.";


    statusElement.classList.add(
      "error"
    );


    debugElement.style.display =
      "block";


    debugElement.textContent =
      error.message;

  }

}


/* =========================================================
   14. POPULATE BOOKS
   ========================================================= */

function populateBooks(){

  const testament =
    testamentSelect.value;


  const list =
    BOOKS.filter(
      b =>
        b.testament ===
        testament
    );


  bookSelect.innerHTML =
    '<option value="">اختر السفر</option>';


  list.forEach(
    b=>{

      const option =
        document.createElement(
          "option"
        );


      option.value =
        b.id;


      option.textContent =
        b.name;


      bookSelect.appendChild(
        option
      );

    }
  );


  chapterSelect.innerHTML =
    '<option value="">اختر الأصحاح</option>';


  chapterSelect.disabled =
    true;


  currentBook=null;


  chapterSection.classList.remove(
    "visible"
  );


  versesContainer.innerHTML="";

}


/* =========================================================
   15. POPULATE CHAPTERS
   ========================================================= */

function populateChapters(){

  const id =
    bookSelect.value;


  currentBook =
    BOOKS.find(
      b=>b.id===id
    );


  chapterSelect.innerHTML =
    '<option value="">اختر الأصحاح</option>';


  if(!currentBook){

    chapterSelect.disabled=true;

    return;

  }


  /*
   نستخدم البيانات الفعلية
   وليس عدد الأصحاحات النظري فقط.
  */

  const chapters =
    [
      ...new Set(
        verses
          .filter(
            v =>
              v.book ===
              currentBook.id
          )
          .map(
            v =>
              Number(v.chapter)
          )
          .filter(
            Number.isFinite
          )
      )
    ]
    .sort(
      (a,b)=>a-b
    );


  /*
   إذا كانت البيانات ناقصة
   نستطيع عرض القائمة الكاملة
   لكن لن نخترع الآيات.
  */

  const finalChapters =
    chapters.length
      ? chapters
      : Array.from(
          {
            length:
              currentBook.chapters
          },
          (_,i)=>i+1
        );


  finalChapters.forEach(
    c=>{

      const option =
        document.createElement(
          "option"
        );


      option.value =
        c;


      option.textContent =
        `الأصحاح ${c}`;


      chapterSelect.appendChild(
        option
      );

    }
  );


  chapterSelect.disabled=false;


  chapterSelect.value =
    String(
      finalChapters[0]
    );


  currentChapter =
    finalChapters[0];


  renderChapter();

}


/* =========================================================
   16. RENDER CHAPTER
   ========================================================= */

function renderChapter(){

  if(!currentBook){

    return;

  }


  const rows =
    verses
      .filter(
        v =>
          v.book ===
          currentBook.id &&
          Number(v.chapter) ===
          Number(currentChapter)
      )
      .sort(
        (a,b)=>
          Number(a.verse) -
          Number(b.verse)
      );


  chapterTitle.innerHTML =
    `
      <h2>
        ${currentBook.name}
        — الأصحاح ${currentChapter}
      </h2>
    `;


  versesContainer.innerHTML="";


  if(!rows.length){

    versesContainer.innerHTML =
      `
        <div class="message">

          لا توجد آيات مستخرجة لهذا الأصحاح
          من ملف <strong>bible.json</strong>.

          <br><br>

          السفر:
          <strong>${currentBook.name}</strong>

          <br>

          الأصحاح:
          <strong>${currentChapter}</strong>

        </div>
      `;

  }

  else{

    rows.forEach(
      verse=>{

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "verse";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "verse-number";


        number.textContent =
          verse.verse;


        const text =
          document.createElement(
            "div"
          );


        text.className =
          "verse-text";


        text.textContent =
          verse.text;


        row.appendChild(
          number
        );


        row.appendChild(
          text
        );


        versesContainer.appendChild(
          row
        );

      }
    );

  }


  chapterSection.classList.add(
    "visible"
  );


  updateNavigation();


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================================
   17. NAVIGATION
   ========================================================= */

function updateNavigation(){

  if(!currentBook){

    return;

  }


  previousButton.classList.toggle(
    "disabled",
    currentChapter <= 1
  );


  nextButton.classList.toggle(
    "disabled",
    currentChapter >=
    currentBook.chapters
  );

}


previousButton.onclick =
function(){

  if(
    !currentBook ||
    currentChapter <= 1
  ){

    return;

  }


  currentChapter--;


  chapterSelect.value =
    String(
      currentChapter
    );


  renderChapter();

};


nextButton.onclick =
function(){

  if(
    !currentBook ||
    currentChapter >=
    currentBook.chapters
  ){

    return;

  }


  currentChapter++;


  chapterSelect.value =
    String(
      currentChapter
    );


  renderChapter();

};


/* =========================================================
   18. TESTAMENT
   ========================================================= */

testamentSelect.onchange =
function(){

  populateBooks();

};


/* =========================================================
   19. BOOK
   ========================================================= */

bookSelect.onchange =
function(){

  populateChapters();

};


/* =========================================================
   20. CHAPTER
   ========================================================= */

chapterSelect.onchange =
function(){

  if(!this.value){

    return;

  }


  currentChapter =
    Number(
      this.value
    );


  renderChapter();

};


/* =========================================================
   21. AUDIO
   ========================================================= */

audioButton.onclick =
function(){

  if(
    audioPlayer.style.display ===
    "block"
  ){

    audioPlayer.pause();

    audioPlayer.style.display =
      "none";

    return;

  }


  /*
   مجلد الصوت:
   assets/audio/

   عند إضافة ملف الصوت
   يمكن ربطه هنا حسب السفر والأصحاح.
  */

  if(
    currentBook
  ){

    const file =
      `assets/audio/${currentBook.id}-${currentChapter}.mp3`;


    audioPlayer.src =
      file;

    audioPlayer.style.display =
      "block";

    audioPlayer.load();

    audioPlayer.play()
      .catch(
        ()=>{}
      );

  }

  else{

    alert(
      "اختر السفر والأصحاح أولاً."
    );

  }

};


/* =========================================================
   22. INITIALIZE
   ========================================================= */

populateBooks();

loadBible();

</script>

</body>
</html>
