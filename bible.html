<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>الكتاب المقدس | Hope Church NSW</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
<style>
:root{
    --bg:#06111f;
    --card:#0d2238;
    --card-hover:#143554;
    --gold:#d4af37;
    --gold-light:#f4d76b;
    --gold-glow: rgba(212, 175, 55, 0.4);
    --blue:#35a7ff;
    --text:#f5f7fa;
    --muted:#9eafc1;
    --border:#1d3d5c;
}
 
*{
    box-sizing:border-box;
}
 
body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#123457 0%,transparent 45%),
        linear-gradient(145deg,#040c17,#091d32 60%,#051220);
    color:var(--text);
    font-family: 'Times New Roman', Times, serif, Arial;
    overflow-x: hidden;
}
 
/* HEADER */
header{
    padding:16px 6%;
    border-bottom:1px solid var(--border);
    background:rgba(5,16,29,.92);
    backdrop-filter:blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
}
 
.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}
 
.brand{
    display:flex;
    align-items:center;
    gap:18px;
    cursor: pointer;
}
 
.logo{
    width:70px;
    height:70px;
    object-fit:contain;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    animation: rotateLogo 6s infinite ease-in-out;
}
 
@keyframes rotateLogo {
    0%, 50% { transform: rotateY(0deg); }
    100% { transform: rotateY(-360deg); }
}
 
.brand h1{
    margin:0;
    font-size:26px;
    font-weight: 900;
    background: linear-gradient(180deg, #ffe893 0%, #f4d76b 35%, #ca9e2e 70%, #8a640f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--gold-light);
    text-decoration: none;
    font-weight: bold;
    border: 1px solid var(--gold);
    padding: 8px 16px;
    border-radius: 8px;
    background: rgba(212, 175, 55, 0.1);
    transition: all 0.3s ease;
}

.nav-back:hover {
    background: var(--gold);
    color: #000;
}
 
/* MAIN CONTENT */
main{
    max-width:1200px;
    margin:auto;
    padding:30px 6%;
}

/* BREADCRUMB / NAVIGATION BAR */
.breadcrumb {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(13, 34, 56, 0.8);
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 25px;
    font-size: 18px;
    color: var(--gold-light);
}

.breadcrumb span {
    cursor: pointer;
    transition: color 0.2s;
}

.breadcrumb span:hover {
    color: #fff;
}

.breadcrumb i {
    font-size: 14px;
    color: var(--muted);
}

/* TESTAMENTS GRID */
.testaments-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.testament-column {
    background: linear-gradient(145deg, rgba(17, 45, 72, 0.9), rgba(9, 29, 49, 0.9));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.testament-title {
    text-align: center;
    color: var(--gold-light);
    font-size: 26px;
    margin-top: 0;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--gold);
}

/* BOOKS LIST */
.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
}

.book-btn {
    background: rgba(6, 17, 31, 0.7);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.25s ease;
    font-family: inherit;
}

.book-btn:hover {
    border-color: var(--gold);
    background: var(--card-hover);
    color: var(--gold-light);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* CHAPTERS GRID */
.chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 12px;
    margin-top: 20px;
}

.chapter-btn {
    background: rgba(17, 45, 72, 0.8);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    height: 55px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s ease;
}

.chapter-btn:hover {
    background: var(--gold);
    color: #000;
    transform: scale(1.08);
}

/* VERSES VIEW */
.verses-container {
    background: linear-gradient(135deg, rgba(20, 53, 84, 0.8), rgba(9, 29, 50, 0.9));
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 20px;
    padding: 30px;
    line-height: 2.2;
    font-size: 22px;
}

.verse-item {
    margin-bottom: 18px;
    border-bottom: 1px dashed rgba(212, 175, 55, 0.15);
    padding-bottom: 12px;
}

.verse-num {
    color: var(--gold);
    font-weight: bold;
    margin-left: 8px;
    font-size: 18px;
    background: rgba(212, 175, 55, 0.15);
    padding: 2px 8px;
    border-radius: 6px;
}

/* LOADING & ERROR STATES */
.loading-box {
    text-align: center;
    padding: 50px;
    font-size: 22px;
    color: var(--gold-light);
}

@media(max-width: 850px) {
    .testaments-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
 
<body>
 
<header>
    <div class="header-inner">
        <div class="brand" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" class="logo" alt="Logo">
            <h1>كنيسة رجاء الأمم سيدني</h1>
        </div>
        <a href="index.html" class="nav-back"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>
</header>
 
<main>
    <div class="breadcrumb" id="breadcrumb">
        <span onclick="showBooks()"><i class="fa-solid fa-book-bible"></i> الكتاب المقدس</span>
    </div>

    <div id="mainView">
        <div class="loading-box" id="loadingText">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الكتاب المقدس...
        </div>
    </div>
</main>

<script>
let bibleData = null;
let currentBook = null;
let currentChapter = null;

// LOAD BIBLE DATA FROM bible.json
async function loadBible() {
    try {
        const response = await fetch('bible.json');
        if (!response.ok) throw new Error("تعذر تحميل ملف البيانات");
        bibleData = await response.json();
        showBooks();
    } catch (error) {
        document.getElementById('mainView').innerHTML = `
            <div style="text-align:center; color:#ff6b6b; padding:40px; font-size:20px;">
                <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>
                خطأ في تحميل ملف الكتاب المقدس (bible.json). يرجى التأكد من وجود الملف.
            </div>`;
    }
}

// 1. SHOW OLD & NEW TESTAMENTS (BOOKS)
function showBooks() {
    currentBook = null;
    currentChapter = null;
    updateBreadcrumb();

    if (!bibleData) return;

    // Split books between Old and New Testament
    // Standard rule: 39 books for Old Testament, 27 for New Testament
    const otBooks = bibleData.slice(0, 39);
    const ntBooks = bibleData.slice(39);

    let html = `
    <div class="testaments-container">
        <div class="testament-column">
            <h2 class="testament-title">العهد القديم</h2>
            <div class="books-grid">
                ${otBooks.map((book, idx) => `
                    <button class="book-btn" onclick="selectBook(${idx})">${book.name}</button>
                `).join('')}
            </div>
        </div>

        <div class="testament-column">
            <h2 class="testament-title">العهد الجديد</h2>
            <div class="books-grid">
                ${ntBooks.map((book, idx) => `
                    <button class="book-btn" onclick="selectBook(${idx + 39})">${book.name}</button>
                `).join('')}
            </div>
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// 2. SELECT BOOK & SHOW CHAPTERS
function selectBook(bookIndex) {
    currentBook = bibleData[bookIndex];
    currentChapter = null;
    updateBreadcrumb();

    let html = `
    <div class="testament-column">
        <h2 class="testament-title">${currentBook.name} — اختر الأصحاح</h2>
        <div class="chapters-grid">
            ${currentBook.chapters.map((chap, cIdx) => `
                <button class="chapter-btn" onclick="selectChapter(${cIdx})">${cIdx + 1}</button>
            `).join('')}
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// 3. SELECT CHAPTER & SHOW VERSES
function selectChapter(chapterIndex) {
    currentChapter = chapterIndex;
    updateBreadcrumb();

    const chapterData = currentBook.chapters[chapterIndex];

    let html = `
    <div class="verses-container">
        <h2 class="testament-title" style="margin-bottom:25px;">
            ${currentBook.name} — الأصحاح ${chapterIndex + 1}
        </h2>
        <div>
            ${chapterData.map((verse, vIdx) => `
                <div class="verse-item">
                    <span class="verse-num">${vIdx + 1}</span>
                    <span>${verse}</span>
                </div>
            `).join('')}
        </div>
    </div>`;

    document.getElementById('mainView').innerHTML = html;
}

// BREADCRUMB UPDATE
function updateBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    let html = `<span onclick="showBooks()"><i class="fa-solid fa-book-bible"></i> الكتاب المقدس</span>`;
    
    if (currentBook) {
        html += ` <i class="fa-solid fa-chevron-left"></i> <span onclick="selectBook(${bibleData.indexOf(currentBook)})">${currentBook.name}</span>`;
    }
    if (currentChapter !== null) {
        html += ` <i class="fa-solid fa-chevron-left"></i> <span>الأصحاح ${currentChapter + 1}</span>`;
    }
    
    bc.innerHTML = html;
}

// Initialize
loadBible();
</script>
 
</body>
</html>
