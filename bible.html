<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
  --bg:#061321;
  --card:#0d2138;
  --card2:#102a46;
  --gold:#d4af37;
  --gold2:#f4d978;
  --text:#f4f7fb;
  --muted:#a8b8c9;
  --line:#1d3b59;
  --blue:#2d7ff9;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(45,127,249,.12),transparent 35%),
    linear-gradient(145deg,#061321,#0b1d31);
  color:var(--text);
  font-family:Arial,"Tahoma",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:18px 5%;
  background:rgba(6,19,33,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:78px;
  height:78px;
  object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(212,175,55,.35));
}

.church-name{
  margin:0;
  color:var(--gold2);
  font-size:25px;
  font-weight:800;
  text-shadow:
    0 2px 0 #8b6f13,
    0 4px 8px rgba(0,0,0,.45);
}

.church-sub{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.home-link{
  color:var(--gold2);
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
  text-shadow:0 2px 5px #000;
}

main{
  max-width:1200px;
  margin:auto;
  padding:28px 5% 50px;
}

h1{
  margin:0 0 24px;
  text-align:center;
  color:var(--gold2);
  font-size:34px;
  text-shadow:0 3px 8px rgba(0,0,0,.5);
}

.bible-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:20px;
}

.covenant{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  background:linear-gradient(145deg,#0d2138,#102a46);
  color:var(--text);
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.covenant:hover,
.covenant.active{
  border-color:var(--gold);
  box-shadow:0 0 20px rgba(212,175,55,.16);
  transform:translateY(-2px);
}

.controls{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

select,
input,
button{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  padding:13px;
  font-size:16px;
}

select:focus,
input:focus{
  outline:none;
  border-color:var(--gold);
}

.status{
  color:var(--muted);
  margin-bottom:14px;
  font-size:14px;
  text-align:center;
}

.panel{
  background:rgba(13,33,56,.95);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

.verse{
  padding:16px 5px;
  border-bottom:1px solid #17344f;
  line-height:2.15;
  font-size:19px;
  cursor:pointer;
  transition:.2s;
}

.verse:hover{
  background:rgba(45,127,249,.07);
}

.vnum{
  display:inline-block;
  color:var(--gold2);
  font-weight:bold;
  margin-left:9px;
  min-width:28px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px;
}

.debug{
  margin-top:15px;
  padding:10px;
  border-radius:10px;
  background:#091a2b;
  color:#8fa4ba;
  font-size:12px;
  text-align:center;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

@media(max-width:760px){
  .header-inner{
    align-items:flex-start;
  }

  .logo{
    width:64px;
    height:64px;
  }

  .church-name{
    font-size:19px;
  }

  .home-link{
    font-size:14px;
  }

  .bible-tabs,
  .controls{
    grid-template-columns:1fr;
  }

  h1{
    font-size:28px;
  }

  .verse{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img
        class="logo"
        src="assets/logo.png"
        alt="Hope Church NSW">
      <div>
        <h2 class="church-name">كنيسة رجاء الأمم سيدني</h2>
        <p class="church-sub">Hope Church NSW</p>
      </div>
    </div>

    <a class="home-link" href="index.html">الرئيسية</a>

  </div>
</header>

<main>

  <h1>الكتاب المقدس</h1>

  <div class="bible-tabs">

    <button
      id="oldBtn"
      class="covenant active"
      type="button">
      ✝ العهد القديم
    </button>

    <button
      id="newBtn"
      class="covenant"
      type="button">
      ✝ العهد الجديد
    </button>

  </div>

  <div class="controls">

    <select id="book">
      <option value="">اختر السفر</option>
    </select>

    <select id="chapter" disabled>
      <option value="">اختر الأصحاح</option>
    </select>

  </div>

  <div class="panel">

    <div id="status" class="status">
      جاري تحميل الكتاب المقدس...
    </div>

    <div id="content">
      <div class="empty">
        اختر السفر ثم الأصحاح.
      </div>
    </div>

    <div id="debug" class="debug">
      جاري التحقق من بيانات الكتاب المقدس...
    </div>

  </div>

</main>

<footer>
  كنيسة رجاء الأمم سيدني — Hope Church NSW
</footer>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const BIBLE_URL = "bible.json";

/* =========================================================
   DOM
========================================================= */

const bookSelect = document.getElementById("book");
const chapterSelect = document.getElementById("chapter");
const content = document.getElementById("content");
const statusBox = document.getElementById("status");
const debugBox = document.getElementById("debug");
const oldBtn = document.getElementById("oldBtn");
const newBtn = document.getElementById("newBtn");

/* =========================================================
   DATA
========================================================= */

let verses = [];
let currentCovenant = "old";

/* =========================================================
   BOOKS
========================================================= */

const OLD_BOOKS = [
  ["01-gen","التكوين"],
  ["02-exo","الخروج"],
  ["03-lev","اللاويين"],
  ["04-num","العدد"],
  ["05-deu","التثنية"],
  ["06-jos","يشوع"],
  ["07-jud","القضاة"],
  ["08-rut","راعوث"],
  ["09-1sam","صموئيل الأول"],
  ["10-2sam","صموئيل الثاني"],
  ["11-1kgs","ملوك الأول"],
  ["12-2kgs","ملوك الثاني"],
  ["13-1chr","أخبار الأيام الأول"],
  ["14-2chr","أخبار الأيام الثاني"],
  ["15-ezr","عزرا"],
  ["16-neh","نحميا"],
  ["17-est","أستير"],
  ["18-job","أيوب"],
  ["19-psa","المزامير"],
  ["20-pro","الأمثال"],
  ["21-ecc","الجامعة"],
  ["22-son","نشيد الأنشاد"],
  ["23-isa","إشعياء"],
  ["24-jer","إرميا"],
  ["25-lam","مراثي إرميا"],
  ["26-eze","حزقيال"],
  ["27-dan","دانيال"],
  ["28-hos","هوشع"],
  ["29-joe","يوئيل"],
  ["30-amo","عاموس"],
  ["31-oba","عوبديا"],
  ["32-jon","يونان"],
  ["33-mic","ميخا"],
  ["34-nah","ناحوم"],
  ["35-hab","حبقوق"],
  ["36-zep","صفنيا"],
  ["37-hag","حجي"],
  ["38-zec","زكريا"],
  ["39-mal","ملاخي"]
];

const NEW_BOOKS = [
  ["40-mat","متى"],
  ["41-mar","مرقس"],
  ["42-luk","لوقا"],
  ["43-joh","يوحنا"],
  ["44-act","أعمال الرسل"],
  ["45-rom","رومية"],
  ["46-1cor","كورنثوس الأولى"],
  ["47-2cor","كورنثوس الثانية"],
  ["48-gal","غلاطية"],
  ["49-eph","أفسس"],
  ["50-phi","فيلبي"],
  ["51-col","كولوسي"],
  ["52-1th","تسالونيكي الأولى"],
  ["53-2th","تسالونيكي الثانية"],
  ["54-1tim","تيموثاوس الأولى"],
  ["55-2tim","تيموثاوس الثانية"],
  ["56-tit","تيطس"],
  ["57-phm","فليمون"],
  ["58-heb","العبرانيين"],
  ["59-jas","يعقوب"],
  ["60-1pet","بطرس الأولى"],
  ["61-2pet","بطرس الثانية"],
  ["62-1joh","يوحنا الأولى"],
  ["63-2joh","يوحنا الثانية"],
  ["64-3joh","يوحنا الثالثة"],
  ["65-jud","يهوذا"],
  ["66-rev","رؤيا يوحنا"]
];

/* =========================================================
   NORMALIZATION
   هذه النقطة مهمة جداً لإصلاح اختلاف ID الخاص بـ 2بط
========================================================= */

function normalizeText(value){

  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/[\s_\-]+/g,"")
    .replace(/[أإآ]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه");

}

/*
  تحويل أي صيغة شائعة لاسم بطرس الثانية إلى ID موحد.
*/

function normalizeBookId(value){

  const raw = String(value ?? "").trim();

  const n = normalizeText(raw);

  const aliases = {

    "2pet":"61-2pet",
    "2peter":"61-2pet",
    "2petr":"61-2pet",
    "2pt":"61-2pet",
    "2بط":"61-2pet",
    "٢بط":"61-2pet",
    "٢بط":"61-2pet",
    "بطرسالثانية":"61-2pet",
    "بطرس2":"61-2pet",
    "بطرسالرسولالثانية":"61-2pet",
    "secondpeter":"61-2pet"

  };

  if(aliases[raw]) return aliases[raw];

  if(aliases[n]) return aliases[n];

  return raw;

}

/* =========================================================
   BOOK NAME LOOKUP
========================================================= */

const allBooks = [...OLD_BOOKS,...NEW_BOOKS];

const BOOK_NAME_MAP = new Map(allBooks);

/* =========================================================
   COVENANT
========================================================= */

function getBookList(){

  return currentCovenant === "old"
    ? OLD_BOOKS
    : NEW_BOOKS;

}

function setCovenant(type){

  currentCovenant = type;

  oldBtn.classList.toggle("active",type === "old");
  newBtn.classList.toggle("active",type === "new");

  fillBooks();

  chapterSelect.innerHTML =
    '<option value="">اختر الأصحاح</option>';

  chapterSelect.disabled = true;

  content.innerHTML =
    '<div class="empty">اختر السفر ثم الأصحاح.</div>';

  statusBox.textContent =
    currentCovenant === "old"
      ? "العهد القديم"
      : "العهد الجديد";

}

/* =========================================================
   BOOK LIST
========================================================= */

function fillBooks(){

  const list = getBookList();

  bookSelect.innerHTML =
    '<option value="">اختر السفر</option>' +

    list.map(([id,name]) => {

      return `
        <option value="${escapeHtml(id)}">
          ${escapeHtml(name)}
        </option>
      `;

    }).join("");

}

/* =========================================================
   CHAPTER LIST
========================================================= */

function fillChapters(){

  const selectedBook =
    normalizeBookId(bookSelect.value);

  if(!selectedBook){

    chapterSelect.innerHTML =
      '<option value="">اختر الأصحاح</option>';

    chapterSelect.disabled = true;

    return;
  }

  const chapters = [
    ...new Set(

      verses
        .filter(v =>
          normalizeBookId(v.book) === selectedBook
        )
        .map(v => Number(v.chapter))
        .filter(Number.isFinite)

    )
  ].sort((a,b)=>a-b);

  chapterSelect.innerHTML =
    '<option value="">اختر الأصحاح</option>' +

    chapters.map(ch => `
      <option value="${ch}">
        الإصحاح ${ch}
      </option>
    `).join("");

  chapterSelect.disabled =
    chapters.length === 0;

  /*
    تشخيص خاص ببطرس الثانية
  */

  if(selectedBook === "61-2pet"){

    debugBox.textContent =
      chapters.length
        ? `بطرس الثانية: تم العثور على ${chapters.length} أصحاح.`
        : "بطرس الثانية موجودة في قائمة الأسفار ولكن لا توجد آيات مرتبطة بها في bible.json.";

  }

}

/* =========================================================
   RENDER CHAPTER
========================================================= */

function renderChapter(){

  const selectedBook =
    normalizeBookId(bookSelect.value);

  const selectedChapter =
    Number(chapterSelect.value);

  if(!selectedBook || !selectedChapter){

    content.innerHTML =
      '<div class="empty">اختر السفر ثم الأصحاح.</div>';

    return;

  }

  const rows = verses
    .filter(v =>
      normalizeBookId(v.book) === selectedBook &&
      Number(v.chapter) === selectedChapter
    )
    .sort((a,b)=>Number(a.verse)-Number(b.verse));

  const name =
    BOOK_NAME_MAP.get(selectedBook) || selectedBook;

  statusBox.textContent =
    `${name} — الإصحاح ${selectedChapter} — ${rows.length} آية`;

  if(!rows.length){

    content.innerHTML = `
      <div class="empty">
        لا توجد آيات لهذا الأصحاح في قاعدة البيانات.
      </div>
    `;

    return;

  }

  content.innerHTML =
    rows.map(v => `

      <div class="verse">

        <span class="vnum">
          ${escapeHtml(v.verse)}
        </span>

        ${escapeHtml(v.text)}

      </div>

    `).join("");

}

/* =========================================================
   LOAD BIBLE
========================================================= */

async function loadBible(){

  try{

    statusBox.textContent =
      "جاري تحميل الكتاب المقدس...";

    const response =
      await fetch(
        BIBLE_URL + "?v=" + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();

    /*
      دعم أكثر من بنية JSON
    */

    let rawVerses = [];

    if(Array.isArray(data)){

      rawVerses = data;

    }else if(Array.isArray(data.verses)){

      rawVerses = data.verses;

    }else if(Array.isArray(data.bible)){

      rawVerses = data.bible;

    }else if(Array.isArray(data.data)){

      rawVerses = data.data;

    }

    /*
      تنظيف وتوحيد البيانات
    */

    verses = rawVerses
      .filter(v =>
        v &&
        v.book !== undefined &&
        v.chapter !== undefined &&
        v.verse !== undefined &&
        v.text !== undefined
      )
      .map(v => ({

        book:normalizeBookId(v.book),
        chapter:Number(v.chapter),
        verse:Number(v.verse),
        text:String(v.text)

      }))
      .filter(v =>
        v.book &&
        Number.isFinite(v.chapter) &&
        Number.isFinite(v.verse) &&
        v.text.trim()
      );

    if(!verses.length){

      throw new Error(
        "لم يتم العثور على آيات"
      );

    }

    /*
      إحصائيات
    */

    const bookIds =
      new Set(
        verses.map(v =>
          normalizeBookId(v.book)
        )
      );

    const secondPeter =
      verses.filter(v =>
        normalizeBookId(v.book) === "61-2pet"
      );

    debugBox.textContent =
      `تم تحميل ${verses.length.toLocaleString("ar-EG")} آية — ` +
      `${bookIds.size} سفر — ` +
      `بطرس الثانية: ${secondPeter.length} آية`;

    statusBox.textContent =
      "تم تحميل الكتاب المقدس بنجاح.";

    setCovenant("old");

  }catch(error){

    console.error(error);

    statusBox.textContent =
      "تعذر تحميل الكتاب المقدس.";

    debugBox.textContent =
      "خطأ في تحميل bible.json: " +
      error.message;

    content.innerHTML = `
      <div class="empty">
        تعذر تحميل قاعدة بيانات الكتاب المقدس.
      </div>
    `;

  }

}

/* =========================================================
   EVENTS
========================================================= */

oldBtn.addEventListener(
  "click",
  ()=>setCovenant("old")
);

newBtn.addEventListener(
  "click",
  ()=>setCovenant("new")
);

bookSelect.addEventListener(
  "change",
  ()=>{
    fillChapters();

    content.innerHTML =
      '<div class="empty">اختر الأصحاح.</div>';
  }
);

chapterSelect.addEventListener(
  "change",
  renderChapter
);

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,character => {

      const map = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      };

      return map[character];

    });

}

/* =========================================================
   START
========================================================= */

loadBible();

</script>

</body>
</html>
