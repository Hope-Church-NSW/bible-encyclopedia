<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | تطبيق كتابي</title>

<style>
:root{
    --blue:#071d3a;
    --blue2:#0d315f;
    --blue3:#164b82;
    --gold:#d4af37;
    --gold-light:#f3d77a;
    --white:#ffffff;
    --bg:#f3f7fc;
    --text:#17243a;
    --border:#d9e2ef;
    --shadow:0 10px 30px rgba(5,25,55,.12);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    background:
        linear-gradient(135deg,#eef4fb,#ffffff 45%,#edf4fc);
    color:var(--text);
    min-height:100vh;
}

/* ================= HEADER ================= */

.topbar{
    height:78px;
    background:
        linear-gradient(135deg,#061a35,#0c315e 55%,#123f73);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.20);
    position:sticky;
    top:0;
    z-index:1000;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:68px;
    height:68px;
    object-fit:contain;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
}

.church-name{
    color:white;
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
}

.church-name span{
    color:var(--gold-light);
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.home-btn{
    border:1px solid rgba(243,215,122,.6);
    background:linear-gradient(145deg,#123f73,#071d3a);
    color:var(--gold-light);
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
    transition:.25s;
}

.home-btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(145deg,#1c568f,#0a2649);
}

/* ================= MAIN ================= */

.container{
    width:min(1100px,94%);
    margin:35px auto 60px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title h1{
    margin:0;
    font-size:38px;
    color:var(--blue);
    font-weight:900;
}

.page-title p{
    margin-top:8px;
    color:#64748b;
    font-size:17px;
}

/* ================= SELECTORS ================= */

.selector-panel{
    background:white;
    border-radius:22px;
    padding:28px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

.selector-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.field label{
    font-weight:800;
    color:var(--blue);
    font-size:16px;
}

select{
    width:100%;
    height:52px;
    border:2px solid var(--border);
    border-radius:13px;
    background:#fff;
    color:var(--text);
    font-size:16px;
    padding:0 15px;
    cursor:pointer;
    outline:none;
    transition:.2s;
}

select:focus{
    border-color:var(--blue3);
    box-shadow:0 0 0 4px rgba(22,75,130,.10);
}

/* ================= VERSE BUTTON ================= */

.verse-button-wrapper{
    margin-top:22px;
    text-align:center;
}

.show-verses-btn{
    width:100%;
    min-height:56px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-size:18px;
    font-weight:900;
    background:
        linear-gradient(135deg,#0b315d,#16558e);
    box-shadow:
        0 8px 20px rgba(7,29,58,.22);
    transition:.25s;
}

.show-verses-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 12px 25px rgba(7,29,58,.28);
}

.show-verses-btn:active{
    transform:translateY(0);
}

/* ================= STATUS ================= */

.status{
    margin-top:20px;
    text-align:center;
    font-size:15px;
    color:#64748b;
    min-height:24px;
}

.status.error{
    color:#b42318;
    font-weight:700;
}

/* ================= VERSES ================= */

.verses-container{
    margin-top:28px;
    display:none;
}

.verses-container.visible{
    display:block;
}

.chapter-title{
    background:
        linear-gradient(135deg,#071d3a,#123f73);
    color:white;
    padding:18px 22px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:var(--shadow);
}

.chapter-title h2{
    margin:0;
    font-size:23px;
}

.verse-card{
    background:white;
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px 22px;
    margin-bottom:12px;
    box-shadow:0 5px 18px rgba(5,25,55,.07);
    display:flex;
    gap:18px;
    align-items:flex-start;
    transition:.2s;
}

.verse-card:hover{
    transform:translateY(-2px);
    box-shadow:0 9px 24px rgba(5,25,55,.11);
}

.verse-number{
    min-width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--blue);
    color:var(--gold-light);
    font-weight:900;
    flex-shrink:0;
}

.verse-text{
    font-size:19px;
    line-height:2;
    color:#1c2b42;
}

/* ================= EMPTY ================= */

.empty-message{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    text-align:center;
    color:#64748b;
    box-shadow:var(--shadow);
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

    .topbar{
        height:auto;
        min-height:72px;
        padding:8px 12px;
    }

    .logo{
        width:52px;
        height:52px;
    }

    .church-name{
        font-size:15px;
    }

    .home-btn{
        padding:9px 11px;
        font-size:13px;
    }

    .page-title h1{
        font-size:29px;
    }

    .selector-grid{
        grid-template-columns:1fr;
    }

    .selector-panel{
        padding:20px;
    }

    .verse-text{
        font-size:17px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="topbar">

    <div class="header-right">

        <img
            class="logo"
            src="assets/logo.png"
            alt="كنيسة رجاء الأمم سيدني"
            onerror="this.style.display='none'"
        >

        <div class="church-name">
            كنيسة رجاء الأمم <span>سيدني</span>
        </div>

    </div>

    <div class="header-left">

        <a class="home-btn" href="index.html">
            الرئيسية
        </a>

    </div>

</header>


<!-- ================= CONTENT ================= -->

<main class="container">

    <div class="page-title">

        <h1>الكتاب المقدس</h1>

    </div>


    <!-- ================= SELECTORS ================= -->

    <section class="selector-panel">

        <div class="selector-grid">

            <div class="field">

                <label for="bookSelect">
                    اختر السفر
                </label>

                <select id="bookSelect">

                    <option value="">
                        اختر السفر
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="chapterSelect">
                    اختر الأصحاح
                </label>

                <select id="chapterSelect" disabled>

                    <option value="">
                        اختر الأصحاح
                    </option>

                </select>

            </div>

        </div>


        <!-- الزر المطلوب أسفل القائمتين -->

        <div class="verse-button-wrapper">

            <button
                id="showVersesBtn"
                class="show-verses-btn"
                type="button"
                disabled
            >
                📖 عرض الآيات
            </button>

        </div>


        <div
            id="status"
            class="status"
        >
            جاري تحميل الكتاب المقدس...
        </div>

    </section>


    <!-- ================= VERSES ================= -->

    <section
        id="versesContainer"
        class="verses-container"
    >

        <div
            id="chapterTitle"
            class="chapter-title"
        ></div>

        <div id="versesList"></div>

    </section>

</main>


<script>

/* =========================================================
   بيانات الأسفار
   ========================================================= */

const BOOKS = [

    /* العهد القديم */

    {id:"01-gen",name:"التكوين",chapters:50},
    {id:"02-exo",name:"الخروج",chapters:40},
    {id:"03-lev",name:"اللاويين",chapters:27},
    {id:"04-num",name:"العدد",chapters:36},
    {id:"05-deu",name:"التثنية",chapters:34},
    {id:"06-jos",name:"يشوع",chapters:24},
    {id:"07-jud",name:"القضاة",chapters:21},
    {id:"08-rut",name:"راعوث",chapters:4},
    {id:"09-1sa",name:"صموئيل الأول",chapters:31},
    {id:"10-2sa",name:"صموئيل الثاني",chapters:24},
    {id:"11-1ki",name:"ملوك الأول",chapters:22},
    {id:"12-2ki",name:"ملوك الثاني",chapters:25},
    {id:"13-1ch",name:"أخبار الأيام الأول",chapters:29},
    {id:"14-2ch",name:"أخبار الأيام الثاني",chapters:36},
    {id:"15-ezr",name:"عزرا",chapters:10},
    {id:"16-neh",name:"نحميا",chapters:13},
    {id:"17-est",name:"أستير",chapters:10},
    {id:"18-job",name:"أيوب",chapters:42},
    {id:"19-psa",name:"المزامير",chapters:150},
    {id:"20-pro",name:"الأمثال",chapters:31},
    {id:"21-ecc",name:"الجامعة",chapters:12},
    {id:"22-son",name:"نشيد الأنشاد",chapters:8},
    {id:"23-isa",name:"إشعياء",chapters:66},
    {id:"24-jer",name:"إرميا",chapters:52},
    {id:"25-lam",name:"مراثي إرميا",chapters:5},
    {id:"26-eze",name:"حزقيال",chapters:48},
    {id:"27-dan",name:"دانيال",chapters:12},
    {id:"28-hos",name:"هوشع",chapters:14},
    {id:"29-joe",name:"يوئيل",chapters:3},
    {id:"30-amo",name:"عاموس",chapters:9},
    {id:"31-oba",name:"عوبديا",chapters:1},
    {id:"32-jon",name:"يونان",chapters:4},
    {id:"33-mic",name:"ميخا",chapters:7},
    {id:"34-nah",name:"ناحوم",chapters:3},
    {id:"35-hab",name:"حبقوق",chapters:3},
    {id:"36-zep",name:"صفنيا",chapters:3},
    {id:"37-hag",name:"حجي",chapters:2},
    {id:"38-zec",name:"زكريا",chapters:14},
    {id:"39-mal",name:"ملاخي",chapters:4},

    /* العهد الجديد */

    {id:"40-mat",name:"متى",chapters:28},
    {id:"41-mar",name:"مرقس",chapters:16},
    {id:"42-luk",name:"لوقا",chapters:24},
    {id:"43-joh",name:"يوحنا",chapters:21},
    {id:"44-act",name:"أعمال الرسل",chapters:28},
    {id:"45-rom",name:"رومية",chapters:16},
    {id:"46-1co",name:"كورنثوس الأولى",chapters:16},
    {id:"47-2co",name:"كورنثوس الثانية",chapters:13},
    {id:"48-gal",name:"غلاطية",chapters:6},
    {id:"49-eph",name:"أفسس",chapters:6},
    {id:"50-phi",name:"فيلبي",chapters:4},
    {id:"51-col",name:"كولوسي",chapters:4},
    {id:"52-1th",name:"تسالونيكي الأولى",chapters:5},
    {id:"53-2th",name:"تسالونيكي الثانية",chapters:3},
    {id:"54-1ti",name:"تيموثاوس الأولى",chapters:6},
    {id:"55-2ti",name:"تيموثاوس الثانية",chapters:4},
    {id:"56-tit",name:"تيطس",chapters:3},
    {id:"57-phm",name:"فليمون",chapters:1},
    {id:"58-heb",name:"العبرانيين",chapters:13},
    {id:"59-jam",name:"يعقوب",chapters:5},
    {id:"60-1pe",name:"بطرس الأولى",chapters:5},
    {id:"61-2pe",name:"بطرس الثانية",chapters:3},
    {id:"62-1jo",name:"يوحنا الأولى",chapters:5},
    {id:"63-2jo",name:"يوحنا الثانية",chapters:1},
    {id:"64-3jo",name:"يوحنا الثالثة",chapters:1},
    {id:"65-jud",name:"يهوذا",chapters:1},
    {id:"66-rev",name:"رؤيا يوحنا",chapters:22}

];


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const bookSelect =
    document.getElementById("bookSelect");

const chapterSelect =
    document.getElementById("chapterSelect");

const showVersesBtn =
    document.getElementById("showVersesBtn");

const versesContainer =
    document.getElementById("versesContainer");

const versesList =
    document.getElementById("versesList");

const chapterTitle =
    document.getElementById("chapterTitle");

const status =
    document.getElementById("status");


/* =========================================================
   تخزين الكتاب المقدس
   ========================================================= */

let bibleData = [];

let currentBook = null;

let currentChapter = null;


/* =========================================================
   إنشاء قائمة الأسفار
   ========================================================= */

function buildBookList(){

    bookSelect.innerHTML =
        '<option value="">اختر السفر</option>';

    BOOKS.forEach(book => {

        const option =
            document.createElement("option");

        option.value = book.id;

        option.textContent = book.name;

        bookSelect.appendChild(option);

    });

}


/* =========================================================
   إنشاء قائمة الأصحاحات
   ========================================================= */

function buildChapterList(book){

    chapterSelect.innerHTML =
        '<option value="">اختر الأصحاح</option>';

    for(let i = 1; i <= book.chapters; i++){

        const option =
            document.createElement("option");

        option.value = String(i);

        option.textContent =
            `الأصحاح ${i}`;

        chapterSelect.appendChild(option);

    }

    chapterSelect.disabled = false;

    showVersesBtn.disabled = true;

}


/* =========================================================
   تطبيع بيانات Bible JSON
   ========================================================= */

function normalizeBibleData(data){

    let rows = [];

    if(Array.isArray(data)){

        rows = data;

    }

    else if(
        data &&
        Array.isArray(data.verses)
    ){

        rows = data.verses;

    }

    else if(
        data &&
        Array.isArray(data.bible)
    ){

        rows = data.bible;

    }

    else if(
        data &&
        Array.isArray(data.data)
    ){

        rows = data.data;

    }

    else{

        Object.values(data || {}).forEach(value => {

            if(Array.isArray(value)){

                value.forEach(item => {

                    if(item && typeof item === "object"){

                        rows.push(item);

                    }

                });

            }

        });

    }


    return rows
        .map(item => {

            const book =
                String(
                    item.book ??
                    item.bookId ??
                    item.book_id ??
                    item.bookCode ??
                    ""
                ).trim();

            const chapter =
                Number(
                    item.chapter ??
                    item.chapterNumber ??
                    item.chapter_number ??
                    0
                );

            const verse =
                Number(
                    item.verse ??
                    item.verseNumber ??
                    item.verse_number ??
                    0
                );

            const text =
                String(
                    item.text ??
                    item.verseText ??
                    item.content ??
                    ""
                ).trim();

            return {
                book,
                chapter,
                verse,
                text
            };

        })
        .filter(item =>
            item.book &&
            item.chapter > 0 &&
            item.verse > 0 &&
            item.text
        );

}


/* =========================================================
   تحميل bible.json
   ========================================================= */

async function loadBible(){

    status.textContent =
        "جاري تحميل نص الكتاب المقدس...";

    status.classList.remove("error");

    try{

        const response =
            await fetch(
                "bible.json?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const json =
            await response.json();

        bibleData =
            normalizeBibleData(json);


        if(!bibleData.length){

            throw new Error(
                "لم يتم العثور على آيات داخل bible.json"
            );

        }


        status.textContent =
            "تم تحميل نص الكتاب المقدس بنجاح.";

    }

    catch(error){

        console.error(
            "Bible loading error:",
            error
        );

        status.textContent =
            "تعذر تحميل نص الكتاب المقدس. تأكد من وجود bible.json في المجلد الرئيسي.";

        status.classList.add("error");

    }

}


/* =========================================================
   العثور على الآيات
   ========================================================= */

function findVerses(bookId,chapterNumber){

    return bibleData
        .filter(item =>
            item.book === bookId &&
            Number(item.chapter) ===
            Number(chapterNumber)
        )
        .sort(
            (a,b) =>
                Number(a.verse) -
                Number(b.verse)
        );

}


/* =========================================================
   عرض الآيات
   ========================================================= */

function renderVerses(){

    if(!currentBook || !currentChapter){

        return;

    }


    const verses =
        findVerses(
            currentBook.id,
            currentChapter
        );


    versesList.innerHTML = "";

    chapterTitle.innerHTML =
        `<h2>${currentBook.name} — الأصحاح ${currentChapter}</h2>`;


    if(!verses.length){

        versesList.innerHTML = `

            <div class="empty-message">

                لا توجد آيات لهذا الأصحاح في
                <strong>bible.json</strong>.

                <br><br>

                تأكد أن قيمة <strong>book</strong>
                داخل الملف تطابق:
                <strong>${currentBook.id}</strong>

            </div>

        `;

        versesContainer.classList.add("visible");

        return;

    }


    verses.forEach(item => {

        const card =
            document.createElement("article");

        card.className =
            "verse-card";


        const number =
            document.createElement("div");

        number.className =
            "verse-number";

        number.textContent =
            item.verse;


        const text =
            document.createElement("div");

        text.className =
            "verse-text";

        text.textContent =
            item.text;


        card.appendChild(number);

        card.appendChild(text);

        versesList.appendChild(card);

    });


    versesContainer.classList.add("visible");


    versesContainer.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =========================================================
   اختيار السفر
   ========================================================= */

bookSelect.addEventListener(
    "change",
    function(){

        const bookId =
            this.value;

        versesContainer.classList.remove(
            "visible"
        );

        versesList.innerHTML = "";

        chapterTitle.innerHTML = "";


        if(!bookId){

            chapterSelect.innerHTML =
                '<option value="">اختر الأصحاح</option>';

            chapterSelect.disabled = true;

            showVersesBtn.disabled = true;

            currentBook = null;

            currentChapter = null;

            return;

        }


        currentBook =
            BOOKS.find(
                book =>
                    book.id === bookId
            );


        currentChapter = null;


        if(currentBook){

            buildChapterList(
                currentBook
            );

        }

    }
);


/* =========================================================
   اختيار الأصحاح
   ========================================================= */

chapterSelect.addEventListener(
    "change",
    function(){

        const chapter =
            Number(this.value);


        if(!chapter){

            currentChapter = null;

            showVersesBtn.disabled = true;

            return;

        }


        currentChapter =
            chapter;

        showVersesBtn.disabled =
            false;

    }
);


/* =========================================================
   زر عرض الآيات
   ========================================================= */

showVersesBtn.addEventListener(
    "click",
    function(){

        renderVerses();

    }
);


/* =========================================================
   تشغيل الصفحة
   ========================================================= */

buildBookList();

loadBible();

</script>

</body>
</html>
