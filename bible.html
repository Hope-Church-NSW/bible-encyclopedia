<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1c2f;
    --card:#0d2238;
    --card2:#12304d;
    --gold:#d4af37;
    --gold2:#f3d878;
    --text:#f5f7fa;
    --muted:#a9b7c6;
    --line:#1c3b58;
    --blue:#286fd6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top right,#153858 0,#061321 45%,#040b13 100%);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    height:100px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 4%;
    border-bottom:1px solid var(--line);
    background:rgba(5,16,28,.96);
    position:sticky;
    top:0;
    z-index:100;
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    width:72px;
    height:72px;
    object-fit:contain;
    filter:drop-shadow(0 0 12px rgba(212,175,55,.35));
}

.church-name{
    font-size:25px;
    font-weight:800;
    color:var(--gold2);
    text-shadow:
        0 1px 0 #8c6d16,
        0 2px 0 #70550f,
        0 5px 12px rgba(0,0,0,.7);
}

.header-left a{
    color:var(--gold2);
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}

/* ================= MAIN ================= */

main{
    width:min(1200px,92%);
    margin:35px auto 60px;
}

.page-title{
    text-align:center;
    margin-bottom:28px;
}

.page-title h1{
    margin:0;
    font-size:36px;
    color:var(--gold2);
    text-shadow:0 3px 12px rgba(0,0,0,.7);
}

/* ================= TOP TABS ================= */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

.tab{
    border:1px solid var(--line);
    background:linear-gradient(145deg,var(--card2),var(--card));
    color:var(--text);
    border-radius:16px;
    padding:18px 10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.tab:hover{
    border-color:var(--gold);
    transform:translateY(-2px);
}

.tab.active{
    background:linear-gradient(145deg,#1c4770,#102a45);
    border-color:var(--gold);
    color:var(--gold2);
    box-shadow:0 0 20px rgba(212,175,55,.12);
}

/* ================= SELECTORS ================= */

.selector-area{
    background:rgba(13,34,56,.92);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:25px;
}

.selector-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field label{
    display:block;
    color:var(--gold2);
    font-weight:bold;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    background:#081a2b;
    color:white;
    border:1px solid var(--line);
    border-radius:11px;
    padding:14px;
    font-size:17px;
    outline:none;
}

select:focus,
input:focus{
    border-color:var(--gold);
}

/* ================= CONTENT ================= */

.content{
    background:rgba(10,29,48,.95);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
}

.chapter-title{
    padding:20px;
    text-align:center;
    color:var(--gold2);
    font-size:25px;
    font-weight:bold;
    border-bottom:1px solid var(--line);
}

.verse{
    padding:18px 22px;
    border-bottom:1px solid #17334d;
    line-height:2.2;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
}

.verse:hover{
    background:#102c47;
}

.verse-number{
    color:var(--gold2);
    font-weight:bold;
    margin-left:10px;
}

/* ================= SEARCH ================= */

.search-box{
    margin-bottom:15px;
}

.search-results{
    padding:18px;
}

.result{
    padding:16px;
    margin-bottom:10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#0b2035;
    cursor:pointer;
}

.result:hover{
    border-color:var(--gold);
}

.result-reference{
    color:var(--gold2);
    font-weight:bold;
    margin-bottom:7px;
}

/* ================= MESSAGE ================= */

.message{
    text-align:center;
    padding:35px;
    color:var(--muted);
    font-size:18px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(850px,100%);
    max-height:90vh;
    overflow:auto;
    background:#0b1f34;
    border:1px solid var(--gold);
    border-radius:20px;
    padding:25px;
}

.modal-close{
    float:left;
    background:none;
    border:0;
    color:var(--gold2);
    font-size:28px;
    cursor:pointer;
}

.modal-title{
    color:var(--gold2);
    font-size:25px;
    margin-bottom:20px;
}

.modal-reference{
    color:var(--gold);
    font-weight:bold;
    margin-bottom:12px;
}

.modal-text{
    line-height:2.2;
    font-size:20px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    header{
        height:auto;
        padding:12px 4%;
    }

    .logo{
        width:58px;
        height:58px;
    }

    .church-name{
        font-size:18px;
    }

    .header-left a{
        font-size:15px;
    }

    .page-title h1{
        font-size:28px;
    }

    .tabs{
        grid-template-columns:1fr;
    }

    .selector-grid{
        grid-template-columns:1fr;
    }

    .verse{
        font-size:18px;
        padding:15px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-right">

        <img
            src="assets/logo.png"
            class="logo"
            alt="Hope Church NSW"
            onerror="this.style.display='none'"
        >

        <div class="church-name">
            كنيسة رجاء الأمم سيدني
        </div>

    </div>

    <div class="header-left">
        <a href="index.html">الرئيسية</a>
    </div>

</header>


<main>

    <div class="page-title">
        <h1>الكتاب المقدس</h1>
    </div>


    <!-- ================= THREE MAIN SECTIONS ================= -->

    <div class="tabs">

        <button
            id="oldTab"
            class="tab active"
            onclick="showTestament('old')">
            العهد القديم
        </button>

        <button
            id="newTab"
            class="tab"
            onclick="showTestament('new')">
            العهد الجديد
        </button>

        <button
            id="searchTab"
            class="tab"
            onclick="showSearch()">
            🔎 البحث
        </button>

    </div>


    <!-- ================= BIBLE ================= -->

    <section id="bibleSection">

        <div class="selector-area">

            <div class="selector-grid">

                <div class="field">

                    <label for="bookSelect">
                        اختر السفر
                    </label>

                    <select id="bookSelect">
                        <option value="">
                            اختر السفر
                        </option>
                    </select>

                </div>


                <div class="field">

                    <label for="chapterSelect">
                        اختر الأصحاح
                    </label>

                    <select id="chapterSelect" disabled>
                        <option value="">
                            اختر الأصحاح
                        </option>
                    </select>

                </div>

            </div>

        </div>


        <div id="bibleContent" class="content">

            <div class="message">
                جاري تحميل الكتاب المقدس...
            </div>

        </div>

    </section>


    <!-- ================= SEARCH ================= -->

    <section id="searchSection" style="display:none">

        <div class="selector-area">

            <div class="search-box">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="ابحث في الكتاب المقدس..."
                >

            </div>

        </div>


        <div id="searchResults" class="content">

            <div class="message">
                اكتب كلمة أو عبارة للبحث.
            </div>

        </div>

    </section>

</main>


<!-- ================= VERSE MODAL ================= -->

<div id="verseModal" class="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeVerse()">
            ×
        </button>

        <div
            id="modalReference"
            class="modal-reference">
        </div>

        <div
            id="modalText"
            class="modal-text">
        </div>

    </div>

</div>


<script>

/* =========================================================
   IMPORTANT:
   THE CURRENT REPOSITORY CONTAINS bible.json
   NOT bible_database.json
   ========================================================= */

const DATA_URL = "bible.json";


/* =========================================================
   BIBLE BOOKS
   ========================================================= */

const OLD_TESTAMENT = [

    ["01-gen","التكوين"],
    ["02-exo","الخروج"],
    ["03-lev","اللاويين"],
    ["04-num","العدد"],
    ["05-deu","التثنية"],
    ["06-jos","يشوع"],
    ["07-jdg","القضاة"],
    ["08-rut","راعوث"],
    ["09-1sam","صموئيل الأول"],
    ["10-2sam","صموئيل الثاني"],
    ["11-1kgs","ملوك الأول"],
    ["12-2kgs","ملوك الثاني"],
    ["13-1chr","أخبار الأيام الأول"],
    ["14-2chr","أخبار الأيام الثاني"],
    ["15-ezr","عزرا"],
    ["16-neh","نحميا"],
    ["17-est","أستير"],
    ["18-job","أيوب"],
    ["19-psa","المزامير"],
    ["20-pro","الأمثال"],
    ["21-ecc","الجامعة"],
    ["22-sng","نشيد الأنشاد"],
    ["23-isa","إشعياء"],
    ["24-jer","إرميا"],
    ["25-lam","مراثي إرميا"],
    ["26-ezk","حزقيال"],
    ["27-dan","دانيال"],
    ["28-hos","هوشع"],
    ["29-joe","يوئيل"],
    ["30-amo","عاموس"],
    ["31-oba","عوبديا"],
    ["32-jon","يونان"],
    ["33-mic","ميخا"],
    ["34-nah","ناحوم"],
    ["35-hab","حبقوق"],
    ["36-zep","صفنيا"],
    ["37-hag","حجي"],
    ["38-zec","زكريا"],
    ["39-mal","ملاخي"]

];


const NEW_TESTAMENT = [

    ["40-mat","متى"],
    ["41-mar","مرقس"],
    ["42-luk","لوقا"],
    ["43-joh","يوحنا"],
    ["44-act","أعمال الرسل"],
    ["45-rom","رومية"],
    ["46-1cor","كورنثوس الأولى"],
    ["47-2cor","كورنثوس الثانية"],
    ["48-gal","غلاطية"],
    ["49-eph","أفسس"],
    ["50-phi","فيلبي"],
    ["51-col","كولوسي"],
    ["52-1th","تسالونيكي الأولى"],
    ["53-2th","تسالونيكي الثانية"],
    ["54-1tim","تيموثاوس الأولى"],
    ["55-2tim","تيموثاوس الثانية"],
    ["56-tit","تيطس"],
    ["57-phm","فليمون"],
    ["58-heb","العبرانيين"],
    ["59-jam","يعقوب"],
    ["60-1pet","بطرس الأولى"],
    ["61-2pet","بطرس الثانية"],
    ["62-1joh","يوحنا الأولى"],
    ["63-2joh","يوحنا الثانية"],
    ["64-3joh","يوحنا الثالثة"],
    ["65-jud","يهوذا"],
    ["66-rev","رؤيا يوحنا"]

];


/* =========================================================
   STATE
   ========================================================= */

let verses = [];

let currentTestament = "old";

let currentBook = "";


/* =========================================================
   ELEMENTS
   ========================================================= */

const bookSelect =
    document.getElementById("bookSelect");

const chapterSelect =
    document.getElementById("chapterSelect");

const bibleContent =
    document.getElementById("bibleContent");

const searchInput =
    document.getElementById("searchInput");

const searchResults =
    document.getElementById("searchResults");


/* =========================================================
   NORMALIZE BOOK ID
   ========================================================= */

function normalizeBookId(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/_/g,"-");

}


/* =========================================================
   BOOK ALIASES
   This handles different IDs used inside bible.json.
   ========================================================= */

const BOOK_ALIASES = {

    "01-gen":"01-gen",
    "01-genesis":"01-gen",

    "02-exo":"02-exo",
    "02-exodus":"02-exodus",

    "03-lev":"03-lev",
    "03-leviticus":"03-leviticus",

    "04-num":"04-num",
    "04-numbers":"04-numbers",

    "05-deu":"05-deu",
    "05-deut":"05-deut",
    "05-deuteronomy":"05-deuteronomy",

    "06-jos":"06-jos",
    "06-joshua":"06-joshua",

    "07-jud":"07-jud",
    "07-judges":"07-judges",

    "08-rut":"08-rut",
    "08-ruth":"08-ruth",

    "59-jam":"59-jam",
    "59-james":"59-james",

    "60-1pet":"60-1pet",
    "60-1-peter":"60-1-peter",

    "61-2pet":"61-2pet",
    "61-2-peter":"61-2-peter",

    "62-1joh":"62-1joh",
    "63-2joh":"63-2joh",
    "64-3joh":"64-3joh",

    "65-jud":"65-jud",
    "66-rev":"66-rev"

};


/* =========================================================
   FIND VERSES FOR A BOOK
   ========================================================= */

function versesForBook(bookId){

    const wanted =
        normalizeBookId(bookId);

    const alias =
        BOOK_ALIASES[wanted] || wanted;

    return verses.filter(v => {

        const actual =
            normalizeBookId(v.book);

        return actual === wanted ||
               actual === alias ||
               actual.includes(wanted) ||
               wanted.includes(actual);

    });

}


/* =========================================================
   GET BOOK NAME
   ========================================================= */

function getBookName(id){

    const all =
        OLD_TESTAMENT.concat(NEW_TESTAMENT);

    const found =
        all.find(item => {

            const key =
                normalizeBookId(item[0]);

            const actual =
                normalizeBookId(id);

            return key === actual ||
                   actual.includes(key) ||
                   key.includes(actual);

        });

    return found ? found[1] : id;

}


/* =========================================================
   SHOW TESTAMENT
   ========================================================= */

function showTestament(testament){

    currentTestament = testament;

    document.getElementById("bibleSection").style.display =
        "block";

    document.getElementById("searchSection").style.display =
        "none";

    document.getElementById("oldTab").classList.toggle(
        "active",
        testament === "old"
    );

    document.getElementById("newTab").classList.toggle(
        "active",
        testament === "new"
    );

    document.getElementById("searchTab").classList.remove(
        "active"
    );

    populateBooks();

}


/* =========================================================
   POPULATE BOOKS
   ========================================================= */

function populateBooks(){

    const list =
        currentTestament === "old"
            ? OLD_TESTAMENT
            : NEW_TESTAMENT;

    bookSelect.innerHTML =
        '<option value="">اختر السفر</option>';

    list.forEach(book => {

        const option =
            document.createElement("option");

        option.value = book[0];

        option.textContent = book[1];

        bookSelect.appendChild(option);

    });

    chapterSelect.innerHTML =
        '<option value="">اختر الأصحاح</option>';

    chapterSelect.disabled = true;

    bibleContent.innerHTML =
        '<div class="message">اختر السفر.</div>';

}


/* =========================================================
   BOOK CHANGE
   ========================================================= */

bookSelect.addEventListener(
    "change",
    function(){

        currentBook =
            this.value;

        chapterSelect.innerHTML =
            '<option value="">اختر الأصحاح</option>';

        chapterSelect.disabled = true;

        bibleContent.innerHTML =
            '<div class="message">اختر الأصحاح.</div>';

        if(!currentBook){
            return;
        }

        const rows =
            versesForBook(currentBook);

        const chapters =
            [...new Set(
                rows.map(v =>
                    Number(v.chapter)
                )
            )]
            .filter(Number.isFinite)
            .sort((a,b)=>a-b);

        chapters.forEach(chapter => {

            const option =
                document.createElement("option");

            option.value =
                String(chapter);

            option.textContent =
                String(chapter);

            chapterSelect.appendChild(option);

        });

        chapterSelect.disabled =
            chapters.length === 0;

        if(chapters.length === 0){

            bibleContent.innerHTML =
                '<div class="message">لا توجد أصحاحات لهذا السفر في ملف البيانات.</div>';

        }

    }
);


/* =========================================================
   CHAPTER CHANGE
   ========================================================= */

chapterSelect.addEventListener(
    "change",
    function(){

        const chapter =
            Number(this.value);

        if(!currentBook || !chapter){

            bibleContent.innerHTML =
                '<div class="message">اختر الأصحاح.</div>';

            return;
        }

        renderChapter(
            currentBook,
            chapter
        );

    }
);


/* =========================================================
   RENDER CHAPTER
   ========================================================= */

function renderChapter(bookId,chapter){

    const rows =
        versesForBook(bookId)
        .filter(v =>
            Number(v.chapter) === chapter
        )
        .sort((a,b)=>
            Number(a.verse)-Number(b.verse)
        );

    if(rows.length === 0){

        bibleContent.innerHTML =
            '<div class="message">لا توجد آيات لهذا الأصحاح في قاعدة البيانات.</div>';

        return;

    }

    bibleContent.innerHTML = "";

    const title =
        document.createElement("div");

    title.className =
        "chapter-title";

    title.textContent =
        getBookName(bookId) +
        " — الأصحاح " +
        chapter;

    bibleContent.appendChild(title);


    rows.forEach(v => {

        const verse =
            document.createElement("div");

        verse.className =
            "verse";

        const number =
            document.createElement("span");

        number.className =
            "verse-number";

        number.textContent =
            v.verse;

        const text =
            document.createElement("span");

        text.textContent =
            v.text;

        verse.appendChild(number);

        verse.appendChild(text);

        verse.addEventListener(
            "click",
            function(){

                openVerse(
                    getBookName(v.book) +
                    " " +
                    v.chapter +
                    ":" +
                    v.verse,
                    v.text
                );

            }
        );

        bibleContent.appendChild(
            verse
        );

    });

}


/* =========================================================
   SEARCH
   ========================================================= */

function showSearch(){

    document.getElementById("bibleSection").style.display =
        "none";

    document.getElementById("searchSection").style.display =
        "block";

    document.getElementById("oldTab").classList.remove(
        "active"
    );

    document.getElementById("newTab").classList.remove(
        "active"
    );

    document.getElementById("searchTab").classList.add(
        "active"
    );

    searchInput.focus();

}


searchInput.addEventListener(
    "input",
    function(){

        const query =
            this.value.trim().toLowerCase();

        if(!query){

            searchResults.innerHTML =
                '<div class="message">اكتب كلمة أو عبارة للبحث.</div>';

            return;

        }

        const results =
            verses
            .filter(v =>
                String(v.text || "")
                    .toLowerCase()
                    .includes(query)
            )
            .slice(0,300);

        if(results.length === 0){

            searchResults.innerHTML =
                '<div class="message">لا توجد نتائج.</div>';

            return;

        }

        searchResults.innerHTML = "";

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "search-results";

        results.forEach(v => {

            const result =
                document.createElement("div");

            result.className =
                "result";

            const reference =
                document.createElement("div");

            reference.className =
                "result-reference";

            reference.textContent =
                getBookName(v.book) +
                " " +
                v.chapter +
                ":" +
                v.verse;

            const text =
                document.createElement("div");

            text.textContent =
                v.text;

            result.appendChild(
                reference
            );

            result.appendChild(
                text
            );

            result.addEventListener(
                "click",
                function(){

                    openVerse(
                        reference.textContent,
                        v.text
                    );

                }
            );

            wrapper.appendChild(
                result
            );

        });

        searchResults.appendChild(
            wrapper
        );

    }
);


/* =========================================================
   VERSE MODAL
   ========================================================= */

function openVerse(reference,text){

    document.getElementById(
        "modalReference"
    ).textContent =
        reference;

    document.getElementById(
        "modalText"
    ).textContent =
        text;

    document.getElementById(
        "verseModal"
    ).classList.add("show");

}


function closeVerse(){

    document.getElementById(
        "verseModal"
    ).classList.remove("show");

}


document.getElementById(
    "verseModal"
).addEventListener(
    "click",
    function(e){

        if(e.target === this){
            closeVerse();
        }

    }
);


/* =========================================================
   LOAD BIBLE.JSON
   ========================================================= */

async function loadBible(){

    bibleContent.innerHTML =
        '<div class="message">جاري تحميل الكتاب المقدس...</div>';

    try{

        const response =
            await fetch(
                DATA_URL + "?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "bible.json ليس Array"
            );

        }


        verses =
            data
            .filter(v =>
                v &&
                v.book !== undefined &&
                v.chapter !== undefined &&
                v.verse !== undefined &&
                v.text !== undefined
            );


        if(verses.length === 0){

            throw new Error(
                "لا توجد آيات صالحة"
            );

        }


        populateBooks();

    }
    catch(error){

        console.error(
            "Bible loading error:",
            error
        );

        bibleContent.innerHTML =
            '<div class="message">' +
            'تعذر تحميل بيانات الكتاب المقدس.<br><br>' +
