/* =========================================================
   تطبيع اسم السفر
========================================================= */

function normalizeBookName(value){

  const raw = String(value ?? "").trim();

  if (BOOK_ALIASES[raw])
    return BOOK_ALIASES[raw];

  const clean = raw
    .toLowerCase()
    .replace(/[_\s-]/g,"");

  for(const key of Object.keys(BOOK_ALIASES)){

    const normalized = key
      .toLowerCase()
      .replace(/[_\s-]/g,"");

    if(normalized === clean)
      return BOOK_ALIASES[key];

  }

  return raw;
}


/* =========================================================
   إضافة سجل آية
========================================================= */

function addVerse(target, book, chapter, verse, text){

  const b = normalizeBookName(book);
  const c = Number(chapter);
  const v = Number(verse);
  const t = String(text ?? "").trim();

  if(
    !b ||
    !Number.isFinite(c) ||
    !Number.isFinite(v) ||
    !t
  ) return;

  target.push({
    book:b,
    chapter:c,
    verse:v,
    text:t
  });
}


/* =========================================================
   قراءة أي صيغة JSON للكتاب المقدس
========================================================= */

function normalizeBibleData(data){

  const result = [];

  function walk(node, context = {}){

    if(node == null)
      return;

    /* مصفوفة */

    if(Array.isArray(node)){

      node.forEach(item =>
        walk(item, context)
      );

      return;
    }

    if(typeof node !== "object")
      return;


    /* سجل آية مباشر */

    const directBook =
      node.book ??
      node.bookId ??
      node.book_id ??
      context.book;

    const directChapter =
      node.chapter ??
      node.chapterNumber ??
      node.chapter_id ??
      context.chapter;

    const directVerse =
      node.verse ??
      node.number ??
      node.verseNumber ??
      context.verse;

    const directText =
      node.text ??
      node.content ??
      node.verseText;

    if(
      directBook !== undefined &&
      directChapter !== undefined &&
      directVerse !== undefined &&
      directText !== undefined
    ){

      addVerse(
        result,
        directBook,
        directChapter,
        directVerse,
        directText
      );

      return;
    }


    /* كائن سفر يحتوي chapters */

    if(node.chapters !== undefined){

      const book =
        node.book ??
        node.bookId ??
        node.book_id ??
        context.book;

      const chapters = node.chapters;

      if(Array.isArray(chapters)){

        chapters.forEach((chapter,index)=>{

          walk(chapter,{
            ...context,
            book,
            chapter:
              chapter.chapter ??
              chapter.number ??
              index+1
          });

        });

      }else if(typeof chapters==="object"){

        Object.entries(chapters).forEach(
          ([key,chapter])=>{

            walk(chapter,{
              ...context,
              book,
              chapter:
                chapter?.chapter ??
                chapter?.number ??
                key
            });

          }
        );

      }

      return;
    }


    /* كائن يحتوي books */

    if(node.books !== undefined){

      const booksNode = node.books;

      if(Array.isArray(booksNode)){

        booksNode.forEach(book=>
          walk(book,context)
        );

      }else if(typeof booksNode==="object"){

        Object.entries(booksNode).forEach(
          ([key,book])=>{

            walk(book,{
              ...context,
              book:
                book?.book ??
                book?.name ??
                book?.id ??
                key
            });

          }
        );

      }

      return;
    }


    /* كائن يحتوي verses */

    if(node.verses !== undefined){

      const versesNode=node.verses;

      if(Array.isArray(versesNode)){

        versesNode.forEach((verse,index)=>{

          walk(verse,{
            ...context,
            verse:
              verse?.verse ??
              verse?.number ??
              index+1
          });

        });

      }else if(typeof versesNode==="object"){

        Object.entries(versesNode).forEach(
          ([key,verse])=>{

            if(
              typeof verse==="string" ||
              typeof verse==="number"
            ){

              addVerse(
                result,
                context.book,
                context.chapter,
                key,
                verse
              );

            }else{

              walk(verse,{
                ...context,
                verse:
                  verse?.verse ??
                  verse?.number ??
                  key
              });

            }

          }
        );

      }

      return;
    }


    /* كائن يمثل أصحاحًا */

    const chapterFromContext =
      node.chapter ??
      node.chapterNumber ??
      context.chapter;

    const bookFromContext =
      node.book ??
      node.bookId ??
      context.book;

    const numericKeys =
      Object.keys(node)
        .filter(key=>/^\d+$/.test(key));

    if(
      bookFromContext !== undefined &&
      numericKeys.length
    ){

      numericKeys.forEach(key=>{

        const value=node[key];

        if(
          typeof value==="string" ||
          typeof value==="number"
        ){

          addVerse(
            result,
            bookFromContext,
            chapterFromContext,
            key,
            value
          );

        }else{

          walk(value,{
            ...context,
            book:bookFromContext,
            chapter:
              chapterFromContext ??
              key
          });

        }

      });

      return;
    }


    /* كائن رئيسي: المفاتيح هي أسماء الأسفار */

    Object.entries(node).forEach(
      ([key,value])=>{

        const possibleBook =
          normalizeBookName(key);

        if(
          BOOK_NAMES[possibleBook] ||
          OLD_IDS.includes(possibleBook)
        ){

          walk(value,{
            ...context,
            book:possibleBook
          });

          return;
        }


        /* المفاتيح قد تكون أرقام الأصحاحات */

        if(
          context.book &&
          /^\d+$/.test(key)
        ){

          walk(value,{
            ...context,
            chapter:key
          });

          return;
        }

        walk(value,context);

      }
    );

  }

  walk(data);

  /* إزالة التكرار */

  const unique = new Map();

  result.forEach(v=>{

    const key =
      `${v.book}|${v.chapter}|${v.verse}`;

    if(!unique.has(key))
      unique.set(key,v);

  });

  return [...unique.values()]
    .sort((a,b)=>{

      const bookA =
        Object.keys(BOOK_NAMES).indexOf(a.book);

      const bookB =
        Object.keys(BOOK_NAMES).indexOf(b.book);

      if(bookA !== bookB)
        return bookA-bookB;

      if(a.chapter !== b.chapter)
        return a.chapter-b.chapter;

      return a.verse-b.verse;

    });
}


/* =========================================================
   عرض الأسفار
========================================================= */

function fillBooks(){

  books =
    Object.keys(BOOK_NAMES)
      .filter(id =>
        verses.some(v=>v.book===id)
      );

  const old =
    books.filter(id=>OLD_IDS.includes(id));

  const nt =
    books.filter(id=>!OLD_IDS.includes(id));

  $("book").innerHTML =
    '<option value="">اختر السفر</option>' +

    '<optgroup label="العهد القديم">' +
      old.map(id=>
        `<option value="${id}">
          ${BOOK_NAMES[id]}
        </option>`
      ).join("") +
    '</optgroup>' +

    '<optgroup label="العهد الجديد">' +
      nt.map(id=>
        `<option value="${id}">
          ${BOOK_NAMES[id]}
        </option>`
      ).join("") +
    '</optgroup>';

  if(books.includes("01-gen"))
    $("book").value="01-gen";
  else if(books.length)
    $("book").value=books[0];

  fillChapters();
}


/* =========================================================
   عرض الأصحاحات
========================================================= */

function fillChapters(){

  const id=$("book").value;

  const chapters=[
    ...new Set(
      verses
        .filter(v=>v.book===id)
        .map(v=>Number(v.chapter))
        .filter(Number.isFinite)
    )
  ].sort((a,b)=>a-b);

  $("chapter").disabled=!id;

  $("chapter").innerHTML =
    '<option value="">اختر الأصحاح</option>' +

    chapters.map(ch=>
      `<option value="${ch}">
        الأصحاح ${ch}
      </option>`
    ).join("");

  if(chapters.length){

    $("chapter").value=
      String(chapters[0]);

    renderChapter();

  }else{

    $("content").innerHTML="";
    $("status").textContent=
      "لا توجد أصحاحات لهذا السفر.";

  }
}


/* =========================================================
   عرض الأصحاح والآيات
========================================================= */

function renderChapter(){

  const id=$("book").value;
  const ch=Number($("chapter").value);

  if(!id || !ch){

    $("content").innerHTML="";
    $("status").textContent=
      "اختر السفر والأصحاح.";

    return;
  }

  const rows =
    verses
      .filter(v =>
        v.book===id &&
        Number(v.chapter)===ch
      )
      .sort((a,b)=>a.verse-b.verse);

  $("status").textContent =
    `${BOOK_NAMES[id]} — الأصحاح ${ch} — ${rows.length} آية`;

  $("content").innerHTML =
    `<div class="chapter-title">
      ${esc(BOOK_NAMES[id])} — الأصحاح ${ch}
    </div>` +

    (
      rows.length

      ? rows.map(v=>`
          <div
            class="verse"
            onclick="openVerse('${v.book}',${v.chapter},${v.verse})"
          >
            <span class="vnum">
              ${esc(v.verse)}
            </span>
            ${esc(v.text)}
          </div>
        `).join("")

      : `<div class="error">
           لا توجد آيات لهذا الأصحاح.
         </div>`
    );
}


/* =========================================================
   نافذة الآية
========================================================= */

function openVerse(book,chapter,verse){

  const v =
    verses.find(x =>
      x.book===book &&
      Number(x.chapter)===Number(chapter) &&
      Number(x.verse)===Number(verse)
    );

  if(!v) return;

  $("modalTitle").textContent =
    `${BOOK_NAMES[book]} ${chapter}:${verse}`;

  $("modalText").textContent=v.text;

  $("modalBackdrop").style.display="flex";
}


function closeVerse(){

  $("modalBackdrop").style.display="none";

}


/* =========================================================
   البحث
========================================================= */

$("searchBtn").addEventListener("click",()=>{

  const q=prompt(
    "اكتب كلمة أو عبارة للبحث في الكتاب المقدس:"
  );

  if(!q) return;

  const needle=
    q.trim().toLocaleLowerCase("ar");

  const hits=
    verses
      .filter(v =>
        v.text
          .toLocaleLowerCase("ar")
          .includes(needle)
      )
      .slice(0,200);

  $("status").textContent =
    `نتائج البحث: ${hits.length}`;

  $("content").innerHTML =
    hits.length

    ? hits.map(v=>`
        <div
          class="verse"
          onclick="openVerse('${v.book}',${v.chapter},${v.verse})"
        >
          <span class="vnum">
            ${esc(BOOK_NAMES[v.book] || v.book)}
            ${v.chapter}:${v.verse}
          </span>
          ${esc(v.text)}
        </div>
      `).join("")

    : "<div class='error'>لا توجد نتائج.</div>";

});

========================================================= */

async function loadJson(url){

  const response =
    await fetch(
      `${url}?v=${Date.now()}`,
      {cache:"no-store"}
    );

  if(!response.ok)
    throw new Error(
      `${url} HTTP ${response.status}`
    );

  return await response.json();
}


async function boot(){

  try{

    const mainData =
      await loadJson(BIBLE_URL);

    verses =
      normalizeBibleData(mainData);

    /* إضافة بطرس الثانية إن كانت في ملف منفصل */

    try{

      const petData =
        await loadJson(SECOND_PETER_URL);

      const petRows =
        normalizeBibleData(petData)
          .map(v=>({
            ...v,
            book:"61-2pet"
          }));

      verses=[
        ...verses.filter(
          v=>v.book!=="61-2pet"
        ),
        ...petRows
      ];

    }catch(error){

      console.warn(
        "2pet.json غير متاح:",
        error
      );

    }

    if(!verses.length){

      throw new Error(
        "لم يتم استخراج أي آيات من bible.json"
      );

    }

    const count =
      new Set(
        verses.map(v=>v.book)
      ).size;

    $("status").textContent =
      `تم تحميل ${verses.length.toLocaleString("ar-EG")} آية من ${count} سفرًا.`;

    fillBooks();

  }catch(error){

    console.error(
      "Bible loading error:",
      error
    );

    $("status").innerHTML =
      `<div class="error">
        تعذر قراءة بيانات الكتاب المقدس من bible.json.
        <br>
        تم تحميل الصفحة، لكن صيغة البيانات تحتاج إلى معالجة.
      </div>`;

    $("content").innerHTML="";

  }

}


/* =========================================================
   الأحداث
========================================================= */

$("book").addEventListener(
  "change",
  fillChapters
);

$("chapter").addEventListener(
  "change",
  renderChapter
);

$("modalBackdrop").addEventListener(
  "click",
  e=>{
    if(e.target===$("modalBackdrop"))
      closeVerse();
  }
);


/* بدء التطبيق */

boot();

</script>
