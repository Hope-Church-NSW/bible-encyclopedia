<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>
<style>
:root{--bg:#071526;--card:#0d2138;--card2:#102a46;--gold:#d4af37;--gold2:#f2d675;--text:#f4f7fb;--muted:#9fb0c3;--line:#1d3b59;--blue:#2d7ff9}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#061321,#0b1d31);color:var(--text);font-family:Arial,Tahoma,sans-serif}
header{padding:16px 5%;border-bottom:1px solid var(--line);background:#081727;position:sticky;top:0;z-index:10}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:72px;height:72px;object-fit:contain}
.brand-title{font-size:28px;font-weight:900;color:var(--gold2);text-shadow:0 2px 8px rgba(212,175,55,.35)}
.home-link{color:var(--gold2);text-decoration:none;font-weight:800;font-size:20px;text-shadow:0 2px 7px rgba(212,175,55,.35)}
main{max-width:1200px;margin:auto;padding:26px 5%}
h1{margin:0 0 20px;color:var(--gold2);font-size:30px}
.toolbar{display:grid;grid-template-columns:1.5fr 1fr auto;gap:10px;margin-bottom:18px}
input,select,button{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:12px;font-size:15px}
button{cursor:pointer;background:#153657}
button:hover{border-color:var(--gold)}
.panel{background:rgba(13,33,56,.96);border:1px solid var(--line);border-radius:16px;padding:18px}
.status{color:var(--muted);margin-bottom:14px;font-size:14px}
.verse{border-bottom:1px solid #17344f;padding:15px 4px;line-height:2.1;font-size:19px;cursor:pointer}
.verse:hover{background:#102a46}
.vnum{color:var(--gold2);font-weight:bold;margin-left:8px}
.chapter-title{color:var(--gold2);font-size:24px;margin:4px 0 16px}
.error{color:#ffb4b4;background:#351b24;border:1px solid #6b3040;padding:14px;border-radius:10px}
footer{text-align:center;color:var(--muted);padding:30px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{max-width:760px;width:100%;background:#0d2138;border:1px solid var(--gold);border-radius:18px;padding:24px;max-height:85vh;overflow:auto}
.modal h2{color:var(--gold2);margin-top:0}
.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:18px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.brand-title{font-size:21px}.logo{width:58px;height:58px}.home-link{font-size:16px}.verse{font-size:17px}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="home-link" href="index.html">الرئيسية</a>
    <div class="brand">
      <div class="brand-title">كنيسة رجاء الأمم سيدني</div>
      <img class="logo" src="assets/logo.png" alt="شعار الكنيسة">
    </div>
  </div>
</header>

<main>
  <h1>الكتاب المقدس</h1>

  <div class="toolbar">
    <select id="book"></select>
    <select id="chapter" disabled></select>
    <button id="searchBtn">بحث</button>
  </div>

  <section class="panel">
    <div id="status" class="status">جاري تحميل الكتاب المقدس...</div>
    <div id="content"></div>
  </section>
</main>

<footer>Hope Church NSW — Bible Study</footer>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">الآية</h2>
    <div id="modalText" style="line-height:2;font-size:19px"></div>
    <div class="modal-actions">
      <button onclick="closeVerse()">إغلاق</button>
    </div>
  </div>
</div>

<script>
const BIBLE_URL="bible.json";
const SECOND_PETER_URL="2pet.json";

const BOOK_NAMES={
"01-gen":"التكوين","02-exo":"الخروج","03-lev":"اللاويين","04-num":"العدد","05-deu":"التثنية",
"06-josh":"يشوع","07-judg":"القضاة","08-ruth":"راعوث","09-1sam":"صموئيل الأول","10-2sam":"صموئيل الثاني",
"11-1kgs":"ملوك الأول","12-2kgs":"ملوك الثاني","13-1chr":"أخبار الأيام الأول","14-2chr":"أخبار الأيام الثاني",
"15-ezra":"عزرا","16-neh":"نحميا","17-est":"أستير","18-job":"أيوب","19-ps":"المزامير","20-prov":"الأمثال",
"21-eccl":"الجامعة","22-song":"نشيد الأنشاد","23-isa":"إشعياء","24-jer":"إرميا","25-lam":"مراثي إرميا",
"26-ezek":"حزقيال","27-dan":"دانيال","28-hos":"هوشع","29-joel":"يوئيل","30-amos":"عاموس","31-obad":"عوبديا",
"32-jonah":"يونان","33-mic":"ميخا","34-nah":"ناحوم","35-hab":"حبقوق","36-zeph":"صفنيا","37-hag":"حجي",
"38-zec":"زكريا","39-mal":"ملاخي","40-matt":"متى","41-mark":"مرقس","42-luke":"لوقا","43-john":"يوحنا",
"44-acts":"أعمال الرسل","45-rom":"رومية","46-1cor":"كورنثوس الأولى","47-2cor":"كورنثوس الثانية",
"48-gal":"غلاطية","49-eph":"أفسس","50-phil":"فيلبي","51-col":"كولوسي","52-1thess":"تسالونيكي الأولى",
"53-2thess":"تسالونيكي الثانية","54-1tim":"تيموثاوس الأولى","55-2tim":"تيموثاوس الثانية","56-tit":"تيطس",
"57-phlm":"فليمون","58-heb":"العبرانيين","59-jas":"يعقوب","60-1pet":"بطرس الأولى","61-2pet":"بطرس الثانية",
"62-1john":"يوحنا الأولى","63-2john":"يوحنا الثانية","64-3john":"يوحنا الثالثة","65-jude":"يهوذا","66-rev":"رؤيا يوحنا"
};

const OLD_IDS=[
"01-gen","02-exo","03-lev","04-num","05-deu","06-josh","07-judg","08-ruth","09-1sam","10-2sam",
"11-1kgs","12-2kgs","13-1chr","14-2chr","15-ezra","16-neh","17-est","18-job","19-ps","20-prov",
"21-eccl","22-song","23-isa","24-jer","25-lam","26-ezek","27-dan","28-hos","29-joel","30-amos",
"31-obad","32-jonah","33-mic","34-nah","35-hab","36-zeph","37-hag","38-zec","39-mal"
];

let verses=[];
let books=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function normaliseRows(data){
  if(!Array.isArray(data)) return [];
  return data.map(v=>({
    book:String(v.book??"").trim(),
    chapter:Number(v.chapter),
    verse:Number(v.verse ?? v.number),
    text:String(v.text??"").trim()
  })).filter(v=>v.book && Number.isFinite(v.chapter) && Number.isFinite(v.verse) && v.text);
}

function fillBooks(){
  books=Object.keys(BOOK_NAMES).filter(id=>verses.some(v=>v.book===id));
  const old=books.filter(id=>OLD_IDS.includes(id));
  const nt=books.filter(id=>!OLD_IDS.includes(id));

  $("book").innerHTML=
    '<option value="">اختر السفر</option>'+
    '<optgroup label="العهد القديم">'+old.map(id=>`<option value="${id}">${BOOK_NAMES[id]}</option>`).join("")+'</optgroup>'+
    '<optgroup label="العهد الجديد">'+nt.map(id=>`<option value="${id}">${BOOK_NAMES[id]}</option>`).join("")+'</optgroup>';

  if(books.includes("01-gen")) $("book").value="01-gen";
  else if(books.length) $("book").value=books[0];

  fillChapters();
}

function fillChapters(){
  const id=$("book").value;
  const chapters=[...new Set(verses.filter(v=>v.book===id).map(v=>v.chapter))].sort((a,b)=>a-b);
  $("chapter").disabled=!id;
  $("chapter").innerHTML='<option value="">اختر الأصحاح</option>'+
    chapters.map(c=>`<option value="${c}">الإصحاح ${c}</option>`).join("");

  if(chapters.length) $("chapter").value=String(chapters[0]);
  renderChapter();
}

function renderChapter(){
  const id=$("book").value;
  const ch=Number($("chapter").value);
  if(!id || !ch){
    $("content").innerHTML="";
    $("status").textContent="اختر السفر والأصحاح.";
    return;
  }

  const rows=verses.filter(v=>v.book===id && v.chapter===ch)
    .sort((a,b)=>a.verse-b.verse);

  $("status").textContent="";
  $("content").innerHTML=
    `<div class="chapter-title">${esc(BOOK_NAMES[id])} — الإصحاح ${ch}</div>`+
    (rows.length ? rows.map(v=>`
      <div class="verse" onclick="openVerse('${id}',${v.chapter},${v.verse})">
        <span class="vnum">${v.verse}</span>${esc(v.text)}
      </div>`).join("") : '<div class="error">لا توجد آيات لهذا الأصحاح.</div>');
}

function openVerse(book,chapter,verse){
  const v=verses.find(x=>x.book===book && x.chapter===chapter && x.verse===verse);
  if(!v)return;
  $("modalTitle").textContent=`${BOOK_NAMES[book]} ${chapter}:${verse}`;
  $("modalText").textContent=v.text;
  $("modalBackdrop").style.display="flex";
}

function closeVerse(){
  $("modalBackdrop").style.display="none";
}

$("book").addEventListener("change",fillChapters);
$("chapter").addEventListener("change",renderChapter);
$("searchBtn").addEventListener("click",()=>{
  const q=prompt("اكتب كلمة أو عبارة للبحث:");
  if(!q)return;
  const needle=q.trim().toLocaleLowerCase("ar");
  const hits=verses.filter(v=>v.text.toLocaleLowerCase("ar").includes(needle)).slice(0,200);
  $("status").textContent=`نتائج البحث: ${hits.length}`;
  $("content").innerHTML=hits.length?hits.map(v=>`
    <div class="verse" onclick="openVerse('${v.book}',${v.chapter},${v.verse})">
      <span class="vnum">${esc(BOOK_NAMES[v.book]||v.book)} ${v.chapter}:${v.verse}</span>
      ${esc(v.text)}
    </div>`).join(""):"<div>لا توجد نتائج.</div>";
});

async function loadJson(url){
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok) throw new Error(`${url} HTTP ${response.status}`);
  return response.json();
}

async function boot(){
  try{
    const [mainData,petData]=await Promise.all([
      loadJson(BIBLE_URL),
      loadJson(SECOND_PETER_URL)
    ]);

    const mainRows=normaliseRows(mainData);
    const petRows=normaliseRows(petData);

    // Remove any old 2 Peter records first, then add the verified 3-chapter source.
    verses=[
      ...mainRows.filter(v=>v.book!=="61-2pet"),
      ...petRows.map(v=>({...v,book:"61-2pet"}))
    ];

    const countBooks=new Set(verses.map(v=>v.book)).size;
    $("status").textContent=`تم تحميل ${verses.length.toLocaleString("ar-EG")} آية من ${countBooks} سفرًا.`;

    fillBooks();

    if(!verses.some(v=>v.book==="61-2pet")){
      throw new Error("61-2pet missing after merge");
    }
  }catch(err){
    console.error(err);
    $("status").innerHTML=`<div class="error">تعذر تحميل بيانات الكتاب المقدس. تأكد من وجود <b>bible.json</b> و <b>2pet.json</b> في المجلد الرئيسي للمستودع.</div>`;
  }
}

$("modalBackdrop").addEventListener("click",e=>{
  if(e.target===$("modalBackdrop")) closeVerse();
});

boot();
</script>
</body>
</html>
