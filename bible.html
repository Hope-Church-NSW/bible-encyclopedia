<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>

:root{
    --blue-950:#03101d;
    --blue-900:#061a2c;
    --blue-800:#082943;
    --blue-700:#0d385d;
    --blue-600:#14527e;

    --gold:#d4af37;
    --gold-light:#f4dc79;
    --gold-dark:#806018;

    --white:#f8fbff;
    --muted:#b7c7d6;

    --border:rgba(212,175,55,.34);

    --shadow:
        0 22px 55px rgba(0,0,0,.52);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    color:var(--white);

    font-family:
        "Noto Naskh Arabic",
        "Amiri",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 5%,
            rgba(20,82,126,.75),
            transparent 42%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(13,56,93,.35),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            var(--blue-950),
            var(--blue-900) 48%,
            #020911
        );
}


/* =====================================================
   HEADER
===================================================== */

.top-frame{
    position:relative;
    z-index:100;

    width:100%;

    border-bottom:
        1px solid
        rgba(212,175,55,.30);

    background:
        linear-gradient(
            180deg,
            rgba(8,41,67,.98),
            rgba(3,16,29,.98)
        );

    box-shadow:
        0 10px 35px rgba(0,0,0,.55),
        inset 0 -1px 0 rgba(255,255,255,.04);
}

.topbar{
    max-width:1450px;
    min-height:95px;

    margin:auto;
    padding:10px 20px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;
}


/* =====================================================
   BRAND
===================================================== */

.brand{
    display:flex;

    align-items:center;

    gap:14px;
}

.brand-logo{
    width:70px;
    height:70px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 7px 8px
            rgba(0,0,0,.85)
        );

    animation:
        logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,100%{
        transform:
            translateY(0)
            rotateY(0deg);
    }

    50%{
        transform:
            translateY(-4px)
            rotateY(8deg);
    }
}

.brand-name{

    font-size:22px;

    font-weight:900;

    white-space:nowrap;

    background:
        linear-gradient(
            180deg,
            #fff6bf 0%,
            var(--gold-light) 30%,
            var(--gold) 65%,
            var(--gold-dark) 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 3px 5px
        rgba(0,0,0,.9);
}


/* =====================================================
   HOME
===================================================== */

.home-button{

    min-width:135px;
    height:58px;

    padding:
        0 16px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    border:
        1px solid
        rgba(212,175,55,.65);

    border-radius:16px;

    color:#fff;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            #16476d,
            #061a2d
        );

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.12),

        0 8px 22px
        rgba(0,0,0,.48);

    font-family:inherit;

    font-size:18px;

    font-weight:900;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.home-icon{
    font-size:28px;
    line-height:1;
}

.home-text{
    color:#fff;
    white-space:nowrap;
}

.home-button:hover{

    transform:
        translateY(-4px)
        scale(1.03);

    border-color:
        var(--gold-light);

    box-shadow:

        0 13px 28px
        rgba(0,0,0,.55),

        0 0 20px
        rgba(212,175,55,.16);
}


/* =====================================================
   MAIN
===================================================== */

main{

    max-width:1100px;

    margin:auto;

    padding:
        45px 20px 70px;
}


/* =====================================================
   BIBLE PANEL
===================================================== */

.bible-panel{

    padding:25px;

    margin-bottom:30px;

    border:
        1px solid
        rgba(212,175,55,.32);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.96),
            rgba(4,23,39,.98)
        );

    box-shadow:
        var(--shadow);
}

.select-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;
}

.select-box{

    display:flex;

    flex-direction:column;

    gap:8px;
}

.select-box label{

    color:
        var(--gold-light);

    font-size:16px;

    font-weight:900;
}

select,
.search-input{

    width:100%;

    min-height:52px;

    padding:
        10px 15px;

    border:
        1px solid
        rgba(212,175,55,.45);

    border-radius:13px;

    outline:none;

    color:#fff;

    background:#082943;

    font-family:inherit;

    font-size:17px;

    font-weight:700;
}

select:focus,
.search-input:focus{

    border-color:
        var(--gold-light);

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}

select:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =====================================================
   SEARCH
===================================================== */

.search-row{

    margin-top:18px;

    display:grid;

    grid-template-columns:
        1fr auto;

    gap:10px;
}

.search-button{

    min-width:120px;

    border:
        1px solid
        rgba(212,175,55,.60);

    border-radius:13px;

    color:#071526;

    background:
        linear-gradient(
            180deg,
            #fff1a2,
            var(--gold),
            var(--gold-dark)
        );

    font-family:inherit;

    font-weight:900;

    font-size:16px;

    cursor:pointer;
}


/* =====================================================
   STATUS
===================================================== */

#status{

    margin-top:18px;

    min-height:25px;

    text-align:center;

    color:var(--muted);

    font-size:15px;
}


/* =====================================================
   CONTENT
===================================================== */

#content{
    width:100%;
}

.chapter-title{

    margin-bottom:22px;

    padding:20px;

    text-align:center;

    border:
        1px solid
        rgba(212,175,55,.42);

    border-radius:20px;

    color:var(--gold-light);

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.98),
            rgba(4,23,39,.99)
        );

    box-shadow:
        0 14px 35px
        rgba(0,0,0,.45);

    font-size:
        clamp(25px,4vw,36px);

    font-weight:900;
}


/* =====================================================
   VERSES
===================================================== */

.verse{

    display:flex;

    align-items:flex-start;

    gap:15px;

    margin-bottom:10px;

    padding:
        14px 15px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.055);

    background:
        rgba(8,41,67,.40);

    cursor:pointer;

    transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
}

.verse:hover{

    transform:
        translateX(-3px);

    border-color:
        rgba(212,175,55,.28);

    background:
        rgba(13,56,93,.62);
}

.vnum{

    flex:0 0 auto;

    min-width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    color:#071526;

    background:
        linear-gradient(
            180deg,
            #fff1a2,
            var(--gold),
            var(--gold-dark)
        );

    font-size:14px;

    font-weight:900;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.35);
}

.vtext{

    flex:1;

    color:#e6eef5;

    font-size:
        clamp(18px,2vw,22px);

    line-height:2;

    text-align:right;
}


/* =====================================================
   NAVIGATION
===================================================== */

.chapter-navigation{

    width:100%;

    margin:
        38px auto 10px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;

    direction:rtl;
}

.chapter-nav-button{

    min-height:72px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    padding:
        14px 18px;

    border:
        1px solid
        rgba(212,175,55,.55);

    border-radius:18px;

    color:#fff;

    font-family:inherit;

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            145deg,
            #164d77,
            #061b2d
        );

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.08);
}

.chapter-nav-button:hover:not(:disabled){

    transform:
        translateY(-4px);

    border-color:
        var(--gold-light);
}

.chapter-nav-button:disabled{

    opacity:.35;

    cursor:not-allowed;
}

.nav-arrow{

    color:
        var(--gold-light);

    font-size:25px;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

.search-result{

    margin-bottom:12px;

    padding:16px;

    border:
        1px solid
        rgba(212,175,55,.20);

    border-radius:15px;

    background:
        rgba(8,41,67,.55);

    cursor:pointer;

    line-height:2;
}

.search-reference{

    color:
        var(--gold-light);

    font-weight:900;

    margin-bottom:5px;
}


/* =====================================================
   VERSE MODAL
===================================================== */

.modal-backdrop{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(7px);
}

.modal{

    width:100%;

    max-width:900px;

    max-height:
        90vh;

    overflow:auto;

    border:
        1px solid
        rgba(212,175,55,.65);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #103e62,
            #041727
        );

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.75);

    animation:
        modalOpen .25s ease;
}

@keyframes modalOpen{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   MODAL HEADER
===================================================== */

.modal-header{

    position:sticky;

    top:0;

    z-index:5;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:
        18px 22px;

    border-bottom:
        1px solid
        rgba(212,175,55,.25);

    background:
        rgba(4,23,39,.96);

    backdrop-filter:
        blur(10px);
}

.modal-title{

    margin:0;

    color:
        var(--gold-light);

    font-size:
        clamp(20px,3vw,28px);

    font-weight:900;
}

.modal-close{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(212,175,55,.55);

    border-radius:12px;

    color:#fff;

    background:#082943;

    font-size:24px;

    cursor:pointer;
}


/* =====================================================
   MODAL TABS
===================================================== */

.modal-tabs{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    padding:
        15px 20px 0;

    background:
        rgba(4,23,39,.75);
}

.modal-tab{

    padding:
        11px 15px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:
        12px 12px 0 0;

    color:
        var(--muted);

    background:
        rgba(8,41,67,.60);

    font-family:inherit;

    font-weight:900;

    cursor:pointer;

    transition:.2s ease;
}

.modal-tab:hover{

    color:#fff;

    border-color:
        rgba(212,175,55,.55);
}

.modal-tab.active{

    color:
        #071526;

    background:
        linear-gradient(
            180deg,
            #fff1a2,
            var(--gold)
        );

    border-color:
        var(--gold);
}


/* =====================================================
   MODAL CONTENT
===================================================== */

.modal-body{

    padding:
        24px;
}

.modal-pane{

    display:none;
}

.modal-pane.active{

    display:block;
}

.verse-main-text{

    padding:22px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:18px;

    color:#f4f8fc;

    background:
        rgba(3,16,29,.55);

    font-size:
        clamp(20px,2.5vw,25px);

    line-height:2.2;
}

.info-card{

    margin-bottom:15px;

    padding:20px;

    border:
        1px solid
        rgba(212,175,55,.20);

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(16,62,98,.58),
            rgba(3,16,29,.72)
        );
}

.info-card h3{

    margin-top:0;

    color:
        var(--gold-light);

    font-size:20px;
}

.info-card p{

    margin-bottom:0;

    color:#d9e4ed;

    line-height:2;
}

.empty-module{

    padding:25px;

    text-align:center;

    border:
        1px dashed
        rgba(212,175,55,.35);

    border-radius:17px;

    color:
        var(--muted);

    background:
        rgba(3,16,29,.40);

    line-height:2;
}

.original-language{

    direction:ltr;

    text-align:left;

    font-family:
        "Times New Roman",
        serif;

    font-size:24px;

    line-height:2;
}

.original-label{

    direction:rtl;

    text-align:right;

    color:
        var(--gold-light);

    font-family:inherit;

    font-size:16px;

    margin-bottom:10px;
}


/* =====================================================
   ERROR
===================================================== */

.error{

    padding:25px;

    text-align:center;

    border:
        1px solid
        rgba(255,90,90,.35);

    border-radius:18px;

    color:#ffb5b5;

    background:
        rgba(120,20,20,.18);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .topbar{

        min-height:80px;

        padding:
            8px 12px;
    }

    .brand{
        gap:7px;
    }

    .brand-logo{

        width:52px;
        height:52px;
    }

    .brand-name{
        font-size:14px;
    }

    .home-button{

        min-width:105px;

        height:50px;

        padding:
            0 12px;

        font-size:15px;

        border-radius:14px;
    }

    main{

        padding:
            30px 12px 50px;
    }

    .bible-panel{

        padding:16px;

        border-radius:18px;
    }

    .select-grid{

        grid-template-columns:1fr;

        gap:12px;
    }

    .search-row{

        grid-template-columns:1fr;
    }

    .verse{

        gap:10px;

        padding:
            11px 9px;
    }

    .vnum{

        min-width:32px;

        height:32px;

        font-size:13px;
    }

    .vtext{

        font-size:18px;

        line-height:2;
    }

    .chapter-navigation{

        grid-template-columns:1fr;

        gap:12px;
    }

    .modal{

        max-height:94vh;

        border-radius:19px;
    }

    .modal-body{

        padding:16px;
    }

    .modal-tabs{

        padding:
            12px 12px 0;

        overflow-x:auto;

        flex-wrap:nowrap;
    }

    .modal-tab{

        white-space:nowrap;

        font-size:13px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-frame">

    <div class="topbar">


        <a
            href="index.html"
            class="home-button"
            aria-label="الرئيسية"
        >

            <span class="home-icon">
                🏠
            </span>

            <span
                class="home-text"
                id="homeText"
            >
                الرئيسية
            </span>

        </a>


        <div class="brand">

            <div
                class="brand-name"
                id="churchName"
            >
                كنيسة رجاء الأمم سيدني
            </div>

            <img
                src="assets/logo.png"
                class="brand-logo"
                alt="كنيسة رجاء الأمم سيدني"
            >

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <section class="bible-panel">

        <div class="select-grid">


            <div class="select-box">

                <label for="book">
                    السفر
                </label>

                <select id="book">

                    <option value="">
                        جاري تحميل الأسفار...
                    </option>

                </select>

            </div>


            <div class="select-box">

                <label for="chapter">
                    الأصحاح
                </label>

                <select
                    id="chapter"
                    disabled
                >

                    <option value="">
                        اختر السفر أولًا
                    </option>

                </select>

            </div>

        </div>


        <div class="search-row">

            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="ابحث في نص الكتاب المقدس..."
                autocomplete="off"
            >

            <button
                id="searchButton"
                class="search-button"
                type="button"
            >
                🔎 بحث
            </button>

        </div>


        <div id="status">
            جاري تحميل الكتاب المقدس...
        </div>

    </section>


    <section id="content"></section>


</main>


<!-- =====================================================
     VERSE STUDY MODAL
===================================================== -->

<div
    id="modalBackdrop"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
>


    <div class="modal">


        <div class="modal-header">

            <h2
                id="modalTitle"
                class="modal-title"
            >
                الآية
            </h2>


            <button
                id="modalClose"
                class="modal-close"
                type="button"
                aria-label="إغلاق"
            >
                ✕
            </button>

        </div>


        <div
            id="modalTabs"
            class="modal-tabs"
        >

            <button
                class="modal-tab active"
                data-pane="versePane"
                type="button"
            >
                📖 الآية
            </button>

            <button
                class="modal-tab"
                data-pane="originalPane"
                type="button"
            >
                🔤 الأصل
            </button>

            <button
                class="modal-tab"
                data-pane="similarPane"
                type="button"
            >
                🔗 آيات مشابهة
            </button>

            <button
                class="modal-tab"
                data-pane="mapPane"
                type="button"
            >
                🗺️ الخريطة
            </button>

            <button
                class="modal-tab"
                data-pane="studyPane"
                type="button"
            >
                📚 الدراسات
            </button>

            <button
                class="modal-tab"
                data-pane="entitiesPane"
                type="button"
            >
                👤 الأشخاص والأماكن
            </button>

        </div>


        <div class="modal-body">


            <!-- =================================================
                 VERSE
            ================================================== -->

            <section
                id="versePane"
                class="modal-pane active"
            >

                <div
                    id="modalVerseText"
                    class="verse-main-text"
                ></div>


                <div class="info-card">

                    <h3>
                        مرجع الآية
                    </h3>

                    <p id="modalReference"></p>

                </div>

            </section>


            <!-- =================================================
                 ORIGINAL LANGUAGE
            ================================================== -->

            <section
                id="originalPane"
                class="modal-pane"
            >

                <div
                    id="originalContent"
                ></div>

            </section>


            <!-- =================================================
                 SIMILAR VERSES
            ================================================== -->

            <section
                id="similarPane"
                class="modal-pane"
            >

                <div
                    id="similarContent"
                ></div>

            </section>


            <!-- =================================================
                 MAP
            ================================================== -->

            <section
                id="mapPane"
                class="modal-pane"
            >

                <div
                    id="mapContent"
                ></div>

            </section>


            <!-- =================================================
                 STUDIES
            ================================================== -->

            <section
                id="studyPane"
                class="modal-pane"
            >

                <div
                    id="studyContent"
                ></div>

            </section>


            <!-- =================================================
                 ENTITIES
            ================================================== -->

            <section
                id="entitiesPane"
                class="modal-pane"
            >

                <div
                    id="entitiesContent"
                ></div>

            </section>


        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const BIBLE_URL =
    "./bible.json";

const SECOND_PETER_URL =
    "./2pet.json";


/* =========================================================
   BOOKS
========================================================= */

const BOOKS = {

    "01-gen":
        "التكوين",

    "02-Exodus":
        "الخروج",

    "03-Leviticus":
        "اللاويين",

    "04-Numbers":
        "العدد",

    "05-Deut":
        "التثنية",

    "06-Joshua":
        "يشوع",

    "07-Judges":
        "القضاة",

    "08-Ruth":
        "راعوث",

    "09-1-Samuel":
        "صموئيل الأول",

    "10-2-Samuel":
        "صموئيل الثاني",

/* =========================================================
   HELPERS
========================================================= */

const $ =
    id =>
        document.getElementById(id);


function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function bookName(id){

    return BOOKS[id] || id;
}


function normaliseRows(data){

    if(!Array.isArray(data))
        return [];

    return data

        .map(v => ({

            book:
                String(
                    v.book ?? ""
                ).trim(),

            chapter:
                Number(
                    v.chapter
                ),

            verse:
                Number(
                    v.verse ??
                    v.number
                ),

            text:
                String(
                    v.text ?? ""
                ).trim(),

            /*
             * المستقبل:
             * هذه الحقول لا نملؤها من عندنا.
             * إذا أضيفت لاحقًا إلى JSON
             * ستقرأها الصفحة تلقائيًا.
             */

            original:
                v.original ?? null,

            transliteration:
                v.transliteration ?? null,

            parallel:
                Array.isArray(v.parallel)
                    ? v.parallel
                    : [],

            similar:
                Array.isArray(v.similar)
                    ? v.similar
                    : [],

            maps:
                Array.isArray(v.maps)
                    ? v.maps
                    : [],

            studies:
                Array.isArray(v.studies)
                    ? v.studies
                    : [],

            people:
                Array.isArray(v.people)
                    ? v.people
                    : [],

            places:
                Array.isArray(v.places)
                    ? v.places
                    : [],

            themes:
                Array.isArray(v.themes)
                    ? v.themes
                    : []

        }))

        .filter(v =>

            v.book &&

            Number.isFinite(
                v.chapter
            ) &&

            Number.isFinite(
                v.verse
            ) &&

            v.text

        );

}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadJSON(url){

    const response =
        await fetch(
            url +
            "?v=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            `${url} HTTP ${response.status}`
        );

    }

    return response.json();

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

    try{

        $("status").textContent =
            "جاري تحميل قاعدة الكتاب المقدس...";


        const mainData =
            await loadJSON(
                BIBLE_URL
            );


        const mainRows =
            normaliseRows(
                mainData
            );


        let petRows = [];


        try{

            const petData =
                await loadJSON(
                    SECOND_PETER_URL
                );

            petRows =
                normaliseRows(
                    petData
                );

        }
        catch(error){

            console.warn(
                "تعذر تحميل 2pet.json:",
                error
            );

        }


        /*
         * دمج بطرس الثانية
         *
         * هذا يحافظ على bible.json
         * كمصدر أساسي، ويكمل السفر
         * رقم 61 من الملف المستقل.
         */

        verses = [

            ...mainRows.filter(
                verse =>
                    verse.book !==
                    "61-2pet"
            ),

            ...petRows.map(
                verse => ({

                    ...verse,

                    book:
                        "61-2pet"

                })
            )

        ];


        verses.sort(
            (a,b) => {

                const ai =
                    getBookIndex(
                        a.book
                    );

                const bi =
                    getBookIndex(
                        b.book
                    );


                if(ai !== bi)
                    return ai - bi;


                if(
                    a.chapter !==
                    b.chapter
                )
                    return (
                        a.chapter -
                        b.chapter
                    );


                return (
                    a.verse -
                    b.verse
                );

            }
        );


        const bookCount =
            new Set(
                verses.map(
                    v => v.book
                )
            ).size;


        $("status").textContent =
            `تم تحميل ${verses.length.toLocaleString("ar-EG")} آية من ${bookCount} سفرًا.`;


        buildBooks();


    }
    catch(error){

        console.error(
            "Bible loading failed:",
            error
        );


        $("status").innerHTML =

            `<div class="error">

                تعذر تحميل قاعدة الكتاب المقدس.

                <br><br>

                تأكد من وجود:

                <strong>bible.json</strong>

                و

                <strong>2pet.json</strong>

                في المجلد الرئيسي.

            </div>`;

    }

}


/* =========================================================
   BOOK INDEX
========================================================= */

function getBookIndex(book){

    const oldIndex =
        OLD_ORDER.indexOf(
            book
        );

    if(oldIndex >= 0)
        return oldIndex;


    const newIndex =
        NEW_ORDER.indexOf(
            book
        );

    if(newIndex >= 0)
        return 39 + newIndex;


    return 999;

}


/* =========================================================
   BUILD BOOKS
========================================================= */

function buildBooks(){

    const available =
        new Set(
            verses.map(
                v => v.book
            )
        );


    const oldBooks =
        OLD_ORDER.filter(
            id =>
                available.has(id)
        );


    const newBooks =
        NEW_ORDER.filter(
            id =>
                available.has(id)
        );


    $("book").innerHTML =

        `<option value="">
            اختر السفر
        </option>

        <optgroup label="العهد القديم">

            ${
                oldBooks.map(
                    id =>

                    `<option value="${escapeHTML(id)}">
                        ${escapeHTML(bookName(id))}
                    </option>`

                ).join("")
            }

        </optgroup>

        <optgroup label="العهد الجديد">

            ${
                newBooks.map(
                    id =>

                    `<option value="${escapeHTML(id)}">
                        ${escapeHTML(bookName(id))}
                    </option>`

                ).join("")
            }

        </optgroup>`;


    if(
        available.has(
            "01-gen"
        )
    ){

        $("book").value =
            "01-gen";

        buildChapters();

    }

}


/* =========================================================
   CHAPTERS
========================================================= */

function buildChapters(){

    const book =
        $("book").value;


    $("chapter").innerHTML =

        `<option value="">
            اختر الأصحاح
        </option>`;


    if(!book){

        $("chapter").disabled =
            true;

        $("content").innerHTML =
            "";

        return;

    }


    const chapters = [

        ...new Set(

            verses

                .filter(
                    v =>
                        v.book ===
                        book
                )

                .map(
                    v =>
                        v.chapter
                )

        )

    ].sort(
        (a,b) => a-b
    );


    chapters.forEach(
        chapter => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                chapter;

            option.textContent =
                "الأصحاح " +
                chapter;

            $("chapter")
                .appendChild(
                    option
                );

        }
    );


    $("chapter").disabled =
        chapters.length === 0;


    if(chapters.length){

        $("chapter").value =
            chapters[0];

        renderChapter();

    }

}


/* =========================================================
   ALL CHAPTERS
========================================================= */

function getAllChapters(){

    const result = [];


    [
        ...OLD_ORDER,
        ...NEW_ORDER
    ]

    .forEach(
        book => {

            const chapters = [

                ...new Set(

                    verses

                        .filter(
                            v =>
                                v.book ===
                                book
                        )

                        .map(
                            v =>
                                v.chapter
                        )

                )

            ].sort(
                (a,b) => a-b
            );


            chapters.forEach(
                chapter => {

                    result.push({

                        book,
                        chapter

                    });

                }
            );

        }
    );


    return result;

}


/* =========================================================
   RENDER CHAPTER
========================================================= */

function renderChapter(){

    const book =
        $("book").value;


    const chapter =
        Number(
            $("chapter").value
        );


    if(
        !book ||
        !chapter
    ){

        $("content").innerHTML =
            "";

        return;

    }


    const rows =
        verses

            .filter(
                v =>

                    v.book ===
                    book &&

                    v.chapter ===
                    chapter
            )

            .sort(
                (a,b) =>
                    a.verse -
                    b.verse
            );


    if(!rows.length){

        $("content").innerHTML =

            `<div class="error">
                لا توجد آيات لهذا الأصحاح.
            </div>`;

        return;

    }


    $("content").innerHTML =

        `

        <div class="chapter-title">

            ${escapeHTML(
                bookName(book)
            )}

            — الأصحاح ${chapter}

        </div>


        ${
            rows.map(
                verse => `

                    <div
                        class="verse"
                        data-book="${escapeHTML(verse.book)}"
                        data-chapter="${verse.chapter}"
                        data-verse="${verse.verse}"
                    >

                        <span class="vnum">
                            ${verse.verse}
                        </span>

                        <span class="vtext">
                            ${escapeHTML(
                                verse.text
                            )}
                        </span>

                    </div>

                `
            ).join("")
        }

        `;


    document
        .querySelectorAll(".verse")
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        openVerse(

                            element.dataset.book,

                            Number(
                                element.dataset.chapter
                            ),

                            Number(
                                element.dataset.verse
                            )

                        );

                    }
                );

            }
        );


    buildNavigation(
        book,
        chapter
    );


    $("status").textContent =

        `${bookName(book)} — الأصحاح ${chapter} — ${rows.length} آية`;

}


/* =========================================================
   NAVIGATION
========================================================= */

function buildNavigation(
    currentBook,
    currentChapter
){

    const chapters =
        getAllChapters();


    const currentIndex =
        chapters.findIndex(
            item =>

                item.book ===
                currentBook &&

                item.chapter ===
                currentChapter
        );


    const previous =
        currentIndex > 0
            ?
            chapters[
                currentIndex - 1
            ]
            :
            null;


    const next =
        currentIndex <
        chapters.length - 1
            ?
            chapters[
                currentIndex + 1
            ]
            :
            null;


    const container =
        document.createElement(
            "div"
        );


    container.className =
        "chapter-navigation";


    container.innerHTML =

        `

        <button
            class="chapter-nav-button"
            id="previousButton"
            ${previous ? "" : "disabled"}
        >

            <span class="nav-arrow">
                →
            </span>

            <span>

                السابق

                ${
                    previous
                    ?
                    ` — ${escapeHTML(
                        bookName(
                            previous.book
                        )
                    )} ${previous.chapter}`
                    :
                    ""
                }

            </span>

        </button>


        <button
            class="chapter-nav-button"
            id="nextButton"
            ${next ? "" : "disabled"}
        >

            <span>

                التالي

                ${
                    next
                    ?
                    ` — ${escapeHTML(
                        bookName(
                            next.book
                        )
                    )} ${next.chapter}`
                    :
                    ""
                }

            </span>

            <span class="nav-arrow">
                ←
            </span>

        </button>

        `;


    $("content")
        .appendChild(
            container
        );


    if(previous){

        $("previousButton")
            .onclick =
            () => {

                goToChapter(
                    previous.book,
                    previous.chapter
                );

            };

    }


    if(next){

        $("nextButton")
            .onclick =
            () => {

                goToChapter(
                    next.book,
                    next.chapter
                );

            };

    }

}


/* =========================================================
   GO TO CHAPTER
========================================================= */

function goToChapter(
    book,
    chapter
){

    $("book").value =
        book;

    buildChapters();

    $("chapter").value =
        String(chapter);

    renderChapter();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   SEARCH
========================================================= */

function searchBible(){

    const query =
        $("searchInput")
            .value
            .trim();


    if(!query){

        renderChapter();

        return;

    }


    const normalized =
        query.toLocaleLowerCase(
            "ar"
        );


    const results =
        verses

            .filter(
                verse =>

                    verse.text
                        .toLocaleLowerCase(
                            "ar"
                        )
                        .includes(
                            normalized
                        )
            )

            .slice(
                0,
                300
            );


    $("status").textContent =

        `نتائج البحث عن «${query}»: ${results.length}`;


    if(!results.length){

        $("content").innerHTML =

            `<div class="error">

                لا توجد نتائج مطابقة.

            </div>`;

        return;

    }


    $("content").innerHTML =

        results

            .map(
                verse => `

                    <div
                        class="search-result"
                        data-book="${escapeHTML(verse.book)}"
                        data-chapter="${verse.chapter}"
                        data-verse="${verse.verse}"
                    >

                        <div
                            class="search-reference"
                        >

                            ${escapeHTML(
                                bookName(
                                    verse.book
                                )
                            )}

                            ${verse.chapter}:${verse.verse}

                        </div>

                        <div>

                            ${escapeHTML(
                                verse.text
                            )}

                        </div>

                    </div>

                `
            )

            .join("");


    document
        .querySelectorAll(
            ".search-result"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        openVerse(

                            element.dataset.book,

                            Number(
                                element.dataset.chapter
                            ),

                            Number(
                                element.dataset.verse
                            )

                        );

                    }
                );

            }
        );

}


/* =========================================================
   OPEN VERSE
========================================================= */

function openVerse(
    book,
    chapter,
    verse
){

    const found =
        verses.find(
            item =>

                item.book ===
                book &&

                item.chapter ===
                chapter &&

                item.verse ===
                verse
        );


    if(!found)
        return;


    currentVerse =
        found;


    $("modalTitle").textContent =

        `${bookName(book)} ${chapter}:${verse}`;


    $("modalReference").textContent =

        `${bookName(book)} ${chapter}:${verse}`;


    $("modalVerseText").textContent =
        found.text;


    prepareOriginalLanguage(
        found
    );


    prepareSimilarVerses(
        found
    );


    prepareMap(
        found
    );


    prepareStudies(
        found
    );


    prepareEntities(
        found
    );


    activatePane(
        "versePane"
    );


    $("modalBackdrop").style.display =
        "flex";

    $("modalBackdrop")
        .setAttribute(
            "aria-hidden",
            "false"
        );

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   CLOSE VERSE
========================================================= */

function closeVerse(){

    $("modalBackdrop").style.display =
        "none";

    $("modalBackdrop")
        .setAttribute(
            "aria-hidden",
            "true"
        );

    document.body.style.overflow =
        "";

    currentVerse =
        null;

}


/* =========================================================
   TABS
========================================================= */

function activatePane(
    paneId
){

    document
        .querySelectorAll(
            ".modal-tab"
        )
        .forEach(
            tab => {

                tab.classList.toggle(

                    "active",

                    tab.dataset.pane ===
                    paneId

                );

            }
        );


    document
        .querySelectorAll(
            ".modal-pane"
        )
        .forEach(
            pane => {

                pane.classList.toggle(

                    "active",

                    pane.id ===
                    paneId

                );

            }
        );

}


/* =========================================================
   ORIGINAL LANGUAGE
========================================================= */

function prepareOriginalLanguage(
    verse
){

    const container =
        $("originalContent");


    /*
     * لا نضع أي نص عبري أو يوناني
     * من عندنا.
     *
     * سيتم ربط قاعدة النص الأصلي
     * لاحقًا بالحقول:
     *
     * original.language
     * original.text
     * original.words
     * transliteration
     */

    if(
        verse.original &&
        (
            verse.original.text ||
            verse.original.language
        )
    ){

        const language =
            verse.original.language ||
            "الأصل الكتابي";


        const text =
            verse.original.text ||
            "";


        container.innerHTML =

            `

            <div class="info-card">

                <div class="original-label">

                    ${escapeHTML(
                        language
                    )}

                </div>

                <div class="original-language">

                    ${escapeHTML(
                        text
                    )}

                </div>

            </div>

            `;

        return;

    }


    const isOld =
        OLD_ORDER.includes(
            verse.book
        );


    container.innerHTML =

        `

        <div class="empty-module">

            <strong>
                ${isOld
                    ? "العبرية الكتابية"
                    : "اليونانية الكوينية"
                }
            </strong>

            <br><br>

            قاعدة النص الأصلي والتحليل اللغوي
            سيتم ربطها هنا لاحقًا.

            <br>

            هذه النافذة مجهزة مسبقًا
            لاستقبال النص الأصلي،
            النطق،
            الكلمات،
            الجذر،
            الصيغة الصرفية،
            والمعنى.

        </div>

        `;

}

                                    item.text ||
                                    ""
                                )}
                            </p>

                        </div>

                    `
                )
                .join("");

        return;

    }


    /*
     * في حالة عدم وجود علاقات يدوية
     * في JSON، نستخدم بحثًا أوليًا
     * بسيطًا داخل النص الحالي.
     *
     * لاحقًا سيتم استبداله بمحرك
     * العلاقات الكتابية الحقيقي.
     */

    const words =
        verse.text

            .replace(
                /[^\u0600-\u06FF\s]/g,
                " "
            )

            .split(/\s+/)

            .map(
                word =>
                    word.trim()
            )

            .filter(
                word =>
                    word.length >= 4
            );


    const uniqueWords =
        [
            ...new Set(words)
        ]
        .slice(
            0,
            8
        );


    if(!uniqueWords.length){

        container.innerHTML =

            `<div class="empty-module">
                لا توجد بيانات للآيات المشابهة حاليًا.
            </div>`;

        return;

    }


    const candidates =
        verses

            .filter(
                item =>

                    item.book !==
                    verse.book ||
                    item.chapter !==
                    verse.chapter ||
                    item.verse !==
                    verse.verse
            )

            .map(
                item => {

                    const text =
                        item.text;


                    let score = 0;


                    uniqueWords
                        .forEach(
                            word => {

                                if(
                                    text.includes(
                                        word
                                    )
                                ){

                                    score++;

                                }

                            }
                        );


                    return {
                        item,
                        score
                    };

                }
            )

            .filter(
                result =>
                    result.score >= 2
            )

            .sort(
                (a,b) =>
                    b.score -
                    a.score
            )

            .slice(
                0,
                12
            );


    if(!candidates.length){

        container.innerHTML =

            `<div class="empty-module">

                لا توجد آيات مشابهة كافية
                في البيانات الحالية.

                <br><br>

                سيتم لاحقًا ربط هذا القسم
                بمحرك العلاقات الكتابية.

            </div>`;

        return;

    }


    container.innerHTML =

        candidates

            .map(
                result => `

                    <div
                        class="info-card"
                        data-book="${escapeHTML(result.item.book)}"
                        data-chapter="${result.item.chapter}"
                        data-verse="${result.item.verse}"
                        style="cursor:pointer"
                    >

                        <h3>

                            ${escapeHTML(
                                bookName(
                                    result.item.book
                                )
                            )}

                            ${result.item.chapter}:${result.item.verse}

                        </h3>

                        <p>

                            ${escapeHTML(
                                result.item.text
                            )}

                        </p>

                    </div>

                `
            )

            .join("");


    container
        .querySelectorAll(
            ".info-card"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    () => {

                        openVerse(

                            card.dataset.book,

                            Number(
                                card.dataset.chapter
                            ),

                            Number(
                                card.dataset.verse
                            )

                        );

                    }
                );

            }
        );

}

/* =========================================================
   PEOPLE / PLACES / THEMES
========================================================= */

function prepareEntities(
    verse
){

    const container =
        $("entitiesContent");


    const people =
        Array.isArray(
            verse.people
        )
            ?
            verse.people
            :
            [];


    const places =
        Array.isArray(
            verse.places
        )
            ?
            verse.places
            :
            [];


    const themes =
        Array.isArray(
            verse.themes
        )
            ?
            verse.themes
            :
            [];


    if(
        !people.length &&
        !places.length &&
        !themes.length
    ){

        container.innerHTML =

            `

            <div class="empty-module">

                👤 الأشخاص والأماكن والموضوعات

                <br><br>

                لا توجد علاقات محددة لهذه الآية
                في قاعدة البيانات حاليًا.

                <br><br>

                هذا القسم مجهز ليصبح لاحقًا
                جزءًا من شبكة المعرفة الكتابية.

            </div>

            `;

        return;

    }


    let html = "";


    if(people.length){

        html +=

            `

            <div class="info-card">

                <h3>
                    👤 الأشخاص
                </h3>

                <p>
                    ${people
                        .map(
                            person =>
                                escapeHTML(
                                    person.name ||
                                    person
                                )
                        )
                        .join(" — ")
                    }
                </p>

            </div>

            `;

    }


    if(places.length){

        html +=

            `

            <div class="info-card">

                <h3>
                    📍 الأماكن
                </h3>

                <p>
                    ${places
                        .map(
                            place =>
                                escapeHTML(
                                    place.name ||
                                    place
                                )
                        )
                        .join(" — ")
                    }
                </p>

            </div>

            `;

    }


    if(themes.length){

        html +=

            `

            <div class="info-card">

                <h3>
                    🏷️ الموضوعات
                </h3>

                <p>
                    ${themes
                        .map(
                            theme =>
                                escapeHTML(
                                    theme.name ||
                                    theme
                                )
                        )
                        .join(" — ")
                    }
                </p>

            </div>

            `;

    }


    container.innerHTML =
        html;

}

/* =========================================================
   LANGUAGE
========================================================= */

const translations = {

    ar:{

        churchName:
            "كنيسة رجاء الأمم سيدني",

        homeText:
            "الرئيسية"

    },

    en:{

        churchName:
            "Hope Of Nation Church NSW",

        homeText:
            "Home"

    }

};


function setLanguage(
    language
){

    const t =
        translations[
            language
        ];


    if(!t)
        return;


    document.documentElement.lang =
        language;


    document.documentElement.dir =
        language === "en"
            ?
            "ltr"
            :
            "rtl";


    $("churchName")
        .textContent =
        t.churchName;


    $("homeText")
        .textContent =
        t.homeText;


    localStorage.setItem(
        "bibleAppLanguage",
        language
    );

}


const savedLanguage =
    localStorage.getItem(
        "bibleAppLanguage"
    ) ||
    "ar";


setLanguage(
    savedLanguage
);
