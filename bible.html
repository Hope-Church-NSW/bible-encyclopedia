<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a46;
    --panel3:#153657;
    --gold:#d4af37;
    --gold2:#f2d675;
    --white:#f4f7fb;
    --muted:#9fb0c3;
    --line:#1d3b59;
    --blue:#2d7ff9;
    --danger:#ffb4b4;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at top right,
            rgba(45,127,249,.12),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );
    color:var(--white);
    font-family:
        Arial,
        Tahoma,
        "Segoe UI",
        sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(6,19,33,.97);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.header-inner{
    width:min(1400px,92%);
    min-height:78px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.home-button{
    min-height:48px;
    padding:10px 18px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--panel2);
    color:var(--gold2);
    text-decoration:none;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition:.2s ease;
}

.home-button:hover{
    background:var(--panel3);
    transform:translateY(-1px);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:68px;
    height:68px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold2);
    font-size:25px;
    font-weight:900;
    text-shadow:
        0 2px 8px rgba(212,175,55,.30);
}

main{
    width:min(1250px,94%);
    margin:auto;
    padding:30px 0 60px;
}

#app{
    width:100%;
}

.start-screen{
    width:100%;
}

.start-title{
    text-align:center;
    color:var(--gold2);
    font-size:32px;
    font-weight:900;
    margin:0 0 10px;
}

.start-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:16px;
    margin:0 0 28px;
}

.main-icons{
    width:min(950px,100%);
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:28px;
}

.main-icon{
    min-height:300px;
    border:1px solid var(--line);
    border-radius:26px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    color:var(--white);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px 25px;
    transition:.25s ease;
    box-shadow:
        0 15px 35px rgba(0,0,0,.20);
}

.main-icon:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
    background:
        linear-gradient(
            145deg,
            var(--panel3),
            var(--panel2)
        );
    box-shadow:
        0 20px 45px rgba(0,0,0,.28);
}

.main-icon-symbol{
    font-size:88px;
    line-height:1;
    margin-bottom:25px;
}

.main-icon-title{
    color:var(--gold2);
    font-size:30px;
    font-weight:900;
}

.main-icon-description{
    color:var(--muted);
    font-size:15px;
    margin-top:10px;
}

.workspace{
    width:100%;
    background:rgba(13,33,56,.96);
    border:1px solid var(--line);
    border-radius:22px;
    padding:25px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.22);
}

.inner-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:24px;
}

.inner-back{
    border:1px solid var(--gold);
    border-radius:11px;
    background:var(--panel2);
    color:var(--gold2);
    min-height:44px;
    padding:9px 16px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.inner-back:hover{
    background:var(--panel3);
}

.inner-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;
    margin:0;
}

.testaments{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
}

.testament{
    min-height:190px;
    border:1px solid var(--line);
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    color:var(--white);
    cursor:pointer;
    text-align:center;
    padding:28px;
    transition:.22s ease;
}

.testament:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    background:var(--panel3);
}

.testament-symbol{
    font-size:55px;
    margin-bottom:12px;
}

.testament-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;
}

.testament-count{
    color:var(--muted);
    margin-top:8px;
    font-size:16px;
}

.books-grid{
    display:grid;
    grid-template-columns:
        repeat(3,minmax(0,1fr));
    gap:12px;
}

.book{
    min-height:78px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--panel2);
    color:var(--gold2);
    cursor:pointer;
    padding:18px 13px;
    font-size:25px;
    font-weight:900;
    transition:.2s ease;
}

.book:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
    transform:translateY(-2px);
}

.chapters-grid{
    display:grid;
    grid-template-columns:
        repeat(7,minmax(0,1fr));
    gap:10px;
}

.chapter{
    min-height:60px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:18px;
    font-weight:900;
    transition:.2s ease;
}

.chapter:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
    transform:translateY(-2px);
}

.chapter-reading{
    width:100%;
}

.chapter-heading{
    text-align:center;
    padding:5px 0 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
}

.chapter-book-name{
    color:var(--gold2);
    font-size:25px;
    font-weight:900;
    margin-bottom:7px;
}

.chapter-number{
    margin:0;
    color:var(--gold2);
    font-size:30px;
    font-weight:900;
}

.verses{
    width:100%;
}

.verse{
    padding:18px 8px;
    border-bottom:1px solid #17344f;
    font-size:21px;
    line-height:2.35;
    cursor:pointer;
    transition:.18s ease;
}

.verse:hover{
    background:rgba(16,42,70,.75);
}

.verse-number{
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
    margin-left:9px;
}

.chapter-navigation{
    margin-top:15px;
    padding-top:18px;
    border-top:1px solid var(--line);

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
}

.nav-button{
    min-height:52px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    padding:10px 18px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.nav-button:hover:not(:disabled){
    border-color:var(--gold);
    color:var(--gold2);
    background:var(--panel3);
}

.nav-button:disabled{
    opacity:.30;
    cursor:not-allowed;
}

.previous{
    justify-self:start;
}

.next{
    justify-self:end;
}

.audio{
    width:60px;
    height:52px;
    padding:0;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-container{
    width:100%;
}

.search-form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-input{
    flex:1;
    min-height:55px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    outline:none;
    padding:12px 16px;
    font-size:18px;
}

.search-input:focus{
    border-color:var(--gold);
}

.search-submit{
    min-width:115px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--panel3);
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.search-results{
    width:100%;
}

.search-result{
    padding:16px 8px;
    border-bottom:1px solid #17344f;
    cursor:pointer;
    line-height:2;
}

.search-result:hover{
    background:var(--panel2);
}

.search-reference{
    display:block;
    color:var(--gold2);
    font-size:16px;
    font-weight:900;
    margin-bottom:4px;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    line-height:2;
}

.error{
    color:var(--danger);
    background:#351b24;
    border:1px solid #6b3040;
    border-radius:12px;
    padding:16px;
    line-height:2;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:min(760px,100%);
    max-height:88vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:20px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.50);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
}

.modal-title{
    margin:0;
    color:var(--gold2);
    font-size:23px;
    font-weight:900;
}

.close-modal{
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:22px;
}

.modal-verse{
    padding:22px;
    font-size:20px;
    line-height:2.35;
    border-bottom:1px solid var(--line);
}

.modal-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    padding:18px;
}

.modal-action{
    min-height:58px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:17px;
    font-weight:900;
    transition:.2s ease;
}

.modal-action:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
}

@media(max-width:900px){

    .books-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .chapters-grid{
        grid-template-columns:repeat(5,minmax(0,1fr));
    }

}

@media(max-width:700px){

    .header-inner{
        min-height:68px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .brand-title{
        font-size:19px;
    }

    .home-button{
        min-height:42px;
        padding:8px 12px;
        font-size:15px;
    }

    main{
        width:94%;
        padding-top:20px;
    }

    .main-icons{
        grid-template-columns:1fr;
        gap:18px;
    }

    .main-icon{
        min-height:240px;
    }

    .main-icon-symbol{
        font-size:72px;
    }

    .main-icon-title{
        font-size:26px;
    }

    .testaments{
        grid-template-columns:1fr;
    }

    .workspace{
        padding:16px;
    }

    .books-grid{
        grid-template-columns:1fr;
    }

    .chapters-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .verse{
        font-size:18px;
        line-height:2.25;
    }

    .chapter-number{
        font-size:26px;
    }

    .modal-actions{
        grid-template-columns:1fr;
    }

}

@media(max-width:430px){

    .brand-title{
        font-size:16px;
    }

    .chapters-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .chapter-navigation{
        gap:6px;
    }

    .nav-button{
        padding:8px;
        font-size:14px;
    }

    .audio{
        width:50px;
    }

}
</style>
</head>

/* =========================================================
   حماية HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}


/* =========================================================
   تحويل قيم الأصحاح والآية
========================================================= */

function normalizeNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return NaN;

    }

    const number =
        Number(
            String(value)
                .replace(/[^\d.]/g,"")
        );

    return Number.isFinite(number)
        ? number
        : NaN;

}


/* =========================================================
   استخراج النص
========================================================= */

function extractText(value){

    if(value === null || value === undefined){

        return "";

    }

    if(typeof value === "string"){

        return value.trim();

    }

    if(typeof value === "number"){

        return String(value);

    }

    if(typeof value === "object"){

        const candidates = [

            value.text,
            value.verse,
            value.content,
            value.value,
            value.body

        ];

        for(const candidate of candidates){

            const text = extractText(candidate);

            if(text){

                return text;

            }

        }

    }

    return "";

}


/* =========================================================
   استخراج اسم السفر من أي بنية محتملة
========================================================= */

function normalizeBookId(value){

    if(value === null || value === undefined){

        return "";

    }

    if(typeof value === "object"){

        return normalizeBookId(

            value.book ??
            value.bookId ??
            value.id ??
            value.name ??
            value.key

        );

    }

    const raw =
        String(value).trim();

    if(!raw){

        return "";

    }

    if(BOOK_NAMES[raw]){

        return raw;

    }

    const clean =
        raw
            .replace(/\.json$/i,"")
            .trim();

    if(BOOK_NAMES[clean]){

        return clean;

    }

    const lower =
        clean.toLowerCase();

    const found =
        ALL_BOOKS.find(function(id){

            return id.toLowerCase() === lower;

        });

    if(found){

        return found;

    }

    return clean;

}


/* =========================================================
   إضافة آية صحيحة إلى قاعدة الذاكرة
========================================================= */

function pushVerse(book,chapter,verse,text){

    const bookId =
        normalizeBookId(book);

    const chapterNumber =
        normalizeNumber(chapter);

    const verseNumber =
        normalizeNumber(verse);

    const verseText =
        extractText(text);

    if(!bookId){

        return;

    }

    if(!Number.isFinite(chapterNumber)){

        return;

    }

    if(!Number.isFinite(verseNumber)){

        return;

    }

    if(!verseText){

        return;

    }

    verses.push({

        book:bookId,

        chapter:chapterNumber,

        verse:verseNumber,

        text:verseText

    });

}


/* =========================================================
   قراءة صف آية مباشر
========================================================= */

function readDirectVerseObject(obj){

    if(!obj || typeof obj !== "object"){

        return false;

    }

    const book =
        obj.book ??
        obj.bookId ??
        obj.book_id ??
        obj.bookID ??
        obj.bookName;

    const chapter =
        obj.chapter ??
        obj.chapterNumber ??
        obj.chapter_number ??
        obj.ch;

    const verse =
        obj.verse ??
        obj.verseNumber ??
        obj.verse_number ??
        obj.number ??
        obj.v;

    const text =
        obj.text ??
        obj.content ??
        obj.verseText ??
        obj.body;

    if(
        book !== undefined &&
        chapter !== undefined &&
        verse !== undefined &&
        text !== undefined
    ){

        pushVerse(
            book,
            chapter,
            verse,
            text
        );

        return true;

    }

    return false;

}


/* =========================================================
   قراءة بنية bible.json المرنة
========================================================= */

function parseBibleData(data){

    verses = [];

    verseIndex.clear();

    chapterIndex.clear();


    /*
       الحالة 1:
       bible.json عبارة عن مصفوفة مباشرة
       من الآيات.
    */

    if(Array.isArray(data)){

        for(const item of data){

            readRecursive(
                item,
                null,
                null
            );

        }

    }else{

        readRecursive(
            data,
            null,
            null
        );

    }


    /*
       إزالة التكرار.
    */

    const unique =
        new Map();

    for(const verse of verses){

        const key =
            verse.book +
            "|" +
            verse.chapter +
            "|" +
            verse.verse;

        if(!unique.has(key)){

            unique.set(
                key,
                verse
            );

        }

    }

    verses =
        Array.from(
            unique.values()
        );


    /*
       ترتيب الكتاب كاملًا.
    */

    verses.sort(function(a,b){

        const indexA =
            ALL_BOOKS.indexOf(a.book);

        const indexB =
            ALL_BOOKS.indexOf(b.book);


        const safeA =
            indexA >= 0
                ? indexA
                : 999;

        const safeB =
            indexB >= 0
                ? indexB
                : 999;


        if(safeA !== safeB){

            return safeA - safeB;

        }


        if(a.chapter !== b.chapter){

            return a.chapter - b.chapter;

        }


        return a.verse - b.verse;

    });


    /*
       إنشاء فهارس سريعة.
    */

    for(const verse of verses){

        const verseKey =
            verse.book +
            "|" +
            verse.chapter +
            "|" +
            verse.verse;

        verseIndex.set(
            verseKey,
            verse
        );


        const chapterKey =
            verse.book +
            "|" +
            verse.chapter;


        if(!chapterIndex.has(chapterKey)){

            chapterIndex.set(
                chapterKey,
                []
            );

        }

        chapterIndex
            .get(chapterKey)
            .push(verse);

    }

}


/* =========================================================
   القراءة العودية
========================================================= */

function readRecursive(
    node,
    inheritedBook,
    inheritedChapter
){

    if(node === null || node === undefined){

        return;

    }


    /*
       مصفوفة.
    */

    if(Array.isArray(node)){

        for(const item of node){

            readRecursive(
                item,
                inheritedBook,
                inheritedChapter
            );

        }

        return;

    }


    /*
       نص فقط.
    */

    if(typeof node !== "object"){

        return;

    }


    /*
       محاولة قراءة الآية مباشرة.
    */

    if(readDirectVerseObject(node)){

        return;

    }


    /*
       استخراج السفر الموروث.
    */

    let book =
        inheritedBook;


    if(
        node.book !== undefined ||
        node.bookId !== undefined ||
        node.book_id !== undefined ||
        node.id !== undefined &&
        (
            node.chapters !== undefined ||
            node.chapter !== undefined ||
            node.verses !== undefined
        )
    ){

        book =
            normalizeBookId(
                node.book ??
                node.bookId ??
                node.book_id ??
                node.id ??
                node.name ??
                node.key
            );

    }


    /*
       استخراج الأصحاح الموروث.
    */

    let chapter =
        inheritedChapter;


    if(
        node.chapter !== undefined ||
        node.chapterNumber !== undefined ||
        node.chapter_number !== undefined
    ){

        chapter =
            normalizeNumber(
                node.chapter ??
                node.chapterNumber ??
                node.chapter_number
            );

    }


    /*
       بنية:
       book -> chapters
    */

    const chapterCollections = [

        node.chapters,
        node.chapterData,
        node.chapter_data

    ];


    for(const collection of chapterCollections){

        if(collection === undefined){

            continue;

        }


        if(Array.isArray(collection)){

            collection.forEach(function(item,index){

                readRecursive(
                    item,
                    book,
                    index + 1
                );

            });

        }else if(
            collection &&
            typeof collection === "object"
        ){

            Object.keys(collection).forEach(function(key){

                const value =
                    collection[key];

                const numericKey =
                    normalizeNumber(key);

                readRecursive(
                    value,
                    book,
                    Number.isFinite(numericKey)
                        ? numericKey
                        : chapter
                );

            });

        }

    }


    /*
       بنية verses داخل السفر أو الأصحاح.
    */

    if(node.verses !== undefined){

        const collection =
            node.verses;


        if(Array.isArray(collection)){

            collection.forEach(function(item,index){

                if(
                    item &&
                    typeof item === "object" &&
                    !Array.isArray(item)
                ){

                    const itemVerse =
                        item.verse ??
                        item.verseNumber ??
                        item.verse_number ??
                        item.number ??
                        index + 1;

                    const itemText =
                        item.text ??
                        item.content ??
                        item.verseText ??
                        item.body ??
                        item.value;

                    pushVerse(
                        book,
                        chapter,
                        itemVerse,
                        itemText
                    );

                }

            });

        }else if(
            collection &&
            typeof collection === "object"
        ){

            Object.keys(collection).forEach(function(key){

                const item =
                    collection[key];


                if(
                    item &&
                    typeof item === "object" &&
                    !Array.isArray(item)
                ){

                    const itemVerse =
                        item.verse ??
                        item.verseNumber ??
                        item.number ??
                        normalizeNumber(key);


                    const itemText =
                        item.text ??
                        item.content ??
                        item.value ??
                        item.body ??
                        item.verse;


                    pushVerse(
                        book,
                        chapter,
                        itemVerse,
                        itemText
                    );

                }else{

                    pushVerse(
                        book,
                        chapter,
                        key,
                        item
                    );

                }

            });

        }

    }


    /*
       بعض صيغ JSON تستخدم:
       books
    */

    if(node.books !== undefined){

        const books =
            node.books;

        if(Array.isArray(books)){

            books.forEach(function(item){

                readRecursive(
                    item,
                    null,
                    null
                );

            });

        }else if(
            books &&
            typeof books === "object"
        ){

            Object.keys(books).forEach(function(key){

                readRecursive(
                    books[key],
                    normalizeBookId(key),
                    null
                );

            });

        }

    }


    /*
       المرور على بقية الخصائص غير المعروفة
       لاكتشاف البنية بدون كسر bible.json.
    */

    const ignored = new Set([

        "book",
        "bookId",
        "book_id",
        "bookID",
        "bookName",
        "id",
        "name",
        "key",

        "chapter",
        "chapterNumber",
        "chapter_number",

        "verse",
        "verseNumber",
        "verse_number",
        "number",

        "text",
        "content",
        "verseText",
        "body",
        "value",

        "chapters",
        "chapterData",
        "chapter_data",

        "verses",
        "books"

    ]);


    for(const key of Object.keys(node)){

        if(ignored.has(key)){

            continue;

        }


        const value =
            node[key];


        /*
           إذا كان المفتاح اسم سفر معروف.
        */

        const possibleBook =
            normalizeBookId(key);


        const isKnownBook =
            ALL_BOOKS.includes(
                possibleBook
            );


        if(isKnownBook){

            readRecursive(
                value,
                possibleBook,
                null
            );

            continue;

        }


        /*
           إذا كان المفتاح رقم أصحاح.
        */

        const possibleChapter =
            normalizeNumber(key);


        if(
            book &&
            Number.isFinite(
                possibleChapter
            )
        ){

            readRecursive(
                value,
                book,
                possibleChapter
            );

            continue;

        }


        /*
           الاستمرار داخل البنية.
        */

        if(
            value &&
            typeof value === "object"
        ){

            readRecursive(
                value,
                book,
                chapter
            );

        }

    }

}

/* =========================================================
   الأصحاحات الموجودة فعليًا
========================================================= */

function getChapters(bookId){

    const chapters = [];


    for(const key of chapterIndex.keys()){

        const parts =
            key.split("|");


        if(parts[0] !== bookId){

            continue;

        }


        const chapter =
            Number(parts[1]);


        if(
            Number.isFinite(chapter) &&
            !chapters.includes(chapter)
        ){

            chapters.push(
                chapter
            );

        }

    }


    return chapters.sort(
        function(a,b){
            return a-b;
        }
    );

}


/* =========================================================
   آيات أصحاح معين
========================================================= */

function getChapterVerses(
    bookId,
    chapter
){

    const key =
        bookId +
        "|" +
        Number(chapter);


    return (
        chapterIndex.get(key) ||
        []
    ).slice().sort(
        function(a,b){
            return a.verse-b.verse;
        }
    );

}

/* =========================================================
   تحديث التنقل
========================================================= */

function updateNavigation(){

    const chapters =
        getChapters(
            currentBook
        );


    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    if(!previous || !next){

        return;

    }


    previous.disabled =
        index <= 0;


    next.disabled =
        index < 0 ||
        index >= chapters.length - 1;

}


/* =========================================================
   السابق
========================================================= */

function previousChapter(){

    const chapters =
        getChapters(
            currentBook
        );


    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    if(index > 0){

        openChapter(
            currentBook,
            chapters[index - 1]
        );

    }

}


/* =========================================================
   التالي
========================================================= */

function nextChapter(){

    const chapters =
        getChapters(
            currentBook
        );


    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    if(
        index >= 0 &&
        index < chapters.length - 1
    ){

        openChapter(
            currentBook,
            chapters[index + 1]
        );

    }

}


/* =========================================================
   فتح الآية
========================================================= */

function openVerse(
    book,
    chapter,
    verse
){

    const key =
        book +
        "|" +
        Number(chapter) +
        "|" +
        Number(verse);


    const found =
        verseIndex.get(key);


    if(!found){

        return;

    }


    currentVerse =
        found;


    document.getElementById(
        "modalTitle"
    ).textContent =

        `${BOOK_NAMES[book] || book} ${chapter}:${verse}`;


    document.getElementById(
        "modalVerse"
    ).innerHTML = `

        <span class="verse-number">
            ${verse}
        </span>

        ${escapeHTML(found.text)}

    `;


    document.getElementById(
        "verseModal"
    ).classList.add("open");


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   إغلاق نافذة الآية
========================================================= */

function closeVerse(){

    document.getElementById(
        "verseModal"
    ).classList.remove("open");


    document.body.style.overflow = "";

}


/* =========================================================
   الخيارات الأربعة
========================================================= */

function verseFeature(feature){

    if(!currentVerse){

        return;

    }


    if(feature === "similar"){

        alert(
            "منظومة الآيات المشابهة ستُربط بقاعدة الدراسة الخاصة بها."
        );

        return;

    }


    if(feature === "language"){

        alert(
            "منظومة أصل اللغة ستُربط ببيانات العبرية والآرامية واليونانية."
        );

        return;

    }


    if(feature === "places"){

        alert(
            "منظومة الأماكن والأنهار والخرائط ستُربط بقاعدة البيانات الخاصة بها."
        );

        return;

    }


    if(feature === "commentary"){

        /*
           الانتقال إلى موسوعة التفسير
           مع تمرير المرجع كاملًا.
        */

        const book =
            currentVerse.book;

        const chapter =
            currentVerse.chapter;

        const verse =
            currentVerse.verse;


        const url =
            "overview.html" +
            "?book=" +
            encodeURIComponent(book) +
            "&chapter=" +
            encodeURIComponent(chapter) +
            "&verse=" +
            encodeURIComponent(verse);


        window.location.href =
            url;

        return;

    }

}

   البحث
========================================================= */

function openSearch(){

    currentTestament = null;

    currentBook = null;

    currentChapter = null;


    app.innerHTML = `

        <section class="workspace">

            <div class="inner-topbar">

                <button
                    class="inner-back"
                    type="button"
                    onclick="renderStart()"
                >
                    ← رجوع
                </button>

                <h2 class="inner-title">
                    🔎 البحث
                </h2>

            </div>


            <div class="search-container">

                <div class="search-form">

                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="اكتب كلمة أو عبارة من الكتاب المقدس..."
                        autocomplete="off"
                    >


                    <button
                        class="search-submit"
                        type="button"
                        onclick="performSearch()"
                    >
                        بحث
                    </button>

                </div>


                <div id="searchResults"></div>

            </div>

        </section>

    `;


    const input =
        document.getElementById(
            "searchInput"
        );


    input.focus();


    input.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                performSearch();

            }

        }
    );

}


/* =========================================================
   البحث في النص
========================================================= */

function performSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );


    const results =
        document.getElementById(
            "searchResults"
        );


    if(!input || !results){

        return;

    }


    const query =
        input.value
            .trim()
            .toLocaleLowerCase("ar");


    if(!query){

        results.innerHTML = `

            <div class="empty">
                اكتب كلمة أو عبارة للبحث.
            </div>

        `;

        return;

    }


    const hits =
        verses.filter(function(v){

            return v.text
                .toLocaleLowerCase("ar")
                .includes(query);

        });


    if(!hits.length){

        results.innerHTML = `

            <div class="empty">
                لا توجد نتائج.
            </div>

        `;

        return;

    }


    results.innerHTML = `

        <div class="empty">

            عدد النتائج:
            ${hits.length.toLocaleString("ar-EG")}

        </div>


        <div class="search-results">

            ${hits.slice(0,300).map(function(v){

                return `

                    <div
                        class="search-result"
                        onclick="openSearchVerse(
                            '${v.book}',
                            ${v.chapter},
                            ${v.verse}
                        )"
                    >

                        <span class="search-reference">

                            ${escapeHTML(
                                BOOK_NAMES[v.book] ||
                                v.book
                            )}

                            ${v.chapter}:${v.verse}

                        </span>

                        ${escapeHTML(v.text)}

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =========================================================
   فتح نتيجة البحث
========================================================= */

function openSearchVerse(
    book,
    chapter,
    verse
){

    openChapter(
        book,
        Number(chapter)
    );


    setTimeout(function(){

        openVerse(
            book,
            Number(chapter),
            Number(verse)
        );

    },20);

}

/* =========================================================
   تحميل bible.json
========================================================= */

async function loadBible(){

    try{

        const response =
            await fetch(
                BIBLE_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
           قراءة bible.json بدون افتراض
           بنية واحدة فقط.
        */

        parseBibleData(data);


        /*
           التأكد من وجود بيانات.
        */

        if(!verses.length){

            throw new Error(
                "تم تحميل bible.json ولكن لم يتم العثور على آيات قابلة للقراءة."
            );

        }


        /*
           تشغيل الواجهة.
        */

        renderStart();


        console.log(
            "Bible loaded:",
            verses.length,
            "verses"
        );


        console.log(
            "Books loaded:",
            new Set(
                verses.map(function(v){
                    return v.book;
                })
            ).size
        );


        console.log(
            "Chapters loaded:",
            chapterIndex.size
        );


    }catch(error){

        console.error(
            "Bible loading error:",
            error
        );


        app.innerHTML = `

            <section class="workspace">

                <div class="error">

                    تعذر تحميل بيانات الكتاب المقدس من
                    <b>bible.json</b>.

                    <br><br>

                    تأكد من أن الملف موجود في نفس
                    مجلد <b>bible.html</b> وأن بنيته تحتوي
                    على بيانات الأسفار والأصحاحات والآيات.

                    <br><br>

                    الخطأ:
                    <b>${escapeHTML(error.message)}</b>

                </div>

            </section>

        `;

    }

}


/* =========================================================
   التشغيل
========================================================= */

loadBible();
