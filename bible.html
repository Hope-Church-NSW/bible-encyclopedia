<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>
:root{
 --blue:#082943;
 --blue2:#061a2c;
 --gold:#d4af37;
 --gold2:#f4dc79;
 --text:#f8fbff;
 --muted:#b9c9d8;
 --border:rgba(212,175,55,.38);
}

*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 color:var(--text);
 font-family:"Noto Naskh Arabic",Amiri,Tahoma,Arial,sans-serif;
 background:
 radial-gradient(circle at 50% -10%,#14527e,transparent 45%),
 linear-gradient(145deg,#03101d,#061a2c,#020911);
}

.header{
 position:sticky;
 top:0;
 z-index:1000;
 min-height:90px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:8px 22px;
 background:linear-gradient(180deg,#082943,#03101d);
 border-bottom:1px solid var(--border);
 box-shadow:0 8px 30px #0009;
}

.brand{
 display:flex;
 align-items:center;
 gap:14px;
}

.logo{
 width:68px;
 height:68px;
 object-fit:contain;
 filter:drop-shadow(0 6px 8px #000);
}

.title{
 font-size:24px;
 font-weight:900;
 color:var(--gold2);
}

.home,.nav-btn,.audio-btn,.control,.testament,.book,.chapter{
 border:1px solid var(--border);
 border-radius:13px;
 color:white;
 background:linear-gradient(145deg,#11466e,#061a2d);
 font-weight:900;
 cursor:pointer;
 box-shadow:0 7px 18px #0007;
 transition:.25s;
}

.home{
 text-decoration:none;
 padding:11px 17px;
}

.home:hover,.nav-btn:hover,.audio-btn:hover,.control:hover,
.testament:hover,.book:hover,.chapter:hover{
 transform:translateY(-2px);
 border-color:var(--gold2);
}

.container{
 max-width:1400px;
 margin:auto;
 padding:28px 20px 70px;
}

.controls{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
 margin-bottom:20px;
}

.control{
 min-height:58px;
 padding:10px 15px;
 font-size:16px;
 outline:none;
}

.book-panel,.chapter-panel,.bible-content,.navigation{
 display:none;
}

.book-panel.active,
.chapter-panel.active,
.bible-content.active,
.navigation.active{
 display:block;
}

.testaments{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
 margin-bottom:18px;
}

.testament{
 min-height:90px;
 font-size:22px;
}

.books{
 display:none;
 grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
 gap:10px;
}

.books.active{
 display:grid;
}

.book{
 min-height:62px;
 padding:8px;
 font-size:17px;
}

.chapter-title{
 color:var(--gold2);
 margin:20px 0 12px;
}

.chapters{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(58px,1fr));
 gap:8px;
}

.chapter{
 min-height:50px;
}

.bible-content{
 margin-top:22px;
 padding:22px;
 border:1px solid var(--border);
 border-radius:20px;
 background:linear-gradient(145deg,#092b47,#031522);
 box-shadow:0 18px 45px #0008;
}

.verse{
 display:grid;
 grid-template-columns:50px 1fr;
 gap:13px;
 padding:14px 5px;
 border-bottom:1px solid #ffffff12;
 font-size:20px;
 line-height:2.3;
}

.verse-number{
 width:40px;
 height:40px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:11px;
 color:#071525;
 background:linear-gradient(#fff0a0,var(--gold));
 font-weight:900;
}

.navigation{
 position:relative;
 min-height:65px;
 margin-top:22px;
 align-items:center;
 justify-content:space-between;
}

.navigation.active{
 display:flex;
}

.nav-btn,.audio-btn{
 min-width:120px;
 min-height:54px;
 padding:10px 18px;
 font-size:17px;
}

.audio-btn{
 position:absolute;
 left:50%;
 transform:translateX(-50%);
}

.audio-btn:hover{
 transform:translateX(-50%) translateY(-2px);
}

.message{
 text-align:center;
 padding:30px;
 color:var(--muted);
 font-size:18px;
}

.search-box{
 display:none;
 margin-bottom:20px;
 padding:15px;
 border:1px solid var(--border);
 border-radius:15px;
 background:#041a2b;
}

.search-box.active{
 display:block;
}

.search-input{
 width:100%;
 padding:14px;
 border:1px solid var(--border);
 border-radius:10px;
 color:white;
 background:#061a2c;
 outline:none;
 font-size:17px;
}

@media(max-width:700px){
 .controls,.testaments{
  grid-template-columns:1fr;
 }
 .title{
  font-size:17px;
 }
 .logo{
  width:52px;
  height:52px;
 }
 .verse{
  font-size:18px;
 }
 .navigation{
  padding-bottom:70px;
 }
 .audio-btn{
  bottom:0;
  top:auto;
 }
}
</style>
</head>

<body>

<header class="header">

<a href="index.html" class="home">⌂ الرئيسية</a>

<div class="brand">
<div class="title">الكتاب المقدس</div>
<img src="assets/logo.png" class="logo" alt="كنيسة رجاء الأمم سيدني">
</div>

</header>

<main class="container">

<div class="controls">

<button class="control" onclick="toggleTestaments()">📖 العهدين</button>

<select id="chapterSelector" class="control" onchange="selectChapter(this.value)">
<option value="">الأصحاح</option>
</select>

<button class="control" onclick="toggleSearch()">🔎 بحث عن آية</button>

</div>

<div id="searchBox" class="search-box">
<input id="searchInput"
       class="search-input"
       placeholder="ابحث في الكتاب المقدس..."
       oninput="searchBible(this.value)">
<div id="searchResults"></div>
</div>

<section id="testaments" class="book-panel">

<div class="testaments">

<button class="testament" onclick="showTestament('old')">
العهد القديم
</button>

<button class="testament" onclick="showTestament('new')">
العهد الجديد
</button>

</div>

<div id="oldBooks" class="books"></div>
<div id="newBooks" class="books"></div>

</section>

<section id="chapterPanel" class="chapter-panel">

<h2 id="chapterTitle" class="chapter-title"></h2>

<div id="chapters" class="chapters"></div>

</section>

<section id="bibleContent" class="bible-content"></section>

<div id="message" class="message">
اختر العهد ثم السفر ثم الأصحاح.
</div>

<div id="navigation" class="navigation">

<button id="previousButton"
        class="nav-btn"
        onclick="previousChapter()">
السابق
</button>

<button class="audio-btn"
        onclick="playBibleAudio()">
🔊 سماعة الكتاب
</button>

<button id="nextButton"
        class="nav-btn"
        onclick="nextChapter()">
التالي
</button>

</div>

</main>

<script>

/* =========================
   BOOKS
========================= */

const books={
old:[
["تكوين","genesis"],
["خروج","exodus"],
["لاويين","leviticus"],
["عدد","numbers"],
["تثنية","deuteronomy"],
["يشوع","joshua"],
["قضاة","judges"],
["راعوث","ruth"],
["1 صموئيل","1samuel"],
["2 صموئيل","2samuel"],
["1 ملوك","1kings"],
["2 ملوك","2kings"],
["1 أخبار","1chronicles"],
["2 أخبار","2chronicles"],
["عزرا","ezra"],
["نحميا","nehemiah"],
["أستير","esther"],
["أيوب","job"],
["مزامير","psalms"],
["أمثال","proverbs"],
["جامعة","ecclesiastes"],
["نشيد الأنشاد","songofsolomon"],
["إشعياء","isaiah"],
["إرميا","jeremiah"],
["مراثي إرميا","lamentations"],
["حزقيال","ezekiel"],
["دانيال","daniel"],
["هوشع","hosea"],
["يوئيل","joel"],
["عاموس","amos"],
["عوبديا","obadiah"],
["يونان","jonah"],
["ميخا","micah"],
["ناحوم","nahum"],
["حبقوق","habakkuk"],
["صفنيا","zephaniah"],
["حجي","haggai"],
["زكريا","zechariah"],
["ملاخي","malachi"]
],
new:[
["متى","matthew"],
["مرقس","mark"],
["لوقا","luke"],
["يوحنا","john"],
["أعمال الرسل","acts"],
["رومية","romans"],
["1 كورنثوس","1corinthians"],
["2 كورنثوس","2corinthians"],
["غلاطية","galatians"],
["أفسس","ephesians"],
["فيلبي","philippians"],
["كولوسي","colossians"],
["1 تسالونيكي","1thessalonians"],
["2 تسالونيكي","2thessalonians"],
["1 تيموثاوس","1timothy"],
["2 تيموثاوس","2timothy"],
["تيطس","titus"],
["فليمون","philemon"],
["عبرانيين","hebrews"],
["يعقوب","james"],
["1 بطرس","1peter"],
["2 بطرس","2peter"],
["1 يوحنا","1john"],
["2 يوحنا","2john"],
["3 يوحنا","3john"],
["يهوذا","jude"],
["رؤيا يوحنا","revelation"]
]};


/* =========================
   STATE
========================= */

let bibleData={};
let currentTestament="";
let currentBook="";
let currentBookName="";
let currentChapter=0;


/* =========================
   LOAD
========================= */

async function loadBible(){

 try{

  const response=
   await fetch(
    "bible.json?v="+Date.now()
   );

  if(!response.ok)
   throw new Error("bible.json");

  bibleData=
   await response.json();

  document.getElementById(
   "message"
  ).textContent=
   "اختر العهد ثم السفر ثم الأصحاح.";

 }catch(error){

  document.getElementById(
   "message"
  ).textContent=
   "تعذر تحميل bible.json.";

 }

}


/* =========================
   TESTAMENT
========================= */

function toggleTestaments(){

 document
  .getElementById("testaments")
  .classList.toggle("active");

 document
  .getElementById("chapterPanel")
  .classList.remove("active");

 document
  .getElementById("bibleContent")
  .classList.remove("active");

 document
  .getElementById("navigation")
  .classList.remove("active");
}


function showTestament(testament){

 currentTestament=testament;

 const target=
  testament==="old"
   ? document.getElementById("oldBooks")
   : document.getElementById("newBooks");

 document
  .getElementById("oldBooks")
  .classList.remove("active");

 document
  .getElementById("newBooks")
  .classList.remove("active");

 target.innerHTML="";

 books[testament].forEach(book=>{

  const button=
   document.createElement("button");

  button.className="book";
  button.textContent=book[0];

  button.onclick=()=>{
   selectBook(
    testament,
    book[1],
    book[0]
   );
  };

  target.appendChild(button);

 });

 target.classList.add("active");
}


/* =========================
   BOOK RESOLUTION
========================= */

function getBook(bookKey){

 if(bibleData[bookKey])
  return bibleData[bookKey];

 const aliases={
  "songofsolomon":"song_of_solomon",
  "1samuel":"1_samuel",
  "2samuel":"2_samuel",
  "1kings":"1_kings",
  "2kings":"2_kings",
  "1chronicles":"1_chronicles",
  "2chronicles":"2_chronicles",
  "1corinthians":"1_corinthians",
  "2corinthians":"2_corinthians",
  "1thessalonians":"1_thessalonians",
  "2thessalonians":"2_thessalonians",
  "1timothy":"1_timothy",
  "2timothy":"2_timothy",
  "1peter":"1_peter",
  "2peter":"2_peter",
  "1john":"1_john",
  "2john":"2_john",
  "3john":"3_john"
 };

 const alias=aliases[bookKey];

 return alias
  ? bibleData[alias]
  : null;
}


/* =========================
   CHAPTERS
========================= */

function getBookChapters(bookKey){

 const data=getBook(bookKey);

 if(!data)
  return [];

 if(Array.isArray(data))
  return data;

 if(data.chapters){

  if(Array.isArray(data.chapters))
   return data.chapters;

  if(typeof data.chapters==="object"){

   return Object.keys(data.chapters)
    .sort(
     (a,b)=>Number(a)-Number(b)
    )
    .map(
     key=>data.chapters[key]
    );
  }
 }

 return [];
}


/* =========================
   VERSES
========================= */

function normalizeVerses(chapter){

 if(!chapter)
  return [];

 if(Array.isArray(chapter))
  return chapter;

 if(chapter.verses){

  if(Array.isArray(chapter.verses))
   return chapter.verses;

  return Object.entries(
   chapter.verses
  ).map(
   ([number,text])=>({
    number,
    text:
     typeof text==="object"
      ? (
        text.text||
        text.content||
        ""
       )
      : text
   })
  );
 }

 return Object.entries(chapter)
  .filter(
   ([key])=>
    !isNaN(Number(key))
  )
  .map(
   ([number,text])=>({
    number,
    text:
     typeof text==="object"
      ? (
        text.text||
        text.content||
        ""
       )
      : text
   })
  );
}


function getChapterVerses(
 bookKey,
 chapterNumber
){

 const data=getBook(bookKey);

 if(!data)
  return [];

 let chapter=null;

 if(data.chapters){

  if(Array.isArray(data.chapters)){

   chapter=
    data.chapters[
     chapterNumber-1
    ];

  }else{

   chapter=
    data.chapters[
     String(chapterNumber)
    ] ||
    data.chapters[
     chapterNumber
    ];
  }

 }else if(Array.isArray(data)){

  chapter=
   data[chapterNumber-1];

 }

 return normalizeVerses(chapter);
}


/* =========================
   SELECT BOOK
========================= */

function selectBook(
 testament,
 bookKey,
 bookName
){

 currentTestament=testament;
 currentBook=bookKey;
 currentBookName=bookName;
 currentChapter=0;

 const list=
  getBookChapters(bookKey);

 const selector=
  document.getElementById(
   "chapterSelector"
  );

 selector.innerHTML=
  '<option value="">الأصحاح</option>';

 const chapters=
  document.getElementById(
   "chapters"
  );

 chapters.innerHTML="";

 list.forEach(
  (_,index)=>{

   const number=index+1;

   const option=
    document.createElement(
     "option"
    );

   option.value=number;
   option.textContent=
    "الأصحاح "+number;

   selector.appendChild(option);

   const button=
    document.createElement(
     "button"
    );

   button.className="chapter";
   button.textContent=number;

   button.onclick=()=>{
    selectChapter(number);
   };

   chapters.appendChild(button);

  }
 );

 document
  .getElementById("chapterPanel")
  .classList.add("active");

 document
  .getElementById("chapterTitle")
  .textContent=
   currentBookName;

 document
  .getElementById("bibleContent")
  .classList.remove("active");

 document
  .getElementById("navigation")
  .classList.remove("active");
}


/* =========================
   DISPLAY CHAPTER
========================= */

function selectChapter(number){

 number=Number(number);

 if(!number || !currentBook)
  return;

 const verses=
  getChapterVerses(
   currentBook,
   number
  );

 currentChapter=number;

 const content=
  document.getElementById(
   "bibleContent"
  );

 content.innerHTML="";

 if(!verses.length){

  content.innerHTML=
   `<div class="message">
    لم يتم العثور على آيات ${currentBookName} ${number}.
   </div>`;

 }else{

  verses.forEach(
   (verse,index)=>{

    const verseNumber=
     verse.number ??
     verse.verse ??
     index+1;

    const text=
     verse.text ??
     verse.content ??
     "";

    const row=
     document.createElement(
      "div"
     );

    row.className="verse";

    row.innerHTML=`
     <div class="verse-number">
      ${escapeHTML(verseNumber)}
     </div>
     <div>
      ${escapeHTML(text)}
     </div>
    `;

    content.appendChild(row);
   }
  );
 }

 document
  .getElementById("bibleContent")
  .classList.add("active");

 document
  .getElementById("navigation")
  .classList.add("active");

 document
  .getElementById("chapterPanel")
  .classList.remove("active");

 document
  .getElementById("chapterSelector")
  .value=number;

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });
}


/* =========================
   PREVIOUS / NEXT
========================= */

function previousChapter(){

 if(!currentBook || !currentChapter)
  return;

 const target=
  currentChapter-1;

 if(target<1)
  return;

 selectChapter(target);
}


function nextChapter(){

 if(!currentBook || !currentChapter)
  return;

 const total=
  getBookChapters(
   currentBook
  ).length;

 const target=
  currentChapter+1;

 if(target>total)
  return;

 selectChapter(target);
}


/* =========================
   AUDIO
========================= */

function playBibleAudio(){

 if(!currentBook || !currentChapter)
  return;

 const audio=
  new Audio(
   `audio/${currentBook}-${currentChapter}.mp3`
  );

 audio.play().catch(()=>{
  alert(
   "ملف الصوت لهذا الأصحاح غير متاح حالياً."
  );
 });
}


/* =========================
   SEARCH
========================= */

function toggleSearch(){

 document
  .getElementById("searchBox")
  .classList.toggle("active");
}


function searchBible(query){

 const results=
  document.getElementById(
   "searchResults"
  );

 results.innerHTML="";

 query=
  query.trim().toLowerCase();

 if(!query)
  return;

 let found=0;

 Object.keys(bibleData)
 .forEach(bookKey=>{

  const chapters=
   getBookChapters(bookKey);

  chapters.forEach(
   (chapter,chapterIndex)=>{

    const verses=
     normalizeVerses(chapter);

    verses.forEach(
     (verse,verseIndex)=>{

      const text=
       String(
        verse.text||
        verse.content||
        ""
       );

      if(
       text.toLowerCase()
       .includes(query)
       &&
       found<50
      ){

       const button=
        document.createElement(
         "button"
        );

       button.className="book";

       button.style.width="100%";
       button.style.marginTop="8px";

       button.textContent=
        `${findBookName(bookKey)} — الأصحاح ${chapterIndex+1} — العدد ${verse.number??verseIndex+1}`;

       button.onclick=()=>{

        currentBook=bookKey;

        currentBookName=
         findBookName(bookKey);

        selectChapter(
         chapterIndex+1
        );
       };

       results.appendChild(button);

       found++;
      }

     }
    );
   }
  );
 });

 if(!found){

  results.innerHTML=
   `<div class="message">
     لم يتم العثور على نتائج.
   </div>`;
 }
}


/* =========================
   BOOK NAME
========================= */

function findBookName(key){

 const all=[
  ...books.old,
  ...books.new
 ];

 const found=
  all.find(
   book=>book[1]===key
  );

 return found
  ? found[0]
  : key;
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* =========================
   START
========================= */

loadBible();

</script>

</body>
</html>
