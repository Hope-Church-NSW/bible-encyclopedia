<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>
:root{
    --blue-950:#03101d;
    --blue-900:#061a2c;
    --blue-800:#082943;
    --blue-700:#0d385d;
    --blue-600:#14527e;

    --gold:#d4af37;
    --gold-light:#f4dc79;
    --gold-dark:#806018;

    --text:#f7fbff;
    --muted:#b9c9d8;

    --border:rgba(212,175,55,.35);
    --shadow:0 18px 45px rgba(0,0,0,.5);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);

    font-family:
        "Noto Naskh Arabic",
        "Amiri",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(20,82,126,.72),
            transparent 43%
        ),
        linear-gradient(
            145deg,
            var(--blue-950),
            var(--blue-900) 50%,
            #020911
        );
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    min-height:92px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 24px;

    background:
        linear-gradient(
            180deg,
            rgba(8,41,67,.98),
            rgba(3,16,29,.98)
        );

    border-bottom:1px solid var(--border);

    box-shadow:
        0 8px 30px rgba(0,0,0,.55),
        inset 0 -1px 0 rgba(255,255,255,.04);
}

/* RIGHT */

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:72px;
    height:72px;
    object-fit:contain;

    filter:
        drop-shadow(0 6px 8px rgba(0,0,0,.85));

    animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) rotateY(0deg);
    }
    50%{
        transform:translateY(-4px) rotateY(8deg);
    }
}

.page-title{
    font-size:24px;
    font-weight:900;

    background:
        linear-gradient(
            180deg,
            #fff6bf,
            var(--gold-light),
            var(--gold),
            var(--gold-dark)
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 3px 5px rgba(0,0,0,.9);
}

/* LEFT */

.home{
    text-decoration:none;
    color:white;

    padding:11px 17px;

    border:1px solid rgba(212,175,55,.7);
    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #17466c,
            #061a2d
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 7px 18px rgba(0,0,0,.5);

    font-weight:900;

    transition:.3s;
}

.home:hover{
    transform:translateY(-3px);
    border-color:var(--gold-light);
}

/* ================= PAGE ================= */

.container{
    max-width:1400px;
    margin:auto;

    padding:32px 20px 65px;
}

/* ================= CONTROLS ================= */

.controls{
    display:grid;

    grid-template-columns:
        minmax(180px,1fr)
        minmax(180px,1fr)
        minmax(180px,1fr);

    gap:14px;

    margin-bottom:25px;
}

.control{
    min-height:58px;

    padding:0 15px;

    color:white;

    border:1px solid var(--border);
    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #10466e,
            #061a2d
        );

    font-size:16px;
    font-weight:900;

    outline:none;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 8px 20px rgba(0,0,0,.35);
}

.control:focus{
    border-color:var(--gold-light);
}

/* ================= SEARCH ================= */

.search-box{
    display:none;

    margin-bottom:25px;

    padding:15px;

    border:
        1px solid var(--border);

    border-radius:17px;

    background:
        rgba(5,25,42,.96);

    box-shadow:var(--shadow);
}

.search-box.active{
    display:block;
}

.search-input{
    width:100%;

    padding:15px 18px;

    border:
        1px solid
        rgba(212,175,55,.4);

    border-radius:12px;

    outline:none;

    color:white;

    background:#071b2d;

    font-size:17px;
}

/* ================= BOOK SELECT ================= */

.book-panel{
    display:none;

    margin-bottom:30px;
}

.book-panel.active{
    display:block;
}

.testaments{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;

    margin-bottom:22px;
}

.testament{
    min-height:95px;

    border:
        1px solid var(--border);

    border-radius:18px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #114b76,
            #061a2c
        );

    font-size:23px;
    font-weight:900;

    cursor:pointer;

    transition:.3s;
}

.testament:hover,
.testament.active{
    transform:translateY(-4px);

    border-color:var(--gold-light);

    box-shadow:
        0 15px 30px rgba(0,0,0,.5),
        0 0 18px rgba(212,175,55,.12);
}

/* ================= BOOKS ================= */

.books{
    display:none;

    grid-template-columns:
        repeat(auto-fill,minmax(160px,1fr));

    gap:12px;
}

.books.active{
    display:grid;
}

.book{
    min-height:65px;

    border:
        1px solid
        rgba(212,175,55,.27);

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #0d385d,
            #051a2c
        );

    color:white;

    font-size:17px;
    font-weight:800;

    cursor:pointer;

    transition:.25s;
}

.book:hover,
.book.active{
    color:var(--gold-light);

    border-color:var(--gold);

    transform:translateY(-2px);
}

/* ================= CHAPTERS ================= */

.chapter-panel{
    display:none;

    margin-bottom:25px;
}

.chapter-panel.active{
    display:block;
}

.chapter-title{
    margin:
        0 0 15px;

    color:var(--gold-light);

    font-size:26px;
    font-weight:900;
}

.chapters{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(62px,1fr));

    gap:9px;
}

.chapter{
    min-height:52px;

    border:
        1px solid
        rgba(212,175,55,.28);

    border-radius:11px;

    background:#082943;

    color:white;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    transition:.25s;
}

.chapter:hover,
.chapter.active{
    color:#071525;

    background:
        linear-gradient(
            180deg,
            #fff0a0,
            var(--gold)
        );

    border-color:var(--gold-light);
}

/* ================= VERSES ================= */

.bible-content{
    display:none;

    padding:25px 22px;

    border:
        1px solid
        var(--border);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(9,43,70,.98),
            rgba(3,20,34,.99)
        );

    box-shadow:var(--shadow);
}

.bible-content.active{
    display:block;
}

.verse{
    display:grid;

    grid-template-columns:
        54px 1fr;

    gap:14px;

    padding:
        15px 8px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    line-height:2.25;

    font-size:20px;
}

.verse:last-child{
    border-bottom:0;
}

.verse-number{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:#071525;

    background:
        linear-gradient(
            180deg,
            #fff0a0,
            var(--gold)
        );

    font-weight:900;
}

/* ================= BOTTOM ================= */

.navigation{
    display:none;

    align-items:center;
    justify-content:space-between;

    margin-top:25px;

    position:relative;
}

.navigation.active{
    display:flex;
}

.nav-btn,
.audio-btn{
    min-width:125px;

    min-height:55px;

    border:
        1px solid
        rgba(212,175,55,.7);

    border-radius:14px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #17466c,
            #061a2d
        );

    font-weight:900;
    font-size:17px;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 7px 18px rgba(0,0,0,.45);

    transition:.3s;
}

.nav-btn:hover,
.audio-btn:hover{
    transform:translateY(-3px);

    border-color:var(--gold-light);
}

.audio-btn{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.audio-btn:hover{
    transform:
        translateX(-50%)
        translateY(-3px);
}

/* ================= MESSAGE ================= */

.message{
    display:none;

    text-align:center;

    padding:35px 15px;

    color:var(--muted);

    font-size:18px;
}

.message.active{
    display:block;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        min-height:78px;
        padding:7px 12px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .page-title{
        font-size:17px;
    }

    .home{
        padding:9px 11px;
        font-size:13px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .testaments{
        grid-template-columns:1fr;
    }

    .books{
        grid-template-columns:
            repeat(2,1fr);
    }

    .verse{
        grid-template-columns:
            43px 1fr;

        font-size:18px;
    }

    .navigation{
        padding-bottom:70px;
    }

    .audio-btn{
        bottom:0;
        top:auto;
    }
}
</style>
</head>


<body>

<header class="header">

    <!-- LEFT -->
    <a href="index.html" class="home">
        ⌂ الرئيسية
    </a>

    <!-- RIGHT -->
    <div class="brand">

        <div class="page-title">
            الكتاب المقدس
        </div>

        <img
            src="assets/logo.png"
            class="logo"
            alt="كنيسة رجاء الأمم سيدني"
        >

    </div>

</header>


<main class="container">

    <!-- THREE BUTTONS ONLY -->

    <div class="controls">

        <button
            class="control"
            onclick="toggleTestaments()"
        >
            📖 العهدين
        </button>

        <select
            id="chapterSelector"
            class="control"
            onchange="selectChapter(this.value)"
        >
            <option value="">
                الأصحاح
            </option>
        </select>

        <button
            class="control"
            onclick="toggleSearch()"
        >
            🔎 بحث عن آية
        </button>

    </div>


    <!-- SEARCH -->

    <div
        id="searchBox"
        class="search-box"
    >

        <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="اكتب كلمة أو عبارة للبحث في الكتاب المقدس..."
            oninput="searchBible(this.value)"
        >

        <div id="searchResults"></div>

    </div>


    <!-- TESTAMENTS -->

    <section
        id="testaments"
        class="book-panel"
    >

        <div class="testaments">

            <button
                class="testament"
                onclick="showTestament('old')"
            >
                العهد القديم
            </button>

            <button
                class="testament"
                onclick="showTestament('new')"
            >
                العهد الجديد
            </button>

        </div>


        <div
            id="oldBooks"
            class="books"
        ></div>

        <div
            id="newBooks"
            class="books"
        ></div>

    </section>


    <!-- CHAPTERS -->

    <section
        id="chapterPanel"
        class="chapter-panel"
    >

        <h2
            id="chapterTitle"
            class="chapter-title"
        ></h2>

        <div
            id="chapters"
            class="chapters"
        ></div>

    </section>


    <!-- VERSES -->

    <section
        id="bibleContent"
        class="bible-content"
    ></section>


    <div
        id="message"
        class="message active"
    >
        اختر العهد ثم السفر ثم الأصحاح لعرض النص الكتابي.
    </div>


    <!-- BOTTOM NAVIGATION -->

    <div
        id="navigation"
        class="navigation"
    >

        <!-- RIGHT -->
        <button
            id="previousButton"
            class="nav-btn"
            onclick="previousChapter()"
        >
            السابق
        </button>


        <!-- CENTER -->
        <button
            id="audioButton"
            class="audio-btn"
            onclick="playBibleAudio()"
        >
            🔊 سماعة الكتاب
        </button>


        <!-- LEFT -->
        <button
            id="nextButton"
            class="nav-btn"
            onclick="nextChapter()"
        >
            التالي
        </button>

    </div>

</main>


<script>

/* =====================================================
   DATA
===================================================== */

const books = {

old:[
    ["تكوين","genesis"],
    ["خروج","exodus"],
    ["لاويين","leviticus"],
    ["عدد","numbers"],
    ["تثنية","deuteronomy"],
    ["يشوع","joshua"],
    ["قضاة","judges"],
    ["راعوث","ruth"],
    ["1 صموئيل","1samuel"],
    ["2 صموئيل","2samuel"],
    ["1 ملوك","1kings"],
    ["2 ملوك","2kings"],
    ["1 أخبار","1chronicles"],
    ["2 أخبار","2chronicles"],
    ["عزرا","ezra"],
    ["نحميا","nehemiah"],
    ["أستير","esther"],
    ["أيوب","job"],
    ["مزامير","psalms"],
    ["أمثال","proverbs"],
    ["جامعة","ecclesiastes"],
    ["نشيد الأنشاد","songofsolomon"],
    ["إشعياء","isaiah"],
    ["إرميا","jeremiah"],
    ["مراثي إرميا","lamentations"],
    ["حزقيال","ezekiel"],
    ["دانيال","daniel"],
    ["هوشع","hosea"],
    ["يوئيل","joel"],
    ["عاموس","amos"],
    ["عوبديا","obadiah"],
    ["يونان","jonah"],
    ["ميخا","micah"],
    ["ناحوم","nahum"],
    ["حبقوق","habakkuk"],
    ["صفنيا","zephaniah"],
    ["حجي","haggai"],
    ["زكريا","zechariah"],
    ["ملاخي","malachi"]
],

new:[
    ["متى","matthew"],
    ["مرقس","mark"],
    ["لوقا","luke"],
    ["يوحنا","john"],
    ["أعمال الرسل","acts"],
    ["رومية","romans"],
    ["1 كورنثوس","1corinthians"],
    ["2 كورنثوس","2corinthians"],
    ["غلاطية","galatians"],
    ["أفسس","ephesians"],
    ["فيلبي","philippians"],
    ["كولوسي","colossians"],
    ["1 تسالونيكي","1thessalonians"],
    ["2 تسالونيكي","2thessalonians"],
    ["1 تيموثاوس","1timothy"],
    ["2 تيموثاوس","2timothy"],
    ["تيطس","titus"],
    ["فليمون","philemon"],
    ["عبرانيين","hebrews"],
    ["يعقوب","james"],
    ["1 بطرس","1peter"],
    ["2 بطرس","2peter"],
    ["1 يوحنا","1john"],
    ["2 يوحنا","2john"],
    ["3 يوحنا","3john"],
    ["يهوذا","jude"],
    ["رؤيا يوحنا","revelation"]
]};


/* =====================================================
   STATE
===================================================== */

let bibleData = {};
let currentTestament = "";
let currentBook = "";
let currentBookName = "";
let currentChapter = 0;


/* =====================================================
   LOAD DATABASE
===================================================== */

async function loadBible(){

    const candidates = [
        "bible_database.json",
        "bible.json"
    ];

    for(const file of candidates){

        try{

            const response =
                await fetch(file + "?v=" + Date.now());

            if(!response.ok) continue;

            const data =
                await response.json();

            if(data &&
               typeof data === "object"){

                bibleData = data;

                return true;
            }

        }catch(error){}
    }

    document.getElementById(
        "message"
    ).textContent =
        "تعذر تحميل بيانات الكتاب المقدس.";

    return false;
}


/* =====================================================
   TESTAMENTS
===================================================== */

function toggleTestaments(){

    const panel =
        document.getElementById("testaments");

    panel.classList.toggle("active");

    document.getElementById(
        "chapterPanel"
    ).classList.remove("active");

    document.getElementById(
        "bibleContent"
    ).classList.remove("active");

    document.getElementById(
        "navigation"
    ).classList.remove("active");
}


function showTestament(testament){

    currentTestament =
        testament;

    const oldBooks =
        document.getElementById("oldBooks");

    const newBooks =
        document.getElementById("newBooks");

    oldBooks.innerHTML="";
    newBooks.innerHTML="";

    oldBooks.classList.remove("active");
    newBooks.classList.remove("active");

    const target =
        testament === "old"
            ? oldBooks
            : newBooks;

    books[testament].forEach(book=>{

        const button =
            document.createElement("button");

        button.className="book";

        button.textContent =
            book[0];

        button.onclick=()=>{
            selectBook(
                testament,
                book[1],
                book[0]
            );
        };

        target.appendChild(button);
    });

    target.classList.add("active");
}


/* =====================================================
   BOOK
===================================================== */

function selectBook(
    testament,
    bookKey,
    bookName
){

    currentTestament =
        testament;

    currentBook =
        bookKey;

    currentBookName =
        bookName;

    currentChapter=0;

    const chapters =
        getBookChapters(bookKey);

    const selector =
        document.getElementById(
            "chapterSelector"
        );

    selector.innerHTML =
        '<option value="">الأصحاح</option>';

    const chaptersBox =
        document.getElementById(
            "chapters"
        );

    chaptersBox.innerHTML="";

    chapters.forEach(
        (chapter,index)=>{

            const number =
                index + 1;

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                number;

            option.textContent =
                "الأصحاح " + number;

            selector.appendChild(
                option
            );


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "chapter";

            button.textContent =
                number;

            button.onclick=()=>{
                selectChapter(number);
            };

            chaptersBox.appendChild(
                button
            );
        }
    );


    document.getElementById(
        "chapterPanel"
    ).classList.add("active");

    document.getElementById(
        "chapterTitle"
    ).textContent =
        currentBookName;

    document.getElementById(
        "bibleContent"
    ).classList.remove("active");

    document.getElementById(
        "navigation"
    ).classList.remove("active");

    document.getElementById(
        "message"
    ).classList.remove("active");
}


/* =====================================================
   CHAPTER DATA RESOLUTION
===================================================== */

function getBookChapters(bookKey){

    const data =
        bibleData[bookKey];

    if(!data) return [];

    if(Array.isArray(data))
        return data;

    if(data.chapters){

        if(Array.isArray(data.chapters))
            return data.chapters;

        if(typeof data.chapters==="object")
            return Object.keys(
                data.chapters
            ).sort(
                (a,b)=>Number(a)-Number(b)
            ).map(
                key=>data.chapters[key]
            );
    }

    return [];
}


function getChapterVerses(
    bookKey,
    chapterNumber
){

    const data =
        bibleData[bookKey];

    if(!data) return [];

    if(data.chapters){

        if(Array.isArray(data.chapters)){

            const chapter =
                data.chapters[
                    chapterNumber - 1
                ];

            return normalizeVerses(
                chapter
            );
        }

        const chapter =
            data.chapters[
                String(chapterNumber)
            ] ||
            data.chapters[
                chapterNumber
            ];

        return normalizeVerses(
            chapter
        );
    }

    if(Array.isArray(data)){

        const chapter =
            data[
                chapterNumber - 1
            ];

        return normalizeVerses(
            chapter
        );
    }

    return [];
}


/* =====================================================
   NORMALIZE DIFFERENT JSON FORMATS
===================================================== */

function normalizeVerses(chapter){

    if(!chapter) return [];

    if(Array.isArray(chapter))
        return chapter;

    if(chapter.verses){

        if(Array.isArray(chapter.verses))
            return chapter.verses;

        if(typeof chapter.verses==="object")
            return Object.entries(
                chapter.verses
            ).map(
                ([number,text])=>({
                    number,
                    text
                })
            );
    }

    if(typeof chapter==="object"){

        return Object.entries(
            chapter
        )
        .filter(
            ([key])=>
                !isNaN(Number(key))
        )
        .map(
            ([number,text])=>({
                number,
                text
            })
        );
    }

    return [];
}


/* =====================================================
   DISPLAY CHAPTER
===================================================== */

function selectChapter(number){

    number =
        Number(number);

    if(!number || !currentBook)
        return;

    currentChapter =
        number;

    const verses =
        getChapterVerses(
            currentBook,
            number
        );

    const content =
        document.getElementById(
            "bibleContent"
        );

    content.innerHTML="";


    if(!verses.length){

        content.innerHTML = `
            <div class="message" style="display:block">
                لا توجد آيات متاحة لهذا الأصحاح في ملف البيانات الحالي.
            </div>
        `;

    }else{

        verses.forEach(
            (verse,index)=>{

                let number =
                    verse.number ??
                    verse.verse ??
                    index + 1;

                let text =
                    verse.text ??
                    verse.verseText ??
                    verse.content ??
                    "";

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "verse";

                row.innerHTML = `
                    <div class="verse-number">
                        ${escapeHTML(number)}
                    </div>

                    <div>
                        ${escapeHTML(text)}
                    </div>
                `;

                content.appendChild(row);
            }
        );
    }


    document.getElementById(
        "bibleContent"
    ).classList.add("active");

    document.getElementById(
        "navigation"
    ).classList.add("active");

    document.getElementById(
        "chapterPanel"
    ).classList.remove("active");


    document.getElementById(
        "chapterSelector"
    ).value =
        number;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   PREVIOUS / NEXT
===================================================== */

function previousChapter(){

    if(!currentBook ||
       currentChapter <= 1)
        return;

    selectChapter(
        currentChapter - 1
    );
}


function nextChapter(){

    if(!currentBook)
        return;

    const chapters =
        getBookChapters(
            currentBook
        );

    if(
        currentChapter >=
        chapters.length
    )
        return;

    selectChapter(
        currentChapter + 1
    );
}


/* =====================================================
   AUDIO
===================================================== */

function playBibleAudio(){

    const audioFile =
        `audio/${currentBook}-${currentChapter}.mp3`;

    const audio =
        new Audio(audioFile);

    audio.play().catch(()=>{

        alert(
            "ملف الصوت لهذا الأصحاح غير متاح حالياً."
        );

    });
}


/* =====================================================
   SEARCH
===================================================== */

function toggleSearch(){

    document
        .getElementById("searchBox")
        .classList.toggle("active");

    document
        .getElementById("searchInput")
        .focus();
}


function searchBible(query){

    const results =
        document.getElementById(
            "searchResults"
        );

    results.innerHTML="";

    query =
        query.trim().toLowerCase();

    if(!query)
        return;

    let count=0;

    Object.entries(
        bibleData
    ).forEach(
        ([bookKey,data])=>{

            const book =
                findBookName(bookKey);

            const chapters =
                getBookChapters(
                    bookKey
                );

            chapters.forEach(
                (chapter,index)=>{

                    const verses =
                        normalizeVerses(
                            chapter
                        );

                    verses.forEach(
                        (verse,vIndex)=>{

                            const text =
                                String(
                                    verse.text ??
                                    verse.content ??
                                    ""
                                );

                            if(
                                text
                                .toLowerCase()
                                .includes(query)
                            ){

                                if(count>=50)
                                    return;

                                const item =
                                    document.createElement(
                                        "button"
                                    );

                                item.className =
                                    "book";

                                item.style.width =
                                    "100%";

                                item.style.marginTop =
                                    "8px";

                                item.textContent =
                                    `${book} — الأصحاح ${index+1} — العدد ${verse.number ?? vIndex+1}`;

                                item.onclick=()=>{
                                    currentBook =
                                        bookKey;

                                    currentBookName =
                                        book;

                                    selectChapter(
                                        index+1
                                    );
                                };

                                results.appendChild(
                                    item
                                );

                                count++;
                            }
                        }
                    );
                }
            );
        }
    );

    if(!count){

        results.innerHTML =
            `<div class="message" style="display:block">
                لم يتم العثور على نتائج.
            </div>`;
    }
}


/* =====================================================
   BOOK NAME
===================================================== */

function findBookName(key){

    const all =
        [
            ...books.old,
            ...books.new
        ];

    const found =
        all.find(
            item=>item[1]===key
        );

    return found
        ? found[0]
        : key;
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   START
===================================================== */

loadBible();
