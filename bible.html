<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a46;
    --panel3:#153657;
    --gold:#d4af37;
    --gold2:#f2d675;
    --white:#f4f7fb;
    --muted:#9fb0c3;
    --line:#1d3b59;
    --blue:#2d7ff9;
    --danger:#ffb4b4;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at top right,
            rgba(45,127,249,.12),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );
    color:var(--white);
    font-family:
        Arial,
        Tahoma,
        "Segoe UI",
        sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(6,19,33,.97);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.header-inner{
    width:min(1400px,92%);
    min-height:96px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.header-actions{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:7px;
    padding:8px 0;
}

.home-button{
    min-height:48px;
    padding:10px 18px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--panel2);
    color:var(--gold2);
    text-decoration:none;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition:.2s ease;
}

.home-button:hover{
    background:var(--panel3);
    transform:translateY(-1px);
}

.bible-home-button[hidden]{
    display:none;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:68px;
    height:68px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold2);
    font-size:25px;
    font-weight:900;
    text-shadow:
        0 2px 8px rgba(212,175,55,.30);
}

main{
    width:min(1250px,94%);
    margin:auto;
    padding:30px 0 60px;
}

#app{
    width:100%;
}

.start-screen{
    width:100%;
}

.start-title{
    text-align:center;
    color:var(--gold2);
    font-size:32px;
    font-weight:900;
    margin:0 0 10px;
}

.start-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:16px;
    margin:0 0 28px;
}

.main-icons{
    width:min(950px,100%);
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:28px;
}

.main-icon{
    min-height:300px;
    border:1px solid var(--line);
    border-radius:26px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    color:var(--white);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px 25px;
    transition:.25s ease;
    box-shadow:
        0 15px 35px rgba(0,0,0,.20);
}

.main-icon:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
    background:
        linear-gradient(
            145deg,
            var(--panel3),
            var(--panel2)
        );
    box-shadow:
        0 20px 45px rgba(0,0,0,.28);
}

.main-icon-symbol{
    font-size:88px;
    line-height:1;
    margin-bottom:25px;
}

.main-icon-title{
    color:var(--gold2);
    font-size:30px;
    font-weight:900;
}

.main-icon-description{
    color:var(--muted);
    font-size:15px;
    margin-top:10px;
}

.workspace{
    width:100%;
    background:rgba(13,33,56,.96);
    border:1px solid var(--line);
    border-radius:22px;
    padding:25px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.22);
}

.inner-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:24px;
}

.inner-back{
    border:1px solid var(--gold);
    border-radius:11px;
    background:var(--panel2);
    color:var(--gold2);
    min-height:44px;
    padding:9px 16px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.inner-back:hover{
    background:var(--panel3);
}

.inner-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;
    margin:0;
}

.testaments{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
}

.testament{
    min-height:190px;
    border:1px solid var(--line);
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    color:var(--white);
    cursor:pointer;
    text-align:center;
    padding:28px;
    transition:.22s ease;
}

.testament:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    background:var(--panel3);
}

.testament-symbol{
    font-size:55px;
    margin-bottom:12px;
}

.testament-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;
}

.testament-count{
    color:var(--muted);
    margin-top:8px;
    font-size:16px;
}

.books-grid{
    display:grid;
    grid-template-columns:
        repeat(3,minmax(0,1fr));
    gap:12px;
}

.book{
    min-height:78px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    padding:13px;
    font-size:18px;
    font-weight:900;
    transition:.2s ease;
}

.book:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
    transform:translateY(-2px);
}

.book-number{
    display:none;
}

.chapters-grid{
    display:grid;
    grid-template-columns:
        repeat(7,minmax(0,1fr));
    gap:10px;
}

.chapter{
    min-height:60px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:18px;
    font-weight:900;
    transition:.2s ease;
}

.chapter:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
    transform:translateY(-2px);
}

.chapter-reading{
    width:100%;
}

.chapter-heading{
    position:relative;
    text-align:center;
    padding:52px 0 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
}

.chapter-book-name{
    color:var(--muted);
    font-size:17px;
    margin-bottom:7px;
}

.chapter-number{
    margin:0;
    color:var(--gold2);
    font-size:30px;
    font-weight:900;
}

.verses{
    width:100%;
}

.verse{
    padding:18px 8px;
    border-bottom:1px solid #17344f;
    font-size:21px;
    line-height:2.35;
    cursor:pointer;
    transition:.18s ease;
}

.verse:hover{
    background:rgba(16,42,70,.75);
}

.verse.search-target{
    background:rgba(212,175,55,.16);
    box-shadow:inset 0 0 0 2px rgba(212,175,55,.45);
}

.verse-number{
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
    margin-left:9px;
}

.chapter-navigation{
    margin-top:15px;
    padding-top:18px;
    border-top:1px solid var(--line);

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
}

.nav-button{
    min-height:52px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    padding:10px 18px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.nav-button:hover:not(:disabled){
    border-color:var(--gold);
    color:var(--gold2);
    background:var(--panel3);
}

.nav-button:disabled{
    opacity:.30;
    cursor:not-allowed;
}

.previous{
    justify-self:start;
}

.next{
    justify-self:end;
}

.audio{
    width:60px;
    height:52px;
    padding:0;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-container{
    width:100%;
}

.search-form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-input{
    flex:1;
    min-height:55px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    outline:none;
    padding:12px 16px;
    font-size:18px;
}

.search-input:focus{
    border-color:var(--gold);
}

.search-submit{
    min-width:115px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--panel3);
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.search-results{
    width:100%;
}

.search-result{
    padding:16px 8px;
    border-bottom:1px solid #17344f;
    cursor:pointer;
    line-height:2;
}

.search-result:hover{
    background:var(--panel2);
}

.search-reference{
    display:block;
    color:var(--gold2);
    font-size:16px;
    font-weight:900;
    margin-bottom:4px;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    line-height:2;
}

.error{
    color:var(--danger);
    background:#351b24;
    border:1px solid #6b3040;
    border-radius:12px;
    padding:16px;
    line-height:2;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:min(760px,100%);
    max-height:88vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:20px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.50);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
}

.modal-title{
    margin:0;
    color:var(--gold2);
    font-size:23px;
    font-weight:900;
}

.close-modal{
    min-width:42px;
    height:42px;
    padding:0 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:22px;
}

.modal.feature-open .close-modal{
    width:auto;
    font-size:15px;
    font-weight:900;
}

.modal-verse{
    padding:22px;
    font-size:20px;
    line-height:2.35;
    border-bottom:1px solid var(--line);
}

.modal-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    padding:18px;
}

.modal-action{
    min-height:58px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:17px;
    font-weight:900;
    transition:.2s ease;
}

.modal-action:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
}

.modal.feature-open .modal-verse,
.modal.feature-open .modal-actions{
    display:none;
}

.verse-feature-panel{
    display:none;
    padding:22px;
}

.modal.feature-open .verse-feature-panel{
    display:block;
}

.feature-title{
    margin:18px 0 10px;
    color:var(--gold2);
    font-size:22px;
}

.feature-title:empty{
    display:none;
}

.feature-content{
    margin:0;
    color:var(--white);
    line-height:2;
    white-space:pre-wrap;
}

.cross-reference-group + .cross-reference-group{
    margin-top:20px;
}

.cross-reference-heading{
    margin:0 0 10px;
    color:var(--gold2);
    font-size:17px;
}

.cross-reference-list{
    display:grid;
    gap:9px;
}

.cross-reference{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel2);
    color:var(--white);
    text-align:right;
    cursor:pointer;
}

.cross-reference:hover{
    border-color:var(--gold);
    background:var(--panel3);
}

.cross-reference-label{
    display:block;
    margin-bottom:4px;
    color:var(--gold2);
    font-weight:900;
}

.cross-reference-text{
    display:block;
    font-size:14px;
    line-height:1.75;
}

.cross-reference-source{
    margin:16px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

.geography-list{display:grid;gap:10px}.geography-item{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.geography-item h4{margin:0;color:var(--gold2);font-size:17px}.geography-kind{display:inline-block;margin-inline-start:7px;color:var(--muted);font-size:12px}.geography-item p{margin:5px 0 0;color:var(--white);line-height:1.7;white-space:normal}.geography-map{margin-top:10px}

.original-language-modal{z-index:1100}.language-body{padding:20px}.language-block{padding:16px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.language-block + .language-block{margin-top:12px}.language-label{margin:0 0 8px;color:var(--gold2);font-size:15px}.language-arabic,.language-original{margin:0;color:var(--white);font-size:19px;line-height:2}.language-original{font-family:"SBL Hebrew","Ezra SIL","SBL Greek","Gentium Plus","Times New Roman",serif;font-size:23px}.language-source{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.language-loading{padding:22px;color:var(--white)}

.commentary-explanation p{
    margin:0;
    line-height:1.65;
}

.commentary-explanation{
    white-space:normal;
}

.commentary-verse-text{
    margin:12px 0 14px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel2);
    color:var(--gold2);
    font-size:18px;
    line-height:1.8;
}

.commentary-explanation .commentary-sources{
    margin-top:0;
    padding-top:0;
    border-top:0;
}

.commentary-list{
    display:grid;
    gap:10px;
    margin-top:16px;
}

.commentary-choice{
    width:100%;
    min-height:50px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font:inherit;
    font-weight:900;
    text-align:right;
}

.commentary-choice:hover{
    border-color:var(--gold);
    color:var(--gold2);
    background:var(--panel3);
}

@media(max-width:900px){

    .books-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .chapters-grid{
        grid-template-columns:repeat(5,minmax(0,1fr));
    }

}

@media(max-width:700px){

    .header-inner{
        min-height:68px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .brand-title{
        font-size:19px;
    }

    .home-button{
        min-height:42px;
        padding:8px 12px;
        font-size:15px;
    }

    main{
        width:94%;
        padding-top:20px;
    }

    .main-icons{
        grid-template-columns:1fr;
        gap:18px;
    }

    .main-icon{
        min-height:240px;
    }

    .main-icon-symbol{
        font-size:72px;
    }

    .main-icon-title{
        font-size:26px;
    }

    .testaments{
        grid-template-columns:1fr;
    }

    .workspace{
        padding:16px;
    }

    .books-grid{
        grid-template-columns:1fr;
    }

    .chapters-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .verse{
        font-size:18px;
        line-height:2.25;
    }

    .chapter-number{
        font-size:26px;
    }

    .modal-actions{
        grid-template-columns:1fr;
    }

}

@media(max-width:430px){

    .brand-title{
        font-size:16px;
    }

    .chapters-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .chapter-navigation{
        gap:6px;
    }

    .nav-button{
        padding:8px;
        font-size:14px;
    }

    .audio{
        width:50px;
    }

}
</style>

<body>

<header>

    <div class="header-inner">

        <div class="header-actions">
            <a
                href="index.html"
                class="home-button"
            >
                ⌂ الرئيسية
            </a>

        </div>

        <div class="brand">

            <div class="brand-title">
                موسوعة الكتاب المقدس
            </div>

            <img
                src="assets/logo.png"
                class="logo"
                alt="شعار الكنيسة"
            >

        </div>

    </div>

</header>


<main>

    <div id="app"></div>

</main>


<div
    id="verseModal"
    class="modal-backdrop"
>

    <div class="modal">

        <div class="modal-header">

            <h2
                id="modalTitle"
                class="modal-title"
            >
                الآية
            </h2>

            <button
                id="modalCloseButton"
                class="close-modal"
                onclick="handleModalClose()"
                type="button"
                aria-label="إغلاق نافذة الآية"
            >
                ×
            </button>

        </div>


        <div
            id="modalVerse"
            class="modal-verse"
        ></div>


        <div class="modal-actions">

            <button
                class="modal-action"
                onclick="verseFeature('similar')"
                type="button"
            >
                🔗 الآيات المشابهة
            </button>

            <button
                class="modal-action"
                onclick="verseFeature('language')"
                type="button"
            >
                🔤 أصل اللغة
            </button>

            <button
                class="modal-action"
                onclick="verseFeature('places')"
                type="button"
            >
                🗺️ الأماكن والأنهار
            </button>

            <button
                class="modal-action"
                onclick="verseFeature('commentary')"
                type="button"
            >
                📚 التفسير
            </button>

        </div>

        <section id="verseFeaturePanel" class="verse-feature-panel" aria-live="polite">
            <h3 id="featureTitle" class="feature-title"></h3>
            <div id="featureContent" class="feature-content"></div>
        </section>

    </div>

</div>


<div id="originalLanguageModal" class="modal-backdrop original-language-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="originalLanguageTitle" class="modal-title">أصل اللغة</h2>
            <button class="close-modal" type="button" onclick="closeOriginalLanguage()" aria-label="العودة إلى الأصحاح بالكامل">↩ الأصحاح بالكامل</button>
        </div>
        <div id="originalLanguageContent" class="language-body"></div>
    </div>
</div>


<script>

/* =========================================================
   مصدر الكتاب المقدس
   الملف الموجود فعليًا في المستودع
========================================================= */

const ENGLISH_MODE = localStorage.getItem("bibleAppLanguage") === "en";
const BIBLE_URL = ENGLISH_MODE ? "bible-en.json" : "bible.json";
const ui = (arabic, english) => ENGLISH_MODE ? english : arabic;
const CROSS_REFERENCES_URL = "cross-references.json";
const VERSE_GEOGRAPHY_URL = "verse-geography.json";
const ORIGINAL_LANGUAGE_URL = "original-language-bible.json";


/* =========================================================
   ملف موسوعة التفسير
========================================================= */

const COMMENTARY_URL = "overview.html";


/* =========================================================
   أسماء الأسفار
   IDs مطابقة حرفيًا لبنية bible.json
========================================================= */

const BOOK_NAMES = {

    "01-gen":"التكوين",
    "02-Exodus":"الخروج",
    "03-Leviticus":"اللاويين",
    "04-Numbers":"العدد",
    "05-Deut":"التثنية",
    "06-Joshua":"يشوع",
    "07-Judges":"القضاة",
    "08-Ruth":"راعوث",
    "09-1-Samuel":"صموئيل الأول",
    "10-2-Samuel":"صموئيل الثاني",
    "11-1-Kings":"ملوك الأول",
    "12-2-Kings":"ملوك الثاني",

function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}

function normalizeArabicSearch(value){
    return String(value || "")
        .normalize("NFKD")
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
        .replace(/ـ/g, "")
        .replace(/[أإآٱ]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ؤ/g, "و")
        .replace(/ئ/g, "ي")
        .replace(/\s+/g, " ")
        .trim()
        .toLocaleLowerCase("ar");
}

/* =========================================================
   الأصحاحات الموجودة فعليًا في bible.json
========================================================= */

function getChapters(bookId){

    return [

        ...new Set(

            verses

                .filter(function(v){

                    return v.book === bookId;

                })

                .map(function(v){

                    return Number(v.chapter);

                })

                .filter(function(chapter){

                    return Number.isFinite(chapter);

                })

        )

    ].sort(function(a,b){

        return a-b;

    });

}

function updateNavigation(){

    const chapters =
        getChapters(currentBook);

    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    const previous =
        document.getElementById(
            "previousButton"
        );

    const next =
        document.getElementById(
            "nextButton"
        );


    if(!previous || !next){

        return;

    }


    previous.disabled =
        index <= 0;


    next.disabled =
        index < 0 ||
        index >= chapters.length - 1;

}


/* =========================================================
   السابق
========================================================= */

function previousChapter(){

    const chapters =
        getChapters(currentBook);

    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    if(index > 0){

        openChapter(
            currentBook,
            chapters[index - 1]
        );

    }

}


/* =========================================================
   التالي
========================================================= */

function nextChapter(){

    const chapters =
        getChapters(currentBook);

    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    if(
        index >= 0 &&
        index < chapters.length - 1
    ){

        openChapter(
            currentBook,
            chapters[index + 1]
        );

    }

}

function verseFeature(feature){

    if(!currentVerse){

        return;

    }


    const featureTitles = {
        similar: "الآيات المشابهة",
        language: "أصل اللغة",
        places: "الأماكن والأنهار",
        commentary: "التفسير"
    };

    const featureMessages = {
        similar: "لم تُعتمد قرائن كتابية موثقة لهذه الآية في قاعدة المشروع حتى الآن.",
        language: "لا توجد بيانات لغوية موثقة مرتبطة بهذه الآية في قاعدة المشروع حتى الآن.",
        places: "لا يوجد موضع أو نهر موثق مرتبط بهذه الآية في قاعدة الموسوعة حتى الآن.",
        commentary: "قسم التفسير محفوظ لحين تزويد قائمة التفاسير المعتمدة. لن تُضاف إحالات غير مؤكدة."
    };

    if(!featureTitles[feature]) return;

    document.getElementById("featureTitle").textContent = featureTitles[feature];
    const content = document.getElementById("featureContent");

    if(feature === "commentary"){
        document.getElementById("featureTitle").textContent = "";
        document.querySelector("#verseModal .modal").classList.add("feature-open");
        updateModalCloseButton(true);
        selectCommentary("academic_synthesis");
        return;
    }else if(feature === "similar"){
        document.querySelector("#verseModal .modal").classList.add("feature-open");
        updateModalCloseButton(true);
        showSimilarVerses();
        return;
    }else if(feature === "places"){
        document.querySelector("#verseModal .modal").classList.add("feature-open");
        updateModalCloseButton(true);
        showVerseGeography();
        return;
    }else if(feature === "language"){
        openOriginalLanguage();
        return;
    }else{
        content.textContent = featureMessages[feature];
    }
    document.querySelector("#verseModal .modal").classList.add("feature-open");
}

async function openOriginalLanguage(){
    const verse = currentVerse;
    if(!verse) return;
    document.getElementById("verseModal").classList.remove("open");
    closeVerseFeature();
    const modal = document.getElementById("originalLanguageModal");
    const content = document.getElementById("originalLanguageContent");
    document.getElementById("originalLanguageTitle").textContent = `${BOOK_NAMES[verse.book] || verse.book} ${verse.chapter}:${verse.verse}`;
    content.innerHTML = `<p class="language-loading">جارٍ تحميل النص الأصلي...</p>`;
    modal.classList.add("open");

    try{
        if(!originalLanguageData){
            const response = await fetch(ORIGINAL_LANGUAGE_URL,{cache:"no-store"});
            if(!response.ok) throw new Error("original text unavailable");
            originalLanguageData = await response.json();
        }
        const key = [verse.book,verse.chapter,verse.verse].join(":");
        const original = originalLanguageData.verses[key];
        if(!original){
            content.innerHTML = `<section class="language-block"><h3 class="language-label">النص العربي</h3><p class="language-arabic">${escapeHTML(verse.text)}</p></section><p class="language-source">تعذر مطابقة ترقيم هذه الآية مع النسخة الأصلية المحلية دون تغيير حدود النص.</p>`;
            return;
        }
        const source = Number(verse.book.slice(0,2)) >= 40
            ? "النص اليوناني البيزنطي 1904 / Textus Receptus، ملكية عامة"
            : "Westminster Leningrad Codex، ملكية عامة";
        content.innerHTML = `
            <section class="language-block"><h3 class="language-label">النص العربي</h3><p class="language-arabic">${escapeHTML(verse.text)}</p></section>
            <section class="language-block"><h3 class="language-label">النص باللغة ${escapeHTML(original.language)}</h3><p class="language-original" dir="${original.direction}">${escapeHTML(original.text)}</p></section>
            <p class="language-source">المصدر: ${source}، عبر eBible.org.</p>`;
        if(typeof removeProjectBlankLines === "function") removeProjectBlankLines(content);
    }catch(error){
        content.textContent = "تعذر تحميل النص الأصلي المحلي.";
    }
}

const COMMENTATORS = [
    {id:"academic_synthesis",name:"الشرح الأكاديمي اللاهوتي"}
];

function commentaryMarkup(record){
    const verseText = currentVerse ? currentVerse.text : "";
    if(!record || !record.explanation_lines){
        return `<p class="commentary-verse-text">${escapeHTML(verseText)}</p><p class="feature-content">لم يكتمل بعد شرح هذه الآية وفق النظام الأكاديمي واللاهوتي والعميق والتطبيقي المتفق عليه. لن يُعرض الملخص القديم كتفسير معتمد.</p>`;
    }
    const lines = record.explanation_lines;
    const sourceNames = Array.isArray(record.interpreter_names) ? record.interpreter_names : [];
    return `<p class="commentary-verse-text">${escapeHTML(verseText)}</p><div class="feature-content commentary-explanation"><p><strong>السياق الأكاديمي:</strong> ${escapeHTML(lines.academic || "")}</p><p><strong>المعنى اللاهوتي:</strong> ${escapeHTML(lines.theological || "")}</p><p><strong>التعمق:</strong> ${escapeHTML(lines.deep || "")}</p><p><strong>التطبيق:</strong> ${escapeHTML(lines.applied || "")}</p><p class="commentary-sources"><strong>مصادر التفسير:</strong> ${escapeHTML(sourceNames.join("، "))}</p></div>`;
}

async function selectCommentary(commentatorId){
    if(!currentVerse) return;
    const commentator = COMMENTATORS.find(function(item){return item.id === commentatorId});
    if(!commentator) return;

    const content = document.getElementById("featureContent");
    content.textContent = "جارٍ التحقق من الشرح المعتمد...";

    try{
        const commentaryFile = `commentary-data/${currentVerse.book}.json`;
        if(!commentaryCache[commentaryFile]){
            const response = await fetch(commentaryFile,{cache:"no-store"});
            if(!response.ok) throw new Error("commentary unavailable");
            commentaryCache[commentaryFile] = await response.json();
        }

        const commentaryData = commentaryCache[commentaryFile];
        const reference = [currentVerse.book,currentVerse.chapter,currentVerse.verse].join(":");
        const study = commentaryData.verses && (commentaryData.verses[reference] || commentaryData.verses[reference.replace(/\s+/g,"")]);
        const records = study && study.commentators ? study.commentators : {};
        const record = records[commentatorId];

        document.getElementById("featureTitle").textContent = "";
        content.innerHTML = commentaryMarkup(record);
    }catch(error){
        content.textContent = "تعذر تحميل قاعدة التفاسير المحلية. لم تتم إضافة أي شرح غير موثق.";
    }
}

/* =========================================================
   تنفيذ البحث
========================================================= */

function performSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const results =
        document.getElementById(
            "searchResults"
        );


    if(!input || !results){

        return;

    }


    const query =
        normalizeArabicSearch(
            input.value
        );


    if(!query){

        results.innerHTML = `

            <div class="empty">
                اكتب كلمة أو عبارة للبحث.
            </div>

        `;

        return;

    }


    const hits =
        verses.filter(function(v){

            return normalizeArabicSearch(
                v.text
            ).includes(query);

        });


    if(!hits.length){

        results.innerHTML = `

            <div class="empty">
                لا توجد نتائج.
            </div>

        `;

        return;

    }


    results.innerHTML = `

        <div class="empty">

            عدد النتائج:
            ${hits.length.toLocaleString("ar-EG")}

        </div>


        <div class="search-results">

            ${hits.slice(0,300).map(function(v){

                return `

                    <div
                        class="search-result"
                        onclick="openSearchVerse(
                            '${v.book}',
                            ${v.chapter},
                            ${v.verse}
                        )"
                    >

                        <span class="search-reference">

                            ${escapeHTML(
                                BOOK_NAMES[v.book] ||
                                v.book
                            )}

                            ${v.chapter}:${v.verse}

                        </span>

                        ${escapeHTML(v.text)}

                    </div>

                `;

            }).join("")}

        </div>

    `;

}

async function loadBible(){

    try{

        const response =
            await fetch(
                BIBLE_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "bible.json يجب أن يكون مصفوفة JSON"
            );

        }


        /*
           bible.json يحتوي مباشرة على:

           {
               book,
               chapter,
               verse,
               text
           }

           لذلك لا نستخدم أي ملف آخر.
        */

        verses = data

            .map(function(v){

                return {

                    book:String(
                        v.book ?? ""
                    ).trim(),

                    chapter:Number(
                        v.chapter
                    ),

                    verse:Number(
                        v.verse ??
                        v.number
                    ),

                    text:String(
                        v.text ?? ""
                    ).trim()

                };

            })

            .filter(function(v){

                return (

                    v.book &&
                    Number.isFinite(v.chapter) &&
                    Number.isFinite(v.verse) &&
                    v.text

                );

            });


        /*
           ترتيب البيانات داخل الذاكرة
           لضمان ثبات التنقل.
        */

        verses.sort(function(a,b){

            const bookA =
                String(a.book);

            const bookB =
                String(b.book);

            const indexA =
                OLD_BOOKS.indexOf(bookA) >= 0
                    ? OLD_BOOKS.indexOf(bookA)
                    : NEW_BOOKS.indexOf(bookA) + OLD_BOOKS.length;

            const indexB =
                OLD_BOOKS.indexOf(bookB) >= 0
                    ? OLD_BOOKS.indexOf(bookB)
                    : NEW_BOOKS.indexOf(bookB) + OLD_BOOKS.length;


            if(indexA !== indexB){

                return indexA - indexB;

            }


            if(
                Number(a.chapter) !==
                Number(b.chapter)
            ){

                return Number(a.chapter) -
                       Number(b.chapter);

            }


            return Number(a.verse) -
                   Number(b.verse);

        });

        verseLookup = new Map(
            verses.map(function(verse){
                return [[verse.book,verse.chapter,verse.verse].join(":"),verse];
            })
        );


        /*
           تشغيل الصفحة بعد تحميل
           bible.json بالكامل.
        */

        renderTestaments();


        console.log(
            "Bible loaded:",
            verses.length,
            "verses"
        );


        console.log(
            "Books loaded:",
            new Set(
                verses.map(function(v){
                    return v.book;
                })
            ).size
        );


    }catch(error){

        console.error(
            "Bible loading error:",
            error
        );


        app.innerHTML = `

            <section class="workspace">

                <div class="error">

                    تعذر تحميل
                    <b>bible.json</b>.

                    <br><br>

                    تأكد من أن الملف موجود في نفس
                    مجلد <b>bible.html</b>.

                    <br><br>

                    الخطأ:
                    <b>${escapeHTML(error.message)}</b>

                </div>

            </section>

        `;

    }

}
