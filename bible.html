<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --panel2:#102a46;
    --panel3:#153657;
    --gold:#d4af37;
    --gold2:#f2d675;
    --white:#f4f7fb;
    --muted:#9fb0c3;
    --line:#1d3b59;
    --blue:#2d7ff9;
    --danger:#ffb4b4;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at top right,
            rgba(45,127,249,.12),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );
    color:var(--white);
    font-family:
        Arial,
        Tahoma,
        "Segoe UI",
        sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(6,19,33,.97);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.header-inner{
    width:min(1400px,92%);
    min-height:78px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.home-button{
    min-height:48px;
    padding:10px 18px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--panel2);
    color:var(--gold2);
    text-decoration:none;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition:.2s ease;
}

.home-button:hover{
    background:var(--panel3);
    transform:translateY(-1px);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:68px;
    height:68px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold2);
    font-size:25px;
    font-weight:900;
    text-shadow:
        0 2px 8px rgba(212,175,55,.30);
}

main{
    width:min(1250px,94%);
    margin:auto;
    padding:30px 0 60px;
}

#app{
    width:100%;
}

.start-screen{
    width:100%;
}

.start-title{
    text-align:center;
    color:var(--gold2);
    font-size:32px;
    font-weight:900;
    margin:0 0 10px;
}

.start-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:16px;
    margin:0 0 28px;
}

.main-icons{
    width:min(950px,100%);
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:28px;
}

.main-icon{
    min-height:300px;
    border:1px solid var(--line);
    border-radius:26px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    color:var(--white);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px 25px;
    transition:.25s ease;
    box-shadow:
        0 15px 35px rgba(0,0,0,.20);
}

.main-icon:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
    background:
        linear-gradient(
            145deg,
            var(--panel3),
            var(--panel2)
        );
    box-shadow:
        0 20px 45px rgba(0,0,0,.28);
}

.main-icon-symbol{
    font-size:88px;
    line-height:1;
    margin-bottom:25px;
}

.main-icon-title{
    color:var(--gold2);
    font-size:30px;
    font-weight:900;
}

.main-icon-description{
    color:var(--muted);
    font-size:15px;
    margin-top:10px;
}

.workspace{
    width:100%;
    background:rgba(13,33,56,.96);
    border:1px solid var(--line);
    border-radius:22px;
    padding:25px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.22);
}

.inner-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:24px;
}

.inner-back{
    border:1px solid var(--gold);
    border-radius:11px;
    background:var(--panel2);
    color:var(--gold2);
    min-height:44px;
    padding:9px 16px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.inner-back:hover{
    background:var(--panel3);
}

.inner-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;
    margin:0;
}

.testaments{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
}

.testament{
    min-height:190px;
    border:1px solid var(--line);
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    color:var(--white);
    cursor:pointer;
    text-align:center;
    padding:28px;
    transition:.22s ease;
}

.testament:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    background:var(--panel3);
}

.testament-symbol{
    font-size:55px;
    margin-bottom:12px;
}

.testament-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;
}

.testament-count{
    color:var(--muted);
    margin-top:8px;
    font-size:16px;
}

.books-grid{
    display:grid;
    grid-template-columns:
        repeat(3,minmax(0,1fr));
    gap:12px;
}

.book{
    min-height:78px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    padding:13px;
    font-size:18px;
    font-weight:900;
    transition:.2s ease;
}

.book:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
    transform:translateY(-2px);
}

.book-number{
    display:none;
}

.chapters-grid{
    display:grid;
    grid-template-columns:
        repeat(7,minmax(0,1fr));
    gap:10px;
}

.chapter{
    min-height:60px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:18px;
    font-weight:900;
    transition:.2s ease;
}

.chapter:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
    transform:translateY(-2px);
}

.chapter-reading{
    width:100%;
}

.chapter-heading{
    text-align:center;
    padding:5px 0 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
}

.chapter-book-name{
    color:var(--muted);
    font-size:17px;
    margin-bottom:7px;
}

.chapter-number{
    margin:0;
    color:var(--gold2);
    font-size:30px;
    font-weight:900;
}

.verses{
    width:100%;
}

.verse{
    padding:18px 8px;
    border-bottom:1px solid #17344f;
    font-size:21px;
    line-height:2.35;
    cursor:pointer;
    transition:.18s ease;
}

.verse:hover{
    background:rgba(16,42,70,.75);
}

.verse-number{
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
    margin-left:9px;
}

.chapter-navigation{
    margin-top:15px;
    padding-top:18px;
    border-top:1px solid var(--line);

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
}

.nav-button{
    min-height:52px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    padding:10px 18px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.nav-button:hover:not(:disabled){
    border-color:var(--gold);
    color:var(--gold2);
    background:var(--panel3);
}

.nav-button:disabled{
    opacity:.30;
    cursor:not-allowed;
}

.previous{
    justify-self:start;
}

.next{
    justify-self:end;
}

.audio{
    width:60px;
    height:52px;
    padding:0;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-container{
    width:100%;
}

.search-form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-input{
    flex:1;
    min-height:55px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    outline:none;
    padding:12px 16px;
    font-size:18px;
}

.search-input:focus{
    border-color:var(--gold);
}

.search-submit{
    min-width:115px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--panel3);
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.search-results{
    width:100%;
}

.search-result{
    padding:16px 8px;
    border-bottom:1px solid #17344f;
    cursor:pointer;
    line-height:2;
}

.search-result:hover{
    background:var(--panel2);
}

.search-reference{
    display:block;
    color:var(--gold2);
    font-size:16px;
    font-weight:900;
    margin-bottom:4px;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    line-height:2;
}

.error{
    color:var(--danger);
    background:#351b24;
    border:1px solid #6b3040;
    border-radius:12px;
    padding:16px;
    line-height:2;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:min(760px,100%);
    max-height:88vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:20px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.50);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
}

.modal-title{
    margin:0;
    color:var(--gold2);
    font-size:23px;
    font-weight:900;
}

.close-modal{
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:22px;
}

.modal-verse{
    padding:22px;
    font-size:20px;
    line-height:2.35;
    border-bottom:1px solid var(--line);
}

.modal-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    padding:18px;
}

.modal-action{
    min-height:58px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel2);
    color:var(--white);
    cursor:pointer;
    font-size:17px;
    font-weight:900;
    transition:.2s ease;
}

.modal-action:hover{
    border-color:var(--gold);
    background:var(--panel3);
    color:var(--gold2);
}

@media(max-width:900px){

    .books-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .chapters-grid{
        grid-template-columns:repeat(5,minmax(0,1fr));
    }

}

@media(max-width:700px){

    .header-inner{
        min-height:68px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .brand-title{
        font-size:19px;
    }

    .home-button{
        min-height:42px;
        padding:8px 12px;
        font-size:15px;
    }

    main{
        width:94%;
        padding-top:20px;
    }

    .main-icons{
        grid-template-columns:1fr;
        gap:18px;
    }

    .main-icon{
        min-height:240px;
    }

    .main-icon-symbol{
        font-size:72px;
    }

    .main-icon-title{
        font-size:26px;
    }

    .testaments{
        grid-template-columns:1fr;
    }

    .workspace{
        padding:16px;
    }

    .books-grid{
        grid-template-columns:1fr;
    }

    .chapters-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .verse{
        font-size:18px;
        line-height:2.25;
    }

    .chapter-number{
        font-size:26px;
    }

    .modal-actions{
        grid-template-columns:1fr;
    }

}

@media(max-width:430px){

    .brand-title{
        font-size:16px;
    }

    .chapters-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .chapter-navigation{
        gap:6px;
    }

    .nav-button{
        padding:8px;
        font-size:14px;
    }

    .audio{
        width:50px;
    }

}
</style>
</head>

<header>

    <div class="header-inner">

        <a
            href="index.html"
            class="home-button"
        >

        <div class="brand">

        </div>

    </div>

</header>


<main>

    <div id="app"></div>

<div

    <div class="modal">

        <div class="modal-header">

            <h2

                class="modal-title"

            </h2>

            <button

        <div class="modal-actions">

            >
                🔗 الآيات المشابهة

            <button
                class="modal-action"
                onclick="verseFeature('language')"
                type="button"
            >
                🔤 أصل اللغة
            </button>

            <button
                class="modal-action"
                onclick="verseFeature('places')"
                type="button"
            >
                🗺️ الأماكن والأنهار
            </button>

            <button
                class="modal-action"
                onclick="verseFeature('commentary')"
                type="button"
            >
                📚 التفسير

        </div>

    </div>

</div>

const app = document.getElementById("app");


function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}

/* =========================================================
   فتح الأصحاح
========================================================= */

function openChapter(bookId,chapter){

    currentBook = bookId;

    currentChapter = Number(chapter);


    const rows = verses

        .filter(function(v){

            return (

                v.book === bookId &&
                Number(v.chapter) === Number(chapter)

            );

        })

        .sort(function(a,b){

            return a.verse - b.verse;

        });


    if(!rows.length){

        app.innerHTML = `

            <section class="workspace">

                <div class="empty">
                    لا توجد آيات لهذا الأصحاح داخل
                    <b>bible.json</b>.
                </div>

            </section>

        `;

        return;

    }


    app.innerHTML = `

        <section class="workspace">

            <div class="chapter-reading">

                <div class="chapter-heading">

                    <div class="chapter-book-name">
                        ${escapeHTML(
                            BOOK_NAMES[bookId] || bookId
                        )}
                    </div>

                    <h2 class="chapter-number">
                        الأصحاح ${chapter}
                    </h2>

                </div>


                <div class="verses">

                    ${rows.map(function(v){

                        return `

                            <div
                                class="verse"
                                tabindex="0"
                                role="button"
                                onclick="openVerse(
                                    '${v.book}',
                                    ${v.chapter},
                                    ${v.verse}
                                )"
                            >

                                <span class="verse-number">
                                    ${v.verse}
                                </span>

                                ${escapeHTML(v.text)}

                            </div>

                        `;

                    }).join("")}

                </div>


                <div class="chapter-navigation">

                    <button
                        id="previousButton"
                        class="nav-button previous"
                        type="button"
                        onclick="previousChapter()"
                    >
                        ← السابق
                    </button>


                    <button
                        class="nav-button audio"
                        type="button"
                        onclick="playChapter()"
                        title="السماعة"
                    >
                        🔊
                    </button>


                    <button
                        id="nextButton"
                        class="nav-button next"
                        type="button"
                        onclick="nextChapter()"
                    >
                        التالي →
                    </button>

                </div>

            </div>

        </section>

    `;


    updateNavigation();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   الأصحاحات الموجودة فعليًا في bible.json
========================================================= */

function getChapters(bookId){

    return [

        ...new Set(

            verses

                .filter(function(v){

                    return v.book === bookId;

                })

                .map(function(v){

                    return Number(v.chapter);

                })

                .filter(function(chapter){

                    return Number.isFinite(chapter);

                })

        )

    ].sort(function(a,b){

        return a-b;

    });

}


/* =========================================================
   تحديث التنقل
========================================================= */

function updateNavigation(){

    const chapters =
        getChapters(currentBook);

    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    const previous =
        document.getElementById(
            "previousButton"
        );

    const next =
        document.getElementById(
            "nextButton"
        );


    if(!previous || !next){

        return;

    }


    previous.disabled =
        index <= 0;


    next.disabled =
        index < 0 ||
        index >= chapters.length - 1;

}


/* =========================================================
   السابق
========================================================= */

function previousChapter(){

    const chapters =
        getChapters(currentBook);

    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    if(index > 0){

        openChapter(
            currentBook,
            chapters[index - 1]
        );

    }

}


/* =========================================================
   التالي
========================================================= */

function nextChapter(){

    const chapters =
        getChapters(currentBook);

    const index =
        chapters.indexOf(
            Number(currentChapter)
        );


    if(
        index >= 0 &&
        index < chapters.length - 1
    ){

        openChapter(
            currentBook,
            chapters[index + 1]
        );

    }

}


/* =========================================================
   فتح الآية
========================================================= */

function openVerse(book,chapter,verse){

    const found = verses.find(function(v){

        return (

            v.book === book &&
            Number(v.chapter) === Number(chapter) &&
            Number(v.verse) === Number(verse)

        );

    });


    if(!found){

        return;

    }


    currentVerse = found;


    document.getElementById(
        "modalTitle"
    ).textContent =

        `${BOOK_NAMES[book] || book} ${chapter}:${verse}`;


    document.getElementById(
        "modalVerse"
    ).innerHTML = `

        <span class="verse-number">
            ${verse}
        </span>

        ${escapeHTML(found.text)}

    `;


    document.getElementById(
        "verseModal"
    ).classList.add("open");


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   إغلاق نافذة الآية
========================================================= */

function closeVerse(){

    document.getElementById(
        "verseModal"
    ).classList.remove("open");

    document.body.style.overflow = "";

}


/* =========================================================
   الخيارات الأربعة
========================================================= */

function verseFeature(feature){

    if(!currentVerse){

        return;

    }


    if(feature === "similar"){

        alert(
            "الآيات المشابهة — سيتم ربط منظومة الآيات المشابهة لاحقًا."
        );

        return;

    }


    if(feature === "language"){

        alert(
            "أصل اللغة — سيتم ربط بيانات العبرية والآرامية واليونانية لاحقًا."
        );

        return;

    }


    if(feature === "places"){

        alert(
            "الأماكن والأنهار — سيتم ربط قاعدة الأماكن والأنهار والخرائط لاحقًا."
        );

        return;

    }


    /* =====================================================
       التعديل الأساسي:
       إرسال المرجع الحقيقي إلى overview.html
    ===================================================== */

    if(feature === "commentary"){

        const book =
            String(
                currentVerse.book ?? ""
            ).trim();

        const chapter =
            Number(
                currentVerse.chapter
            );

        const verse =
            Number(
                currentVerse.verse
            );


        if(
            !book ||
            !Number.isFinite(chapter) ||
            !Number.isFinite(verse)
        ){

            alert(
                "تعذر تحديد مرجع الآية."
            );

            return;

        }


        const params =
            new URLSearchParams({

                book:book,

                chapter:String(chapter),

                verse:String(verse)

            });


        window.location.href =
            `${COMMENTARY_URL}?${params.toString()}`;


        return;

    }

}

function openSearch(){

                        type="search"
                        placeholder="اكتب كلمة أو عبارة من الكتاب المقدس..."
                        autocomplete="off"
                    >

                    <button
                        class="search-submit"
                        type="button"
                        onclick="performSearch()"
                    >
                        بحث
                    </button>

                </div>


                <div id="searchResults"></div>

            </div>

        </section>

    `;


    const input =
        document.getElementById(
            "searchInput"
        );

    input.addEventListener(

        function(event){

            if(event.key === "Enter"){

/* =========================================================
   تنفيذ البحث
========================================================= */

function performSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const results =
        document.getElementById(
            "searchResults"
        );


    if(!input || !results){

        return;

    }


    const query =
        input.value
            .trim()
            .toLocaleLowerCase("ar");


    if(!query){

        results.innerHTML = `

            <div class="empty">
                اكتب كلمة أو عبارة للبحث.
            </div>

        `;

        return;

    }


    const hits =
        verses.filter(function(v){

            return v.text
                .toLocaleLowerCase("ar")
                .includes(query);

        });


    if(!hits.length){

        results.innerHTML = `

            <div class="empty">
                لا توجد نتائج.
            </div>

        `;

        return;

    }


    results.innerHTML = `

        <div class="empty">

            عدد النتائج:
            ${hits.length.toLocaleString("ar-EG")}

        </div>


        <div class="search-results">

            ${hits.slice(0,300).map(function(v){

                return `

                    <div
                        class="search-result"
                        onclick="openSearchVerse(
                            '${v.book}',
                            ${v.chapter},
                            ${v.verse}
                        )"
                    >

                        <span class="search-reference">

                            ${escapeHTML(
                                BOOK_NAMES[v.book] ||
                                v.book
                            )}

                            ${v.chapter}:${v.verse}

                        </span>

                        ${escapeHTML(v.text)}

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =========================================================
   فتح نتيجة البحث
========================================================= */

function openSearchVerse(
    book,
    chapter,
    verse
){

    openChapter(
        book,
        Number(chapter)
    );


    setTimeout(function(){

        openVerse(
            book,
            Number(chapter),
            Number(verse)
        );

    },50);

}

/* =========================================================
   تحميل bible.json فقط
========================================================= */

async function loadBible(){

    try{

        const response =
            await fetch(
                BIBLE_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "bible.json يجب أن يكون مصفوفة JSON"
            );

        }


        /*
           bible.json يحتوي مباشرة على:

           {
               book,
               chapter,
               verse,
               text
           }

           لذلك لا نستخدم أي ملف آخر.
        */

        verses = data

            .map(function(v){

                return {

                    book:String(
                        v.book ?? ""
                    ).trim(),

                    chapter:Number(
                        v.chapter
                    ),

                    verse:Number(
                        v.verse ??
                        v.number
                    ),

                    text:String(
                        v.text ?? ""
                    ).trim()

                };

            })

            .filter(function(v){

                return (

                    v.book &&
                    Number.isFinite(v.chapter) &&
                    Number.isFinite(v.verse) &&
                    v.text

                );

            });


        /*
           ترتيب البيانات داخل الذاكرة
           لضمان ثبات التنقل.
        */

        verses.sort(function(a,b){

            const bookA =
                String(a.book);

            const bookB =
                String(b.book);

            const indexA =
                OLD_BOOKS.indexOf(bookA) >= 0
                    ? OLD_BOOKS.indexOf(bookA)
                    : NEW_BOOKS.indexOf(bookA) + OLD_BOOKS.length;

            const indexB =
                OLD_BOOKS.indexOf(bookB) >= 0
                    ? OLD_BOOKS.indexOf(bookB)
                    : NEW_BOOKS.indexOf(bookB) + OLD_BOOKS.length;


            if(indexA !== indexB){

                return indexA - indexB;

            }


            if(
                Number(a.chapter) !==
                Number(b.chapter)
            ){

                return Number(a.chapter) -
                       Number(b.chapter);

            }


            return Number(a.verse) -
                   Number(b.verse);

        });


        /*
           تشغيل الصفحة بعد تحميل
           bible.json بالكامل.
        */

        renderStart();


        console.log(
            "Bible loaded:",
            verses.length,
            "verses"
        );


        console.log(
            "Books loaded:",
            new Set(
                verses.map(function(v){
                    return v.book;
                })
            ).size
        );


    }catch(error){

        console.error(
            "Bible loading error:",
            error
        );


        app.innerHTML = `

            <section class="workspace">

                <div class="error">

                    تعذر تحميل
                    <b>bible.json</b>.

                    <br><br>

                    تأكد من أن الملف موجود في نفس
                    مجلد <b>bible.html</b>.

                    <br><br>

                    الخطأ:
                    <b>${escapeHTML(error.message)}</b>

                </div>

            </section>

        `;

    }

}


/* =========================================================
   تشغيل

loadBible();
