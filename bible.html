<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب المقدس | موسوعة الكتاب المقدس</title>

<style>

:root{
    --blue-1:#04111f;
    --blue-2:#071c31;
    --blue-3:#0d2d4a;
    --blue-4:#12446d;

    --gold:#d4af37;
    --gold-light:#f4dc78;
    --gold-dark:#806018;

    --white:#f7f9fc;
    --muted:#aebdca;

    --border:rgba(212,175,55,.30);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;
    min-height:100vh;

    font-family:
        "Noto Naskh Arabic",
        "Amiri",
        Tahoma,
        Arial,
        sans-serif;

    color:var(--white);

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(23,75,120,.75),
            transparent 45%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(13,56,93,.35),
            transparent 38%
        ),

        linear-gradient(
            145deg,
            var(--blue-1),
            var(--blue-2) 55%,
            #020a13
        );
}


/* =====================================================
   HEADER
===================================================== */

header{

    position:sticky;
    top:0;
    z-index:1000;

    width:100%;

    background:
        linear-gradient(
            180deg,
            rgba(7,29,49,.98),
            rgba(3,15,27,.98)
        );

    border-bottom:
        1px solid
        rgba(212,175,55,.42);

    box-shadow:
        0 8px 30px rgba(0,0,0,.55);
}


.topbar{

    max-width:1450px;
    min-height:92px;

    margin:auto;
    padding:10px 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}


/* =====================================================
   BACK
===================================================== */

.back-btn{

    min-width:180px;
    height:55px;

    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    color:#fff;
    text-decoration:none;

    border:
        1px solid
        rgba(212,175,55,.68);

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #183c5d,
            #071a2d
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 6px 17px rgba(0,0,0,.48);

    font-size:17px;
    font-weight:900;

    transition:.25s;
}

.back-btn:hover{

    border-color:var(--gold-light);

    transform:translateY(-2px);
}


/* =====================================================
   BRAND
===================================================== */

.brand{

    display:flex;
    align-items:center;
    gap:14px;
}


.brand-logo{

    width:70px;
    height:70px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(0,0,0,.82)
        );
}


.brand-name{

    font-size:22px;
    font-weight:900;
    white-space:nowrap;

    background:
        linear-gradient(
            180deg,
            #fff4ae,
            var(--gold-light) 35%,
            var(--gold) 68%,
            var(--gold-dark)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


/* =====================================================
   PAGE
===================================================== */

.page{

    max-width:1450px;

    margin:auto;

    padding:35px 25px 70px;
}


/* =====================================================
   TITLE
===================================================== */

.page-title{

    text-align:center;

    margin-bottom:30px;
}


.page-title h1{

    margin:0;

    color:var(--gold-light);

    font-size:
        clamp(30px,5vw,44px);

    font-weight:900;
}


.page-title p{

    margin:8px 0 0;

    color:var(--muted);

    font-size:17px;
}


/* =====================================================
   MAIN ACTIONS
===================================================== */

.main-actions{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(200px,1fr));

    gap:18px;

    max-width:760px;

    margin:0 auto 35px;
}


.main-action{

    min-height:145px;

    border:
        1px solid
        rgba(212,175,55,.30);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(17,52,81,.97),
            rgba(5,22,38,.99)
        );

    color:#fff;

    cursor:pointer;

    font-family:inherit;

    box-shadow:
        0 12px 30px rgba(0,0,0,.35);

    transition:.25s;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;
}


.main-action:hover{

    transform:translateY(-5px);

    border-color:
        var(--gold-light);

    background:
        linear-gradient(
            145deg,
            rgba(20,82,126,.98),
            rgba(6,26,44,.99)
        );
}


.main-action-icon{

    font-size:48px;
}


.main-action-title{

    color:var(--gold-light);

    font-size:21px;

    font-weight:900;
}


.main-action-subtitle{

    color:var(--muted);

    font-size:13px;
}


/* =====================================================
   BIBLE CONTAINER
===================================================== */

#bibleContainer{

    width:100%;
}


/* =====================================================
   TESTAMENT
===================================================== */

.testament{

    margin-bottom:38px;
}


.testament-title{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    margin:0 0 20px;

    padding:15px;

    color:var(--gold-light);

    font-size:27px;

    font-weight:900;

    border:
        1px solid
        rgba(212,175,55,.30);

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(13,56,93,.94),
            rgba(4,23,39,.98)
        );
}


/* =====================================================
   BOOKS
===================================================== */

.books-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap:15px;
}


.book-card{

    min-height:120px;

    padding:18px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#fff;

    border:
        1px solid
        rgba(212,175,55,.27);

    border-radius:18px;

    background:

        linear-gradient(
            145deg,
            rgba(17,52,81,.96),
            rgba(5,22,38,.98)
        );

    box-shadow:
        0 10px 24px rgba(0,0,0,.35);

    cursor:pointer;

    transition:.25s ease;

    font-family:inherit;
}


.book-card:hover{

    transform:
        translateY(-5px);

    border-color:
        var(--gold-light);

    background:

        linear-gradient(
            145deg,
            rgba(20,82,126,.98),
            rgba(6,26,44,.99)
        );
}


.book-icon{

    font-size:34px;

    margin-bottom:7px;
}


.book-name{

    color:var(--gold-light);

    font-size:19px;

    font-weight:900;
}


.book-meta{

    margin-top:5px;

    color:var(--muted);

    font-size:13px;
}


/* =====================================================
   CHAPTER VIEW
===================================================== */

.chapter-panel{

    display:none;

    margin-top:25px;

    padding:25px;

    border:
        1px solid
        rgba(212,175,55,.35);

    border-radius:22px;

    background:
        rgba(3,17,29,.95);

    box-shadow:
        0 15px 40px rgba(0,0,0,.45);
}


.chapter-panel.active{

    display:block;
}


.chapter-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;

    padding-bottom:15px;

    border-bottom:
        1px solid
        rgba(212,175,55,.20);
}


.chapter-title{

    color:var(--gold-light);

    font-size:25px;

    font-weight:900;
}


.close-chapter{

    border:
        1px solid
        rgba(212,175,55,.4);

    border-radius:10px;

    background:#102e49;

    color:#fff;

    padding:9px 16px;

    cursor:pointer;

    font-family:inherit;

    font-weight:800;
}


/* =====================================================
   CHAPTERS
===================================================== */

.chapters-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(75px,1fr)
        );

    gap:10px;
}


.chapter-btn{

    min-height:58px;

    border:
        1px solid
        rgba(212,175,55,.28);

    border-radius:12px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #123d61,
            #071a2d
        );

    cursor:pointer;

    font-family:inherit;

    font-size:18px;

    font-weight:900;

    transition:.2s;
}


.chapter-btn:hover{

    border-color:
        var(--gold-light);

    transform:
        translateY(-2px);
}


/* =====================================================
   VERSES
===================================================== */

.verses-panel{

    display:none;

    margin-top:25px;
}


.verses-panel.active{

    display:block;
}


.verses-header{

    margin-bottom:20px;

    padding:15px;

    border-radius:15px;

    color:var(--gold-light);

    background:
        rgba(13,56,93,.55);

    font-size:22px;

    font-weight:900;

    text-align:center;
}


.verse{

    position:relative;

    margin-bottom:12px;

    padding:18px 65px 18px 18px;

    border:
        1px solid
        rgba(212,175,55,.20);

    border-radius:15px;

    background:
        rgba(7,27,45,.88);

    cursor:pointer;

    transition:.22s;
}


.verse:hover{

    border-color:
        rgba(212,175,55,.70);

    background:
        rgba(14,55,84,.90);

    transform:
        translateX(-3px);
}


.verse-number{

    position:absolute;

    right:15px;

    top:18px;

    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#071a2d;

    background:
        var(--gold-light);

    font-weight:900;
}


.verse-text{

    color:#fff;

    font-size:20px;

    line-height:2;
}


/* =====================================================
   CHAPTER NAVIGATION
===================================================== */

.chapter-navigation{

    margin-top:30px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(212,175,55,.22);

    display:grid;

    grid-template-columns:
        1fr 80px 1fr;

    align-items:center;

    gap:10px;
}


.chapter-nav-btn{

    min-height:50px;

    padding:0 15px;

    border:
        1px solid
        rgba(212,175,55,.35);

    border-radius:13px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #123d61,
            #071a2d
        );

    cursor:pointer;

    font-family:inherit;

    font-size:15px;

    font-weight:900;

    transition:.2s;
}


.chapter-nav-btn:hover:not(:disabled){

    border-color:
        var(--gold-light);

    transform:translateY(-2px);
}


.chapter-nav-btn:disabled{

    opacity:.35;

    cursor:not-allowed;
}


.previous-btn{

    justify-self:start;
}


.next-btn{

    justify-self:end;
}


.audio-btn{

    width:58px;
    height:58px;

    border-radius:50%;

    border:
        1px solid
        rgba(212,175,55,.60);

    color:#071a2d;

    background:
        var(--gold-light);

    cursor:pointer;

    font-size:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    justify-self:center;

    transition:.2s;
}


.audio-btn:hover{

    transform:scale(1.07);

    background:#ffe993;
}


/* =====================================================
   SEARCH PANEL
===================================================== */

.search-panel{

    display:none;

    max-width:950px;

    margin:0 auto 35px;

    padding:22px;

    border:
        1px solid
        rgba(212,175,55,.35);

    border-radius:20px;

    background:
        rgba(3,17,29,.96);

    box-shadow:
        0 15px 40px rgba(0,0,0,.45);
}


.search-panel.active{

    display:block;
}


.search-row{

    display:flex;

    gap:10px;
}


.search-input{

    flex:1;

    height:55px;

    padding:0 18px;

    color:#fff;

    background:#061727;

    border:
        1px solid
        rgba(212,175,55,.38);

    border-radius:13px;

    outline:none;

    font-family:inherit;

    font-size:17px;
}


.search-input:focus{

    border-color:
        var(--gold-light);
}


.search-submit{

    min-width:110px;

    border:
        1px solid
        rgba(212,175,55,.45);

    border-radius:13px;

    color:#071a2d;

    background:
        var(--gold-light);

    cursor:pointer;

    font-family:inherit;

    font-weight:900;
}


.search-results{

    margin-top:20px;
}


.search-result{

    padding:15px;

    margin-bottom:10px;

    border:
        1px solid
        rgba(212,175,55,.20);

    border-radius:14px;

    background:
        rgba(7,27,45,.85);

    cursor:pointer;
}


.search-result:hover{

    border-color:
        var(--gold-light);
}


.search-result-title{

    color:var(--gold-light);

    font-weight:900;

    margin-bottom:7px;
}


.search-result-text{

    color:#e7edf5;

    line-height:1.9;
}


/* =====================================================
   VERSE STUDY MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(6px);
}


.modal.active{

    display:flex;
}


.modal-box{

    width:
        min(1100px,100%);

    max-height:
        92vh;

    overflow-y:auto;

    border:
        1px solid
        rgba(212,175,55,.48);

    border-radius:24px;

    background:

        linear-gradient(
            145deg,
            #071d31,
            #020c17
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,.70);
}


.modal-header{

    position:sticky;

    top:0;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:18px 22px;

    background:
        rgba(5,22,38,.98);

    border-bottom:
        1px solid
        rgba(212,175,55,.28);
}


.modal-title{

    color:var(--gold-light);

    font-size:23px;

    font-weight:900;
}


.modal-close{

    width:43px;
    height:43px;

    border:
        1px solid
        rgba(212,175,55,.45);

    border-radius:50%;

    color:#fff;

    background:#102e49;

    cursor:pointer;

    font-size:21px;
}


.modal-content{

    padding:25px;
}


/* =====================================================
   SELECTED VERSE
===================================================== */

.study-verse{

    padding:20px;

    margin-bottom:25px;

    border-radius:17px;

    background:
        rgba(13,56,93,.50);

    border:
        1px solid
        rgba(212,175,55,.22);

    color:#fff;

    font-size:20px;

    line-height:2;
}


/* =====================================================
   FOUR STUDY OPTIONS ONLY
===================================================== */

.study-options{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px,1fr)
        );

    gap:15px;
}


.study-option{

    padding:20px;

    min-height:175px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(14,49,77,.96),
            rgba(4,20,34,.98)
        );

    cursor:pointer;

    transition:.25s;
}


.study-option:hover{

    transform:translateY(-4px);

    border-color:
        var(--gold-light);

    background:
        linear-gradient(
            145deg,
            rgba(20,82,126,.98),
            rgba(6,26,44,.99)
        );
}


.study-option-icon{

    font-size:35px;

    margin-bottom:8px;
}


.study-option h3{

    margin:0 0 9px;

    color:var(--gold-light);

    font-size:19px;
}


.study-option p{

    margin:0;

    color:#c9d5e2;

    line-height:1.8;

    font-size:15px;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    text-align:center;

    padding:35px;

    color:var(--muted);

    font-size:17px;
}


.error{

    color:#ffb2b2;

    border:
        1px solid
        rgba(217,107,107,.4);

    background:
        rgba(90,20,20,.20);

    border-radius:15px;

    padding:20px;

    text-align:center;

    line-height:1.9;
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    max-width:1450px;

    margin:auto;

    padding:25px;

    text-align:center;

    color:#8193a5;

    border-top:
        1px solid
        rgba(212,175,55,.18);

    font-size:14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .topbar{

        min-height:76px;

        padding:8px 12px;
    }


    .brand{

        gap:7px;
    }


    .brand-logo{

        width:50px;
        height:50px;
    }


    .brand-name{

        font-size:13px;
    }


    .back-btn{

        min-width:115px;

        height:45px;

        padding:0 10px;

        font-size:13px;
    }


    .page{

        padding:
            25px 12px 50px;
    }


    .main-actions{

        grid-template-columns:1fr;

        gap:12px;
    }


    .main-action{

        min-height:120px;
    }


    .books-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }


    .book-card{

        min-height:105px;

        padding:12px;
    }


    .book-name{

        font-size:16px;
    }


    .chapter-panel{

        padding:15px;
    }


    .chapter-header{

        flex-direction:column;

        align-items:stretch;
    }


    .verse{

        padding:
            15px 53px 15px 12px;
    }


    .verse-text{

        font-size:17px;

        line-height:1.9;
    }


    .chapter-navigation{

        grid-template-columns:
            1fr 65px 1fr;
    }


    .chapter-nav-btn{

        padding:0 8px;

        font-size:13px;
    }


    .audio-btn{

        width:52px;
        height:52px;
    }


    .search-row{

        flex-direction:column;
    }


    .search-submit{

        min-height:50px;
    }


    .modal{

        padding:8px;
    }


    .modal-box{

        max-height:96vh;

        border-radius:18px;
    }


    .modal-content{

        padding:16px;
    }


    .study-options{

        grid-template-columns:1fr;
    }

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

    display:none !important;
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="topbar">


<a
    href="index.html"
    class="back-btn"
>
    ⌂ الرئيسية
</a>


<div class="brand">

<div class="brand-name">
    موسوعة الكتاب المقدس
</div>


<img
    src="assets/logo.png"
    class="brand-logo"
    alt="كنيسة رجاء الأمم سيدني"
>

</div>


</div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


<section class="page-title">

<h1>
    📖 الكتاب المقدس
</h1>

<p>
    دراسة النص الكتابي واللغات الأصلية والخرائط والتفاسير
</p>

</section>


<!-- =====================================================
     ONLY TWO MAIN ICONS
===================================================== -->

<section class="main-actions">


<button
    type="button"
    id="bibleButton"
    class="main-action"
>

<div class="main-action-icon">
    📖
</div>

<div class="main-action-title">
    الكتاب المقدس
</div>

<div class="main-action-subtitle">
    العهد القديم والعهد الجديد
</div>

</button>


<button
    type="button"
    id="searchButton"
    class="main-action"
>

<div class="main-action-icon">
    🔎
</div>

<div class="main-action-title">
    بحث
</div>

<div class="main-action-subtitle">
    ابحث عن آية أو كلمة
</div>

</button>


</section>


<!-- =====================================================
     SEARCH
===================================================== -->

<section
    id="searchPanel"
    class="search-panel"
>

<div class="search-row">

<input
    id="searchInput"
    class="search-input"
    type="search"
    placeholder="ابحث عن آية أو كلمة في الكتاب المقدس..."
    autocomplete="off"
>

<button
    id="searchSubmit"
    class="search-submit"
    type="button"
>
    بحث
</button>

</div>


<div
    id="searchResults"
    class="search-results"
></div>

</section>


<!-- =====================================================
     BIBLE CONTAINER
===================================================== -->

<div id="bibleContainer">

<div class="status">
    جاري تحميل الكتاب المقدس...
</div>

</div>


<!-- =====================================================
     CHAPTER PANEL
===================================================== -->

<section
    id="chapterPanel"
    class="chapter-panel"
>

<div class="chapter-header">

<div
    id="chapterTitle"
    class="chapter-title"
>
    الإصحاحات
</div>

<button
    id="closeChapter"
    class="close-chapter"
    type="button"
>
    ← العودة
</button>

</div>


<div
    id="chaptersGrid"
    class="chapters-grid"
></div>


<div
    id="versesPanel"
    class="verses-panel"
>

function normalizeBookName(name){

    if(!name){
        return "";
    }

    const value =
        String(name).trim();

    return aliases[value] || value;
}


/* =====================================================
   GENERIC NUMBER
===================================================== */

function getNumber(value,fallback){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return String(fallback);

    }

    return String(value);
}


/* =====================================================
   NORMALIZE VERSE
===================================================== */

function normalizeVerse(verse,index){

    if(
        typeof verse === "string"
    ){

        return {

            number:String(index+1),

            text:verse

        };

    }


    if(
        !verse ||
        typeof verse !== "object"
    ){

        return null;

    }


    const number =

        verse.number ??
        verse.verseNumber ??
        verse.verse ??
        verse.id ??
        (index+1);


    const text =

        verse.text ??
        verse.Text ??
        verse.content ??
        verse.value ??
        verse.verseText ??
        verse.body ??
        "";


    return {

        number:String(number),

        text:String(text)

    };

}


/* =====================================================
   NORMALIZE CHAPTER
===================================================== */

function normalizeChapter(chapter,index){

    if(
        Array.isArray(chapter)
    ){

        return {

            number:String(index+1),

            verses:
                chapter
                .map(normalizeVerse)
                .filter(Boolean)

        };

    }


    if(
        typeof chapter === "string"
    ){

        return {

            number:String(index+1),

            verses:[

                {

                    number:"1",

                    text:chapter

                }

            ]

        };

    }


    if(
        !chapter ||
        typeof chapter !== "object"
    ){

        return null;

    }


    let verses =

        chapter.verses ??
        chapter.Verses ??
        chapter.data ??
        chapter.text ??
        [];


    if(
        verses &&
        !Array.isArray(verses) &&
        typeof verses === "object"
    ){

        verses =
            Object.keys(verses)
            .map((key,index)=>{

                const item =
                    verses[key];

                if(
                    typeof item === "string"
                ){

                    return {

                        number:String(key),

                        text:item

                    };

                }

                return {

                    number:String(
                        item?.number ??
                        item?.verse ??
                        key
                    ),

                    text:String(
                        item?.text ??
                        item?.content ??
                        item?.value ??
                        ""
                    )

                };

            });

    }


    const chapterNumber =

        chapter.number ??
        chapter.chapterNumber ??
        chapter.chapter ??
        chapter.id ??
        (index+1);


    return {

        number:String(chapterNumber),

        verses:
            Array.isArray(verses)
            ? verses
                .map(normalizeVerse)
                .filter(Boolean)
            : []

    };

}


/* =====================================================
   NORMALIZE BOOK
===================================================== */

function normalizeBook(book,index){

    if(
        !book ||
        typeof book !== "object"
    ){

        return null;

    }


    let name =

        book.name ??
        book.book ??
        book.title ??
        book.bookName ??
        "";


    name =
        normalizeBookName(name);


    if(!name){

        return null;

    }


    let chapters =

        book.chapters ??
        book.Chapters ??
        book.chapter ??
        book.data ??
        [];


    if(
        chapters &&
        !Array.isArray(chapters) &&
        typeof chapters === "object"
    ){

        chapters =
            Object.keys(chapters)
            .map(key=>{

                const item =
                    chapters[key];


                if(
                    Array.isArray(item)
                ){

                    return {

                        number:key,

                        verses:item

                    };

                }


                return {

                    number:key,

                    ...(
                        typeof item === "object"
                        ? item
                        : {
                            verses:[
                                {
                                    number:"1",
                                    text:String(item)
                                }
                            ]
                        }
                    )

                };

            });

    }


    if(!Array.isArray(chapters)){

        chapters=[];

    }


    const normalizedChapters =
        chapters
        .map(normalizeChapter)
        .filter(Boolean);


    return {

        name:name,

        index:index,

        chapters:
            normalizedChapters

    };

}


/* =====================================================
   NORMALIZE BIBLE
===================================================== */

function normalizeBible(data){

    const result=[];


    if(Array.isArray(data)){

        data.forEach((book,index)=>{

            const normalized =
                normalizeBook(
                    book,
                    index
                );

            if(normalized){

                result.push(normalized);

            }

        });

        return result;

    }


    if(
        data &&
        Array.isArray(data.books)
    ){

        data.books.forEach((book,index)=>{

            const normalized =
                normalizeBook(
                    book,
                    index
                );

            if(normalized){

                result.push(normalized);

            }

        });

        return result;

    }


    if(
        data &&
        typeof data === "object"
    ){

        Object.keys(data).forEach(
            (key,index)=>{

                const value =
                    data[key];


                if(
                    value &&
                    typeof value === "object"
                ){

                    const normalized =
                        normalizeBook(
                            {
                                name:key,
                                chapters:
                                    value.chapters ??
                                    value
                            },
                            index
                        );


                    if(normalized){

                        result.push(normalized);

                    }

                }

            }
        );

    }


    return result;

}


/* =====================================================
   LOAD BIBLE
===================================================== */

async function loadBible(){

    const container =
        document.getElementById(
            "bibleContainer"
        );


    try{

        const response =
            await fetch(
                "bible.json",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "تعذر تحميل bible.json"
            );

        }


        const data =
            await response.json();


        bibleData =
            normalizeBible(data);


        if(
            !bibleData.length
        ){

            throw new Error(
                "لم يتم العثور على أسفار داخل bible.json"
            );

        }


        sortCanonical();


        container.innerHTML="";


        renderTestamentSelector();

    }
    catch(error){

        container.innerHTML=

            `
            <div class="error">

                تعذر تحميل بيانات الكتاب المقدس.

                <br><br>

                تأكد أن الملف
                <strong>bible.json</strong>
                موجود بجانب
                <strong>bible.html</strong>.

                <br><br>

                الخطأ:
                ${escapeHtml(error.message)}

            </div>
            `;

    }

}


/* =====================================================
   CANONICAL SORT
===================================================== */

function sortCanonical(){

    const order=[

        ...oldTestament,
        ...newTestament

    ];


    bibleData.sort((a,b)=>{

        const ai =
            order.indexOf(a.name);

        const bi =
            order.indexOf(b.name);


        if(ai===-1 && bi===-1){

            return a.index-b.index;

        }


        if(ai===-1){

            return 1;

        }


        if(bi===-1){

            return -1;

        }


        return ai-bi;

    });

}

        );


    card.type="button";

    card.className=
        "book-card";


    card.innerHTML=

        `
        <div class="book-icon">

/* =====================================================
   RENDER BOOKS
===================================================== */

function renderBooks(names){

    const container =
        document.getElementById(
            "bibleContainer"
        );


    container.innerHTML="";


    const section =
        document.createElement(
            "section"
        );

    section.className=
        "testament";


    const heading =
        document.createElement(
            "h2"
        );

    heading.className=
        "testament-title";

    heading.textContent=
        names === oldTestament
        ? "📜 العهد القديم"
        : "✝️ العهد الجديد";


    section.appendChild(
        heading
    );


    const grid =
        document.createElement(
            "div"
        );

    grid.className=
        "books-grid";


    names.forEach(name=>{

        const book =
            bibleData.find(
                item =>
                    item.name === name
            );


        if(!book){

            return;

        }


        const card =
            document.createElement(
                "button"
            );


        card.type="button";

        card.className=
            "book-card";


        card.innerHTML=

            `
            <div class="book-icon">
                ${bookIcons[name] || "📖"}
            </div>

            <div class="book-name">
                ${escapeHtml(name)}
            </div>

            <div class="book-meta">
                ${book.chapters.length}
                إصحاح
            </div>
            `;


        card.addEventListener(
            "click",
            ()=>{
                openBook(book);
            }
        );


        grid.appendChild(
            card
        );

    });


    section.appendChild(
        grid
    );


    container.appendChild(
        section
    );


    container.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

    );

                );


            button.type="button";

            button.className=
                "chapter-btn";

            button.addEventListener(
                "click",
                ()=>{
                    openChapter(
                        chapter
                    );
                }
            );


            grid.appendChild(
                button
            );

        }
    );


    panel.classList.add(
        "active"
    );


    panel.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(chapter){

    currentChapter=chapter;


    const versesPanel =
        document.getElementById(
            "versesPanel"
        );


    const header =
        document.getElementById(
            "versesHeader"
        );


    const container =
        document.getElementById(
            "versesContainer"
        );


    header.textContent =
        `📖 ${currentBook.name} — الإصحاح ${chapter.number}`;


    container.innerHTML="";


    if(
        !chapter.verses ||
        !chapter.verses.length
    ){

        container.innerHTML=

            `
            <div class="error">
                لا توجد آيات مسجلة لهذا الإصحاح في قاعدة البيانات.
            </div>
            `;

    }
    else{

        chapter.verses.forEach(
            verse=>{

                const article =
                    document.createElement(
                        "article"
                    );


                article.className=
                    "verse";


                const number =
                    document.createElement(
                        "div"
                    );

                number.className=
                    "verse-number";


                number.textContent =
                    verse.number;


                const text =
                    document.createElement(
                        "div"
                    );

                text.className=
                    "verse-text";


                text.textContent =
                    verse.text;


                article.appendChild(
                    number
                );


                article.appendChild(
                    text
                );


                article.addEventListener(
                    "click",
                    ()=>{
                        openVerseStudy(
                            currentBook,
                            currentChapter,
                            verse
                        );
                    }
                );


                container.appendChild(
                    article
                );

            }
        );

    }


    updateChapterNavigation();


    versesPanel.classList.add(
        "active"
    );


    versesPanel.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =====================================================
   CHAPTER NAVIGATION
===================================================== */

function updateChapterNavigation(){

    if(
        !currentBook ||
        !currentChapter
    ){

        return;

    }


    const index =
        currentBook.chapters.findIndex(
            chapter =>
                chapter.number ===
                currentChapter.number
        );


    const previous =
        document.getElementById(
            "previousChapter"
        );


    const next =
        document.getElementById(
            "nextChapter"
        );


    previous.disabled =
        index <= 0;


    next.disabled =
        index >=
        currentBook.chapters.length-1;

}


/* =====================================================
   PREVIOUS CHAPTER
===================================================== */

document
.getElementById("previousChapter")
.addEventListener(
    "click",
    ()=>{

        if(
            !currentBook ||
            !currentChapter
        ){

            return;

        }


        const index =
            currentBook.chapters.findIndex(
                chapter =>
                    chapter.number ===
                    currentChapter.number
            );


        if(index>0){

            openChapter(
                currentBook.chapters[
                    index-1
                ]
            );

        }

    }
);


/* =====================================================
   NEXT CHAPTER
===================================================== */

document
.getElementById("nextChapter")
.addEventListener(
    "click",
    ()=>{

        if(
            !currentBook ||
            !currentChapter
        ){

            return;

        }


        const index =
            currentBook.chapters.findIndex(
                chapter =>
                    chapter.number ===
                    currentChapter.number
            );


        if(
            index <
            currentBook.chapters.length-1
        ){

            openChapter(
                currentBook.chapters[
                    index+1
                ]
            );

        }

    }
);


/* =====================================================
   AUDIO
===================================================== */

document
.getElementById("audioButton")
.addEventListener(
    "click",
    ()=>{

        if(
            !currentChapter ||
            !currentChapter.verses
        ){

            return;

        }


        const text =
            currentChapter.verses
            .map(
                verse =>
                    verse.text
            )
            .join(" ");


        if(
            !("speechSynthesis" in window)
        ){

            alert(
                "تشغيل الصوت غير مدعوم في هذا المتصفح."
            );

            return;

        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang="ar-SA";

        utterance.rate=.85;

        utterance.pitch=1;


        window.speechSynthesis.speak(
            utterance
        );

    }
);


/* =====================================================
   VERSE STUDY
===================================================== */

function openVerseStudy(
    book,
    chapter,
    verse
){

    currentBook=book;

    currentChapter=chapter;

    currentVerse=verse;


    const modal =
        document.getElementById(
            "verseModal"
        );


    const title =
        document.getElementById(
            "modalTitle"
        );


    const verseBox =
        document.getElementById(
            "studyVerse"
        );


    title.textContent =
        `${book.name} ${chapter.number}:${verse.number}`;


    verseBox.innerHTML=

        `
        <strong>
            ${escapeHtml(book.name)}
            ${escapeHtml(chapter.number)}:${escapeHtml(verse.number)}
        </strong>

        <br><br>

        ${escapeHtml(verse.text)}
        `;


    modal.classList.add(
        "active"
    );


    document.body.style.overflow=
        "hidden";

}

/* =====================================================
   OVERVIEW
===================================================== */

function openOverview(){

    if(
        !currentBook ||
        !currentChapter ||
        !currentVerse
    ){

        return;

    }


    /*
       لا نغيّر هيكل الكتاب المقدس.
       يتم تمرير مرجع الآية إلى overview
       في المرحلة القادمة.
    */

    const reference =
        encodeURIComponent(
            `${currentBook.name} ${currentChapter.number}:${currentVerse.number}`
        );


    const url =
        `overview.html?ref=${reference}`;


    window.location.href =
        url;

}

/* =====================================================
   SEARCH
===================================================== */

function performSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );


    const results =
        document.getElementById(
            "searchResults"
        );


    const query =
        input.value
        .trim()
        .toLowerCase();


    results.innerHTML="";


    if(!query){

        results.innerHTML=

            `
            <div class="status">
                اكتب كلمة أو آية للبحث.
            </div>
            `;

        return;

    }


    let matches=[];


    for(
        const book of bibleData
    ){

        for(
            const chapter of book.chapters
        ){

            for(
                const verse of chapter.verses
            ){

                if(
                    verse.text
                    .toLowerCase()
                    .includes(query)
                ){

                    matches.push({

                        book,
                        chapter,
                        verse

                    });


                    if(
                        matches.length >= 100
                    ){

                        break;

                    }

                }

            }


            if(
                matches.length >= 100
            ){

                break;

            }

        }


        if(
            matches.length >= 100
        ){

            break;

        }

    }


    if(!matches.length){

        results.innerHTML=

            `
            <div class="status">
                لم يتم العثور على نتائج.
            </div>
            `;

        return;

    }


    const heading =
        document.createElement(
            "div"
        );


    heading.className=
        "status";


    heading.textContent=
        `تم العثور على ${matches.length} نتيجة`;


    results.appendChild(
        heading
    );


    matches.forEach(
        item=>{

            const result =
                document.createElement(
                    "div"
                );


            result.className=
                "search-result";


            result.innerHTML=

                `
                <div class="search-result-title">
                    ${escapeHtml(item.book.name)}
                    ${escapeHtml(item.chapter.number)}:${escapeHtml(item.verse.number)}
                </div>

                <div class="search-result-text">
                    ${escapeHtml(item.verse.text)}
                </div>
                `;


            result.addEventListener(
                "click",
                ()=>{

                    openBook(
                        item.book
                    );

                    openChapter(
                        item.chapter
                    );

                    openVerseStudy(
                        item.book,
                        item.chapter,
                        item.verse
                    );

                }
            );


            results.appendChild(
                result
            );

        }
    );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
