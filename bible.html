   *     chapter:1,
   *     verse:1,
   *     text:"..."
   *   }
   * ]
   */

  if(Array.isArray(data)){

    rows = data;

  }

  /*
   * دعم بعض البنى المحتملة دون تغيير bible.json
   */

  else if(data && Array.isArray(data.verses)){

    rows = data.verses;

  }

  else if(data && Array.isArray(data.data)){

    rows = data.data;

  }

  return rows

    .map(v => ({

      book:String(v.book ?? v.bookId ?? "").trim(),

      chapter:Number(v.chapter ?? v.chapterNumber),

      verse:Number(
        v.verse ??
        v.number ??
        v.verseNumber
      ),

      text:String(
        v.text ??
        v.content ??
        v.verseText ??
        ""
      ).trim()

    }))

    .filter(v =>

      v.book &&
      Number.isFinite(v.chapter) &&
      Number.isFinite(v.verse) &&
      v.text

    );

}


/* =========================================================
   تحميل bible.json
========================================================= */

async function loadBible(){

  try{

    $("status").textContent =
      "جاري تحميل نص الكتاب المقدس...";

    const response = await fetch(
      BIBLE_URL,
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        `bible.json HTTP ${response.status}`
      );

    }

    const data = await response.json();

    verses = normaliseRows(data);

    if(!verses.length){

      throw new Error(
        "bible.json contains no readable verses"
      );

    }

    $("status").textContent =
      `تم تحميل ${verses.length.toLocaleString("ar-EG")} آية.`;

    showTestaments();

  }

  catch(error){

    console.error(error);

    $("status").innerHTML = `
      <div class="error">
        تعذر تحميل بيانات الكتاب المقدس.
        <br>
        تأكد من وجود الملف
        <b>bible.json</b>
        في نفس مجلد
        <b>bible.html</b>.
      </div>
    `;

  }

}

/* =========================================================

========================================================= */

function showChapters(bookId){

  currentBook = bookId;

  currentChapter = null;

  setToolbar("bible");

  const chapters = [

    ...new Set(

      verses

        .filter(v => v.book === bookId)

        .map(v => v.chapter)

  if(!chapters.length){

  $("status").textContent = "";

/* =========================================================
   عرض الأصحاح بالكامل
========================================================= */

function showChapter(bookId,chapter){

  currentBook = bookId;

  currentChapter = Number(chapter);

  setToolbar("bible");

  const rows = verses

    .filter(v =>
      v.book === bookId &&
      v.chapter === currentChapter
    )

    .sort((a,b) => a.verse - b.verse);


  if(!rows.length){

    $("status").innerHTML = `
      <div class="error">
        لا توجد آيات لهذا الأصحاح.
      </div>
    `;

    $("content").innerHTML = "";

    return;

  }


  $("status").textContent = "";


  /*
   * أثناء قراءة الأصحاح لا نعرض
   * أي قائمة أسفار أو أصحاحات.
   */

  $("content").innerHTML = `

    <div class="reading-panel">

      <div class="chapter-header">

        <div class="chapter-book">
          ${esc(BOOK_NAMES[bookId])}
        </div>

        <h2 class="chapter-title">
          الأصحاح ${currentChapter}
        </h2>

      </div>


      <div class="chapter-text">

        ${rows.map(v => `

          <div
            class="verse"
            role="button"
            tabindex="0"
            onclick="openVerse(
              '${v.book}',
              ${v.chapter},
              ${v.verse}
            )"
            onkeydown="
              if(event.key==='Enter' || event.key===' '){
                event.preventDefault();
                openVerse(
                  '${v.book}',
                  ${v.chapter},
                  ${v.verse}
                );
              }
            "
          >

            <span class="vnum">
              ${v.verse}
            </span>

            ${esc(v.text)}

          </div>

        `).join("")}

      </div>


      <div class="chapter-navigation">

        <button
          id="previousChapterButton"
          class="nav-button nav-prev"
          type="button"
          onclick="goPreviousChapter()"
        >
          ← السابق
        </button>


        <button
          class="nav-button audio-button"
          type="button"
          onclick="playChapter()"
          aria-label="تشغيل الأصحاح"
          title="السماعة"
        >
          🔊
        </button>


        <button
          id="nextChapterButton"
          class="nav-button nav-next"
          type="button"
          onclick="goNextChapter()"
        >
          التالي →
        </button>

      </div>

    </div>

  `;


  updateChapterNavigation();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   الحصول على أصحاحات السفر الحالي
========================================================= */

function getCurrentChapters(){

  if(!currentBook){

    return [];

  }

  return [

    ...new Set(

      verses

        .filter(v => v.book === currentBook)

        .map(v => v.chapter)

    )

  ].sort((a,b) => a-b);

}


/* =========================================================
   السابق / التالي
========================================================= */

function updateChapterNavigation(){

  const chapters = getCurrentChapters();

  const index =
    chapters.indexOf(currentChapter);

  const previous =
    $("previousChapterButton");

  const next =
    $("nextChapterButton");


  if(!previous || !next){

    return;

  }


  previous.disabled =
    index <= 0;


  next.disabled =
    index === -1 ||
    index >= chapters.length - 1;

}


function goPreviousChapter(){

  const chapters = getCurrentChapters();

  const index =
    chapters.indexOf(currentChapter);


  if(index > 0){

    showChapter(
      currentBook,
      chapters[index - 1]
    );

  }

}


function goNextChapter(){

  const chapters = getCurrentChapters();

  const index =
    chapters.indexOf(currentChapter);


  if(
    index >= 0 &&
    index < chapters.length - 1
  ){

    showChapter(
      currentBook,
      chapters[index + 1]
    );

  }

}


/* =========================================================
   السماعة
   جاهزة لربط الصوت لاحقًا
========================================================= */

function playChapter(){

  /*
   * لا يوجد مسار صوت داخل المواصفة الحالية.
   * الزر محفوظ وظيفيًا لربط الصوت لاحقًا
   * دون تغيير بنية صفحة الكتاب المقدس.
   */

  alert(
    "سيتم ربط صوت الأصحاح بهذه الأيقونة لاحقًا."
  );

}


/* =========================================================
   نافذة الآية
========================================================= */

function openVerse(book,chapter,verse){

  const found = verses.find(v =>

    v.book === book &&
    v.chapter === Number(chapter) &&
    v.verse === Number(verse)

  );


  if(!found){

    return;

  }


  currentVerse = found;


  $("modalTitle").textContent =
    `${BOOK_NAMES[book]} ${chapter}:${verse}`;


  $("modalVerse").innerHTML = `

    <span class="vnum">
      ${verse}
    </span>

    ${esc(found.text)}

  `;


  $("modalBackdrop").classList.add("open");

  document.body.style.overflow = "hidden";

}


/* =========================================================
   إغلاق نافذة الآية
========================================================= */

function closeVerse(){

  $("modalBackdrop").classList.remove("open");

  document.body.style.overflow = "";

}


/* =========================================================
   وظائف نافذة الآية الأربعة
========================================================= */

function openVerseFeature(feature){

  if(!currentVerse){

    return;

  }


  /*
   * هذه الوظائف هي نقاط الربط المستقبلية.
   * لا يتم إضافة أي خيارات أخرى إلى نافذة الآية.
   */

  if(feature === "similar"){

    alert(
      "الآيات المشابهة — سيتم ربطها بمنظومة الآيات المشابهة لاحقًا."
    );

    return;

  }


  if(feature === "language"){

    alert(
      "أصل اللغة — سيتم ربطه ببيانات العبرية والآرامية واليونانية لاحقًا."
    );

    return;

  }


  if(feature === "places"){

    alert(
      "الأماكن والأنهار — سيتم ربطها بقاعدة الأماكن والأنهار والخرائط لاحقًا."
    );

    return;

  }


  if(feature === "commentary"){

    alert(
      "التفسير — سيتم ربطه بمنظومة التفسير المستقلة لكل آية لاحقًا."
    );

    return;

  }

}


/* =========================================================
   البحث
========================================================= */

function showSearch(){

  setToolbar("search");

  currentTestament = null;

  currentBook = null;

  currentChapter = null;


  $("status").textContent = "";


  $("content").innerHTML = `

    <h2 class="level-heading">
      البحث
    </h2>

    <div class="level-subtitle">
      البحث في نص الكتاب المقدس
    </div>


    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="اكتب كلمة أو عبارة..."
        autocomplete="off"
      >

      <button
        class="search-submit"
        type="button"
        onclick="performSearch()"
      >
        بحث
      </button>

    </div>


    <div id="searchResults"></div>

  `;


  const input = $("searchInput");

  input.focus();


  input.addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){

        performSearch();

      }

    }
  );

}


function performSearch(){

  const input = $("searchInput");

  if(!input){

    return;

  }


  const query =
    input.value.trim().toLocaleLowerCase("ar");


  const results =
    $("searchResults");


  if(!query){

    results.innerHTML = `
      <div class="status">
        اكتب كلمة أو عبارة للبحث.
      </div>
    `;

    return;

  }


  const hits = verses.filter(v =>

    v.text
      .toLocaleLowerCase("ar")
      .includes(query)

  );


  if(!hits.length){

    results.innerHTML = `
      <div class="status">
        لا توجد نتائج للبحث.
      </div>
    `;

    return;

  }


  results.innerHTML = `

    <div class="status">
      عدد النتائج:
      ${hits.length.toLocaleString("ar-EG")}
    </div>


    <div class="search-results">

      ${hits.slice(0,300).map(v => `

        <div
          class="search-result"
          onclick="openSearchResult(
            '${v.book}',
            ${v.chapter},
            ${v.verse}
          )"
        >

          <span class="search-result-ref">
            ${esc(BOOK_NAMES[v.book])}
            ${v.chapter}:${v.verse}
          </span>

          ${esc(v.text)}

        </div>

      `).join("")}

    </div>

  `;

}


function openSearchResult(book,chapter,verse){

  showChapter(book,chapter);

  setTimeout(() => {

    openVerse(book,chapter,verse);

  },80);

}


/* =========================================================
   إغلاق النافذة بالنقر خارجها
========================================================= */

$("modalBackdrop").addEventListener(
  "click",
  event => {

    if(event.target === $("modalBackdrop")){

      closeVerse();

    }

  }
);


/* =========================================================
   إغلاق النافذة بمفتاح ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      $("modalBackdrop").classList.contains("open")
    ){

      closeVerse();

    }

  }
);


/* =========================================================
   بدء تشغيل الصفحة
========================================================= */

loadBible();

</script>
