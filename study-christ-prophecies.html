<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المسيح في نبوات الكتاب | موسوعة الكتاب المقدس</title>
<link rel="stylesheet" href="assets/project-header-runtime.css">
<style>
:root{--ink:#061522;--panel:#0d2d4a;--gold:#d4af37;--gold-light:#f4dc78;--white:#f7f9fc;--muted:#aebdca}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--white);font-family:"Noto Naskh Arabic","Amiri",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(23,75,120,.75),transparent 45%),linear-gradient(145deg,#04111f,#071c31 55%,#020a13);}
.top-frame{position:sticky;top:0;z-index:2;background:rgba(3,15,27,.97);border-bottom:1px solid rgba(212,175,55,.42);box-shadow:0 8px 30px rgba(0,0,0,.55)}
.topbar{max-width:1400px;min-height:86px;margin:auto;padding:10px 25px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}.brand-logo{width:62px;height:62px;object-fit:contain}.brand-name{font-weight:900;font-size:22px}.back-button{color:var(--white);text-decoration:none;border:1px solid rgba(212,175,55,.6);border-radius:12px;padding:12px 18px;font-weight:800;background:linear-gradient(145deg,#183c5d,#071a2d)}
main{max-width:1100px;margin:0 auto;padding:42px 20px 70px}.study-panel{padding:30px;border:1px solid rgba(212,175,55,.38);border-radius:20px;background:linear-gradient(145deg,rgba(13,56,93,.96),rgba(4,23,39,.99));box-shadow:0 15px 35px rgba(0,0,0,.4)}h1{margin:0;color:var(--gold-light);font-size:clamp(28px,4vw,42px)}.subtitle{margin:8px 0 24px;color:var(--muted);font-size:15px}pre{margin:0;white-space:pre-wrap;word-break:normal;text-align:right;direction:rtl;color:var(--white);font:inherit;font-size:17px;line-height:2.05}
@media(max-width:600px){.topbar{padding:8px 12px}.brand-name{font-size:17px}.brand-logo{width:48px;height:48px}.back-button{padding:9px 11px;font-size:14px}main{padding:24px 12px 45px}.study-panel{padding:18px}pre{font-size:15px}}
</style>
</head>
<body>
<header class="top-frame"><div class="topbar"><a class="back-button" href="studies.html">الدراسات الكتابية</a><div class="brand"><div class="brand-name">موسوعة الكتاب المقدس</div><img src="assets/logo.png" class="brand-logo" alt="كنيسة رجاء الأمم سيدني"></div></div></header>
<main><article class="study-panel"><h1>المسيح في النبوات</h1><p class="subtitle">دراسة لاهوتية موسوعية في شخصية المسيا في العهد القديم، وتحقيقها في العهد الجديد، وفكر اليهود عن المسيا</p><pre id="studyText">جارٍ تحميل الدراسة الكاملة...</pre></article></main>
<script>
fetch('messiah-prophecies-study.txt').then(function(response){if(!response.ok)throw new Error('load failed');return response.text()}).then(function(text){document.getElementById('studyText').textContent=text.replace(/\r/g,'').replace(/\n\s*\n+/g,'\n')}).catch(function(){document.getElementById('studyText').textContent='تعذر تحميل ملف الدراسة المحلي.'});
</script>
<script src="assets/project-header-runtime.js?v=20260829-6"></script>
</body>
</html>
