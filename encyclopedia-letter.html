<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الموسوعة الكتابية | دائرة المعارف</title>

<style>
:root{
    --bg:#061321;
    --bg2:#0a1b2d;
    --panel:#0d2138;
    --gold:#d6b15e;
    --gold2:#f0d58a;
    --text:#f5f7fa;
    --muted:#aebdcd;
    --border:rgba(214,177,94,.28);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top right,rgba(25,69,108,.35),transparent 35%),
        linear-gradient(145deg,var(--bg),var(--bg2));
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(6,19,33,.97);
    border-bottom:1px solid var(--border);
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:46px;
    height:46px;
    object-fit:contain;
}

.brand-title{
    color:var(--gold2);
    font-size:18px;
    font-weight:bold;
}

.back{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:11px 17px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#102b47;
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.back:hover{
    color:var(--gold2);
    border-color:var(--gold);
}

main{
    width:100%;
    padding:25px 14px 35px;
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title .icon{
    width:64px;
    height:64px;
    margin:0 auto 10px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#102b47;
    border:1px solid var(--border);
    font-size:32px;
}

.title h1{
    color:var(--gold2);
    font-size:27px;
    margin-bottom:8px;
}

.title p{
    color:var(--muted);
    font-size:14px;
}

.viewer{
    width:100%;
    max-width:1400px;
    height:calc(100vh - 185px);
    min-height:650px;
    margin:0 auto;
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.viewer iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fff;
}

.notice{
    max-width:1400px;
    margin:15px auto 0;
    text-align:center;
    color:#8194a8;
    font-size:12px;
    line-height:1.8;
}

@media(max-width:600px){

    header{
        height:70px;
        padding:0 12px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .brand-title{
        font-size:14px;
    }

    .back{
        padding:9px 11px;
        font-size:12px;
    }

    main{
        padding:18px 7px 25px;
    }

    .title h1{
        font-size:23px;
    }

    .viewer{
        height:calc(100vh - 160px);
        min-height:550px;
        border-radius:9px;
    }
}
</style>
</head>

<body>

<header>

    <a class="back" href="encyclopedia.html">
        ↩ الموسوعة الكتابية
    </a>

    <div class="brand">

        <img
            src="logo.png"
            class="logo"
            alt="شعار الكنيسة"
            onerror="this.style.display='none'"
        >

        <div class="brand-title">
            موسوعة الكتاب المقدس
        </div>

    </div>

</header>

<main>

    <section class="title">

        <div class="icon">📚</div>

        <h1 id="pageTitle">الموسوعة الكتابية</h1>

        <p id="pageSubtitle">
            دائرة المعارف الكتابية — حرف الألف
        </p>

    </section>

    <section class="viewer">

        <iframe
            id="encyclopediaViewer"
            title="دائرة المعارف الكتابية"
            loading="eager"
            allow="fullscreen">
        </iframe>

    </section>

    <div class="notice">
        المحتوى المعروض هو المادة الأصلية الكاملة لدائرة المعارف الكتابية.
    </div>

</main>

<script>

const params = new URLSearchParams(window.location.search);
const letter = params.get("letter") || "ا";

/*
    ملفات دائرة المعارف.
    يتم إضافة بقية المجلدات هنا عند توفر ملفاتها.
*/

const encyclopediaFiles = {

    "ا": "دائرة المعارف أ.pdf",

    /*
    "ب": "دائرة المعارف ب.pdf",
    "ت": "دائرة المعارف ت.pdf",
    "ث": "دائرة المعارف ث.pdf",
    "ج": "دائرة المعارف ج.pdf",
    "ح": "دائرة المعارف ح.pdf",
    "خ": "دائرة المعارف خ.pdf",
    "د": "دائرة المعارف د.pdf",
    "ذ": "دائرة المعارف ذ.pdf",
    "ر": "دائرة المعارف ر.pdf",
    "ز": "دائرة المعارف ز.pdf",
    "س": "دائرة المعارف س.pdf",
    "ش": "دائرة المعارف ش.pdf",
    "ص": "دائرة المعارف ص.pdf",
    "ض": "دائرة المعارف ض.pdf",
    "ط": "دائرة المعارف ط.pdf",
    "ظ": "دائرة المعارف ظ.pdf",
    "ع": "دائرة المعارف ع.pdf",
    "غ": "دائرة المعارف غ.pdf",
    "ف": "دائرة المعارف ف.pdf",
    "ق": "دائرة المعارف ق.pdf",
    "ك": "دائرة المعارف ك.pdf",
    "ل": "دائرة المعارف ل.pdf",
    "م": "دائرة المعارف م.pdf",
    "ن": "دائرة المعارف ن.pdf",
    "هـ": "دائرة المعارف هـ.pdf",
    "و": "دائرة المعارف و.pdf",
    "ي": "دائرة المعارف ي.pdf"
    */

};

const viewer = document.getElementById("encyclopediaViewer");
const title = document.getElementById("pageTitle");
const subtitle = document.getElementById("pageSubtitle");

const file = encyclopediaFiles[letter];

const arabicLetters = {
    "ا":"الألف",
    "ب":"الباء",
    "ت":"التاء",
    "ث":"الثاء",
    "ج":"الجيم",
    "ح":"الحاء",
    "خ":"الخاء",
    "د":"الدال",
    "ذ":"الذال",
    "ر":"الراء",
    "ز":"الزاي",
    "س":"السين",
    "ش":"الشين",
    "ص":"الصاد",
    "ض":"الضاد",
    "ط":"الطاء",
    "ظ":"الظاء",
    "ع":"العين",
    "غ":"الغين",
    "ف":"الفاء",
    "ق":"القاف",
    "ك":"الكاف",
    "ل":"اللام",
    "م":"الميم",
    "ن":"النون",
    "هـ":"الهاء",
    "و":"الواو",
    "ي":"الياء"
};

if(file){

    viewer.src = encodeURI(file);

    const letterName =
        arabicLetters[letter] || letter;

    title.textContent =
        "الموسوعة الكتابية — " + letterName;

    subtitle.textContent =
        "دائرة المعارف الكتابية — حرف " + letterName;

    document.title =
        "الموسوعة الكتابية | حرف " + letterName;

}else{

    viewer.remove();

    title.textContent =
        "الموسوعة الكتابية";

    subtitle.textContent =
        "محتوى هذا الحرف لم تتم إضافته بعد.";

}

</script>

</body>
</html>
