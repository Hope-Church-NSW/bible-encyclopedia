<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكتاب المقدس | كنيسة رجاء الأمم سيدني</title>

<style>
:root{
  --bg:#061321;
  --bg2:#0b1d31;
  --card:#0d2138;
  --card2:#102a46;
  --gold:#d4af37;
  --gold2:#f2d675;
  --text:#f4f7fb;
  --muted:#9fb0c3;
  --line:#1d3b59;
}
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(145deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:12px 5%;
  background:rgba(8,23,39,.97);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:82px;
  height:82px;
  object-fit:contain;
  filter:drop-shadow(0 4px 12px rgba(212,175,55,.25));
}

.brand-title{
  font-size:28px;
  font-weight:900;
  color:var(--gold2);
  text-shadow:0 2px 8px rgba(212,175,55,.38);
}

.home-link{
  color:var(--gold2);
  text-decoration:none;
  font-size:20px;
  font-weight:900;
  text-shadow:0 2px 7px rgba(212,175,55,.35);
}

main{
  max-width:1200px;
  margin:auto;
  padding:28px 5% 50px;
}

h1{
  margin:0 0 22px;
  text-align:center;
  font-size:32px;
  color:var(--gold2);
  text-shadow:0 3px 10px rgba(212,175,55,.3);
}

/* الأيقونات الثلاثة */
.top-nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:24px;
}

.nav-card{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,#102a46,#0b1c30);
  color:var(--text);
  padding:20px 12px;
  cursor:pointer;
  transition:.25s;
  text-align:center;
}

.nav-card:hover,
.nav-card.active{
  border-color:var(--gold);
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.nav-icon{
  font-size:32px;
  margin-bottom:7px;
}

.nav-title{
  color:var(--gold2);
  font-weight:900;
  font-size:18px;
}

/* الصفحة الداخلية */
.panel{
  background:rgba(13,33,56,.96);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  min-height:320px;
}

.section-title{
  text-align:center;
  color:var(--gold2);
  font-size:25px;
  margin:0 0 20px;
}

/* قائمة الأسفار */
.book-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.book-card{
  border:1px solid var(--line);
  border-radius:13px;
  background:#102a46;
  color:var(--text);
  padding:15px 10px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.book-card:hover{
  border-color:var(--gold);
  background:#153657;
  transform:translateY(-2px);
}

/* الأصحاحات */
.chapter-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
}

.chapter-btn{
  border:1px solid var(--line);
  border-radius:12px;
  background:#102a46;
  color:var(--gold2);
  padding:13px 7px;
  font-weight:900;
  cursor:pointer;
}

.chapter-btn:hover{
  background:#153657;
  border-color:var(--gold);
}

/* الآيات */
.verse{
  padding:16px 7px;
  border-bottom:1px solid #17344f;
  font-size:19px;
  line-height:2.15;
  cursor:pointer;
}

.verse:hover{
  background:#102a46;
}

.vnum{
  color:var(--gold2);
  font-weight:900;
  margin-left:9px;
}

.back-btn{
  display:block;
  margin:0 0 18px;
  border:1px solid var(--line);
  background:#153657;
  color:var(--gold2);
  border-radius:10px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:800;
}

/* البحث */
.search-box{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search-box input{
  flex:1;
  border:1px solid var(--line);
  border-radius:12px;
  background:#091a2d;
  color:white;
  padding:14px;
  font-size:17px;
  outline:none;
}

.search-box button{
  border:1px solid var(--gold);
  border-radius:12px;
  background:#153657;
  color:var(--gold2);
  padding:0 22px;
  cursor:pointer;
  font-weight:900;
}

.search-result{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin:10px 0;
  background:#0b1c30;
  cursor:pointer;
  line-height:1.9;
}

.search-result strong{
  color:var(--gold2);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

@media(max-width:900px){
  .book-grid{grid-template-columns:repeat(3,1fr)}
  .chapter-grid{grid-template-columns:repeat(6,1fr)}
}

@media(max-width:650px){
  .header-inner{align-items:center}
  .brand-title{font-size:20px}
  .logo{width:62px;height:62px}
  .home-link{font-size:16px}
  .top-nav{grid-template-columns:repeat(3,1fr);gap:7px}
  .nav-card{padding:13px 5px}
  .nav-icon{font-size:25px}
  .nav-title{font-size:13px}
  .book-grid{grid-template-columns:repeat(2,1fr)}
  .chapter-grid{grid-template-columns:repeat(5,1fr)}
  .verse{font-size:17px}
  .search-box{flex-direction:column}
  .search-box button{padding:12px}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="home-link" href="index.html">الرئيسية</a>

    <div class="brand">
      <div class="brand-title">كنيسة رجاء الأمم سيدني</div>
      <img class="logo" src="assets/logo.png" alt="شعار كنيسة رجاء الأمم سيدني">
    </div>

  </div>
</header>

<main>

  <h1>الكتاب المقدس</h1>

  <!-- الأيقونات الثلاثة وتظل ثابتة في أعلى الصفحة -->
  <div class="top-nav">

    <button class="nav-card active" id="oldTab" onclick="showTestament('old')">
      <div class="nav-icon">📜</div>
      <div class="nav-title">العهد القديم</div>
    </button>

    <button class="nav-card" id="newTab" onclick="showTestament('new')">
      <div class="nav-icon">✝️</div>
      <div class="nav-title">العهد الجديد</div>
    </button>

    <button class="nav-card" id="searchTab" onclick="showSearch()">
      <div class="nav-icon">🔎</div>
      <div class="nav-title">البحث</div>
    </button>

  </div>

  <section class="panel" id="content"></section>

</main>

<footer>Hope Church NSW — Bible Study</footer>

<script>
/*
  مصدر الكتاب الأساسي:
  bible_database.json
  وهو يحتوي بيانات الأسفار الموجودة في قاعدة المشروع.

  المصدر الإضافي:
  2pet.json
  لإضافة بطرس الثانية التي كانت غير موجودة في قاعدة البيانات الأساسية.
*/

const MAIN_BIBLE="bible_database.json";
const SECOND_PETER="2pet.json";

let verses=[];
let currentTestament="old";
let currentBook="";
let currentChapter=0;

/* أسماء الأسفار العربية */
const BOOK_NAMES={

"01-gen":"التكوين",
"02-Exodus":"الخروج",
"03-Leviticus":"اللاويين",
"04-Numbers":"العدد",
"05-Deut":"التثنية",
"06-Joshua":"يشوع",
"07-Judges":"القضاة",
"08-Ruth":"راعوث",
"09-1Samuel":"صموئيل الأول",
"10-2Samuel":"صموئيل الثاني",
"11-1Kings":"ملوك الأول",
"12-2Kings":"ملوك الثاني",
"13-1Chronicles":"أخبار الأيام الأول",
"14-2Chronicles":"أخبار الأيام الثاني",
"15-Ezra":"عزرا",
"16-Nehemiah":"نحميا",
"17-Esther":"أستير",
"18-Job":"أيوب",
"19-Psalms":"المزامير",
"20-Proverbs":"الأمثال",
"21-Ecclesiastes":"الجامعة",
"22-Song":"نشيد الأنشاد",
"23-Isaiah":"إشعياء",
"24-Jeremiah":"إرميا",
"25-Lamentations":"مراثي إرميا",
"26-Ezekiel":"حزقيال",
"27-Daniel":"دانيال",
"28-Hosea":"هوشع",
"29-Joel":"يوئيل",
"30-Amos":"عاموس",
"31-Obadiah":"عوبديا",
"32-Jonah":"يونان",
"33-Micah":"ميخا",
"34-Nahum":"ناحوم",
"35-Habakkuk":"حبقوق",
"36-Zephaniah":"صفنيا",
"37-Haggai":"حجي",
"38-Zechariah":"زكريا",
"39-Malachi":"ملاخي",

"40-Matthew":"متى",
"41-Mark":"مرقس",
"42-Luke":"لوقا",
"43-John":"يوحنا",
"44-Acts":"أعمال الرسل",
"45-Romans":"رومية",
"46-1-Corinthians":"كورنثوس الأولى",
"47-2-Corinthians":"كورنثوس الثانية",
"48-Galatians":"غلاطية",
"49-Ephesians":"أفسس",
"50-Philippians":"فيلبي",
"51-Colossians":"كولوسي",
"52-1-Thessalonians":"تسالونيكي الأولى",
"53-2-Thessalonians":"تسالونيكي الثانية",
"54-1-Timothy":"تيموثاوس الأولى",
"55-2-Timothy":"تيموثاوس الثانية",
"56-Titus":"تيطس",
"57-Philemon":"فليمون",
"58-Hebrews":"العبرانيين",
"59-James":"يعقوب",
"60-1-peter":"بطرس الأولى",
"61-2pet":"بطرس الثانية",
"61-2-peter":"بطرس الثانية",
"62-1-John":"يوحنا الأولى",
"63-2-John":"يوحنا الثانية",
"64-3-John":"يوحنا الثالثة",
"65-Jude":"يهوذا",
"66-Revelation":"رؤيا يوحنا"

};

/* ترتيب الأسفار الرسمي */
const OLD_ORDER=[
"01-gen","02-Exodus","03-Leviticus","04-Numbers","05-Deut",
"06-Joshua","07-Judges","08-Ruth","09-1Samuel","10-2Samuel",
"11-1Kings","12-2Kings","13-1Chronicles","14-2Chronicles",
"15-Ezra","16-Nehemiah","17-Esther","18-Job","19-Psalms",
"20-Proverbs","21-Ecclesiastes","22-Song","23-Isaiah","24-Jeremiah",
"25-Lamentations","26-Ezekiel","27-Daniel","28-Hosea","29-Joel",
"30-Amos","31-Obadiah","32-Jonah","33-Micah","34-Nahum",
"35-Habakkuk","36-Zephaniah","37-Haggai","38-Zechariah","39-Malachi"
];

const NEW_ORDER=[
"40-Matthew","41-Mark","42-Luke","43-John","44-Acts","45-Romans",
"46-1-Corinthians","47-2-Corinthians","48-Galatians","49-Ephesians",
"50-Philippians","51-Colossians","52-1-Thessalonians","53-2-Thessalonians",
"54-1-Timothy","55-2-Timothy","56-Titus","57-Philemon","58-Hebrews",
"59-James","60-1-peter","61-2pet","62-1-John","63-2-John",
"64-3-John","65-Jude","66-Revelation"
];

const $=id=>document.getElementById(id);

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,function(m){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m];
  });
}

function normalizeRows(data){

  if(!Array.isArray(data)) return [];

  return data.map(v=>({
    book:String(v.book??"").trim(),
    chapter:Number(v.chapter),
    verse:Number(v.verse ?? v.number),
    text:String(v.text??"").trim()
  })).filter(v=>
    v.book &&
    Number.isFinite(v.chapter) &&
    Number.isFinite(v.verse) &&
    v.text
  );
}

async function loadJson(url){

  const response=await fetch(url,{
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error(url+" HTTP "+response.status);
  }

  return await response.json();
}

/* تحميل قاعدة الكتاب المقدس + بطرس الثانية */
async function boot(){

  try{

    const mainData=await loadJson(MAIN_BIBLE);

    const mainRows=normalizeRows(mainData);

    let petRows=[];

    try{
      const petData=await loadJson(SECOND_PETER);
      petRows=normalizeRows(petData);
    }catch(e){
      console.warn("2pet.json غير متاح:",e);
    }

    /*
      إزالة أي نسخة ناقصة من بطرس الثانية،
      ثم إضافة النسخة الكاملة من 2pet.json.
    */
    verses=[
      ...mainRows.filter(v=>
        v.book!=="61-2pet" &&
        v.book!=="61-2-peter"
      ),
      ...petRows.map(v=>({
        ...v,
        book:"61-2pet"
      }))
    ];

    showTestament("old");

  }catch(error){

    console.error(error);

    $("content").innerHTML=`
      <div class="empty">
        تعذر تحميل الكتاب المقدس.
        <br><br>
        تأكد أن الملف
        <strong>bible_database.json</strong>
        موجود في المجلد الرئيسي للمستودع.
      </div>
    `;
  }
}

/* عرض العهد القديم أو الجديد */
function showTestament(testament){

  currentTestament=testament;
  currentBook="";
  currentChapter=0;

  $("oldTab").classList.toggle("active",testament==="old");
  $("newTab").classList.toggle("active",testament==="new");
  $("searchTab").classList.remove("active");

  const order=testament==="old"?OLD_ORDER:NEW_ORDER;

  const available=order.filter(id=>
    verses.some(v=>v.book===id)
  );

  $("content").innerHTML=`
    <h2 class="section-title">
      ${testament==="old"?"العهد القديم":"العهد الجديد"}
    </h2>

    <div class="book-grid">
      ${
        available.map(id=>`
          <button class="book-card"
                  onclick="openBook('${id}')">
            ${escapeHtml(BOOK_NAMES[id]||id)}
          </button>
        `).join("")
      }
    </div>

    ${
      available.length===0
      ? `<div class="empty">لا توجد بيانات لهذا العهد.</div>`
      : ""
    }
  `;
}

/* فتح السفر وعرض الأصحاحات فقط */
function openBook(book){

  currentBook=book;
  currentChapter=0;

  const chapters=[
    ...new Set(
      verses
        .filter(v=>v.book===book)
        .map(v=>v.chapter)
    )
  ].sort((a,b)=>a-b);

  $("content").innerHTML=`

    <button class="back-btn"
            onclick="showTestament('${currentTestament}')">
      ← العودة إلى الأسفار
    </button>

    <h2 class="section-title">
      ${escapeHtml(BOOK_NAMES[book]||book)}
    </h2>

    <div class="chapter-grid">
      ${
        chapters.map(ch=>`
          <button class="chapter-btn"
                  onclick="openChapter('${book}',${ch})">
            ${ch}
          </button>
        `).join("")
      }
    </div>
  `;
}

/* فتح الأصحاح وعرض الآيات */
function openChapter(book,chapter){

  currentBook=book;
  currentChapter=chapter;

  const rows=verses
    .filter(v=>
      v.book===book &&
      v.chapter===chapter
    )
    .sort((a,b)=>a.verse-b.verse);

  $("content").innerHTML=`

    <button class="back-btn"
            onclick="openBook('${book}')">
      ← العودة إلى الأصحاحات
    </button>

    <h2 class="section-title">
      ${escapeHtml(BOOK_NAMES[book]||book)}
      — ${chapter}
    </h2>

    ${
      rows.length
      ? rows.map(v=>`
          <div class="verse"
               onclick="openVerse('${book}',${chapter},${v.verse})">
            <span class="vnum">${v.verse}</span>
            ${escapeHtml(v.text)}
          </div>
        `).join("")
      : `<div class="empty">لا توجد آيات لهذا الأصحاح.</div>`
    }
  `;
}

/* البحث */
function showSearch(){

  $("oldTab").classList.remove("active");
  $("newTab").classList.remove("active");
  $("searchTab").classList.add("active");

  $("content").innerHTML=`

    <h2 class="section-title">البحث في الكتاب المقدس</h2>

    <div class="search-box">
      <input id="searchInput"
             type="search"
             placeholder="اكتب كلمة أو عبارة...">

      <button onclick="runSearch()">
        بحث
      </button>
    </div>

    <div id="searchResults"></div>
  `;

  $("searchInput").addEventListener("keydown",function(e){
    if(e.key==="Enter") runSearch();
  });

  $("searchInput").focus();
}

function runSearch(){

  const input=$("searchInput");

  if(!input)return;

  const q=input.value.trim().toLocaleLowerCase("ar");

  if(!q){
    $("searchResults").innerHTML=
      `<div class="empty">اكتب كلمة أو عبارة للبحث.</div>`;
    return;
  }

  const hits=verses
    .filter(v=>
      v.text.toLocaleLowerCase("ar").includes(q)
    )
    .slice(0,200);

  $("searchResults").innerHTML=hits.length
    ? hits.map(v=>`

      <div class="search-result"
           onclick="openVerse('${v.book}',${v.chapter},${v.verse})">

        <strong>
          ${escapeHtml(BOOK_NAMES[v.book]||v.book)}
          ${v.chapter}:${v.verse}
        </strong>

        <div>
          ${escapeHtml(v.text)}
        </div>

      </div>

    `).join("")
    : `<div class="empty">لا توجد نتائج.</div>`;
}

/* الضغط على الآية */
function openVerse(book,chapter,verse){

  const v=verses.find(x=>
    x.book===book &&
    x.chapter===chapter &&
    x.verse===verse
  );

  if(!v)return;

  /*
    عند الضغط على الآية الآن نعرضها داخل نفس الصفحة.
    لاحقاً سنستبدل هذا الجزء بنافذة الدراسات والمراجع
    التي اتفقنا عليها.
  */
  $("content").innerHTML=`

    <button class="back-btn"
            onclick="openChapter('${book}',${chapter})">
      ← العودة إلى الأصحاح
    </button>

    <h2 class="section-title">
      ${escapeHtml(BOOK_NAMES[book]||book)}
      ${chapter}:${verse}
    </h2>

    <div class="verse" style="cursor:default">
      <span class="vnum">${verse}</span>
      ${escapeHtml(v.text)}
    </div>

  `;
}

boot();
</script>

</body>
</html>
